# Tema 2: generat per scripts/merge_fitxes.py a partir de work/fitxes/tema2_p*.yaml
llista:
  id: tema-2
  etiqueta: Tema 2
  titol: Funcions, límits i continuïtat
  descripcio: Problemes del Tema 2 de la col·lecció de Càlcul Diferencial (FME-UPC).
  tema: 2
  tipus: mixt
  format: text
problemes:
- num: 1
  font: null
  preambul: |
    Determineu el domini d'existència i el recorregut (imatge) de les funcions següents, i digueu si aquests conjunts són oberts o tancats:
  indicacio: null
  exercicis:
  - id: t2-1a
    apartat: a
    tipus: calcul
    enunciat: |
      $f(x,y)=\sqrt{\cos\left(x^2+y^2\right)}$,
    teoria:
    - T2.3
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $\mathrm{Dom}(f)=\{(x,y)\mid \cos(x^2+y^2)\ge 0\}$: el disc tancat $x^2+y^2\le \pi/2$ unió les corones circulars tancades $2k\pi-\pi/2\le x^2+y^2\le 2k\pi+\pi/2$, $k\ge 1$. És tancat i no és obert.
        $\mathrm{Im}(f)=[0,1]$, que és tancat i no és obert a $\mathbb{R}$.
      fuites:
      - \[\s*0\s*,\s*1\s*\]
    passos:
    - id: domini
      titol: Calcular el domini
      objectiu: |
        Determinar el conjunt de punts $(x,y)$ on l'expressió de $f$ té sentit.
      idea: |
        L'arrel quadrada real només està definida per a radicands no negatius. Escriu $s=x^2+y^2\ge 0$ i resol la desigualtat trigonomètrica en la variable $s$; després tradueix-ho a una condició geomètrica sobre $(x,y)$.
      detall: |
        Cal $\cos(x^2+y^2)\ge 0$. Amb $s=x^2+y^2\in[0,+\infty)$: $\cos s\ge 0 \iff s\in[2k\pi-\pi/2,\,2k\pi+\pi/2]$ per a algun $k\in\mathbb{Z}$. Intersecant amb $s\ge 0$: $s\in[0,\pi/2]\cup\bigcup_{k\ge1}[2k\pi-\pi/2,\,2k\pi+\pi/2]$. Geomètricament: el disc tancat de centre l'origen i radi $\sqrt{\pi/2}$ i les corones circulars tancades $\sqrt{2k\pi-\pi/2}\le\sqrt{x^2+y^2}\le\sqrt{2k\pi+\pi/2}$, $k\ge 1$.
      fuites:
      - 2k\\pi\s*-\s*(\\pi\s*/\s*2|\\[dt]?frac\s*\{?\s*\\pi\s*\}?\s*\{?\s*2\s*\}?)
      - coron(a|es)\b
      teoria:
      - T2.3
    - id: domini_topologia
      titol: Topologia del domini
      objectiu: |
        Decidir si el domini és obert, tancat, totes dues coses o cap de les dues.
      idea: |
        Escriu el domini com el conjunt on una funció contínua a tot $\mathbb{R}^2$ és $\ge 0$ i usa el resultat sobre conjunts definits per desigualtats. Per descartar l'altra propietat, busca un punt del domini tal que tota bola centrada en ell surti del domini.
      detall: |
        $g(x,y)=\cos(x^2+y^2)$ és contínua a $\mathbb{R}^2$ (composició d'un polinomi amb el cosinus) i $\mathrm{Dom}(f)=\{g\ge 0\}$, que és tancat pel Corol·lari 18(ii). El domini no és obert: el punt $p=(\sqrt{\pi/2},0)$ hi pertany ($g(p)=\cos(\pi/2)=0$), però, donat $r>0$, prenent $0<\varepsilon<r$ prou petit perquè $(\sqrt{\pi/2}+\varepsilon)^2<3\pi/2$, el punt $(\sqrt{\pi/2}+\varepsilon,0)\in B(p,r)$ té $s=(\sqrt{\pi/2}+\varepsilon)^2\in(\pi/2,3\pi/2)$ i per tant $\cos s<0$: cap bola centrada en $p$ és dins del domini. Així, el domini és tancat però no obert.
      fuites:
      - domini\s+és\s+(un\s+conjunt\s+)?tancat
      - tancat\s+(però|i)\s+no\s+(és\s+)?obert
      - \(\s*\\sqrt\s*\{?\s*(\\pi\s*/\s*2|\\[dt]?frac\s*\{?\s*\\pi\s*\}?\s*\{?\s*2\s*\}?)\s*\}?\s*,\s*0\s*\)
      teoria:
      - T2.18
      - T2.19
      - T1.11
    - id: imatge
      titol: Calcular la imatge
      objectiu: |
        Determinar el conjunt de valors que pren $f$.
      idea: |
        Fita els valors possibles del cosinus sobre el domini i, després, comprova que tots els valors candidats s'assoleixen realment movent-te sobre una semirecta des de l'origen.
      detall: |
        Sobre el domini, $0\le\cos(x^2+y^2)\le 1$, i per tant $0\le f\le 1$. Recíprocament, sobre el segment $(t,0)$, $t\in[0,\sqrt{\pi/2}]$ (contingut en el domini), la funció $t\mapsto\cos(t^2)$ és contínua i passa de $1$ a $0$, de manera que (valor intermedi en una variable) pren tots els valors de $[0,1]$, i també els pren $f=\sqrt{\cos(t^2)}$. Per tant $\mathrm{Im}(f)=[0,1]$.
      fuites:
      - \[\s*0\s*,\s*1\s*\]
      teoria:
      - T2.3
    - id: imatge_topologia
      titol: Topologia de la imatge
      objectiu: |
        Decidir si la imatge, com a subconjunt de $\mathbb{R}$, és oberta, tancada, totes dues coses o cap.
      idea: |
        Reconeix la imatge com una bola tancada de $\mathbb{R}$, i mira si els seus extrems admeten una bola oberta continguda en el conjunt.
      detall: |
        $[0,1]=\overline{B}(1/2,1/2)$ és una bola tancada, per tant tancada. No és oberta: tota bola $(1-r,1+r)$ centrada en $1$ conté punts més grans que $1$.
      fuites: []
      teoria:
      - T1.13
      - T1.11
    errors_comuns:
    - id: oblidar_periodicitat
      descripcio: |
        Només considera $x^2+y^2\le\pi/2$ (el disc) i oblida la resta d'intervals on el cosinus torna a ser no negatiu.
      pregunta: |
        El cosinus és no negatiu només a prop de $0$, o hi ha més valors de $s>0$ on torna a ser $\ge 0$?
    - id: tancat_implica_no_obert
      descripcio: |
        Dedueix "no és obert" automàticament de "és tancat", com si fossin propietats contràries.
      pregunta: |
        Hi ha subconjunts de $\mathbb{R}^2$ que siguin oberts i tancats alhora? Què has de comprovar, doncs, per descartar que el domini sigui obert?
    - id: imatge_cos_sencer
      descripcio: |
        Diu que la imatge és $[-1,1]$ o $[0,+\infty)$ sense tenir en compte l'arrel ni el rang del cosinus.
      pregunta: |
        Quins valors pot prendre el radicand en els punts del domini, i què fa l'arrel quadrada amb ells?
    nota_professor: |
      El tancament també es pot veure com $\mathrm{Dom}(f)=g^{-1}([0,+\infty))$, antiimatge d'un tancat per una funció $g$ contínua a $\mathbb{R}^2$ (Teorema 17(d)). Cal remarcar que les corones són infinites i cada cop més primes (amplada radial $\to 0$).
  - id: t2-1b
    apartat: b
    tipus: calcul
    enunciat: |
      $f(x,y)=\log\left(y-x\right)$,
    teoria:
    - T2.3
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $\mathrm{Dom}(f)=\{(x,y)\mid y>x\}$, el semiplà obert per sobre de la recta $y=x$: és obert i no és tancat.
        $\mathrm{Im}(f)=\mathbb{R}$, que és obert i tancat a $\mathbb{R}$.
      fuites:
      - imatge\s+(és|=)\s+(tot\s+)?\$?\s*\\mathbb\s*(\{\s*R\s*\}|R)(?!\s*\^)
      - \\(mathrm|text|operatorname)\s*\{\s*Im\s*\}\s*\(\s*f\s*\)\s*=\s*\\mathbb\s*(\{\s*R\s*\}|R)(?!\s*\^)
    passos:
    - id: domini
      titol: Calcular el domini
      objectiu: |
        Determinar el conjunt de punts $(x,y)$ on l'expressió de $f$ té sentit.
      idea: |
        El logaritme real només està definit per a arguments estrictament positius.
      detall: |
        Cal $y-x>0$, és a dir, $\mathrm{Dom}(f)=\{(x,y)\mid y>x\}$: el semiplà obert situat per sobre de la recta $y=x$.
      fuites:
      - y\s*-\s*x\s*>\s*0
      - y\s*>\s*x
      teoria:
      - T2.3
    - id: domini_topologia
      titol: Topologia del domini
      objectiu: |
        Decidir si el domini és obert, tancat, totes dues coses o cap de les dues.
      idea: |
        Expressa el domini com un conjunt definit per una desigualtat estricta entre funcions contínues a $\mathbb{R}^2$. Per a l'altra propietat, mira què passa amb els punts de la recta que el limita.
      detall: |
        Amb $F(x,y)=y$, $G(x,y)=x$ contínues, $\mathrm{Dom}(f)=\{F>G\}$, que és obert pel Corol·lari 18(i). No és tancat: el complementari $\{y\le x\}$ no és obert, perquè conté $(0,0)$ i tota bola $B((0,0),r)$ conté el punt $(0,r/2)$, que és del domini. Per tant el domini és obert però no tancat.
      fuites:
      - obert\s+(però|i)\s+no\s+(és\s+)?tancat
      - \(\s*0\s*,\s*r\s*/\s*2\s*\)
      teoria:
      - T2.18
      - T1.11
    - id: imatge
      titol: Calcular la imatge
      objectiu: |
        Determinar el conjunt de valors que pren $f$.
      idea: |
        Mira quins valors pot prendre l'argument $y-x$ sobre el domini i quina és la imatge del logaritme sobre aquest conjunt; per comprovar-ho, busca explícitament un punt on $f$ valgui un valor $c$ donat.
      detall: |
        L'argument $y-x$ recorre tot $(0,+\infty)$ i $\log((0,+\infty))=\mathbb{R}$. Explícitament, per a $c\in\mathbb{R}$, el punt $(0,e^c)$ és del domini i $f(0,e^c)=\log e^c=c$. Per tant la imatge és tot $\mathbb{R}$.
      fuites:
      - \(\s*0\s*,\s*e\^\{?c\}?\s*\)
      teoria:
      - T2.3
    - id: imatge_topologia
      titol: Topologia de la imatge
      objectiu: |
        Decidir si la imatge, com a subconjunt de $\mathbb{R}$, és oberta, tancada, totes dues coses o cap.
      idea: |
        Recorda què diuen les propietats dels oberts i dels tancats sobre l'espai sencer.
      detall: |
        $\mathbb{R}$ és alhora obert i tancat dins de $\mathbb{R}$ (Proposicions 12(iv) i 13(iv) del Tema 1).
      fuites: []
      teoria:
      - T1.12
      - T1.13
    errors_comuns:
    - id: desigualtat_no_estricta
      descripcio: |
        Posa $y-x\ge 0$ (inclou la recta $y=x$ al domini), oblidant que $\log 0$ no està definit.
      pregunta: |
        Què val el logaritme quan l'argument és exactament $0$?
    - id: confusio_imatge
      descripcio: |
        Diu que la imatge és $(0,+\infty)$, confonent el rang de l'argument amb el rang del logaritme.
      pregunta: |
        El conjunt $(0,+\infty)$ és el dels valors de $y-x$ o el dels valors de $\log(y-x)$? Quin valor de $f$ obtens si $y-x$ és molt petit?
    - id: R_no_tancat
      descripcio: |
        Afirma que $\mathbb{R}$ no és tancat perquè "no té extrems" o perquè és obert.
      pregunta: |
        Per definició, quan és tancat un conjunt? Quin és el complementari de $\mathbb{R}$ dins de $\mathbb{R}$?
    nota_professor: |
      El no-tancament també es pot veure amb successions: $(0,1/n)\in\mathrm{Dom}(f)$ convergeix a $(0,0)\notin\mathrm{Dom}(f)$.
  - id: t2-1c
    apartat: c
    tipus: calcul
    enunciat: |
      $f(x,y)=\arcsin\left(x/y\right)$,
    teoria:
    - T2.3
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $\mathrm{Dom}(f)=\{(x,y)\mid y\neq 0,\ |x|\le|y|\}=\{|x|\le|y|\}\setminus\{(0,0)\}$ (la regió entre les diagonals que conté l'eix $y$, sense l'origen): no és ni obert ni tancat.
        $\mathrm{Im}(f)=[-\pi/2,\pi/2]$, que és tancat i no és obert.
      fuites:
      - \[\s*-\s*(\\pi\s*/\s*2|\\[dt]?frac\s*\{?\s*\\pi\s*\}?\s*\{?\s*2\s*\}?)\s*,\s*(\\pi\s*/\s*2|\\[dt]?frac\s*\{?\s*\\pi\s*\}?\s*\{?\s*2\s*\}?)\s*\]
    passos:
    - id: domini
      titol: Calcular el domini
      objectiu: |
        Determinar el conjunt de punts $(x,y)$ on l'expressió de $f$ té sentit.
      idea: |
        Hi ha dues condicions: que el quocient existeixi i que estigui dins del domini de l'arcsinus. Després, reescriu la segona sense quocients.
      detall: |
        Cal $y\neq0$ i $-1\le x/y\le 1$, és a dir $|x/y|\le1$, que (multiplicant per $|y|>0$) equival a $|x|\le|y|$. Per tant $\mathrm{Dom}(f)=\{(x,y)\mid |x|\le|y|\}\setminus\{(0,0)\}$: la regió tancada entre les rectes $y=x$ i $y=-x$ que conté l'eix $y$, sense l'origen.
      fuites:
      - \|x\|\s*(\\le|\\leq|≤)\s*\|y\|
      - \|y\|\s*(\\ge|\\geq|≥)\s*\|x\|
      teoria:
      - T2.3
    - id: domini_topologia
      titol: Topologia del domini
      objectiu: |
        Decidir si el domini és obert, tancat, totes dues coses o cap de les dues.
      idea: |
        Mira els punts de les dues rectes que limiten la regió (per a l'obertura) i el punt que s'ha hagut d'excloure (per al tancament).
      detall: |
        No és obert: $(1,1)\in\mathrm{Dom}(f)$, però tota bola centrada en $(1,1)$ conté punts $(1+\varepsilon,1)$ amb $|x|>|y|$. No és tancat: els punts $(0,1/n)$ són del domini i convergeixen a $(0,0)$, que no hi és; per tant $(0,0)$ és adherent al domini sense pertànyer-hi, i un tancat conté tots els seus punts adherents. El domini no és ni obert ni tancat.
      fuites:
      - ni\s+obert\s+ni\s+tancat
      - \(\s*0\s*,\s*1\s*/\s*n\s*\)
      teoria:
      - T1.11
      - T1.16
      - T1.19
    - id: imatge
      titol: Calcular la imatge
      objectiu: |
        Determinar el conjunt de valors que pren $f$.
      idea: |
        Determina quins valors pren el quocient $x/y$ sobre el domini i aplica-hi l'arcsinus, que és bijectiu des del seu domini a la seva imatge.
      detall: |
        Sobre el domini $x/y$ pren tots els valors de $[-1,1]$ (per exemple als punts $(t,1)$, $t\in[-1,1]$), i $\arcsin([-1,1])=[-\pi/2,\pi/2]$. Per tant $\mathrm{Im}(f)=[-\pi/2,\pi/2]$.
      fuites:
      - \[\s*-\s*(\\pi\s*/\s*2|\\[dt]?frac\s*\{?\s*\\pi\s*\}?\s*\{?\s*2\s*\}?)\s*,\s*(\\pi\s*/\s*2|\\[dt]?frac\s*\{?\s*\\pi\s*\}?\s*\{?\s*2\s*\}?)\s*\]
      - \(\s*t\s*,\s*1\s*\)
      teoria:
      - T2.3
    - id: imatge_topologia
      titol: Topologia de la imatge
      objectiu: |
        Decidir si la imatge, com a subconjunt de $\mathbb{R}$, és oberta, tancada, totes dues coses o cap.
      idea: |
        Reconeix la imatge com una bola tancada de $\mathbb{R}$ i mira si els extrems admeten una bola oberta dins del conjunt.
      detall: |
        És la bola tancada $\overline{B}(0,\pi/2)$, per tant tancada. No és oberta: tota bola centrada en $\pi/2$ conté punts més grans que $\pi/2$.
      fuites: []
      teoria:
      - T1.13
      - T1.11
    errors_comuns:
    - id: multiplicar_sense_signe
      descripcio: |
        Passa de $-1\le x/y\le 1$ a $-y\le x\le y$ multiplicant per $y$ sense tenir en compte que $y$ pot ser negatiu.
      pregunta: |
        Què passa amb el sentit de les desigualtats quan multipliques per $y$ i $y<0$?
    - id: oblidar_origen
      descripcio: |
        Inclou l'origen al domini (o conclou que el domini és tancat) oblidant que cal $y\neq0$.
      pregunta: |
        Té sentit el quocient $x/y$ en el punt $(0,0)$? Hi ha punts del domini tan a prop com vulguis d'aquest punt?
    - id: obert_si_no_tancat
      descripcio: |
        Conclou que el domini és obert perquè no és tancat (o a l'inrevés).
      pregunta: |
        "No tancat" vol dir "obert"? Pots trobar un punt del domini on cap bola hi quedi continguda?
  - id: t2-1d
    apartat: d
    tipus: calcul
    enunciat: |
      $f(x,y)=\sqrt{\cos\left(2\pi x\right)-1}$,
    teoria:
    - T2.3
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $\mathrm{Dom}(f)=\mathbb{Z}\times\mathbb{R}$ (les rectes verticals $x=k$, $k\in\mathbb{Z}$): és tancat i no és obert (té interior buit).
        $\mathrm{Im}(f)=\{0\}$, que és tancat i no és obert.
      fuites:
      - \\\{\s*0\s*\\\}
      - \\mathbb\{?Z\}?\s*\\times\s*\\mathbb\{?R
    passos:
    - id: domini
      titol: Calcular el domini
      objectiu: |
        Determinar el conjunt de punts $(x,y)$ on l'expressió de $f$ té sentit.
      idea: |
        L'arrel exigeix radicand no negatiu; recorda quin és el valor màxim del cosinus i quin signe té, per tant, el radicand.
      detall: |
        Cal $\cos(2\pi x)-1\ge0$; com que $\cos\le1$, això obliga $\cos(2\pi x)=1$, és a dir $2\pi x\in2\pi\mathbb{Z}$, $x\in\mathbb{Z}$, sense cap condició sobre $y$. Per tant $\mathrm{Dom}(f)=\mathbb{Z}\times\mathbb{R}$: la unió de les rectes verticals $x=k$, $k\in\mathbb{Z}$.
      fuites:
      - \\mathbb\{?Z\}?\s*\\times\s*\\mathbb\{?R
      - x\s*\\in\s*\\mathbb\{?Z
      - rectes\s+verticals
      teoria:
      - T2.3
    - id: domini_topologia
      titol: Topologia del domini
      objectiu: |
        Decidir si el domini és obert, tancat, totes dues coses o cap de les dues.
      idea: |
        Escriu el domini com el conjunt on una funció contínua és $\ge$ una constant. Per a l'altra propietat, pensa si algun punt del domini té una bola al voltant continguda en el domini.
      detall: |
        $g(x,y)=\cos(2\pi x)$ és contínua a $\mathbb{R}^2$ i $\mathrm{Dom}(f)=\{g\ge1\}$, que és tancat pel Corol·lari 18(ii). No és obert: $(0,0)$ hi pertany, però tota bola $B((0,0),r)$ conté $(\varepsilon,0)$ amb $0<\varepsilon<\min(r,1)$, que no hi és ($\varepsilon\notin\mathbb{Z}$). De fet, l'interior és buit. El domini és tancat però no obert.
      fuites:
      - domini\s+és\s+(un\s+conjunt\s+)?tancat
      - tancat\s+(però|i)\s+no\s+(és\s+)?obert
      - \\\{\s*g\s*(\\ge|\\geq|≥)\s*1\s*\\\}
      teoria:
      - T2.18
      - T1.11
    - id: imatge
      titol: Calcular la imatge
      objectiu: |
        Determinar el conjunt de valors que pren $f$.
      idea: |
        Avalua el radicand en els punts del domini que acabes de trobar.
      detall: |
        Als punts del domini, $\cos(2\pi x)-1=0$, i per tant $f\equiv0$: $\mathrm{Im}(f)=\{0\}$.
      fuites:
      - f\s*\\equiv\s*0
      - \\\{\s*0\s*\\\}
      teoria:
      - T2.3
    - id: imatge_topologia
      titol: Topologia de la imatge
      objectiu: |
        Decidir si la imatge, com a subconjunt de $\mathbb{R}$, és oberta, tancada, totes dues coses o cap.
      idea: |
        Estudia el complementari del conjunt dins de $\mathbb{R}$, i mira si l'únic punt del conjunt té alguna bola continguda en ell.
      detall: |
        El complementari és $(-\infty,0)\cup(0,+\infty)$, unió d'oberts, per tant obert: la imatge és tancada. No és oberta: tota bola $(-r,r)$ conté punts diferents de $0$.
      fuites: []
      teoria:
      - T1.x4
      - T1.12
      - T1.11
    errors_comuns:
    - id: domini_buit
      descripcio: |
        Conclou que el domini és buit perquè "$\cos(2\pi x)-1$ és sempre negatiu", oblidant els punts on val exactament $0$.
      pregunta: |
        El radicand és estrictament negatiu a tot arreu, o hi ha valors de $x$ on el cosinus arriba al seu màxim?
    - id: oblidar_y
      descripcio: |
        Dona el domini com un subconjunt de $\mathbb{R}$ (els enters) en lloc d'un subconjunt del pla.
      pregunta: |
        La funció és de dues variables: quina condició imposa l'expressió sobre $y$?
    - id: discret_obert
      descripcio: |
        Pensa que el domini és obert perquè "està format per rectes separades" o el confon amb un conjunt discret.
      pregunta: |
        Si prens un punt d'una d'aquestes rectes, hi ha alguna bola del pla centrada en ell que quedi dins del domini?
  - id: t2-1e
    apartat: e
    tipus: calcul
    enunciat: |
      $f(x,y)=1-|x|-|y|$,
    teoria:
    - T2.3
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $\mathrm{Dom}(f)=\mathbb{R}^2$, que és obert i tancat.
        $\mathrm{Im}(f)=(-\infty,1]$, que és tancat i no és obert.
      fuites:
      - '[(\]]\s*-\s*\\infty\s*,\s*1\s*\]'
    passos:
    - id: domini
      titol: Calcular el domini
      objectiu: |
        Determinar el conjunt de punts $(x,y)$ on l'expressió de $f$ té sentit.
      idea: |
        Mira si alguna de les operacions que apareixen a l'expressió té restriccions.
      detall: |
        El valor absolut i les sumes estan definits per a tot nombre real: $\mathrm{Dom}(f)=\mathbb{R}^2$.
      fuites: []
      teoria:
      - T2.3
