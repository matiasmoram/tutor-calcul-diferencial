- num: 12
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t6-12
    apartat: null
    tipus: teoric
    enunciat: |
      Considerem la funció $f(x,y,z)=x^4+y^2/4+z^2-x^2y-2z+1$ i el conjunt $M=\{(x,y,z)\in\mathbb{R}^3\mid2x^2+y^2+z^3-5xz-2=0\}$. Proveu que en el punt $p=(1,2,1)$ s'assoleix un mínim local de la restricció de $f$ a $M$. Es tracta d'un mínim absolut de la restricció de $f$ a $M$?
    teoria:
    - T6.12
    - T6.2
    teoria_reservada: []
    resultat:
      valor: |
        $p$ és un mínim local estricte de $f|_M$: $\nabla f(p)=\mathbf{0}$ (multiplicador $\lambda=0$) i la forma hessiana $q_{Hf(p)}$, que a $\mathbb{R}^3$ és només semidefinida positiva, és definida positiva sobre $T_M(p)=\{v_1-4v_2+2v_3=0\}$.
        Sí, és un mínim absolut: $f=\left(x^2-\frac y2\right)^2+(z-1)^2\ge0=f(p)$ a tot $\mathbb{R}^3$, i en particular a $M$.
      fuites:
      - s[íi]\s*,?\s*(és|es\s+tracta\s+d.un)\s+(un\s+)?m[íi]nim\s+absolut
      - \(\s*x\^\{?2\}?\s*-\s*(\\[dt]?frac\s*\{?\s*y|y\s*/\s*2)
      - f\s*(\\geq?|≥)\s*0
      - \(\s*z\s*-\s*1\s*\)\^\{?2
    passos:
    - id: varietat
      titol: $M$ és varietat prop de $p$
      objectiu: |
        Comprovar que $p\in M$ i que $M$ és una varietat diferenciable en un entorn de $p$.
      idea: |
        Calcular $\Phi(p)$ i el gradient de l'equació definidora $\Phi$ en $p$; si no s'anul·la, per continuïtat té rang màxim en un entorn.
      detall: |
        $\Phi(p)=2+4+1-5-2=0$. $\nabla\Phi=(4x-5z,\ 2y,\ 3z^2-5x)$, $\nabla\Phi(p)=(-1,4,-2)\neq0$. Per continuïtat $\nabla\Phi\neq0$ en un obert $G\ni p$, i $M\cap G$ és una 2-varietat $\mathcal{C}^\infty$.
      fuites:
      - \(\s*-\s*1\s*,\s*4\s*,\s*-\s*2\s*\)
      teoria:
      - T6.2
    - id: lagrange
      titol: Punt crític de la funció de Lagrange
      objectiu: |
        Comprovar que $p$ satisfà la condició necessària de Lagrange i trobar el multiplicador.
      idea: |
        Calcular $\nabla f(p)$ i comparar-lo amb $\nabla\Phi(p)$.
      detall: |
        $\nabla f=(4x^3-2xy,\ \frac y2-x^2,\ 2z-2)$, $\nabla f(p)=(0,0,0)=0\cdot\nabla\Phi(p)$. Per tant $(p,\lambda)$ amb $\lambda=0$ és punt crític de $L=f-\lambda\Phi$, i $F=L(\cdot,0)=f$.
      fuites:
      - \\lambda\s*=\s*0
      - \\nabla\s*f\s*\(\s*p\s*\)\s*=\s*\(\s*0\s*,\s*0
      teoria:
      - T6.16
      - T6.17
    - id: hessiana
      titol: Hessiana de $F$
      objectiu: |
        Calcular la matriu hessiana de la funció $F$ del criteri de segon ordre en $p$ i veure què diu el criteri lliure.
      idea: |
        Amb el multiplicador trobat, $F$ coincideix amb $f$. Calcular les derivades segones i mirar el signe de la forma a tot $\mathbb{R}^3$.
      detall: |
        $HF(p)=Hf(p)=\begin{pmatrix}8&-2&0\\-2&\frac12&0\\0&0&2\end{pmatrix}$. El menor $2\times2$ té determinant $4-4=0$: la forma és semidefinida positiva (s'anul·la en la direcció $(1,4,0)$), així que el criteri d'extrems lliures no decideix.
      fuites:
      - pmatrix\}\s*8\s*&\s*-\s*2
      - \(\s*1\s*,\s*4\s*,\s*0\s*\)
      teoria:
      - T5.32
      - T5.33
    - id: tangent
      titol: Restringir a l'espai tangent
      objectiu: |
        Estudiar el signe de la forma quadràtica hessiana sobre $T_M(p)$ i concloure el caràcter local de $p$.
      idea: |
        L'espai tangent és el nucli de $D\Phi(p)$. Escriure la forma com a suma de quadrats i veure si pot anul·lar-se en un vector tangent no nul.
      detall: |
        $T_M(p)=\ker D\Phi(p)=\{v\mid -v_1+4v_2-2v_3=0\}$. $q(v)=8v_1^2-4v_1v_2+\frac12v_2^2+2v_3^2=\frac12(4v_1-v_2)^2+2v_3^2\ge0$, i $q(v)=0$ només si $v_3=0$, $v_2=4v_1$; llavors la condició tangent dona $-v_1+16v_1=0$, $v=0$. Per tant $q$ és definida positiva sobre $T_M(p)$ i, pel teorema de condicions suficients, $p$ és un mínim local estricte de $f|_M$.
      fuites:
      - \(\s*4\s*v_\{?1\}?\s*-\s*v_\{?2\}?\s*\)\^\{?2\}?
      - definida\s+positiva\s+sobre
      teoria:
      - T6.10
      - T6.19
    - id: absolut
      titol: És mínim absolut?
      objectiu: |
        Decidir si $p$ és un mínim absolut de $f|_M$.
      idea: |
        Calcular $f(p)$ i intentar reescriure $f$ completant quadrats (fixeu-vos en els termes $x^4$, $-x^2y$, $\frac{y^2}{4}$).
      detall: |
        $f(p)=1+1+1-2-2+1=0$ i $f=\left(x^2-\frac y2\right)^2+(z-1)^2\ge0$ a tot $\mathbb{R}^3$. Per tant $f(q)\ge f(p)$ per a tot $q\in M$: sí, és un mínim absolut de $f|_M$.
      fuites:
      - \(\s*x\^\{?2\}?\s*-\s*(\\[dt]?frac\s*\{?\s*y|y\s*/\s*2)
      - f\s*(\\geq?|≥)\s*0
      - \(\s*z\s*-\s*1\s*\)\^\{?2
      teoria: []
    errors_comuns:
    - id: criteri_lliure
      descripcio: |
        Usa la hessiana a tot $\mathbb{R}^3$, veu que és semidefinida i conclou que no es pot decidir (o que no és mínim).
      pregunta: |
        En extrems condicionats, en quin conjunt de vectors cal estudiar el signe de la forma hessiana?
    - id: tangent_malament
      descripcio: |
        Pren com a espai tangent el generat per $\nabla\Phi(p)$ en lloc del seu ortogonal.
      pregunta: |
        El gradient de $\Phi$ és tangent o normal a $M$? Quina dimensió ha de tenir $T_M(p)$?
    - id: oblida_varietat
      descripcio: |
        No comprova que $p\in M$ ni que $\nabla\Phi(p)\neq0$, condicions necessàries per aplicar els teoremes.
      pregunta: |
        Quines hipòtesis sobre $\Phi$ demanen els teoremes de Lagrange i de condicions suficients, i es compleixen en $p$?
    - id: local_implica_absolut
      descripcio: |
        Afirma que és absolut perquè és l'únic punt crític trobat, o que no ho és perquè $M$ no és compacte, sense cap argument.
      pregunta: |
        Saps calcular el valor de $f$ en $p$? Hi ha alguna manera de comparar-lo amb el valor de $f$ en qualsevol altre punt?
    nota_professor: |
      Observació: $p$ és un punt crític lliure de $f$, i el criteri lliure falla perquè $f$ té mínim (no estricte) a tota la corba $\{y=2x^2,\ z=1\}$. Aquesta corba talla $M$ transversalment a $p$, per això la restricció té mínim estricte. L'absolut es pot veure també sense haver fet la part local.
