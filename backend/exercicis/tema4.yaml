- num: 13
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t4-13a
    apartat: a
    tipus: teoric
    enunciat: |
      Sigui $I\subseteq\mathbb{R}$ un interval obert. Demostreu que tota funció $g:I\to\mathbb{R}$ de classe $\mathcal{C}^1$ tal que $g'(x)\neq 0$ per tot $x\in I$ té inversa global de classe $\mathcal{C}^1$ en $g(I)$.
    teoria:
    - T3.20
    teoria_reservada:
    - T4.1
    resultat:
      valor: |
        $g'$ és contínua i no s'anul·la a l'interval $I$, per tant té signe constant; pel teorema del valor mitjà $g$ és estrictament monòtona, per tant injectiva, i $g:I\to g(I)$ és bijectiva, amb $g(I)$ un interval obert. En cada $y_0=g(x_0)$ la inversa local (teorema de la funció inversa) coincideix amb $g^{-1}$, que per tant és derivable amb $(g^{-1})'(y)=\frac{1}{g'(g^{-1}(y))}$, contínua: $g^{-1}\in\mathcal{C}^1(g(I))$.
      fuites: []
    passos:
    - id: signe_constant
      titol: Signe constant de la derivada
      objectiu: |
        Veure que $g'$ no canvia de signe a $I$.
      idea: |
        $g'$ és contínua; useu que la imatge contínua d'un connex és connexa (o el teorema de Bolzano).
      detall: |
        $I$ és un interval, per tant connex, i $g'$ és contínua, així que $g'(I)$ és un connex de $\mathbb{R}$ (un interval) que no conté el $0$. Per tant $g'(I)\subseteq(0,\infty)$ o $g'(I)\subseteq(-\infty,0)$.
      fuites: []
      teoria:
      - T2.21
      - T1.35
    - id: injectivitat
      titol: Monotonia estricta i injectivitat
      objectiu: |
        Provar que $g$ és injectiva a $I$.
      idea: |
        Compareu $g(x_1)$ i $g(x_2)$ amb el teorema del valor mitjà.
      detall: |
        Per $x_1<x_2$ de $I$, $[x_1,x_2]\subseteq I$ i existeix $\xi\in[x_1,x_2]$ amb $g(x_2)-g(x_1)=g'(\xi)(x_2-x_1)$, que té el signe (constant, no nul) de $g'$. Per tant $g$ és estrictament monòtona i injectiva, i $g:I\to g(I)$ és bijectiva.
      fuites: []
      teoria:
      - T3.26
    - id: imatge_oberta
      titol: La imatge és un interval obert
      objectiu: |
        Descriure el conjunt $g(I)$ on ha d'estar definida la inversa.
      idea: |
        Connexió per veure que és un interval; per veure que és obert, useu el teorema de l'aplicació oberta o la monotonia estricta.
      detall: |
        $g(I)$ és connex (imatge contínua de connex), per tant un interval. És obert pel teorema de l'aplicació oberta ($g\in\mathcal{C}^1$, $g'\neq 0$ a tot $I$); alternativament, per monotonia estricta $g$ no assoleix ni màxim ni mínim a l'interval obert $I$.
      fuites: []
      teoria:
      - T2.21
      - T4.8
    - id: inversa_c1
      titol: La inversa és de classe C^1
      objectiu: |
        Provar que $g^{-1}:g(I)\to I$ és de classe $\mathcal{C}^1$.
      idea: |
        Localment, el teorema de la funció inversa dona una inversa diferenciable; relacioneu-la amb la inversa global. Després estudieu la continuïtat de la derivada que s'obté.
      detall: |
        Sigui $y_0=g(x_0)\in g(I)$. Com que $g'(x_0)\neq 0$, el teorema de la funció inversa (en una variable) dona entorns $U\ni x_0$, $V\ni y_0$ amb $g|_U:U\to V$ bijectiva i inversa $h$ de classe $\mathcal{C}^1$, amb $h'(y)=\frac{1}{g'(h(y))}$. Per injectivitat global, $h=g^{-1}|_V$. Per tant $g^{-1}$ és derivable a tot $g(I)$ amb $(g^{-1})'(y)=\frac{1}{g'(g^{-1}(y))}$, que és contínua (composició i quocient de contínues amb denominador no nul). Així $g^{-1}\in\mathcal{C}^1(g(I))$.
      fuites:
      - \\frac\s*\{\s*1\s*\}\s*\{\s*g'\s*\(\s*g\s*\^
      teoria:
      - T4.2
      - T4.5
    errors_comuns:
    - id: local_per_global
      descripcio: |
        Aplica el teorema de la funció inversa i conclou directament que hi ha inversa global, sense provar la injectivitat a tot $I$.
      pregunta: |
        El teorema de la funció inversa et dona injectivitat a tot $I$ o només a prop de cada punt? Què et falta?
    - id: sense_continuitat
      descripcio: |
        Usa que $g'$ té signe constant sense justificar-ho (o oblida que cal la continuïtat de $g'$ i que $I$ sigui un interval).
      pregunta: |
        Si $I$ fos la unió de dos intervals disjunts, podria $g'$ ser positiva en un i negativa en l'altre? Què fa servir aquest argument de $I$ i de $g'$?
    - id: derivabilitat_inversa
      descripcio: |
        Dedueix la fórmula de $(g^{-1})'$ derivant $g(g^{-1}(y))=y$ amb la regla de la cadena, suposant ja que $g^{-1}$ és derivable.
      pregunta: |
        Per aplicar la regla de la cadena a $g\circ g^{-1}$, què has de saber ja sobre $g^{-1}$?
    nota_professor: |
      És exactament la Proposició 1 del Tema 4 (inversió global en una variable), que les notes enuncien sense demostració; per això és reservada.
  - id: t4-13b
    apartat: b
    tipus: teoric
    enunciat: |
      Demostreu que $F(x,y)=(e^x\cos y,e^x\sin y)$ té inversa local de classe $\mathcal{C}^1$ en tot punt, però que no té inversa global.
    teoria:
    - T3.20
    teoria_reservada:
    - T4.6
    resultat:
      valor: |
        $F$ és $\mathcal{C}^\infty$ i $\det JF(x,y)=e^{2x}\neq 0$ a tot $\mathbb{R}^2$; pel teorema de la funció inversa té inversa local $\mathcal{C}^\infty$ (en particular $\mathcal{C}^1$) en tot punt. No té inversa global perquè no és injectiva: $F(x,y+2\pi)=F(x,y)$.
      fuites: []
    passos:
    - id: jacobiana
      titol: Jacobiana
      objectiu: |
        Calcular el determinant de la jacobiana de $F$ i estudiar si s'anul·la.
      idea: |
        Calculeu les derivades parcials de cada component i el determinant; useu $\cos^2+\sin^2=1$.
      detall: |
        $JF(x,y)=\begin{pmatrix}e^x\cos y&-e^x\sin y\\ e^x\sin y&e^x\cos y\end{pmatrix}$, $\det JF(x,y)=e^{2x}(\cos^2y+\sin^2y)=e^{2x}>0$.
      fuites:
      - e\s*\^\s*\{\s*2\s*x\s*\}
      teoria:
      - T3.31
    - id: inversa_local
      titol: Inversa local
      objectiu: |
        Deduir que $F$ té inversa local de classe $\mathcal{C}^1$ en tot punt.
      idea: |
        Aplicar el teorema de la funció inversa en cada punt.
      detall: |
        $F$ és $\mathcal{C}^\infty$ (producte i composició de $\mathcal{C}^\infty$) i $\det JF\neq 0$ a tot arreu; pel teorema de la funció inversa, per a cada $p\in\mathbb{R}^2$ hi ha un entorn $U$ de $p$ amb $F|_U$ injectiva, $F(U)$ obert i inversa $\mathcal{C}^\infty$, en particular $\mathcal{C}^1$.
      fuites: []
      teoria:
      - T4.5
    - id: no_global
      titol: No hi ha inversa global
      objectiu: |
        Provar que $F$ no té inversa global.
      idea: |
        Una inversa global requereix injectivitat; mireu la dependència de $F$ respecte de $y$.
      detall: |
        Per periodicitat del sinus i el cosinus, $F(x,y+2\pi)=F(x,y)$ per a tot $(x,y)$; per exemple $F(0,0)=F(0,2\pi)=(1,0)$. $F$ no és injectiva i per tant no té inversa global.
      fuites:
      - y\s*\+\s*2\s*\\pi
      - \(\s*0\s*,\s*2\s*\\pi\s*\)
      teoria: []
    errors_comuns:
    - id: jacobiana_implica_global
      descripcio: |
        Creu que, com en una variable, $\det JF\neq 0$ a tot arreu implica inversa global.
      pregunta: |
        En dimensió 1 la inversió global usa que el domini és un interval i que $g'$ té signe constant. Hi ha cap resultat anàleg a $\mathbb{R}^2$? Què passa si compares $F$ en punts amb la mateixa $x$?
    - id: confon_exhaustivitat
      descripcio: |
        Argumenta la no existència d'inversa global només amb que $F$ no és exhaustiva (l'origen no és a la imatge), cosa que no impedeix tenir inversa sobre la imatge.
      pregunta: |
        Si $F$ fos injectiva, podries definir una inversa a $F(\mathbb{R}^2)$? Quin és realment l'obstacle?
    nota_professor: |
      És el primer exemple de T4.6 (la funció exponencial complexa $e^z$); per això és reservat.
  - id: t4-13c
    apartat: c
    tipus: teoric
    enunciat: |
      Determineu un obert maximal on $F$ tingui inversa global.
    teoria:
    - T4.9
    teoria_reservada:
    - T4.6
    resultat:
      valor: |
        Per exemple $U_\alpha=\mathbb{R}\times(\alpha,\alpha+2\pi)$ per a qualsevol $\alpha\in\mathbb{R}$ (en particular $\mathbb{R}\times(0,2\pi)$): $F:U_\alpha\to\mathbb{R}^2\setminus\{(t\cos\alpha,t\sin\alpha)\mid t\geq 0\}$ és bijectiva amb inversa $\mathcal{C}^\infty$, i cap obert que contingui estrictament $U_\alpha$ fa $F$ injectiva.
      fuites:
      - \\alpha\s*\+\s*2\s*\\pi
      - \\mathbb\s*\{?R\}?\s*\\times\s*\(\s*0\s*,\s*2\s*\\pi\s*\)
    passos:
    - id: injectivitat
      titol: Quan dos punts tenen la mateixa imatge
      objectiu: |
        Caracteritzar quan $F(x,y)=F(x',y')$.
      idea: |
        Compareu primer les normes de les imatges i després les direccions.
      detall: |
        $\|F(x,y)\|=e^x$, així que $F(x,y)=F(x',y')$ implica $e^x=e^{x'}$, és a dir $x=x'$, i llavors $(\cos y,\sin y)=(\cos y',\sin y')$, és a dir $y-y'\in 2\pi\mathbb{Z}$.
      fuites:
      - 2\s*\\pi\s*\\mathbb\s*\{?\s*Z
      teoria: []
    - id: candidat
      titol: Un obert on hi ha inversa
      objectiu: |
        Proposar un obert on $F$ sigui injectiva i justificar que hi té inversa regular.
      idea: |
        Restringiu la variable $y$ a un interval obert on no hi hagi dos valors que difereixin en un múltiple de $2\pi$. Injectivitat i jacobiana invertible donen difeomorfisme sobre la imatge.
      detall: |
        $U_\alpha=\mathbb{R}\times(\alpha,\alpha+2\pi)$: dos valors de $y$ en un interval de longitud $2\pi$ obert no difereixen en un múltiple no nul de $2\pi$, per tant $F|_{U_\alpha}$ és injectiva. Amb $\det JF=e^{2x}\neq 0$, és un difeomorfisme $\mathcal{C}^\infty$ sobre la imatge. Com que $e^x$ recorre $(0,\infty)$ i l'angle $y$ recorre $(\alpha,\alpha+2\pi)$, $F(U_\alpha)=\mathbb{R}^2\setminus\{(t\cos\alpha,t\sin\alpha)\mid t\geq 0\}$ (el pla menys la semirecta tancada d'angle $\alpha$).
      fuites:
      - \\alpha\s*\+\s*2\s*\\pi
      - \(\s*0\s*,\s*2\s*\\pi\s*\)
      teoria:
      - T4.9
      - T4.5
    - id: maximalitat
      titol: Maximalitat
      objectiu: |
        Justificar que l'obert proposat no es pot ampliar mantenint la injectivitat.
      idea: |
        Qualsevol obert més gran conté un punt fora de la franja; useu la caracterització del primer pas.
      detall: |
        Si $W\supsetneq U_\alpha$ és obert i $(x_0,y_0)\in W\setminus U_\alpha$: si $y_0\not\equiv\alpha\pmod{2\pi}$, hi ha un únic $y_1\in(\alpha,\alpha+2\pi)$ amb $y_1\equiv y_0$, i $y_1\neq y_0$, de manera que $(x_0,y_0)$ i $(x_0,y_1)\in U_\alpha$ són dos punts diferents de $W$ amb la mateixa imatge. Si $y_0=\alpha+2k\pi$ amb $k\in\mathbb{Z}$, $W$ conté $(x_0,y_0\pm\varepsilon)$ per a $\varepsilon\in(0,2\pi)$ petit, i un d'aquests dos punts ($y_0-\varepsilon$ si $k\leq 0$, $y_0+\varepsilon$ si $k\geq 1$) és fora de $[\alpha,\alpha+2\pi]$ amb $y$ no congruent amb $\alpha$: es redueix al cas anterior. En tots els casos $F|_W$ no és injectiva.
      fuites: []
      teoria: []
    errors_comuns:
    - id: interval_tancat
      descripcio: |
        Proposa $\mathbb{R}\times[0,2\pi)$, que no és obert.
      pregunta: |
        El conjunt que proposes és obert? Què passa amb els punts de la vora $y=0$?
    - id: no_justifica_maximal
      descripcio: |
        Dona la franja però no justifica per què és maximal.
      pregunta: |
        Si afegeixes a l'obert un punt fora de la franja, pots trobar un altre punt de l'obert amb la mateixa imatge?
    - id: massa_petit
      descripcio: |
        Proposa una franja més estreta (per exemple d'amplada $\pi$), on hi ha inversa però que no és maximal.
      pregunta: |
        Es pot ampliar el teu obert sense perdre la injectivitat?
    nota_professor: |
      Alternativa: $F=P\circ E$ amb $E(x,y)=(e^x,y)$, difeomorfisme de $\mathbb{R}\times(\alpha,\alpha+2\pi)$ sobre $(0,\infty)\times(\alpha,\alpha+2\pi)$, i $P$ les polars (T4.11), i compondre difeomorfismes (T4.10). Com a les polars, també són maximals regions $\{g(x)<y<g(x)+2\pi\}$ amb $g$ contínua; "un obert maximal" admet moltes respostes.
- num: 14
  font: null
  preambul: |
    Sigui $f:\mathbb{R}\to\mathbb{R}$ de classe $\mathcal{C}^1$ tal que existeix $k\in\mathbb{R}$ satisfent $|f'(x)|\leqslant k<1$ per a tot $x\in\mathbb{R}$. Considerem la funció $F:\mathbb{R}^2\to\mathbb{R}^2$ definida per $F(x,y)=(x+f(y),y+f(x))$.
  indicacio: |
    useu el teorema del valor mitjà.
  exercicis:
  - id: t4-14a
    apartat: a
    tipus: teoric
    enunciat: |
      Demostreu que $F$ admet inversa global de classe $\mathcal{C}^1$.
    teoria:
    - T3.20
    teoria_reservada: []
    resultat:
      valor: |
        $F\in\mathcal{C}^1(\mathbb{R}^2)$ i $\det JF(x,y)=1-f'(x)f'(y)\geq 1-k^2>0$ a tot punt. $F$ és injectiva (pel teorema del valor mitjà, $|x-x'|\le k^2|x-x'|$ obliga $x=x'$, i llavors $y=y'$) i exhaustiva (per a $(u,v)$ donat, $x\mapsto u-f(v-f(x))$ és contractiva amb constant $k^2$ i té un punt fix). Per tant $F:\mathbb{R}^2\to\mathbb{R}^2$ és bijectiva, i pel teorema de la funció inversa aplicat a cada punt la inversa global coincideix localment amb una inversa $\mathcal{C}^1$: $F^{-1}\in\mathcal{C}^1(\mathbb{R}^2)$ ($F$ és un difeomorfisme $\mathcal{C}^1$ de $\mathbb{R}^2$).
      fuites: []
    passos:
    - id: jacobia
      titol: Determinant jacobià
      objectiu: |
        Estudiar la regularitat de $F$ i el signe del seu determinant jacobià a tot punt de $\mathbb{R}^2$.
      idea: |
        Calcular la matriu jacobiana de $F$ i fitar el determinant fent servir la hipòtesi sobre $|f'|$.
      detall: |
        Les components de $F$ són sumes de funcions $\mathcal{C}^1$, així que $F\in\mathcal{C}^1(\mathbb{R}^2)$, i
        $JF(x,y)=\begin{pmatrix}1 & f'(y)\\ f'(x) & 1\end{pmatrix}$, amb $\det JF(x,y)=1-f'(x)f'(y)\geq 1-|f'(x)|\,|f'(y)|\geq 1-k^2>0$.
      fuites:
      - 1\s*-\s*k\^\{?2\}?
      - 1\s*-\s*f'\s*\(x\)\s*f'\s*\(y\)
      teoria:
      - T3.10
      - T3.20
    - id: injectivitat
      titol: Injectivitat global
      objectiu: |
        Demostrar que $F$ és injectiva a tot $\mathbb{R}^2$.
      idea: |
        Suposar $F(x,y)=F(x',y')$ i fitar les diferències de coordenades aplicant el teorema del valor mitjà a $f$ (una variable).
      detall: |
        Si $F(x,y)=F(x',y')$, aleshores $x-x'=f(y')-f(y)$ i $y-y'=f(x')-f(x)$. Pel teorema del valor mitjà, $|f(s)-f(t)|\le k|s-t|$ per a tot $s,t$. Per tant
        $|x-x'|\le k|y-y'|= k|f(x')-f(x)|\le k^2|x-x'|$. Com que $k^2<1$, $x=x'$, i aleshores $y-y'=f(x')-f(x)=0$.
      fuites:
      - (\\le|\\leq|\\leqslant|≤)\s*k\^\{?2\}?\s*\|
      teoria:
      - T3.26
    - id: exhaustivitat
      titol: Exhaustivitat
      objectiu: |
        Demostrar que tot $(u,v)\in\mathbb{R}^2$ té alguna antiimatge per $F$.
      idea: |
        Reduir el sistema $F(x,y)=(u,v)$ a una sola equació en $x$ i justificar que té solució; el teorema del punt fix és una via natural.
      detall: |
        $F(x,y)=(u,v)$ equival a $y=v-f(x)$ i $x=u-f(v-f(x))=:\varphi(x)$. Per la regla de la cadena, $|\varphi'(x)|=|f'(v-f(x))|\,|f'(x)|\le k^2<1$, i pel teorema del valor mitjà $\varphi$ és Lipschitz amb constant $k^2<1$ (si $k=0$, amb qualsevol constant de $(0,1)$), és a dir, contractiva a $\mathbb{R}$, que és complet. Pel teorema del punt fix existeix (un únic) $x^*$ amb $\varphi(x^*)=x^*$, i $(x^*,v-f(x^*))$ és antiimatge de $(u,v)$.
        (Alternativa: $\psi(x)=x+f(v-f(x))-u$ té $\psi'\ge 1-k^2>0$, per tant $\psi(x)\to\pm\infty$ quan $x\to\pm\infty$ i, pel valor intermedi, s'anul·la.)
      fuites:
      - x\s*=\s*u\s*-\s*f\s*\(\s*v\s*-\s*f\s*\(\s*x\s*\)
      - y\s*=\s*v\s*-\s*f\s*\(\s*x\s*\)
      teoria:
      - T2.30
      - T2.31
      - T3.26
    - id: regularitat_inversa
      titol: La inversa global és $\mathcal{C}^1$
      objectiu: |
        Deduir que la inversa global $F^{-1}:\mathbb{R}^2\to\mathbb{R}^2$ és de classe $\mathcal{C}^1$.
      idea: |
        Combinar la bijectivitat global amb el teorema de la funció inversa aplicat a cada punt.
      detall: |
        $F$ és bijectiva. Donat $(u_0,v_0)=F(a)$, com que $F\in\mathcal{C}^1$ i $\det JF(a)\neq 0$, el teorema de la funció inversa dona oberts $U\ni a$ i $V=F(U)\ni(u_0,v_0)$ i una inversa local $\mathcal{C}^1$ de $F|_U$ definida a $V$. Per la injectivitat global, aquesta inversa local és exactament la restricció de $F^{-1}$ a $V$. Per tant $F^{-1}$ és $\mathcal{C}^1$ en un entorn de cada punt, és a dir, $F^{-1}\in\mathcal{C}^1(\mathbb{R}^2)$: $F$ és un difeomorfisme $\mathcal{C}^1$ de $\mathbb{R}^2$ en $\mathbb{R}^2$.
      fuites: []
      teoria:
      - T4.5
      - T4.9
    errors_comuns:
    - id: global_per_jacobia
      descripcio: |
        Dedueix l'existència d'inversa global només del fet que $\det JF\neq 0$ a tot punt.
      pregunta: |
        El teorema de la funció inversa et dona informació local o global? Coneixes alguna funció de $\mathbb{R}^2$ amb jacobià no nul arreu que no sigui injectiva?
    - id: oblida_exhaustivitat
      descripcio: |
        Demostra la injectivitat però no comprova que $F$ sigui exhaustiva sobre $\mathbb{R}^2$ (inversa global vol dir definida a tot $\mathbb{R}^2$).
      pregunta: |
        Per parlar d'una inversa definida a tot $\mathbb{R}^2$, n'hi ha prou que $F$ sigui injectiva? Què passa amb els punts que potser no són imatge de res?
    - id: fita_sense_k
      descripcio: |
        Fa servir només $|f'|<1$ punt a punt en lloc de la fita uniforme $k<1$, i no pot concloure (per exemple, la contracció necessita una constant fixa menor que $1$).
      pregunta: |
        Si només saps que $|f'(x)|<1$ a cada punt, pots assegurar una constant de Lipschitz menor que $1$ vàlida per a tots els punts alhora?
    - id: regularitat_sense_tfi
      descripcio: |
        Un cop té la bijectivitat, afirma que la inversa és $\mathcal{C}^1$ sense cap argument.
      pregunta: |
        Una bijecció $\mathcal{C}^1$ sempre té inversa diferenciable? Pensa en $t\mapsto t^3$ a $\mathbb{R}$. Quina hipòtesi addicional fa falta?
    nota_professor: |
      Alternativa elegant: $F=\mathrm{Id}+H$ amb $H(x,y)=(f(y),f(x))$, que és contractiva amb constant $k$ per a la norma euclidiana ($\|H(p)-H(q)\|\le k\|p-q\|$ pel TVM a cada component). Llavors $\|F(p)-F(q)\|\ge(1-k)\|p-q\|$ (injectivitat) i $F(p)=w\iff p=w-H(p)$, punt fix d'una contracció (exhaustivitat). La condició $\det JF\geq 1-k^2$ també surt de $\|DH\|\le k$.
  - id: t4-14b
    apartat: b
    tipus: teoric
    enunciat: |
      Si $f(0)=0$, demostreu que $\|F(x,y)\|\leqslant(1+k)\,\|(x,y)\|$, per a tot $(x,y)\in\mathbb{R}^2$.
    teoria:
    - T1.3
    teoria_reservada: []
    resultat:
      valor: |
        Pel TVM i $f(0)=0$, $|f(t)|\le k|t|$. Com que $F(x,y)=(x,y)+(f(y),f(x))$ i $\|(f(y),f(x))\|=\sqrt{f(y)^2+f(x)^2}\le k\sqrt{x^2+y^2}=k\|(x,y)\|$, la desigualtat triangular dona $\|F(x,y)\|\le(1+k)\|(x,y)\|$.
      fuites: []
    passos:
    - id: fita_f
      titol: Fita lineal de $f$
      objectiu: |
        Fitar $|f(t)|$ en termes de $|t|$, per a tot $t\in\mathbb{R}$.
      idea: |
        Fer servir $f(0)=0$ i el teorema del valor mitjà per a $f$ entre $0$ i $t$.
      detall: |
        $|f(t)|=|f(t)-f(0)|=|f'(\xi)|\,|t|\le k|t|$, amb $\xi$ entre $0$ i $t$.
      fuites:
      - \|f\s*\(t\)\|\s*(\\le|\\leq|\\leqslant|≤)\s*k\s*\|t\|
      - (\\le|\\leq|\\leqslant|≤)\s*k\s*\|t\|
      teoria:
      - T3.26
    - id: descomposicio
      titol: Separar la identitat
      objectiu: |
        Reescriure $F(x,y)$ de manera que el vector $(x,y)$ hi aparegui com a sumand.
      idea: |
        Separar en $F$ la part que és la identitat de la part on intervé $f$.
      detall: |
        $F(x,y)=(x,y)+(f(y),f(x))$.
      fuites:
      - \(x,\s*y\)\s*\+\s*\(f\s*\(y\)
      teoria: []
    - id: concloure
      titol: Fitar i concloure
      objectiu: |
        Fitar la norma de $F(x,y)$ i obtenir la desigualtat de l'enunciat.
      idea: |
        Desigualtat triangular de la norma i la fita del primer pas aplicada a cada component del segon sumand.
      detall: |
        $\|(f(y),f(x))\|=\sqrt{f(y)^2+f(x)^2}\le\sqrt{k^2y^2+k^2x^2}=k\|(x,y)\|$. Per la desigualtat triangular,
        $\|F(x,y)\|\le\|(x,y)\|+\|(f(y),f(x))\|\le(1+k)\|(x,y)\|$.
      fuites:
      - \\sqrt\{\s*k\^\{?2\}?\s*y\^\{?2\}?
      - k\s*\\\|\s*\(x,\s*y\)\s*\\\|
      teoria:
      - T1.3
    errors_comuns:
    - id: suma_de_moduls
      descripcio: |
        Fita $\|(f(y),f(x))\|\le|f(y)|+|f(x)|\le k(|x|+|y|)$ i després escriu $k(|x|+|y|)\le k\|(x,y)\|$, que és fals per a la norma euclidiana.
      pregunta: |
        Compara $|x|+|y|$ amb $\sqrt{x^2+y^2}$ per a $(x,y)=(1,1)$. Quina desigualtat és la certa?
    - id: oblida_f0
      descripcio: |
        Aplica el teorema del valor mitjà sense fer servir $f(0)=0$ i obté una fita de $|f(t)-f(0)|$, no de $|f(t)|$.
      pregunta: |
        Quina fita tens de $|f(t)|$ si no saps quant val $f(0)$? On entra la hipòtesi $f(0)=0$?
    - id: fita_component_a_component
      descripcio: |
        Fita cada component de $F$ per separat ($|x+f(y)|\le|x|+k|y|$) i no sap recompondre la norma.
      pregunta: |
        Si mires $F(x,y)$ com una suma de dos vectors en lloc de dues components, quina propietat de la norma pots aplicar directament?
    nota_professor: |
      L'argument val per a qualsevol norma $\ell^p$ (o qualsevol norma monòtona i invariant per permutació de coordenades): $\|(f(y),f(x))\|\le k\|(y,x)\|=k\|(x,y)\|$. També es pot veure com $\|F(p)-F(0)\|\le\|DF\|\,\|p\|$ amb $\|DF\|\le 1+k$.
- num: 15
  font: null
  preambul: |
    Sigui $f:\mathbb{R}\to\mathbb{R}$ de classe $\mathcal{C}^1$ i tal que $f'(x)\neq 0$, $\forall x\in\mathbb{R}$. Considerem $G:\mathbb{R}^2\to\mathbb{R}^2$ definida per
    $$G(x,y)=(f(x),-y+xf(x)).$$
  indicacio: null
  exercicis:
  - id: t4-15a
    apartat: a
    tipus: teoric
    enunciat: |
      Demostreu que $G$ satisfà les hipòtesis del teorema de la funció inversa en tot punt de $\mathbb{R}^2$.
    teoria:
    - T4.5
    teoria_reservada: []
    resultat:
      valor: |
        $G\in\mathcal{C}^1(\mathbb{R}^2)$ (components formades per sumes i productes de funcions $\mathcal{C}^1$), $\mathbb{R}^2$ és obert i
        $JG(x,y)=\begin{pmatrix}f'(x)&0\\ f(x)+xf'(x)&-1\end{pmatrix}$, amb $\det JG(x,y)=-f'(x)\neq 0$ per a tot $(x,y)$.
      fuites: []
    passos:
    - id: regularitat
      titol: Regularitat de $G$
      objectiu: |
        Comprovar que $G$ té la regularitat que demana el teorema de la funció inversa sobre un obert.
      idea: |
        Mirar de quines operacions amb funcions $\mathcal{C}^1$ estan fetes les components de $G$.
      detall: |
        $G_1(x,y)=f(x)$ i $G_2(x,y)=-y+xf(x)$ són sumes i productes de funcions $\mathcal{C}^1$, per tant $G\in\mathcal{C}^1(\mathbb{R}^2)$, i $\mathbb{R}^2$ és obert.
      fuites: []
      teoria:
      - T3.20
    - id: jacobia
      titol: Determinant jacobià
      objectiu: |
        Calcular el determinant jacobià de $G$ i veure on s'anul·la.
      idea: |
        Derivar les components (la segona conté un producte) i fer servir la hipòtesi sobre $f'$.
      detall: |
        $JG(x,y)=\begin{pmatrix}f'(x)&0\\ f(x)+xf'(x)&-1\end{pmatrix}$, $\det JG(x,y)=-f'(x)\neq 0$ per a tot $(x,y)\in\mathbb{R}^2$. Per tant se satisfan les hipòtesis del TFI a tot punt.
      fuites:
      - =\s*-\s*f'\s*\(x\)
      - f\s*\(x\)\s*\+\s*x\s*f'\s*\(x\)
      teoria:
      - T3.10
      - T4.5
    errors_comuns:
    - id: producte_mal_derivat
      descripcio: |
        Deriva $xf(x)$ com $f'(x)$ o com $xf'(x)$, oblidant la regla del producte.
      pregunta: |
        Quina és la derivada respecte de $x$ d'un producte de dues funcions de $x$?
    - id: conclou_injectivitat
      descripcio: |
        Afirma que, com que les hipòtesis del TFI es compleixen arreu, $G$ és globalment injectiva.
      pregunta: |
        Què garanteix exactament el TFI: una inversa a tot el pla o en un entorn de cada punt?
    - id: oblida_regularitat
      descripcio: |
        Només comprova $\det JG\neq 0$ i no justifica que $G$ sigui $\mathcal{C}^1$ en un obert.
      pregunta: |
        El TFI té alguna hipòtesi sobre la regularitat de la funció i el seu domini, a més del determinant?
    nota_professor: |
      El càlcul és directe. El determinant no depèn de $y$ i val $-f'(x)$; el signe és irrellevant.
  - id: t4-15b
    apartat: b
    tipus: calcul
    enunciat: |
      Donat $(u_0,v_0)\in\mathrm{Im}\,G$, calculeu $DG^{-1}(u_0,v_0)$.
    teoria:
    - T4.5
    teoria_reservada: []
    resultat:
      valor: |
        Amb $x_0=f^{-1}(u_0)$ (l'únic $x$ amb $f(x)=u_0$):
        $DG^{-1}(u_0,v_0)=\begin{pmatrix}\frac{1}{f'(x_0)}&0\\ x_0+\frac{u_0}{f'(x_0)}&-1\end{pmatrix}$.
      fuites:
      - x_\{?0\}?\s*\+\s*\\[dt]?frac\{\s*u_\{?0\}?\s*\}\{\s*f'\s*\(\s*x_\{?0\}?\s*\)\s*\}
      - \\[dt]?frac\{\s*u_\{?0\}?\s*\}\{\s*f'\s*\(\s*x_\{?0\}?\s*\)\s*\}\s*\+\s*x_\{?0\}?
      - \\[dt]?frac\{\s*u_\{?0\}?\s*\+\s*x_\{?0\}?\s*f'\s*\(\s*x_\{?0\}?\s*\)\s*\}\{\s*f'\s*\(\s*x_\{?0\}?\s*\)\s*\}
    passos:
    - id: antiimatge
      titol: Punt on avaluar la jacobiana
      objectiu: |
        Identificar el punt $(x_0,y_0)$ tal que $G(x_0,y_0)=(u_0,v_0)$.
      idea: |
        La primera component de $G$ només depèn de $x$; fer servir que $f$ és injectiva perquè la seva derivada no s'anul·la.
      detall: |
        $f'$ és contínua i no s'anul·la, per tant té signe constant i $f$ és estrictament monòtona: $f:\mathbb{R}\to f(\mathbb{R})$ és bijectiva. De $f(x_0)=u_0$ surt $x_0=f^{-1}(u_0)$, i de $-y_0+x_0f(x_0)=v_0$, $y_0=x_0u_0-v_0$.
      fuites:
      - y_\{?0\}?\s*=\s*x_\{?0\}?\s*u_\{?0\}?\s*-\s*v_\{?0\}?
      teoria:
      - T4.1
    - id: jacobiana
      titol: Jacobiana al punt
      objectiu: |
        Calcular $JG(x_0,y_0)$, expressada en termes de $x_0$ i $u_0$.
      idea: |
        Derivar les components de $G$ i substituir $f(x_0)=u_0$.
      detall: |
        $JG(x_0,y_0)=\begin{pmatrix}f'(x_0)&0\\ u_0+x_0f'(x_0)&-1\end{pmatrix}$.
      fuites:
      - u_\{?0\}?\s*\+\s*x_\{?0\}?\s*f'\s*\(\s*x_\{?0\}?\s*\)
      teoria:
      - T3.10
    - id: invertir
      titol: Diferencial de la inversa
      objectiu: |
        Obtenir $DG^{-1}(u_0,v_0)$.
      idea: |
        Aplicar la fórmula de la diferencial de la inversa que dona el teorema de la funció inversa i invertir una matriu $2\times 2$.
      detall: |
        $DG^{-1}(u_0,v_0)=\big(DG(x_0,y_0)\big)^{-1}=\frac{1}{-f'(x_0)}\begin{pmatrix}-1&0\\ -(u_0+x_0f'(x_0))&f'(x_0)\end{pmatrix}=\begin{pmatrix}\frac{1}{f'(x_0)}&0\\ x_0+\frac{u_0}{f'(x_0)}&-1\end{pmatrix}$.
      fuites:
      - x_\{?0\}?\s*\+\s*\\[dt]?frac\{\s*u_\{?0\}?\s*\}\{\s*f'\s*\(\s*x_\{?0\}?\s*\)\s*\}
      - \\[dt]?frac\{\s*1\s*\}\{\s*f'\s*\(\s*x_\{?0\}?\s*\)\s*\}\s*&\s*0
      teoria:
      - T4.5
    errors_comuns:
    - id: punt_equivocat
      descripcio: |
        Avalua $JG$ al punt $(u_0,v_0)$ en lloc de l'antiimatge $(x_0,y_0)=G^{-1}(u_0,v_0)$.
      pregunta: |
        A la fórmula de la diferencial de la inversa, en quin espai viu el punt on avalues $DG$: en el de sortida o en el d'arribada de $G$?
    - id: inversa_entrada_a_entrada
      descripcio: |
        Inverteix la matriu prenent l'invers de cada entrada.
      pregunta: |
        Multiplica la teva matriu per $JG(x_0,y_0)$: obtens la identitat?
    - id: no_identifica_x0
      descripcio: |
        Deixa el resultat en termes d'un $x_0$ indeterminat, sense justificar que és únic i val $f^{-1}(u_0)$.
      pregunta: |
        Quants $x$ compleixen $f(x)=u_0$? Per què?
    nota_professor: |
      Es pot comprovar amb la inversa explícita de l'apartat (c): $G^{-1}(u,v)=(f^{-1}(u),uf^{-1}(u)-v)$, i derivant amb $(f^{-1})'(u)=1/f'(f^{-1}(u))$ s'obté la mateixa matriu.
  - id: t4-15c
    apartat: c
    tipus: calcul
    enunciat: |
      Demostreu que $G$ és injectiva i calculeu l'expressió explícita de $G^{-1}$.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        $f$ és estrictament monòtona (perquè $f'$ és contínua i no s'anul·la), per tant injectiva; si $G(x,y)=G(x',y')$, llavors $f(x)=f(x')$, $x=x'$ i després $y=y'$. $\mathrm{Im}\,G=f(\mathbb{R})\times\mathbb{R}$ i
        $G^{-1}(u,v)=\big(f^{-1}(u),\,uf^{-1}(u)-v\big)$.
      fuites:
      - u\s*f\^\{?-1\}?\s*\(\s*u\s*\)\s*-\s*v
      - f\^\{?-1\}?\s*\(\s*u\s*\)\s*u\s*-\s*v
    passos:
    - id: monotonia
      titol: Injectivitat de $f$
      objectiu: |
        Justificar que $f$ és injectiva.
      idea: |
        Una derivada contínua que no s'anul·la en un interval té signe constant (valor intermedi); en deduir la monotonia de $f$.
      detall: |
        $f'$ és contínua i $f'(x)\neq 0$ per a tot $x$; si canviés de signe, pel teorema del valor intermedi s'anul·laria. Per tant $f'>0$ o $f'<0$ arreu, $f$ és estrictament monòtona i $f:\mathbb{R}\to f(\mathbb{R})$ és bijectiva amb inversa $\mathcal{C}^1$.
      fuites: []
      teoria:
      - T2.24
      - T4.1
    - id: injectivitat_G
      titol: Injectivitat de $G$
      objectiu: |
        Demostrar que $G$ és injectiva.
      idea: |
        Suposar $G(x,y)=G(x',y')$ i comparar primer les primeres components.
      detall: |
        $G(x,y)=G(x',y')\Rightarrow f(x)=f(x')\Rightarrow x=x'$; aleshores la segona component dona $-y+xf(x)=-y'+xf(x)$, és a dir, $y=y'$.
      fuites: []
      teoria: []
    - id: inversa
      titol: Imatge i inversa explícita
      objectiu: |
        Determinar la imatge de $G$ i l'expressió de $G^{-1}$.
      idea: |
        Resoldre el sistema $G(x,y)=(u,v)$ aïllant primer $x$ i després $y$.
      detall: |
        $f(x)=u$ té solució si i només si $u\in f(\mathbb{R})$, i aleshores $x=f^{-1}(u)$; després $y=xf(x)-v=uf^{-1}(u)-v$. Per tant $\mathrm{Im}\,G=f(\mathbb{R})\times\mathbb{R}$ i
        $G^{-1}(u,v)=\big(f^{-1}(u),\,uf^{-1}(u)-v\big)$. Comprovació: $G(f^{-1}(u),uf^{-1}(u)-v)=(u,-uf^{-1}(u)+v+f^{-1}(u)\,u)=(u,v)$.
      fuites:
      - u\s*f\^\{?-1\}?\s*\(\s*u\s*\)\s*-\s*v
      teoria: []
    errors_comuns:
    - id: injectivitat_per_tfi
      descripcio: |
        Dedueix la injectivitat de $G$ del fet que el jacobià no s'anul·la arreu.
      pregunta: |
        El teorema de la funció inversa garanteix injectivitat a tot $\mathbb{R}^2$ o només a prop de cada punt?
    - id: imatge_tot_el_pla
      descripcio: |
        Suposa que $\mathrm{Im}\,G=\mathbb{R}^2$ i que $f^{-1}$ està definida a tot $\mathbb{R}$.
      pregunta: |
        Si $f=\arctan$, quins valors pot prendre la primera component de $G$?
    - id: monotonia_sense_continuitat
      descripcio: |
        Afirma que $f'\neq 0$ implica monotonia sense justificar per què $f'$ no pot canviar de signe.
      pregunta: |
        Què impedeix que $f'$ sigui positiva en un punt i negativa en un altre? Quina hipòtesi sobre $f'$ fas servir?
    nota_professor: |
      La imatge pot ser una banda: per exemple, amb $f=\arctan$, $\mathrm{Im}\,G=(-\pi/2,\pi/2)\times\mathbb{R}$.
- num: 16
  font: null
  preambul: |
    Sigui $f:\mathbb{R}^2\to\mathbb{R}^2$ definida per $f(u,v)=(u^3-3uv^2,\ 3u^2v-v^3)$.
  indicacio: null
  exercicis:
  - id: t4-16a
    apartat: a
    tipus: calcul
    enunciat: |
      En quins punts existeix inversa local diferenciable?
    teoria:
    - T4.5
    teoria_reservada:
    - T4.3
    resultat:
      valor: |
        A tots els punts $(u,v)\neq(0,0)$: allà $\det Jf(u,v)=9(u^2+v^2)^2\neq 0$ i el TFI dona inversa local $\mathcal{C}^\infty$. A l'origen no n'hi ha: $Df(0,0)=0$, i si existís $h$ diferenciable amb $h\circ f=\mathrm{Id}$ a prop de l'origen, la regla de la cadena donaria $Dh(0,0)\,Df(0,0)=I$, impossible (a més, $f$ ni tan sols és localment injectiva a l'origen).
      fuites:
      - (excepte|menys|tret\s+de)\s+(a\s+)?l'origen
      - \\neq\s*\(0,\s*0\)
      - \\setminus\s*\\\{\s*(\(0,\s*0\)|0)\s*\\\}
    passos:
    - id: jacobia
      titol: Jacobiana i determinant
      objectiu: |
        Calcular la matriu jacobiana de $f$ i el seu determinant en un punt qualsevol.
      idea: |
        Derivar les components; el determinant es pot escriure de manera compacta com una suma de quadrats.
      detall: |
        $Jf(u,v)=\begin{pmatrix}3u^2-3v^2&-6uv\\ 6uv&3u^2-3v^2\end{pmatrix}$, $\det Jf(u,v)=(3u^2-3v^2)^2+36u^2v^2=9(u^2+v^2)^2$.
      fuites:
      - 9\s*\(\s*u\^\{?2\}?\s*\+\s*v\^\{?2\}?\s*\)\^\{?2\}?
      teoria:
      - T3.10
    - id: aplicar_tfi
      titol: Punts on s'aplica el TFI
      objectiu: |
        Decidir en quins punts el teorema de la funció inversa assegura una inversa local diferenciable.
      idea: |
        Comprovar la regularitat de $f$ i veure on s'anul·la el determinant jacobià.
      detall: |
        $f$ és polinòmica, $f\in\mathcal{C}^\infty(\mathbb{R}^2)$, i $9(u^2+v^2)^2=0$ només a l'origen. Per tant, a tot $(u,v)\neq(0,0)$ hi ha inversa local de classe $\mathcal{C}^\infty$.
      fuites:
      - \\neq\s*\(0,\s*0\)
      teoria:
      - T4.5
      - T3.31
    - id: origen
      titol: Què passa a l'origen
      objectiu: |
        Decidir si a l'origen, on el TFI no s'aplica, hi pot haver igualment una inversa local diferenciable.
      idea: |
        Suposar que existeix i aplicar la regla de la cadena a la composició amb $f$; o bé estudiar la injectivitat de $f$ a prop de l'origen.
      detall: |
        $Df(0,0)=0$. Si hi hagués $h$ diferenciable en $f(0,0)=(0,0)$ amb $h(f(p))=p$ per a $p$ a prop de l'origen, la regla de la cadena donaria $Dh(0,0)\,Df(0,0)=I$, però el producte és $0$: contradicció. De fet, $f$ no és ni localment injectiva: en polars $f(r\cos\theta,r\sin\theta)=(r^3\cos 3\theta,r^3\sin 3\theta)$, així que $(r,0)$ i $(r\cos\frac{2\pi}{3},r\sin\frac{2\pi}{3})$ tenen la mateixa imatge per a tot $r>0$.
      fuites:
      - D\s*f\s*\(0,\s*0\)\s*=\s*0
      - r\^\{?3\}?\s*\\cos\s*3\s*\\theta
      teoria:
      - T3.21
    errors_comuns:
    - id: tfi_com_a_equivalencia
      descripcio: |
        Conclou que a l'origen no hi ha inversa local només perquè el determinant s'hi anul·la, com si la condició del TFI fos necessària.
      pregunta: |
        El TFI diu què passa quan el determinant és zero? Recorda $t\mapsto t^3$ a $\mathbb{R}$: té inversa? És diferenciable?
    - id: determinant_mal
      descripcio: |
        Calcula malament el determinant (signes de $\pm 6uv$) i obté una expressió que s'anul·la en més punts.
      pregunta: |
        Quin signe té el producte dels termes fora de la diagonal, i com afecta el determinant?
    - id: local_vs_global
      descripcio: |
        Respon sobre la inversa global (o diu que no n'hi ha enlloc perquè $f$ no és injectiva).
      pregunta: |
        La pregunta és sobre una inversa en un entorn de cada punt o a tot el pla? La no-injectivitat global hi influeix?
    nota_professor: |
      És l'exemple paradigmàtic de les notes ($f(z)=z^3$ en variable complexa). Matís: a l'origen no hi ha inversa local diferenciable, i de fet no n'hi ha cap (ni contínua), perquè $f$ no és localment injectiva.
  - id: t4-16b
    apartat: b
    tipus: calcul
    enunciat: |
      Calculeu les antiimatges dels punts $(0,0)$ i $(1,0)$. Té $f$ inversa global?
    teoria: []
    teoria_reservada:
    - T4.3
    resultat:
      valor: |
        $f^{-1}(0,0)=\{(0,0)\}$; $f^{-1}(1,0)=\{(1,0),\ (-\frac12,\frac{\sqrt3}{2}),\ (-\frac12,-\frac{\sqrt3}{2})\}$. Com que $(1,0)$ té tres antiimatges, $f$ no és injectiva i no té inversa global.
      fuites:
      - \\[dt]?frac\{\\sqrt\s*\{?3\}?\}\{2\}
      - \\sqrt\s*\{?3\}?\s*/\s*2
      - tres\s+antiimatges
      - no\s+(té|admet)\s+inversa\s+global
    passos:
    - id: antiimatges_origen
      titol: Antiimatges de $(0,0)$
      objectiu: |
        Resoldre $f(u,v)=(0,0)$.
      idea: |
        Factoritzar les dues equacions i discutir els casos.
      detall: |
        $u(u^2-3v^2)=0$ i $v(3u^2-v^2)=0$. Si $u=0$, la segona dona $-v^3=0$, $v=0$. Si $u^2=3v^2$, la segona dona $8v^3=0$, $v=0$ i $u=0$. Només $(0,0)$.
      fuites:
      - 8\s*v\^\{?3\}?\s*=\s*0
      teoria: []
    - id: antiimatges_1_0
      titol: Antiimatges de $(1,0)$
      objectiu: |
        Resoldre $f(u,v)=(1,0)$.
      idea: |
        Començar per l'equació igualada a zero, factoritzar-la i substituir cada cas a l'altra equació.
      detall: |
        $v(3u^2-v^2)=0$. Si $v=0$: $u^3=1$, $u=1$. Si $v^2=3u^2$: $u^3-9u^3=-8u^3=1$, $u=-\frac12$, $v^2=\frac34$, $v=\pm\frac{\sqrt3}{2}$. Antiimatges: $(1,0)$, $(-\frac12,\frac{\sqrt3}{2})$, $(-\frac12,-\frac{\sqrt3}{2})$.
      fuites:
      - -\s*8\s*u\^\{?3\}?
      - \\[dt]?frac\{\\sqrt\s*\{?3\}?\}\{2\}
      teoria: []
    - id: inversa_global
      titol: Inversa global
      objectiu: |
        Decidir si $f$ té inversa global.
      idea: |
        Una inversa global requereix injectivitat; el TFI només dona informació local.
      detall: |
        $(1,0)$ té tres antiimatges diferents, per tant $f$ no és injectiva i no té inversa global, tot i que $\det Jf\neq 0$ fora de l'origen.
      fuites:
      - tres\s+antiimatges
      - no\s+és\s+injectiva
      teoria:
      - T4.5
    errors_comuns:
    - id: perd_solucions
      descripcio: |
        Resol $u^3=1$ i $v=0$ i s'oblida de l'altre factor $3u^2-v^2=0$.
      pregunta: |
        Quan un producte s'anul·la, quants casos cal estudiar?
    - id: jacobia_implica_global
      descripcio: |
        Argumenta que, com que el jacobià no s'anul·la (fora de l'origen), $f$ té inversa global.
      pregunta: |
        Què et diuen les antiimatges que has calculat sobre la injectivitat de $f$?
    - id: arrels_reals
      descripcio: |
        Pensa que $u^3=1$ té una única solució i conclou que $(1,0)$ només té una antiimatge, sense mirar les solucions amb $v\neq 0$.
      pregunta: |
        Has comprovat si hi ha antiimatges amb $v\neq 0$?
    nota_professor: |
      Interpretació complexa: $f(z)=z^3$, $z=u+iv$; les antiimatges de $1$ són les tres arrels cúbiques de la unitat. Aquesta via és vàlida, però el càlcul real directe és el que s'espera.
  - id: t4-16c
    apartat: c
    tipus: calcul
    enunciat: |
      Sigui $h=f^{-1}$ una inversa local de $f$ definida en un entorn de $(1,0)$. Calculeu $h(1,0)$ sabent que
      $$Dh(1,0)=\begin{pmatrix}-\frac{3}{2}&\frac{3\sqrt3}{2}\\ -\frac{3\sqrt3}{2}&-\frac{3}{2}\end{pmatrix}^{-1}$$
    teoria:
    - T4.5
    teoria_reservada:
    - T4.3
    resultat:
      valor: |
        $h(1,0)=\big(-\frac12,\frac{\sqrt3}{2}\big)$.
      fuites:
      - -\s*(\\[dt]?frac\s*\{?1\}?\s*\{?2\}?|1\s*/\s*2)\s*,\s*(\\[dt]?frac\s*\{\s*\\sqrt\s*\{?3\}?\s*\}\s*\{?2\}?|\\sqrt\s*\{?3\}?\s*/\s*2)
    passos:
    - id: candidats
      titol: Candidats
      objectiu: |
        Assumint conegudes les antiimatges de $(1,0)$ de l'apartat (b), determinar quins valors pot prendre $h(1,0)$.
      idea: |
        Si $h$ és una inversa local de $f$, cal que $f(h(1,0))=(1,0)$.
      detall: |
        $f(h(1,0))=(1,0)$, per tant $h(1,0)\in\{(1,0),\ (-\frac12,\pm\frac{\sqrt3}{2})\}$.
      fuites: []
      teoria: []
    - id: relacio_tfi
      titol: Relació amb la jacobiana de $f$
      objectiu: |
        Traduir la dada sobre $Dh(1,0)$ en una condició sobre la jacobiana de $f$.
      idea: |
        Fórmula de la diferencial de la inversa local del teorema de la funció inversa.
      detall: |
        $Dh(1,0)=\big(Df(h(1,0))\big)^{-1}$, per tant $Df(h(1,0))=M:=\begin{pmatrix}-\frac32&\frac{3\sqrt3}{2}\\ -\frac{3\sqrt3}{2}&-\frac32\end{pmatrix}$. No cal invertir cap matriu.
      fuites: []
      teoria:
      - T4.5
    - id: comparar
      titol: Comparar als candidats
      objectiu: |
        Identificar el candidat on la jacobiana de $f$ coincideix amb la matriu donada.
      idea: |
        Avaluar $Jf$ a cada candidat i comparar.
      detall: |
        $Jf(1,0)=\begin{pmatrix}3&0\\0&3\end{pmatrix}$; a $(-\frac12,\frac{\sqrt3}{2})$: $3u^2-3v^2=-\frac32$, $-6uv=\frac{3\sqrt3}{2}$, $6uv=-\frac{3\sqrt3}{2}$, que és $M$; a $(-\frac12,-\frac{\sqrt3}{2})$ els termes de fora de la diagonal canvien de signe. Per tant $h(1,0)=(-\frac12,\frac{\sqrt3}{2})$.
      fuites:
      - -\s*(\\[dt]?frac\{?1\}?\{?2\}?|1\s*/\s*2)\s*,\s*(\\[dt]?frac\{\\sqrt\s*\{?3\}?\}\{?2\}?|\\sqrt\s*\{?3\}?\s*/\s*2)
      teoria:
      - T3.10
    errors_comuns:
    - id: h_identitat
      descripcio: |
        Respon $h(1,0)=(1,0)$ perquè $f(1,0)=(1,0)$, sense fer servir la dada de $Dh(1,0)$.
      pregunta: |
        Quantes inverses locals diferents hi ha a prop de $(1,0)$? Quina informació distingeix la que et donen?
    - id: compara_amb_df_del_punt_imatge
      descripcio: |
        Compara $M$ amb $Df(1,0)$ (avaluant al punt d'arribada) en lloc de $Df(h(1,0))$.
      pregunta: |
        A la fórmula del TFI, en quin punt s'avalua $Df$ per obtenir $Dh(1,0)$?
    - id: inverteix_innecessariament
      descripcio: |
        Inverteix la matriu donada i la compara amb $Jf$, barrejant $Dh$ i $Df$.
      pregunta: |
        Si $Dh(1,0)=M^{-1}$, quina matriu ha de ser $Df(h(1,0))$?
    nota_professor: |
      En notació complexa, $Jf(z)$ és la matriu de multiplicar per $3z^2$. $M$ correspon a $3z^2=-\frac32-\frac{3\sqrt3}{2}i$, és a dir $z^2=e^{4\pi i/3}$, i entre les arrels cúbiques de $1$ només $z=e^{2\pi i/3}$ ho compleix.
- num: 17
  font: null
  preambul: |
    Considereu el sistema
    $$\left.\begin{aligned}x-2y-z&=0\\ x+yt&=0\end{aligned}\right\}$$
  indicacio: null
  exercicis:
  - id: t4-17a
    apartat: a
    tipus: teoric
    enunciat: |
      Proveu que defineix implícitament funcions diferenciables $z=g_1(x,y)$ i $t=g_2(x,y)$ al voltant del punt $(1,1,-1,-1)$.
    teoria:
    - T4.12
    teoria_reservada: []
    resultat:
      valor: |
        Amb $\Phi(x,y,z,t)=(x-2y-z,\,x+yt)\in\mathcal{C}^\infty$, $\Phi(1,1,-1,-1)=(0,0)$ i $\det\frac{\partial\Phi}{\partial(z,t)}(1,1,-1,-1)=\det\begin{pmatrix}-1&0\\0&1\end{pmatrix}=-1\neq 0$. Pel teorema de la funció implícita existeixen $g_1,g_2$ de classe $\mathcal{C}^\infty$ en un entorn de $(1,1)$, amb $g_1(1,1)=-1$, $g_2(1,1)=-1$.
      fuites: []
    passos:
    - id: comprovar_punt
      titol: El punt és solució
      objectiu: |
        Escriure el sistema com $\Phi=0$ i comprovar que el punt donat hi pertany.
      idea: |
        Definir $\Phi:\mathbb{R}^4\to\mathbb{R}^2$ amb les dues equacions i avaluar-la al punt, respectant l'ordre $(x,y,z,t)$.
      detall: |
        $\Phi(x,y,z,t)=(x-2y-z,\,x+yt)$; $\Phi(1,1,-1,-1)=(1-2+1,\,1-1)=(0,0)$.
      fuites: []
      teoria: []
    - id: menor
      titol: Menor respecte de $(z,t)$
      objectiu: |
        Comprovar la condició de no-degeneració respecte de les variables que es volen aïllar.
      idea: |
        Calcular la submatriu de la jacobiana de $\Phi$ formada per les derivades respecte de $z$ i $t$, i el seu determinant al punt.
      detall: |
        $\frac{\partial\Phi}{\partial(z,t)}=\begin{pmatrix}-1&0\\0&y\end{pmatrix}$, de determinant $-y$, que al punt val $-1\neq 0$.
      fuites:
      - -\s*1\s*\\neq\s*0
      teoria:
      - T3.10
    - id: aplicar_tfi
      titol: Aplicar el teorema de la funció implícita
      objectiu: |
        Concloure l'existència de $g_1$ i $g_2$ diferenciables.
      idea: |
        Comprovar totes les hipòtesis del teorema de la funció implícita (regularitat, punt solució, determinant) i llegir-ne la conclusió.
      detall: |
        $\Phi$ és polinòmica, per tant $\mathcal{C}^\infty$. Pel teorema de la funció implícita existeixen un entorn $\Omega$ de $(1,1)$ i $(g_1,g_2)\in\mathcal{C}^\infty(\Omega)$ amb $g_1(1,1)=-1$, $g_2(1,1)=-1$ i $\Phi(x,y,g_1(x,y),g_2(x,y))=0$; a més, a prop del punt aquestes són les úniques solucions.
      fuites: []
      teoria:
      - T4.13
      - T3.31
    errors_comuns:
    - id: menor_equivocat
      descripcio: |
        Calcula el determinant respecte de $(x,y)$ en lloc de $(z,t)$.
      pregunta: |
        Quines variables vols escriure en funció de les altres? Respecte de quines cal que el menor sigui invertible?
    - id: no_comprova_punt
      descripcio: |
        No comprova que el punt satisfà el sistema.
      pregunta: |
        El teorema de la funció implícita demana alguna condició sobre el valor de $\Phi$ al punt?
    - id: ordre_coordenades
      descripcio: |
        Assigna malament les coordenades del punt (per exemple, pren $z=1$, $t=-1$ o $y=-1$).
      pregunta: |
        En quin ordre estan escrites les variables del punt $(1,1,-1,-1)$?
    nota_professor: |
      El determinant és $-y$, així que el teorema s'aplica a tot punt solució amb $y\neq 0$.
  - id: t4-17b
    apartat: b
    tipus: calcul
    enunciat: |
      Calculeu $\frac{\partial g_1}{\partial x}(1,1)$, $\frac{\partial g_1}{\partial y}(1,1)$, $\frac{\partial g_2}{\partial x}(1,1)$ i $\frac{\partial g_2}{\partial y}(1,1)$ per derivació implícita.
    teoria:
    - T4.13
    teoria_reservada: []
    resultat:
      valor: |
        $\frac{\partial g_1}{\partial x}(1,1)=1$, $\frac{\partial g_1}{\partial y}(1,1)=-2$, $\frac{\partial g_2}{\partial x}(1,1)=-1$, $\frac{\partial g_2}{\partial y}(1,1)=1$.
      fuites:
      - \\partial\s*g_\{?1\}?\}\{\\partial\s*y\}\s*\(1,\s*1\)\s*=\s*-\s*2
      - \\partial\s*g_\{?2\}?\}\{\\partial\s*x\}\s*\(1,\s*1\)\s*=\s*-\s*1
      - \\partial\s*g_\{?2\}?\}\{\\partial\s*y\}\s*\(1,\s*1\)\s*=\s*1
      - 1\s*&\s*-\s*2\s*\\\\\s*-\s*1\s*&\s*1
    passos:
    - id: derivar_sistema
      titol: Derivar el sistema
      objectiu: |
        Obtenir equacions lineals per a les derivades parcials de $g_1$ i $g_2$.
      idea: |
        Substituir $z=g_1(x,y)$, $t=g_2(x,y)$ al sistema i derivar cada equació respecte de $x$ i respecte de $y$ amb la regla de la cadena.
      detall: |
        $x-2y-g_1=0$: $1-\frac{\partial g_1}{\partial x}=0$, $-2-\frac{\partial g_1}{\partial y}=0$.
        $x+y\,g_2=0$: $1+y\frac{\partial g_2}{\partial x}=0$, $g_2+y\frac{\partial g_2}{\partial y}=0$.
      fuites:
      - g_\{?2\}?\s*\+\s*y\s*\\[dt]?frac\{\\partial\s*g_\{?2\}?\}\{\\partial\s*y\}
      teoria:
      - T4.15
      - T3.21
    - id: avaluar
      titol: Avaluar al punt
      objectiu: |
        Obtenir els valors numèrics de les quatre derivades a $(1,1)$.
      idea: |
        Substituir $x=y=1$ i els valors de $g_1$, $g_2$ en aquest punt.
      detall: |
        Amb $y=1$, $g_2(1,1)=-1$: $\frac{\partial g_1}{\partial x}(1,1)=1$, $\frac{\partial g_1}{\partial y}(1,1)=-2$, $\frac{\partial g_2}{\partial x}(1,1)=-1$, $\frac{\partial g_2}{\partial y}(1,1)=-\frac{g_2(1,1)}{1}=1$.
        (Matricialment: $Dg(1,1)=-\begin{pmatrix}-1&0\\0&1\end{pmatrix}^{-1}\begin{pmatrix}1&-2\\1&-1\end{pmatrix}=\begin{pmatrix}1&-2\\-1&1\end{pmatrix}$.)
      fuites:
      - \\partial\s*g_\{?2\}?\}\{\\partial\s*y\}\s*\(1,\s*1\)\s*=
      - 1\s*&\s*-\s*2\s*\\\\\s*-\s*1\s*&\s*1
      teoria: []
    errors_comuns:
    - id: regla_producte
      descripcio: |
        Deriva $y\,g_2(x,y)$ respecte de $y$ com $y\frac{\partial g_2}{\partial y}$, oblidant el terme $g_2$.
      pregunta: |
        El terme $y\,t$ depèn de $y$ de dues maneres quan $t=g_2(x,y)$. Quina regla de derivació s'hi aplica?
    - id: valor_g2
      descripcio: |
        Substitueix $g_2(1,1)$ per un valor incorrecte (per exemple $1$) en lloc de $t=-1$.
      pregunta: |
        Quant val $g_2(1,1)$? D'on ho treus?
    - id: signe_formula
      descripcio: |
        Aplica la fórmula matricial sense el signe menys: $Dg=\big(\frac{\partial\Phi}{\partial(z,t)}\big)^{-1}\frac{\partial\Phi}{\partial(x,y)}$.
      pregunta: |
        Si derives $\Phi(x,y,g(x,y))=0$ amb la regla de la cadena, quina relació obtens entre els dos blocs de la jacobiana?
    nota_professor: |
      Es pot fer component a component o amb la fórmula de l'observació 15 de les notes; tots dos camins són equivalents.
  - id: t4-17c
    apartat: c
    tipus: calcul
    enunciat: |
      Calculeu explícitament $g_1$ i $g_2$ i comproveu directament els resultats de (b).
    teoria:
    - T4.13
    teoria_reservada: []
    resultat:
      valor: |
        $g_1(x,y)=x-2y$, $g_2(x,y)=-\frac{x}{y}$ (en un entorn de $(1,1)$, on $y\neq 0$). Derivant: $\frac{\partial g_1}{\partial x}=1$, $\frac{\partial g_1}{\partial y}=-2$, $\frac{\partial g_2}{\partial x}=-\frac1y$, $\frac{\partial g_2}{\partial y}=\frac{x}{y^2}$, que a $(1,1)$ donen $1,-2,-1,1$, com a (b).
      fuites:
      - g_\{?2\}?\s*\(x,\s*y\)\s*=\s*-\s*\\[dt]?frac\{\s*x\s*\}\{\s*y\s*\}
      - g_\{?2\}?\s*\(x,\s*y\)\s*=\s*-\s*x\s*/\s*y
      - g_\{?1\}?\s*\(x,\s*y\)\s*=\s*x\s*-\s*2\s*y
    passos:
    - id: aillar
      titol: Aïllar $z$ i $t$
      objectiu: |
        Trobar les expressions explícites de $g_1$ i $g_2$ a prop de $(1,1)$.
      idea: |
        Cada equació permet aïllar directament una de les variables; cal vigilar on és vàlida l'expressió i comprovar el valor al punt.
      detall: |
        De la primera, $z=x-2y$; de la segona, $t=-\frac{x}{y}$ si $y\neq 0$. Així $g_1(x,y)=x-2y$ i $g_2(x,y)=-\frac{x}{y}$ en un entorn de $(1,1)$; $g_1(1,1)=-1$, $g_2(1,1)=-1$, i per la unicitat local del teorema de la funció implícita són les funcions de (a).
      fuites:
      - t\s*=\s*-\s*\\[dt]?frac\{\s*x\s*\}\{\s*y\s*\}
      - g_\{?2\}?\s*\(x,\s*y\)\s*=\s*-\s*\\[dt]?frac\{\s*x\s*\}\{\s*y\s*\}
      teoria:
      - T4.13
    - id: comprovar
      titol: Comprovar les derivades
      objectiu: |
        Derivar les expressions explícites i comparar amb (b).
      idea: |
        Derivar directament i avaluar a $(1,1)$.
      detall: |
        $\frac{\partial g_1}{\partial x}=1$, $\frac{\partial g_1}{\partial y}=-2$, $\frac{\partial g_2}{\partial x}=-\frac{1}{y}$, $\frac{\partial g_2}{\partial y}=\frac{x}{y^2}$; a $(1,1)$: $1,\,-2,\,-1,\,1$. Coincideixen amb (b).
      fuites:
      - \\[dt]?frac\{\s*x\s*\}\{\s*y\^\{?2\}?\s*\}
      teoria: []
    errors_comuns:
    - id: domini_g2
      descripcio: |
        No indica que l'expressió de $g_2$ només té sentit per a $y\neq 0$ (i que això és compatible amb un entorn de $(1,1)$).
      pregunta: |
        On està definida l'expressió que has obtingut per a $t$? Conté un entorn de $(1,1)$?
    - id: derivada_quocient
      descripcio: |
        S'equivoca de signe derivant $-\frac{x}{y}$ respecte de $y$.
      pregunta: |
        Quina és la derivada de $\frac1y$ respecte de $y$? Com afecta el signe menys i el factor $x$?
    - id: unicitat
      descripcio: |
        No relaciona les funcions explícites amb les del teorema (podria haver-hi altres solucions).
      pregunta: |
        Com saps que les funcions que has aïllat són les mateixes que garanteix el teorema a (a)?
    nota_professor: |
      Cas didàctic: el sistema és prou senzill per resoldre'l explícitament i contrastar la derivació implícita.
  - id: t4-17d
    apartat: d
    tipus: calcul
    enunciat: |
      Calculeu les derivades segones de $g_1$ i $g_2$ en el punt $(1,1)$.
    teoria:
    - T5.1
    teoria_reservada: []
    resultat:
      valor: |
        Totes les derivades segones de $g_1$ són $0$. Per a $g_2$: $\frac{\partial^2 g_2}{\partial x^2}(1,1)=0$, $\frac{\partial^2 g_2}{\partial x\partial y}(1,1)=\frac{\partial^2 g_2}{\partial y\partial x}(1,1)=1$, $\frac{\partial^2 g_2}{\partial y^2}(1,1)=-2$.
      fuites:
      - \\partial\s*y\^\{?2\}?\}\s*\(1,\s*1\)\s*=\s*-\s*2
      - \\partial\s*x\s*\\partial\s*y\}\s*\(1,\s*1\)\s*=\s*1
      - \\partial\s*y\s*\\partial\s*x\}\s*\(1,\s*1\)\s*=\s*1
    passos:
    - id: segones_g1
      titol: Derivades segones de $g_1$
      objectiu: |
        Calcular les derivades segones de $g_1$ a $(1,1)$ (es poden fer servir els resultats dels apartats anteriors).
      idea: |
        Mirar la forma de $g_1$ (o de les seves derivades primeres obtingudes a (b)).
      detall: |
        $g_1(x,y)=x-2y$ és lineal (o bé: $\frac{\partial g_1}{\partial x}=1$ i $\frac{\partial g_1}{\partial y}=-2$ són constants), per tant totes les derivades segones de $g_1$ són $0$.
      fuites: []
      teoria:
      - T5.1
    - id: segones_g2
      titol: Derivades segones de $g_2$
      objectiu: |
        Calcular les derivades segones de $g_2$ a $(1,1)$.
      idea: |
        Derivar una altra vegada l'expressió explícita de (c), o bé tornar a derivar implícitament les equacions de (b).
      detall: |
        Amb $g_2=-\frac{x}{y}$: $\frac{\partial g_2}{\partial x}=-\frac1y$, $\frac{\partial g_2}{\partial y}=\frac{x}{y^2}$; $\frac{\partial^2 g_2}{\partial x^2}=0$, $\frac{\partial^2 g_2}{\partial x\partial y}=\frac{\partial^2 g_2}{\partial y\partial x}=\frac{1}{y^2}$, $\frac{\partial^2 g_2}{\partial y^2}=-\frac{2x}{y^3}$. A $(1,1)$: $0$, $1$, $1$, $-2$.
        (Implícitament: de $1+y\frac{\partial g_2}{\partial x}=0$ i $g_2+y\frac{\partial g_2}{\partial y}=0$, derivant: $y\frac{\partial^2 g_2}{\partial x^2}=0$, $\frac{\partial g_2}{\partial x}+y\frac{\partial^2 g_2}{\partial y\partial x}=0$, $2\frac{\partial g_2}{\partial y}+y\frac{\partial^2 g_2}{\partial y^2}=0$, que donen el mateix.)
      fuites:
      - -\s*\\[dt]?frac\{\s*2\s*x\s*\}\{\s*y\^\{?3\}?\s*\}
      - \\[dt]?frac\{\s*1\s*\}\{\s*y\^\{?2\}?\s*\}
      teoria:
      - T5.1
      - T5.6
    errors_comuns:
    - id: oblida_g1
      descripcio: |
        Calcula només les de $g_2$ i no diu res de les de $g_1$, o en dona valors no nuls.
      pregunta: |
        Quina forma té $g_1$? Què passa quan derives dues vegades una funció així?
    - id: derivada_y_quadrat
      descripcio: |
        S'equivoca derivant $\frac{x}{y^2}$ respecte de $y$ (signe o exponent).
      pregunta: |
        Quina és la derivada de $y^{-2}$?
    - id: implicita_sense_producte
      descripcio: |
        Derivant implícitament per segona vegada, oblida termes de la regla del producte.
      pregunta: |
        Quan derives $y\frac{\partial g_2}{\partial y}$ respecte de $y$, quants termes surten?
    nota_professor: |
      Les derivades creuades coincideixen, com ha de ser per a $g_2\in\mathcal{C}^\infty$ (Schwarz).
- num: 18
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t4-18
    apartat: null
    tipus: teoric
    enunciat: |
      Proveu que el sistema
      $$\left.\begin{aligned}xz^3+y^2u^3&=1\\ 2xy^3+u^2z&=0\end{aligned}\right\}$$
      permet definir $x$ i $y$ com a funcions implícites diferenciables de $z$ i de $u$ en un entorn de $(0,1,0,1)$. Si $x=g_1(z,u)$ i $y=g_2(z,u)$ són les funcions esmentades, proveu que la funció $g(z,u)=(g_1(z,u),g_2(z,u))$ té inversa local diferenciable al voltant del punt $(0,1)$.
    teoria:
    - T4.12
    teoria_reservada: []
    resultat:
      valor: |
        Amb $\Phi(x,y,z,u)=(xz^3+y^2u^3-1,\,2xy^3+u^2z)\in\mathcal{C}^\infty$: $\Phi(0,1,0,1)=(0,0)$ i $\frac{\partial\Phi}{\partial(x,y)}(0,1,0,1)=\begin{pmatrix}0&2\\2&0\end{pmatrix}$, de determinant $-4\neq 0$. Pel teorema de la funció implícita, $g=(g_1,g_2)$ és $\mathcal{C}^\infty$ en un entorn de $(0,1)$ amb $g(0,1)=(0,1)$, i
        $Dg(0,1)=-\begin{pmatrix}0&2\\2&0\end{pmatrix}^{-1}\begin{pmatrix}0&3\\1&0\end{pmatrix}=\begin{pmatrix}-\frac12&0\\0&-\frac32\end{pmatrix}$, amb $\det Dg(0,1)=\frac34\neq 0$. Pel teorema de la funció inversa, $g$ té inversa local diferenciable (de fet $\mathcal{C}^\infty$) a prop de $(0,1)$.
      fuites: []
    passos:
    - id: comprovar_punt
      titol: El punt és solució
      objectiu: |
        Escriure el sistema com $\Phi=0$ i comprovar que el punt hi pertany.
      idea: |
        Passar tot a un costat, definir $\Phi:\mathbb{R}^4\to\mathbb{R}^2$ i avaluar al punt amb l'ordre $(x,y,z,u)$.
      detall: |
        $\Phi(x,y,z,u)=(xz^3+y^2u^3-1,\,2xy^3+u^2z)$; $\Phi(0,1,0,1)=(0+1-1,\,0+0)=(0,0)$.
      fuites: []
      teoria: []
    - id: menor_xy
      titol: Menor respecte de $(x,y)$
      objectiu: |
        Comprovar la condició del teorema de la funció implícita respecte de les variables $x$, $y$.
      idea: |
        Submatriu de la jacobiana de $\Phi$ formada per les derivades respecte de $x$ i $y$, avaluada al punt.
      detall: |
        $\frac{\partial\Phi}{\partial(x,y)}=\begin{pmatrix}z^3&2yu^3\\2y^3&6xy^2\end{pmatrix}$; al punt, $\begin{pmatrix}0&2\\2&0\end{pmatrix}$, de determinant $-4\neq 0$.
      fuites:
      - -\s*4\s*\\neq\s*0
      - \\begin\{pmatrix\}\s*0\s*&\s*2\s*\\\\\s*2\s*&\s*0\s*\\end
      teoria:
      - T3.10
    - id: implicita
      titol: Existència de $g$
      objectiu: |
        Concloure que $x$ i $y$ són funcions diferenciables de $(z,u)$ a prop del punt.
      idea: |
        Aplicar el teorema de la funció implícita amb totes les seves hipòtesis.
      detall: |
        $\Phi$ és polinòmica, $\mathcal{C}^\infty$. Pel teorema de la funció implícita existeix $g=(g_1,g_2)$ de classe $\mathcal{C}^\infty$ en un entorn obert $\Omega$ de $(0,1)$, amb $g(0,1)=(0,1)$ i $\Phi(g_1(z,u),g_2(z,u),z,u)=0$.
      fuites: []
      teoria:
      - T4.13
      - T3.31
    - id: diferencial_g
      titol: Diferencial de $g$ al punt
      objectiu: |
        Calcular $Dg(0,1)$.
      idea: |
        Derivar $\Phi(g(z,u),z,u)=0$ amb la regla de la cadena (fórmula de la diferencial de la funció implícita).
      detall: |
        $\frac{\partial\Phi}{\partial(z,u)}=\begin{pmatrix}3xz^2&3y^2u^2\\u^2&2uz\end{pmatrix}$, al punt $\begin{pmatrix}0&3\\1&0\end{pmatrix}$. Llavors
        $Dg(0,1)=-\begin{pmatrix}0&2\\2&0\end{pmatrix}^{-1}\begin{pmatrix}0&3\\1&0\end{pmatrix}=-\begin{pmatrix}0&\frac12\\ \frac12&0\end{pmatrix}\begin{pmatrix}0&3\\1&0\end{pmatrix}=\begin{pmatrix}-\frac12&0\\0&-\frac32\end{pmatrix}$.
      fuites:
      - -\s*\\[dt]?frac\{?3\}?\{?2\}?
      - -\s*3\s*/\s*2
      teoria:
      - T4.15
    - id: inversa_g
      titol: Inversa local de $g$
      objectiu: |
        Demostrar que $g$ té inversa local diferenciable a prop de $(0,1)$.
      idea: |
        Aplicar el teorema de la funció inversa a $g:\Omega\subseteq\mathbb{R}^2\to\mathbb{R}^2$.
      detall: |
        $g\in\mathcal{C}^\infty(\Omega)$, $\Omega$ obert, i $\det Dg(0,1)=\frac12\cdot\frac32=\frac34\neq 0$. Pel teorema de la funció inversa, $g$ és injectiva en un entorn de $(0,1)$, la imatge d'aquest entorn és un obert que conté $g(0,1)=(0,1)$ i la inversa local és $\mathcal{C}^\infty$ (en particular diferenciable).
      fuites:
      - \\[dt]?frac\{?3\}?\{?4\}?
      - 3\s*/\s*4
      teoria:
      - T4.5
    errors_comuns:
    - id: menor_equivocat
      descripcio: |
        Calcula el menor respecte de $(z,u)$ en lloc de $(x,y)$.
      pregunta: |
        Quines són les variables que vols posar en funció de les altres?
    - id: sense_formula_explicita
      descripcio: |
        Creu que cal trobar $g$ explícitament per poder aplicar el teorema de la funció inversa.
      pregunta: |
        Què necessita el teorema de la funció inversa: l'expressió de $g$ o només la seva regularitat i la seva diferencial en un punt?
    - id: signe_o_ordre
      descripcio: |
        Oblida el signe menys a $Dg=-\big(\frac{\partial\Phi}{\partial(x,y)}\big)^{-1}\frac{\partial\Phi}{\partial(z,u)}$ o multiplica en l'ordre equivocat.
      pregunta: |
        Si derives $\Phi(g(z,u),z,u)=0$ amb la regla de la cadena, quina equació matricial obtens?
    - id: regularitat_g
      descripcio: |
        Aplica el TFI a $g$ sense justificar que $g$ és de classe $\mathcal{C}^1$.
      pregunta: |
        D'on surt la regularitat de $g$ necessària per aplicar el teorema de la funció inversa?
    nota_professor: |
      Un error de signe a $Dg$ no canvia la conclusió (el determinant és el mateix), però sí el valor de la diferencial. Alternativa: com que $\det\frac{\partial\Phi}{\partial(z,u)}(0,1,0,1)=-3\neq 0$, el sistema també defineix $(z,u)$ en funció de $(x,y)$ a prop del punt, i aquesta funció és precisament la inversa local de $g$.
- num: 19
  font: null
  preambul: |
    Considereu el sistema d'equacions
    $$\left.\begin{aligned}x-u-v&=0\\ y-u^2-v^2&=0\\ z-u^3-v^3&=0\end{aligned}\right\}$$
    Trobeu els punts $p=(x_0,y_0,z_0,u_0,v_0)\in\mathbb{R}^5$ que compleixin les dues condicions següents:
  indicacio: null
  exercicis:
  - id: t4-19a
    apartat: a
    tipus: calcul
    enunciat: |
      el sistema defineix funcions implícites diferenciables, $z=f_1(x,y)$, $u=f_2(x,y)$ i $v=f_3(x,y)$ al voltant de $p$;
    teoria:
    - T4.12
    teoria_reservada: []
    resultat:
      valor: |
        Els punts $p=(u_0+v_0,\ u_0^2+v_0^2,\ u_0^3+v_0^3,\ u_0,\ v_0)$ amb $u_0\neq v_0$.
      fuites:
      - u_\{?0\}?\s*(\\neq?|≠)\s*v_\{?0\}?
      - v_\{?0\}?\s*(\\neq?|≠)\s*u_\{?0\}?
      - u\s*(\\neq?|≠)\s*v
      - u_\{?0\}?\s*-\s*v_\{?0\}?\s*(\\neq?|≠)\s*0
    passos:
    - id: punts_solucio
      titol: Punts del sistema
      objectiu: |
        Descriure tots els punts $p\in\mathbb{R}^5$ que satisfan el sistema.
      idea: |
        Les equacions donen $x$, $y$, $z$ directament en funció de $u$, $v$.
      detall: |
        $p$ és solució si i només si $x_0=u_0+v_0$, $y_0=u_0^2+v_0^2$, $z_0=u_0^3+v_0^3$, amb $(u_0,v_0)\in\mathbb{R}^2$ arbitrari.
      fuites: []
      teoria: []
    - id: menor
      titol: Menor respecte de $(z,u,v)$
      objectiu: |
        Calcular el determinant que controla si $(z,u,v)$ es poden posar en funció de $(x,y)$.
      idea: |
        Submatriu $3\times 3$ de la jacobiana de $\Phi$ formada per les derivades respecte de $z$, $u$, $v$.
      detall: |
        Amb $\Phi=(x-u-v,\,y-u^2-v^2,\,z-u^3-v^3)$: $\frac{\partial\Phi}{\partial(z,u,v)}=\begin{pmatrix}0&-1&-1\\0&-2u&-2v\\1&-3u^2&-3v^2\end{pmatrix}$, de determinant $\begin{vmatrix}-1&-1\\-2u&-2v\end{vmatrix}=2v-2u=2(v-u)$.
      fuites:
      - 2\s*\(\s*v\s*-\s*u\s*\)
      - 2\s*v\s*-\s*2\s*u
      - -\s*2\s*\(\s*u\s*-\s*v\s*\)
      teoria:
      - T3.10
    - id: concloure
      titol: Condició sobre $p$
      objectiu: |
        Determinar exactament en quins punts del sistema existeixen les funcions implícites diferenciables.
      idea: |
        On el determinant no s'anul·la, aplicar el teorema de la funció implícita; on s'anul·la, veure si la regla de la cadena porta a contradicció suposant que les funcions existeixen.
      detall: |
        $\Phi$ és polinòmica. Si $u_0\neq v_0$, el determinant és no nul i el teorema de la funció implícita dona $f_1,f_2,f_3$ de classe $\mathcal{C}^\infty$ a prop de $(x_0,y_0)$. Si $u_0=v_0$ i existissin $f_2,f_3$ diferenciables, derivant $x=f_2+f_3$ i $y=f_2^2+f_3^2$ respecte de $y$ al punt: $0=\frac{\partial f_2}{\partial y}+\frac{\partial f_3}{\partial y}$ i $1=2u_0\big(\frac{\partial f_2}{\partial y}+\frac{\partial f_3}{\partial y}\big)=0$, contradicció. Per tant la condició és exactament $u_0\neq v_0$.
      fuites:
      - u_\{?0\}?\s*(\\neq?|≠)\s*v_\{?0\}?
      teoria:
      - T4.13
      - T3.21
    errors_comuns:
    - id: menor_equivocat
      descripcio: |
        Calcula el determinant respecte d'unes variables que no són $(z,u,v)$, o una submatriu que no és quadrada.
      pregunta: |
        Quantes equacions hi ha i quantes variables vols aïllar? Respecte de quines variables derives?
    - id: oblida_punts_solucio
      descripcio: |
        Dona la condició sobre $(u_0,v_0)$ però no imposa que $p$ satisfaci el sistema (deixa $x_0,y_0,z_0$ lliures).
      pregunta: |
        Un punt qualsevol de $\mathbb{R}^5$ serveix? Quina condició ha de complir $p$ respecte del sistema?
    - id: condicio_nomes_suficient
      descripcio: |
        Diu que quan el determinant s'anul·la "no es pot aplicar el teorema" i conclou que no hi ha funcions implícites, sense justificar-ho.
      pregunta: |
        El teorema de la funció implícita dona una condició necessària o suficient? Com podries descartar els punts on el determinant s'anul·la?
    nota_professor: |
      La justificació de la necessitat (excloure $u_0=v_0$) és un plus de rigor; molts enunciats d'aquest tipus esperen només la condició del TFI. Geomètricament, $u_0=v_0$ correspon a $y_0=x_0^2/2$, la vora de la imatge de $(u,v)\mapsto(u+v,u^2+v^2)$.
  - id: t4-19b
    apartat: b
    tipus: calcul
    enunciat: |
      la derivada direccional de $f_1$ en $(x_0,y_0)$ és màxima en la direcció del vector $(1,0)$ i el valor d'aquesta derivada és 3.
    teoria:
    - T3.1
    teoria_reservada: []
    resultat:
      valor: |
        Els punts que compleixen (a) i (b) són $p=(0,2,0,1,-1)$ i $p=(0,2,0,-1,1)$.
      fuites:
      - \(\s*0\s*,\s*2\s*,\s*0\s*,\s*1\s*,\s*-\s*1\s*\)
      - \(\s*0\s*,\s*2\s*,\s*0\s*,\s*-\s*1\s*,\s*1\s*\)
    passos:
    - id: traduir_condicio
      titol: Traduir la condició
      objectiu: |
        Assumint el resultat de (a), expressar la condició sobre la derivada direccional màxima com una condició sobre $\nabla f_1(x_0,y_0)$.
      idea: |
        Relació entre la direcció de màxim creixement, el valor màxim de la derivada direccional i el gradient.
      detall: |
        El màxim de $D_wf_1(x_0,y_0)$ sobre $\|w\|=1$ val $\|\nabla f_1(x_0,y_0)\|$ i s'assoleix a $w=\nabla f_1/\|\nabla f_1\|$. Que sigui a $w=(1,0)$ amb valor $3$ equival a $\nabla f_1(x_0,y_0)=(3,0)$.
      fuites:
      - \\nabla\s*f_\{?1\}?\s*\(\s*x_\{?0\}?\s*,\s*y_\{?0\}?\s*\)\s*=\s*\(\s*3\s*,\s*0\s*\)
      - =\s*\(\s*3\s*,\s*0\s*\)
      teoria:
      - T3.13
    - id: gradient
      titol: Gradient de $f_1$
      objectiu: |
        Calcular $\nabla f_1(x_0,y_0)$ en termes de $u_0$, $v_0$.
      idea: |
        Derivar implícitament el sistema respecte de $x$ i de $y$ (amb $z=f_1$, $u=f_2$, $v=f_3$) i resoldre el sistema lineal per a les derivades de $u$, $v$.
      detall: |
        Respecte de $x$: $1=u_x+v_x$, $0=2uu_x+2vv_x$, $z_x=3u^2u_x+3v^2v_x$; d'aquí $u_x=\frac{v}{v-u}$, $v_x=\frac{-u}{v-u}$ i $z_x=\frac{3uv(u-v)}{v-u}=-3uv$.
        Respecte de $y$: $0=u_y+v_y$, $1=2uu_y+2vv_y$; $u_y=\frac{1}{2(u-v)}$, $v_y=-\frac{1}{2(u-v)}$ i $z_y=\frac{3(u^2-v^2)}{2(u-v)}=\frac{3(u+v)}{2}$.
        Per tant $\nabla f_1(x_0,y_0)=\big(-3u_0v_0,\ \frac32(u_0+v_0)\big)$. (Alternativa: $u^3+v^3=(u+v)^3-3uv(u+v)$ i $uv=\frac{x^2-y}{2}$ donen $f_1(x,y)=\frac{3xy-x^3}{2}$.)
      fuites:
      - =\s*-\s*3\s*u_?\{?0?\}?\s*v
      - \\[dt]?frac\{\s*3\s*x\s*y\s*-\s*x\^\{?3\}?\s*\}\{\s*2\s*\}
      - \\[dt]?frac\{\s*3\s*\(\s*u\s*\+\s*v\s*\)\s*\}\{\s*2\s*\}
      - \\[dt]?frac\s*\{?3\}?\s*\{?2\}?\s*\(\s*u_?\{?0?\}?\s*\+\s*v
      teoria:
      - T4.15
      - T3.21
    - id: resoldre
      titol: Resoldre i comprovar
      objectiu: |
        Trobar els punts $p$ que compleixen totes les condicions.
      idea: |
        Igualar el gradient al vector obtingut al primer pas, resoldre per a $(u_0,v_0)$ i comprovar la condició de (a).
      detall: |
        $\frac32(u_0+v_0)=0\Rightarrow v_0=-u_0$; $-3u_0v_0=3u_0^2=3\Rightarrow u_0=\pm1$. Els parells $(1,-1)$ i $(-1,1)$ compleixen $u_0\neq v_0$. Llavors $x_0=0$, $y_0=2$, $z_0=0$: $p=(0,2,0,1,-1)$ i $p=(0,2,0,-1,1)$.
      fuites:
      - u_\{?0\}?\s*=\s*\\pm\s*1
      - \(\s*0\s*,\s*2\s*,\s*0\s*,
      teoria: []
    errors_comuns:
    - id: nomes_paralel
      descripcio: |
        Imposa només que $\nabla f_1$ sigui paral·lel a $(1,0)$ i oblida el valor $3$ (o el sentit: un gradient que apunti cap a $(-1,0)$ no serveix).
      pregunta: |
        Quant val la derivada direccional màxima en funció del gradient? I en quin sentit apunta la direcció de màxim creixement?
    - id: oblida_condicio_a
      descripcio: |
        No comprova que les solucions compleixen la condició de (a), o dona només $(x_0,y_0)$ i no el punt $p$ sencer de $\mathbb{R}^5$.
      pregunta: |
        El problema demana punts de $\mathbb{R}^5$ que compleixin les dues condicions. Els teus ho fan totes dues?
    - id: derivada_parcial_z
      descripcio: |
        Calcula $\frac{\partial f_1}{\partial x}$ tractant $u$ i $v$ com a constants.
      pregunta: |
        Quan $x$ varia, $u$ i $v$ es queden fixos o també canvien?
    - id: perd_una_solucio
      descripcio: |
        De $u_0^2=1$ pren només $u_0=1$.
      pregunta: |
        Quantes solucions té $u_0^2=1$? I cadascuna, quin $v_0$ dona?
    nota_professor: |
      Per simetria $u\leftrightarrow v$ les dues solucions són el mateix punt $(x_0,y_0,z_0)=(0,2,0)$ amb $u,v$ intercanviats; cadascun dona una tria diferent de funcions implícites $f_2,f_3$, però la mateixa $f_1$. La fórmula explícita $f_1=\frac{3xy-x^3}{2}$ dona $\nabla f_1=\big(\frac{3y-3x^2}{2},\frac{3x}{2}\big)=(3,0)$ a $(0,2)$.
- num: 20
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t4-20
    apartat: null
    tipus: calcul
    enunciat: |
      Demostreu que l'equació $x^2y+e^x+z=0$ defineix implícitament $x$ en funció de $y$ i $z$ al voltant del punt $(0,1,-1)$. Calculeu les derivades primeres i segones de $x(y,z)$ en el punt $(1,-1)$.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        Amb $F(x,y,z)=x^2y+e^x+z$ (de classe $\mathcal{C}^\infty$), $F(0,1,-1)=0$ i $\frac{\partial F}{\partial x}(0,1,-1)=1\neq 0$, el teorema de la funció implícita (amb $r=2$) dona $x=x(y,z)$ de classe $\mathcal{C}^2$ (de fet $\mathcal{C}^\infty$) en un entorn de $(1,-1)$ amb $x(1,-1)=0$. Derivades en $(1,-1)$: $x_y=0$, $x_z=-1$, $x_{yy}=0$, $x_{yz}=x_{zy}=0$, $x_{zz}=-3$.
      fuites:
      - x_\{?zz\}?\s*(\(1,\s*-1\))?\s*=\s*-\s*3
      - \\partial\s*z\^\{?2\}?\}?\s*(\(1,\s*-1\))?\s*=\s*-\s*3
    passos:
    - id: hipotesis_tfi
      titol: Comprovar les hipòtesis del teorema de la funció implícita
      objectiu: |
        Justificar que l'equació defineix $x$ com a funció diferenciable de $(y,z)$ prop de $(1,-1)$.
      idea: |
        Escriure l'equació com $F(x,y,z)=0$ i comprovar les hipòtesis del teorema de la funció implícita respecte de la variable que es vol aïllar.
      detall: |
        $F(x,y,z)=x^2y+e^x+z$ és de classe $\mathcal{C}^\infty$ i $F(0,1,-1)=0+1-1=0$. A més $\frac{\partial F}{\partial x}=2xy+e^x$, que en $(0,1,-1)$ val $e^0=1\neq 0$. Pel teorema de la funció implícita (aplicat amb $r=2$, ja que $F\in\mathcal{C}^2$) existeixen un entorn obert $\Omega$ de $(1,-1)$ i $x=x(y,z)$ de classe $\mathcal{C}^2(\Omega)$, amb $x(1,-1)=0$ i $F(x(y,z),y,z)=0$ per a tot $(y,z)\in\Omega$; a més, prop de $(0,1,-1)$ aquestes són totes les solucions. La classe $\mathcal{C}^2$ és la que cal per parlar de derivades segones (i per Schwarz).
      fuites: []
      teoria:
      - T4.13
      - T3.31
    - id: derivades_primeres
      titol: Derivades primeres
      objectiu: |
        Calcular $\frac{\partial x}{\partial y}(1,-1)$ i $\frac{\partial x}{\partial z}(1,-1)$.
      idea: |
        Derivar la identitat $F(x(y,z),y,z)=0$ respecte de cada variable amb la regla de la cadena i avaluar en el punt.
      detall: |
        Derivant respecte de $y$: $2x\,x_y\,y+x^2+e^x x_y=0$; en $(1,-1)$ (on $x=0$): $x_y=0$, és a dir $x_y(1,-1)=0$.
        Derivant respecte de $z$: $2x\,x_z\,y+e^x x_z+1=0$; en el punt: $x_z(1,-1)=-1$.
      fuites:
      - x_\{?z\}?\s*(\(1,\s*-1\))?\s*=\s*-\s*1\b
      - \\partial\s*x\}?\s*\{\\partial\s*z\}\s*(\(1,\s*-1\))?\s*=\s*-\s*1\b
      teoria:
      - T4.15
      - T3.21
    - id: derivades_segones
      titol: Derivades segones
      objectiu: |
        Calcular $x_{yy}$, $x_{yz}$ i $x_{zz}$ en $(1,-1)$.
      idea: |
        Tornar a derivar les identitats del pas anterior (recordant que $x$ i les seves derivades depenen de $(y,z)$) i substituir els valors ja coneguts. Com que $x$ és $\mathcal{C}^2$, les derivades creuades coincideixen.
      detall: |
        Derivant $2x\,x_y\,y+x^2+e^xx_y=0$ respecte de $y$: $4x\,x_y+2x_y^2y+2x\,x_{yy}y+e^xx_y^2+e^xx_{yy}=0$; en el punt ($x=0$, $x_y=0$): $x_{yy}=0$.
        Derivant $2x\,x_z\,y+e^xx_z+1=0$ respecte de $y$: $2x_yx_zy+2x\,x_{zy}y+2x\,x_z+e^xx_yx_z+e^xx_{zy}=0$; en el punt: $x_{zy}=0$, i per Schwarz $x_{yz}=0$.
        Derivant la mateixa identitat respecte de $z$: $2x_z^2y+2x\,x_{zz}y+e^xx_z^2+e^xx_{zz}=0$; en el punt ($x_z=-1$, $y=1$): $2+1+x_{zz}=0$, per tant $x_{zz}(1,-1)=-3$.
      fuites:
      - x_\{?zz\}?\s*(\(1,\s*-1\))?\s*=\s*-\s*3
      - \\partial\s*z\^\{?2\}?\}?\s*(\(1,\s*-1\))?\s*=\s*-\s*3
      - 2\s*\+\s*1\s*\+\s*x_\{?zz
      teoria:
      - T3.21
      - T5.6
    errors_comuns:
    - id: variable_equivocada
      descripcio: |
        Comprova la hipòtesi del teorema amb la derivada respecte d'una variable que no és la que es vol aïllar (per exemple $\partial F/\partial z$).
      pregunta: |
        Quina és la variable que vols escriure en funció de les altres? La derivada parcial que has comprovat és respecte d'aquesta variable?
    - id: oblidar_dependencia
      descripcio: |
        En derivar per segon cop tracta $x$ o $x_z$ com a constants i perd termes de la regla de la cadena (per exemple el terme $2x_z^2y$).
      pregunta: |
        En l'expressió que tornes a derivar, quins factors depenen encara de $z$ a través de $x(y,z)$?
    - id: punt_equivocat
      descripcio: |
        Avalua en $(y,z)=(1,-1)$ però substitueix un valor de $x$ incorrecte, o confon el punt de $\mathbb{R}^3$ amb el de $\mathbb{R}^2$.
      pregunta: |
        Quant val $x(1,-1)$? Quines coordenades has de substituir a l'expressió de les derivades?
    nota_professor: |
      Alternativa: fórmula $x_z=-F_z/F_x$ i derivar-la com a quocient. Les derivades segones en $y$ s'anul·len perquè $x(1,-1)=0$ i $x_y(1,-1)=0$.
- num: 21
  font: null
  preambul: |
    Considereu l'equació $x^2+y^2+z^2=\psi(ax+by+cz)$, amb $a,b,c\in\mathbb{R}$, $c\neq 0$, on $\psi:\mathbb{R}\to\mathbb{R}$ és de classe $\mathcal{C}^2$ i satisfà $\psi(0)=0$ i $\psi'(0)\neq 0$.
  indicacio: null
  exercicis:
  - id: t4-21a
    apartat: a
    tipus: teoric
    enunciat: |
      Proveu que en un entorn de $(0,0,0)$ les solucions de l'equació es poden expressar de la forma $(x,y,f(x,y))$, amb $f$ diferenciable en un entorn de $(0,0)$.
    teoria:
    - T3.8
    teoria_reservada: []
    resultat:
      valor: |
        Sigui $G(x,y,z)=x^2+y^2+z^2-\psi(ax+by+cz)$, de classe $\mathcal{C}^2$, amb $G(0,0,0)=0$ i $\frac{\partial G}{\partial z}(0,0,0)=-c\psi'(0)\neq 0$. Pel teorema de la funció implícita existeixen entorns oberts $U$ de $(0,0,0)$ i $\Omega$ de $(0,0)$ i $f\in\mathcal{C}^2(\Omega)$ amb $f(0,0)=0$ tals que $\{(x,y,z)\in U: G=0\}=\{(x,y,f(x,y)):(x,y)\in\Omega\}$; en particular $f$ és diferenciable.
      fuites: []
    passos:
    - id: plantejar_g
      titol: Escriure l'equació com G=0
      objectiu: |
        Escriure el problema en el llenguatge del teorema de la funció implícita i comprovar la regularitat i que l'origen és solució.
      idea: |
        Passar-ho tot a un costat i justificar la classe de la funció resultant (polinomi més composició de $\psi$ amb una funció lineal).
      detall: |
        $G(x,y,z)=x^2+y^2+z^2-\psi(ax+by+cz)$. És de classe $\mathcal{C}^2$ perquè $\psi\in\mathcal{C}^2$ i $ax+by+cz$ és lineal, i $G(0,0,0)=-\psi(0)=0$.
      fuites: []
      teoria:
      - T3.31
      - T3.21
    - id: derivada_z
      titol: Condició sobre la derivada respecte de z
      objectiu: |
        Comprovar la hipòtesi del teorema que permet aïllar $z$ i concloure.
      idea: |
        Calcular la derivada parcial de $G$ respecte de la variable que es vol aïllar en l'origen (regla de la cadena per al terme amb $\psi$) i usar les hipòtesis sobre $c$ i $\psi'(0)$.
      detall: |
        $\frac{\partial G}{\partial z}=2z-c\,\psi'(ax+by+cz)$, que en l'origen val $-c\,\psi'(0)\neq 0$ perquè $c\neq 0$ i $\psi'(0)\neq 0$. El teorema de la funció implícita (amb $r=2$) dona entorns $U\ni(0,0,0)$, $\Omega\ni(0,0)$ i $f\in\mathcal{C}^2(\Omega)$, $f(0,0)=0$, amb $\{(x,y,z)\in U:G=0\}=\{(x,y,f(x,y)):(x,y)\in\Omega\}$. En particular $f$ és diferenciable en $\Omega$.
      fuites:
      - -\s*c\s*\\,?\s*\\psi'\s*\(0\)
      teoria:
      - T4.13
      - T3.21
    errors_comuns:
    - id: oblidar_cadena_psi
      descripcio: |
        Deriva $\psi(ax+by+cz)$ respecte de $z$ oblidant el factor $c$ de la regla de la cadena, i aleshores no veu per què cal $c\neq 0$.
      pregunta: |
        Quina hipòtesi de l'enunciat no has fet servir? On hauria d'aparèixer?
    - id: nomes_existencia
      descripcio: |
        Conclou només que hi ha alguna funció $f$ amb $G(x,y,f(x,y))=0$, sense dir que totes les solucions properes a l'origen són d'aquesta forma.
      pregunta: |
        L'enunciat parla de "les solucions" en un entorn de l'origen. Quina part del teorema garanteix que no n'hi ha d'altres?
    nota_professor: |
      $f$ és de fet $\mathcal{C}^2$, cosa que fa falta a l'apartat (b).
  - id: t4-21b
    apartat: b
    tipus: calcul
    enunciat: |
      Calculeu $\frac{\partial f}{\partial x}(0,0)$, $\frac{\partial f}{\partial y}(0,0)$, $\frac{\partial^2 f}{\partial x^2}(0,0)$, i $\frac{\partial^2 f}{\partial y^2}(0,0)$.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        $\frac{\partial f}{\partial x}(0,0)=-\frac{a}{c}$, $\frac{\partial f}{\partial y}(0,0)=-\frac{b}{c}$, $\frac{\partial^2 f}{\partial x^2}(0,0)=\frac{2(a^2+c^2)}{c^3\psi'(0)}$, $\frac{\partial^2 f}{\partial y^2}(0,0)=\frac{2(b^2+c^2)}{c^3\psi'(0)}$.
      fuites:
      - -\s*\\[dt]?frac\s*\{?a\}?\s*\{?c\}?
      - -\s*a\s*/\s*c\b
      - -\s*\\[dt]?frac\s*\{?b\}?\s*\{?c\}?
      - -\s*b\s*/\s*c\b
      - c\^\{?3\}?\s*\\psi
      - \(\s*a\^\{?2\}?\s*\+\s*c\^\{?2\}?\s*\)
    passos:
    - id: primeres
      titol: Derivades primeres
      objectiu: |
        Sabent per (a) que $f$ és $\mathcal{C}^2$ amb $f(0,0)=0$ i $x^2+y^2+f^2=\psi(ax+by+cf)$, calcular $f_x(0,0)$ i $f_y(0,0)$.
      idea: |
        Derivar la identitat respecte de $x$ (i de $y$) amb la regla de la cadena i avaluar en l'origen.
      detall: |
        Respecte de $x$: $2x+2ff_x=\psi'(ax+by+cf)\,(a+cf_x)$. En $(0,0)$: $0=\psi'(0)(a+cf_x(0,0))$ i, com que $\psi'(0)\neq0$, $f_x(0,0)=-\frac{a}{c}$. Anàlogament $f_y(0,0)=-\frac{b}{c}$.
      fuites:
      - -\s*\\[dt]?frac\s*\{?a\}?\s*\{?c\}?
      - -\s*a\s*/\s*c\b
      - -\s*\\[dt]?frac\s*\{?b\}?\s*\{?c\}?
      - -\s*b\s*/\s*c\b
      teoria:
      - T4.15
      - T3.21
    - id: segones
      titol: Derivades segones pures
      objectiu: |
        Calcular $f_{xx}(0,0)$ i $f_{yy}(0,0)$.
      idea: |
        Tornar a derivar la identitat del pas anterior respecte de la mateixa variable, sense oblidar que $f$, $f_x$ i l'argument de $\psi'$ depenen de $x$; observar quins termes s'anul·len en l'origen.
      detall: |
        Derivant $2x+2ff_x=\psi'(\cdot)(a+cf_x)$ respecte de $x$: $2+2f_x^2+2ff_{xx}=\psi''(\cdot)(a+cf_x)^2+\psi'(\cdot)\,c\,f_{xx}$. En l'origen $f=0$ i $a+cf_x=0$, de manera que el terme amb $\psi''$ desapareix: $2+\frac{2a^2}{c^2}=c\,\psi'(0)f_{xx}(0,0)$, és a dir $f_{xx}(0,0)=\frac{2(a^2+c^2)}{c^3\psi'(0)}$. Anàlogament $f_{yy}(0,0)=\frac{2(b^2+c^2)}{c^3\psi'(0)}$.
      fuites:
      - c\^\{?3\}?\s*\\psi
      - \(\s*a\^\{?2\}?\s*\+\s*c\^\{?2\}?\s*\)
      teoria:
      - T3.21
    errors_comuns:
    - id: perdre_termes_segona
      descripcio: |
        En derivar per segon cop oblida el terme $2f_x^2$ o el factor $(a+cf_x)$ de $\psi''$ (no aplica bé la regla del producte i de la cadena).
      pregunta: |
        El terme $2ff_x$ és un producte de dues funcions de $x$. Has derivat els dos factors?
    - id: psi_segona_desconeguda
      descripcio: |
        Creu que el resultat depèn de $\psi''(0)$, que no és conegut, i s'encalla.
      pregunta: |
        Quant val el factor que multiplica $\psi''$ quan avalues en l'origen?
    - id: formula_signe
      descripcio: |
        Usa $f_x=-G_x/G_z$ amb un signe equivocat o avalua $G_x$ en un punt que no és l'origen.
      pregunta: |
        Si substitueixes el teu valor de $f_x$ a la identitat derivada, es compleix en l'origen?
    nota_professor: |
      També es pot fer amb $f_x=-G_x/G_z$ i derivant el quocient, però derivar implícitament la identitat és més net.
- num: 22
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t4-22
    apartat: null
    tipus: calcul
    enunciat: |
      Proveu que l'equació $2x^2+y^2+z^3-5xz-2=0$ defineix implícitament $z=g(x,y)$, amb $g$ de classe $C^\infty$, en un entorn de $p=(1,2,1)$. Proveu que el gradient de $g$ en el punt $(1,2)$ val $(-1/2,2)$.
    teoria:
    - T3.10
    - T3.31
    teoria_reservada: []
    resultat:
      valor: |
        Amb $G(x,y,z)=2x^2+y^2+z^3-5xz-2$ (polinòmica, $\mathcal{C}^\infty$), $G(1,2,1)=0$ i $\frac{\partial G}{\partial z}(1,2,1)=3-5=-2\neq0$; el teorema de la funció implícita dona $g\in\mathcal{C}^\infty$ amb $g(1,2)=1$. A més $\nabla g(1,2)=-\frac{1}{G_z}(G_x,G_y)=-\frac{1}{-2}(-1,4)=(-1/2,2)$.
      fuites: []
    passos:
    - id: hipotesis
      titol: Hipòtesis del teorema de la funció implícita
      objectiu: |
        Justificar l'existència de $g$ de classe $\mathcal{C}^\infty$ en un entorn de $(1,2)$.
      idea: |
        Comprovar que $p$ és solució, la regularitat de la funció que defineix l'equació i la condició sobre la derivada respecte de $z$. Per a la classe $\mathcal{C}^\infty$, pensar en com depèn la classe de la funció implícita de la de $G$.
      detall: |
        $G(x,y,z)=2x^2+y^2+z^3-5xz-2$ és un polinomi, per tant $\mathcal{C}^r$ per a tot $r$. $G(1,2,1)=2+4+1-5-2=0$. $\frac{\partial G}{\partial z}=3z^2-5x$, i en $p$ val $3-5=-2\neq 0$. Pel teorema de la funció implícita (amb $r=1$) existeixen un obert $\Omega\ni(1,2)$ i $g\in\mathcal{C}^1(\Omega)$ amb $g(1,2)=1$ i $G(x,y,g(x,y))=0$, i $G_z(x,y,g(x,y))\neq0$ en $\Omega$ (apartat (i) del teorema). Per la regla de la cadena, $g_x=-\frac{G_x(x,y,g)}{G_z(x,y,g)}$ i $g_y=-\frac{G_y(x,y,g)}{G_z(x,y,g)}$ en $\Omega$; si $g\in\mathcal{C}^k$, el segon membre és $\mathcal{C}^k$ i per tant $g\in\mathcal{C}^{k+1}$. Per inducció, $g\in\mathcal{C}^\infty(\Omega)$. (Les notes ho abreugen aplicant directament el teorema amb $r=\infty$.)
      fuites:
      - 3\s*-\s*5\s*=\s*-\s*2
      teoria:
      - T4.13
      - T3.31
      - T3.21
    - id: gradient
      titol: Calcular el gradient
      objectiu: |
        Calcular $\nabla g(1,2)$.
      idea: |
        Derivar $G(x,y,g(x,y))=0$ respecte de $x$ i de $y$ amb la regla de la cadena, o usar la fórmula de la diferencial de la funció implícita.
      detall: |
        $\frac{\partial G}{\partial x}=4x-5z$, que en $p$ val $-1$; $\frac{\partial G}{\partial y}=2y$, que val $4$. Llavors $g_x(1,2)=-\frac{G_x}{G_z}=-\frac{-1}{-2}=-\frac12$ i $g_y(1,2)=-\frac{G_y}{G_z}=-\frac{4}{-2}=2$. Per tant $\nabla g(1,2)=(-1/2,2)$.
      fuites:
      - 4x\s*-\s*5z
      teoria:
      - T4.15
      - T3.21
    errors_comuns:
    - id: signe_formula
      descripcio: |
        Oblida el signe menys de $g_x=-G_x/G_z$ o fa el quocient al revés.
      pregunta: |
        Si derives $G(x,y,g(x,y))=0$ respecte de $x$, quina equació obtens? D'on surt el signe?
    - id: cinf_sense_justificar
      descripcio: |
        Afirma que $g$ és $\mathcal{C}^\infty$ sense lligar-ho amb la regularitat de $G$.
      pregunta: |
        De quina classe és la funció implícita segons el teorema, en funció de la classe de $G$?
    - id: derivada_z_xz
      descripcio: |
        En derivar respecte de $z$ oblida el terme $-5x$ del producte $-5xz$.
      pregunta: |
        El terme $-5xz$ depèn de $z$? Quina contribució dona a $\partial G/\partial z$?
    nota_professor: |
      Com que el resultat ja és a l'enunciat, l'interès és la justificació. Per a la classe $\mathcal{C}^\infty$, aplicar el teorema "per a cada $r$" és delicat (l'entorn podria encongir-se amb $r$); l'argument net és el bootstrap del detall a partir de la fórmula de $\nabla g$. Acceptar també la versió de les notes (teorema amb $r=\infty$).
- num: 23
  font: null
  preambul: |
    Sigui $F:\mathbb{R}^3\to\mathbb{R}$ de classe $\mathcal{C}^1$ tal que per a tot punt $p$ on $F(p)=0$ se satisfà $\frac{\partial F}{\partial x}(p)\neq 0$, $\frac{\partial F}{\partial y}(p)\neq 0$ i $\frac{\partial F}{\partial z}(p)\neq 0$.
  indicacio: null
  exercicis:
  - id: t4-23a
    apartat: a
    tipus: teoric
    enunciat: |
      Proveu que si $F(p)=0$, aleshores en un entorn de $p$ es pot escriure cadascuna de les variables $x,y,z$ en termes de les altres dues; és a dir, existeixen funcions $X,Y,Z$ diferenciables tals que $F(X(y,z),y,z)=0$, $F(x,Y(x,z),z)=0$ i $F(x,y,Z(x,y))=0$.
    teoria:
    - T3.2
    - T3.20
    teoria_reservada: []
    resultat:
      valor: |
        Sigui $p=(p_1,p_2,p_3)$ amb $F(p)=0$. Com que $F\in\mathcal{C}^1$ i $\frac{\partial F}{\partial z}(p)\neq0$, el teorema de la funció implícita (amb $z$ com a variable a aïllar) dona $Z$ de classe $\mathcal{C}^1$ (per tant diferenciable) en un entorn de $(p_1,p_2)$ amb $Z(p_1,p_2)=p_3$ i $F(x,y,Z(x,y))=0$. Igualment, amb $\frac{\partial F}{\partial x}(p)\neq0$ s'obté $X(y,z)$ i amb $\frac{\partial F}{\partial y}(p)\neq0$ s'obté $Y(x,z)$ (reordenant les variables).
      fuites: []
    passos:
    - id: aillar_z
      titol: Aïllar una variable
      objectiu: |
        Obtenir $Z(x,y)$ diferenciable amb $F(x,y,Z(x,y))=0$ prop de $p$.
      idea: |
        Aplicar el teorema de la funció implícita amb $n=2$, $m=1$, prenent com a variable "dependent" la que es vol aïllar.
      detall: |
        $F\in\mathcal{C}^1$, $F(p)=0$ i $\frac{\partial F}{\partial z}(p)\neq0$ (el determinant $1\times1$ del teorema). Per tant existeix $Z\in\mathcal{C}^1$ en un entorn de $(p_1,p_2)$, amb $Z(p_1,p_2)=p_3$ i $F(x,y,Z(x,y))=0$. Com que és $\mathcal{C}^1$, és diferenciable.
      fuites: []
      teoria:
      - T4.13
      - T3.31
    - id: altres_variables
      titol: Les altres dues variables
      objectiu: |
        Obtenir també $X(y,z)$ i $Y(x,z)$.
      idea: |
        El teorema no depèn de quines variables posem al final: reordenar les variables (o aplicar-lo a $F$ composta amb una permutació de coordenades) i usar les altres dues hipòtesis.
      detall: |
        Considerant $\tilde F(y,z,x)=F(x,y,z)$, que és $\mathcal{C}^1$ i té $\frac{\partial\tilde F}{\partial x}=\frac{\partial F}{\partial x}(p)\neq0$, s'obté $X\in\mathcal{C}^1$ prop de $(p_2,p_3)$ amb $X(p_2,p_3)=p_1$ i $F(X(y,z),y,z)=0$. Anàlogament, amb $\frac{\partial F}{\partial y}(p)\neq0$, $Y\in\mathcal{C}^1$ prop de $(p_1,p_3)$ amb $Y(p_1,p_3)=p_2$ i $F(x,Y(x,z),z)=0$.
      fuites: []
      teoria:
      - T4.13
    errors_comuns:
    - id: global_vs_local
      descripcio: |
        Pensa que les funcions $X,Y,Z$ estan definides globalment, no només en un entorn.
      pregunta: |
        El teorema que uses, quina mena de conclusió dona: global o en un entorn del punt?
    - id: diferenciable_sense_justificar
      descripcio: |
        Obté les funcions implícites però no justifica que siguin diferenciables.
      pregunta: |
        De quina classe són les funcions que dona el teorema? Què implica aquesta classe sobre la diferenciabilitat?
    nota_professor: |
      Només cal la hipòtesi en el punt $p$ concret; l'enunciat la dona per a tots els zeros de $F$.
  - id: t4-23b
    apartat: b
    tipus: teoric
    enunciat: |
      Proveu que, amb les notacions anteriors, $\frac{\partial Y}{\partial x}(p)\frac{\partial X}{\partial z}(p)\frac{\partial Z}{\partial y}(p)=-1$.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        Derivant les identitats de (a): $\frac{\partial Y}{\partial x}=-\frac{F_x}{F_y}$, $\frac{\partial X}{\partial z}=-\frac{F_z}{F_x}$, $\frac{\partial Z}{\partial y}=-\frac{F_y}{F_z}$ (avaluades al punt corresponent, on les parcials de $F$ es prenen en $p$). El producte és $(-1)^3\frac{F_xF_zF_y}{F_yF_xF_z}=-1$.
      fuites: []
    passos:
    - id: derivades_implicites
      titol: Derivada de cada funció implícita
      objectiu: |
        Usant (a), expressar $\frac{\partial Y}{\partial x}$, $\frac{\partial X}{\partial z}$ i $\frac{\partial Z}{\partial y}$ en el punt en termes de les derivades parcials de $F$ en $p$.
      idea: |
        Derivar cadascuna de les tres identitats de l'apartat (a) respecte de la variable adequada amb la regla de la cadena.
      detall: |
        De $F(x,Y(x,z),z)=0$, derivant respecte de $x$: $F_x+F_y\frac{\partial Y}{\partial x}=0$, és a dir $\frac{\partial Y}{\partial x}=-\frac{F_x(p)}{F_y(p)}$. De $F(X(y,z),y,z)=0$ respecte de $z$: $\frac{\partial X}{\partial z}=-\frac{F_z(p)}{F_x(p)}$. De $F(x,y,Z(x,y))=0$ respecte de $y$: $\frac{\partial Z}{\partial y}=-\frac{F_y(p)}{F_z(p)}$. (Cada funció s'avalua a les dues coordenades de $p$ que li corresponen.)
      fuites:
      - F_\{?z\}?\s*(\(p\))?\s*\}\s*\{\s*F_\{?x
      - F_\{?x\}?\s*(\(p\))?\s*\}\s*\{\s*F_\{?y
      - F_\{?y\}?\s*(\(p\))?\s*\}\s*\{\s*F_\{?z
      - F_[xyz]\s*/\s*F_[xyz]
      teoria:
      - T4.15
      - T3.21
    - id: producte
      titol: Multiplicar
      objectiu: |
        Calcular el producte de les tres derivades.
      idea: |
        Multiplicar les tres expressions: comptar signes i veure què se simplifica.
      detall: |
        $\left(-\frac{F_x}{F_y}\right)\left(-\frac{F_z}{F_x}\right)\left(-\frac{F_y}{F_z}\right)=(-1)^3\cdot 1=-1$, ja que cada derivada parcial apareix una vegada al numerador i una al denominador (i totes són no nul·les).
      fuites:
      - \(-1\)\^\{?3\}?
      teoria: []
    errors_comuns:
    - id: cancel_lacio_ingenua
      descripcio: |
        "Simplifica" formalment $\frac{\partial Y}{\partial x}\frac{\partial X}{\partial z}\frac{\partial Z}{\partial y}$ com si fossin fraccions i conclou que el producte és $1$.
      pregunta: |
        Els símbols $\partial Y$, $\partial X$… són nombres que es poden simplificar? Què obtens si calcules cada derivada per separat?
    - id: signe_formula
      descripcio: |
        Oblida el signe menys en la derivada de cada funció implícita.
      pregunta: |
        Si derives $F(x,Y(x,z),z)=0$ respecte de $x$, quina igualtat surt exactament?
    nota_professor: |
      Exemple clàssic (relació cíclica de la termodinàmica). Estrictament, $\frac{\partial Y}{\partial x}(p)$ vol dir $\frac{\partial Y}{\partial x}(p_1,p_3)$, etc.
- num: 24
  font: null
  preambul: |
    Considerem el sistema d'equacions
    $$\left.\begin{aligned}tx^3+xy^2+y-\tfrac{25}{4}t^3&=0\\ 3xy+t^2y^3-3x^2(t+1)-t+3&=0\end{aligned}\right\}$$
  indicacio: null
  exercicis:
  - id: t4-24a
    apartat: a
    tipus: calcul
    enunciat: |
      Al voltant de quins punts solució del sistema, de la forma $(x,y,t)=(1,0,t_0)$, el sistema defineix localment $x,y$ com a funcions derivables de $t$?

      Considerem $\gamma(t)=(x(t),y(t))$, on les funcions $x(t),y(t)$ venen definides localment per l'anterior sistema d'equacions. A $\gamma$ se l'anomena corba parametritzada.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        L'únic punt solució de la forma $(1,0,t_0)$ és $(1,0,0)$, i en ell el determinant de la jacobiana respecte de $(x,y)$ val $6\neq0$: el sistema defineix $x(t),y(t)$ de classe $\mathcal{C}^\infty$ en un entorn de $t=0$, amb $x(0)=1$, $y(0)=0$.
      fuites:
      - \(1,\s*0,\s*0\)
      - t_\{?0\}?\s*=\s*0\b
    passos:
    - id: punts_solucio
      titol: Trobar els punts solució
      objectiu: |
        Determinar per a quins $t_0$ el punt $(1,0,t_0)$ és solució del sistema.
      idea: |
        Substituir $x=1$, $y=0$ a les dues equacions i imposar que s'anul·lin les dues alhora.
      detall: |
        Primera equació: $t_0-\frac{25}{4}t_0^3=0$, amb solucions $t_0\in\{0,\pm\frac25\}$. Segona: $-3(t_0+1)-t_0+3=-4t_0=0$, és a dir $t_0=0$. L'únic punt solució és $(1,0,0)$.
      fuites:
      - -\s*4\s*t_\{?0\}?\s*=\s*0
      - \(1,\s*0,\s*0\)
      teoria: []
    - id: jacobiana
      titol: Hipòtesi del teorema de la funció implícita
      objectiu: |
        Decidir si en el punt trobat es pot aplicar el teorema per aïllar $(x,y)$ en funció de $t$.
      idea: |
        Calcular la submatriu jacobiana respecte de les variables que es volen aïllar, avaluar-la i mirar-ne el determinant.
      detall: |
        Amb $\Phi_1=tx^3+xy^2+y-\frac{25}{4}t^3$, $\Phi_2=3xy+t^2y^3-3x^2(t+1)-t+3$ (polinòmiques, $\mathcal{C}^\infty$): $\frac{\partial(\Phi_1,\Phi_2)}{\partial(x,y)}=\begin{pmatrix}3tx^2+y^2 & 2xy+1\\ 3y-6x(t+1) & 3x+3t^2y^2\end{pmatrix}$, que en $(1,0,0)$ és $\begin{pmatrix}0&1\\-6&3\end{pmatrix}$, amb determinant $0\cdot3-1\cdot(-6)=6\neq0$. Pel teorema de la funció implícita, $x(t),y(t)$ existeixen i són $\mathcal{C}^\infty$ (en particular derivables) en un entorn de $t=0$.
      fuites:
      - =\s*6\s*\\neq\s*0
      - pmatrix\}\s*0\s*&\s*1\s*\\\\\s*-\s*6\s*&\s*3
      teoria:
      - T4.13
    errors_comuns:
    - id: nomes_una_equacio
      descripcio: |
        Imposa només la primera equació i dona també $t_0=\pm\frac25$ com a punts vàlids.
      pregunta: |
        Un punt solució del sistema ha de satisfer quantes equacions? Has comprovat la segona per a cada candidat?
    - id: jacobiana_variables
      descripcio: |
        Calcula el determinant amb columnes equivocades (inclou la derivada respecte de $t$) o la jacobiana completa $2\times3$.
      pregunta: |
        Quines són les variables que vols escriure en funció de les altres? Respecte de quines has de derivar per a la condició del teorema?
    nota_professor: |
      Equacions verificades contra el PDF (pàgina 18). La pregunta "al voltant de quins punts" té resposta única perquè la segona equació força $t_0=0$.
  - id: t4-24b
    apartat: b
    tipus: calcul
    enunciat: |
      Calculeu $(x'(0),y'(0))$ (aquest vector és el vector tangent a la corba $\gamma$ en $t=0$).
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        $(x'(0),y'(0))=\left(-\frac76,-1\right)$.
      fuites:
      - -\s*\\[dt]?frac\s*\{?7\}?\s*\{?6\}?
      - -\s*7\s*/\s*6
      - y'\s*\(0\)\s*=\s*-\s*1\b
    passos:
    - id: sistema_lineal
      titol: Plantejar el sistema per a les derivades
      objectiu: |
        Sabent per (a) que $x(t),y(t)$ són derivables prop de $t=0$ amb $x(0)=1$, $y(0)=0$, obtenir un sistema lineal per a $x'(0)$, $y'(0)$.
      idea: |
        Derivar respecte de $t$ les dues identitats $\Phi_i(x(t),y(t),t)=0$ amb la regla de la cadena i avaluar en $t=0$ (o usar la fórmula matricial de la diferencial de la funció implícita).
      detall: |
        Necessitem també $\frac{\partial\Phi_1}{\partial t}=x^3-\frac{75}{4}t^2$, que en $(1,0,0)$ val $1$, i $\frac{\partial\Phi_2}{\partial t}=2ty^3-3x^2-1$, que val $-4$. Amb la jacobiana de (a): $0\cdot x'(0)+1\cdot y'(0)+1=0$ i $-6x'(0)+3y'(0)-4=0$.
      fuites:
      - -\s*6\s*x'\s*\(0\)\s*\+\s*3\s*y'\s*\(0\)\s*-\s*4
      teoria:
      - T4.15
      - T3.21
    - id: resoldre
      titol: Resoldre
      objectiu: |
        Calcular $x'(0)$ i $y'(0)$.
      idea: |
        Resoldre el sistema lineal $2\times2$ (la matriu és invertible per (a)).
      detall: |
        De la primera equació $y'(0)=-1$. Substituint: $-6x'(0)-3-4=0$, d'on $x'(0)=-\frac76$. Per tant $(x'(0),y'(0))=\left(-\frac76,-1\right)$.
      fuites:
      - -\s*\\[dt]?frac\s*\{?7\}?\s*\{?6\}?
      - -\s*7\s*/\s*6
      - y'\s*\(0\)\s*=\s*-\s*1\b
      teoria: []
    errors_comuns:
    - id: oblidar_derivada_t
      descripcio: |
        Oblida la dependència explícita de $t$ (els termes $\partial\Phi_i/\partial t$) i obté un sistema homogeni amb solució nul·la.
      pregunta: |
        Les equacions depenen de $t$ només a través de $x(t)$ i $y(t)$? Què passa amb termes com $-\frac{25}{4}t^3$ o $-t$?
    - id: termes_producte
      descripcio: |
        En derivar $tx^3$ o $-3x^2(t+1)$ només deriva un factor.
      pregunta: |
        El terme $-3x^2(t+1)$ és un producte de dues funcions de $t$. Quantes contribucions dona la seva derivada?
    - id: signe_sistema
      descripcio: |
        Escriu $J\,(x',y')^T=+\partial\Phi/\partial t$ en lloc de $-\partial\Phi/\partial t$.
      pregunta: |
        Si substitueixes la teva solució a la identitat derivada, dona realment zero?
    nota_professor: |
      Comprovat amb sympy.
  - id: t4-24c
    apartat: c
    tipus: calcul
    enunciat: |
      Donada $f(x,y)=x^2-2y+3$, calculeu la derivada de la funció $f\circ\gamma$ a l'origen.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        $(f\circ\gamma)'(0)=\nabla f(1,0)\cdot\gamma'(0)=(2,-2)\cdot\left(-\frac76,-1\right)=-\frac13$.
      fuites:
      - -\s*\\[dt]?frac\s*\{?1\}?\s*\{?3\}?
      - -\s*1\s*/\s*3\b
    passos:
    - id: regla_cadena
      titol: Aplicar la regla de la cadena
      objectiu: |
        Expressar $(f\circ\gamma)'(0)$ en termes de $f$ i $\gamma$, usant els resultats de (a) i (b).
      idea: |
        Regla de la cadena: jacobiana de $f$ en $\gamma(0)$ per $\gamma'(0)$. "L'origen" aquí és $t=0$; cal saber quin punt és $\gamma(0)$.
      detall: |
        $(f\circ\gamma)'(0)=\nabla f(\gamma(0))\cdot\gamma'(0)$, amb $\gamma(0)=(1,0)$ i $\gamma'(0)=\left(-\frac76,-1\right)$.
      fuites: []
      teoria:
      - T3.21
    - id: calcular
      titol: Calcular
      objectiu: |
        Obtenir el valor numèric.
      idea: |
        Calcular el gradient de $f$, avaluar-lo en $\gamma(0)$ i fer el producte escalar.
      detall: |
        $\nabla f(x,y)=(2x,-2)$, $\nabla f(1,0)=(2,-2)$. Llavors $(2,-2)\cdot\left(-\frac76,-1\right)=-\frac73+2=-\frac13$.
      fuites:
      - -\s*\\[dt]?frac\s*\{?1\}?\s*\{?3\}?
      - -\s*1\s*/\s*3\b
      - -\s*\\[dt]?frac\s*\{?7\}?\s*\{?3\}?\s*\+\s*2
      teoria:
      - T3.10
    errors_comuns:
    - id: gradient_a_l_origen
      descripcio: |
        Avalua $\nabla f$ en $(0,0)$ en lloc de $\gamma(0)=(1,0)$, interpretant "l'origen" com l'origen del pla $(x,y)$.
      pregunta: |
        La funció $f\circ\gamma$ depèn de $t$. Quin punt del pla $(x,y)$ correspon a $t=0$?
    - id: suma_en_lloc_de_producte
      descripcio: |
        Suma els vectors o multiplica components sense sumar-les (no fa el producte escalar).
      pregunta: |
        La derivada de $f\circ\gamma$ és un nombre. Quina operació entre $\nabla f$ i $\gamma'$ dona un nombre?
    nota_professor: |
      "A l'origen" vol dir en $t=0$ (origen del paràmetre); $\gamma(0)=(1,0)$ no és l'origen del pla.
- num: 25
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t4-25
    apartat: null
    tipus: calcul
    enunciat: |
      Determineu si la corba definida en forma implícita per $x^2+y+\cos(xy)=1$ es pot escriure de la forma $y=g(x)$ en un entorn de l'origen. I de la forma $x=h(y)$?
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        Sí de la forma $y=g(x)$ (amb $g\in\mathcal{C}^\infty$, $g(0)=0$), perquè $\frac{\partial F}{\partial y}(0,0)=1\neq0$ per a $F=x^2+y+\cos(xy)-1$. No de la forma $x=h(y)$: per a $0<y<\sqrt2$ no hi ha cap punt de la corba amb aquesta ordenada (de $1-\cos u\le u^2/2$ surt $y\le x^2(y^2/2-1)\le 0$), de manera que cap $h$ pot estar definida en un entorn de $y=0$; a més, per a $y<0$ petit hi ha dos punts $(\pm x,y)$ de la corba.
      fuites:
      - x\s*=\s*h\(y\)\$?[^.?]{0,25}\bno\b
      - \bno\b\s+(es\s+pot|existeix|és\s+possible|pot)[^.?]{0,40}x\s*=\s*h
      - \bno\s+existeix[^.?]{0,25}\bh\b
      - no\s+(hi\s+ha|t[ée])\s+(cap\s+)?punts?[^.?]{0,40}y\s*>\s*0
    passos:
    - id: y_de_x
      titol: Forma y=g(x)
      objectiu: |
        Decidir si la corba es pot escriure com $y=g(x)$ prop de l'origen.
      idea: |
        Escriure la corba com $F(x,y)=0$, comprovar que l'origen hi és i la hipòtesi del teorema de la funció implícita per aïllar $y$.
      detall: |
        $F(x,y)=x^2+y+\cos(xy)-1$, de classe $\mathcal{C}^\infty$, $F(0,0)=0$. $\frac{\partial F}{\partial y}=1-x\sin(xy)$, que en $(0,0)$ val $1\neq0$. Pel teorema de la funció implícita existeix $g\in\mathcal{C}^\infty$ en un entorn de $0$, $g(0)=0$, i prop de l'origen la corba és exactament la gràfica de $g$.
      fuites: []
      teoria:
      - T4.13
    - id: x_de_y_tfi
      titol: El teorema no decideix x=h(y)
      objectiu: |
        Veure si el teorema de la funció implícita permet aïllar $x$.
      idea: |
        Comprovar la hipòtesi del teorema respecte de $x$ i recordar que és una condició suficient, no necessària.
      detall: |
        $\frac{\partial F}{\partial x}=2x-y\sin(xy)$, i $\frac{\partial F}{\partial x}(0,0)=0$. El teorema no s'aplica; cal estudiar la corba directament.
      fuites:
      - \\partial\s*F\}?\s*\{\\partial\s*x\}\s*\(0,\s*0\)\s*=\s*0
      - F_\{?x\}?\s*\(0,\s*0\)\s*=\s*0
      teoria:
      - T4.13
    - id: x_de_y_directe
      titol: Estudi directe
      objectiu: |
        Decidir si existeix alguna $h$ definida en un entorn de $y=0$ amb $x=h(y)$ descrivint la corba prop de l'origen.
      idea: |
        Mirar quin signe pot tenir $y$ en els punts de la corba propers a l'origen. Una fita útil d'una variable: $1-\cos u\le \frac{u^2}{2}$ per a tot $u$ (no és a les notes, és de Càlcul d'una variable).
      detall: |
        A la corba, $y=1-\cos(xy)-x^2\le\frac{x^2y^2}{2}-x^2=x^2\left(\frac{y^2}{2}-1\right)$. Si $|y|<\sqrt2$, el segon membre és $\le0$, per tant tot punt de la corba amb $|y|<\sqrt2$ té $y\le0$. Així, per a $0<y<\sqrt2$ no hi ha cap $x$ amb $(x,y)$ a la corba, i no pot existir $h$ definida en un entorn de $0$. (A més, $F(-x,y)=F(x,y)$: per a $y<0$ petit els punts són parells $(\pm x,y)$, i tampoc hi hauria unicitat.) Coherentment, $g'(0)=0$ i $g''(0)=-2$: la corba és com la paràbola $y=-x^2$.
      fuites:
      - \\[dt]?frac\s*\{y\^\{?2\}?\}\s*\{?2\}?\s*-\s*1
      - y\^\{?2\}?\s*/\s*2\s*-\s*1
      - g''\s*\(0\)\s*=\s*-\s*2
      - \by\s*(\\le|\\leq|\\leqslant|≤)\s*0\b
      teoria: []
    errors_comuns:
    - id: tfi_necessaria
      descripcio: |
        Conclou que no es pot escriure $x$ en funció de $y$ només perquè $\partial F/\partial x(0,0)=0$.
      pregunta: |
        El teorema de la funció implícita dona una condició suficient o necessària? Què et diu quan la hipòtesi falla?
    - id: confondre_variables
      descripcio: |
        Comprova la derivada respecte de $x$ per a la forma $y=g(x)$ (intercanvia els papers).
      pregunta: |
        Si vols $y$ en funció de $x$, respecte de quina variable ha de ser no nul·la la derivada?
    - id: argument_camins
      descripcio: |
        Argumenta amb dibuixos o aproximacions ($y\approx-x^2$) sense una justificació rigorosa que per a $y>0$ no hi ha solucions.
      pregunta: |
        El que afirmes sobre els punts de la corba propers a l'origen, ho pots demostrar amb una desigualtat en lloc d'una aproximació o un dibuix?
    nota_professor: |
      Argument alternatiu: $g$ és parella (unicitat més simetria) amb $g(0)=0$, $g'(0)=0$, $g''(0)=-2$, per tant màxim local estricte en 0; cada $y<0$ petit té dues antiimatges i cap $y>0$ en té.
- num: 26
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t4-26
    apartat: null
    tipus: teoric
    enunciat: |
      Demostreu que existeix un entorn obert $U\subseteq\mathbb{R}$ de $-1$ i funcions $u,v:U\to\mathbb{R}$ de classe $\mathcal{C}^1$ tals que $u(-1)=v(-1)=1$ i
      $$\left.\begin{aligned}xe^{u(x)}+u(x)e^{v(x)}&=0\\ xe^{v(x)}+v(x)e^{u(x)}&=0\end{aligned}\right\}$$
    teoria:
    - T3.31
    teoria_reservada: []
    resultat:
      valor: |
        Sigui $\Phi(x,u,v)=(xe^u+ue^v,\,xe^v+ve^u)$, de classe $\mathcal{C}^\infty$, amb $\Phi(-1,1,1)=(0,0)$ i $\det\frac{\partial\Phi}{\partial(u,v)}(-1,1,1)=\det\begin{pmatrix}0&e\\e&0\end{pmatrix}=-e^2\neq0$. Pel teorema de la funció implícita existeixen un entorn obert $U$ de $-1$ i $(u,v):U\to\mathbb{R}^2$ de classe $\mathcal{C}^\infty$ (en particular $\mathcal{C}^1$) amb $u(-1)=v(-1)=1$ i $\Phi(x,u(x),v(x))=0$.
      fuites: []
    passos:
    - id: plantejar
      titol: Plantejar el sistema com Φ=0
      objectiu: |
        Escriure el problema en el llenguatge del teorema de la funció implícita i comprovar que el punt de partida és solució.
      idea: |
        Definir $\Phi:\mathbb{R}^3\to\mathbb{R}^2$ amb variables $(x,u,v)$, on $x$ és la independent, i avaluar-la en el punt que dicten les condicions inicials.
      detall: |
        $\Phi(x,u,v)=(xe^u+ue^v,\,xe^v+ve^u)$ és $\mathcal{C}^\infty$ (sumes i productes d'exponencials i polinomis). $\Phi(-1,1,1)=(-e+e,-e+e)=(0,0)$.
      fuites: []
      teoria:
      - T3.31
    - id: jacobiana
      titol: Determinant respecte de (u,v)
      objectiu: |
        Comprovar la hipòtesi del teorema que permet aïllar $(u,v)$ en funció de $x$, i concloure.
      idea: |
        Calcular la matriu de derivades parcials de $\Phi$ respecte de $u$ i $v$ en el punt i el seu determinant.
      detall: |
        $\frac{\partial\Phi}{\partial(u,v)}=\begin{pmatrix}xe^u+e^v & ue^v\\ ve^u & xe^v+e^u\end{pmatrix}$, que en $(-1,1,1)$ és $\begin{pmatrix}0&e\\e&0\end{pmatrix}$, amb determinant $-e^2\neq0$. El teorema de la funció implícita dona un obert $U\ni-1$ i $(u,v)\in\mathcal{C}^\infty(U)\subseteq\mathcal{C}^1(U)$ amb $(u,v)(-1)=(1,1)$ i que satisfan el sistema per a tot $x\in U$.
      fuites:
      - -\s*e\^\{?2\}?
      teoria:
      - T4.13
    errors_comuns:
    - id: derivar_respecte_x
      descripcio: |
        Calcula el determinant respecte de variables equivocades (inclou $x$) o pren la jacobiana $2\times3$ completa.
      pregunta: |
        Quines són les incògnites que vols posar en funció de $x$? Respecte de quines cal derivar?
    - id: oblidar_derivar_productes
      descripcio: |
        En derivar $ue^v$ respecte de $u$ oblida un dels termes, o respecte de $v$ oblida el factor $u$.
      pregunta: |
        Quantes dependències de $u$ i de $v$ hi ha a la primera equació? Has derivat cadascuna?
    nota_professor: |
      Derivant: $\begin{pmatrix}0&e\\e&0\end{pmatrix}\begin{pmatrix}u'\\v'\end{pmatrix}=-\begin{pmatrix}e\\e\end{pmatrix}$, d'on $u'(-1)=v'(-1)=-1$ (no demanat).
- num: 27
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t4-27
    apartat: null
    tipus: calcul
    enunciat: |
      Demostreu que la corba d'equació
      $$xy=\log\left(\frac{x}{y}\right)$$
      és la gràfica d'una funció $f$ de classe $\mathcal{C}^\infty$ en un entorn de $x=\sqrt{e}$. Té $f$ un extrem local en $x=\sqrt{e}$?
    teoria:
    - T3.31
    - T5.9
    teoria_reservada: []
    resultat:
      valor: |
        Per a $x=\sqrt e$ l'únic punt de la corba és $y_0=1/\sqrt e$. Amb $F(x,y)=xy-\log x+\log y$ ($x,y>0$), $\frac{\partial F}{\partial y}(\sqrt e,1/\sqrt e)=2\sqrt e\neq0$, i el teorema de la funció implícita dona $f\in\mathcal{C}^\infty$ amb $f(\sqrt e)=1/\sqrt e$. A més $f'(\sqrt e)=0$ i $f''(\sqrt e)=-\frac{1}{2e^{3/2}}<0$: $f$ té un màxim local estricte en $x=\sqrt e$.
      fuites:
      - m[àa]xim\s+local
      - \bés\s+un\s+m[àa]xim
      - -\s*\\[dt]?frac\s*\{1\}\s*\{2\s*e\s*(\^|\\sqrt)
    passos:
    - id: punt
      titol: Trobar el punt de la corba
      objectiu: |
        Trobar quin punt $(\sqrt e,y_0)$ és a la corba.
      idea: |
        Observar el domini (cal $x/y>0$) i provar valors que simplifiquin el logaritme; justificar la unicitat per monotonia en $y$.
      detall: |
        Com que $x=\sqrt e>0$, cal $y>0$. L'equació és $\sqrt e\,y=\frac12-\log y$; el membre esquerre és creixent i el dret decreixent en $y$, per tant hi ha com a màxim una solució, i $y_0=\frac{1}{\sqrt e}$ ho és: $1=\frac12+\frac12$.
      fuites:
      - \\[dt]?frac\s*\{?1\}?\s*\{\\sqrt\s*\{?e\}?\}
      - 1\s*/\s*\\sqrt\s*\{?e\}?
      - e\^\{\s*-\s*(1/2|\\[dt]?frac\s*\{?1\}?\s*\{?2\}?)\s*\}
      teoria: []
    - id: tfi
      titol: Aplicar el teorema de la funció implícita
      objectiu: |
        Justificar que, prop d'aquest punt, la corba és la gràfica d'una funció $\mathcal{C}^\infty$ de $x$.
      idea: |
        Escriure $F(x,y)=0$ en un obert on $F$ sigui $\mathcal{C}^\infty$ i comprovar la hipòtesi sobre la derivada respecte de $y$.
      detall: |
        A l'obert $x,y>0$, $F(x,y)=xy-\log x+\log y$ és $\mathcal{C}^\infty$. $\frac{\partial F}{\partial y}=x+\frac1y$, que en el punt val $\sqrt e+\sqrt e=2\sqrt e\neq0$. Pel teorema de la funció implícita hi ha un interval obert $I\ni\sqrt e$ i $f\in\mathcal{C}^1(I)$ amb $f(\sqrt e)=1/\sqrt e$, $f>0$, $F_y(x,f(x))\neq0$ en $I$, i prop del punt la corba és exactament la gràfica de $f$. A més $f'=-\frac{F_x(x,f)}{F_y(x,f)}$; si $f\in\mathcal{C}^k$ el segon membre és $\mathcal{C}^k$, així que $f\in\mathcal{C}^{k+1}$, i per inducció $f\in\mathcal{C}^\infty(I)$ (les notes ho abreugen aplicant el teorema amb $r=\infty$).
      fuites:
      - 2\s*\\sqrt\s*\{?e\}?\s*\\neq
      teoria:
      - T4.13
      - T3.31
    - id: punt_critic
      titol: Derivada primera
      objectiu: |
        Calcular $f'(\sqrt e)$.
      idea: |
        Derivar la identitat $F(x,f(x))=0$ respecte de $x$ i avaluar.
      detall: |
        $f+xf'-\frac1x+\frac{f'}{f}=0$. En $x=\sqrt e$, $f=1/\sqrt e$: $\frac{1}{\sqrt e}-\frac{1}{\sqrt e}+2\sqrt e\,f'(\sqrt e)=0$, per tant $f'(\sqrt e)=0$: és un punt crític.
      fuites:
      - f'\s*\(\\sqrt\s*\{?e\}?\)\s*=\s*0
      teoria:
      - T4.15
      - T3.21
    - id: segona_derivada
      titol: Classificar amb la derivada segona
      objectiu: |
        Decidir si hi ha extrem local i de quin tipus.
      idea: |
        Tornar a derivar la identitat, usar $f'(\sqrt e)=0$ per simplificar i aplicar el criteri de la derivada segona.
      detall: |
        Derivant de nou: $2f'+xf''+\frac{1}{x^2}+\frac{f''}{f}-\frac{f'^2}{f^2}=0$. En el punt ($f'=0$): $f''(\sqrt e)\,(\sqrt e+\sqrt e)=-\frac1e$, d'on $f''(\sqrt e)=-\frac{1}{2e^{3/2}}<0$. Pel criteri de la derivada $r$-èsima amb $r=2$, $x=\sqrt e$ és un màxim local estricte de $f$.
      fuites:
      - -\s*\\[dt]?frac\s*\{1\}\s*\{2\s*e\s*(\^|\\sqrt)
      - m[àa]xim\s+local
      - \bés\s+un\s+m[àa]xim
      teoria:
      - T5.11
    errors_comuns:
    - id: domini_log
      descripcio: |
        Treballa amb $\log x-\log y$ sense comprovar que $x,y>0$, o busca solucions amb $y<0$.
      pregunta: |
        Per a quins valors de $y$ té sentit $\log(x/y)$ quan $x=\sqrt e$?
    - id: critic_implica_extrem
      descripcio: |
        Conclou que hi ha extrem només perquè $f'(\sqrt e)=0$.
      pregunta: |
        Que la derivada s'anul·li, és suficient per tenir un extrem? Quina informació addicional necessites?
    - id: termes_segona_derivada
      descripcio: |
        En derivar per segon cop oblida el terme de $\log f$ (la derivada de $f'/f$) o el de $xf'$.
      pregunta: |
        La derivada de $\log f(x)$ és $f'/f$. Què dona derivar aquest quocient?
    nota_professor: |
      Alternativa: $f''(\sqrt e)=-\frac{F_{xx}}{F_y}$ en un punt crític, amb $F_{xx}=1/x^2=1/e$. Comprovat amb sympy.
- num: 28
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t4-28a
    apartat: a
    tipus: teoric
    enunciat: |
      Considereu $F:U\subseteq\mathbb{R}^2\to\mathbb{R}$ de classe $\mathcal{C}^1$ i $p\in U$ tal que $F(p)=0$. Suposem que, en un entorn de $p$, l'equació $F(x,y)=0$ defineix localment $y$ com a funció implícita de $x$, $y=g(x)$. Demostreu que, si $\frac{\partial F}{\partial x}(p)\neq 0$ i $\frac{\partial F}{\partial y}(p)=0$, llavors $g$ no és de classe $\mathcal{C}^1$.
    teoria:
    - T3.2
    - T3.31
    teoria_reservada: []
    resultat:
      valor: |
        Sigui $p=(x_0,y_0)$. Si $g$ fos $\mathcal{C}^1$ (en particular derivable en $x_0$), derivant $F(x,g(x))=0$ amb la regla de la cadena en $x_0$ s'obtindria $\frac{\partial F}{\partial x}(p)+\frac{\partial F}{\partial y}(p)\,g'(x_0)=0$, és a dir $\frac{\partial F}{\partial x}(p)=0$, contradicció. Per tant $g$ no és $\mathcal{C}^1$ (de fet, ni tan sols derivable en $x_0$).
      fuites: []
    passos:
    - id: suposar
      titol: Plantejar per reducció a l'absurd
      objectiu: |
        Escriure què es té si se suposa que $g$ és $\mathcal{C}^1$.
      idea: |
        Suposar el contrari i escriure la identitat que satisfà $g$ en un entorn de $x_0$, on $p=(x_0,y_0)$.
      detall: |
        Suposem $g\in\mathcal{C}^1$ en un entorn de $x_0$, amb $g(x_0)=y_0$ i $F(x,g(x))=0$ per a tot $x$ d'aquest entorn.
      fuites: []
      teoria: []
    - id: derivar
      titol: Derivar la identitat i arribar a contradicció
      objectiu: |
        Obtenir una contradicció amb les hipòtesis sobre les derivades parcials de $F$.
      idea: |
        Derivar la identitat amb la regla de la cadena (cal que $F$ sigui diferenciable i $g$ derivable) i avaluar en $x_0$.
      detall: |
        $F$ és $\mathcal{C}^1$, per tant diferenciable, i $x\mapsto(x,g(x))$ és derivable. Per la regla de la cadena, $0=\frac{d}{dx}F(x,g(x))\big|_{x_0}=\frac{\partial F}{\partial x}(p)+\frac{\partial F}{\partial y}(p)g'(x_0)=\frac{\partial F}{\partial x}(p)$, que contradiu $\frac{\partial F}{\partial x}(p)\neq0$.
      fuites: []
      teoria:
      - T3.21
      - T3.18
    errors_comuns:
    - id: aplicar_formula
      descripcio: |
        Escriu $g'=-F_x/F_y$ i diu que "divideix per zero", sense justificar d'on surt la fórmula ni que sigui aplicable.
      pregunta: |
        La fórmula $g'=-F_x/F_y$ d'on surt? Què pots escriure abans de dividir per $F_y$?
    - id: invoca_tfi
      descripcio: |
        Diu que el teorema de la funció implícita "no s'aplica" i per tant $g$ no és $\mathcal{C}^1$.
      pregunta: |
        Si les hipòtesis d'un teorema no es compleixen, la conclusió és necessàriament falsa?
    nota_professor: |
      Només cal la derivabilitat de $g$ en $x_0$; la conclusió és més forta: $g$ no és derivable en $x_0$. Exemple: $F=x-y^3$ en $(0,0)$, $g(x)=x^{1/3}$.
  - id: t4-28b
    apartat: b
    tipus: teoric
    enunciat: |
      Doneu un exemple de funció $F:U\subseteq\mathbb{R}^2\to\mathbb{R}$ de classe $\mathcal{C}^1$ i un punt $p\in U$, tals que $F(p)=0$, $\nabla F(p)=0$ i l'equació $F(x,y)=0$ defineixi $y$ com a funció de classe $\mathcal{C}^1$ de $x$, en un entorn de $p$. Contradiu això el teorema de la funció implícita?
    teoria:
    - T3.10
    - T3.31
    teoria_reservada: []
    resultat:
      valor: |
        Per exemple $F(x,y)=y^3$ (o $F(x,y)=(y-x)^2$) i $p=(0,0)$: $F(p)=0$, $\nabla F(p)=(0,0)$ i $F(x,y)=0\iff y=0$ (resp. $y=x$), funció $\mathcal{C}^1$ de $x$. No contradiu el teorema: la condició $\frac{\partial F}{\partial y}(p)\neq0$ és suficient però no necessària.
      fuites: []
    passos:
    - id: exemple
      titol: Construir un exemple
      objectiu: |
        Trobar $F$ de classe $\mathcal{C}^1$ i $p$ amb $F(p)=0$, $\nabla F(p)=0$, el conjunt de zeros de la qual sigui la gràfica d'una funció $\mathcal{C}^1$ prop de $p$.
      idea: |
        Partir d'una corba que sigui la gràfica d'una funció suau (per exemple una recta) i elevar l'equació a una potència: el conjunt de zeros no canvia però el gradient s'anul·la.
      detall: |
        $F(x,y)=y^3$, $p=(0,0)$: $F$ és $\mathcal{C}^\infty$, $F(p)=0$, $\nabla F=(0,3y^2)$ i $\nabla F(p)=(0,0)$. $F(x,y)=0\iff y=0$, és a dir, $y=g(x)\equiv0$, que és $\mathcal{C}^1$. (Igualment $F=(y-x)^2$ amb $g(x)=x$.)
      fuites:
      - F\s*\(x,\s*y\)\s*=\s*y\^\{?3\}?
      teoria:
      - T3.10
    - id: no_contradiccio
      titol: Relació amb el teorema
      objectiu: |
        Decidir si l'exemple contradiu el teorema de la funció implícita.
      idea: |
        Analitzar l'estructura lògica del teorema: què afirma quan es compleixen les hipòtesis i què (no) afirma quan fallen.
      detall: |
        No el contradiu. El teorema diu: si $\frac{\partial F}{\partial y}(p)\neq0$, aleshores existeix la funció implícita. És una condició suficient; quan falla, el teorema no afirma res, i la funció implícita pot existir o no.
      fuites: []
      teoria:
      - T4.13
    errors_comuns:
    - id: suficient_necessaria
      descripcio: |
        Creu que $\frac{\partial F}{\partial y}(p)\neq0$ és necessària per a l'existència de la funció implícita.
      pregunta: |
        El teorema té la forma "si A llavors B". Què pots deduir si A és fals?
    - id: exemple_amb_a
      descripcio: |
        Proposa un exemple amb $\frac{\partial F}{\partial x}(p)\neq0$ (per exemple $F=x-y^3$), que per l'apartat (a) no pot donar $g$ de classe $\mathcal{C}^1$, o oblida comprovar $\nabla F(p)=0$.
      pregunta: |
        El teu exemple compleix totes les condicions de l'enunciat? Què et diu l'apartat (a) si alguna derivada parcial no s'anul·la?
    nota_professor: |
      Qualsevol $F=(y-g(x))^k$ amb $k\ge2$ i $g\in\mathcal{C}^1$ serveix.
