    - id: conclou_no_existeix
      descripcio: |
        Creu erròniament que el límit no existeix (p. ex. per un càlcul de camí mal fet).
      pregunta: |
        Pots refer el càlcul pel camí que t'ha donat un valor diferent, pas a pas?
    nota_professor: |
      Exercici clàssic per veure que els camins només donen candidat. Les polars són incòmodes aquí; la fita $x^4\le x^4+y^2$ és el camí net.
  - id: t2-4d
    apartat: d
    tipus: calcul
    enunciat: |
      $\displaystyle\lim_{(x,y)\to(0,0)}\frac{3\sin(xy)}{xy}$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        $3$
      fuites:
      - l[íi]mit\s+(és|val|dona|=)\s*\$?\s*3\b
    passos:
    - id: domini
      titol: Entendre el domini
      objectiu: |
        Determinar on està definida la funció i si té sentit el límit a $(0,0)$.
      idea: |
        El límit només considera punts del domini; cal que l'origen en sigui punt d'acumulació, no que hi pertanyi.
      detall: |
        Domini: $\Omega=\{(x,y): xy\neq 0\}$ (el pla sense els eixos). L'origen és punt d'acumulació de $\Omega$ (p. ex. $(1/n,1/n)\in\Omega$), així que el límit té sentit.
      fuites: []
      teoria:
      - T1.14
      - T2.6
    - id: canvi_variable
      titol: Reduir a una variable
      objectiu: |
        Reduir el problema a un límit d'una variable.
      idea: |
        L'expressió només depèn del producte $xy$, que tendeix a $0$; escriu $f$ com una composició amb una funció d'una variable.
      detall: |
        Sigui $g(t)=\frac{\sin t}{t}$ per a $t\neq0$ i $g(0)=1$, contínua a $\mathbb{R}$. Llavors $f(x,y)=3\,g(xy)$ a $\Omega$, i $(x,y)\mapsto xy$ és contínua amb valor $0$ a l'origen.
      fuites:
      - g\(xy\)
      - t\s*=\s*xy
      - u\s*=\s*xy
      teoria:
      - T2.19
    - id: limit_fonamental
      titol: Límit fonamental
      objectiu: |
        Calcular el límit fent servir un límit conegut d'una variable.
      idea: |
        El límit $\lim_{t\to 0}\frac{\sin t}{t}$ és un límit fonamental d'una variable.
      detall: |
        $\lim_{t\to0}\frac{\sin t}{t}=1$, per tant $3\,g(xy)\to 3\,g(0)=3\cdot1=3$.
      fuites:
      - \\frac\{\\sin\s*t\}\{t\}\s*(\\to|=)\s*1
      - 3\s*(\\cdot)?\s*1\s*=\s*3
      - \\d?frac\{\\sin\s*\(?\s*xy\s*\)?\}\{xy\}\s*(\\to|=|→)\s*1
      teoria:
      - T2.19
    errors_comuns:
    - id: no_definida_no_existeix
      descripcio: |
        Diu que el límit no existeix perquè la funció no està definida als eixos.
      pregunta: |
        Per calcular un límit, cal que la funció estigui definida al punt, o només a prop del punt (dins del domini)?
    - id: lhopital_dues_variables
      descripcio: |
        Intenta aplicar L'Hôpital directament en dues variables.
      pregunta: |
        L'Hôpital és un resultat d'una variable. Hi ha alguna manera de convertir aquest límit en un d'una sola variable?
    - id: oblida_constant
      descripcio: |
        Oblida el factor $3$ i dona $1$ com a resultat.
      pregunta: |
        Revisa el numerador: quin factor multiplica el sinus?
  - id: t2-4e
    apartat: e
    tipus: calcul
    enunciat: |
      $\displaystyle\lim_{(x,y)\to(0,0)}\left(\frac{e^{x(y-1)-x-1}}{x^2+y^2},\ \sin\left(x-y\right)\right)$.
    teoria:
    - T2.1
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        El límit no existeix (a $\mathbb{R}^2$): la segona component tendeix a $0$, però la primera tendeix a $+\infty$ (numerador $\to e^{-1}>0$, denominador $\to 0^+$), de manera que no té límit finit.
      fuites:
      - l[íi]mit(\s+(a|en)\s+\$?\(0,\s*0\)\$?|\s+global|\s+de\s+\$?f\$?)?\s+no\s+existeix
      - no\s+existeix\s+(el\s+)?l[íi]mit
      - \$?f\$?\s+no\s+t[ée]\s+l[íi]mit
      - \\to\s*\+\s*\\infty
      - tendeix\s+a\s*\$?\s*\+\s*\\infty
    passos:
    - id: components
      titol: Separar per components
      objectiu: |
        Decidir com es redueix el límit d'una funció vectorial a límits de funcions escalars.
      idea: |
        Estudiar per separat cada component: el límit vectorial existeix si i només si existeix el de cada component (la norma euclidiana controla cada coordenada i al revés).
      detall: |
        Si existeixen $\lim f_1=b_1$ i $\lim f_2=b_2$, el límit és $(b_1,b_2)$; recíprocament, com que $|f_i-b_i|\le\|f-b\|$, si el límit vectorial existeix, existeix el de cada component. Cal estudiar $f_1$ i $f_2$.
      fuites: []
      teoria:
      - T2.9
      - T2.x1
    - id: segona_component
      titol: Segona component
      objectiu: |
        Calcular el límit de $\sin(x-y)$.
      idea: |
        És una composició de funcions contínues.
      detall: |
        $\sin(x-y)$ és contínua (composició de contínues), per tant tendeix a $\sin 0=0$.
      fuites:
      - \\sin\s*0\s*=\s*0
      teoria:
      - T2.19
    - id: primera_component
      titol: Primera component
      objectiu: |
        Estudiar el comportament de $\frac{e^{x(y-1)-x-1}}{x^2+y^2}$ a prop de l'origen, començant per numerador i denominador per separat.
      idea: |
        Mira on tendeix el numerador per continuïtat (atenció: tot $x(y-1)-x-1$ és l'exponent) i on tendeix el denominador; no és una indeterminació $0/0$.
      detall: |
        L'exponent $x(y-1)-x-1\to -1$, així que el numerador $\to e^{-1}>0$, mentre que $x^2+y^2\to 0^+$. A prop de l'origen el numerador és $\ge \frac{1}{2e}$, i per tant $f_1(x,y)\ge\frac{1}{2e\,(x^2+y^2)}\to+\infty$: $f_1$ no és fitada en cap entorn de l'origen.
      fuites:
      - e\^\{-1\}
      - \\frac\{1\}\{2e
      - \\to\s*\+\s*\\infty
      teoria:
      - T2.19
      - T2.20
    - id: concloure
      titol: Conclusió
      objectiu: |
        Decidir què passa amb el límit de la funció vectorial.
      idea: |
        Una funció amb límit finit en un punt ha de ser fitada en un entorn d'aquest punt (pren $\epsilon=1$ a la definició).
      detall: |
        Si existís $\lim f_1=b_1\in\mathbb{R}$, amb $\epsilon=1$ tindríem $|f_1|<|b_1|+1$ a prop de l'origen, cosa falsa. Per tant $f_1$ no té límit i el límit vectorial no existeix.
      fuites:
      - l[íi]mit\s+vectorial\s+no\s+existeix
      teoria:
      - T2.6
    errors_comuns:
    - id: llegeix_malament_exponent
      descripcio: |
        Llegeix l'enunciat com $e^{x(y-1)}-x-1$ (amb $-x-1$ fora de l'exponent) i fa un desenvolupament de Taylor innecessari.
      pregunta: |
        Mira bé l'enunciat: el $-x-1$ forma part de l'exponent o està restant l'exponencial? Què val el numerador a l'origen?
    - id: fals_indeterminacio
      descripcio: |
        Tracta la primera component com una indeterminació $0/0$ i busca camins o fites.
      pregunta: |
        Què val exactament el numerador quan $(x,y)=(0,0)$? És zero?
    - id: nomes_una_component
      descripcio: |
        Calcula només una component i en dedueix el límit vectorial.
      pregunta: |
        Quina condició han de complir les components perquè existeixi el límit d'una funció vectorial?
    nota_professor: |
      Enunciat verificat contra el PDF (pàg. 8): l'exponent és realment $x(y-1)-x-1$, i la transcripció hi coincideix. Tal com està imprès, el límit és trivial (la primera component tendeix a $+\infty$). Probablement és un error tipogràfic de l'enunciat original; amb les lectures plausibles el límit tampoc existeix: amb $\frac{e^{x(y-1)}-x-1}{x^2+y^2}$, sobre $y=0$ es comporta com $-2/x$; amb $\frac{e^{x(y-1)}+x-1}{x^2+y^2}$ o $\frac{e^{x(y+1)}-x-1}{x^2+y^2}$ el numerador és $xy+\frac{x^2}{2}+O(r^3)$ i sobre $y=mx$ dona $\frac{m+1/2}{1+m^2}$, que depèn de $m$. Si l'alumne treballa amb una d'aquestes lectures, cal fer-li notar l'enunciat.
  - id: t2-4f
    apartat: f
    tipus: calcul
    enunciat: |
      $\displaystyle\lim_{(x,y,z)\to(0,0,0)}\frac{x^3+z^5}{\sqrt{x^2+2y^2+4z^2}}$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        $0$
      fuites:
      - l[íi]mit\s+(és|val|dona|=)\s*\$?\s*0\b
    passos:
    - id: fita_denominador
      titol: Fitar el denominador per baix
      objectiu: |
        Comparar el denominador amb la norma euclidiana $\rho=\sqrt{x^2+y^2+z^2}$.
      idea: |
        Mira els coeficients del radicand: són tots més grans o iguals que $1$?
      detall: |
        $x^2+2y^2+4z^2\ge x^2+y^2+z^2$, per tant $\sqrt{x^2+2y^2+4z^2}\ge\sqrt{x^2+y^2+z^2}=\rho$.
      fuites:
      - (\\ge|\\geq|≥)\s*\\sqrt\{\s*x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*\+\s*z\^\{?2\}?\s*\}
      - (\\ge|\\geq|≥)\s*x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*\+\s*z\^\{?2\}?
      - (\\ge|\\geq|≥)\s*\\rho\b
      teoria: []
    - id: fita_numerador
      titol: Fitar el numerador
      objectiu: |
        Fitar el numerador, i després el quocient, en funció de $\rho$.
      idea: |
        Cada coordenada està fitada per la norma: $|x|\le\rho$, $|z|\le\rho$.
      detall: |
        $|x^3+z^5|\le\rho^3+\rho^5$, per tant $|f|\le\frac{\rho^3+\rho^5}{\rho}=\rho^2+\rho^4$.
      fuites:
      - \\rho\^\{?2\}?\s*\+\s*\\rho\^\{?4\}?
      teoria: []
    - id: concloure
      titol: Concloure amb el sandvitx
      objectiu: |
        Deduir el valor del límit a partir de la fita.
      idea: |
        Una fita del mòdul que tendeix a $0$ amb $\rho$ dona directament la definició $\epsilon$-$\delta$.
      detall: |
        $0\le|f|\le\rho^2+\rho^4\le 2\rho^2$ si $\rho\le1$; donat $\epsilon>0$, amb $\delta=\min(1,\sqrt{\epsilon/2})$ tenim $|f|<\epsilon$. El límit és $0$.
      fuites: []
      teoria:
      - T2.6
    errors_comuns:
    - id: fita_incorrecta
      descripcio: |
        Fita el denominador en el sentit equivocat (per dalt) o fa una desigualtat falsa.
      pregunta: |
        Per fitar un quocient per dalt, el denominador l'has de fer més gran o més petit?
    - id: esferiques_embolic
      descripcio: |
        Passa a coordenades esfèriques i s'embolica amb el denominador no esfèric.
      pregunta: |
        Cal canviar de coordenades, o n'hi ha prou de comparar el denominador amb la norma?
    - id: camins_com_a_prova
      descripcio: |
        Conclou només amb camins.
      pregunta: |
        Els camins et donen un candidat; què et falta per demostrar-lo?
  - id: t2-4g
    apartat: g
    tipus: calcul
    enunciat: |
      $\displaystyle\lim_{(x,y,z)\to(0,0,0)}e^{-1/(x^2+y^2+z^2)}$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        $0$
      fuites:
      - l[íi]mit\s+(és|val|dona|=)\s*\$?\s*0\b
    passos:
    - id: canvi_variable
      titol: Reduir a una variable
      objectiu: |
        Reduir-ho a un límit d'una variable.
      idea: |
        La funció només depèn de $x^2+y^2+z^2$: quins valors pren aquesta quantitat a prop de l'origen?
      detall: |
        Amb $t=x^2+y^2+z^2$, tenim $t>0$ fora de l'origen i $t\to 0^+$.
      fuites:
      - t\s*\\to\s*0\^\{?\+\}?
      teoria: []
    - id: exponent
      titol: Comportament de l'exponent
      objectiu: |
        Veure cap a on va l'exponent.
      idea: |
        Quan $t$ és petit i positiu, què fa $1/t$? I el seu oposat?
      detall: |
        $-\frac{1}{t}\to-\infty$ quan $t\to0^+$.
      fuites:
      - \\to\s*-\s*\\infty
      teoria: []
    - id: exponencial
      titol: Límit de l'exponencial
      objectiu: |
        Concloure el valor del límit.
      idea: |
        Comportament de $e^s$ quan $s$ es fa molt negatiu; per fer-ho rigorós, la funció d'una variable $g(t)=e^{-1/t}$ ($t>0$), $g(0)=0$, és contínua a $[0,\infty)$, i es compon amb $(x,y,z)\mapsto x^2+y^2+z^2$.
      detall: |
        $e^{s}\to0$ quan $s\to-\infty$; per tant $g$ és contínua a $0$ i $f=g(x^2+y^2+z^2)\to g(0)=0$. El límit és $0$.
      fuites: []
      teoria:
      - T2.19
    errors_comuns:
    - id: indeterminat
      descripcio: |
        Diu que $-1/0$ és indeterminat i conclou que el límit no existeix.
      pregunta: |
        El denominador $x^2+y^2+z^2$ pot ser negatiu? Què fa $1/t$ quan $t$ és petit i positiu?
    - id: signe_exponent
      descripcio: |
        Oblida el signe menys i creu que tendeix a $+\infty$.
      pregunta: |
        Fixa't en el signe de l'exponent: cap on tendeix $-1/t$?
- num: 5
  font: null
  preambul: |
    Estudieu el límit a $(0,0)$ de la restricció de les funcions següents a qualsevol recta que passa per $(0,0)$ i esbrineu si existeix el límit $\lim_{(x,y)\to(0,0)}f(x,y)$ per a les funcions següents:
  indicacio: null
  exercicis:
  - id: t2-5a
    apartat: a
    tipus: calcul
    enunciat: |
      $f(x,y)=\dfrac{xy}{x^2+y^2}$.
    teoria:
    - T2.6
    teoria_reservada:
    - T2.13
    resultat:
      valor: |
        Sobre la recta $y=mx$ el límit és $\frac{m}{1+m^2}$; sobre la recta $x=0$ és $0$. Com que depèn de la recta (p. ex. $0$ per a $m=0$ i $\frac12$ per a $m=1$), el límit $\lim_{(x,y)\to(0,0)}f(x,y)$ no existeix.
      fuites:
      - l[íi]mit(\s+(a|en)\s+\$?\(0,\s*0\)\$?|\s+global|\s+de\s+\$?f\$?)?\s+no\s+existeix
      - no\s+existeix\s+(el\s+)?l[íi]mit
      - \$?f\$?\s+no\s+t[ée]\s+l[íi]mit
      - \\frac\{m\}\{1\s*\+\s*m\^\{?2\}?\}
      - m\s*/\s*\(1\s*\+\s*m\^\{?2
    passos:
    - id: restriccio
      titol: Restringir a les rectes
      objectiu: |
        Parametritzar totes les rectes per l'origen i calcular el límit de $f$ sobre cadascuna.
      idea: |
        Les rectes per l'origen són $y=mx$ ($m\in\mathbb{R}$) i la recta vertical $x=0$; substitueix i simplifica.
      detall: |
        $f(x,mx)=\frac{mx^2}{x^2+m^2x^2}=\frac{m}{1+m^2}$ (constant, $x\neq0$), de límit $\frac{m}{1+m^2}$. Sobre $x=0$: $f(0,y)=0$, límit $0$.
      fuites:
      - \\frac\{m\}\{1\s*\+\s*m\^\{?2\}?\}
      - m\s*/\s*\(1\s*\+\s*m\^\{?2
      teoria: []
    - id: concloure
      titol: Concloure sobre el límit
      objectiu: |
        Decidir, a partir dels límits sobre rectes, si existeix el límit a $(0,0)$.
      idea: |
        Si el límit existís, la seva restricció a qualsevol corba contínua per l'origen hauria de tenir el mateix límit.
      detall: |
        El valor depèn de $m$: per $m=0$ dona $0$ i per $m=1$ dona $\frac12$. Per la proposició de límit per camins, el límit a $(0,0)$ no pot existir.
      fuites:
      - no\s+pot\s+existir
      - dep[èe]n\s+de\s+(la\s+recta|\$?\s*m\b)
      - m\s*=\s*1\$?\s*(dona|val|[ée]s)\s*\$?\s*\\d?frac\s*\{?1\}?\s*\{?2
      teoria:
      - T2.10
    errors_comuns:
    - id: oblida_vertical
      descripcio: |
        Considera només $y=mx$ i oblida la recta $x=0$.
      pregunta: |
        Totes les rectes per l'origen es poden escriure com $y=mx$? Quina en falta?
    - id: rectes_com_a_prova
      descripcio: |
        Creu que si totes les rectes donessin el mateix valor, el límit existiria.
      pregunta: |
        Saber què passa sobre totes les rectes és suficient per conèixer què passa sobre una paràbola?
    - id: limit_fix_m
      descripcio: |
        Pensa que el límit sobre $y=mx$ és $0$ perquè "numerador i denominador són d'ordre 2".
      pregunta: |
        Quan substitueixes $y=mx$ i simplifiques $x^2$, què queda? Depèn encara de $x$?
  - id: t2-5b
    apartat: b
    tipus: calcul
    enunciat: |
      $f(x,y)=\dfrac{xy^2}{x^2y+xy^2}$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        El domini és $\{xy(x+y)\neq0\}$, de manera que les rectes $x=0$, $y=0$ i $y=-x$ queden fora del domini. Sobre les altres rectes, $y=mx$ amb $m\neq0,-1$, el límit és $\frac{m}{1+m}$, que depèn de $m$; per tant el límit $\lim_{(x,y)\to(0,0)}f(x,y)$ no existeix.
      fuites:
      - l[íi]mit(\s+(a|en)\s+\$?\(0,\s*0\)\$?|\s+global|\s+de\s+\$?f\$?)?\s+no\s+existeix
      - no\s+existeix\s+(el\s+)?l[íi]mit
      - \$?f\$?\s+no\s+t[ée]\s+l[íi]mit
      - \\frac\{m\}\{1\s*\+\s*m\}
      - m\s*/\s*\(1\s*\+\s*m\)
    passos:
    - id: domini
      titol: Domini i simplificació
      objectiu: |
        Determinar el domini de $f$ i quines rectes per l'origen hi són contingudes (llevat de l'origen).
      idea: |
        Factoritza el denominador; les rectes on s'anul·la no formen part del domini.
      detall: |
        $x^2y+xy^2=xy(x+y)$. Domini: $x\neq0$, $y\neq0$, $y\neq-x$. Allà $f(x,y)=\frac{y}{x+y}$. Sobre els eixos i sobre $y=-x$ la restricció no està definida.
      fuites:
      - xy\s*\(x\s*\+\s*y\)
      - \\frac\{y\}\{x\s*\+\s*y\}
      teoria: []
    - id: restriccio
      titol: Restringir a les rectes
      objectiu: |
        Calcular el límit de $f$ sobre les rectes per l'origen que són dins del domini.
      idea: |
        Substitueix $y=mx$ per als valors de $m$ admissibles i simplifica.
      detall: |
        $f(x,mx)=\frac{m^2x^3}{mx^3+m^2x^3}=\frac{m}{1+m}$ ($m\neq0,-1$), constant: el límit sobre la recta és $\frac{m}{1+m}$.
      fuites:
      - \\frac\{m\}\{1\s*\+\s*m\}
      - m\s*/\s*\(1\s*\+\s*m\)
      teoria: []
    - id: concloure
      titol: Concloure sobre el límit
      objectiu: |
        Decidir si existeix el límit a $(0,0)$.
      idea: |
        Si el límit existís, totes les restriccions a corbes contínues per l'origen dins del domini haurien de tenir el mateix límit.
      detall: |
        Per $m=1$ el límit és $\frac12$ i per $m=2$ és $\frac23$: valors diferents, de manera que, per la proposició de límit per camins, el límit a $(0,0)$ no existeix (l'origen sí que és punt d'acumulació del domini).
      fuites:
      - \\d?frac\s*\{?2\}?\s*\{?3\}?
      - l[íi]mit(\s+(a|en)\s+\$?\(0,\s*0\)\$?|\s+global|\s+de\s+\$?f\$?)?\s+no\s+existeix
      teoria:
      - T2.10
    errors_comuns:
    - id: ignora_domini
      descripcio: |
        Calcula la restricció a $x=0$ o $y=0$ com si estigués definida (p. ex. obtenint $0$ o $1$).
      pregunta: |
        Què val el denominador sobre l'eix $y=0$? Hi està definida, la funció?
    - id: simplificacio_global
      descripcio: |
        Simplifica a $\frac{y}{x+y}$ i oblida que la funció original no està definida als eixos, o bé creu que la simplificació canvia el límit.
      pregunta: |
        Per a quins punts és vàlida la simplificació que has fet?
    - id: rectes_com_a_prova
      descripcio: |
        Pensa que, com que cada restricció té límit, el límit global existeix.
      pregunta: |
        Que cada recta tingui un límit és el mateix que totes tinguin el mateix límit?
  - id: t2-5c
    apartat: c
    tipus: calcul
    enunciat: |
      $f(x,y)=\dfrac{xy}{x^3+y^4}$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        Sobre els eixos ($y=0$ i $x=0$) la restricció és idènticament $0$ i el límit és $0$. Sobre $y=mx$ amb $m\neq0$, $f(x,mx)=\frac{m}{x(1+m^4x)}$, que tendeix a $\pm\infty$ segons el costat: la restricció no té límit. Per tant el límit $\lim_{(x,y)\to(0,0)}f(x,y)$ no existeix.
      fuites:
      - l[íi]mit(\s+(a|en)\s+\$?\(0,\s*0\)\$?|\s+global|\s+de\s+\$?f\$?)?\s+no\s+existeix
      - no\s+existeix\s+(el\s+)?l[íi]mit
      - \$?f\$?\s+no\s+t[ée]\s+l[íi]mit
      - \\frac\{m\}\{x\s*\(1\s*\+\s*m\^\{?4\}?\s*x\)\}
      - \\pm\s*\\infty
    passos:
    - id: eixos
      titol: Restricció als eixos
      objectiu: |
        Calcular el límit de $f$ sobre les rectes $y=0$ i $x=0$.
      idea: |
        Substitueix directament; compte que el numerador conté el producte de les dues coordenades.
      detall: |
        $f(x,0)=\frac{0}{x^3}=0$ per $x\neq0$ i $f(0,y)=\frac{0}{y^4}=0$ per $y\neq0$: tots dos límits són $0$.
      fuites:
      - f\(x,\s*0\)\s*=\s*\\frac\{0\}
      - f\(0,\s*y\)\s*=\s*\\frac\{0\}
      teoria: []
    - id: rectes_obliqües
      titol: Restricció a les rectes obliqües
      objectiu: |
        Calcular el límit de $f$ sobre $y=mx$ amb $m\neq0$.
      idea: |
        Substitueix i simplifica la màxima potència comuna de $x$; mira quin grau queda al denominador.
      detall: |
        $f(x,mx)=\frac{mx^2}{x^3+m^4x^4}=\frac{m}{x(1+m^4x)}$, definit per $x\neq0$ petit. Quan $x\to0^\pm$ tendeix a $\pm\infty$ (si $m>0$; signes invertits si $m<0$): no té límit.
      fuites:
      - \\frac\{m\}\{x\s*\(1\s*\+\s*m\^\{?4\}?\s*x\)\}
      - \\pm\s*\\infty
      teoria: []
    - id: concloure
      titol: Concloure sobre el límit
      objectiu: |
        Decidir si existeix el límit a $(0,0)$.
      idea: |
        Si el límit existís, la restricció a cada recta per l'origen hauria de tenir aquest mateix límit.
      detall: |
        Sobre $y=x$ la restricció no té límit (no és fitada), mentre que si existís $L=\lim f$ hauria de tenir límit $L$. El límit a $(0,0)$ no existeix.
      fuites:
      - l[íi]mit(\s+(a|en)\s+\$?\(0,\s*0\)\$?|\s+global|\s+de\s+\$?f\$?)?\s+no\s+existeix
      - restricci[óo]\s+no\s+t[ée]\s+l[íi]mit
      teoria:
      - T2.10
    errors_comuns:
    - id: eixos_suficients
      descripcio: |
        Calcula només sobre els eixos, obté $0$ i conclou que el límit és $0$.
      pregunta: |
        Els eixos són les úniques rectes per l'origen? Què passa sobre la diagonal $y=x$?
    - id: graus
      descripcio: |
        Compara "graus" ingènuament (numerador grau 2, denominador grau 3 i 4) i s'equivoca de conclusió.
      pregunta: |
        Després de substituir $y=mx$, quina és la potència més baixa de $x$ al denominador, i quina al numerador?
    - id: ignora_domini
      descripcio: |
        No observa que el denominador s'anul·la a la corba $x^3=-y^4$, que passa per l'origen.
      pregunta: |
        Hi ha punts propers a l'origen on el denominador s'anul·li? Afecta això les rectes?
    nota_professor: |
      El domini és $\{x^3+y^4\neq0\}$; la corba $x=-y^{4/3}$ passa per l'origen, però cada recta $y=mx$ la talla només a $x=-1/m^4$, lluny de l'origen. Alternativa per a la no-existència: $f$ no és fitada en cap entorn de l'origen.
  - id: t2-5d
    apartat: d
    tipus: calcul
    enunciat: |
      $$f(x,y)=\begin{cases}\dfrac{x}{x+y^2} & \text{si } x\neq-y^2\\ 0 & \text{si } x=-y^2.\end{cases}$$
    teoria:
    - T2.6
    teoria_reservada:
    - T2.11
    resultat:
      valor: |
        Sobre les rectes $y=mx$ ($m\in\mathbb{R}$, inclòs l'eix $y=0$) el límit és $1$; sobre la recta $x=0$ el límit és $0$. Com que les restriccions donen valors diferents, el límit $\lim_{(x,y)\to(0,0)}f(x,y)$ no existeix.
      fuites:
      - l[íi]mit(\s+(a|en)\s+\$?\(0,\s*0\)\$?|\s+global|\s+de\s+\$?f\$?)?\s+no\s+existeix
      - no\s+existeix\s+(el\s+)?l[íi]mit
      - \$?f\$?\s+no\s+t[ée]\s+l[íi]mit
      - \\frac\{1\}\{1\s*\+\s*m\^\{?2\}?\s*x\}
    passos:
    - id: rectes_no_verticals
      titol: Rectes no verticals
      objectiu: |
        Calcular el límit de $f$ sobre les rectes $y=mx$.
      idea: |
        Comprova primer quina de les dues expressions de $f$ s'aplica a prop de l'origen sobre la recta, i després substitueix.
      detall: |
        Sobre $y=mx$, $x+m^2x^2=0$ només per $x=0$ o $x=-1/m^2$, de manera que a prop de l'origen $f(x,mx)=\frac{x}{x+m^2x^2}=\frac{1}{1+m^2x}\to1$.
      fuites:
      - \\frac\{1\}\{1\s*\+\s*m\^\{?2\}?\s*x\}
      teoria: []
    - id: recta_vertical
      titol: Recta vertical
      objectiu: |
        Calcular el límit de $f$ sobre la recta $x=0$.
      idea: |
        Substitueix $x=0$ i comprova en quina branca de la definició estàs.
      detall: |
        Per $y\neq0$, $0\neq-y^2$, així que $f(0,y)=\frac{0}{y^2}=0$: límit $0$.
      fuites:
      - f\(0,\s*y\)\s*=\s*\\frac\{0\}
      teoria: []
    - id: concloure
      titol: Concloure sobre el límit
      objectiu: |
        Decidir si existeix el límit a $(0,0)$.
      idea: |
        Si el límit existís, totes les restriccions a corbes contínues per l'origen haurien de tenir el mateix límit.
      detall: |
        La recta $y=0$ dona $1$ i la recta $x=0$ dona $0$; per la proposició de límit per camins (aplicada a $y=g(x)=0$, i a la recta $x=0$ amb els papers de $x$ i $y$ intercanviats), el límit a $(0,0)$ no existeix. (També ho mostren les paràboles $x=ay^2$, que donen $\frac{a}{a+1}$.)
      fuites:
      - l[íi]mit(\s+(a|en)\s+\$?\(0,\s*0\)\$?|\s+global|\s+de\s+\$?f\$?)?\s+no\s+existeix
      - \\d?frac\{a\}\{a\s*\+\s*1\}
      teoria:
      - T2.10
    errors_comuns:
    - id: nomes_y_mx
      descripcio: |
        Només considera $y=mx$, obté sempre $1$ i conclou que el límit és $1$.
      pregunta: |
        Has considerat totes les rectes que passen per l'origen? N'hi ha alguna que no sigui de la forma $y=mx$?
    - id: branca_equivocada
      descripcio: |
        Fa servir el valor $0$ de la segona branca sobre una recta on no s'aplica (o al revés).
      pregunta: |
        Sobre la recta que estàs estudiant, els punts propers a l'origen compleixen $x=-y^2$?
    - id: rectes_com_a_prova
      descripcio: |
        Creu que si totes les rectes donessin el mateix, el límit existiria.
      pregunta: |
        Saber què passa sobre totes les rectes és suficient per conèixer què passa sobre una paràbola?
    nota_professor: |
      És la mateixa funció de l'Exemple 11 dels apunts amb els papers de $x$ i $y$ intercanviats (allà sobre paràboles), per això queda reservat.
- num: 6
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t2-6
    apartat: null
    tipus: teoric
    enunciat: |
      Siguin $A=\left\{(x,y)\in\mathbb{R}^2\mid 0<y<x^2\right\}$ i $f(x,y)=\begin{cases}0 & \text{si } (x,y)\in A,\\ 1 & \text{altrament.}\end{cases}$

      Demostreu que el límit quan $(x,y)\to(0,0)$ de la restricció de $f$ a qualsevol recta que passi per $(0,0)$ val 1; però tanmateix no existeix $\lim_{(x,y)\to(0,0)}f(x,y)$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        Sobre la recta $x=0$ i sobre $y=0$, $f\equiv1$. Sobre $y=mx$ amb $m\neq0$, el punt $(x,mx)$ és a $A$ només si $0<mx<x^2$, cosa que exigeix $|x|>|m|$; per tant $f(x,mx)=1$ per a $0<|x|<|m|$ i el límit sobre cada recta val $1$. En canvi, sobre la paràbola $y=\frac{x^2}{2}$ (que és dins $A$ per a $x\neq0$) $f\equiv0$, i el límit sobre aquest camí val $0\neq1$. Per la proposició de límit per camins, $\lim_{(x,y)\to(0,0)}f(x,y)$ no existeix.
      fuites: []
    passos:
    - id: rectes
      titol: Restricció a les rectes per l'origen
      objectiu: |
        Veure que, sobre cada recta que passa per $(0,0)$, la funció val $1$ en tots els punts prou propers a l'origen.
      idea: |
        Separar la recta vertical $x=0$ de les rectes $y=mx$. Per a cada recta, esbrinar per a quins $x$ el punt de la recta satisfà les dues desigualtats que defineixen $A$.
      detall: |
        - $x=0$: cap punt $(0,y)$ compleix $0<y<0$, així que $f(0,y)=1$.
        - $y=0$: no es compleix $0<0$, així que $f(x,0)=1$.
        - $y=mx$, $m>0$: cal $mx>0$ (és a dir $x>0$) i $mx<x^2$ (és a dir $x>m$). Si $m<0$: cal $x<0$ i, dividint per $x<0$, $x<m$. En tots dos casos el punt és a $A$ només si $|x|>|m|$.
        Per tant, si $0<|x|<|m|$, $f(x,mx)=1$, i el límit de la restricció quan $x\to0$ és $1$ (la restricció és constant a prop de $0$).
      fuites:
      - \|x\|\s*>\s*\|m\|
      - \|x\|\s*<\s*\|m\|
      teoria:
      - T2.6
    - id: cami_dins_A
      titol: Un camí per dins d'A
      objectiu: |
        Trobar una corba que passi per l'origen sobre la qual $f$ tingui un límit diferent de $1$.
      idea: |
        El conjunt $A$ és la regió compresa entre l'eix $y=0$ i la paràbola $y=x^2$; cap recta no hi entra a prop de l'origen, però una corba que quedi entre aquestes dues sí que hi pot quedar.
      detall: |
        Sobre $y=\frac{x^2}{2}$ (o $y=cx^2$ amb $0<c<1$) i $x\neq0$ es té $0<\frac{x^2}{2}<x^2$, és a dir, el punt és a $A$ i $f=0$. Per tant $\lim_{x\to0}f\left(x,\frac{x^2}{2}\right)=0$.
      fuites:
      - \\[dt]?frac\{x\^\{?2\}?\}\{2\}
      - x\^\{?2\}?\s*/\s*2
      - y\s*=\s*c\s*x\^\{?2\}?
      - y\s*=\s*\\[dt]?frac\{?1\}?\{?2\}?\s*x\^\{?2\}?
      teoria:
      - T2.10
    - id: concloure
      titol: Concloure la no existència
      objectiu: |
        Deduir de tot plegat que el límit doble no existeix.
      idea: |
        Si el límit existís valdria el mateix sobre qualsevol corba contínua que passi per l'origen.
      detall: |
        Si existís $\lim_{(x,y)\to(0,0)}f(x,y)=L$, per la proposició de límit per camins hauria de ser $L=1$ (sobre $y=0$) i també $L=0$ (sobre la paràbola de l'apartat anterior). Per unicitat del límit, això és impossible: el límit no existeix.
      fuites: []
      teoria:
      - T2.10
      - T2.8
    errors_comuns:
    - id: rectes_suficients
      descripcio: |
        Creu que si el límit sobre totes les rectes per l'origen val el mateix, aleshores el límit doble existeix.
      pregunta: |
        Les rectes són els únics camins per arribar a l'origen? Quina forma té la frontera del conjunt $A$ a prop de $(0,0)$?
    - id: A_lluny_origen
      descripcio: |
        Pensa que $A$ no s'acosta a l'origen (perquè cap recta hi entra) i que per tant $f=1$ en un entorn de $(0,0)$.
      pregunta: |
        Dins de qualsevol bola centrada a l'origen, hi ha punts de $A$? Prova de trobar-ne un explícitament per a un radi petit.
    - id: oblida_vertical
      descripcio: |
        Només estudia les rectes $y=mx$ i oblida la recta vertical $x=0$.
      pregunta: |
        Totes les rectes per l'origen es poden escriure com $y=mx$?
    nota_professor: |
      El valor $f(0,0)=1$ és irrellevant per al límit. Es pot fer també amb successions: $(1/n,\,1/(2n^2))\in A$ dona $f=0$, mentre que $(1/n,0)$ dona $f=1$.
- num: 7
  font: null
  preambul: |
    Límits i coordenades polars.
  indicacio: null
  exercicis:
  - id: t2-7a
    apartat: a
    tipus: teoric
    enunciat: |
      Considerem una funció $f:U\to\mathbb{R}$ on $U\subseteq\mathbb{R}^2$ és un entorn de $(0,0)$. Suposem que existeix una funció $h(r)$ no negativa tal que

      - $|f(r\cos\varphi,r\sin\varphi)|\leqslant h(r)$ per a tot $\varphi\in[0,2\pi)$, $r>0$,
      - $\displaystyle\lim_{r\to0^+}h(r)=0$.

      Demostreu que $\displaystyle\lim_{(x,y)\to(0,0)}f(x,y)=0$.

      De manera similar, si $|f(r\cos\varphi,r\sin\varphi)-L|\leqslant h(r)$ i $\displaystyle\lim_{h\to0^+}h(r)=0$, llavors $\displaystyle\lim_{(x,y)\to(0,0)}f(x,y)=L$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        Donat $\epsilon>0$, com que $h(r)\to0$ quan $r\to0^+$, existeix $\delta>0$ (que podem prendre prou petit perquè $B((0,0),\delta)\subseteq U$) tal que $0\le h(r)<\epsilon$ si $0<r<\delta$. Tot punt $(x,y)$ amb $0<\|(x,y)\|<\delta$ s'escriu $(r\cos\varphi,r\sin\varphi)$ amb $r=\|(x,y)\|\in(0,\delta)$ i algun $\varphi\in[0,2\pi)$, i llavors $|f(x,y)|\le h(r)<\epsilon$. Per la definició $\epsilon$-$\delta$, el límit és $0$. Per al cas general s'aplica el mateix a $g=f-L$, que compleix $|g(r\cos\varphi,r\sin\varphi)|\le h(r)$, i per tant $f=g+L\to L$.
      fuites: []
    passos:
    - id: fixar_epsilon
      titol: Traduir la hipòtesi sobre h
      objectiu: |
        Escriure què vol dir, en termes $\epsilon$-$\delta$, la hipòtesi sobre $h$, i què cal demostrar sobre $f$.
      idea: |
        Escriure la definició $\epsilon$-$\delta$ del límit doble que volem i la del límit lateral de $h$, i buscar quin $\delta$ pot servir per a totes dues.
      detall: |
        Volem: $\forall\epsilon>0\ \exists\delta>0$ tal que $0<\|(x,y)\|<\delta\Rightarrow|f(x,y)|<\epsilon$. Donat $\epsilon>0$, la hipòtesi $h(r)\to0^+$ dona $\rho>0$ amb $0\le h(r)<\epsilon$ per a $0<r<\rho$. Prenem $\delta\le\rho$ prou petit perquè, a més, $B((0,0),\delta)\subseteq U$ (és possible perquè $U$ és un entorn de l'origen).
      fuites: []
      teoria:
      - T2.6
    - id: polars
      titol: Passar a polars i fitar
      objectiu: |
        Comprovar que el $\delta$ triat funciona per a tots els punts de la bola, independentment de la direcció.
      idea: |
        Escriure qualsevol punt de la bola foradada en coordenades polars i observar quin paper fa $r$; la fita de la hipòtesi no depèn de l'angle.
      detall: |
        Si $0<\|(x,y)\|<\delta$, posem $r=\sqrt{x^2+y^2}\in(0,\delta)$ i triem $\varphi\in[0,2\pi)$ amb $(x,y)=(r\cos\varphi,r\sin\varphi)$. Llavors $|f(x,y)|=|f(r\cos\varphi,r\sin\varphi)|\le h(r)<\epsilon$. Com que la fita és vàlida per a tot $\varphi$, el mateix $\delta$ serveix per a tots els punts: $\lim_{(x,y)\to(0,0)}f(x,y)=0$.
      fuites: []
      teoria:
      - T2.6
    - id: cas_L
      titol: El cas amb límit L
      objectiu: |
        Obtenir la segona afirmació (límit $L$) a partir de la primera.
      idea: |
        Reduir-ho al cas ja demostrat amb una funció auxiliar adequada.
      detall: |
        Sigui $g=f-L$. La hipòtesi diu $|g(r\cos\varphi,r\sin\varphi)|\le h(r)$ amb $h(r)\to0$, i per la primera part $g\to0$; per tant $f=g+L\to L$ (àlgebra de límits, o directament $|f(x,y)-L|<\epsilon$ amb el mateix $\delta$).
      fuites: []
      teoria:
      - T2.9
    errors_comuns:
    - id: fita_depen_angle
      descripcio: |
        No s'adona que és essencial que la fita $h$ depengui només de $r$; acceptaria una fita $h(r,\varphi)$ amb $h(r,\varphi)\to0$ per a cada $\varphi$ fix.
      pregunta: |
        Si la fita depengués també de $\varphi$, el $\delta$ que obtens per a cada direcció seria el mateix per a totes? Què necessites per poder triar un únic $\delta$?
    - id: nomes_radials
      descripcio: |
        Demostra només que $\lim_{r\to0}f(r\cos\varphi,r\sin\varphi)=0$ per a cada $\varphi$ fix i ho dona per bo.
      pregunta: |
        Saber el límit sobre cada semirecta per separat, et garanteix el límit sobre una corba que no sigui recta?
    - id: oblida_entorn
      descripcio: |
        Oblida que $f$ només està definida a $U$ i no ajusta $\delta$ perquè la bola hi quedi continguda.
      pregunta: |
        Per a quins punts està definida $f$? El teu $\delta$ assegura que tots els punts que consideres hi pertanyen?
    nota_professor: |
      Errata a l'enunciat: a la segona part hi diu $\lim_{h\to0^+}h(r)=0$; ha de ser $\lim_{r\to0^+}h(r)=0$. Aquest resultat justifica el mètode de les polars quan la fita és uniforme en $\varphi$.
  - id: t2-7b
    apartat: b
    tipus: calcul
    enunciat: |
      Sigui $f(x,y)=\dfrac{x^2y}{x^4+y^2}$. Calculeu $\displaystyle\lim_{r\to0}f(r\cos\varphi,r\sin\varphi)$, per a tot valor de $\varphi\in[0,2\pi]$. Què podem deduir sobre $\displaystyle\lim_{(x,y)\to(0,0)}f(x,y)$ ?
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        Per a tot $\varphi$, $\lim_{r\to0}f(r\cos\varphi,r\sin\varphi)=0$: si $\sin\varphi\neq0$, $f(r\cos\varphi,r\sin\varphi)=\frac{r\cos^2\varphi\sin\varphi}{r^2\cos^4\varphi+\sin^2\varphi}\to\frac{0}{\sin^2\varphi}=0$; si $\sin\varphi=0$, $f=0$ sobre la recta. Això només dona el candidat $0$ (la convergència no és uniforme en $\varphi$). De fet el límit doble no existeix: sobre $y=x^2$, $f(x,x^2)=\frac12$ (i sobre $y=mx^2$ val $\frac{m}{1+m^2}$).
      fuites:
      - l[íi]mit\s+(doble\s+)?no\s+existeix
      - no\s+existeix\s+(el\s+)?l[íi]mit
      - no\s+t[ée]\s+l[íi]mit
    passos:
    - id: radials
      titol: Límits radials
      objectiu: |
        Calcular el límit de $f$ sobre cada semirecta que surt de l'origen, per a cada angle.
      idea: |
        Substituir $x=r\cos\varphi$, $y=r\sin\varphi$, simplificar potències de $r$ i distingir segons si el denominador del resultat s'anul·la o no en $r=0$.
      detall: |
        $f(r\cos\varphi,r\sin\varphi)=\frac{r^3\cos^2\varphi\sin\varphi}{r^4\cos^4\varphi+r^2\sin^2\varphi}=\frac{r\cos^2\varphi\sin\varphi}{r^2\cos^4\varphi+\sin^2\varphi}$. Si $\sin\varphi\neq0$, el denominador tendeix a $\sin^2\varphi\neq0$ i el límit és $0$. Si $\sin\varphi=0$ ($\varphi=0,\pi,2\pi$), $f=0$ sobre l'eix $x$. Tots els límits radials valen $0$.
      fuites:
      - r\^\{?2\}?\s*\\cos\^\{?4\}?\s*\\?varphi\s*\+\s*\\sin\^\{?2\}?
      teoria: []
    - id: corba
      titol: Provar corbes no rectes
      objectiu: |
        Esbrinar si els límits radials determinen el límit doble, estudiant també camins cap a l'origen que no siguin rectes.
      idea: |
        Buscar camins on els dos sumands del denominador ($x^4$ i $y^2$) siguin del mateix ordre de magnitud.
      detall: |
        Sobre $y=x^2$: $f(x,x^2)=\frac{x^4}{2x^4}=\frac12$. En general, sobre $y=mx^2$: $f=\frac{m}{1+m^2}$, que depèn de $m$.
      fuites:
      - y\s*=\s*m?\s*x\^\{?2\}?
      - \\[dt]?frac\{?m\}?\{?1\s*\+\s*m\^\{?2\}?\}?
      teoria:
      - T2.10
    - id: deduir
      titol: Deduir
      objectiu: |
        Respondre què podem deduir sobre el límit doble.
      idea: |
        Si el límit doble existís, quin valor hauria de prendre sobre cada corba contínua que passa per l'origen?
      detall: |
        Si existís $\lim f=L$, per la proposició de límit per camins hauria de ser $L=0$ (eix $x$) i $L=\frac12$ (paràbola): contradicció. El límit doble no existeix. Els límits radials iguals només donen un candidat; aquí la convergència no és uniforme en $\varphi$ (per exemple, prenent $\sin\varphi=r\cos^2\varphi$ el valor és $\frac12$), i no es pot aplicar l'apartat (a).
      fuites: []
      teoria:
      - T2.10
      - T2.8
    errors_comuns:
    - id: radials_suficients
      descripcio: |
        Conclou que el límit doble val $0$ perquè tots els límits radials valen $0$.
      pregunta: |
        El resultat de l'apartat (a) demana una fita que depengui només de $r$. La teva expressió en polars admet una fita així, o depèn de l'angle d'una manera que es pot fer dolenta?
    - id: oblida_sin_zero
      descripcio: |
        Divideix per $\sin^2\varphi$ sense tractar a part els angles en què $\sin\varphi=0$.
      pregunta: |
        Per a quins angles el denominador en polars s'anul·la quan $r=0$? Què val $f$ sobre aquestes semirectes?
    - id: nomes_rectes
      descripcio: |
        Només prova rectes i no considera corbes adaptades al denominador.
      pregunta: |
        Quina relació entre $x$ i $y$ fa que $x^4$ i $y^2$ siguin comparables?
    nota_professor: |
      Exemple clàssic que mostra que els límits radials (fins i tot tots iguals) no garanteixen el límit doble.
  - id: t2-7c
    apartat: c
    tipus: calcul
    enunciat: |
      Discutiu l'existència de $\displaystyle\lim_{(x,y)\to(0,0)}\frac{x^py^q}{x^2+y^2-xy}$, segons els valors de $p,q\in\mathbb{N}$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        El denominador compleix $\frac12(x^2+y^2)\le x^2+y^2-xy\le\frac32(x^2+y^2)$ (en particular, només s'anul·la a l'origen).
        - Si $p+q\ge3$: el límit existeix i val $0$, ja que $|f|\le2r^{p+q-2}\to0$.
        - Si $p+q=2$: sobre $y=mx$ el quocient val $\frac{m^q}{1-m+m^2}$, que depèn de $m$; el límit no existeix.
        - Si $p+q\le1$ (només si $0\in\mathbb{N}$): el quocient no és fitat a prop de l'origen (per exemple $p=q=0$ dona $+\infty$; $p=1,q=0$ dona $\frac1x$ sobre $y=0$); no hi ha límit finit.
        Amb el conveni $\mathbb{N}=\{1,2,\dots\}$: el límit existeix (i val $0$) si i només si $(p,q)\neq(1,1)$.
      fuites:
      - p\s*\+\s*q\s*(\\ge|\\geq|≥)\s*3
      - p\s*\+\s*q\s*>\s*2
      - \(p,\s*q\)\s*(\\neq|\\ne|≠)\s*\(1,\s*1\)
    passos:
    - id: denominador
      titol: Comparar el denominador amb la norma
      objectiu: |
        Trobar fites superior i inferior del denominador en termes de $x^2+y^2$.
      idea: |
        Fitar el terme creuat $xy$ en funció de $x^2+y^2$ (desigualtat elemental a partir d'un quadrat no negatiu).
      detall: |
        De $(|x|-|y|)^2\ge0$ surt $|xy|\le\frac{x^2+y^2}{2}$. Per tant $\frac12(x^2+y^2)\le x^2+y^2-xy\le\frac32(x^2+y^2)$: el denominador es comporta com $r^2$ i només s'anul·la a l'origen.
      fuites:
      - \|xy\|\s*(\\le|\\leq|≤)
      - \\[dt]?frac\{?1\}?\{?2\}?\s*\(x\^\{?2\}?\s*\+\s*y\^\{?2\}?\)\s*(\\le|\\leq|≤)
      teoria: []
    - id: grau_gran
      titol: Cas en què el numerador domina
      objectiu: |
        Determinar per a quins $p,q$ el quocient tendeix a $0$ i demostrar-ho.
      idea: |
        Fitar el numerador per una potència de $r=\sqrt{x^2+y^2}$ i usar la fita inferior del denominador; després aplicar l'apartat (a) (fita que només depèn de $r$).
      detall: |
        $|x^py^q|\le r^{p+q}$, de manera que $\left|\frac{x^py^q}{x^2+y^2-xy}\right|\le\frac{r^{p+q}}{r^2/2}=2r^{p+q-2}$. Si $p+q\ge3$, aquesta fita tendeix a $0$ quan $r\to0^+$ i, per l'apartat (a), el límit és $0$.
      fuites:
      - 2\s*r\^\{?p\s*\+\s*q\s*-\s*2\}?
      - p\s*\+\s*q\s*(\\ge|\\geq|≥)\s*3
      teoria:
      - T2.6
    - id: grau_petit
      titol: Casos sense límit
      objectiu: |
        Estudiar els valors de $p,q$ restants i veure si hi ha límit.
      idea: |
        Provar les rectes $y=mx$ i mirar si el resultat depèn de $m$, o si el quocient no és fitat.
      detall: |
        Sobre $y=mx$: $\frac{m^qx^{p+q}}{x^2(1-m+m^2)}$ (notem $1-m+m^2>0$). Si $p+q=2$, el límit és $\frac{m^q}{1-m+m^2}$, que depèn de $m$: per $(1,1)$ val $0$ per $m=0$ i $1$ per $m=1$; si $0\in\mathbb{N}$, per $(2,0)$ val $1$ per $m=0$ i $\frac13$ per $m=2$, i per $(0,2)$ val $0$ per $m=0$ i $1$ per $m=1$. No hi ha límit. Si $p+q\le1$ (cas $0\in\mathbb{N}$), el valor absolut és $\ge\frac{|x|^p|y|^q}{\frac32 r^2}$ i sobre els eixos adequats val $\frac1{x}$, $\frac1{y}$ o $\frac{1}{x^2}$: no és fitat i no hi ha límit finit.
      fuites:
      - \\[dt]?frac\{m\^\{?q\}?\}\{1\s*-\s*m\s*\+\s*m\^\{?2\}?\}
      - m\^\{?q\}?\s*/\s*\(1\s*-\s*m
      teoria:
      - T2.10
    errors_comuns:
    - id: denominador_zero
      descripcio: |
        Pensa que el denominador $x^2+y^2-xy$ es pot anul·lar fora de l'origen (o hi tracta com si pogués ser negatiu).
      pregunta: |
        Pots escriure $x^2+y^2-xy$ com una suma de quadrats o comparar-lo amb $x^2+y^2$? Pot ser zero si $(x,y)\neq(0,0)$?
    - id: polars_sense_fita
      descripcio: |
        Passa a polars i obté $r^{p+q-2}\cdot\frac{\cos^p\varphi\sin^q\varphi}{1-\cos\varphi\sin\varphi}$ però no comprova que el factor angular és fitat.
      pregunta: |
        El factor que depèn de $\varphi$ pot fer-se arbitràriament gran per algun angle? Quin és el valor mínim de $1-\cos\varphi\sin\varphi$?
    - id: cas_frontera
      descripcio: |
        Inclou el cas $p+q=2$ entre els que tenen límit $0$ (per exemple, pensa que $\frac{xy}{x^2+y^2-xy}$ tendeix a $0$).
      pregunta: |
        Quan el numerador i el denominador tenen el mateix grau, què passa amb el quocient sobre rectes de pendents diferents?
    nota_professor: |
      La resposta depèn del conveni sobre $\mathbb{N}$. Si $0\in\mathbb{N}$, també cal discutir $p+q\le1$ (no hi ha límit finit; per $p=q=0$ el quocient tendeix a $+\infty$). Si $\mathbb{N}=\{1,2,\dots\}$, l'únic cas sense límit és $p=q=1$.
- num: 8
  font: null
  preambul: |
    Considerem les funcions
    $$f(x,y)=\begin{cases}0 & \text{si } (x,y)=(0,0),\\ \dfrac{xy^2}{x^2+y^4} & \text{altrament,}\end{cases}\qquad g(x,y)=\begin{cases}0 & \text{si } (x,y)=(0,0),\\ \dfrac{xy^2}{x^2+y^6} & \text{altrament.}\end{cases}$$
    Demostreu la veracitat o falsedat de les afirmacions següents:
  indicacio: null
  exercicis:
  - id: t2-8a
    apartat: a
    tipus: teoric
    enunciat: |
      Les restriccions de $f$ i $g$ a qualsevol recta de $\mathbb{R}^2$ són funcions contínues.
    teoria:
    - T2.14
    teoria_reservada: []
    resultat:
      valor: |
        Cert. Sobre una recta que no passa per l'origen, $f$ i $g$ coincideixen amb quocients de polinomis amb denominador no nul, i la restricció (composició amb la parametrització afí de la recta) és contínua. Sobre $x=0$, $f=g=0$. Sobre $y=mx$: $f(x,mx)=\frac{m^2x}{1+m^4x^2}$ i $g(x,mx)=\frac{m^2x}{1+m^6x^4}$, expressions vàlides també per a $x=0$ i contínues.
      fuites:
      - afirmaci[óo]\s+(és\s+)?(certa|veritable|falsa)
    passos:
    - id: rectes_sense_origen
      titol: Rectes que no passen per l'origen
      objectiu: |
        Decidir si la restricció de $f$ i $g$ a una recta que no passa per $(0,0)$ és contínua.
      idea: |
        Fora de l'origen, $f$ i $g$ són quocients de polinomis; la restricció a una recta és la composició amb una parametrització de la recta.
      detall: |
        A $\mathbb{R}^2\setminus\{(0,0)\}$ els denominadors $x^2+y^4$ i $x^2+y^6$ no s'anul·len, així que $f$ i $g$ hi són contínues (àlgebra de funcions contínues). Si la recta és $\{p+tv\}$ i no passa per l'origen, $t\mapsto f(p+tv)$ és composició de funcions contínues.
      fuites: []
      teoria:
      - T2.20
      - T2.19
    - id: rectes_origen
      titol: Rectes que passen per l'origen
      objectiu: |
        Calcular explícitament la restricció de $f$ i de $g$ a cada recta per l'origen i estudiar-ne la continuïtat a $0$.
      idea: |
        Tractar a part la recta vertical; per a $y=mx$, simplificar la potència de $x$ comuna i comparar amb el valor a l'origen.
      detall: |
        Sobre $x=0$: $f(0,y)=g(0,y)=0$ per a tot $y$. Sobre $y=mx$, per a $x\neq0$: $f(x,mx)=\frac{m^2x^3}{x^2+m^4x^4}=\frac{m^2x}{1+m^4x^2}$ i $g(x,mx)=\frac{m^2x^3}{x^2+m^6x^6}=\frac{m^2x}{1+m^6x^4}$. Aquestes expressions valen $0$ per a $x=0$, que és el valor de $f$ i $g$ a l'origen; són quocients de polinomis amb denominador positiu, per tant contínues en tot $\mathbb{R}$.
      fuites:
      - 1\s*\+\s*m\^\{?4\}?\s*x\^\{?2\}?
      - 1\s*\+\s*m\^\{?6\}?\s*x\^\{?4\}?
      teoria:
      - T2.14
    errors_comuns:
    - id: confon_amb_continuitat
      descripcio: |
        Creu que, si les restriccions a totes les rectes són contínues, aleshores la funció és contínua (i viceversa, que si no és contínua alguna restricció ha de fallar).
      pregunta: |
        Que la funció sigui contínua sobre cada recta et diu alguna cosa sobre què passa sobre una paràbola?
    - id: oblida_rectes_generals
      descripcio: |
        Només estudia les rectes per l'origen i oblida que l'enunciat parla de qualsevol recta.
      pregunta: |
        L'enunciat parla només de rectes que passen per $(0,0)$? Què passa amb una recta qualsevol del pla?
    nota_professor: |
      Prepara els apartats següents: les funcions són contínues sobre rectes però (c), (e) mostren que no ho són a l'origen.
  - id: t2-8b
    apartat: b
    tipus: teoric
    enunciat: |
      $f$ és fitada a $\mathbb{R}^2$.
    teoria:
    - T1.33
    teoria_reservada: []
    resultat:
      valor: |
        Cert: $2|x|y^2\le x^2+y^4$ (perquè $(|x|-y^2)^2\ge0$), d'on $|f(x,y)|\le\frac12$ per a tot $(x,y)\neq(0,0)$, i $f(0,0)=0$.
      fuites:
      - afirmaci[óo]\s+(és\s+)?(certa|veritable|falsa)
      - \|f(\(x,\s*y\))?\|\s*(\\le|\\leq|≤)\s*(\\[dt]?frac\{?1\}?\{?2\}?|1/2)
    passos:
    - id: desigualtat
      titol: Comparar numerador i denominador
      objectiu: |
        Trobar una desigualtat que relacioni $|xy^2|$ amb $x^2+y^4$.
      idea: |
        Pensar en $|x|$ i $y^2$ com dos nombres no negatius $a,b$: quina relació hi ha entre $ab$ i $a^2+b^2$?
      detall: |
        $(|x|-y^2)^2\ge0$ dona $2|x|y^2\le x^2+y^4$.
      fuites:
      - \(\|x\|\s*-\s*y\^\{?2\}?\)\^\{?2\}?
      - 2\s*\|x\|\s*y\^\{?2\}?\s*(\\le|\\leq|≤)
      teoria: []
    - id: concloure
      titol: Concloure la fita
      objectiu: |
        Decidir si $|f|$ admet una fita vàlida a tot el pla.
      idea: |
        Dividir la desigualtat anterior pel denominador i no oblidar el valor a l'origen.
      detall: |
        Per a $(x,y)\neq(0,0)$: $|f(x,y)|=\frac{|x|y^2}{x^2+y^4}\le\frac12$, i $f(0,0)=0$. Per tant $f(\mathbb{R}^2)\subseteq[-\frac12,\frac12]$ i $f$ és fitada (la fita s'assoleix: $f(y^2,y)=\frac12$).
      fuites:
      - \\[dt]?frac\{\|x\|\s*y\^\{?2\}?\}\{x\^\{?2\}?\s*\+\s*y\^\{?4\}?\}\s*(\\le|\\leq|≤)
      - \[-\s*\\[dt]?frac\{?1\}?\{?2\}?\s*,
      - \|f(\(x,\s*y\))?\|\s*(\\le|\\leq|≤)\s*(\\[dt]?frac\{?1\}?\{?2\}?|1/2)
      teoria:
      - T1.33
    errors_comuns:
    - id: nomes_rectes
      descripcio: |
        Argumenta la fitació només sobre rectes o camins concrets.
      pregunta: |
        Saber que $f$ és fitada sobre cada recta et dona una fita comuna per a tots els punts del pla?
    - id: polars_dolent
      descripcio: |
        Passa a polars i obté una expressió que sembla no fitada, sense trobar la desigualtat adequada.
      pregunta: |
        En lloc de polars, pots comparar directament $|x|y^2$ amb $x^2+y^4$ pensant en un quadrat no negatiu?
    nota_professor: |
      Desigualtat clau: $2ab\le a^2+b^2$ amb $a=|x|$, $b=y^2$.
  - id: t2-8c
    apartat: c
    tipus: teoric
    enunciat: |
      $f$ no és contínua a $(0,0)$.
    teoria:
    - T2.14
    teoria_reservada: []
    resultat:
      valor: |
        Cert. Sobre la paràbola $x=y^2$ ($y\neq0$), $f(y^2,y)=\frac{y^4}{2y^4}=\frac12$, que no tendeix a $f(0,0)=0$. Per tant no es compleix $\lim_{(x,y)\to(0,0)}f(x,y)=f(0,0)$ i $f$ no és contínua a l'origen.
      fuites:
      - afirmaci[óo]\s+(és\s+)?(certa|veritable|falsa)
    passos:
    - id: candidat
      titol: Candidat i rectes
      objectiu: |
        Recordar què cal per a la continuïtat a l'origen i quin valor donen les rectes.
      idea: |
        Continuïtat vol dir que el límit existeix i coincideix amb $f(0,0)$; l'apartat (a) ja dona el comportament sobre rectes.
      detall: |
        $f(0,0)=0$ i, per (a), el límit sobre cada recta per l'origen és $0$. Això no prova la continuïtat; cal buscar altres camins.
      fuites: []
      teoria:
      - T2.14
    - id: cami
      titol: Un camí que dona un altre valor
      objectiu: |
        Esbrinar si hi ha alguna corba per l'origen sobre la qual $f$ no tendeixi a $f(0,0)$.
      idea: |
        Escollir una relació entre $x$ i $y$ que faci comparables els dos sumands del denominador ($x^2$ i $y^4$); és la mateixa que fa la desigualtat de (b) una igualtat.
      detall: |
        Sobre $x=y^2$: $f(y^2,y)=\frac{y^2\cdot y^2}{y^4+y^4}=\frac12$ per a $y\neq0$. El límit sobre aquest camí és $\frac12\neq0$ (el camí és una gràfica $x=y^2$: s'aplica la proposició de límit per camins amb els papers de $x$ i $y$ intercanviats).
      fuites:
      - x\s*=\s*y\^\{?2\}?
      - f\(y\^\{?2\}?,\s*y\)
      teoria:
      - T2.10
    - id: concloure
      titol: Concloure
      objectiu: |
        Decidir sobre la continuïtat a l'origen.
      idea: |
        Si el límit existís, quant hauria de valer sobre cada camí?
      detall: |
        Si existís el límit hauria de valer $0$ (rectes) i $\frac12$ (paràbola); no existeix. Per tant $f$ no és contínua a $(0,0)$.
      fuites: []
      teoria:
      - T2.10
      - T2.14
    errors_comuns:
    - id: rectes_suficients
      descripcio: |
        Com que totes les rectes donen $0$, conclou que $f$ és contínua a l'origen.
      pregunta: |
        Les rectes són les úniques maneres d'acostar-se a l'origen? Quina corba fa iguals d'ordre $x^2$ i $y^4$?
    - id: fitada_implica_continua
      descripcio: |
        Pensa que, com que $f$ és fitada (apartat b), ha de ser contínua.
      pregunta: |
        Una funció fitada pot tenir límits diferents per camins diferents? Coneixes algun exemple en una variable?
    nota_professor: |
      El camí $x=y^2$ és exactament on la fita $\frac12$ de (b) s'assoleix. El camí és una gràfica $x=g(y)$; la proposició de límit per camins s'aplica intercanviant els papers de $x$ i $y$ (o bé amb la successió $(1/n^2,1/n)$).
  - id: t2-8d
    apartat: d
    tipus: teoric
    enunciat: |
      $g$ no és fitada a qualsevol obert que contingui el punt $(0,0)$.
    teoria:
    - T1.11
    - T1.33
    teoria_reservada: []
    resultat:
      valor: |
        Cert. Sobre la corba $x=y^3$ ($y\neq0$), $g(y^3,y)=\frac{y^5}{y^6+y^6}=\frac{1}{2y}$, que no és fitat quan $y\to0$. Tot obert $V\ni(0,0)$ conté una bola $B((0,0),\varepsilon)$, i aquesta conté els punts $(y^3,y)$ per a $y>0$ prou petit; per tant $g$ no és fitada a $V$.
      fuites:
      - afirmaci[óo]\s+(és\s+)?(certa|veritable|falsa)
    passos:
    - id: cami_no_fitat
      titol: Una corba on g explota
      objectiu: |
        Esbrinar si hi ha alguna corba que acabi a l'origen sobre la qual $|g|$ es faci arbitràriament gran.
      idea: |
        Buscar una relació $x=y^k$ que faci comparables els sumands del denominador i deixi el numerador d'un ordre més baix.
      detall: |
        Sobre $x=y^3$: $g(y^3,y)=\frac{y^3y^2}{y^6+y^6}=\frac{1}{2y}$, que tendeix a $\pm\infty$ quan $y\to0^\pm$.
      fuites:
      - x\s*=\s*y\^\{?3\}?
      - \\[dt]?frac\{1\}\{2\s*y\}
      - 1\s*/\s*\(2\s*y\)
      teoria: []
    - id: qualsevol_obert
      titol: Qualsevol obert que contingui l'origen
      objectiu: |
        Passar d'aquesta corba a la conclusió per a un obert arbitrari que contingui l'origen.
      idea: |
        Usar la definició d'obert: conté una bola centrada en cadascun dels seus punts.
      detall: |
        Si $V$ és obert i $(0,0)\in V$, existeix $\varepsilon>0$ amb $B((0,0),\varepsilon)\subseteq V$. Per a $0<y<\min(1,\varepsilon/\sqrt2)$, $\|(y^3,y)\|\le\sqrt2\,y<\varepsilon$, així que $(y^3,y)\in V$ i $|g(y^3,y)|=\frac{1}{2y}$, que supera qualsevol fita quan $y\to0^+$: $g$ no és fitada a $V$.
      fuites: []
      teoria:
      - T1.11
      - T1.33
    errors_comuns:
    - id: copia_f
      descripcio: |
        Usa la mateixa corba que per a $f$ ($x=y^2$) i conclou que $g$ és fitada.
      pregunta: |
        Amb el denominador $x^2+y^6$, quina potència de $y$ ha de ser $x$ perquè els dos sumands siguin del mateix ordre?
    - id: un_sol_obert
      descripcio: |
        Mostra que $g$ no és fitada en un obert concret (per exemple tot $\mathbb{R}^2$) en lloc de qualsevol obert que contingui l'origen.
      pregunta: |
        El teu argument val per a un obert molt petit al voltant de l'origen? Què té en comú qualsevol obert que contingui $(0,0)$?
    nota_professor: |
      Equivalentment: $g$ no és fitada en cap entorn de l'origen, i en particular no és contínua a $(0,0)$ (cosa que s'usa a l'apartat (e)).
  - id: t2-8e
    apartat: e
    tipus: teoric
    enunciat: |
      $g$ no és contínua a $\mathbb{R}^2$ però ho és a la regió
      $$D_\delta=\left\{(r\cos\varphi,r\sin\varphi)\mid r\geqslant0,\ |\cos\varphi|>\delta\right\}\qquad(0<\delta<1).$$
    teoria:
    - T2.14
    - T1.14
    teoria_reservada: []
    resultat:
      valor: |
        Cert. $g$ no és contínua a l'origen (per (d), o perquè sobre $x=y^3$ val $\frac1{2y}$). Però $D_\delta=\{(0,0)\}\cup\{(x,y)\mid |x|>\delta\|(x,y)\|\}$ i, per a $(x,y)\in D_\delta\setminus\{(0,0)\}$, amb $r=\|(x,y)\|$: $|g(x,y)|\le\frac{|x|y^2}{x^2}=\frac{y^2}{|x|}<\frac{r^2}{\delta r}=\frac{r}{\delta}\to0$. Per tant el límit de $g|_{D_\delta}$ a l'origen és $0=g(0,0)$ i $g|_{D_\delta}$ és contínua a l'origen; als altres punts de $D_\delta$ ho és perquè $g$ ja és contínua a $\mathbb{R}^2\setminus\{(0,0)\}$.
      fuites:
      - afirmaci[óo]\s+(és\s+)?(certa|veritable|falsa)
    passos:
    - id: no_continua
      titol: No continuïtat a tot el pla
      objectiu: |
        Decidir si $g$ és contínua com a funció definida a tot $\mathbb{R}^2$.
      idea: |
        Aprofitar l'apartat (d): una funció contínua en un punt és fitada en algun entorn d'aquest punt.
      detall: |
        Si $g$ fos contínua a $(0,0)$, existiria $\rho>0$ amb $|g|<|g(0,0)|+1=1$ a $B((0,0),\rho)$, en contradicció amb (d). (Directament: sobre $x=y^3$, $g=\frac1{2y}\not\to0$.)
      fuites: []
      teoria:
      - T2.14
      - T2.6
    - id: regio
      titol: Entendre la regió
      objectiu: |
        Descriure $D_\delta$ en coordenades cartesianes i veure que l'origen hi és un punt d'acumulació.
      idea: |
        Traduir la condició sobre $\cos\varphi$ usant $x=r\cos\varphi$ i $r=\|(x,y)\|$.
      detall: |
        Per a $r>0$, $|\cos\varphi|>\delta$ equival a $|x|>\delta\|(x,y)\|$: és un parell de sectors angulars oberts al voltant de l'eix $x$ (que no toquen l'eix $y$). Amb $r=0$ s'obté l'origen. Els punts $(t,0)$, $t\neq0$, són a $D_\delta$, així que $(0,0)\in D_\delta'$.
      fuites: []
      teoria:
      - T1.14
    - id: fita
      titol: Fitar g dins la regió
      objectiu: |
        Esbrinar si $|g|$ admet a $D_\delta\setminus\{(0,0)\}$ una fita que només depengui de $r$ i tendeixi a $0$ amb $r$.
      idea: |
        Dins la regió, $|x|$ és comparable a $r$; eliminar un sumand del denominador i usar aquesta comparació.
      detall: |
        $|g(x,y)|=\frac{|x|y^2}{x^2+y^6}\le\frac{|x|y^2}{x^2}=\frac{y^2}{|x|}<\frac{r^2}{\delta r}=\frac{r}{\delta}$.
      fuites:
      - \\[dt]?frac\{r\}\{\\delta\}
      - r\s*/\s*\\delta
      - \\[dt]?frac\{y\^\{?2\}?\}\{\|x\|\}
      teoria: []
    - id: concloure
      titol: Concloure la continuïtat a la regió
      objectiu: |
        Decidir si la restricció $g|_{D_\delta}$ és contínua a tots els punts de $D_\delta$.
      idea: |
        Aplicar la definició de continuïtat a la funció restringida, separant l'origen dels altres punts.
      detall: |
        Per la fita anterior, el límit de $g|_{D_\delta}$ quan $(x,y)\to(0,0)$ és $0=g(0,0)$, de manera que $g|_{D_\delta}$ és contínua a l'origen. Als altres punts de $D_\delta$, $g$ és contínua (quocient de polinomis amb denominador no nul), i per tant també ho és la restricció.
      fuites: []
      teoria:
      - T2.14
      - T2.20
    errors_comuns:
    - id: confon_restriccio
      descripcio: |
        Entén "contínua a $D_\delta$" com que $g$, definida a tot $\mathbb{R}^2$, és contínua a cada punt de $D_\delta$, i conclou que és fals perquè l'origen hi pertany.
      pregunta: |
        Quan diem que una funció és contínua en un conjunt $\Omega$, quins punts es fan servir a la definició de límit?
    - id: fita_sense_delta
      descripcio: |
        Fita $|g|$ sense usar la condició $|x|>\delta r$, i obté una fita que no tendeix a $0$.
      pregunta: |
        On has fet servir la condició que defineix la regió? Què et diu sobre la mida de $|x|$ comparada amb $r$?
    - id: oblida_origen_regio
      descripcio: |
        No s'adona que l'origen pertany a $D_\delta$ (amb $r=0$) i només estudia punts amb $r>0$.
      pregunta: |
        Quin punt s'obté prenent $r=0$ a la definició de $D_\delta$? Cal estudiar-hi la continuïtat?
    nota_professor: |
      La regió exclou un con al voltant de l'eix $y$, precisament on viuen les corbes $x=y^3$ que fan explotar $g$. "No és contínua a $\mathbb{R}^2$" s'ha d'entendre com "no és contínua en algun punt de $\mathbb{R}^2$" (l'origen).
- num: 9
  font: null
  preambul: |
    Considereu la funció $F:\mathbb{R}^2\to\mathbb{R}^2$ que té components
    $$F_1(x,y)=\begin{cases}\dfrac{xy}{(x^2+y^2)^{1/2}} & \text{si } (x,y)\neq(0,0),\\ 0 & \text{si } (x,y)=(0,0),\end{cases}\qquad F_2(x,y)=\begin{cases}\dfrac{x}{x+y^2} & \text{si } x\neq-y^2,\\ 0 & \text{si } x=-y^2.\end{cases}$$
  indicacio: null
  exercicis:
  - id: t2-9a
    apartat: a
    tipus: calcul
    enunciat: |
      Estudieu la continuïtat de $F$ i proveu que el seu conjunt de punts de discontinuïtat és tancat.
    teoria:
    - T2.14
    - T1.11
    teoria_reservada:
    - T2.11
    resultat:
      valor: |
        $F_1$ és contínua a tot $\mathbb{R}^2$ (a l'origen, $|F_1|\le\frac12\sqrt{x^2+y^2}\to0$). $F_2$ és contínua a $\{x+y^2\neq0\}$ i discontínua a tots els punts de la paràbola $P=\{(x,y)\mid x+y^2=0\}$: als punts $(a,b)\in P$ diferents de l'origen no és fitada a prop (numerador $\to a\neq0$, denominador $\to0$), i a l'origen val $1$ sobre $y=0$ i $0$ sobre $x=0$. Per tant $F$ és contínua exactament a $\mathbb{R}^2\setminus P$, i el conjunt de discontinuïtats és $P=h^{-1}(\{0\})$ amb $h(x,y)=x+y^2$ contínua: és tancat.
      fuites:
      - discontinu\w*\s+(a|en)\s+(tots\s+els\s+punts\s+de\s+)?la\s+par[àa]bola
      - conjunt\s+de\s+(punts\s+de\s+)?discontinu\w*\s+(és|=)\s+(la\s+par[àa]bola|\$?P\b)
    passos:
    - id: components
      titol: Reduir a les components
      objectiu: |
        Relacionar la continuïtat de $F$ amb la de les seves components.
      idea: |
        Un límit a $\mathbb{R}^2$ existeix si i només si existeixen els límits de cada component.
      detall: |
        $F$ és contínua en un punt si i només si $F_1$ i $F_2$ ho són: si les components tenen límit, $F$ també (àlgebra de límits), i recíprocament $|F_i(x)-L_i|\le\|F(x)-L\|$. El conjunt de discontinuïtats de $F$ és la unió dels de $F_1$ i $F_2$.
      fuites: []
      teoria:
      - T2.9
      - T2.14
    - id: F1
      titol: Continuïtat de la primera component
      objectiu: |
        Estudiar la continuïtat de $F_1$, en particular a l'origen.
      idea: |
        Fora de l'origen és un quocient de funcions contínues; a l'origen, fitar $|xy|$ en termes de $x^2+y^2$.
      detall: |
        A $\mathbb{R}^2\setminus\{(0,0)\}$, $F_1$ és quocient de funcions contínues ($xy$ i la norma) amb denominador no nul. A l'origen: $|xy|\le\frac{x^2+y^2}{2}$, d'on $|F_1(x,y)|\le\frac12\sqrt{x^2+y^2}\to0=F_1(0,0)$. $F_1$ és contínua a tot $\mathbb{R}^2$.
      fuites:
      - \|xy\|\s*(\\le|\\leq|≤)
      - \\[dt]?frac\{?1\}?\{?2\}?\s*\\sqrt\{x\^\{?2\}?\s*\+\s*y\^\{?2\}?\}
      teoria:
      - T2.20
      - T2.14
    - id: F2
      titol: Continuïtat de la segona component
      objectiu: |
        Determinar en quins punts $F_2$ és contínua i en quins no.
      idea: |
        Separar els punts on el denominador no s'anul·la dels punts on sí; en aquests últims, mirar si el numerador també s'anul·la i provar camins.
      detall: |
        Sigui $P=\{x+y^2=0\}$. A $\mathbb{R}^2\setminus P$ (obert), $F_2$ coincideix amb el quocient $\frac{x}{x+y^2}$ de polinomis amb denominador no nul: contínua. Si $(a,b)\in P$ i $(a,b)\neq(0,0)$, aleshores $a=-b^2\neq0$ i $F_2(a+t,b)=\frac{a+t}{t}$ per a $t\neq0$, que no és fitat quan $t\to0$: discontínua. A l'origen: $F_2(x,0)=1$ per a $x\neq0$ i $F_2(0,y)=0$ per a $y\neq0$; no hi ha límit: discontínua.
      fuites:
      - \\[dt]?frac\{a\s*\+\s*t\}\{t\}
      - \(a\s*\+\s*t\)\s*/\s*t
      teoria:
      - T2.20
      - T2.10
      - T2.14
    - id: tancat
      titol: El conjunt de discontinuïtats és tancat
      objectiu: |
        Demostrar que el conjunt de punts de discontinuïtat obtingut és tancat.
      idea: |
        Escriure'l com l'antiimatge d'un tancat per una funció contínua definida a tot $\mathbb{R}^2$.
      detall: |
        El conjunt de discontinuïtats de $F$ és $P=\{(x,y)\mid x+y^2=0\}=h^{-1}(\{0\})$ amb $h(x,y)=x+y^2$ polinòmica, contínua a $\mathbb{R}^2$. Com que $\{0\}$ és tancat a $\mathbb{R}$, $P$ és tancat (caracterització de la continuïtat amb tancats). Alternativament, $\mathbb{R}^2\setminus P=\{h>0\}\cup\{h<0\}$ és unió d'oberts.
      fuites: []
      teoria:
      - T2.17
      - T2.18
    errors_comuns:
    - id: origen_continua_F2
      descripcio: |
        Pensa que a l'origen $F_2$ és contínua perquè el numerador també s'anul·la, o només comprova un camí.
      pregunta: |
        Què val $F_2$ sobre l'eix $x$ (fora de l'origen)? I sobre l'eix $y$? Coincideixen?
    - id: nomes_origen
      descripcio: |
        Només estudia l'origen i oblida els altres punts de la corba on s'anul·la el denominador.
      pregunta: |
        On s'anul·la el denominador de $F_2$? Són només punts aïllats?
    - id: tancat_sense_justificar
      descripcio: |
        Afirma que el conjunt és tancat "perquè és una corba" sense cap justificació.
      pregunta: |
        Pots escriure aquest conjunt com el conjunt de punts on una funció contínua pren un valor concret? Què en saps, d'aquests conjunts?
    nota_professor: |
      La component $F_1$ és contínua; tota la discontinuïtat ve de $F_2$, que és la funció de l'Exemple 11 dels apunts (amb els papers de $x,y$ intercanviats) i del problema 5(d).
  - id: t2-9b
    apartat: b
    tipus: teoric
    enunciat: |
      Proveu que $F\left(\left\{(x,y)\in\mathbb{R}^2\mid(x-2)^2+y^2\leqslant1\right\}\right)$ és compacte.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        Sigui $K=\{(x-2)^2+y^2\le1\}$, la bola tancada de centre $(2,0)$ i radi $1$: és tancada i fitada, i per Heine-Borel és compacta. Per a $(x,y)\in K$, $x\in[1,3]$, així que $x+y^2\ge1>0$: $K$ no talla la paràbola de discontinuïtats de l'apartat (a), i $F$ és contínua a tots els punts de $K$ (per tant $F|_K$ és contínua). La imatge contínua d'un compacte és compacta: $F(K)$ és compacte.
      fuites: []
    passos:
    - id: K_compacte
      titol: El conjunt és compacte
      objectiu: |
        Veure que el conjunt $K$ de l'enunciat és compacte.
      idea: |
        Identificar $K$ geomètricament i usar la caracterització dels compactes de $\mathbb{R}^n$.
      detall: |
        $K=\overline{B}((2,0),1)$ és una bola tancada, per tant tancada, i és fitada ($K\subseteq B((2,0),2)$). Per Heine-Borel, $K$ és compacte.
      fuites: []
      teoria:
      - T1.13
      - T1.33
      - T1.34
    - id: evita_discontinuitats
      titol: F és contínua sobre K
      objectiu: |
        Comprovar que $F$ és contínua en tots els punts de $K$.
      idea: |
        Usar l'apartat (a): cal veure que $K$ no conté cap punt de discontinuïtat, mirant el rang de valors de $x$ a $K$.
      detall: |
        Si $(x,y)\in K$, $(x-2)^2\le1$, és a dir $x\in[1,3]$, i llavors $x+y^2\ge1>0$. Així $K$ no talla $\{x+y^2=0\}$ i, per (a), $F$ és contínua a cada punt de $K$; en particular la restricció $F|_K$ és contínua.
      fuites:
      - x\s*\+\s*y\^\{?2\}?\s*(\\ge|\\geq|≥)\s*1
      - x\s*\\in\s*\[\s*1\s*,\s*3\s*\]
      teoria:
      - T2.14
    - id: imatge
      titol: Imatge contínua d'un compacte
      objectiu: |
        Concloure que $F(K)$ és compacte.
      idea: |
        Aplicar el resultat sobre la imatge d'un compacte per una funció contínua.
      detall: |
        $F|_K:K\to\mathbb{R}^2$ és contínua i $K$ és compacte; per la proposició d'imatge contínua de compactes, $F(K)$ és compacte.
      fuites: []
      teoria:
      - T2.21
    errors_comuns:
    - id: F_no_continua
      descripcio: |
        Argumenta que no es pot aplicar el resultat perquè $F$ no és contínua a $\mathbb{R}^2$.
      pregunta: |
        El resultat sobre imatges de compactes necessita la continuïtat a tot el pla, o només als punts del compacte?
    - id: compacte_sense_justificar
      descripcio: |
        Diu que $K$ és compacte sense justificar-ho, o només diu que és tancat (o només fitat).
      pregunta: |
        Quines dues propietats caracteritzen els compactes de $\mathbb{R}^n$? Les has comprovat totes dues?
    - id: antiimatge
      descripcio: |
        Confon imatge i antiimatge: intenta usar que l'antiimatge d'un compacte és compacta.
      pregunta: |
        El resultat que coneixes parla de $F(K)$ o de $F^{-1}(K)$? Quin dels dos et demanen?
    nota_professor: |
      Clau: el disc és a la regió $x\ge1$, lluny de la paràbola $x=-y^2$.
- num: 10
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t2-10
    apartat: null
    tipus: calcul
    enunciat: |
      Estudieu la continuïtat a $\mathbb{R}^2$ de la funció
      $$f(x,y)=\begin{cases}\dfrac{x^3y}{x^2+y^2-1} & \text{si } x^2+y^2-1\neq0\\ 0 & \text{si } x^2+y^2-1=0.\end{cases}$$
    teoria:
    - T2.14
    teoria_reservada: []
    resultat:
      valor: |
        $f$ és contínua a $\mathbb{R}^2\setminus S$, on $S=\{x^2+y^2=1\}$, i discontínua a tots els punts de $S$. Si $(a,b)\in S$ amb $ab\neq0$, el numerador tendeix a $a^3b\neq0$ i el denominador a $0$ ($f$ no és fitada a prop). Als quatre punts $(\pm1,0)$, $(0,\pm1)$, on el numerador s'anul·la, tampoc no és contínua: $f(\pm1,y)=\pm\frac1y$ i, sobre $y=\pm\sqrt{1-x^2+x^4}$, $f=\frac{y}{x}$, no fitada.
      fuites:
      - discontinu\w*\s+(a|en)\s+tots\s+(els\s+)?punts\s+de\s+la\s+circumfer
      - cont[íi]nua\s+(exactament\s+)?(a|en)\s+\$\\mathbb\{R\}\^\{?2\}?\s*\\setminus\s*S
      - discontinu\w*\s+(a|en)\s+tots\s+(els\s+)?punts\s+de\s+\$?S\b
    passos:
    - id: fora_cercle
      titol: Fora de la circumferència
      objectiu: |
        Estudiar la continuïtat als punts on el denominador no s'anul·la.
      idea: |
        Aquests punts formen un obert on $f$ coincideix amb un quocient de polinomis.
      detall: |
        $U=\{x^2+y^2\neq1\}$ és obert (unió de $\{x^2+y^2<1\}$ i $\{x^2+y^2>1\}$) i a $U$ la funció és un quocient de polinomis amb denominador no nul: $f$ és contínua a cada punt de $U$.
      fuites: []
      teoria:
      - T2.18
      - T2.20
    - id: punts_generics
      titol: Punts de la circumferència amb numerador no nul
      objectiu: |
        Estudiar la continuïtat als punts $(a,b)$ de la circumferència on el numerador no s'anul·la.
      idea: |
        Comparar a què tendeixen el numerador i el denominador a prop d'aquests punts, i triar un camí concret cap al punt (que no vagi per sobre la circumferència) per fer-ho explícit.
      detall: |
        Si $a^2+b^2=1$ i $ab\neq0$, prenem $(x,y)=(1+t)(a,b)$, $t\to0$, $t\neq0$: $f=\frac{(1+t)^4a^3b}{(1+t)^2-1}=\frac{(1+t)^4a^3b}{t(2+t)}$, que no és fitat. $f$ no és contínua a $(a,b)$.
      fuites:
      - \(1\s*\+\s*t\)\^\{?2\}?\s*-\s*1
      - t\s*\(2\s*\+\s*t\)
      teoria:
      - T2.10
      - T2.14
    - id: punts_especials
      titol: Els quatre punts on el numerador s'anul·la
      objectiu: |
        Estudiar la continuïtat als punts de la circumferència on també s'anul·la el numerador.
      idea: |
        Són $(\pm1,0)$ i $(0,\pm1)$. Busca camins cap a aquests punts sobre els quals el denominador sigui molt més petit que el numerador.
      detall: |
        A $(1,0)$: $f(1,y)=\frac{y}{1+y^2-1}=\frac{1}{y}$ per a $y\neq0$, no fitat (anàlogament a $(-1,0)$, $f(-1,y)=-\frac1y$). A $(0,1)$: sobre $y=\sqrt{1-x^2+x^4}$ (que tendeix a $1$) el denominador val $x^4$ i $f=\frac{x^3y}{x^4}=\frac{y}{x}$, no fitat quan $x\to0$ (anàlogament a $(0,-1)$ amb $y=-\sqrt{1-x^2+x^4}$). $f$ no és contínua en cap d'aquests punts.
      fuites:
      - \\[dt]?frac\{1\}\{y\}
      - 1\s*/\s*y
      - 1\s*-\s*x\^\{?2\}?\s*\+\s*x\^\{?4\}?
      - f\(\s*(\\pm\s*)?-?1\s*,\s*y\s*\)
      - \\[dt]?frac\{y\}\{x\}
      teoria:
      - T2.10
      - T2.14
    - id: conclusio
      titol: Conclusió
      objectiu: |
        Resumir on és contínua $f$.
      idea: |
        Ajuntar els tres casos.
      detall: |
        $f$ és contínua exactament a $\{x^2+y^2\neq1\}$ i discontínua a tots els punts de la circumferència unitat.
      fuites: []
      teoria:
      - T2.14
    errors_comuns:
    - id: especials_continus
      descripcio: |
        Conclou que als punts $(\pm1,0)$, $(0,\pm1)$ la funció és contínua perquè el numerador s'hi anul·la (o perquè sobre la circumferència i sobre rectes radials val $0$).
      pregunta: |
        Que numerador i denominador s'anul·lin al mateix punt decideix el límit? Pots acostar-te a $(1,0)$ per un camí on el denominador sigui molt més petit que el numerador?
    - id: nomes_circumferencia
      descripcio: |
        Estudia el límit només movent-se per sobre la circumferència (on $f=0$) i conclou continuïtat.
      pregunta: |
        Per estudiar el límit en un punt de la circumferència, n'hi ha prou amb punts de la circumferència?
    - id: fora_sense_justificar
      descripcio: |
        No justifica la continuïtat fora de la circumferència o no s'adona que cal que el conjunt sigui obert.
      pregunta: |
        Per què el fet que $f$ coincideixi amb un quocient de polinomis prop d'un punt n'assegura la continuïtat? Quina propietat del conjunt $\{x^2+y^2\neq1\}$ fas servir?
    nota_professor: |
      Atenció: és temptador (i erroni) concloure que $f$ és contínua als quatre punts $(\pm1,0)$, $(0,\pm1)$. El numerador s'hi anul·la només com $|y|$ o $|x|^3$, mentre que el denominador pot fer-se arbitràriament petit: el quocient no és fitat. Comprovat: $f(1,y)=1/y$; a $(0,1)$, $f\left(x,\sqrt{1-x^2+x^4}\right)=\sqrt{1-x^2+x^4}/x$.
- num: 11
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t2-11
    apartat: null
    tipus: calcul
    enunciat: |
      Estudieu la continuïtat de la funció $f:\mathbb{R}^2\to\mathbb{R}$ definida per
      $$f(x,y)=\frac{(x-1)^3y^2}{(x-1)^4+y^4},\quad\text{si }(x,y)\neq(1,0)\ \text{ i }\ f(1,0)=0.$$
    teoria:
    - T2.14
    teoria_reservada: []
    resultat:
      valor: |
        $f$ és contínua a tot $\mathbb{R}^2$. Fora de $(1,0)$ és un quocient de polinomis amb denominador no nul. A $(1,0)$, amb $u=x-1$: $u^2y^2\le\frac{u^4+y^4}{2}$, d'on $|f(x,y)|\le\frac{|u|}{2}=\frac{|x-1|}{2}\to0=f(1,0)$.
      fuites:
      - cont[íi]nua\s+(a|en)\s+tot\s+\$?\\mathbb\{R\}
      - (és\s+)?(també\s+)?cont[íi]nua\s+(a|en)\s+(el\s+punt\s+)?\$\(1,\s*0\)\$
    passos:
    - id: fora
      titol: Fora del punt (1,0)
      objectiu: |
        Estudiar la continuïtat als punts diferents de $(1,0)$.
      idea: |
        Mirar on s'anul·la el denominador i usar l'àlgebra de funcions contínues.
      detall: |
        $(x-1)^4+y^4=0$ només si $(x,y)=(1,0)$. A l'obert $\mathbb{R}^2\setminus\{(1,0)\}$, $f$ és quocient de polinomis amb denominador no nul: contínua.
      fuites: []
      teoria:
      - T2.20
    - id: fita
      titol: Fitar a prop de (1,0)
      objectiu: |
        Trobar una fita de $|f(x,y)-f(1,0)|$ que tendeixi a $0$ quan $(x,y)\to(1,0)$.
      idea: |
        Traslladar el punt a l'origen ($u=x-1$) i comparar el producte $u^2y^2$ amb la suma $u^4+y^4$.
      detall: |
        Amb $u=x-1$: de $(u^2-y^2)^2\ge0$ surt $u^2y^2\le\frac{u^4+y^4}{2}$, i llavors $|f|=\frac{|u|\,u^2y^2}{u^4+y^4}\le\frac{|u|}{2}=\frac{|x-1|}{2}$.
      fuites:
      - \\frac\{\|u\|\}\{2\}
      - \\frac\{\|x\s*-\s*1\|\}\{2\}
      - u\^\{?2\}?\s*y\^\{?2\}?\s*(\\le|\\leq|≤)
      teoria: []
    - id: concloure
      titol: Concloure
      objectiu: |
        Decidir la continuïtat al punt $(1,0)$ i donar la conclusió global.
      idea: |
        Criteri del sandvitx amb la fita trobada i definició de continuïtat.
      detall: |
        $0\le|f(x,y)|\le\frac{|x-1|}{2}\to0$, per tant $\lim_{(x,y)\to(1,0)}f(x,y)=0=f(1,0)$. La funció és contínua a $(1,0)$ i, per tant, a tot $\mathbb{R}^2$.
      fuites: []
      teoria:
      - T2.6
      - T2.14
    errors_comuns:
    - id: camins_com_a_prova
      descripcio: |
        Prova rectes $y=m(x-1)$ (totes donen $0$) i conclou la continuïtat sense una fita.
      pregunta: |
        Que totes les rectes que passen per $(1,0)$ donin el mateix valor, demostra que el límit existeix?
    - id: grau_igual
      descripcio: |
        Pensa que, com que numerador i denominador tenen grau $5$ i $4$ en "variables barrejades", el límit no existeix (confonent amb el cas $\frac{u^2y^2}{u^4+y^4}$).
      pregunta: |
        El quocient $\frac{u^2y^2}{u^4+y^4}$ és fitat? Què passa quan el multipliques per $u$?
    nota_professor: |
      Es pot fer també en polars centrades a $(1,0)$: $|f|=r\frac{|\cos^3\varphi|\sin^2\varphi}{\cos^4\varphi+\sin^4\varphi}\le r\cdot\frac{1}{1/2}$, fita uniforme en $\varphi$ (perquè $\cos^4\varphi+\sin^4\varphi\ge\frac12$).
- num: 12
  font: null
  preambul: |
    Considerem la funció $f:\mathbb{R}^2\to\mathbb{R}$ definida per
    $$f(x,y)=\begin{cases}\dfrac{x^2+y^2}{x+y} & \text{si } x+y\neq0,\\ 0 & \text{si } x+y=0.\end{cases}$$
  indicacio: null
  exercicis:
  - id: t2-12a
    apartat: a
    tipus: calcul
    enunciat: |
      Estudieu la continuïtat de $f$ en $\mathbb{R}^2\setminus\{(0,0)\}$.
    teoria:
    - T2.14
    teoria_reservada: []
    resultat:
      valor: |
        A $\mathbb{R}^2\setminus\{(0,0)\}$, $f$ és contínua exactament als punts amb $x+y\neq0$ i discontínua a tots els punts $(a,-a)$ amb $a\neq0$: allà el numerador tendeix a $2a^2\neq0$ i el denominador a $0$, de manera que $f$ no és fitada a prop (per exemple $f(a+t,-a)=\frac{(a+t)^2+a^2}{t}$).
      fuites:
      - discontinu\w*\s+(a|en)\s+(tots\s+)?(els\s+)?punts\s+(de\s+la\s+recta\s+)?\$?(x\s*\+\s*y\s*=\s*0|\(a,\s*-\s*a\))
    passos:
    - id: fora_recta
      titol: Fora de la recta x+y=0
      objectiu: |
        Estudiar la continuïtat als punts on el denominador no s'anul·la.
      idea: |
        Aquests punts formen un obert on $f$ és quocient de polinomis.
      detall: |
        $\{x+y\neq0\}=\{x+y>0\}\cup\{x+y<0\}$ és obert i hi $f=\frac{x^2+y^2}{x+y}$, quocient de polinomis amb denominador no nul: contínua.
      fuites: []
      teoria:
      - T2.18
      - T2.20
    - id: sobre_recta
      titol: Sobre la recta, fora de l'origen
      objectiu: |
        Estudiar la continuïtat als punts $(a,-a)$ amb $a\neq0$.
      idea: |
        Mirar cap a on tendeixen numerador i denominador i buscar un camí que ho faci explícit.
      detall: |
        A $(a,-a)$, $a\neq0$, el numerador tendeix a $2a^2\neq0$ i el denominador a $0$. Sobre el camí $(a+t,-a)$: $f=\frac{(a+t)^2+a^2}{t}$, que no és fitat quan $t\to0$. $f$ no té límit a $(a,-a)$: discontínua.
      fuites:
      - 2\s*a\^\{?2\}?\s*(\\neq|\\ne|≠)\s*0
      - \\[dt]?frac\{\(a\s*\+\s*t\)\^\{?2\}?\s*\+\s*a\^\{?2\}?\}\{t\}
      teoria:
      - T2.10
      - T2.14
    errors_comuns:
    - id: valor_definit
      descripcio: |
        Pensa que, com que $f$ està definida com $0$ sobre la recta, és contínua allà.
      pregunta: |
        Per a la continuïtat a $(a,-a)$, n'hi ha prou amb saber el valor de $f$ en aquest punt? Què passa amb els valors de $f$ als punts propers fora de la recta?
    - id: nomes_sobre_recta
      descripcio: |
        Calcula el límit només movent-se sobre la recta $x+y=0$ (on $f=0$).
      pregunta: |
        Quins punts propers a $(a,-a)$ no són a la recta? Què val $f$ en aquests?
    nota_professor: |
      L'origen s'exclou expressament perquè allà el numerador també s'anul·la; es tracta a (c).
  - id: t2-12b
    apartat: b
    tipus: calcul
    enunciat: |
      Escriviu les equacions de les corbes de nivell $0$, $2$ i $-2$ de $f$. Dibuixeu-les.
    teoria:
    - T2.4
    teoria_reservada: []
    resultat:
      valor: |
        - $C_0$: la recta $x+y=0$ (incloent-hi l'origen); fora d'ella el numerador $x^2+y^2$ no s'anul·la.
        - $C_2$: $(x-1)^2+(y-1)^2=2$ menys l'origen; circumferència de centre $(1,1)$ i radi $\sqrt2$, sense el punt $(0,0)$.
        - $C_{-2}$: $(x+1)^2+(y+1)^2=2$ menys l'origen; circumferència de centre $(-1,-1)$ i radi $\sqrt2$, sense $(0,0)$.
        Totes dues circumferències passen per l'origen i hi són tangents a la recta $x+y=0$.
      fuites:
      - \(x\s*-\s*1\)\^\{?2\}?\s*\+\s*\(y\s*-\s*1\)\^\{?2\}?
      - \(x\s*\+\s*1\)\^\{?2\}?\s*\+\s*\(y\s*\+\s*1\)\^\{?2\}?
      - centre\s+\$?\(\s*-?1\s*,\s*-?1\s*\)
    passos:
    - id: nivell0
      titol: Corba de nivell 0
      objectiu: |
        Determinar el conjunt de punts on $f$ val $0$.
      idea: |
        Separar els punts on $f$ es defineix pel quocient dels punts on es defineix com $0$.
      detall: |
        Si $x+y\neq0$, $f=0$ exigeix $x^2+y^2=0$, és a dir $(0,0)$, que no compleix $x+y\neq0$. Per tant $C_0=\{x+y=0\}$: és tota la recta $y=-x$.
      fuites:
      - C_\{?0\}?\s*=\s*\\\{\s*x\s*\+\s*y\s*=\s*0
      - tota\s+la\s+recta
      teoria:
      - T2.4
    - id: nivell_k
      titol: Corbes de nivell 2 i -2
      objectiu: |
        Escriure les equacions de $C_2$ i $C_{-2}$ i identificar-les.
      idea: |
        Plantejar $x^2+y^2=k(x+y)$ amb $x+y\neq0$ i completar quadrats; comprovar quins punts de la corba obtinguda no compleixen $x+y\neq0$.
      detall: |
        $x^2+y^2=2(x+y)\iff(x-1)^2+(y-1)^2=2$: circumferència de centre $(1,1)$ i radi $\sqrt2$. La intersecció amb $x+y=0$: $(x-1)^2+(x+1)^2=2\iff x=0$, és a dir, només l'origen, que cal treure. Anàlogament $x^2+y^2=-2(x+y)\iff(x+1)^2+(y+1)^2=2$, centre $(-1,-1)$, radi $\sqrt2$, sense l'origen.
      fuites:
      - \(x\s*-\s*1\)\^\{?2\}?\s*\+\s*\(y\s*-\s*1\)\^\{?2\}?
      - \(x\s*\+\s*1\)\^\{?2\}?\s*\+\s*\(y\s*\+\s*1\)\^\{?2\}?
      teoria:
      - T2.4
    - id: dibuix
      titol: Dibuix
      objectiu: |
        Dibuixar les tres corbes i observar com es disposen a prop de l'origen.
      idea: |
        Situar centres i radis i mirar per quin punt passen totes.
      detall: |
        Les dues circumferències són simètriques respecte de l'origen, passen per $(0,0)$ (on hi ha un forat) i en aquest punt són tangents a la recta $x+y=0$ (el radi des de $(1,1)$ fins a $(0,0)$ és perpendicular a la recta). En general, $C_k$ ($k\neq0$) és la circumferència de centre $(\frac k2,\frac k2)$ i radi $\frac{|k|}{\sqrt2}$ menys l'origen.
      fuites: []
      teoria: []
    errors_comuns:
    - id: oblida_forat
      descripcio: |
        No treu l'origen de les circumferències (on $f$ val $0$ per definició).
      pregunta: |
        Quant val $f$ a l'origen? Pot ser aquest punt a la corba de nivell $2$?
    - id: nivell0_buit
      descripcio: |
        Diu que $C_0$ és buit o només l'origen, perquè $x^2+y^2=0$ només a l'origen, oblidant la definició a trossos.
      pregunta: |
        On val $f$ zero per definició, independentment del quocient?
    - id: quadrats
      descripcio: |
        S'equivoca completant quadrats (radi $2$ en lloc de $\sqrt2$, o centre mal situat).
      pregunta: |
        Si desenvolupes la teva equació de la circumferència, recuperes exactament $x^2+y^2-2x-2y=0$?
    nota_professor: |
      Les corbes de nivell $k\neq0$ són totes circumferències que passen per l'origen; això prepara l'apartat (c).
  - id: t2-12c
    apartat: c
    tipus: calcul
    enunciat: |
      Utilitzeu l'apartat anterior per deduir si $f$ és contínua en $(0,0)$.
    teoria:
    - T2.14
    teoria_reservada: []
    resultat:
      valor: |
        No és contínua a l'origen. $f(0,0)=0$, però $C_2$ (circumferència de centre $(1,1)$ i radi $\sqrt2$ sense l'origen) s'acosta a $(0,0)$: sobre aquesta corba $f$ val constantment $2$, i per tant el límit per aquest camí és $2\neq0$. (Igualment $C_{-2}$ dona $-2$.) El límit a l'origen no existeix.
      fuites:
      - no\s+(és\s+)?cont[íi]nua\s+(a|en)\s+(l.origen|\$\(0,\s*0\)\$)
      - discontinu\w*\s+(a|en)\s+(l.origen|\$\(0,\s*0\)\$)
    passos:
    - id: corbes_origen
      titol: Les corbes de nivell passen per l'origen
      objectiu: |
        Assumint l'apartat (b), observar quines corbes de nivell s'acosten a l'origen.
      idea: |
        Mirar el dibuix de (b): per quin punt passen totes les corbes de nivell?
      detall: |
        Les corbes $C_2$ i $C_{-2}$ (i en general totes les $C_k$) tenen l'origen com a punt d'acumulació: en tot entorn de $(0,0)$ hi ha punts on $f=2$ i punts on $f=-2$, a més dels de la recta on $f=0$.
      fuites: []
      teoria:
      - T2.4
    - id: concloure
      titol: Concloure
      objectiu: |
        Deduir si existeix el límit a l'origen i si coincideix amb $f(0,0)$.
      idea: |
        Calcular el límit de $f$ seguint una corba de nivell que acabi a l'origen.
      detall: |
        Prop de l'origen, $C_2$ és la gràfica $y=1-\sqrt{2-(x-1)^2}$ (contínua, val $0$ a $x=0$), i per a $x\neq0$ petit $f$ hi val constantment $2$: el límit per aquest camí és $2$. Sobre la recta $x+y=0$ el límit és $0$. No existeix el límit, i en particular $f$ no és contínua a $(0,0)$.
      fuites:
      - 1\s*-\s*\\sqrt\{2\s*-\s*\(x\s*-\s*1\)\^\{?2\}?\}
      - constantment\s+\$?-?2
      teoria:
      - T2.10
      - T2.14
    errors_comuns:
    - id: fitat_continu
      descripcio: |
        Calcula límits sobre rectes $y=mx$ ($m\neq-1$), obté $0$ i conclou que $f$ és contínua a l'origen.
      pregunta: |
        Les corbes de nivell que has dibuixat a (b), per on passen? Quin valor pren $f$ sobre elles?
    - id: forat
      descripcio: |
        Argumenta que, com que l'origen no és a $C_2$, aquesta corba no diu res sobre l'origen.
      pregunta: |
        Per estudiar un límit a $(0,0)$, importa el valor de $f$ al punt, o els valors als punts propers?
    nota_professor: |
      Bona il·lustració: si totes les corbes de nivell passen per un punt, la funció no pot tenir límit allà (llevat que sigui constant). Les rectes $y=mx$ ($m\neq-1$) donen $\frac{(1+m^2)x}{1+m}\to0$, que és enganyós.
- num: 13
  font: null
  preambul: |
    Raoneu si són oberts els subconjunts de $\mathbb{R}^2$ o $\mathbb{R}^3$ següents:
  indicacio: null
  exercicis:
  - id: t2-13a
    apartat: a
    tipus: teoric
    enunciat: |
      $A=\{(x,y)\in\mathbb{R}^2\ \mid\ \cos\left(x+y\right)+\sin\left(x-y\right)<1\}$.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $A$ és obert: $f(x,y)=\cos(x+y)+\sin(x-y)$ és contínua a tot $\mathbb{R}^2$ i $A=\{f<1\}$ és un conjunt definit per una desigualtat estricta entre funcions contínues a $\mathbb{R}^2$.
      fuites:
      - (?<!si\s)(?<!si\s\$)(\$A\$|\bA\b)\s+és\s+(un\s+)?(conjunt\s+)?obert\b
      - \bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?obert\b
    passos:
    - id: continuitat
      titol: Continuïtat de la funció que defineix el conjunt
      objectiu: |
        Identificar la funció que defineix $A$ i decidir on està definida i on és contínua.
      idea: |
        Escriure $A$ com el conjunt on una certa funció és menor que una constant, i justificar la continuïtat d'aquesta funció com a composició i suma de funcions contínues (polinomis de grau $1$ i les funcions $\sin$, $\cos$ d'una variable).
      detall: |
        Sigui $f(x,y)=\cos(x+y)+\sin(x-y)$. Les aplicacions $(x,y)\mapsto x+y$ i $(x,y)\mapsto x-y$ són polinòmiques (contínues), $\cos$ i $\sin$ són contínues a $\mathbb{R}$, de manera que les composicions són contínues i la seva suma també. Per tant $f$ és contínua a tot $\mathbb{R}^2$ (el seu domini és tot $\mathbb{R}^2$).
      fuites: []
      teoria:
      - T2.19
      - T2.20
    - id: concloure
      titol: Aplicar el resultat sobre desigualtats estrictes
      objectiu: |
        Deduir, a partir de la continuïtat, si $A$ compleix la definició de conjunt obert.
      idea: |
        Un conjunt definit per una desigualtat estricta entre dues funcions contínues a tot $\mathbb{R}^n$ és obert (equivalentment, és l'antiimatge d'un obert de $\mathbb{R}$ per una funció contínua).
      detall: |
        Amb $g\equiv 1$ (contínua), $A=\{(x,y)\in\mathbb{R}^2: g(x,y)>f(x,y)\}$, que és obert pel corol·lari dels conjunts definits per desigualtats. Equivalentment, $A=f^{-1}((-\infty,1))$ és l'antiimatge d'un obert de $\mathbb{R}$ per una funció contínua definida a tot $\mathbb{R}^2$. Per tant $A$ és obert.
      fuites:
      - f\^\{?-1\}?\s*\(\s*\(\s*-\s*\\infty\s*,\s*1\s*\)
      teoria:
      - T2.18
      - T2.17
    errors_comuns:
    - id: busca_boles_explicites
      descripcio: |
        Intenta trobar explícitament el radi de la bola al voltant de cada punt i s'encalla, sense adonar-se que la continuïtat ja ho resol.
      pregunta: |
        Hi ha algun resultat de teoria que relacioni la continuïtat d'una funció amb el caràcter dels conjunts que defineix amb desigualtats?
    - id: confon_estricta
      descripcio: |
        Pensa que el resultat depèn de si el conjunt és fitat o no, o confon el cas de desigualtat estricta amb el de desigualtat no estricta.
      pregunta: |
        Quina diferència hi ha entre $\{f<1\}$ i $\{f\le 1\}$ pel que fa al tipus de conjunt que s'obté? Importa que el conjunt sigui fitat?
    - id: no_justifica_continuitat
      descripcio: |
        Afirma que $f$ és contínua sense justificar-ho ni comprovar on està definida.
      pregunta: |
        On està definida $f$, i per què hi és contínua? De quines funcions més simples està construïda?
    nota_professor: |
      Aplicació directa del corol·lari 18 (T2.18). El conjunt no és fitat (és invariant per $(x,y)\mapsto(x+2\pi,y+2\pi)$), però això no afecta l'obertura.
  - id: t2-13b
    apartat: b
    tipus: teoric
    enunciat: |
      $B=\{(x,y)\in\mathbb{R}^2\ \mid\ xy\log\left(x-y\right)>5\}$.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $B$ és obert. La funció $f(x,y)=xy\log(x-y)$ és contínua al seu domini $\Omega=\{x>y\}$, que és obert; aleshores $B=f^{-1}((5,+\infty))=U\cap\Omega$ amb $U$ obert de $\mathbb{R}^2$, intersecció de dos oberts.
      fuites:
      - (?<!si\s)(?<!si\s\$)(\$B\$|\bB\b)\s+és\s+(un\s+)?(conjunt\s+)?obert\b
      - \bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?obert\b
    passos:
    - id: domini
      titol: Domini de la funció
      objectiu: |
        Determinar on està definida la funció que apareix a la condició de $B$, i quin tipus de conjunt és aquest domini.
      idea: |
        El logaritme només està definit per arguments positius; el domini resultant també és un conjunt definit per una desigualtat entre funcions contínues.
      detall: |
        $f(x,y)=xy\log(x-y)$ està definida a $\Omega=\{(x,y)\in\mathbb{R}^2: x>y\}$. Com que $(x,y)\mapsto x$ i $(x,y)\mapsto y$ són contínues a $\mathbb{R}^2$, $\Omega$ és obert (desigualtat estricta entre funcions contínues). En particular $B\subseteq\Omega$.
      fuites:
      - x\s*>\s*y\b
      - x\s*-\s*y\s*>\s*0
      teoria:
      - T2.18
    - id: continuitat
      titol: Continuïtat a $\Omega$
      objectiu: |
        Justificar on és contínua la funció que defineix $B$.
      idea: |
        Producte i composició de funcions contínues; el logaritme és continu a $(0,+\infty)$.
      detall: |
        $(x,y)\mapsto x-y$ és contínua i pren valors a $(0,+\infty)$ sobre $\Omega$, on $\log$ és contínua; la composició $\log(x-y)$ és contínua a $\Omega$, i multiplicada pel polinomi $xy$ dona $f$ contínua a $\Omega$.
      fuites: []
      teoria:
      - T2.19
      - T2.20
    - id: concloure
      titol: Antiimatge d'un obert
      objectiu: |
        Deduir si $B$ és obert de $\mathbb{R}^2$ (no només dins del domini).
      idea: |
        La caracterització topològica de la continuïtat dona l'antiimatge d'un obert com la intersecció d'un obert de l'espai amb el domini; cal combinar-ho amb el caràcter del domini.
      detall: |
        $B=f^{-1}((5,+\infty))$ i $(5,+\infty)$ és obert de $\mathbb{R}$. Per la caracterització de la continuïtat, existeix $U\subseteq\mathbb{R}^2$ obert amb $B=U\cap\Omega$. Com que $\Omega$ és obert, $B$ és intersecció finita d'oberts, i per tant és obert de $\mathbb{R}^2$.
      fuites:
      - U\s*\\cap\s*\\Omega
      teoria:
      - T2.17
      - T2.x4
      - T1.12
    errors_comuns:
    - id: oblida_domini
      descripcio: |
        Aplica el corol·lari de les desigualtats com si $f$ fos contínua a tot $\mathbb{R}^2$, sense mirar el domini del logaritme.
      pregunta: |
        El resultat que fas servir demana funcions contínues a tot $\mathbb{R}^2$. Està definida $f$ a tot arreu?
    - id: domini_no_obert_irrellevant
      descripcio: |
        Creu que l'antiimatge d'un obert per una funció contínua és sempre oberta, sigui quin sigui el domini.
      pregunta: |
        Si una funció contínua només està definida en un conjunt $\Omega$, què diu exactament la teoria de l'antiimatge d'un obert? Quin paper hi juga $\Omega$?
    - id: confon_signe_log
      descripcio: |
        Posa com a domini $x-y\ge 0$ o $x-y>1$ (confusió amb el signe o el valor del logaritme).
      pregunta: |
        Per a quins valors de $t$ està definit $\log t$? I quins valors pot prendre $\log t$ en aquest domini?
    nota_professor: |
      Combina T2.17(c) amb el comentari T2.x4: si el domini $\Omega$ és obert, les antiimatges d'oberts són obertes de $\mathbb{R}^n$.
  - id: t2-13c
    apartat: c
    tipus: teoric
    enunciat: |
      $C=\{(x,y)\in\mathbb{R}^2\ \mid\ \sqrt{x+y}<1\}$.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $C$ no és obert. Com que l'arrel només està definida per $x+y\ge 0$, $C=\{(x,y): 0\le x+y<1\}$. El punt $(0,0)\in C$, però tota bola $B_r(0,0)$ conté punts $(-t,0)$ amb $0<t<r$, que no són de $C$. (És obert relatiu al domini $\{x+y\ge0\}$, però no és obert de $\mathbb{R}^2$.)
      fuites:
      - (\$C\$|\bC\b)\s+no\s+és\s+(un\s+)?(conjunt\s+)?obert\b
      - \bno,?\s+no\s+és\s+(un\s+)?(conjunt\s+)?obert\b
    passos:
    - id: domini
      titol: Domini i descripció de $C$
      objectiu: |
        Determinar exactament quins punts formen $C$, tenint en compte on té sentit l'expressió.
      idea: |
        L'arrel quadrada real només està definida per a arguments no negatius; després es pot eliminar l'arrel perquè és creixent.
      detall: |
        $\sqrt{x+y}$ només té sentit si $x+y\ge 0$, i en aquest cas $\sqrt{x+y}<1\iff x+y<1$. Per tant $C=\{(x,y)\in\mathbb{R}^2: 0\le x+y<1\}$, una franja que conté la recta $x+y=0$.
      fuites:
      - 0\s*(\\le|\\leq|≤|\\leqslant)\s*x\s*\+\s*y\s*<\s*1
      teoria: []
    - id: punt_frontera
      titol: Buscar un punt problemàtic
      objectiu: |
        Comprovar la definició d'obert en els punts de $C$ que siguin a la vora del domini.
      idea: |
        Un conjunt és obert si cada punt seu té una bola continguda en el conjunt; mirar un punt de $C$ amb $x+y=0$.
      detall: |
        $(0,0)\in C$ perquè $\sqrt{0}=0<1$. Però per a tot $r>0$, el punt $(-r/2,0)\in B_r(0,0)$ compleix $x+y=-r/2<0$, de manera que no és de $C$. Cap bola centrada a $(0,0)$ està continguda en $C$, i per tant $C$ no és obert.
      fuites:
      - \(\s*-\s*r\s*/\s*2\s*,\s*0\s*\)
      - \(\s*-\s*\\frac\{r\}\{2\}\s*,\s*0\s*\)
      teoria:
      - T1.11
    errors_comuns:
    - id: aplica_corollari_cec
      descripcio: |
        Diu que és obert perquè $\sqrt{x+y}$ és contínua i la desigualtat és estricta, sense tenir en compte que la funció no està definida a tot $\mathbb{R}^2$.
      pregunta: |
        El corol·lari de les desigualtats estrictes, quina hipòtesi demana sobre el domini de les funcions? Es compleix aquí?
    - id: oblida_domini
      descripcio: |
        Escriu $C=\{x+y<1\}$, oblidant la condició $x+y\ge 0$ que imposa l'arrel.
      pregunta: |
        Quant val $\sqrt{x+y}$ al punt $(-5,0)$? Pertany aquest punt a $C$?
    - id: obert_relatiu
      descripcio: |
        Confon ser obert dins del domini (obert relatiu) amb ser obert de $\mathbb{R}^2$.
      pregunta: |
        La pregunta és sobre $\mathbb{R}^2$. Si agafes un punt de $C$ sobre la recta $x+y=0$, quina bola de $\mathbb{R}^2$ cap dins de $C$?
    nota_professor: |
      És l'exemple típic del comentari T2.x4: per una funció contínua en un domini $\Omega$ no obert, $\{f<1\}=U\cap\Omega$ només és obert relatiu a $\Omega$. $C$ no és obert ni tancat.
  - id: t2-13d
    apartat: d
    tipus: teoric
    enunciat: |
      $D=\{(x,y,z)\in\mathbb{R}^3\ \mid\ 1<x+y^2+z^3<3,\ xyz<0\}$.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $D$ és obert: és la intersecció dels tres conjunts $\{x+y^2+z^3>1\}$, $\{x+y^2+z^3<3\}$ i $\{xyz<0\}$, cadascun definit per una desigualtat estricta entre funcions polinòmiques (contínues a tot $\mathbb{R}^3$), i per tant oberts; la intersecció finita d'oberts és oberta.
      fuites:
      - (?<!si\s)(?<!si\s\$)(\$D\$|\bD\b)\s+és\s+(un\s+)?(conjunt\s+)?obert\b
      - \bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?obert\b
    passos:
    - id: descompondre
      titol: Escriure $D$ com a intersecció
      objectiu: |
        Expressar $D$ en termes de conjunts més simples, cadascun definit per una sola condició.
      idea: |
        Una doble desigualtat i una condició addicional són una conjunció de condicions: cada condició defineix un conjunt i $D$ és la seva intersecció.
      detall: |
        $D=D_1\cap D_2\cap D_3$ amb $D_1=\{x+y^2+z^3>1\}$, $D_2=\{x+y^2+z^3<3\}$, $D_3=\{xyz<0\}$.
      fuites: []
      teoria: []
    - id: cada_un_obert
      titol: Cada condició dona un obert
      objectiu: |
        Decidir quin tipus de conjunt és cadascuna de les peces.
      idea: |
        Les funcions que hi apareixen són polinomis, contínues a tot $\mathbb{R}^3$, i les desigualtats són estrictes.
      detall: |
        $p(x,y,z)=x+y^2+z^3$ i $q(x,y,z)=xyz$ són polinomis, contínues a $\mathbb{R}^3$. Pel corol·lari dels conjunts definits per desigualtats estrictes, $D_1=\{p>1\}$, $D_2=\{3>p\}$ i $D_3=\{0>q\}$ són oberts.
      fuites: []
      teoria:
      - T2.20
      - T2.18
    - id: interseccio
      titol: Intersecció finita
      objectiu: |
        Concloure sobre $D$ a partir de les peces.
      idea: |
        Propietats dels oberts respecte de les interseccions.
      detall: |
        La intersecció finita d'oberts és oberta, per tant $D=D_1\cap D_2\cap D_3$ és obert de $\mathbb{R}^3$.
      fuites: []
      teoria:
      - T1.12
    errors_comuns:
    - id: doble_desigualtat
      descripcio: |
        No sap tractar la doble desigualtat i intenta aplicar el corol·lari directament a "$1<p<3$".
      pregunta: |
        La condició $1<p<3$ és una sola desigualtat o la conjunció de dues? Quin conjunt defineix cadascuna?
    - id: interseccio_infinita
      descripcio: |
        Justifica la intersecció amb una propietat que no s'aplica (per exemple, creu que tota intersecció d'oberts és oberta, o confon amb les propietats dels tancats).
      pregunta: |
        Quantes interseccions fas aquí? La propietat que fas servir, val per a qualsevol nombre d'interseccions d'oberts?
    nota_professor: |
      No cal saber si $D$ és no buit (ho és: per exemple $(2,1,-0.1)$ compleix $1<2+1-0.001<3$ i $xyz=-0.2<0$).
  - id: t2-13e
    apartat: e
    tipus: teoric
    enunciat: |
      $E=\left\{(x,y,z)\in\mathbb{R}^3\ \mid\ \left|\dfrac{x+y+z}{x^3+y^3+z^3}\right|<1\right\}$.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $E$ és obert. Si $s_1=x+y+z$ i $s_3=x^3+y^3+z^3$, aleshores $E=\{(x,y,z)\in\mathbb{R}^3: |s_1|<|s_3|\}$ (on $s_3=0$ la desigualtat $|s_1|<0$ és impossible, i on $s_3\neq0$ les dues condicions són equivalents), que és obert per ser una desigualtat estricta entre funcions contínues a $\mathbb{R}^3$. Alternativament: el domini $\{s_3\neq0\}$ és obert i la funció hi és contínua.
      fuites:
      - (?<!si\s)(?<!si\s\$)(\$E\$|\bE\b)\s+és\s+(un\s+)?(conjunt\s+)?obert\b
      - \bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?obert\b
    passos:
    - id: domini
      titol: Domini de l'expressió
      objectiu: |
        Determinar on té sentit la condició que defineix $E$ i com és aquest conjunt.
      idea: |
        Un quocient només està definit on el denominador no s'anul·la; el conjunt on un polinomi és diferent de zero es pot descriure amb una desigualtat estricta.
      detall: |
        La condició té sentit a $\Omega=\{(x,y,z): x^3+y^3+z^3\neq0\}=\{|x^3+y^3+z^3|>0\}$, que és obert perquè $|x^3+y^3+z^3|$ és contínua a $\mathbb{R}^3$. Així $E\subseteq\Omega$.
      fuites: []
      teoria:
      - T2.18
      - T2.20
    - id: reescriure
      titol: Eliminar el denominador
      objectiu: |
        Descriure $E$ amb una condició que involucri només funcions contínues a tot $\mathbb{R}^3$ (o bé usar la continuïtat al domini).
      idea: |
        Multiplicar la desigualtat pel valor absolut del denominador (positiu on està definit) i comprovar què passa als punts on s'anul·la.
      detall: |
        Si $s_3=x^3+y^3+z^3\neq0$: $|s_1/s_3|<1\iff|s_1|<|s_3|$, amb $s_1=x+y+z$. Si $s_3=0$, el punt no és de $E$ i tampoc compleix $|s_1|<|s_3|=0$. Per tant $E=\{|s_1|<|s_3|\}$.
      fuites:
      - \|\s*x\s*\+\s*y\s*\+\s*z\s*\|\s*<\s*\|\s*x\^\{?3\}?
      - \|s_\{?1\}?\|\s*<\s*\|s_\{?3\}?\|
      teoria: []
    - id: concloure
      titol: Concloure
      objectiu: |
        Decidir si $E$ és obert de $\mathbb{R}^3$.
      idea: |
        Valor absolut d'un polinomi és continu; desigualtat estricta entre funcions contínues a tot l'espai.
      detall: |
        $|s_1|$ i $|s_3|$ són contínues a $\mathbb{R}^3$ (composició del valor absolut amb polinomis). Pel corol·lari de les desigualtats estrictes, $E=\{|s_3|>|s_1|\}$ és obert. (Alternativament: $g=s_1/s_3$ és contínua a l'obert $\Omega$, $E=g^{-1}((-1,1))=U\cap\Omega$ amb $U$ obert, i per tant obert.)
      fuites: []
      teoria:
      - T2.20
      - T2.18
      - T2.17
      - T1.12
    errors_comuns:
    - id: oblida_denominador
      descripcio: |
        Aplica el corol·lari al quocient com si fos continu a tot $\mathbb{R}^3$, sense tractar els zeros del denominador.
      pregunta: |
        Està definida l'expressió $\frac{x+y+z}{x^3+y^3+z^3}$ a tot $\mathbb{R}^3$? Per exemple, al punt $(1,-1,0)$?
    - id: multiplica_sense_cura
      descripcio: |
        Multiplica per $x^3+y^3+z^3$ sense valor absolut (o sense considerar el signe) i obté una condició incorrecta.
      pregunta: |
        Si multipliques una desigualtat per un nombre que pot ser negatiu, què li passa? Com ho pots evitar aquí?
    - id: zeros_denominador_tancat
      descripcio: |
        Pensa que, com que cal treure el conjunt tancat $\{s_3=0\}$, el resultat no pot ser obert.
      pregunta: |
        Si a un obert li treus un tancat, quin tipus de conjunt obtens? Pots escriure-ho com una intersecció?
    nota_professor: |
      La reescriptura $E=\{|s_1|<|s_3|\}$ evita haver d'argumentar amb el domini. Totes dues vies són correctes.
- num: 14
  font: null
  preambul: |
    Anàlogament, raoneu si són tancats els subconjunts de $\mathbb{R}^2$ o $\mathbb{R}^3$ següents:
  indicacio: null
  exercicis:
  - id: t2-14a
    apartat: a
    tipus: teoric
    enunciat: |
      $A=\{(x,y)\in\mathbb{R}^2\ \mid\ 2x-3y=6,\ x^2+y^3\leqslant10\}$.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $A$ és tancat: és la intersecció de la recta $\{2x-3y=6\}$ i del conjunt $\{x^2+y^3\le10\}$, tots dos tancats per estar definits per igualtats o desigualtats no estrictes entre funcions polinòmiques (contínues a $\mathbb{R}^2$); la intersecció de tancats és tancada.
      fuites:
      - (?<!si\s)(?<!si\s\$)(\$A\$|\bA\b)\s+és\s+(un\s+)?(conjunt\s+)?tancat\b
      - \bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?tancat\b
    passos:
    - id: descompondre
      titol: Escriure $A$ com a intersecció
      objectiu: |
        Expressar $A$ en termes de conjunts definits per una sola condició.
      idea: |
        Cada condició defineix un conjunt i $A$ n'és la intersecció; una igualtat es pot veure com dues desigualtats no estrictes, o com l'antiimatge d'un punt.
      detall: |
        $A=A_1\cap A_2$ amb $A_1=\{2x-3y=6\}=\{2x-3y\ge6\}\cap\{6\ge 2x-3y\}$ i $A_2=\{10\ge x^2+y^3\}$.
      fuites: []
      teoria: []
    - id: cada_un_tancat
      titol: Cada condició dona un tancat
      objectiu: |
        Decidir quin tipus de conjunt és cadascuna de les peces i concloure per a $A$.
      idea: |
        Funcions polinòmiques contínues a tot $\mathbb{R}^2$ i desigualtats no estrictes; propietats de les interseccions de tancats.
      detall: |
        $2x-3y$ i $x^2+y^3$ són polinomis, contínues a $\mathbb{R}^2$. Pel corol·lari de les desigualtats no estrictes, $\{2x-3y\ge6\}$, $\{6\ge2x-3y\}$ i $\{10\ge x^2+y^3\}$ són tancats; la intersecció de tancats és tancada, per tant $A$ és tancat.
      fuites: []
      teoria:
      - T2.18
      - T1.13
    errors_comuns:
    - id: igualtat_no_desigualtat
      descripcio: |
        No sap com tractar la igualtat $2x-3y=6$ amb un resultat enunciat per a desigualtats.
      pregunta: |
        Pots escriure la condició $u=6$ fent servir dues desigualtats? O bé: el conjunt $\{6\}$ és tancat de $\mathbb{R}$?
    - id: necessita_fitat
      descripcio: |
        Confon tancat amb compacte i intenta veure si $A$ és fitat per decidir si és tancat.
      pregunta: |
        La definició de tancat, demana alguna cosa sobre si el conjunt és fitat? Quina és la diferència entre tancat i compacte?
    nota_professor: |
      $A$ és de fet un subconjunt de la recta $y=(2x-6)/3$; no cal estudiar si és fitat (és un tram no fitat de la recta, perquè $y^3$ domina per $y\to-\infty$).
  - id: t2-14b
    apartat: b
    tipus: teoric
    enunciat: |
      $B=\{(x,y)\in\mathbb{R}^2\ \mid\ 2x^2+3y^2\in\mathbb{N}\}$.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $B$ és tancat: $B=f^{-1}(\mathbb{N})$ amb $f(x,y)=2x^2+3y^2$ contínua a tot $\mathbb{R}^2$, i $\mathbb{N}$ és tancat de $\mathbb{R}$ (el seu complementari és una unió d'intervals oberts). L'antiimatge d'un tancat per una funció contínua a tot $\mathbb{R}^2$ és tancada.
      fuites:
      - (?<!si\s)(?<!si\s\$)(\$B\$|\bB\b)\s+és\s+(un\s+)?(conjunt\s+)?tancat\b
      - \bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?tancat\b
    passos:
    - id: antiimatge
      titol: Escriure $B$ com a antiimatge
      objectiu: |
        Expressar $B$ en termes d'una funció i d'un subconjunt de $\mathbb{R}$.
      idea: |
        La condició diu que el valor d'una funció pertany a un cert conjunt de nombres reals.
      detall: |
        Amb $f(x,y)=2x^2+3y^2$, polinòmica i per tant contínua a $\mathbb{R}^2$, es té $B=f^{-1}(\mathbb{N})$.
      fuites:
      - f\^\{?-1\}?\s*\(\s*\\mathbb\{N\}\s*\)
      teoria:
      - T2.20
    - id: n_tancat
      titol: $\mathbb{N}$ dins de $\mathbb{R}$
      objectiu: |
        Decidir quin tipus de subconjunt de $\mathbb{R}$ és $\mathbb{N}$.
      idea: |
        Mirar el complementari de $\mathbb{N}$ a $\mathbb{R}$ i escriure'l com a unió de conjunts coneguts.
      detall: |
        $\mathbb{R}\setminus\mathbb{N}=(-\infty,1)\cup\bigcup_{n\ge1}(n,n+1)$ (o $(-\infty,0)\cup\bigcup_{n\ge0}(n,n+1)$ si $0\in\mathbb{N}$), unió d'intervals oberts, i per tant obert. Així $\mathbb{N}$ és tancat de $\mathbb{R}$.
      fuites:
      - \\bigcup_\{?n\s*(\\ge|\\geq|≥)
      - uni[óo]\s+d'intervals\s+oberts
      teoria:
      - T1.12
      - T1.11
    - id: concloure
      titol: Antiimatge d'un tancat
      objectiu: |
        Concloure si $B$ és tancat de $\mathbb{R}^2$.
      idea: |
        Caracterització de la continuïtat amb antiimatges de tancats, quan el domini és tot l'espai.
      detall: |
        Per la caracterització topològica de la continuïtat, $f^{-1}(\mathbb{N})=F\cap\mathbb{R}^2=F$ amb $F$ tancat de $\mathbb{R}^2$. Per tant $B$ és tancat.
      fuites: []
      teoria:
      - T2.17
    errors_comuns:
    - id: unio_infinita
      descripcio: |
        Veu $B$ com la unió de les el·lipses $\{2x^2+3y^2=n\}$ i conclou que és tancat perquè "la unió de tancats és tancada", o bé que no ho és perquè la unió és infinita.
      pregunta: |
        La propietat de la unió de tancats, per a quantes unions val? Hi ha una manera de tractar $B$ de cop, sense passar per la unió?
    - id: n_no_tancat
      descripcio: |
        Pensa que $\mathbb{N}$ no és tancat perquè no és un interval o perquè no és fitat.
      pregunta: |
        Quin és el complementari de $\mathbb{N}$ a $\mathbb{R}$? Quin tipus de conjunt és?
    - id: confon_imatge_antiimatge
      descripcio: |
        Usa que la imatge (en lloc de l'antiimatge) d'un tancat per una funció contínua és tancada.
      pregunta: |
        La caracterització de la continuïtat parla d'imatges o d'antiimatges de tancats?
    nota_professor: |
      Les el·lipses $\{f=n\}$ s'allunyen (radis $\sim\sqrt n$), per això la unió infinita és tancada; però l'argument net és l'antiimatge. Contrastar amb 14(c).
  - id: t2-14c
    apartat: c
    tipus: teoric
    enunciat: |
      $C=\{(x,y)\in\mathbb{R}^2\ \mid\ \dfrac{1}{x^2+y^2}\in\mathbb{N}\}$.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $C$ no és tancat. $C=\bigcup_{n\ge1}\{x^2+y^2=1/n\}$ (circumferències de radi $1/\sqrt n$). La successió $(1/\sqrt n,0)\in C$ convergeix a $(0,0)\notin C$, de manera que $C$ no conté tots els límits de les seves successions convergents.
      fuites:
      - (\$C\$|\bC\b)\s+no\s+és\s+(un\s+)?(conjunt\s+)?tancat\b
      - \bno,?\s+no\s+és\s+(un\s+)?(conjunt\s+)?tancat\b
    passos:
    - id: descripcio
      titol: Descriure $C$
      objectiu: |
        Determinar on té sentit la condició i descriure geomètricament els punts de $C$.
      idea: |
        El quocient no està definit a l'origen; per a cada natural $n$, la condició $\frac{1}{x^2+y^2}=n$ és una corba coneguda.
      detall: |
        La condició té sentit a $\mathbb{R}^2\setminus\{(0,0)\}$ i $\frac{1}{x^2+y^2}=n\iff x^2+y^2=\frac1n$. Per tant $C$ és la unió de les circumferències centrades a l'origen de radi $1/\sqrt n$, $n\ge1$, i $(0,0)\notin C$.
      fuites:
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*=\s*\\?(d?frac\{1\}\{n\}|1\s*/\s*n)
      - radi\s*\$?\s*(1\s*/\s*\\sqrt|\\frac\{1\}\{\\sqrt)
      teoria: []
    - id: successio
      titol: Un punt d'acumulació fora de $C$
      objectiu: |
        Comprovar si $C$ conté els límits de les successions convergents formades per punts seus.
      idea: |
        Caracterització seqüencial dels tancats: buscar una successió de punts de $C$ que convergeixi a un punt que no sigui de $C$.
      detall: |
        $p_n=(1/\sqrt n,0)\in C$ i $p_n\to(0,0)$, però $(0,0)\notin C$. Per la caracterització seqüencial, $C$ no és tancat.
      fuites:
      - \(\s*(1\s*/\s*\\sqrt\{?n\}?|\\frac\{1\}\{\\sqrt\{?n\}?\})\s*,\s*0\s*\)
      - \(0\s*,\s*0\)\s*\\notin
      teoria:
      - T1.19
    errors_comuns:
    - id: copia_14b
      descripcio: |
        Raona com a l'apartat anterior: "$C$ és l'antiimatge de $\mathbb{N}$, tancat, per una funció contínua", sense mirar el domini.
      pregunta: |
        On està definida $g(x,y)=\frac{1}{x^2+y^2}$? Què diu exactament la teoria de l'antiimatge d'un tancat quan el domini no és tot $\mathbb{R}^2$?
    - id: unio_de_tancats
      descripcio: |
        Diu que és tancat perquè és unió de circumferències (tancades).
      pregunta: |
        La unió d'una quantitat infinita de tancats és sempre tancada? Què passa amb els radis d'aquestes circumferències quan $n$ creix?
    - id: origen_dins
      descripcio: |
        Considera que l'origen pertany a $C$.
      pregunta: |
        Es pot avaluar la condició que defineix $C$ al punt $(0,0)$?
    nota_professor: |
      Comparar amb 14(b): mateix tipus d'expressió, però aquí el domini $\mathbb{R}^2\setminus\{0\}$ no és tancat i els conjunts de nivell s'acumulen a l'origen. $\overline C=C\cup\{(0,0)\}$.
  - id: t2-14d
    apartat: d
    tipus: teoric
    enunciat: |
      $D=\{(x,y,z)\in\mathbb{R}^3\ \mid\ x+2y+3z=1,\ x^2y^2z\geqslant7\}$.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $D$ és tancat: és la intersecció del pla $\{x+2y+3z=1\}$ i del conjunt $\{x^2y^2z\ge7\}$, tots dos tancats per estar definits per una igualtat o una desigualtat no estricta entre funcions polinòmiques (contínues a $\mathbb{R}^3$); la intersecció de tancats és tancada.
      fuites:
      - (?<!si\s)(?<!si\s\$)(\$D\$|\bD\b)\s+és\s+(un\s+)?(conjunt\s+)?tancat\b
      - \bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?tancat\b
    passos:
    - id: descompondre
      titol: Escriure $D$ com a intersecció
      objectiu: |
        Expressar $D$ en termes de conjunts definits per una sola condició.
      idea: |
        Cada condició defineix un conjunt; la igualtat es pot veure com dues desigualtats no estrictes o com l'antiimatge d'un punt.
      detall: |
        $D=D_1\cap D_2$ amb $D_1=\{x+2y+3z=1\}=\{x+2y+3z\ge1\}\cap\{1\ge x+2y+3z\}$ i $D_2=\{x^2y^2z\ge7\}$.
      fuites: []
      teoria: []
    - id: cada_un_tancat
      titol: Cada condició dona un tancat
      objectiu: |
        Decidir quin tipus de conjunt és cada peça i concloure per a $D$.
      idea: |
        Polinomis, contínues a tot $\mathbb{R}^3$, i desigualtats no estrictes; propietats de les interseccions de tancats.
      detall: |
        $x+2y+3z$ i $x^2y^2z$ són polinomis, contínues a $\mathbb{R}^3$. Pel corol·lari de les desigualtats no estrictes, els tres conjunts $\{x+2y+3z\ge1\}$, $\{1\ge x+2y+3z\}$ i $\{x^2y^2z\ge7\}$ són tancats, i la seva intersecció $D$ també.
      fuites: []
      teoria:
      - T2.18
      - T1.13
    errors_comuns:
    - id: igualtat_no_desigualtat
      descripcio: |
        No sap com tractar la igualtat amb un resultat enunciat per a desigualtats.
      pregunta: |
        Pots escriure la condició $u=1$ fent servir dues desigualtats no estrictes?
    - id: necessita_fitat
      descripcio: |
        Confon tancat amb compacte i dedica l'esforç a veure si $D$ és fitat.
      pregunta: |
        La definició de tancat, demana que el conjunt sigui fitat?
    nota_professor: |
      Mateixa estructura que 14(a). $D$ no és fitat (per exemple, sobre el pla es pot fer $|x|,|y|$ grans amb $z>0$ adequat), però no es demana.
- num: 15
  font: null
  preambul: |
    Justifiqueu adequadament si els conjunts següents són compactes:
  indicacio: null
  exercicis:
  - id: t2-15a
    apartat: a
    tipus: teoric
    enunciat: |
      $A=\{(x,y,z,t)\in\mathbb{R}^4\ \mid\ 2x^2+y^2-z^2=2,\ y^2+2z^2\leqslant10,\ |z|\geqslant|t|\ \}$.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        $A$ és compacte. És tancat (intersecció de conjunts definits per una igualtat i desigualtats no estrictes entre funcions contínues a $\mathbb{R}^4$) i fitat: de $y^2+2z^2\le10$ surt $y^2\le10$ i $z^2\le5$; llavors $t^2\le z^2\le5$ i $x^2=1+\frac{z^2-y^2}{2}\le\frac72$. Pel teorema de Heine-Borel, $A$ és compacte.
      fuites:
      - (?<!si\s)(?<!si\s\$)(\$A\$|\bA\b)\s+és\s+(un\s+)?(conjunt\s+)?compacte\b
      - \bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?compacte\b
    passos:
    - id: criteri
      titol: Triar el criteri
      objectiu: |
        Decidir quines propietats de $A$ cal estudiar per saber si és compacte.
      idea: |
        A $\mathbb{R}^n$ hi ha una caracterització dels compactes en termes de dues propietats més fàcils de comprovar que la definició amb recobriments.
      detall: |
        Pel teorema de Heine-Borel, un subconjunt de $\mathbb{R}^4$ és compacte si i només si és tancat i fitat.
      fuites: []
      teoria:
      - T1.34
    - id: tancat
      titol: $A$ és tancat
      objectiu: |
        Determinar si $A$ és tancat.
      idea: |
        Cada condició és una igualtat o desigualtat no estricta entre funcions contínues a tot $\mathbb{R}^4$.
      detall: |
        $2x^2+y^2-z^2$, $y^2+2z^2$, $|z|$ i $|t|$ són contínues a $\mathbb{R}^4$. Els conjunts $\{2x^2+y^2-z^2\ge2\}$, $\{2\ge2x^2+y^2-z^2\}$, $\{10\ge y^2+2z^2\}$ i $\{|z|\ge|t|\}$ són tancats pel corol·lari de les desigualtats, i $A$ n'és la intersecció, per tant tancat.
      fuites: []
      teoria:
      - T2.18
      - T1.13
      - T2.20
    - id: fitat
      titol: $A$ és fitat
      objectiu: |
        Trobar una fita per a cadascuna de les quatre coordenades dels punts de $A$.
      idea: |
        Començar per la desigualtat que fita directament algunes coordenades, i usar-ne el resultat a les altres condicions per fitar les restants.
      detall: |
        De $y^2+2z^2\le10$: $y^2\le10$ i $z^2\le5$. De $|t|\le|z|$: $t^2\le5$. De la igualtat, $2x^2=2-y^2+z^2\le2+5=7$, és a dir $x^2\le\frac72$. Per tant $\|(x,y,z,t)\|^2\le\frac72+10+5+5$, i $A$ està contingut en una bola centrada a l'origen: és fitat.
      fuites:
      - x\^\{?2\}?\s*(\\le|\\leq|≤|\\leqslant)\s*\\?(d?frac\{7\}\{2\}|7\s*/\s*2)
      - 2x\^\{?2\}?\s*=\s*2\s*-\s*y\^\{?2\}?\s*\+\s*z\^\{?2\}?
      teoria:
      - T1.33
    - id: concloure
      titol: Concloure
      objectiu: |
        Combinar les propietats obtingudes per respondre la pregunta.
      idea: |
        Aplicar el criteri triat al primer pas.
      detall: |
        $A$ és tancat i fitat a $\mathbb{R}^4$, i per Heine-Borel és compacte.
      fuites: []
      teoria:
      - T1.34
    errors_comuns:
    - id: x_no_fitada
      descripcio: |
        Pensa que $x$ no està fitada perquè cap desigualtat la conté directament (o perquè la igualtat defineix un hiperboloide, no fitat).
      pregunta: |
        Si ja tens fites per a $y$ i $z$, què et diu la igualtat $2x^2+y^2-z^2=2$ sobre $x^2$?
    - id: t_oblidada
      descripcio: |
        Fita $x,y,z$ però s'oblida de la coordenada $t$.
      pregunta: |
        $A$ viu a $\mathbb{R}^4$. Has fitat totes quatre coordenades?
    - id: nomes_tancat
      descripcio: |
        Conclou compacitat només a partir de ser tancat (o només de ser fitat).
      pregunta: |
        Què diu exactament el teorema de Heine-Borel? En coneixes un tancat no compacte?
    nota_professor: |
      La condició sobre $t$ és la que fa falta per fitar $t$; sense ella el conjunt seria un cilindre no fitat.
  - id: t2-15b
    apartat: b
    tipus: teoric
    enunciat: |
      $B=\{(x,y,z)\in\mathbb{R}^3\ \mid\ x^3=y^2,\ z=x\}$.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        $B$ no és compacte. És tancat, però no és fitat: per a tot $s\in\mathbb{R}$, $(s^2,s^3,s^2)\in B$, i $\|(s^2,s^3,s^2)\|\to\infty$ quan $s\to\infty$. Per Heine-Borel no és compacte.
      fuites:
      - (\$B\$|\bB\b)\s+no\s+és\s+(un\s+)?(conjunt\s+)?compacte\b
      - \bno,?\s+no\s+és\s+(un\s+)?(conjunt\s+)?compacte\b
    passos:
    - id: tancat
      titol: $B$ és tancat
      objectiu: |
        Determinar si $B$ és tancat.
      idea: |
        Igualtats entre funcions polinòmiques: cadascuna defineix un tancat.
      detall: |
        $B=\{x^3-y^2=0\}\cap\{z-x=0\}$; cada igualtat és la intersecció de dues desigualtats no estrictes entre polinomis (contínues a $\mathbb{R}^3$), per tant $B$ és tancat.
      fuites: []
      teoria:
      - T2.18
      - T1.13
    - id: fitat
      titol: Estudiar si $B$ és fitat
      objectiu: |
        Esbrinar si existeix alguna bola que contingui tot $B$.
      idea: |
        Parametritzar la corba $x^3=y^2$ (per exemple, buscant $x$ i $y$ com a potències d'un paràmetre) i veure què passa quan el paràmetre creix.
      detall: |
        Per a $s\in\mathbb{R}$, $(x,y,z)=(s^2,s^3,s^2)$ compleix $x^3=s^6=y^2$ i $z=x$, així que és de $B$. La seva norma és $\ge s^2\to\infty$, per tant $B$ no està contingut en cap bola: no és fitat.
      fuites:
      - \(\s*s\^\{?2\}?\s*,\s*s\^\{?3\}?
      - \(\s*t\^\{?2\}?\s*,\s*t\^\{?3\}?
      - \(\s*n\^\{?2\}?\s*,\s*n\^\{?3\}?
      teoria:
      - T1.33
    - id: concloure
      titol: Concloure
      objectiu: |
        Respondre si $B$ és compacte.
      idea: |
        Caracterització dels compactes de $\mathbb{R}^n$.
      detall: |
        Per Heine-Borel, un compacte de $\mathbb{R}^3$ ha de ser fitat; $B$ no ho és, així que no és compacte.
      fuites: []
      teoria:
      - T1.34
    errors_comuns:
    - id: tancat_implica_compacte
      descripcio: |
        Conclou que és compacte perquè és tancat.
      pregunta: |
        Quines dues condicions demana el teorema de Heine-Borel? Has comprovat totes dues?
    - id: creu_fitat
      descripcio: |
        Creu que la corba és fitada perquè $x^3=y^2$ "lliga" les variables.
      pregunta: |
        Pots trobar punts de $B$ amb $x$ tan gran com vulguis? Quin $y$ els correspondria?
    nota_professor: |
      $B$ és una corba (amb una cúspide a l'origen) dins del pla $z=x$. També es pot veure amb la successió $(n^2,n^3,n^2)$, que no té cap parcial convergent.
- num: 16
  font: null
  preambul: |
    Per a $A,B\subset\mathbb{R}^n$, recordem que $d(A,B)=\inf\{d(a,b)\mid a\in A,\ b\in B\}$, on $d(a,b)$ és la distància euclídia a $\mathbb{R}^n$ (vegeu l'exercici 5 del Tema 1). Demostreu:
  indicacio: null
  exercicis:
  - id: t2-16a
    apartat: a
    tipus: teoric
    enunciat: |
      $A,B$ compactes $\Rightarrow\exists a_0\in A,\,b_0\in B$ tals que $d(A,B)=d(a_0,b_0)$,
    teoria:
    - T1.5
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        Si $A,B$ són compactes (no buits), existeixen $a_0\in A$, $b_0\in B$ amb $d(A,B)=d(a_0,b_0)$. Prova: per la definició d'ínfim hi ha $a_k\in A$, $b_k\in B$ amb $d(a_k,b_k)\to d(A,B)$; per compacitat seqüencial, passant a parcials, $a_{k_j}\to a_0\in A$ i $b_{k_j}\to b_0\in B$; com que $|d(a,b)-d(a',b')|\le d(a,a')+d(b,b')$, $d(a_{k_j},b_{k_j})\to d(a_0,b_0)$, i per unicitat del límit $d(a_0,b_0)=d(A,B)$.
      fuites: []
    passos:
    - id: successio_minimitzant
      titol: Successió minimitzant
      objectiu: |
        Traduir la definició de $d(A,B)$ com a ínfim en l'existència de parelles de punts de $A$ i $B$ adequades.
      idea: |
        Propietat de l'ínfim: per a cada $\varepsilon>0$, hi ha elements del conjunt a distància menor que $\varepsilon$ de l'ínfim. Prendre $\varepsilon=1/k$.
      detall: |
        Sigui $\delta=d(A,B)$. Per a cada $k\ge1$, $\delta+1/k$ no és fita inferior de $\{d(a,b)\}$, de manera que existeixen $a_k\in A$, $b_k\in B$ amb $\delta\le d(a_k,b_k)<\delta+1/k$. Així $d(a_k,b_k)\to\delta$.
      fuites:
      - d\(a_k\s*,\s*b_k\)\s*<\s*\\delta\s*\+
      teoria: []
    - id: parcials
      titol: Extreure parcials convergents
      objectiu: |
        Obtenir punts candidats $a_0\in A$ i $b_0\in B$ a partir de les successions anteriors.
      idea: |
        Compacte equival a seqüencialment compacte. Cal extreure parcials en dues etapes, perquè els índexs de les dues successions coincideixin.
      detall: |
        Per Bolzano-Weierstrass, $A$ és seqüencialment compacte: hi ha una parcial $a_{k_j}\to a_0\in A$. La successió $(b_{k_j})_j\subseteq B$ té, per la mateixa raó, una parcial $b_{k_{j_l}}\to b_0\in B$; la corresponent $a_{k_{j_l}}$ continua convergint a $a_0$. Reanomenant, tenim una parcial comuna amb $a_{k_j}\to a_0$, $b_{k_j}\to b_0$.
      fuites: []
      teoria:
      - T1.26
      - T1.24
    - id: pas_al_limit
      titol: Passar al límit
      objectiu: |
        Comprovar que $d(a_0,b_0)=d(A,B)$.
      idea: |
        Veure que la distància és contínua en les dues variables usant la desigualtat triangular, i aplicar la unicitat del límit.
      detall: |
        Per la desigualtat triangular, $|d(a,b)-d(a',b')|\le d(a,a')+d(b,b')$. Per tant $|d(a_{k_j},b_{k_j})-d(a_0,b_0)|\le d(a_{k_j},a_0)+d(b_{k_j},b_0)\to0$, i $d(a_{k_j},b_{k_j})\to d(a_0,b_0)$. Com que també tendeix a $\delta$ (és parcial d'una successió que hi tendeix), $d(a_0,b_0)=\delta=d(A,B)$.
      fuites:
      - \|d\(a\s*,\s*b\)\s*-\s*d\(a'\s*,\s*b'\)\|
      teoria:
      - T1.5
    errors_comuns:
    - id: parcials_independents
      descripcio: |
        Extreu una parcial convergent de $(a_k)$ i una altra, amb índexs diferents, de $(b_k)$, i les combina com si fossin la mateixa subsuccessió.
      pregunta: |
        Si $a_{k_j}$ i $b_{m_j}$ són parcials amb índexs diferents, la parella $(a_{k_j},b_{m_j})$ prové de les parelles $(a_k,b_k)$ que tenies? Com t'ho pots arreglar perquè sí?
    - id: continuitat_no_justificada
      descripcio: |
        Afirma que $d(a_{k_j},b_{k_j})\to d(a_0,b_0)$ sense justificar la continuïtat de la distància en les dues variables.
      pregunta: |
        Per què el límit de $d(a_{k_j},b_{k_j})$ és $d(a_0,b_0)$? Pots fitar la diferència entre les dues distàncies?
    - id: inf_es_min
      descripcio: |
        Suposa d'entrada que l'ínfim s'assoleix (confon ínfim amb mínim).
      pregunta: |
        Per definició, $d(A,B)$ és un ínfim. Està garantit que hi hagi una parella que l'assoleixi? Què et dona la definició d'ínfim?
    nota_professor: |
      Cal suposar $A,B$ no buits (si no, l'ínfim no té sentit). Alternativa: $A\times B\subseteq\mathbb{R}^{2n}$ és tancat i fitat, per tant compacte (Heine-Borel), i $(a,b)\mapsto d(a,b)$ és contínua; per Weierstrass (T2.23) assoleix el mínim.
  - id: t2-16b
    apartat: b
    tipus: teoric
    enunciat: |
      $A$ compacte $\Rightarrow\exists a_0\in A$ tal que $d(A,B)=d(\{a_0\},B)$,
    teoria:
    - T1.5
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        Si $A$ és compacte (i $A,B$ no buits), existeix $a_0\in A$ amb $d(A,B)=d(\{a_0\},B)$. Prova: $d(A,B)=\inf_{a\in A}d(a,B)$; la funció $g(x)=d(x,B)$ compleix $|g(x)-g(y)|\le d(x,y)$, per tant és contínua; pel teorema de Weierstrass $g$ assoleix el mínim sobre el compacte $A$ en un $a_0$, i $d(A,B)=g(a_0)=d(\{a_0\},B)$.
      fuites: []
    passos:
    - id: inf_iterat
      titol: Reescriure $d(A,B)$
      objectiu: |
        Relacionar $d(A,B)$ amb les distàncies $d(a,B)=d(\{a\},B)$ dels punts de $A$ a $B$.
      idea: |
        Un ínfim sobre parelles $(a,b)$ es pot fer en dues etapes: primer sobre $b$ amb $a$ fix, després sobre $a$. Demostrar-ho amb dues desigualtats.
      detall: |
        Volem $d(A,B)=\inf_{a\in A}d(a,B)$. ($\ge$): per a tot $a,b$, $d(a,b)\ge d(a,B)\ge\inf_{a'\in A}d(a',B)$, i passant a l'ínfim sobre $(a,b)$. ($\le$): per a $a\in A$ fix i tot $b\in B$, $d(A,B)\le d(a,b)$, i per tant $d(A,B)\le d(a,B)$; així $d(A,B)$ és fita inferior de $\{d(a,B)\}$ i $d(A,B)\le\inf_a d(a,B)$.
      fuites:
      - d\(A\s*,\s*B\)\s*=\s*\\inf_\{?a\s*\\in\s*A\}?\s*d\(a\s*,\s*B\)
      teoria: []
    - id: continuitat
      titol: Continuïtat de $x\mapsto d(x,B)$
      objectiu: |
        Estudiar la regularitat de la funció $g(x)=d(x,B)$ a $\mathbb{R}^n$.
      idea: |
        És l'exercici 5(b) del Tema 1: la desigualtat triangular dona una fita de $|g(x)-g(y)|$ en termes de $d(x,y)$, i d'aquí la continuïtat.
      detall: |
        Per a $b\in B$: $d(x,B)\le d(x,b)\le d(x,y)+d(y,b)$; prenent l'ínfim en $b$, $g(x)\le d(x,y)+g(y)$. Per simetria, $|g(x)-g(y)|\le d(x,y)$. Així, donat $\varepsilon>0$, prenent $\delta=\varepsilon$, si $d(x,y)<\delta$ aleshores $|g(x)-g(y)|<\varepsilon$: $g$ és (uniformement) contínua a $\mathbb{R}^n$.
      fuites:
      - \|g\(x\)\s*-\s*g\(y\)\|\s*(\\le|\\leq|≤|\\leqslant)\s*d\(x\s*,\s*y\)
      - \|d\(x\s*,\s*B\)\s*-\s*d\(y\s*,\s*B\)\|
      teoria:
      - T1.5
      - T2.14
    - id: weierstrass
      titol: Mínim sobre el compacte
      objectiu: |
        Trobar $a_0\in A$ que compleixi la igualtat demanada.
      idea: |
        Una funció real contínua sobre un compacte assoleix el seu mínim.
      detall: |
        Pel teorema de Weierstrass aplicat a $g$ contínua i $A$ compacte, existeix $a_0\in A$ amb $g(a_0)=\min_{a\in A}g(a)$. Pel primer pas, $d(A,B)=\inf_{a\in A}g(a)=g(a_0)=d(\{a_0\},B)$.
      fuites: []
      teoria:
      - T2.23
    errors_comuns:
    - id: usa_16a
      descripcio: |
        Intenta aplicar l'apartat (a), que demana que $B$ també sigui compacte.
      pregunta: |
        Quines hipòtesis té l'apartat (a)? Les compleix $B$ aquí?
    - id: continuitat_sense_prova
      descripcio: |
        Afirma que $x\mapsto d(x,B)$ és contínua sense justificar-ho, o ho justifica com si $B$ fos un punt.
      pregunta: |
        $d(x,B)$ és un ínfim, no una distància entre dos punts. Pots comparar $d(x,B)$ i $d(y,B)$ fent servir la desigualtat triangular?
    - id: ordre_infims
      descripcio: |
        Dona per fet que $d(A,B)=\inf_a d(a,B)$ sense justificar-ho, o en justifica només una desigualtat.
      pregunta: |
        Has comprovat les dues desigualtats entre $d(A,B)$ i $\inf_{a\in A}d(\{a\},B)$?
    nota_professor: |
      $B$ arbitrari (no buit): no cal ni que sigui tancat. $g$ és 1-lipschitziana en el sentit habitual ($\le$); la definició de Lipschitz de les notes (T2.26) està escrita amb desigualtat estricta, que falla per a $x=y$, i per això el pas cita directament la definició de continuïtat (T2.14) amb $\delta=\varepsilon$. La desigualtat $|g(x)-g(y)|\le d(x,y)$ és l'exercici 5(b) del Tema 1.
  - id: t2-16c
    apartat: c
    tipus: teoric
    enunciat: |
      És cert l'apartat (a) si $A$ i $B$ són tancats però no fitats? I si $A=\{a\}$ i $B$ és tancat?
    teoria:
    - T1.11
    - T1.33
    teoria_reservada: []
    resultat:
      valor: |
        (1) No. Contraexemple a $\mathbb{R}^2$: $A=\{y=0\}$ i $B=\{xy=1\}$, tancats i no fitats; $d((t,0),(t,1/t))=1/t\to0$, per tant $d(A,B)=0$, però $A\cap B=\varnothing$ i $d(a,b)>0$ per a tota parella: la distància no s'assoleix. (A $\mathbb{R}$: $A=\mathbb{N}$, $B=\{n+1/n: n\ge2\}$.)
        (2) Sí. Si $b_1\in B$ i $R=d(a,b_1)$, el conjunt $K=B\cap\overline{B}(a,R)$ és tancat, fitat i no buit, per tant compacte, i $d(a,B)=d(a,K)$; per l'apartat (a) amb $\{a\}$ i $K$ hi ha $b_0\in K\subseteq B$ amb $d(a,b_0)=d(\{a\},B)$.
      fuites:
      - \(a\)\s+(no\s+és\s+cert|és\s+fals|falla)
      - (no\s+és\s+cert|és\s+fals|falla)[^.]{0,40}tancats\s+no\s+fitats
    passos:
    - id: contraexemple
      titol: 'Tancats no fitats: buscar un contraexemple'
      objectiu: |
        Decidir si l'apartat (a) continua sent cert per a tancats no fitats; si no, construir un contraexemple.
      idea: |
        Buscar dos tancats disjunts que s'acostin indefinidament "a l'infinit" (un d'ells asimptòtic a l'altre), de manera que l'ínfim de les distàncies sigui $0$.
      detall: |
        A $\mathbb{R}^2$, $A=\{(x,0)\}$ (eix $x$) i $B=\{(x,y): xy=1\}$ són tancats (igualtats entre polinomis) i no fitats. Per a $t>0$, $d((t,0),(t,1/t))=1/t\to0$, així $d(A,B)=0$. Però $A\cap B=\varnothing$ (a $B$, $y\neq0$), i $d(a,b)=0\iff a=b$; per tant cap parella $(a_0,b_0)$ dona $d(a_0,b_0)=0$. L'apartat (a) és fals en aquest cas.
      fuites:
      - xy\s*=\s*1
      - y\s*=\s*(1\s*/\s*x|\\frac\{1\}\{x\})
      - \(\s*t\s*,\s*(1\s*/\s*t|\\frac\{1\}\{t\})\s*\)
      teoria:
      - T2.18
      - T1.5
    - id: reduir_compacte
      titol: '$A=\{a\}$, $B$ tancat: reduir a un compacte'
      objectiu: |
        Per a la segona pregunta, substituir $B$ per un subconjunt compacte de $B$ que tingui la mateixa distància a $a$.
      idea: |
        Els punts de $B$ molt lluny de $a$ no influeixen en l'ínfim: n'hi ha prou amb els que són dins d'una bola tancada centrada en $a$ que contingui algun punt de $B$.
      detall: |
        Sigui $b_1\in B$ i $R=d(a,b_1)$. Posem $K=B\cap\overline{B}(a,R)$: és tancat (intersecció de tancats), fitat i conté $b_1$, per tant és un compacte no buit (Heine-Borel). Si $b\in B\setminus K$, $d(a,b)>R=d(a,b_1)\ge d(a,K)$; i si $b\in K$, $d(a,b)\ge d(a,K)$. Així $d(a,B)=d(a,K)$.
      fuites:
      - B\s*\\cap\s*\\overline\{?B\}?\s*\(\s*a
      teoria:
      - T1.13
      - T1.34
    - id: concloure
      titol: Aplicar l'apartat (a)
      objectiu: |
        Concloure la segona pregunta.
      idea: |
        Un conjunt amb un sol punt és compacte; aplicar el resultat ja demostrat per a dos compactes.
      detall: |
        $\{a\}$ i $K$ són compactes; per l'apartat (a) existeix $b_0\in K\subseteq B$ amb $d(a,b_0)=d(\{a\},K)=d(\{a\},B)$. Per tant, en aquest cas sí que és cert.
      fuites: []
      teoria:
      - T1.24
    errors_comuns:
    - id: contraexemple_que_toca
      descripcio: |
        Proposa tancats no fitats que es tallen o que estan a distància positiva assolida (per exemple, dues rectes paral·leles), que no són contraexemple.
      pregunta: |
        En el teu exemple, la distància entre els dos conjunts s'assoleix o no? Què hauria de passar perquè no s'assolís?
    - id: no_tancat
      descripcio: |
        Fa servir un conjunt no tancat (per exemple, una bola oberta i un punt de la seva vora), que no respon la pregunta.
      pregunta: |
        Els conjunts del teu exemple compleixen totes les hipòtesis de la pregunta?
    - id: reduccio_sense_cura
      descripcio: |
        A la segona pregunta, aplica Weierstrass sobre $B$ directament, que no és compacte.
      pregunta: |
        La funció $b\mapsto d(a,b)$ és contínua, però $B$ no és compacte. Pots canviar $B$ per un conjunt més petit sense canviar l'ínfim?
    nota_professor: |
      El contraexemple funciona en qualsevol $\mathbb{R}^n$ (a $\mathbb{R}$, $A=\mathbb{N}$ i $B=\{n+1/n\}_{n\ge2}$, tots dos tancats perquè no tenen punts d'acumulació). La segona part també es pot fer amb Weierstrass sobre $K$, o amb l'apartat (b) aplicat al compacte $K$ i al conjunt $\{a\}$.
  - id: t2-16d
    apartat: d
    tipus: teoric
    enunciat: |
      $\overline{A}=\{x\in\mathbb{R}^n\mid d(x,A)=0\}$.
    teoria:
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        Per a $A\neq\varnothing$: $x\in\overline{A}\iff\forall r>0,\ B_r(x)\cap A\neq\varnothing\iff\forall r>0\ \exists a\in A$ amb $d(x,a)<r\iff\inf_{a\in A}d(x,a)=0$ (perquè $d(x,a)\ge0$ i, per la caracterització de l'ínfim, l'ínfim és $0$ si i només si cap $r>0$ és fita inferior). Per tant $\overline{A}=\{x: d(x,A)=0\}$.
      fuites: []
    passos:
    - id: inclusio_1
      titol: $\overline{A}\subseteq\{d(x,A)=0\}$
      objectiu: |
        Demostrar que tot punt adherent a $A$ és a distància $0$ de $A$.
      idea: |
        Usar la definició de clausura amb boles (o amb successions) i que l'ínfim és menor o igual que qualsevol element del conjunt.
      detall: |
        Si $x\in\overline{A}$, per a tot $r>0$ hi ha $a\in B_r(x)\cap A$, i llavors $0\le d(x,A)\le d(x,a)<r$. Com que això val per a tot $r>0$, $d(x,A)=0$.
      fuites:
      - (\\le|\\leq|≤|\\leqslant)\s*d\(x\s*,\s*a\)\s*<\s*r
      teoria:
      - T1.16
    - id: inclusio_2
      titol: $\{d(x,A)=0\}\subseteq\overline{A}$
      objectiu: |
        Demostrar que si $d(x,A)=0$ aleshores $x$ és adherent a $A$.
      idea: |
        Si l'ínfim és $0$, cap nombre positiu és fita inferior del conjunt de distàncies; traduir-ho en termes de boles centrades en $x$.
      detall: |
        Si $d(x,A)=0$ i $r>0$, aleshores $r$ no és fita inferior de $\{d(x,a): a\in A\}$, així que existeix $a\in A$ amb $d(x,a)<r$, és a dir $a\in B_r(x)\cap A\neq\varnothing$. Com que val per a tot $r>0$, $x\in\overline{A}$.
      fuites: []
      teoria:
      - T1.16
      - T1.11
    errors_comuns:
    - id: inf_zero_vol_dir_dins
      descripcio: |
        Creu que $d(x,A)=0$ implica $x\in A$ (confon ínfim amb mínim).
      pregunta: |
        Si $A=(0,1)\subset\mathbb{R}$, quant val $d(0,A)$? És $0\in A$?
    - id: una_sola_inclusio
      descripcio: |
        Demostra només una de les dues inclusions.
      pregunta: |
        Per demostrar una igualtat de conjunts, quantes inclusions cal veure? Les has fet totes dues?
    - id: no_usa_def_infim
      descripcio: |
        Al segon sentit, no justifica l'existència d'un $a\in A$ amb $d(x,a)<r$.
      pregunta: |
        Què vol dir exactament que l'ínfim d'un conjunt de nombres no negatius sigui $0$? Què pots dir d'un nombre $r>0$ respecte d'aquest conjunt?
    nota_professor: |
      Cal $A\neq\varnothing$ (si $A=\varnothing$, $d(x,\varnothing)=\inf\varnothing=+\infty$ i $\overline{\varnothing}=\varnothing$, coherent). Alternativa amb successions (T1.19(ii)): $x\in\overline{A}$ si i només si hi ha $a_k\in A$ amb $a_k\to x$, és a dir $d(x,a_k)\to0$.
- num: 17
  font: null
  preambul: |
    Sigui $E$ un subespai vectorial de $\mathbb{R}^m$.
  indicacio: null
  exercicis:
  - id: t2-17a
    apartat: a
    tipus: teoric
    enunciat: |
      Demostreu que si $E$ té punts interiors, llavors existeix una bola oberta centrada a l'origen i continguda a $E$.
    teoria:
    - T1.11
    - T1.14
    teoria_reservada: []
    resultat:
      valor: |
        Si $p\in E$ és interior, existeix $r>0$ amb $B(p,r)\subseteq E$. Aleshores $B(0,r)\subseteq E$: si $\|x\|<r$, llavors $p+x\in B(p,r)\subseteq E$ i, com que $E$ és subespai i $p\in E$, $x=(p+x)-p\in E$.
      fuites: []
    passos:
    - id: hipotesi
      titol: Escriure la hipòtesi
      objectiu: |
        Escriure amb precisió què vol dir que $E$ tingui un punt interior.
      idea: |
        Aplicar la definició de punt interior: hi ha una bola al voltant del punt continguda al conjunt.
      detall: |
        Existeixen $p\in E$ i $r>0$ tals que $B(p,r)=\{y\in\mathbb{R}^m:\|y-p\|<r\}\subseteq E$.
      fuites: []
      teoria:
      - T1.14
      - T1.11
    - id: traslladar
      titol: Traslladar la bola a l'origen
      objectiu: |
        Relacionar els punts de la bola centrada a l'origen amb els de la bola centrada al punt interior.
      idea: |
        Una translació conserva les distàncies: sumar un vector fix porta boles de radi $r$ en boles de radi $r$.
      detall: |
        Si $x\in B(0,r)$, és a dir $\|x\|<r$, llavors $\|(p+x)-p\|=\|x\|<r$, per tant $p+x\in B(p,r)\subseteq E$.
      fuites:
      - p\s*\+\s*x\b
      - x\s*\+\s*p\b
      teoria:
      - T1.11
    - id: subespai
      titol: Usar l'estructura de subespai
      objectiu: |
        Deduir que tot punt de la bola centrada a l'origen és de $E$.
      idea: |
        Un subespai vectorial és tancat per diferències (combinacions lineals) dels seus elements.
      detall: |
        Com que $p\in E$ i $p+x\in E$, i $E$ és subespai, $x=(p+x)-p\in E$. Per tant $B(0,r)\subseteq E$, amb el mateix radi $r$.
      fuites:
      - x\s*=\s*\(\s*p\s*\+\s*x\s*\)\s*-\s*p
      teoria: []
    errors_comuns:
    - id: suposa_0_interior
      descripcio: |
        Suposa directament que $0$ és punt interior perquè $0\in E$, sense fer servir el punt interior donat.
      pregunta: |
        Que $0$ pertanyi a $E$ garanteix que hi hagi una bola al seu voltant dins de $E$? D'on surt aquesta bola?
    - id: oblida_subespai
      descripcio: |
        Trasllada la bola però no justifica per què els punts traslladats tornen a ser de $E$ (no usa que $E$ és subespai).
      pregunta: |
        Saps que un cert punt és de $E$; quina propietat de $E$ et permet deduir que un altre vector, obtingut per una operació lineal, també ho és?
    - id: radi_canvia
      descripcio: |
        Creu que el radi de la nova bola ha de ser diferent (més petit) que el de la bola original, o no l'especifica.
      pregunta: |
        Una translació canvia la distància entre dos punts? Quin radi pots prendre, doncs?
    nota_professor: |
      També es pot usar que la translació $x\mapsto x-p$ és una isometria que deixa $E$ invariant.
  - id: t2-17b
    apartat: b
    tipus: teoric
    enunciat: |
      Demostreu que si $E$ té punts interiors, aleshores $E=\mathbb{R}^m$.
    teoria:
    - T1.14
    teoria_reservada: []
    resultat:
      valor: |
        Per l'apartat (a), $B(0,r)\subseteq E$ per a algun $r>0$. Donat $v\in\mathbb{R}^m$, $v\neq0$, el vector $w=\frac{r}{2\|v\|}v$ té norma $r/2<r$, per tant $w\in E$, i $v=\frac{2\|v\|}{r}w\in E$ perquè $E$ és subespai. Com que també $0\in E$, $E=\mathbb{R}^m$.
      fuites: []
    passos:
    - id: usar_a
      titol: Partir de l'apartat (a)
      objectiu: |
        Suposant demostrat l'apartat (a), escriure què en tenim: una bola centrada a l'origen dins de $E$.
      idea: |
        Aplicar directament (a) a la hipòtesi.
      detall: |
        Existeix $r>0$ tal que $B(0,r)\subseteq E$.
      fuites: []
      teoria:
      - T1.11
    - id: reescalar
      titol: Portar qualsevol vector dins la bola
      objectiu: |
        Donat un vector arbitrari $v\neq0$ de $\mathbb{R}^m$, trobar un vector de la bola centrada a l'origen relacionat amb $v$.
      idea: |
        Multiplicar $v$ per un escalar prou petit perquè la seva norma sigui menor que el radi.
      detall: |
        $w=\frac{r}{2\|v\|}\,v$ compleix $\|w\|=\frac r2<r$, per tant $w\in B(0,r)\subseteq E$.
      fuites:
      - \\[dt]?frac\s*\{\s*r\s*\}\s*\{\s*2\s*\\\|\s*v\s*\\\|\s*\}
      - \\[dt]?frac\s*\{?\s*r\s*\}?\s*\{?\s*2\s*\}?\s*\\[dt]?frac\s*\{\s*v\s*\}\s*\{\s*\\\|\s*v\s*\\\|\s*\}
      teoria: []
    - id: concloure
      titol: Concloure
      objectiu: |
        Deduir que $v\in E$ i acabar.
      idea: |
        Un subespai és tancat per producte per escalars.
      detall: |
        $v=\frac{2\|v\|}{r}\,w\in E$ per ser $E$ subespai; i $0\in E$. Per tant $\mathbb{R}^m\subseteq E$, és a dir, $E=\mathbb{R}^m$.
      fuites: []
      teoria: []
    errors_comuns:
    - id: nomes_bola
      descripcio: |
        Conclou $E=\mathbb{R}^m$ només perquè conté una bola, sense usar l'estructura lineal.
      pregunta: |
        Un conjunt qualsevol que contingui una bola centrada a l'origen ha de ser tot $\mathbb{R}^m$? Què té d'especial $E$?
    - id: base_dins_bola
      descripcio: |
        Afirma que la base canònica $e_i$ és dins de la bola sense comprovar que $\|e_i\|=1<r$.
      pregunta: |
        El radi $r$ de la bola pot ser molt petit. Segur que els vectors que fas servir hi caben?
    - id: oblida_zero
      descripcio: |
        Divideix per $\|v\|$ sense separar el cas $v=0$.
      pregunta: |
        La teva construcció funciona per a tots els vectors de $\mathbb{R}^m$, inclòs el vector nul?
    nota_professor: |
      Alternativa: $\frac r2 e_1,\dots,\frac r2 e_m\in B(0,r)\subseteq E$ són $m$ vectors linealment independents, per tant $\dim E=m$.
  - id: t2-17c
    apartat: c
    tipus: teoric
    enunciat: |
      Demostreu que $E$ és tancat.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        Si $E=\mathbb{R}^m$ és tancat. Altrament, sigui $u_1,\dots,u_k$ una base de $E^\perp$; com que $(E^\perp)^\perp=E$, $E=\ker L$ amb $L:\mathbb{R}^m\to\mathbb{R}^k$, $L(x)=(\langle x,u_1\rangle,\dots,\langle x,u_k\rangle)$, lineal. $L$ és Lipschitz, per tant contínua, i $\{0\}$ és tancat a $\mathbb{R}^k$; per la caracterització de la continuïtat amb tancats, $E=L^{-1}(\{0\})$ és tancat.
      fuites: []
    passos:
    - id: equacions
      titol: Descriure $E$ amb equacions
      objectiu: |
        Escriure $E$ com el conjunt de solucions d'unes equacions, és a dir, com el conjunt on s'anul·la una certa funció.
      idea: |
        Àlgebra lineal: tot subespai de $\mathbb{R}^m$ és el nucli d'una aplicació lineal (per exemple, usant el complement ortogonal i que $(E^\perp)^\perp=E$).
      detall: |
        Si $E=\mathbb{R}^m$ no hi ha res a fer ($\mathbb{R}^m$ és tancat). Si no, prenem una base $u_1,\dots,u_k$ de $E^\perp$ i $L(x)=(\langle x,u_1\rangle,\dots,\langle x,u_k\rangle)$; aleshores $E=\{x:L(x)=0\}=\ker L=L^{-1}(\{0\})$.
      fuites:
      - \\ker\s*L
      - L\^\{-1\}\s*\(\s*\\\{\s*0\s*\\\}
      teoria:
      - T1.13
    - id: continuitat
      titol: Continuïtat de la funció
      objectiu: |
        Justificar que la funció que defineix $E$ és contínua.
      idea: |
        Les aplicacions lineals de $\mathbb{R}^m$ a $\mathbb{R}^k$ són de Lipschitz, i Lipschitz implica contínua.
      detall: |
        $L(x)=Ax$ per a una matriu $A$ de mida $k\times m$; per l'exemple 27 és de Lipschitz i per la proposició 28 és contínua.
      fuites: []
      teoria:
      - T2.27
      - T2.28
    - id: antiimatge
      titol: Antiimatge d'un tancat
      objectiu: |
        Concloure que $E$ és tancat.
      idea: |
        Caracterització de la continuïtat per tancats: l'antiimatge d'un tancat per una funció contínua definida a tot l'espai és tancada.
      detall: |
        $\{0\}$ és tancat a $\mathbb{R}^k$ (el seu complementari és obert). Pel teorema 17(d) amb $\Omega=\mathbb{R}^m$, $L^{-1}(\{0\})=D\cap\mathbb{R}^m=D$ amb $D$ tancat. Per tant $E$ és tancat.
      fuites: []
      teoria:
      - T2.17
    errors_comuns:
    - id: confon_no_obert
      descripcio: |
        Argumenta que, com que $E$ no és obert (per (b), si $E\neq\mathbb{R}^m$), ha de ser tancat.
      pregunta: |
        Un conjunt que no és obert és necessàriament tancat? Coneixes algun subconjunt de $\mathbb{R}$ que no sigui ni una cosa ni l'altra?
    - id: continuitat_sense_justificar
      descripcio: |
        Diu que l'antiimatge és tancada sense justificar la continuïtat de l'aplicació (o sense dir quin resultat usa).
      pregunta: |
        Quina hipòtesi necessita el resultat que dona antiimatges tancades? L'has comprovada?
    - id: successions_sense_coordenades
      descripcio: |
        Amb successions, afirma que el límit d'una successió de $E$ és de $E$ "perquè $E$ és subespai", sense cap argument de continuïtat.
      pregunta: |
        Les operacions lineals asseguren que els límits de successions de $E$ es queden a $E$? Quina eina topològica et falta?
    nota_professor: |
      Alternativa per successions (Prop. 19(iii) del Tema 1): si $x_n\in E$, $x_n\to x$, aleshores $L(x_n)=0\to L(x)$ per continuïtat, i $L(x)=0$. També: $E=\bigcap_i\{\langle x,u_i\rangle=0\}$, intersecció finita de tancats. El fet clau és la dimensió finita.
  - id: t2-17d
    apartat: d
    tipus: teoric
    enunciat: |
      Demostreu que $E$ és compacte si i només si $E=\{0\}$.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        $\Leftarrow$: $\{0\}$ és tancat i fitat, per tant compacte (Heine-Borel; o directament, de tot recobriment n'hi ha prou amb un obert que contingui $0$). $\Rightarrow$: si $E\neq\{0\}$, existeix $v\in E$, $v\neq0$, i $tv\in E$ per a tot $t\in\mathbb{R}$, amb $\|tv\|=|t|\,\|v\|\to\infty$; $E$ no és fitat i, per Heine-Borel, no és compacte.
      fuites: []
    passos:
    - id: zero_compacte
      titol: Implicació $\Leftarrow$
      objectiu: |
        Veure que el subespai trivial és compacte.
      idea: |
        Un conjunt d'un sol punt és tancat i fitat (o bé usar directament la definició amb recobriments).
      detall: |
        $\{0\}\subseteq B(0,1)$ és fitat i és tancat; per Heine-Borel és compacte. Directament: de qualsevol recobriment per oberts n'hi ha prou amb un obert que contingui $0$.
      fuites: []
      teoria:
      - T1.34
      - T1.24
    - id: no_fitat
      titol: 'Implicació $\Rightarrow$: un subespai no trivial no és fitat'
      objectiu: |
        Suposant $E\neq\{0\}$, veure que $E$ no pot estar dins de cap bola.
      idea: |
        Un subespai no trivial conté tota la recta generada per un vector no nul.
      detall: |
        Sigui $v\in E$, $v\neq0$. Per a tot $t\in\mathbb{R}$, $tv\in E$ i $\|tv\|=|t|\,\|v\|$, que no està fitat quan $t\to\infty$. Per tant cap bola $B(x,L)$ conté $E$.
      fuites:
      - \\\|t\s*v\\\|\s*=\s*\|t\|
      teoria:
      - T1.33
    - id: concloure
      titol: Concloure
      objectiu: |
        Deduir que $E$ no és compacte si $E\neq\{0\}$.
      idea: |
        A $\mathbb{R}^m$, compacte equival a tancat i fitat.
      detall: |
        Per Heine-Borel, tot compacte de $\mathbb{R}^m$ és fitat; com que $E$ no és fitat, no és compacte. (Pel contrarecíproc, $E$ compacte $\Rightarrow E=\{0\}$.)
      fuites: []
      teoria:
      - T1.34
    errors_comuns:
    - id: tancat_implica_compacte
      descripcio: |
        Usa l'apartat (c) i conclou que $E$ és compacte perquè és tancat.
      pregunta: |
        Ser tancat és suficient per ser compacte a $\mathbb{R}^m$? Quina altra condició cal?
    - id: oblida_reciproc
      descripcio: |
        Només demostra una de les dues implicacions.
      pregunta: |
        L'enunciat és un "si i només si". Has demostrat els dos sentits?
    - id: fitat_mal_justificat
      descripcio: |
        Diu que $E$ no és fitat "perquè és infinit", confonent infinit amb no fitat.
      pregunta: |
        Un conjunt amb infinits punts ha de ser no fitat? Pensa en $[0,1]$. Què has de mostrar exactament?
    nota_professor: |
      Combinat amb (c): $E$ és sempre tancat, de manera que compacte $\Leftrightarrow$ fitat $\Leftrightarrow E=\{0\}$. L'enunciat de Heine-Borel a les notes diu "$n>1$", però val per a tot $n\geq1$.
- num: 18
  font: null
  preambul: |
    Sigui $M_2(\mathbb{R})$ el conjunt de matrius quadrades $2\times2$ amb coeficients reals, que identifiquem amb $\mathbb{R}^4$ mitjançant l'aplicació $F:M_2(\mathbb{R})\longrightarrow\mathbb{R}^4$ donada per
    $$F\left(\begin{pmatrix}a&c\\b&d\end{pmatrix}\right)=(a,b,c,d)^T$$
  indicacio: null
  exercicis:
  - id: t2-18a
    apartat: a
    tipus: teoric
    enunciat: |
      Demostreu que l'aplicació $\det:M_2(\mathbb{R})\longrightarrow\mathbb{R}$, que associa a cada matriu el seu determinant, és contínua.
    teoria:
    - T2.14
    teoria_reservada: []
    resultat:
      valor: |
        Amb la identificació $F$, $\det$ correspon a la funció $D:\mathbb{R}^4\to\mathbb{R}$, $D(a,b,c,d)=ad-bc$. Les projeccions $(a,b,c,d)\mapsto a$, etc. són lineals, per tant de Lipschitz i contínues; productes i diferències de funcions contínues són contínues. Per tant $\det$ és contínua.
      fuites: []
    passos:
    - id: coordenades
      titol: Escriure el determinant en coordenades
      objectiu: |
        Expressar $\det$ com una funció de $\mathbb{R}^4$ a $\mathbb{R}$ a través de la identificació $F$.
      idea: |
        Calcular el determinant de la matriu genèrica en funció de les seves entrades.
      detall: |
        $\det\circ F^{-1}(a,b,c,d)=ad-bc$. Dir que $\det$ és contínua vol dir que $D(a,b,c,d)=ad-bc$ és contínua a $\mathbb{R}^4$.
      fuites:
      - a\s*d\s*-\s*b\s*c
      teoria: []
    - id: projeccions
      titol: Continuïtat de les coordenades
      objectiu: |
        Justificar que cada funció coordenada $(a,b,c,d)\mapsto a$ (i les altres) és contínua.
      idea: |
        Les projeccions són aplicacions lineals; les lineals són Lipschitz i Lipschitz implica contínua.
      detall: |
        $\pi_1(a,b,c,d)=a$ és lineal, i $|\pi_1(x)-\pi_1(y)|\leq\|x-y\|$; per l'exemple 27 i la proposició 28 és contínua. Igual per a $b,c,d$.
      fuites: []
      teoria:
      - T2.27
      - T2.28
    - id: algebra
      titol: Àlgebra de funcions contínues
      objectiu: |
        Concloure la continuïtat del determinant a partir de la de les coordenades.
      idea: |
        Productes, sumes i múltiples de funcions contínues són contínues.
      detall: |
        $ad=\pi_1\pi_4$ i $bc=\pi_2\pi_3$ són contínues (prop. 20(ii)) i $ad-bc=ad+(-1)bc$ també (prop. 20(i)). Per tant $\det$ és contínua.
      fuites: []
      teoria:
      - T2.20
    errors_comuns:
    - id: sense_identificacio
      descripcio: |
        Diu que el determinant és "una operació contínua" sense explicar respecte de quina distància ni com s'identifica amb una funció de $\mathbb{R}^4$.
      pregunta: |
        Per parlar de continuïtat necessites una distància a $M_2(\mathbb{R})$. D'on surt, en aquest problema?
    - id: polinomi_sense_justificar
      descripcio: |
        Afirma que els polinomis són continus sense justificar-ho amb els resultats del curs.
      pregunta: |
        Quins resultats del tema et permeten passar de funcions senzilles a sumes i productes d'elles?
    - id: lineal
      descripcio: |
        Creu que el determinant és lineal i en dedueix la continuïtat per aquest motiu.
      pregunta: |
        Es compleix $\det(A+B)=\det A+\det B$? Prova-ho amb la identitat.
    nota_professor: |
      $F$ és una bijecció lineal; la topologia de $M_2(\mathbb{R})$ és la transportada de $\mathbb{R}^4$ per $F$ (norma de Frobenius si es pren l'euclidiana).
  - id: t2-18b
    apartat: b
    tipus: calcul
    enunciat: |
      Determineu si els conjunts següents són oberts, tancats o compactes:
      $$C_1=\{A\in M_2(\mathbb{R})\text{ invertibles}\},\ C_2=\{A\in M_2(\mathbb{R})\mid\det A=1\},\ C_3=\{A\in M_2(\mathbb{R})\mid\det A>0\}.$$
    teoria:
    - T1.11
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        $C_1=\det^{-1}(\mathbb{R}\setminus\{0\})$: obert, no tancat, no compacte.
        $C_2=\det^{-1}(\{1\})$: tancat, no obert, no compacte (no fitat).
        $C_3=\det^{-1}((0,+\infty))$: obert, no tancat, no compacte.
      fuites:
      - C_\{?1\}?\$?\s*(és|es)\s+(un\s+)?obert
      - C_\{?2\}?\$?\s*(és|es)\s+(un\s+)?tancat
      - C_\{?3\}?\$?\s*(és|es)\s+(un\s+)?obert
      - cap\s+(d.ells\s+)?(no\s+)?és\s+compacte
    passos:
    - id: c1
      titol: Estudiar $C_1$
      objectiu: |
        Classificar $C_1$ quant a obertura i tancament.
      idea: |
