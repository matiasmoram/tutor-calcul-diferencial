# Render blueprint (https://render.com/docs/blueprint-spec): one Docker web service.
# The database is Supabase (external). Secrets marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: tutor-calcul
    runtime: docker
    # Free: 512 MB, one instance, sleeps when idle. A paid plan here would upgrade the service on a blueprint sync.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openai
      # No global TUTOR_MODEL: it would also force the generation/verification stages (quiz_*, mistakes_generation,
      # mistakes_verification), which keep their defaults (stage_configs.py). Measured: gpt-5.6-luna does well on
      # the tutor stages and gradings at ~1/5 the cost of gpt-5.4-mini; gpt-5.4-mini for quiz generation hit
      # max_tokens and emitted NUL bytes in the JSON.
      - key: TUTOR_MODEL_DIAGNOSIS
        value: gpt-5.6-luna
      - key: TUTOR_MODEL_REPLY
        value: gpt-5.6-luna
      - key: TUTOR_MODEL_GUARD
        value: gpt-5.6-luna
      - key: TUTOR_EFFORT_DIAGNOSIS
        value: none
      - key: TUTOR_EFFORT_REPLY
        value: none
      - key: TUTOR_EFFORT_GUARD
        value: none
      - key: TUTOR_MODEL_TRANSCRIPTION
        value: gpt-5.6-luna
      - key: TUTOR_MODEL_MISTAKES_GRADING
        value: gpt-5.6-luna
      - key: TUTOR_MODEL_QUIZ_GRADING
        value: gpt-5.6-luna
      # Who may trigger live (paid) generation of "Troba l'error" documents / "Cert o fals" quizzes. Students get
      # pre-generated content only (409 when none is ready).
      - key: TUTOR_GENERACIO
        value: professor
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TUTOR_CLAU_PROFESSOR
        sync: false
