problemes:
  - num: 12
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t3-12"
        apartat: null
        tipus: calcul
        enunciat: |
          Considerem la funció $f(x,y)=(xy^{3/2},\ x^{3/2}-y^2)$. Justifiqueu que és diferenciable en un entorn del punt $(4,1)$, calculeu l'aproximació lineal de $f$ en el punt $(4,1)$, i useu-la per calcular una aproximació de $f(4.2,1.1)$.
        teoria: ["T3.8", "T3.x4"]
        teoria_reservada: []
        resultat:
          valor: |
            En l'obert $\{x>0,\ y>0\}$, que conté $(4,1)$, les quatre derivades parcials existeixen i són contínues, per tant $f$ hi és diferenciable. Amb $f(4,1)=(4,7)$ i $Jf(4,1)=\begin{pmatrix}1&6\\3&-2\end{pmatrix}$, l'aproximació lineal és
            $L(x,y)=(4,7)+\begin{pmatrix}1&6\\3&-2\end{pmatrix}\begin{pmatrix}x-4\\y-1\end{pmatrix}=\big(4+(x-4)+6(y-1),\ 7+3(x-4)-2(y-1)\big)$,
            i $f(4.2,1.1)\approx L(4.2,1.1)=(4.8,\ 7.4)$ (el valor exacte és $\approx(4.8455,\ 7.3974)$).
          fuites: ['\(\s*4(\.|,|\{,\})8\s*,(\\\s|\s)*7(\.|,|\{,\})4\s*\)', '4(\.|,|\{,\})8\b.{0,40}7(\.|,|\{,\})4\b']
        passos:
          - id: diferenciable
            titol: "Justificar la diferenciabilitat"
            objectiu: |
              Justificar que $f$ és diferenciable en tot un entorn de $(4,1)$.
            idea: |
              Busca un obert al voltant de $(4,1)$ on les expressions de les components siguin derivables sense problemes (atenció a les potències d'exponent $3/2$) i aplica la condició suficient de diferenciabilitat.
            detall: |
              A l'obert $U=\{x>0,\ y>0\}\ni(4,1)$ les parcials $\frac{\partial f_1}{\partial x}=y^{3/2}$, $\frac{\partial f_1}{\partial y}=\frac32xy^{1/2}$, $\frac{\partial f_2}{\partial x}=\frac32x^{1/2}$, $\frac{\partial f_2}{\partial y}=-2y$ existeixen i són contínues (composicions i productes de funcions contínues). Per la condició suficient, $f$ és diferenciable a tot $U$.
            fuites: []
            teoria: ["T3.18", "T2.20"]
          - id: jacobiana
            titol: "Matriu jacobiana al punt"
            objectiu: |
              Calcular $f(4,1)$ i la matriu de la diferencial de $f$ a $(4,1)$.
            idea: |
              Avalua les derivades parcials de cada component al punt: la fila $i$ correspon a la component $f_i$.
            detall: |
              $f(4,1)=(4\cdot1,\ 8-1)=(4,7)$ i $Jf(4,1)=\begin{pmatrix}1&6\\3&-2\end{pmatrix}$ (perquè $\frac32\cdot4\cdot1=6$ i $\frac32\cdot\sqrt4=3$).
            fuites: ['\\begin\{[pb]matrix\}\s*1\s*&\s*6\s*\\\\\s*3\s*&\s*-\s*2', '\(4\s*,\s*7\)']
            teoria: ["T3.9", "T3.10"]
          - id: aproximacio_lineal
            titol: "Escriure l'aproximació lineal"
            objectiu: |
              Escriure la funció afí que aproxima $f$ prop de $(4,1)$.
            idea: |
              És el valor al punt més la diferencial aplicada a l'increment $(x-4,\ y-1)$.
            detall: |
              $L(x,y)=(4,7)+\begin{pmatrix}1&6\\3&-2\end{pmatrix}\begin{pmatrix}x-4\\y-1\end{pmatrix}=\big(4+(x-4)+6(y-1),\ 7+3(x-4)-2(y-1)\big)$.
            fuites: ['4\s*\+\s*\(x\s*-\s*4\)\s*\+\s*6\s*\(y\s*-\s*1\)', '7\s*\+\s*3\s*\(x\s*-\s*4\)']
            teoria: ["T3.x4"]
          - id: avaluar
            titol: "Avaluar l'aproximació"
            objectiu: |
              Usar l'aproximació lineal per estimar $f(4.2,1.1)$.
            idea: |
              Calcula l'increment respecte del punt base i substitueix-lo a l'aproximació lineal.
            detall: |
              Increment $(0.2,\ 0.1)$: $L(4.2,1.1)=(4+0.2+0.6,\ 7+0.6-0.2)=(4.8,\ 7.4)$. (Valor exacte $\approx(4.8455,\ 7.3974)$.)
            fuites: ['\(\s*4(\.|,|\{,\})8\s*,(\\\s|\s)*7(\.|,|\{,\})4\s*\)', '4(\.|,|\{,\})8\b.{0,40}7(\.|,|\{,\})4\b']
            teoria: []
        errors_comuns:
          - id: increment_malament
            descripcio: |
              Substitueix $(4.2,\ 1.1)$ directament a la matriu jacobiana en lloc de l'increment $(0.2,\ 0.1)$.
            pregunta: |
              A l'aproximació lineal, la matriu jacobiana multiplica el punt nou o la diferència entre el punt nou i el punt base?
          - id: jacobiana_transposada
            descripcio: |
              Escriu la jacobiana transposada (posa les derivades d'una mateixa component en una columna).
            pregunta: |
              Si multipliques la teva matriu per $(x-4,\ y-1)$, la primera component del resultat depèn només de $f_1$?
          - id: diferenciable_sense_justificar
            descripcio: |
              Diu que és diferenciable "perquè és una funció elemental" sense mirar on són contínues les parcials (amb potències $3/2$ el domini importa).
            pregunta: |
              On està definida $y^{1/2}$ i on és contínua? El punt $(4,1)$ té un entorn on tot funciona?
        nota_professor: |
          $f$ està definida per $x\ge0$, $y\ge0$; només cal treballar a l'obert $x,y>0$. L'error de l'aproximació és de l'ordre de $10^{-2}$, coherent amb un increment de norma $\approx0.22$.

  - num: 13
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t3-13"
        apartat: null
        tipus: calcul
        enunciat: |
          Calculeu un valor aproximat de $\sqrt{3+e^{-0.1}\cos0.05+5\sin0.05}$.
        teoria: []
        teoria_reservada: []
        resultat:
          valor: |
            Amb $f(x,y)=\sqrt{3+e^x\cos y+5\sin y}$ al voltant de $(0,0)$: $f(0,0)=2$, $\nabla f(0,0)=(1/4,\ 5/4)$, i
            $\sqrt{3+e^{-0.1}\cos0.05+5\sin0.05}\approx2+\frac14(-0.1)+\frac54(0.05)=2.0375$ (el valor exacte és $\approx2.0380$).
          fuites: ['2(\.|,|\{,\})037', '2(\.|,|\{,\})038']
        passos:
          - id: triar_funcio
            titol: "Triar la funció i el punt base"
            objectiu: |
              Escriure el nombre com el valor d'una funció de diverses variables en un punt proper a un punt on la funció és fàcil d'avaluar.
            idea: |
              Substitueix els nombres petits ($-0.1$ i $0.05$) per variables i pren com a punt base aquell on aquestes variables valen $0$.
            detall: |
              $f(x,y)=\sqrt{3+e^x\cos y+5\sin y}$, punt base $(0,0)$, on $f(0,0)=\sqrt{3+1+0}=2$; volem $f(-0.1,\ 0.05)$.
            fuites: ['e\^\{?x\}?\s*\\cos\s*y']
            teoria: []
          - id: diferenciable
            titol: "Justificar la diferenciabilitat"
            objectiu: |
              Veure que la funció és diferenciable al punt base, per poder-hi fer servir l'aproximació afí.
            idea: |
              Mira si les parcials existeixen i són contínues en un entorn del punt base (l'argument de l'arrel hi ha de ser positiu).
            detall: |
              Prop de $(0,0)$ l'argument de l'arrel és proper a $4>0$, així que $f$ és composició de funcions $\mathcal{C}^1$ amb parcials contínues; per la condició suficient, és diferenciable a $(0,0)$.
            fuites: []
            teoria: ["T3.18"]
          - id: gradient
            titol: "Calcular el gradient"
            objectiu: |
              Calcular les derivades parcials de $f$ al punt base.
            idea: |
              Deriva l'arrel per la regla de la cadena d'una variable i avalua a l'origen.
            detall: |
              $\frac{\partial f}{\partial x}=\frac{e^x\cos y}{2f}$, $\frac{\partial f}{\partial y}=\frac{-e^x\sin y+5\cos y}{2f}$; a $(0,0)$: $\nabla f(0,0)=(1/4,\ 5/4)$.
            fuites: ['\(\s*1\s*/\s*4\s*,(\\\s|\s)*5\s*/\s*4\s*\)', '\\[dt]?frac\{?1\}?\{?4\}?\s*,(\\\s|\s)*\\[dt]?frac\{?5\}?\{?4\}?', '\(\s*0(\.|,|\{,\})25\s*,(\\\s|\s)*1(\.|,|\{,\})25\s*\)']
            teoria: ["T3.9", "T3.10"]
          - id: aproximar
            titol: "Aproximar"
            objectiu: |
              Obtenir el valor aproximat.
            idea: |
              Aproximació afí: valor al punt base més el gradient aplicat a l'increment.
            detall: |
              $f(-0.1,\ 0.05)\approx2+\frac14(-0.1)+\frac54(0.05)=2-0.025+0.0625=2.0375$.
            fuites: ['2(\.|,|\{,\})0375', '2\s*-\s*0(\.|,|\{,\})025\s*\+\s*0(\.|,|\{,\})0625']
            teoria: ["T3.x4"]
        errors_comuns:
          - id: punt_base_dolent
            descripcio: |
              Pren un punt base on la funció no és fàcil d'avaluar o que no és proper al punt desitjat.
            pregunta: |
              En quin punt saps calcular exactament el valor de la funció sense calculadora? És a prop del que vols aproximar?
          - id: signe_increment
            descripcio: |
              Usa l'increment $+0.1$ en lloc de $-0.1$ per a la variable de l'exponencial.
            pregunta: |
              Quin és exactament el valor de la primera variable al punt que vols aproximar?
          - id: oblida_arrel
            descripcio: |
              Aproxima només l'argument de l'arrel i oblida el factor $\frac{1}{2\sqrt{\cdot}}$ en derivar.
            pregunta: |
              Quina és la derivada de $\sqrt{g}$ respecte d'una variable? Has inclòs tots els factors?
        nota_professor: |
          També es pot treballar amb tres variables, $f(x,y,z)=\sqrt{3+e^x\cos y+5\sin z}$, o fixar $y=z$ com aquí; el resultat és el mateix. Alternativament, aproximar primer l'argument ($\approx4.15$) i després l'arrel dona $\approx2.0375$ també.

  - num: 14
    font: null
    preambul: |
      Calculeu les derivades direccionals de les funcions següents en els punts i direccions que s'indiquen:
    indicacio: null
    exercicis:
      - id: "t3-14a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          $f(x,y)=\log\left(\sqrt{x^2+y^2}\right)$, $a=(1,0)$, $\mathbf{v}=(2,1)$;
        teoria: ["T3.1"]
        teoria_reservada: []
        resultat:
          valor: |
            $D_{\mathbf v}f(1,0)=2$ (amb el vector $\mathbf v=(2,1)$ tal com és donat; si es normalitza, $D_{\mathbf v/\|\mathbf v\|}f(1,0)=2/\sqrt5$).
          fuites: ['D_\{?[^=$]{0,25}f\s*\(\s*1\s*,\s*0\s*\)\s*=\s*2\b', 'derivada direccional (és|val)\s*\$?2\b', '2\s*/\s*\\sqrt\{?5', '\\[dt]?frac\{?2\}?\{\\sqrt\{?5']
        passos:
          - id: diferenciable
            titol: "Diferenciabilitat al punt"
            objectiu: |
              Decidir si es pot calcular la derivada direccional a partir del gradient.
            idea: |
              Si $f$ és diferenciable al punt, la derivada direccional s'obté de la diferencial; comprova-ho amb la condició suficient.
            detall: |
              $f(x,y)=\frac12\log(x^2+y^2)$ té parcials $\frac{x}{x^2+y^2}$, $\frac{y}{x^2+y^2}$, contínues a $\mathbb{R}^2\setminus\{(0,0)\}$; per tant $f$ és diferenciable a $(1,0)$.
            fuites: []
            teoria: ["T3.18"]
          - id: gradient
            titol: "Gradient al punt"
            objectiu: |
              Calcular $\nabla f(1,0)$.
            idea: |
              Simplifica primer el logaritme de l'arrel i deriva.
            detall: |
              $\nabla f(x,y)=\left(\frac{x}{x^2+y^2},\frac{y}{x^2+y^2}\right)$, així que $\nabla f(1,0)=(1,0)$.
            fuites: ['\\nabla\s*f\s*\(1,\s*0\)\s*=\s*\(1,\s*0\)']
            teoria: ["T3.10"]
          - id: direccional
            titol: "Derivada direccional"
            objectiu: |
              Calcular $D_{\mathbf v}f(1,0)$.
            idea: |
              Per a una funció diferenciable, la derivada direccional és el producte escalar del gradient amb el vector.
            detall: |
              $D_{\mathbf v}f(1,0)=\langle(1,0),(2,1)\rangle=2$.
            fuites: ['\\langle\s*\(1,\s*0\)\s*,\s*\(2,\s*1\)\s*\\rangle\s*=\s*2', '\\rangle\s*=\s*2\b', '1\s*\\cdot\s*2\s*\+\s*0\s*\\cdot\s*1']
            teoria: ["T3.9"]
        errors_comuns:
          - id: normalitzacio
            descripcio: |
              Normalitza el vector sense que calgui, o barreja el vector normalitzat amb el no normalitzat (amb la definició dels apunts, $D_{\mathbf v}f$ es calcula amb $\mathbf v$ tal com és).
            pregunta: |
              La definició de $D_uf(a)$ dels apunts demana que $u$ sigui unitari? Què passa amb $D_{\lambda u}f(a)$?
          - id: derivada_log
            descripcio: |
              Deriva malament $\log\sqrt{x^2+y^2}$ (oblida el factor $\frac12$ o el de la cadena).
            pregunta: |
              Pots reescriure $\log\sqrt{g}$ d'una manera més senzilla abans de derivar?
          - id: sense_justificar
            descripcio: |
              Usa $\nabla f\cdot\mathbf v$ sense justificar la diferenciabilitat.
            pregunta: |
              La fórmula del gradient per la direcció, per a quines funcions està garantida?
        nota_professor: |
          Es pot comprovar amb la definició: $f(1+2t,t)=\frac12\log(1+4t+5t^2)$, la derivada a $t=0$ és $2$. Si el professor espera vector unitari, el valor és $2/\sqrt5$.

      - id: "t3-14b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          $f(x,y)=e^x\cos(\pi y)$, $a=(0,-1)$, $\mathbf{v}=(-1,2)$.
        teoria: ["T3.1"]
        teoria_reservada: []
        resultat:
          valor: |
            $D_{\mathbf v}f(0,-1)=1$ (amb $\mathbf v=(-1,2)$ tal com és donat; normalitzat, $1/\sqrt5$).
          fuites: ['D_\{?[^=$]{0,25}f\s*\(\s*0\s*,\s*-\s*1\s*\)\s*=\s*1\b', 'derivada direccional (és|val)\s*\$?1\b', '1\s*/\s*\\sqrt\{?5', '\\[dt]?frac\{?1\}?\{\\sqrt\{?5']
        passos:
          - id: diferenciable
            titol: "Diferenciabilitat"
            objectiu: |
              Decidir si es pot calcular la derivada direccional a partir del gradient.
            idea: |
              Comprova la condició suficient de diferenciabilitat.
            detall: |
              Les parcials $e^x\cos(\pi y)$ i $-\pi e^x\sin(\pi y)$ són contínues a tot $\mathbb{R}^2$, així que $f$ és diferenciable a tot arreu.
            fuites: []
            teoria: ["T3.18"]
          - id: gradient
            titol: "Gradient al punt"
            objectiu: |
              Calcular $\nabla f(0,-1)$.
            idea: |
              Avalua les parcials al punt, amb compte amb el sinus i el cosinus de $-\pi$.
            detall: |
              $\nabla f(0,-1)=(\cos(-\pi),\ -\pi\sin(-\pi))=(-1,\ 0)$.
            fuites: ['\(\s*-\s*1\s*,(\\\s|\s)*0\s*\)']
            teoria: ["T3.10"]
          - id: direccional
            titol: "Derivada direccional"
            objectiu: |
              Calcular $D_{\mathbf v}f(0,-1)$.
            idea: |
              Producte escalar del gradient amb el vector.
            detall: |
              $D_{\mathbf v}f(0,-1)=\langle(-1,0),(-1,2)\rangle=1$.
            fuites: ['\\rangle\s*=\s*1\b', '\(\s*-\s*1\s*\)\s*\(\s*-\s*1\s*\)\s*\+\s*0']
            teoria: ["T3.9"]
        errors_comuns:
          - id: factor_pi
            descripcio: |
              Oblida el factor $\pi$ en derivar $\cos(\pi y)$ (aquí no afecta el resultat perquè $\sin(-\pi)=0$, però és un error).
            pregunta: |
              Quina és la derivada de $\cos(\pi y)$ respecte de $y$? D'on surt el factor extra?
          - id: cos_menys_pi
            descripcio: |
              Pren $\cos(-\pi)=1$.
            pregunta: |
              Quant val el cosinus d'un angle pla? Canvia en canviar-li el signe?
          - id: normalitzacio
            descripcio: |
              Barreja vector normalitzat i no normalitzat.
            pregunta: |
              Quin vector exacte has posat a la definició de derivada direccional?
        nota_professor: |
          Comprovació directa: $f(-t,-1+2t)=e^{-t}\cos(\pi(2t-1))=-e^{-t}\cos(2\pi t)$, de derivada $1$ a $t=0$.

  - num: 15
    font: null
    preambul: |
      Justifiqueu l'existència d'hiperplà tangent a les gràfiques de les funcions següents en el punt $(a,f(a))$ i calculeu-lo:
    indicacio: null
    exercicis:
      - id: "t3-15a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          $f(x,y,z)=y\arcsin(x\log y)+2^{x/y}$, $a=(0,1,2)$;
        teoria: ["T3.8", "T3.9"]
        teoria_reservada: []
        resultat:
          valor: |
            $f$ és de classe $\mathcal{C}^1$ a l'obert $\{y>0,\ |x\log y|<1\}$, que conté $a$, i per tant diferenciable a $a$. Amb $f(a)=1$ i $\nabla f(a)=(\log2,\ 0,\ 0)$, l'hiperplà tangent (a $\mathbb{R}^4$, coordenades $(x,y,z,w)$) és
            $w=1+(\log2)\,x$.
          fuites: ['=\s*1\s*\+\s*\(?\\(log|ln)\s*2\)?\s*(\\,|\\cdot|\\;)?\s*\(?x\b', '=\s*1\s*\+\s*x\s*(\\,|\\cdot)?\s*\\(log|ln)\s*2', '\(\s*\\(log|ln)\s*2\s*,(\\\s|\s)*0\s*,(\\\s|\s)*0\s*\)']
        passos:
          - id: diferenciable
            titol: "Justificar la diferenciabilitat"
            objectiu: |
              Trobar un obert al voltant de $a$ on $f$ sigui diferenciable.
            idea: |
              Identifica on cada peça ($\log y$, $\arcsin$, $2^{x/y}$) és derivable amb derivada contínua i aplica la condició suficient.
            detall: |
              $\log y$ i $x/y$ són $\mathcal{C}^1$ per $y>0$; $\arcsin$ és derivable amb derivada contínua a $(-1,1)$. A l'obert $U=\{y>0,\ |x\log y|<1\}$ (a $a$: $x\log y=0$) totes les parcials existeixen i són contínues, per tant $f$ és diferenciable a $a$ i existeix l'hiperplà tangent.
            fuites: []
            teoria: ["T3.18"]
          - id: valor
            titol: "Valor al punt"
            objectiu: |
              Calcular $f(a)$.
            idea: |
              Substitueix directament.
            detall: |
              $f(0,1,2)=1\cdot\arcsin(0)+2^0=1$.
            fuites: []
            teoria: []
          - id: gradient
            titol: "Gradient al punt"
            objectiu: |
              Calcular $\nabla f(a)$.
            idea: |
              Deriva cada sumand (regla de la cadena d'una variable) i avalua; observa de quines variables depèn realment $f$.
            detall: |
              $\frac{\partial f}{\partial x}=\frac{y\log y}{\sqrt{1-x^2\log^2y}}+\frac{\log2}{y}2^{x/y}$, $\frac{\partial f}{\partial y}=\arcsin(x\log y)+\frac{x}{\sqrt{1-x^2\log^2y}}-\frac{x\log2}{y^2}2^{x/y}$, $\frac{\partial f}{\partial z}=0$. A $a$: $\nabla f(a)=(\log2,\ 0,\ 0)$.
            fuites: ['\(\s*\\(log|ln)\s*2\s*,(\\\s|\s)*0\s*,(\\\s|\s)*0\s*\)']
            teoria: ["T3.10"]
          - id: hiperpla
            titol: "Escriure l'hiperplà"
            objectiu: |
              Escriure l'equació de l'hiperplà tangent a la gràfica a $(a,f(a))$.
            idea: |
              Usa la fórmula de l'hiperplà tangent: valor al punt més el gradient aplicat a $x-a$.
            detall: |
              $w=1+\log2\,(x-0)+0\,(y-1)+0\,(z-2)$, és a dir $w=1+(\log2)\,x$, a $\mathbb{R}^4$.
            fuites: ['=\s*1\s*\+\s*\(?\\(log|ln)\s*2', '=\s*1\s*\+\s*x\s*(\\,|\\cdot)?\s*\\(log|ln)\s*2']
            teoria: ["T3.9"]
        errors_comuns:
          - id: pla_a_R3
            descripcio: |
              Escriu un pla de $\mathbb{R}^3$ en lloc d'un hiperplà de $\mathbb{R}^4$ (la gràfica d'una funció de 3 variables viu a $\mathbb{R}^4$).
            pregunta: |
              Quantes coordenades té un punt de la gràfica d'una funció de tres variables?
          - id: derivada_exponencial
            descripcio: |
              Deriva $2^{x/y}$ com si fos $e^{x/y}$ (oblida el factor $\log2$).
            pregunta: |
              Com escriuries $2^{s}$ en forma d'exponencial de base $e$? Què dona en derivar?
          - id: domini_arcsin
            descripcio: |
              No comprova que l'argument de l'arcsinus és a $(-1,1)$ prop de $a$, on $\arcsin$ és derivable.
            pregunta: |
              On és derivable $\arcsin$? Es compleix això en un entorn de $a$?
        nota_professor: |
          $f$ no depèn de $z$, per això $\partial_zf=0$; l'hiperplà tangent tampoc no hi depèn.

      - id: "t3-15b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          $f(x,y,z)=xy^2+y^2z^3+xz^3$, $a=(4,-2,-1)$;
        teoria: ["T3.8", "T3.9"]
        teoria_reservada: []
        resultat:
          valor: |
            $f$ és polinòmica, amb parcials contínues a $\mathbb{R}^3$, per tant diferenciable. $f(a)=8$, $\nabla f(a)=(3,-12,24)$, i l'hiperplà tangent és
            $w=8+3(x-4)-12(y+2)+24(z+1)$, és a dir $w=3x-12y+24z-4$.
          fuites: ['\(\s*3\s*,\s*-\s*12\s*,\s*24\s*\)', 'w\s*=\s*3x\s*-\s*12y\s*\+\s*24z', '8\s*\+\s*3\s*\(x\s*-\s*4\)']
        passos:
          - id: diferenciable
            titol: "Justificar la diferenciabilitat"
            objectiu: |
              Justificar que $f$ és diferenciable a $a$.
            idea: |
              Mira de quin tipus de funció es tracta i aplica la condició suficient.
            detall: |
              $f$ és un polinomi: les seves parcials són polinomis, contínues a tot $\mathbb{R}^3$; per tant $f$ és diferenciable a tot arreu.
            fuites: []
            teoria: ["T3.18"]
          - id: gradient
            titol: "Valor i gradient al punt"
            objectiu: |
              Calcular $f(a)$ i $\nabla f(a)$.
            idea: |
              Deriva respecte de cada variable i avalua amb cura els signes ($y=-2$, $z=-1$).
            detall: |
              $f(a)=16-4-4=8$. $\frac{\partial f}{\partial x}=y^2+z^3=3$, $\frac{\partial f}{\partial y}=2xy+2yz^3=-16+4=-12$, $\frac{\partial f}{\partial z}=3y^2z^2+3xz^2=12+12=24$. $\nabla f(a)=(3,-12,24)$.
            fuites: ['\(\s*3\s*,\s*-\s*12\s*,\s*24\s*\)']
            teoria: ["T3.10"]
          - id: hiperpla
            titol: "Escriure l'hiperplà"
            objectiu: |
              Escriure l'equació de l'hiperplà tangent.
            idea: |
              Valor al punt més el gradient aplicat a $x-a$.
            detall: |
              $w=8+3(x-4)-12(y+2)+24(z+1)=3x-12y+24z-4$.
            fuites: ['8\s*\+\s*3\s*\(x\s*-\s*4\)', '3x\s*-\s*12y\s*\+\s*24z']
            teoria: ["T3.9"]
        errors_comuns:
          - id: signes
            descripcio: |
              S'equivoca amb els signes de les potències de nombres negatius ($z^3=-1$, $z^2=1$, $y^2=4$).
            pregunta: |
              Quin signe té $(-1)^3$? I $(-1)^2$?
          - id: increments
            descripcio: |
              Escriu $(y-2)$ i $(z-1)$ en lloc de $(y+2)$ i $(z+1)$.
            pregunta: |
              Quines són les coordenades exactes de $a$? Què val $y-a_2$?
          - id: pla_a_R3
            descripcio: |
              Escriu l'hiperplà sense la variable de l'alçada, o com un pla de $\mathbb{R}^3$.
            pregunta: |
              On viu la gràfica d'una funció de tres variables?

      - id: "t3-15c"
        apartat: "c"
        tipus: calcul
        enunciat: |
          $f(x,y,z)=x^{yz}$, $a=(e,e,0)$.
        teoria: ["T3.8", "T3.9"]
        teoria_reservada: []
        resultat:
          valor: |
            A l'obert $\{x>0\}$, $f=e^{yz\log x}$ és $\mathcal{C}^1$, per tant diferenciable a $a$. $f(a)=1$, $\nabla f(a)=(0,0,e)$, i l'hiperplà tangent és $w=1+e\,z$.
          fuites: ['=\s*1\s*\+\s*e\s*(\\,|\\cdot|\\;)?\s*\(?z\b', '\(\s*0\s*,\s*0\s*,\s*e\s*\)']
        passos:
          - id: diferenciable
            titol: "Justificar la diferenciabilitat"
            objectiu: |
              Justificar que $f$ és diferenciable a $a$.
            idea: |
              Reescriu la potència amb base i exponent variables com una exponencial de base $e$, i mira on té sentit.
            detall: |
              Per $x>0$, $f(x,y,z)=e^{yz\log x}$, composició de funcions $\mathcal{C}^1$; les parcials són contínues a l'obert $\{x>0\}\ni a$, i $f$ hi és diferenciable.
            fuites: []
            teoria: ["T3.18"]
          - id: gradient
            titol: "Valor i gradient al punt"
            objectiu: |
              Calcular $f(a)$ i $\nabla f(a)$.
            idea: |
              Deriva l'exponencial per la regla de la cadena d'una variable i avalua a $a$.
            detall: |
              $f(a)=e^0=1$. $\frac{\partial f}{\partial x}=\frac{yz}{x}x^{yz}$, $\frac{\partial f}{\partial y}=z\log x\,x^{yz}$, $\frac{\partial f}{\partial z}=y\log x\,x^{yz}$. A $a$: $\nabla f(a)=(0,0,e)$.
            fuites: ['\(\s*0\s*,\s*0\s*,\s*e\s*\)']
            teoria: ["T3.10"]
          - id: hiperpla
            titol: "Escriure l'hiperplà"
            objectiu: |
              Escriure l'equació de l'hiperplà tangent.
            idea: |
              Valor al punt més el gradient aplicat a $x-a$.
            detall: |
              $w=1+0(x-e)+0(y-e)+e(z-0)$, és a dir $w=1+e\,z$.
            fuites: ['=\s*1\s*\+\s*e\s*(\\,|\\cdot|\\;)?\s*\(?z\b', 'e\s*\(z\s*-\s*0\)']
            teoria: ["T3.9"]
        errors_comuns:
          - id: potencia_com_polinomi
            descripcio: |
              Deriva $x^{yz}$ respecte de $y$ o $z$ com si l'exponent fos constant, o respecte de $x$ com si la base fos constant.
            pregunta: |
              Quan la variable és a l'exponent, quina regla de derivació fas servir? Ajuda escriure-ho com $e^{\text{algo}}$?
          - id: log_e
            descripcio: |
              No simplifica $\log e=1$ o avalua malament $e^{0}$.
            pregunta: |
              Quant val $yz$ al punt $a$? I $\log x$?
          - id: pla_a_R3
            descripcio: |
              Escriu un pla de $\mathbb{R}^3$ en lloc d'un hiperplà de $\mathbb{R}^4$.
            pregunta: |
              Quantes coordenades té un punt de la gràfica d'una funció de tres variables?

  - num: 16
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t3-16"
        apartat: null
        tipus: calcul
        enunciat: |
          Calculeu tots els punts de $\mathbb{R}^2$ on la gràfica de la funció $f(x,y)=(1-\sin x)\,y+y^3$ té pla tangent paral·lel al pla $XY$. Escriviu també l'equació d'aquests plans tangents.
        teoria: ["T3.9"]
        teoria_reservada: []
        resultat:
          valor: |
            $f$ és $\mathcal{C}^1$ a $\mathbb{R}^2$, així que té pla tangent a tot punt, i aquest és horitzontal si i només si $\nabla f=0$. Els punts són $\left(\frac{\pi}{2}+2k\pi,\ 0\right)$, $k\in\mathbb{Z}$, on $f=0$, i el pla tangent és en tots ells $z=0$ (el mateix pla $XY$).
          fuites: ['\\[dt]?frac\{?\\pi\}?\{?2\}?\s*\+\s*2\s*(k\s*\\pi|\\pi\s*k)', '\\pi\s*/\s*2\s*\+\s*2\s*(k\s*\\pi|\\pi\s*k)', '\bz\s*=\s*0\b']
        passos:
          - id: diferenciable
            titol: "Existència de pla tangent"
            objectiu: |
              Justificar que la gràfica té pla tangent a tot punt.
            idea: |
              Comprova la condició suficient de diferenciabilitat.
            detall: |
              $\frac{\partial f}{\partial x}=-y\cos x$ i $\frac{\partial f}{\partial y}=1-\sin x+3y^2$ són contínues a $\mathbb{R}^2$; $f$ és diferenciable a tot arreu i té pla tangent a cada punt.
            fuites: []
            teoria: ["T3.18", "T3.9"]
          - id: condicio
            titol: "Traduir 'paral·lel al pla XY'"
            objectiu: |
              Escriure la condició perquè el pla tangent a $(a,f(a))$ sigui paral·lel al pla $XY$.
            idea: |
              Mira l'equació del pla tangent: quan no depèn ni de $x$ ni de $y$?
            detall: |
              El pla $z=f(a)+\frac{\partial f}{\partial x}(a)(x-a_1)+\frac{\partial f}{\partial y}(a)(y-a_2)$ és horitzontal si i només si $\nabla f(a)=(0,0)$.
            fuites: []
            teoria: ["T3.9"]
          - id: resoldre
            titol: "Resoldre el sistema"
            objectiu: |
              Trobar tots els punts on s'anul·len les dues derivades parcials.
            idea: |
              Comença per l'equació que és una suma de termes de signe conegut.
            detall: |
              $1-\sin x+3y^2=0$ amb $1-\sin x\ge0$ i $3y^2\ge0$ obliga $y=0$ i $\sin x=1$, és a dir $x=\frac{\pi}{2}+2k\pi$. Llavors $-y\cos x=0$ també es compleix. Punts: $\left(\frac{\pi}{2}+2k\pi,\ 0\right)$, $k\in\mathbb{Z}$.
            fuites: ['\\[dt]?frac\{?\\pi\}?\{?2\}?\s*\+\s*2\s*(k\s*\\pi|\\pi\s*k)', '\\pi\s*/\s*2\s*\+\s*2\s*(k\s*\\pi|\\pi\s*k)', '\\sin\s*x\s*=\s*1']
            teoria: []
          - id: plans
            titol: "Equació dels plans"
            objectiu: |
              Escriure l'equació del pla tangent en aquests punts.
            idea: |
              Calcula el valor de $f$ en aquests punts.
            detall: |
              $f\left(\frac{\pi}{2}+2k\pi,0\right)=0$, així que el pla tangent és $z=0$ en tots ells.
            fuites: ['\bz\s*=\s*0\b']
            teoria: ["T3.9"]
        errors_comuns:
          - id: perd_solucions
            descripcio: |
              Només dona $x=\pi/2$ i oblida la periodicitat.
            pregunta: |
              L'equació trigonomètrica a què has arribat, quantes solucions té a tot $\mathbb{R}$, i no només a $[0,2\pi)$?
          - id: cos_zero
            descripcio: |
              De $-y\cos x=0$ afegeix punts amb $\cos x=0$ i $y\neq0$ sense comprovar l'altra equació.
            pregunta: |
              Els punts que has trobat amb la primera equació, satisfan també la segona?
          - id: confon_condicio
            descripcio: |
              Imposa $f=0$ en lloc de $\nabla f=0$.
            pregunta: |
              Què determina la inclinació del pla tangent: el valor de $f$ o les seves derivades?

  - num: 17
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t3-17"
        apartat: null
        tipus: calcul
        enunciat: |
          Estudieu la continuïtat, l'existència de les derivades direccionals i la diferenciabilitat de la funció $f(x,y)=e^{\sqrt{|xy|}}$, definida a $\mathbb{R}^2$.
        teoria: ["T2.14", "T3.1", "T3.8"]
        teoria_reservada: []
        resultat:
          valor: |
            Continuïtat: $f$ és contínua a tot $\mathbb{R}^2$.
            Derivades direccionals: als punts amb $xy\neq0$ existeixen totes ($D_uf=\langle\nabla f,u\rangle$). A $(a,0)$ amb $a\neq0$ només existeixen per a $u=(u_1,0)$ (valen $0$); a $(0,b)$ amb $b\neq0$ només per a $u=(0,u_2)$ (valen $0$); a l'origen només existeixen en les direccions dels eixos ($u_1u_2=0$), i valen $0$.
            Diferenciabilitat: $f$ és diferenciable exactament a $\{(x,y):xy\neq0\}$; no ho és a cap punt dels eixos.
          fuites: ['diferenciable exactament', 'xy\s*\\neq\s*0\s*\\\}?\s*\$?\s*(i\s+)?no ho és', 'u_1\s*u_2\s*=\s*0', 'no\s+(és\s+)?diferenciable[^.]{0,30}eixos', 'no\s+(és\s+)?diferenciable[^.]{0,30}xy\s*=\s*0']
        passos:
          - id: continuitat
            titol: "Continuïtat"
            objectiu: |
              Estudiar la continuïtat de $f$ a $\mathbb{R}^2$.
            idea: |
              Descompon $f$ com a composició de funcions contínues conegudes.
            detall: |
              $(x,y)\mapsto|xy|$ és contínua (producte i valor absolut), $\sqrt{\cdot}$ és contínua a $[0,\infty)$ i $\exp$ a $\mathbb{R}$; per composició, $f$ és contínua a tot $\mathbb{R}^2$.
            fuites: []
            teoria: ["T2.19", "T2.20"]
          - id: fora_eixos
            titol: "Fora dels eixos"
            objectiu: |
              Estudiar derivades direccionals i diferenciabilitat als punts amb $xy\neq0$.
            idea: |
              En un entorn d'un punt amb $xy\neq0$ el signe de $xy$ és constant: el valor absolut i l'arrel deixen de ser problemàtics. Aplica la condició suficient.
            detall: |
              En un entorn on $\operatorname{sgn}(xy)=s$ constant, $f=e^{\sqrt{sxy}}$ amb $sxy>0$; les parcials $\frac{\partial f}{\partial x}=e^{\sqrt{|xy|}}\frac{sy}{2\sqrt{|xy|}}$, $\frac{\partial f}{\partial y}=e^{\sqrt{|xy|}}\frac{sx}{2\sqrt{|xy|}}$ són contínues; $f$ és diferenciable i té totes les derivades direccionals, $D_uf=\langle\nabla f,u\rangle$.
            fuites: []
            teoria: ["T3.18", "T3.9"]
          - id: eixos_no_origen
            titol: "Punts dels eixos fora de l'origen"
            objectiu: |
              Estudiar les derivades direccionals a $(a,0)$ amb $a\neq0$ (i, per simetria, a $(0,b)$ amb $b\neq0$).
            idea: |
              Aplica la definició de derivada direccional i separa la direcció de l'eix de la resta; compara el creixement de $\sqrt{|t|}$ amb $t$.
            detall: |
              $\frac{f(a+tu_1,tu_2)-1}{t}=\frac{e^{\sqrt{|a+tu_1||u_2|}\sqrt{|t|}}-1}{t}\sim\frac{\sqrt{|a||u_2|}\sqrt{|t|}}{t}$, que no té límit finit si $u_2\neq0$. Si $u_2=0$, $f\equiv1$ sobre l'eix i $D_uf(a,0)=0$. Igualment a $(0,b)$: només existeix per a $u_1=0$, i val $0$.
            fuites: ['\\sqrt\{\|t\|\}\s*\}?\s*\{?t\}?', '\\[dt]?frac\{1\}\{\\sqrt\{\|t\|\}\}', '\|t\|\^\{?\s*-\s*1/2']
            teoria: ["T3.1"]
          - id: origen
            titol: "L'origen"
            objectiu: |
              Estudiar les derivades direccionals a $(0,0)$.
            idea: |
              Aplica la definició; calcula $f(tu)$ explícitament i mira els límits laterals.
            detall: |
              $f(tu_1,tu_2)=e^{|t|\sqrt{|u_1u_2|}}$, i $\frac{e^{c|t|}-1}{t}$ amb $c=\sqrt{|u_1u_2|}$ té límit $c$ per $t\to0^+$ i $-c$ per $t\to0^-$. Existeix només si $c=0$, és a dir $u_1u_2=0$ (direccions dels eixos), i llavors val $0$.
            fuites: ['e\^\{\s*c\s*\|t\|\s*\}', 'u_1\s*u_2\s*=\s*0']
            teoria: ["T3.1"]
          - id: diferenciabilitat_eixos
            titol: "No diferenciabilitat als eixos"
            objectiu: |
              Decidir si $f$ és diferenciable als punts dels eixos.
            idea: |
              Recorda què implica la diferenciabilitat sobre les derivades direccionals.
            detall: |
              Si $f$ fos diferenciable en un punt dels eixos, hi existirien totes les derivades direccionals; com que no és així, $f$ no és diferenciable a cap punt amb $xy=0$.
            fuites: []
            teoria: ["T3.9"]
        errors_comuns:
          - id: parcials_suficients
            descripcio: |
              Als eixos troba que les parcials existeixen (o que una existeix) i conclou que és diferenciable.
            pregunta: |
              L'existència de derivades parcials, garanteix la diferenciabilitat? Quines altres direccions has mirat?
          - id: limits_laterals
            descripcio: |
              A l'origen calcula només el límit per $t\to0^+$ i conclou que la derivada direccional val $\sqrt{|u_1u_2|}$.
            pregunta: |
              La definició de derivada direccional demana $t\to0$ per tots dos costats. Què passa amb $|t|/t$?
          - id: oblida_eixos
            descripcio: |
              Estudia només l'origen i oblida la resta de punts dels eixos.
            pregunta: |
              A quins punts deixa de ser derivable l'expressió $\sqrt{|xy|}$? Només a l'origen?
          - id: discontinua
            descripcio: |
              Creu que $f$ no és contínua als eixos perquè no hi és diferenciable.
            pregunta: |
              Per veure la continuïtat, necessites derivar? Quines funcions componen $f$?

  - num: 18
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t3-18"
        apartat: null
        tipus: teoric
        enunciat: |
          Considerem el conjunt $A=\{(x,y)\in\mathbb{R}^2\mid0<y<x^2\}$ i la funció
          $$f(x,y)=\begin{cases}0 & \text{si } (x,y)\in A\\ 1 & \text{altrament.}\end{cases}$$
          Proveu que existeixen i tenen el mateix valor totes les derivades direccionals a l'origen, però la funció no hi és diferenciable.
        teoria: ["T3.1", "T3.8"]
        teoria_reservada: ["T3.6"]
        resultat:
          valor: |
            Totes les derivades direccionals a l'origen valen $0$, perquè cada recta per l'origen evita $A$ prop de $0$ i $f\equiv1$ allà. Però $f$ no és diferenciable a l'origen: sobre un camí dins de $A$ (p. ex. $y=x^2/2$) el quocient de diferenciabilitat no tendeix a $0$ (de fet, $f$ ni tan sols és contínua a l'origen).
          fuites: []
        passos:
          - id: rectes_fora
            titol: "Les rectes eviten $A$ prop de l'origen"
            objectiu: |
              Entendre com és $f$ sobre cada recta per l'origen, a prop de l'origen.
            idea: |
              Mira quan un punt $(tu_1,tu_2)$ pot pertànyer a $A$ i què passa quan $t$ és petit.
            detall: |
              Si $u_2=0$, $y=0\notin(0,x^2)$. Si $u_1=0$, caldria $0<tu_2<0$, impossible. Si $u_1,u_2\neq0$, caldria $0<tu_2<t^2u_1^2$, que implica $|u_2|<|t|u_1^2$, fals per a $|t|<|u_2|/u_1^2$. Per tant $f(tu)=1$ prop de $t=0$.
            fuites: ['\|u_2\|\s*<\s*\|t\|']
            teoria: []
          - id: calcular_direccionals
            titol: "Calcular les direccionals"
            objectiu: |
              Calcular $D_uf(0,0)$ amb la definició.
            idea: |
              Recorda quant val $f$ a l'origen i sobre la recta, prop de l'origen.
            detall: |
              $(0,0)\notin A$, així que $f(0,0)=1$, i $D_uf(0,0)=\lim_{t\to0}\frac{1-1}{t}=0$ per a tota $u\neq0$.
            fuites: ['\\frac\{1\s*-\s*1\}\{t\}']
            teoria: ["T3.1"]
          - id: candidat_diferencial
            titol: "Quina hauria de ser la diferencial"
            objectiu: |
              Veure quina aplicació lineal seria la diferencial si existís.
            idea: |
              Si $f$ fos diferenciable, la diferencial determinaria totes les derivades direccionals.
            detall: |
              Si fos diferenciable, $D_uf(0,0)=\langle\nabla f(0,0),u\rangle=0$ per a tota $u$, per tant $Df(0,0)=0$ i caldria $\frac{f(x,y)-1}{\|(x,y)\|}\to0$.
            fuites: ['\\frac\{f\(x,\s*y\)\s*-\s*1\}']
            teoria: ["T3.9"]
          - id: cami_dins_A
            titol: "Un camí dins de $A$"
            objectiu: |
              Comprovar que el quocient de diferenciabilitat no tendeix a $0$.
            idea: |
              Tria un camí cap a l'origen que quedi sempre dins de $A$.
            detall: |
              Sobre $y=x^2/2$, $x\neq0$ (dins de $A$, ja que $0<x^2/2<x^2$): $\frac{|0-1|}{\|(x,x^2/2)\|}\to+\infty$, no tendeix a $0$. No és diferenciable. (Alternativament: sobre aquest camí $f\to0\neq1=f(0,0)$, no és contínua, i diferenciable implica contínua.)
            fuites: ['y\s*=\s*x\^\{?2\}?\s*/\s*[2-9]', 'y\s*=\s*\\[dt]?frac\{\s*x\^\{?2\}?\s*\}\{\s*[2-9]\s*\}', 'y\s*=\s*\\[dt]?frac\{?1\}?\{?[2-9]\}?\s*x\^\{?2']
            teoria: ["T3.8", "T2.10", "T3.14"]
        errors_comuns:
          - id: direccionals_implica_diferenciable
            descripcio: |
              Creu que si totes les derivades direccionals existeixen (i coincideixen) la funció és diferenciable.
            pregunta: |
              Les derivades direccionals només miren rectes. La diferenciabilitat mira totes les maneres d'acostar-se; hi ha camins que no siguin rectes?
          - id: f_origen_zero
            descripcio: |
              Suposa que $f(0,0)=0$.
            pregunta: |
              L'origen pertany a $A$? Quant val, doncs, $f(0,0)$?
          - id: nomes_t_positiu
            descripcio: |
              En estudiar les rectes, només considera $t>0$ o no justifica que la recta surt de $A$ per a $t$ petit.
            pregunta: |
              La condició per ser a $A$, es compleix per a algun $t$ petit, positiu o negatiu?
          - id: rectes_per_diferenciabilitat
            descripcio: |
              Intenta refutar la diferenciabilitat només amb rectes.
            pregunta: |
              Sobre les rectes tot funciona bé. On s'amaga el problema?
        nota_professor: |
          És la funció de l'Observació 6(a) dels apunts (i del problema 6 del tema 2). Fitxa portada de l'antiga t3-18.

  - num: 19
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t3-19"
        apartat: null
        tipus: calcul
        enunciat: |
          Considerem $g(x,y)=f(x,y)+x+2y$, on $f(x,y)$ és la funció de l'exercici anterior. Calculeu les derivades parcials de $g(x,y)$ a l'origen. Comproveu que, usant la matriu de les derivades parcials, no se satisfà la condició de diferenciabilitat a l'origen. És $z=x+2y+1$ el pla tangent a la gràfica de la funció $g(x,y)$?
        teoria: ["T3.2", "T3.8", "T3.9"]
        teoria_reservada: ["T3.6"]
        resultat:
          valor: |
            $\frac{\partial g}{\partial x}(0,0)=1$, $\frac{\partial g}{\partial y}(0,0)=2$ ($g(0,0)=1$). Amb la matriu $(1\ \ 2)$, el quocient $\frac{|g(x,y)-1-x-2y|}{\|(x,y)\|}=\frac{|f(x,y)-1|}{\|(x,y)\|}$ val $\frac{1}{\|(x,y)\|}\to\infty$ sobre punts de $A$ (p. ex. $y=x^2/2$), així que no tendeix a $0$: $g$ no és diferenciable a l'origen. Per tant, $z=x+2y+1$ no és el pla tangent: la gràfica no en té (tot i que aquest pla conté les rectes tangents en totes les direccions, ja que $D_ug(0,0)=u_1+2u_2$).
          fuites: ['no (és|es) el pla tangent', '\bno\s+t[ée]\s+pla tangent']
        passos:
          - id: parcials
            titol: "Derivades parcials a l'origen"
            objectiu: |
              Calcular $\frac{\partial g}{\partial x}(0,0)$ i $\frac{\partial g}{\partial y}(0,0)$.
            idea: |
              Aplica la definició de derivada parcial; recorda quant val $f$ sobre els eixos prop de l'origen.
            detall: |
              Sobre els eixos $f=1$ (no són a $A$), i $g(0,0)=1$. $\frac{\partial g}{\partial x}(0,0)=\lim_{t\to0}\frac{1+t-1}{t}=1$, $\frac{\partial g}{\partial y}(0,0)=\lim_{t\to0}\frac{1+2t-1}{t}=2$.
            fuites: ['\\frac\{1\s*\+\s*2t\s*-\s*1\}\{t\}', '\\partial\s*g\s*\}\s*\{\s*\\partial\s*[xy]\s*\}\s*\(\s*0\s*,\s*0\s*\)\s*=\s*[12]\b', 'g_[xy]\s*\(\s*0\s*,\s*0\s*\)\s*=\s*[12]\b']
            teoria: ["T3.2"]
          - id: quocient
            titol: "Plantejar la condició de diferenciabilitat"
            objectiu: |
              Escriure el quocient de la definició de diferenciabilitat amb la matriu de les parcials i simplificar-lo.
            idea: |
              L'única candidata a diferencial és la de matriu $(1\ \ 2)$; substitueix $g=f+x+2y$ al numerador.
            detall: |
              $\frac{|g(x,y)-g(0,0)-x-2y|}{\|(x,y)\|}=\frac{|f(x,y)-1|}{\|(x,y)\|}$.
            fuites: ['\\frac\{\|f\(x,\s*y\)\s*-\s*1\|\}']
            teoria: ["T3.8", "T3.9"]
          - id: no_diferenciable
            titol: "El quocient no tendeix a 0"
            objectiu: |
              Comprovar que aquest quocient no tendeix a $0$.
            idea: |
              Acosta't a l'origen per un camí que quedi dins de $A$.
            detall: |
              Sobre $y=x^2/2$ ($x\neq0$), que és dins de $A$: el quocient val $\frac{1}{\|(x,x^2/2)\|}\to+\infty$. No tendeix a $0$; $g$ no és diferenciable a l'origen.
            fuites: ['y\s*=\s*x\^\{?2\}?\s*/\s*[2-9]', 'y\s*=\s*\\[dt]?frac\{\s*x\^\{?2\}?\s*\}\{\s*[2-9]\s*\}', 'y\s*=\s*\\[dt]?frac\{?1\}?\{?[2-9]\}?\s*x\^\{?2']
            teoria: ["T3.8", "T2.10"]
          - id: pla_tangent
            titol: "És el pla tangent?"
            objectiu: |
              Decidir si $z=x+2y+1$ és el pla tangent a la gràfica de $g$ a l'origen.
            idea: |
              Recorda per a quines funcions està definit el pla tangent a la gràfica. Què fa aquest pla amb les derivades direccionals?
            detall: |
              El pla tangent només existeix si $g$ és diferenciable al punt, i no ho és: $z=x+2y+1$ no és el pla tangent. És el pla que formaria la candidata ($g(0,0)+Jg$), i conté les rectes tangents a les seccions per totes les rectes ($D_ug(0,0)=u_1+2u_2$), però no aproxima la gràfica (que ni tan sols és contínua a l'origen).
            fuites: ['no (és|es) el pla tangent']
            teoria: ["T3.9", "T3.14"]
        errors_comuns:
          - id: parcials_implica_pla
            descripcio: |
              Creu que si existeixen les parcials ja hi ha pla tangent.
            pregunta: |
              A partir de quina propietat de $g$ es defineix el pla tangent a la gràfica?
          - id: g_origen
            descripcio: |
              Pren $g(0,0)=0$.
            pregunta: |
              Quant val $f(0,0)$? I, per tant, $g(0,0)$?
          - id: rectes_per_diferenciabilitat
            descripcio: |
              Estudia el quocient de diferenciabilitat només sobre rectes i conclou que tendeix a $0$.
            pregunta: |
              Les rectes per l'origen entren mai a $A$ prop de l'origen? Quins camins sí que hi entren?
        nota_professor: |
          Depèn de l'exercici 18 (mateixa $f$; vegeu l'Observació 6(a) dels apunts). Les direccionals de $g$ a l'origen són $u_1+2u_2=\langle(1,2),u\rangle$: lineals en $u$, i tot i així $g$ no és diferenciable.

  - num: 20
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t3-20"
        apartat: null
        tipus: calcul
        enunciat: |
          Calculeu les derivades parcials de la funció $f(x,y,z)=g(u(x,y,z),v(x,y,z))$, on $g(u,v)=uv^2+\sin(uv)$, $u(x,y,z)=xe^y$ i $v(x,y,z)=xy-z$.
        teoria: ["T3.2"]
        teoria_reservada: []
        resultat:
          valor: |
            Amb $u=xe^y$, $v=xy-z$, $g_u=v^2+v\cos(uv)$, $g_v=2uv+u\cos(uv)$:
            $\frac{\partial f}{\partial x}=\big(v^2+v\cos(uv)\big)e^y+\big(2uv+u\cos(uv)\big)y$,
            $\frac{\partial f}{\partial y}=\big(v^2+v\cos(uv)\big)xe^y+\big(2uv+u\cos(uv)\big)x$,
            $\frac{\partial f}{\partial z}=-\big(2uv+u\cos(uv)\big)$.
          fuites: ['-\s*\\big\(\s*2uv\s*\+\s*u\s*\\cos', '\\partial\s*z\}\s*=\s*-\s*\(?\s*2uv', 'v\s*\\cos\s*\(uv\)\s*(\\big)?\)\s*(\\,)?\s*x?\s*e\^\{?y']
        passos:
          - id: diferenciabilitat
            titol: "Justificar la regla de la cadena"
            objectiu: |
              Comprovar que es pot aplicar la regla de la cadena.
            idea: |
              Mira si les funcions interior i exterior són diferenciables.
            detall: |
              $g$, $u$ i $v$ tenen parcials contínues a tot l'espai, per tant són diferenciables, i $f=g\circ(u,v)$ també ho és.
            fuites: []
            teoria: ["T3.18", "T3.21"]
          - id: parcials_g
            titol: "Parcials de la funció exterior"
            objectiu: |
              Calcular $\frac{\partial g}{\partial u}$ i $\frac{\partial g}{\partial v}$.
            idea: |
              Deriva $g$ tractant l'altra variable com a constant.
            detall: |
              $\frac{\partial g}{\partial u}=v^2+v\cos(uv)$, $\frac{\partial g}{\partial v}=2uv+u\cos(uv)$.
            fuites: ['v\^\{?2\}?\s*\+\s*v\s*\\cos\s*\(uv\)', '2uv\s*\+\s*u\s*\\cos']
            teoria: []
          - id: parcials_interiors
            titol: "Parcials de les funcions interiors"
            objectiu: |
              Calcular les parcials de $u$ i $v$ respecte de $x$, $y$, $z$.
            idea: |
              Són derivades directes.
            detall: |
              $u_x=e^y$, $u_y=xe^y$, $u_z=0$; $v_x=y$, $v_y=x$, $v_z=-1$.
            fuites: []
            teoria: []
          - id: cadena
            titol: "Aplicar la regla de la cadena"
            objectiu: |
              Combinar-ho tot per obtenir les tres parcials de $f$.
            idea: |
              Cada parcial de $f$ és una suma sobre les variables intermèdies (producte de la jacobiana de $g$ per la de $(u,v)$).
            detall: |
              $\frac{\partial f}{\partial x}=g_ue^y+g_vy$, $\frac{\partial f}{\partial y}=g_uxe^y+g_vx$, $\frac{\partial f}{\partial z}=-g_v$, amb $g_u=v^2+v\cos(uv)$, $g_v=2uv+u\cos(uv)$ avaluades a $u=xe^y$, $v=xy-z$.
            fuites: ['=\s*-\s*g_v', 'g_u\s*e\^\{?y\}?\s*\+\s*g_v\s*y']
            teoria: ["T3.21", "T3.22"]
        errors_comuns:
          - id: oblida_terme
            descripcio: |
              Oblida un dels termes de la suma (p. ex. només deriva a través de $u$).
            pregunta: |
              Si canvies $x$, quines de les variables intermèdies $u$, $v$ canvien?
          - id: no_avalua
            descripcio: |
              Deixa les parcials de $g$ sense avaluar a $(u(x,y,z),v(x,y,z))$ o les avalua al punt $(x,y)$.
            pregunta: |
              En quin punt cal avaluar les parcials de $g$?
          - id: signe_z
            descripcio: |
              Oblida el signe de $v_z=-1$.
            pregunta: |
              Quant val la derivada de $xy-z$ respecte de $z$?
        nota_professor: |
          Resultat verificat derivant directament $f=xe^y(xy-z)^2+\sin\big(xe^y(xy-z)\big)$.

  - num: 21
    font: null
    preambul: |
      Calculeu les derivades parcials $D_1F$, $D_2F$ de les funcions compostes següents:
    indicacio: null
    exercicis:
      - id: "t3-21a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          $F=f\circ g$, amb $f(x,y,z)=x^2y+y^2z-xyz$, $g(u,v)=(u+v,u-v,u)$.
        teoria: ["T3.2"]
        teoria_reservada: []
        resultat:
          valor: |
            $D_1F(u,v)=3u^2-2uv+v^2$, $D_2F(u,v)=-u^2+2uv-3v^2$ (de fet $F(u,v)=u^3-u^2v+uv^2-v^3$).
          fuites: ['3u\^\{?2\}?\s*-\s*2uv\s*\+\s*v\^\{?2\}?', '-\s*u\^\{?2\}?\s*\+\s*2uv\s*-\s*3v\^\{?2\}?', 'u\^\{?3\}?\s*-\s*u\^\{?2\}?\s*v\s*\+\s*uv\^\{?2\}?\s*-\s*v\^\{?3\}?']
        passos:
          - id: jacobianes
            titol: "Jacobianes de f i g"
            objectiu: |
              Calcular $\nabla f(x,y,z)$ i $Jg(u,v)$.
            idea: |
              Derivades parcials directes de cada funció.
            detall: |
              $\nabla f=(2xy-yz,\ x^2+2yz-xz,\ y^2-xy)$, $Jg=\begin{pmatrix}1&1\\1&-1\\1&0\end{pmatrix}$.
            fuites: []
            teoria: ["T3.10"]
          - id: cadena
            titol: "Aplicar la regla de la cadena"
            objectiu: |
              Expressar $D_1F$ i $D_2F$ en termes de les parcials de $f$.
            idea: |
              Multiplica la jacobiana de $f$ (avaluada a $g(u,v)$) per la de $g$.
            detall: |
              $f$ i $g$ són polinòmiques (parcials contínues), per tant diferenciables, i es pot aplicar la regla de la cadena: $JF(u,v)=Jf(g(u,v))\,Jg(u,v)$, és a dir $D_1F=(f_x+f_y+f_z)\big|_{g(u,v)}$, $D_2F=(f_x-f_y)\big|_{g(u,v)}$.
            fuites: ['f_x\s*\+\s*f_y\s*\+\s*f_z', 'f_x\s*-\s*f_y']
            teoria: ["T3.18", "T3.21", "T3.22"]
          - id: substituir
            titol: "Substituir i simplificar"
            objectiu: |
              Obtenir $D_1F$ i $D_2F$ com a funcions de $(u,v)$.
            idea: |
              Substitueix $x=u+v$, $y=u-v$, $z=u$ i simplifica.
            detall: |
              $f_x=(u-v)(u+2v)$, $f_y=2u^2-uv+v^2$, $f_z=-2v(u-v)$ a $g(u,v)$. Llavors $D_1F=3u^2-2uv+v^2$, $D_2F=-u^2+2uv-3v^2$.
            fuites: ['3u\^\{?2\}?\s*-\s*2uv', '-\s*u\^\{?2\}?\s*\+\s*2uv\s*-\s*3v']
            teoria: []
        errors_comuns:
          - id: avalua_malament
            descripcio: |
              Avalua les parcials de $f$ a $(u,v)$ en lloc de $g(u,v)$.
            pregunta: |
              Les parcials de $f$ són funcions de $(x,y,z)$; quins valors prenen $x,y,z$ quan componem amb $g$?
          - id: ordre_matrius
            descripcio: |
              Multiplica les jacobianes en l'ordre equivocat.
            pregunta: |
              Quines dimensions tenen les dues jacobianes? En quin ordre es poden multiplicar?
          - id: tercera_component
            descripcio: |
              Oblida la contribució de la tercera component $z=u$ en $D_1F$.
            pregunta: |
              De quines de les variables $u,v$ depèn la tercera component de $g$?
        nota_professor: |
          Comprovació: substituint directament, $F(u,v)=u^3-u^2v+uv^2-v^3$.

      - id: "t3-21b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          $F=f\circ g$, amb $f(x,y)=\dfrac{x+y}{1-xy}$, $g(u,v)=(\tan u,\tan v)$.
        teoria: ["T3.2"]
        teoria_reservada: []
        resultat:
          valor: |
            On està definida ($\cos u\neq0$, $\cos v\neq0$ i $\tan u\tan v\neq1$; amb les dues primeres, la tercera equival a $\cos(u+v)\neq0$):
            $D_1F(u,v)=\frac{(1+\tan^2u)(1+\tan^2v)}{(1-\tan u\tan v)^2}=\frac{1}{\cos^2(u+v)}$, i $D_2F(u,v)=\frac{1}{\cos^2(u+v)}$ igualment. (De fet $F(u,v)=\tan(u+v)$.)
          fuites: ['\\cos\^\{?2\}?\s*\(u\s*\+\s*v\)', '\\tan\s*\(u\s*\+\s*v\)', '\\sec\^\{?2\}?\s*\(u\s*\+\s*v\)', '1\s*\+\s*\\tan\^\{?2\}?\s*\(u\s*\+\s*v\)']
        passos:
          - id: domini
            titol: "Domini i diferenciabilitat"
            objectiu: |
              Determinar on està definida $F$ i on es pot aplicar la regla de la cadena.
            idea: |
              Cal que $g$ estigui definida i que el seu valor caigui on $f$ és diferenciable.
            detall: |
              $g$ és $\mathcal{C}^1$ on $\cos u\neq0\neq\cos v$; $f$ és $\mathcal{C}^1$ a l'obert $xy\neq1$. Així $F$ està definida i és diferenciable (regla de la cadena) on $\cos u\neq0$, $\cos v\neq0$ i $\tan u\tan v\neq1$.
            fuites: []
            teoria: ["T3.18", "T3.21"]
          - id: parcials_f
            titol: "Parcials de f"
            objectiu: |
              Calcular $\frac{\partial f}{\partial x}$ i $\frac{\partial f}{\partial y}$.
            idea: |
              Regla del quocient, i simplifica el numerador.
            detall: |
              $\frac{\partial f}{\partial x}=\frac{(1-xy)+(x+y)y}{(1-xy)^2}=\frac{1+y^2}{(1-xy)^2}$, i per simetria $\frac{\partial f}{\partial y}=\frac{1+x^2}{(1-xy)^2}$.
            fuites: ['\\frac\{1\s*\+\s*y\^\{?2\}?\}\{\(1\s*-\s*xy\)\^\{?2\}?\}']
            teoria: []
          - id: cadena
            titol: "Regla de la cadena"
            objectiu: |
              Obtenir $D_1F$ i $D_2F$.
            idea: |
              $g$ té cada component dependent d'una sola variable; la jacobiana de $g$ és diagonal.
            detall: |
              $D_1F=\frac{\partial f}{\partial x}(g)\cdot(1+\tan^2u)=\frac{(1+\tan^2v)(1+\tan^2u)}{(1-\tan u\tan v)^2}$, i $D_2F=\frac{(1+\tan^2u)(1+\tan^2v)}{(1-\tan u\tan v)^2}$.
            fuites: ['\\frac\{\(1\s*\+\s*\\tan\^\{?2\}?\s*[uv]\)\s*\(1\s*\+\s*\\tan\^\{?2\}?\s*[uv]\)\}']
            teoria: ["T3.21", "T3.22"]
          - id: simplificar
            titol: "Simplificar"
            objectiu: |
              Simplificar l'expressió obtinguda.
            idea: |
              Passa a sinus i cosinus i reconeix una fórmula d'addició.
            detall: |
              $\frac{1}{\cos^2u\cos^2v(1-\tan u\tan v)^2}=\frac{1}{(\cos u\cos v-\sin u\sin v)^2}=\frac{1}{\cos^2(u+v)}$. Ambdues parcials valen el mateix (coherent amb $F=\tan(u+v)$).
            fuites: ['\\cos\^\{?2\}?\s*\(u\s*\+\s*v\)']
            teoria: []
        errors_comuns:
          - id: quocient_malament
            descripcio: |
              Errors de signe en la regla del quocient (el denominador $1-xy$ té derivada $-y$).
            pregunta: |
              Quina és la derivada de $1-xy$ respecte de $x$? Quin signe té en el numerador?
          - id: oblida_derivada_tan
            descripcio: |
              Oblida multiplicar per la derivada de $\tan u$.
            pregunta: |
              Quan $u$ canvia, quant canvia $x=\tan u$?
          - id: domini
            descripcio: |
              No esmenta on és vàlida la fórmula.
            pregunta: |
              Per a quins $(u,v)$ està definida $F$?
        nota_professor: |
          $F(u,v)=\tan(u+v)$ per la fórmula d'addició de la tangent; derivar directament dona el mateix resultat.
