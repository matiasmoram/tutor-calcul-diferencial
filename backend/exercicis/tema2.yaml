    - id: estructura
      titol: Observar la dependència
      objectiu: |
        Entendre quina forma han de tenir els conjunts de nivell abans de calcular-los.
      idea: |
        Mira de quines variables depèn realment $f$; si un punt és al conjunt de nivell, què passa si en canvies la $x$?
      detall: |
        $f$ no depèn de $x$: si $(x_0,y_0)\in C_k$, tota la recta horitzontal $y=y_0$ hi és. Els conjunts de nivell són unions de rectes horitzontals.
      fuites:
      - rectes?\s+horitzontal
      teoria:
      - T2.4
    - id: casos
      titol: Resoldre $|y|=k$
      objectiu: |
        Determinar $C_k$ per a cada $k$.
      idea: |
        Resol l'equació amb valor absolut distingint el signe de $k$.
      detall: |
        $|y|=k$: sense solució si $k<0$ ($C_k=\varnothing$); $y=0$ si $k=0$ ($C_0$ és l'eix $x$); $y=\pm k$ si $k>0$ (dues rectes horitzontals simètriques respecte de l'eix $x$).
      fuites:
      - y\s*=\s*\\pm\s*k
      teoria: []
    errors_comuns:
    - id: punts_no_rectes
      descripcio: |
        Respon "$y=\pm k$" pensant en dos punts (o en nombres reals) en lloc de dues rectes del pla.
      pregunta: |
        El conjunt de nivell és un subconjunt de $\mathbb{R}$ o de $\mathbb{R}^2$? Quins valors pot prendre $x$?
    - id: k_negatiu
      descripcio: |
        Dona les rectes $y=\pm k$ també per a $k<0$.
      pregunta: |
        Pot $|y|$ valer un nombre negatiu?
  - id: t2-2g
    apartat: g
    tipus: calcul
    enunciat: |
      $f(x,y)=\max(|x|,|y|)$.
    teoria:
    - T2.4
    teoria_reservada: []
    resultat:
      valor: |
        $C_k(f)=\varnothing$ si $k<0$; $C_0(f)=\{(0,0)\}$; per a $k>0$, $C_k(f)$ és la vora del quadrat $[-k,k]^2$, de vèrtexs $(\pm k,\pm k)$ i costats paral·lels als eixos (la circumferència de radi $k$ de la norma del màxim).
      fuites:
      - quadrat
    passos:
    - id: casos_trivials
      titol: Casos $k\le 0$
      objectiu: |
        Determinar $C_k$ quan $k\le0$.
      idea: |
        Mira el signe de $f$ i quan pot valer exactament $0$.
      detall: |
        $f\ge0$, de manera que $C_k=\varnothing$ per a $k<0$; i $\max(|x|,|y|)=0\iff x=y=0$, és a dir $C_0=\{(0,0)\}$.
      fuites: []
      teoria:
      - T2.4
    - id: cas_positiu
      titol: Cas $k>0$
      objectiu: |
        Identificar $C_k$ quan $k>0$.
      idea: |
        Tradueix "el màxim val $k$" en condicions sobre $|x|$ i $|y|$: tots dos com a molt $k$, i algun exactament $k$. Reconeix $f$ com una de les normes de $\mathbb{R}^2$.
      detall: |
        $\max(|x|,|y|)=k\iff |x|\le k,\ |y|\le k$ i ($|x|=k$ o $|y|=k$). És la vora del quadrat $[-k,k]^2$: els segments $x=\pm k$, $|y|\le k$ i $y=\pm k$, $|x|\le k$, amb vèrtexs $(\pm k,\pm k)$. És la "circumferència" de radi $k$ de la norma del màxim $\|\cdot\|_\infty$.
      fuites:
      - quadrat
      - \[\s*-\s*k\s*,\s*k\s*\]\^\{?2
      teoria:
      - T2.34
    errors_comuns:
    - id: quadrat_ple
      descripcio: |
        Dona la regió sencera $\{|x|\le k,|y|\le k\}$ en lloc de només la seva vora.
      pregunta: |
        En el punt $(0,0)$, quant val $f$? Pertany al conjunt de nivell $k>0$?
    - id: nomes_rectes
      descripcio: |
        Dona les rectes completes $x=\pm k$ i $y=\pm k$, sense limitar-les.
      pregunta: |
        El punt $(k,2k)$ compleix $|x|=k$; quant val $f$ en aquest punt?
  - id: t2-2h
    apartat: h
    tipus: calcul
    enunciat: |
      $f(x,y)=1-|x|-|y|$.
    teoria:
    - T2.4
    teoria_reservada: []
    resultat:
      valor: |
        $C_k(f)=\{|x|+|y|=1-k\}$: buit si $k>1$; $C_1(f)=\{(0,0)\}$; per a $k<1$, el quadrat girat $45^\circ$ (rombe) de vèrtexs $(\pm(1-k),0)$ i $(0,\pm(1-k))$, és a dir, la circumferència de radi $1-k$ de la norma $\|\cdot\|_1$.
      fuites:
      - rombe
      - quadrat\s+(girat|rotat)
      - \(\s*\\pm\s*\(\s*1\s*-\s*k\s*\)\s*,\s*0\s*\)
    passos:
    - id: equacio
      titol: Escriure el conjunt de nivell
      objectiu: |
        Escriure l'equació de $C_k$ i trobar els valors de $k$ per als quals és buit o degenerat.
      idea: |
        Aïlla els valors absoluts i mira el signe del que queda a l'altre costat.
      detall: |
        $1-|x|-|y|=k\iff|x|+|y|=1-k$. Si $k>1$ el membre dret és negatiu: $C_k=\varnothing$. Si $k=1$: $|x|+|y|=0$, $C_1=\{(0,0)\}$.
      fuites:
      - \|x\|\s*\+\s*\|y\|\s*=\s*1\s*-\s*k
      teoria:
      - T2.4
    - id: cas_general
      titol: Cas $k<1$
      objectiu: |
        Identificar $C_k$ quan $k<1$.
      idea: |
        Escriu $c=1-k>0$ i resol l'equació en cada quadrant, on els valors absoluts es poden treure amb un signe fix. Reconeix l'expressió com una de les normes de $\mathbb{R}^2$.
      detall: |
        Amb $c=1-k>0$: al primer quadrant, $x+y=c$ (segment de $(c,0)$ a $(0,c)$); anàlogament als altres quadrants ($-x+y=c$, $-x-y=c$, $x-y=c$). La unió és un quadrat girat $45^\circ$ (rombe) de vèrtexs $(\pm c,0)$ i $(0,\pm c)$: la "circumferència" de radi $c$ de la norma $\|\cdot\|_1$. Els nivells són rombes concèntrics que s'encongeixen fins a l'origen quan $k\to1$.
      fuites:
      - rombe
      - quadrat\s+girat
      - \(\s*\\pm\s*c\s*,\s*0\s*\)
      teoria:
      - T2.34
    errors_comuns:
    - id: un_sol_quadrant
      descripcio: |
        Només resol $x+y=1-k$ (un segment) i oblida els altres quadrants.
      pregunta: |
        Si $(x,y)$ és al conjunt, hi són també $(-x,y)$ i $(x,-y)$?
    - id: k_gran
      descripcio: |
        Dona corbes de nivell per a $k>1$.
      pregunta: |
        Quin és el valor màxim que pot prendre $f$?
    nota_professor: |
      És la mateixa funció que al problema 1(e); la imatge $(-\infty,1]$ explica per què els nivells $k>1$ són buits.
  - id: t2-2i
    apartat: i
    tipus: calcul
    enunciat: |
      $$f(x,y)=\begin{cases}\dfrac{x}{x+y^2} & \text{si } x\neq-y^2\\ 0 & \text{si } x=-y^2.\end{cases}$$
    teoria:
    - T2.4
    teoria_reservada: []
    resultat:
      valor: |
        $C_0(f)=\{x=0\}\cup\{x=-y^2\}$ (l'eix $y$ i la paràbola $x=-y^2$, on $f$ val $0$ per definició).
        $C_1(f)=\{(x,0)\mid x\neq0\}$ (l'eix $x$ sense l'origen).
        Per a $k\neq0,1$: $C_k(f)=\{x=\frac{k}{1-k}y^2\}\setminus\{(0,0)\}$, una paràbola de vèrtex l'origen i eix l'eix $x$, sense el vèrtex; s'obre cap a $x>0$ si $0<k<1$ i cap a $x<0$ si $k<0$ o $k>1$. Hi apareixen totes les paràboles $x=cy^2$ amb $c\neq0,-1$ (sense el vèrtex); la de $c=-1$ forma part de $C_0(f)$.
      fuites:
      - \\[dt]?frac\s*\{\s*k\s*\}\s*\{\s*1\s*-\s*k\s*\}
      - k\s*/\s*\(\s*1\s*-\s*k\s*\)
    passos:
    - id: equacio
      titol: Equació fora de la paràbola
      objectiu: |
        Escriure la condició $f(x,y)=k$ per als punts on $f$ ve donada pel quocient.
      idea: |
        Fora del conjunt on s'anul·la el denominador, pots multiplicar per ell; agrupa després els termes en $x$.
      detall: |
        Si $x\neq-y^2$: $\frac{x}{x+y^2}=k\iff x=k(x+y^2)\iff x(1-k)=ky^2$.
      fuites:
      - x\s*\(\s*1\s*-\s*k\s*\)\s*=\s*k\s*y\^\{?2
      teoria:
      - T2.4
    - id: k_u
      titol: Cas $k=1$
      objectiu: |
        Determinar $C_1$.
      idea: |
        Substitueix $k=1$ a l'equació obtinguda i recorda la condició d'estar fora del conjunt on el denominador s'anul·la.
      detall: |
        Si $k=1$: $0=y^2$, és a dir $y=0$, i cal $x\neq-0^2=0$. Així $C_1$ és l'eix d'abscisses sense l'origen (i, en efecte, $f(x,0)=x/x=1$). Cap punt de la paràbola $x=-y^2$ hi és, perquè allà $f=0$.
      fuites:
      - eix\s+d.abscisses\s+sense
      teoria: []
    - id: k_zero
      titol: Cas $k=0$
      objectiu: |
        Determinar $C_0$, tenint en compte tots els punts on $f$ val $0$.
      idea: |
        Hi ha dues fonts de zeros: els del quocient i els punts on $f$ està definida directament.
      detall: |
        Fora de la paràbola, $k=0$ dona $x=0$ amb $y\neq0$ (l'eix $y$ sense l'origen). Sobre la paràbola $x=-y^2$, $f=0$ per definició. Per tant $C_0=\{x=0\}\cup\{x=-y^2\}$ (l'origen hi és, perquè és de la paràbola).
      fuites:
      - \\cup\s*\\\{\s*x\s*=\s*-\s*y\^\{?2
      teoria: []
    - id: k_general
      titol: Cas $k\neq 0,1$
      objectiu: |
        Determinar $C_k$ per a la resta de valors de $k$.
      idea: |
        Aïlla $x$ en funció de $y^2$ i reconeix la corba. Comprova si talla el conjunt on $f$ es defineix a part.
      detall: |
        $x=\frac{k}{1-k}y^2$: paràbola de vèrtex l'origen i eix l'eix $x$. Com que $c=\frac{k}{1-k}\neq-1$ per a tot $k$, aquesta paràbola només talla $x=-y^2$ a l'origen, on $f=0\neq k$. Per tant $C_k$ és la paràbola sense l'origen. Si $0<k<1$, $c>0$ (s'obre cap a la dreta); si $k<0$, $-1<c<0$; si $k>1$, $c<-1$ (s'obre cap a l'esquerra).
      fuites:
      - \\[dt]?frac\s*\{\s*k\s*\}\s*\{\s*1\s*-\s*k\s*\}
      - k\s*/\s*\(\s*1\s*-\s*k\s*\)
      teoria: []
    errors_comuns:
    - id: oblidar_definicio
      descripcio: |
        Ignora la segona línia de la definició i no inclou la paràbola $x=-y^2$ a $C_0$.
      pregunta: |
        Quant val $f$ en un punt com $(-1,1)$? A quin conjunt de nivell pertany?
    - id: incloure_origen
      descripcio: |
        Inclou l'origen a $C_k$ per a $k\neq0$, perquè satisfà l'equació $x(1-k)=ky^2$.
      pregunta: |
        L'origen compleix $x=-y^2$? Quina expressió de la definició s'hi aplica, doncs, i quin valor dona?
    - id: dividir_per_1_menys_k
      descripcio: |
        Divideix per $1-k$ sense separar el cas $k=1$.
      pregunta: |
        Per a quin valor de $k$ no pots aïllar $x$ dividint? Què queda en aquest cas?
    nota_professor: |
      Totes les corbes de nivell passen (adherentment) per l'origen: és la mateixa estructura que l'Exemple 11 del Tema 2 (amb $x$ i $y$ intercanviades), i anticipa que $f$ no té límit a $(0,0)$.
  - id: t2-2j
    apartat: j
    tipus: calcul
    enunciat: |
      $f(x,y)=x^2-2y^2+4y$.
    teoria:
    - T2.4
    teoria_reservada: []
    resultat:
      valor: |
        $f(x,y)=k\iff x^2-2(y-1)^2=k-2$. Per a $k>2$, hipèrboles centrades a $(0,1)$ amb vèrtexs $(\pm\sqrt{k-2},1)$ (branques a esquerra i dreta); per a $k<2$, hipèrboles centrades a $(0,1)$ amb vèrtexs $(0,1\pm\sqrt{(2-k)/2})$ (branques amunt i avall); $C_2(f)$ és el parell de rectes $x=\pm\sqrt{2}(y-1)$, que es tallen a $(0,1)$ i són les asímptotes de totes les hipèrboles.
      fuites:
      - hip[èe]rbol
    passos:
    - id: completar
      titol: Completar quadrats
      objectiu: |
        Reescriure l'equació $f(x,y)=k$ en una forma on es reconegui la cònica.
      idea: |
        Agrupa els termes en $y$ (traient el coeficient de $y^2$ factor comú) i completa el quadrat.
      detall: |
        $-2y^2+4y=-2(y^2-2y)=-2(y-1)^2+2$. Per tant $f(x,y)=k\iff x^2-2(y-1)^2=k-2$.
      fuites:
      - \(\s*y\s*-\s*1\s*\)\^\{?2\}?\s*=\s*k\s*-\s*2
      - 2\s*\(\s*y\s*-\s*1\s*\)\^\{?2
      teoria:
      - T2.4
    - id: k_diferent_2
      titol: Cas $k\neq2$
      objectiu: |
        Identificar $C_k$ quan $k\neq2$, distingint el signe de $k-2$.
      idea: |
        És una diferència de quadrats igual a una constant no nul·la: compara amb el cas $x^2-y^2=k$ desplaçant el centre, i busca els vèrtexs sobre les rectes de simetria.
      detall: |
        Si $k>2$: $\frac{x^2}{k-2}-\frac{(y-1)^2}{(k-2)/2}=1$, hipèrbola de centre $(0,1)$ amb vèrtexs $(\pm\sqrt{k-2},1)$, branques a esquerra i dreta. Si $k<2$: $\frac{(y-1)^2}{(2-k)/2}-\frac{x^2}{2-k}=1$, hipèrbola de centre $(0,1)$ amb vèrtexs $(0,1\pm\sqrt{(2-k)/2})$, branques amunt i avall.
      fuites:
      - \(\s*0\s*,\s*1\s*\)
      - \\pm\s*\\sqrt\{?\s*k\s*-\s*2
      teoria: []
    - id: k_igual_2
      titol: Cas $k=2$
      objectiu: |
        Identificar $C_2$ i relacionar-lo amb els altres nivells.
      idea: |
        Amb membre dret nul, factoritza la diferència de quadrats.
      detall: |
        $x^2=2(y-1)^2\iff x=\pm\sqrt{2}(y-1)$: dues rectes que es tallen al centre $(0,1)$ i que són les asímptotes comunes de totes les hipèrboles anteriors.
      fuites:
      - x\s*=\s*\\pm\s*\\sqrt\{?2\}?\s*\(\s*y\s*-\s*1
      teoria: []
    errors_comuns:
    - id: completar_malament
      descripcio: |
        Completa el quadrat en $y$ sense treure el $-2$ factor comú, o s'equivoca de signe en la constant.
      pregunta: |
        Si desenvolupes el quadrat que has escrit, et torna a donar exactament $-2y^2+4y$, o hi sobra o hi falta alguna constant?
    - id: k2_oblidat
      descripcio: |
        No tracta a part el cas en què el membre dret s'anul·la, o diu que $C_2$ és un sol punt.
      pregunta: |
        Quan el membre dret val $0$, una diferència de quadrats nul·la té només una solució?
    - id: confondre_branques
      descripcio: |
        No distingeix l'orientació de les branques segons el signe de $k-2$.
      pregunta: |
        Si $k<2$, hi ha punts de $C_k$ amb $y=1$?
- num: 3
  font: null
  preambul: |
    Identifiqueu les superfícies de nivell de les funcions següents:
  indicacio: null
  exercicis:
  - id: t2-3a
    apartat: a
    tipus: calcul
    enunciat: |
      $f(x,y,z)=x+2y+3z$.
    teoria:
    - T2.4
    teoria_reservada:
    - T2.5
    resultat:
      valor: |
        Per a cada $k\in\mathbb{R}$, la superfície de nivell $C_k(f)=\{(x,y,z)\mid x+2y+3z=k\}$ és un pla de vector normal $(1,2,3)$. Totes són plans paral·lels entre si (cap nivell és buit, ja que $\mathrm{Im}(f)=\mathbb{R}$).
      fuites:
      - pla(ns)?\s+(de\s+vector\s+)?(normal|paral)
      - normal\s*\(?\s*1\s*,\s*2\s*,\s*3
      - \b(és|són)\s+(un\s+)?pla(ns)?\b
    passos:
    - id: equacio
      titol: Escriure el conjunt de nivell
      objectiu: |
        Escriure explícitament l'equació que defineix el conjunt de nivell $k$ de $f$.
      idea: |
        Aplicar la definició de conjunt de nivell: punts on la funció pren el valor $k$.
      detall: |
        $C_k(f)=\{(x,y,z)\in\mathbb{R}^3\mid x+2y+3z=k\}$, per a cada $k\in\mathbb{R}$.
      fuites: []
      teoria:
      - T2.4
    - id: identificar
      titol: Identificar la superfície
      objectiu: |
        Reconèixer quin objecte geomètric de $\mathbb{R}^3$ descriu aquesta equació i com varia amb $k$.
      idea: |
        És una equació lineal en $x,y,z$: pensa en l'equació general d'un pla i en el significat dels coeficients.
      detall: |
        $x+2y+3z=k$ és un pla amb vector normal $(1,2,3)$. En variar $k$ obtenim plans paral·lels (el mateix vector normal), que recobreixen tot $\mathbb{R}^3$; cap conjunt de nivell és buit.
      fuites:
      - normal\s*\(?\s*1\s*,\s*2\s*,\s*3
      - pla(ns)?\s+paral
      - \b(és|són)\s+(un\s+)?pla(ns)?\b
      teoria: []
    errors_comuns:
    - id: confon_corba
      descripcio: |
        Descriu el conjunt de nivell com una recta (pensant en el cas de dues variables).
      pregunta: |
        Quants graus de llibertat té un punt de $\mathbb{R}^3$ que satisfà una sola equació?
    - id: oblida_nivells
      descripcio: |
        Només estudia alguns valors de $k$ (p. ex. $k=0$) i no diu què passa per a la resta.
      pregunta: |
        Per a quins valors de $k$ el conjunt de nivell és no buit? Canvia la seva forma quan canvia $k$?
    nota_professor: |
      L'Exemple 5 dels apunts tracta exactament $ax+by+cz$ (plans de vector normal $(a,b,c)$).
  - id: t2-3b
    apartat: b
    tipus: calcul
    enunciat: |
      $f(x,y,z)=x^2+y^2-z^2$.
    teoria:
    - T2.4
    teoria_reservada: []
    resultat:
      valor: |
        $C_k(f)=\{x^2+y^2-z^2=k\}$. Per a $k>0$: hiperboloide d'una fulla d'eix $Oz$ (secció a l'altura $z$: circumferència de radi $\sqrt{k+z^2}$). Per a $k=0$: el con circular $x^2+y^2=z^2$ de vèrtex l'origen i eix $Oz$. Per a $k<0$: hiperboloide de dues fulles d'eix $Oz$ (només hi ha punts amb $|z|\ge\sqrt{-k}$).
      fuites:
      - hiperboloides?
      - \bcon\b
      - dues\s+fulles
      - una\s+fulla
    passos:
    - id: equacio
      titol: Escriure el conjunt de nivell
      objectiu: |
        Escriure l'equació del conjunt de nivell $k$ i decidir quins casos de $k$ cal separar.
      idea: |
        Aplicar la definició de conjunt de nivell i observar que el signe de $k$ pot canviar la forma de la superfície.
      detall: |
        $C_k(f)=\{(x,y,z)\mid x^2+y^2-z^2=k\}$. Cal distingir $k>0$, $k=0$ i $k<0$.
      fuites: []
      teoria:
      - T2.4
    - id: seccions
      titol: Estudiar les seccions horitzontals
      objectiu: |
        Descriure la intersecció de la superfície amb cada pla horitzontal $z=z_0$.
      idea: |
        Fixar $z=z_0$ i mirar quina corba del pla $(x,y)$ queda; després observar com depèn el seu radi de $z_0$.
      detall: |
        Amb $z=z_0$: $x^2+y^2=k+z_0^2$, circumferència de radi $\sqrt{k+z_0^2}$ (si $k+z_0^2>0$), un punt si $k+z_0^2=0$, buit si $k+z_0^2<0$. La superfície és de revolució al voltant de l'eix $Oz$.
      fuites:
      - \\sqrt\{\s*k\s*\+\s*z_?0?\^\{?2\}?\s*\}
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*=\s*k\s*\+\s*z
      teoria: []
    - id: classificar
      titol: Classificar segons el signe de k
      objectiu: |
        Identificar la quàdrica que s'obté en cada un dels tres casos.
      idea: |
        Mirar si totes les seccions horitzontals són no buides, si n'hi ha una que és un sol punt, o si hi ha una franja de $z$ sense punts.
      detall: |
        $k>0$: totes les seccions són circumferències (la més petita, de radi $\sqrt{k}$, a $z=0$): hiperboloide d'una fulla. $k=0$: $x^2+y^2=z^2$, radi $|z_0|$: con de vèrtex l'origen. $k<0$: no hi ha punts per a $|z|<\sqrt{-k}$: hiperboloide de dues fulles.
      fuites:
      - hiperboloides?
      - dues\s+fulles
      - \bcon\b
      teoria: []
    errors_comuns:
    - id: un_sol_cas
      descripcio: |
        Dona una única descripció per a tots els $k$ sense distingir el signe.
      pregunta: |
        Què passa a la secció $z=0$ quan $k$ és negatiu? I quan $k=0$?
    - id: confon_fulles
      descripcio: |
        Intercanvia els casos d'una i dues fulles.
      pregunta: |
        Per a $k<0$, hi ha algun punt de la superfície amb $z=0$? Què et diu això sobre si la superfície és connexa?
    - id: oblida_k0
      descripcio: |
        Oblida el cas degenerat $k=0$ o el descriu com un punt.
      pregunta: |
        Per a $k=0$, quins punts compleixen $x^2+y^2=z^2$ a l'altura $z=1$? I a $z=2$?
  - id: t2-3c
    apartat: c
    tipus: calcul
    enunciat: |
      $f(x,y,z)=ax^2+by^2+cz^2$,  $a,b,c\in\mathbb{R}^+$.
    teoria:
    - T2.4
    teoria_reservada: []
    resultat:
      valor: |
        Per a $k>0$, $C_k(f)$ és l'el·lipsoide centrat a l'origen $\frac{x^2}{k/a}+\frac{y^2}{k/b}+\frac{z^2}{k/c}=1$, de semieixos $\sqrt{k/a},\sqrt{k/b},\sqrt{k/c}$ sobre els eixos coordenats (esfera si $a=b=c$). Per a $k=0$ és el punt $(0,0,0)$, i per a $k<0$ és el conjunt buit.
      fuites:
      - el[·.]?l?ipsoides?
      - semieixos?\s*\$?\s*\\sqrt\{\s*k\s*/\s*a
      - \\sqrt\{\s*\\d?frac\s*\{?k\}?\s*\{?a\}?\s*\}
    passos:
    - id: signe
      titol: Signe de la funció
      objectiu: |
        Determinar per a quins valors de $k$ el conjunt de nivell és buit, un punt o una superfície.
      idea: |
        Tots els coeficients són positius: quin signe té $f$ i quan s'anul·la?
      detall: |
        $f\ge 0$ i $f=0$ només a $(0,0,0)$. Per tant $C_k=\emptyset$ si $k<0$, $C_0=\{(0,0,0)\}$ i per a $k>0$ hi ha una superfície.
      fuites: []
      teoria:
      - T2.4
    - id: forma_canonica
      titol: Forma canònica
      objectiu: |
        Identificar la superfície per a $k>0$ i donar-ne els paràmetres geomètrics.
      idea: |
        Dividir l'equació per $k$ per portar-la a la forma canònica d'una quàdrica; compara amb el cas $x^2+y^2+z^2=k$ dels apunts.
      detall: |
        $ax^2+by^2+cz^2=k \iff \frac{x^2}{k/a}+\frac{y^2}{k/b}+\frac{z^2}{k/c}=1$: el·lipsoide centrat a l'origen amb semieixos $\sqrt{k/a}$, $\sqrt{k/b}$, $\sqrt{k/c}$ en les direccions dels eixos. Si $a=b=c$ és una esfera de radi $\sqrt{k/a}$.
      fuites:
      - el[·.]?l?ipsoides?
      - \\sqrt\{\s*k\s*/\s*a\s*\}
      - \\sqrt\{\s*\\d?frac\s*\{?k\}?\s*\{?a\}?\s*\}
      teoria:
      - T2.5
    errors_comuns:
    - id: semieixos_invertits
      descripcio: |
        Dona els semieixos com $\sqrt{a/k}$ o $\sqrt{ak}$.
      pregunta: |
        Si poses $y=z=0$, a quins valors de $x$ talla la superfície l'eix $Ox$?
    - id: oblida_casos
      descripcio: |
        No tracta els casos $k\le 0$.
      pregunta: |
        Pot $ax^2+by^2+cz^2$ valer un nombre negatiu? I quins punts el fan valer $0$?
  - id: t2-3d
    apartat: d
    tipus: calcul
    enunciat: |
      $f(x,y,z)=y^2+z^2$.
    teoria:
    - T2.4
    teoria_reservada:
    - T2.5
    resultat:
      valor: |
        Per a $k>0$, $C_k(f)=\{y^2+z^2=k\}$ és el cilindre circular de radi $\sqrt{k}$ i eix l'eix $Ox$; per a $k=0$ és l'eix $Ox$ (la recta $y=z=0$); per a $k<0$ és buit.
      fuites:
      - cilindres?
    passos:
    - id: variable_absent
      titol: Observar la variable absent
      objectiu: |
        Escriure el conjunt de nivell i veure quin paper hi juga la coordenada $x$.
      idea: |
        Si una coordenada no apareix a l'equació, què passa amb un punt de la superfície quan la canvies?
      detall: |
        $C_k(f)=\{(x,y,z)\mid y^2+z^2=k\}$; $x$ no hi apareix, de manera que si $(x_0,y_0,z_0)\in C_k$, tota la recta $\{(t,y_0,z_0)\}$, paral·lela a l'eix $Ox$, hi és.
      fuites: []
      teoria:
      - T2.4
    - id: seccio
      titol: Secció transversal
      objectiu: |
        Identificar la secció de la superfície amb un pla $x=x_0$ i deduir la superfície, segons el valor de $k$.
      idea: |
        Al pla $(y,z)$ l'equació és una corba coneguda; després s'estén al llarg de la direcció de la variable absent.
      detall: |
        A cada pla $x=x_0$: $y^2+z^2=k$, circumferència de radi $\sqrt{k}$ (si $k>0$). Desplaçada al llarg de $Ox$ dona un cilindre circular d'eix $Ox$ i radi $\sqrt{k}$. Si $k=0$, només $y=z=0$: l'eix $Ox$. Si $k<0$, buit.
      fuites:
      - cilindres?
      teoria: []
    errors_comuns:
    - id: circumferencia
      descripcio: |
        Respon "circumferències" com si fos una funció de dues variables, oblidant la coordenada $x$.
      pregunta: |
        El punt $(5,\sqrt{k},0)$ compleix l'equació? I $(100,\sqrt{k},0)$? Quin conjunt de $\mathbb{R}^3$ formen tots aquests punts?
    - id: eix_equivocat
      descripcio: |
        Situa l'eix de la superfície sobre $Oz$ o $Oy$.
      pregunta: |
        Quina coordenada pots canviar lliurement sense sortir de la superfície?
    - id: oblida_k0
      descripcio: |
        Diu que $C_0$ és el punt $(0,0,0)$.
      pregunta: |
        El punt $(3,0,0)$ compleix $y^2+z^2=0$?
    nota_professor: |
      L'Exemple 5 dels apunts fa el cas anàleg $x^2+2y^2$ (cilindres el·líptics), d'aquí que sigui reservat.
  - id: t2-3e
    apartat: e
    tipus: calcul
    enunciat: |
      $f(x,y,z)=xy$.
    teoria:
    - T2.4
    teoria_reservada: []
    resultat:
      valor: |
        Per a $k\neq 0$, $C_k(f)=\{xy=k\}$ és un cilindre hiperbòlic: a cada pla $z=z_0$ la secció és la hipèrbola equilàtera $xy=k$ (asímptotes els eixos $Ox$, $Oy$; branques al 1r i 3r quadrant si $k>0$, al 2n i 4t si $k<0$), estesa paral·lelament a l'eix $Oz$. Per a $k=0$ és la unió dels plans $x=0$ i $y=0$.
      fuites:
      - cilindres?\s+hiperb
      - uni[óo]\s+dels\s+plans
    passos:
    - id: variable_absent
      titol: Observar la variable absent
      objectiu: |
        Escriure el conjunt de nivell i veure quin paper hi juga la coordenada $z$.
      idea: |
        La coordenada $z$ no apareix a l'equació: n'hi ha prou d'entendre la secció en un pla horitzontal.
      detall: |
        $C_k(f)=\{(x,y,z)\mid xy=k\}$; si $(x_0,y_0,z_0)\in C_k$, tota la recta vertical per $(x_0,y_0)$ hi és.
      fuites: []
      teoria:
      - T2.4
    - id: seccio
      titol: Secció i superfície
      objectiu: |
        Identificar la corba $xy=k$ del pla i deduir la superfície per a $k\neq0$ i per a $k=0$.
      idea: |
        Al pla, $xy=k$ és una corba coneguda (pensa en $y=k/x$); el cas $k=0$ és un producte igual a zero.
      detall: |
        Per a $k\neq 0$, $xy=k$ és la hipèrbola $y=k/x$ (equilàtera, asímptotes els eixos); estesa al llarg de $Oz$ dona un cilindre hiperbòlic. Per a $k=0$, $xy=0\iff x=0$ o $y=0$: unió dels plans $x=0$ i $y=0$.
      fuites:
      - cilindres?\s+hiperb
      - uni[óo]\s+dels\s+plans
      - hip[eè]rbol
      teoria: []
    errors_comuns:
    - id: corba_en_lloc_de_superficie
      descripcio: |
        Respon "hipèrboles" sense adonar-se que a $\mathbb{R}^3$ el conjunt de nivell és una superfície.
      pregunta: |
        El punt $(1,k,7)$ compleix l'equació? Quina dimensió té el conjunt de tots els punts que la compleixen?
    - id: k0_eixos
      descripcio: |
        Diu que $C_0$ són els eixos $Ox$ i $Oy$ (rectes) en lloc de plans.
      pregunta: |
        El punt $(0,5,3)$ pertany a $C_0$? Està sobre algun eix coordenat?
- num: 4
  font: null
  preambul: |
    Calculeu els límits següents:
  indicacio: null
  exercicis:
  - id: t2-4a
    apartat: a
    tipus: calcul
    enunciat: |
      $\displaystyle\lim_{(x,y)\to(0,0)}\frac{2+3x+4y^2}{x+1}$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        $2$
      fuites:
      - l[íi]mit\s+(és|val|dona|=)\s*\$?\s*2\b
    passos:
    - id: continuitat
      titol: Reconèixer la continuïtat
      objectiu: |
        Adonar-se que no hi ha cap indeterminació: estudiar el denominador a $(0,0)$.
      idea: |
        Un quocient de funcions contínues és continu on el denominador no s'anul·la; i en un punt de continuïtat el límit és el valor de la funció.
      detall: |
        Numerador i denominador són polinomis (contínues) i a $(0,0)$ el denominador val $x+1=1\neq 0$. Per tant $f$ és contínua en un entorn de $(0,0)$.
      fuites:
      - x\s*\+\s*1\s*=\s*1
      teoria:
      - T2.20
      - T2.14
    - id: avaluar
      titol: Avaluar al punt
      objectiu: |
        Calcular el valor de la funció a $(0,0)$.
      idea: |
        Per continuïtat, n'hi ha prou de substituir les coordenades del punt.
      detall: |
        $f(0,0)=\frac{2+0+0}{0+1}=2$, que és el límit.
      fuites:
      - f\(0,\s*0\)\s*=\s*\\frac
      - \\frac\{2[^}]*\}\{[^}]*\}\s*=\s*2
      teoria:
      - T2.14
    errors_comuns:
    - id: fals_indeterminacio
      descripcio: |
        Tracta el límit com una indeterminació (camins, polars…) quan la funció és contínua al punt.
      pregunta: |
        Abans de buscar camins: què val el denominador exactament al punt $(0,0)$?
    - id: camins_com_a_prova
      descripcio: |
        Creu que comprovar uns quants camins demostra que el límit existeix.
      pregunta: |
        Si dos camins donen el mateix valor, això garanteix que tots els camins el donaran?
    - id: error_aritmetic
      descripcio: |
        Error de càlcul en substituir.
      pregunta: |
        Pots tornar a substituir $x=0$ i $y=0$ terme per terme?
  - id: t2-4b
    apartat: b
    tipus: calcul
    enunciat: |
      $\displaystyle\lim_{(x,y)\to(0,0)}\frac{x^4y^4}{\sqrt{x^2+y^2}}$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        $0$
      fuites:
      - l[íi]mit\s+(és|val|dona|=)\s*\$?\s*0\b
    passos:
    - id: indeterminacio
      titol: Detectar la indeterminació
      objectiu: |
        Veure què fan numerador i denominador quan $(x,y)\to(0,0)$.
      idea: |
        Substituir directament: si surt $0/0$ cal una estratègia que controli el quocient a prop de l'origen.
      detall: |
        $x^4y^4\to 0$ i $\sqrt{x^2+y^2}\to 0$: indeterminació $0/0$.
      fuites: []
      teoria: []
    - id: acotar
      titol: Acotar amb la norma
      objectiu: |
        Trobar una fita del mòdul del quocient que només depengui de la distància a l'origen.
      idea: |
        Cada coordenada està fitada per la norma: $|x|\le\sqrt{x^2+y^2}$ i $|y|\le\sqrt{x^2+y^2}$ (o, equivalentment, passar a polars).
      detall: |
        Amb $r=\sqrt{x^2+y^2}$: $|x^4y^4|\le r^8$, per tant $\left|\frac{x^4y^4}{r}\right|\le r^7$. En polars: $r^7\cos^4\theta\sin^4\theta$, amb $|\cos^4\theta\sin^4\theta|\le 1$.
      fuites:
      - r\^\{?7\}?
      - r\^\{?8\}?
      teoria: []
    - id: concloure
      titol: Concloure amb el sandvitx
      objectiu: |
        Deduir el valor del límit a partir de la fita.
      idea: |
        Si $|f(x,y)|\le g(r)$ amb $g(r)\to 0$, la definició $\epsilon$-$\delta$ de límit es compleix directament.
      detall: |
        $0\le|f(x,y)|\le r^7$; donat $\epsilon>0$, prenent $\delta=\epsilon^{1/7}$, si $0<r<\delta$ aleshores $|f(x,y)|<\epsilon$. El límit és $0$.
      fuites: []
      teoria:
      - T2.6
    errors_comuns:
    - id: camins_com_a_prova
      descripcio: |
        Conclou el valor del límit només perquè alguns camins donen $0$.
      pregunta: |
        Els camins et donen un candidat. Què caldria per assegurar que tots els camins, fins i tot els més retorçats, donen el mateix?
    - id: fita_incorrecta
      descripcio: |
        Fa una desigualtat falsa o en sentit contrari (p. ex. fita el denominador per dalt quan necessita fitar-lo per baix).
      pregunta: |
        Revisa el sentit de la desigualtat: si fas el denominador més gran, el quocient es fa més gran o més petit?
    - id: polars_sense_uniformitat
      descripcio: |
        Passa a polars i fa tendir $r$ a $0$ sense controlar la dependència en $\theta$.
      pregunta: |
        En polars, la part que depèn de $\theta$ està fitada independentment de $\theta$?
  - id: t2-4c
    apartat: c
    tipus: calcul
    enunciat: |
      $\displaystyle\lim_{(x,y)\to(0,0)}\frac{x^5}{x^4+y^2}$.
    teoria:
    - T2.6
