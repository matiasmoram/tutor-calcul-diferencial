    - id: hessiana
      titol: Hessiana
      objectiu: |
        Calcular la hessiana i avaluar-la als punts crítics.
      idea: |
        Derivar un altre cop les derivades primeres; observar que $f_{yy}=f_{zz}=0$.
      detall: |
        $f_{xx}=\dfrac{2(1+yz)}{x^3}$, $f_{xy}=-\dfrac z{x^2}$, $f_{xz}=-\dfrac y{x^2}$, $f_{yy}=f_{zz}=0$, $f_{yz}=\dfrac1x$.
        $Hf(1,0,0)=\begin{pmatrix}2&0&0\\0&0&1\\0&1&0\end{pmatrix}$, $Hf(-1,0,0)=\begin{pmatrix}-2&0&0\\0&0&-1\\0&-1&0\end{pmatrix}$.
      fuites:
      - f_\{?yz\}?\s*=\s*\\d?frac\s*\{?1\}?\s*\{?x
      teoria:
      - T5.32
      - T5.6
    - id: classificar
      titol: Classificar
      objectiu: |
        Decidir el caràcter de cada punt crític.
      idea: |
        Buscar vectors on la forma hessiana prengui signes oposats, o calcular-ne els valors propis (la matriu és diagonal per blocs).
      detall: |
        A $(1,0,0)$: valors propis $2,1,-1$; per exemple $q(1,0,0)=2>0$ i $q(0,1,-1)=-2<0$. Indefinida: punt de sella.
        A $(-1,0,0)$: valors propis $-2,-1,1$; $q(1,0,0)=-2<0$ i $q(0,1,-1)=2>0$. Indefinida: punt de sella.
      fuites:
      - q\s*\(\s*0\s*,\s*1\s*,\s*-\s*1\s*\)
      - valors\s+propis\s+\$?\s*2\s*,\s*1\s*,\s*-\s*1
      teoria:
      - T5.33
      - T5.29
      - T5.27
    errors_comuns:
    - id: diagonal_conclou
      descripcio: |
        Mira només la diagonal de la hessiana ($2,0,0$) i conclou que és semidefinida positiva i que el punt és mínim o que el criteri no decideix.
      pregunta: |
        Els elements de la diagonal són els únics que compten per al signe de la forma quadràtica? Prova-la sobre un vector amb $y$ i $z$ no nuls.
    - id: domini
      descripcio: |
        No observa que $x=0$ queda fora del domini o deriva malament el quocient.
      pregunta: |
        On està definida $f$? Pots reescriure-la com $x+(1+yz)x^{-1}$ abans de derivar?
    nota_professor: |
      Sylvester no s'aplica directament (el segon menor principal és $0$); cal raonar amb vectors o valors propis.
- num: 6
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t5-6
    apartat: null
    tipus: calcul
    enunciat: |
      Estudieu, en funció de $k$, el caràcter dels punts crítics de la funció $f(x,y)=\frac{1}{2}(x^2+y^2)+kxy$.
    teoria:
    - T5.21
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        - Si $k\neq\pm1$, l'únic punt crític és $(0,0)$. Si $|k|<1$ és un mínim local estricte (de fet, mínim absolut, $f\geq0$); si $|k|>1$ és un punt de sella.
        - Si $k=1$, $f=\frac12(x+y)^2$ i els punts crítics són tots els de la recta $y=-x$; si $k=-1$, $f=\frac12(x-y)^2$ i els punts crítics són tots els de la recta $y=x$. En tots dos casos cada punt crític és un mínim local (i absolut) no estricte, amb $f=0$.
      fuites:
      - (\|k\|\s*(<|\\lt)\s*1|-\s*1\s*<\s*k\s*<\s*1)[^.\n]{0,50}m[íi]nim
      - \|k\|\s*(>|\\gt)\s*1[^.\n]{0,50}sella
      - m[íi]nims?\s+(locals?\s+)?(i\s+absoluts?\s+)?no\s+estrictes?
    passos:
    - id: punts_critics
      titol: Trobar els punts crítics segons $k$
      objectiu: |
        Trobar els punts crítics de $f$, distingint els valors de $k$ per als quals el conjunt de punts crítics canvia.
      idea: |
        El sistema $f_x=0$, $f_y=0$ és lineal i homogeni en $(x,y)$: té solució única si i només si el determinant de la matriu del sistema és no nul.
      detall: |
        $f_x=x+ky$, $f_y=kx+y$. El determinant del sistema és $1-k^2$. Si $k\neq\pm1$, l'única solució és $(0,0)$. Si $k=1$, les dues equacions són $x+y=0$: tots els punts de la recta $y=-x$ són crítics. Si $k=-1$, queda $x-y=0$: tots els punts de la recta $y=x$ són crítics.
      fuites:
      - 1\s*-\s*k\^\{?2\}?
      - recta\s+\$?\s*y\s*=\s*-?\s*x
      teoria:
      - T5.22
    - id: hessiana
      titol: Calcular la hessiana
      objectiu: |
        Obtenir la matriu hessiana de $f$ i el seu determinant i traça.
      idea: |
        $f$ és polinòmica de grau 2, de manera que la hessiana és constant.
      detall: |
        $Hf(x,y)=\begin{pmatrix}1&k\\k&1\end{pmatrix}$ a tot punt, amb $\det Hf=1-k^2$ i $\mathrm{tr}\,Hf=2>0$.
      fuites:
      - 1\s*&\s*k\s*\\\\\s*k\s*&\s*1
      teoria:
      - T5.32
    - id: classificar_no_degenerat
      titol: Classificar l'origen quan $k\neq\pm1$
      objectiu: |
        Decidir el caràcter de l'origen en els casos en què la hessiana no és degenerada.
      idea: |
        Aplicar les condicions suficients d'extrem; en dues variables el signe de la forma hessiana es llegeix del signe del determinant i de la traça.
      detall: |
        Si $|k|<1$: $\det=1-k^2>0$ i $\mathrm{tr}=2>0$, la hessiana és definida positiva, i l'origen és un mínim local estricte (de fet absolut: $f$ és la mateixa forma quadràtica, que és $\geq0$).
        Si $|k|>1$: $\det<0$, la hessiana és indefinida i l'origen és un punt de sella (per exemple, $f(t,t)=(1+k)t^2$ i $f(t,-t)=(1-k)t^2$ tenen signes oposats).
      fuites:
      - definida\s+positiva
      - indefinida
      teoria:
      - T5.33
      - T5.30
    - id: casos_degenerats
      titol: Estudiar els casos $k=\pm1$
      objectiu: |
        Decidir el caràcter dels punts crítics quan $k=1$ i quan $k=-1$, on el criteri de la hessiana no decideix.
      idea: |
        Mirar l'expressió de $f$ per a aquests valors concrets de $k$: es pot escriure de manera que el seu signe sigui evident, i comparar directament amb el valor de $f$ als punts crítics.
      detall: |
        Si $k=1$: $f=\frac12(x^2+2xy+y^2)=\frac12(x+y)^2\geq0$, i val $0$ exactament a la recta $y=-x$. Cada punt crític té $f=0\leq f(x,y)$ per a tot $(x,y)$: és un mínim local (i absolut), però no estricte, perquè a qualsevol bola hi ha altres punts de la recta amb el mateix valor.
        Si $k=-1$: $f=\frac12(x-y)^2$, i el mateix raonament sobre la recta $y=x$.
      fuites:
      - \\frac\s*\{?1\}?\s*\{?2\}?\s*\(\s*x\s*[+-]\s*y\s*\)\^\{?2
      - \(\s*x\s*[+-]\s*y\s*\)\^\{?2\}?\s*/\s*2
      - no\s+estricte
      teoria:
      - T5.21
    errors_comuns:
    - id: oblida_cas_degenerat
      descripcio: |
        Afirma que l'únic punt crític és sempre l'origen, sense adonar-se que per a $k=\pm1$ el sistema té infinites solucions.
      pregunta: |
        El sistema que has resolt és lineal. Té sempre solució única, sigui quin sigui el valor de $k$?
    - id: hessiana_degenerada_conclou
      descripcio: |
        Per a $k=\pm1$ (determinant zero) conclou que no hi ha extrem, o aplica el criteri de la hessiana com si decidís.
      pregunta: |
        Quan el determinant de la hessiana és zero, què et diu exactament el teorema de condicions suficients? Podries estudiar el signe de $f$ directament?
    - id: estricte_vs_no_estricte
      descripcio: |
        Per a $k=\pm1$ diu que els punts crítics són mínims locals estrictes.
      pregunta: |
        En una bola petita al voltant d'un d'aquests punts crítics, hi ha altres punts on $f$ pren exactament el mateix valor?
    nota_professor: |
      $f$ és ella mateixa una forma quadràtica de matriu $\begin{pmatrix}1&k\\k&1\end{pmatrix}$, de valors propis $1\pm k$, i tot el problema es redueix a classificar-la. Als casos $k=\pm1$ la hessiana és semidefinida positiva, compatible amb mínim, i l'estudi directe ho confirma.
- num: 7
  font: null
  preambul: |
    Considereu la funció $f(x,y)=(y-3x^2)(y-x^2)$.
  indicacio: null
  exercicis:
  - id: t5-7a
    apartat: a
    tipus: calcul
    enunciat: |
      Proveu que l'origen n'és l'únic punt crític, i estudieu-ne el caràcter.
    teoria:
    - T5.21
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        $f_x=4x(3x^2-2y)$, $f_y=2y-4x^2$ s'anul·len només a $(0,0)$. La hessiana a l'origen és $\begin{pmatrix}0&0\\0&2\end{pmatrix}$ (semidefinida, no decideix). Com que $f<0$ entre les dues paràboles $y=x^2$ i $y=3x^2$ (per exemple $f(x,2x^2)=-x^4$) i $f>0$ fora (per exemple $f(0,y)=y^2$), l'origen és un punt de sella.
      fuites:
      - (\(\s*0\s*,\s*0\s*\)|origen)\$?\s*(és|es)\s+(un\s+)?punt\s+de\s+sella
      - f\s*\(\s*x\s*,\s*2\s*x\^\{?2\}?\s*\)\s*=\s*-\s*x\^\{?4
    passos:
    - id: punts_critics
      titol: Trobar els punts crítics
      objectiu: |
        Veure que l'únic punt on s'anul·len les dues derivades parcials és l'origen.
      idea: |
        Desenvolupar $f$ (o derivar el producte), resoldre l'equació més senzilla per expressar $y$ en funció de $x$ i substituir a l'altra.
      detall: |
        $f=y^2-4x^2y+3x^4$, $f_x=-8xy+12x^3=4x(3x^2-2y)$, $f_y=2y-4x^2$. De $f_y=0$, $y=2x^2$; substituint, $f_x=4x(3x^2-4x^2)=-4x^3=0$, d'on $x=0$ i $y=0$.
      fuites:
      - y\s*=\s*2\s*x\^\{?2
      - -\s*4\s*x\^\{?3
      teoria:
      - T5.22
    - id: hessiana
      titol: Provar el criteri de la hessiana
      objectiu: |
        Calcular la hessiana a l'origen i veure si permet decidir el caràcter del punt crític.
      idea: |
        Calcular les derivades segones, avaluar-les a l'origen i mirar el signe de la forma quadràtica resultant.
      detall: |
        $f_{xx}=36x^2-8y$, $f_{xy}=-8x$, $f_{yy}=2$. A l'origen, $Hf(0,0)=\begin{pmatrix}0&0\\0&2\end{pmatrix}$: valors propis $0$ i $2$, semidefinida positiva però no definida. Les condicions suficients no decideixen (només descarten que sigui un màxim local).
      fuites:
      - 0\s*&\s*0\s*\\\\\s*0\s*&\s*2
      - semidefinida\s+positiva
      teoria:
      - T5.32
      - T5.33
    - id: estudi_directe
      titol: Estudiar el signe de $f$ a prop de l'origen
      objectiu: |
        Decidir el caràcter de l'origen comparant $f$ amb $f(0,0)$ en punts propers.
      idea: |
        $f$ és un producte de dos factors que s'anul·len sobre dues corbes que passen per l'origen: estudiar el signe de cada factor a les regions que determinen.
      detall: |
        $f(0,0)=0$. Els factors s'anul·len a les paràboles $y=x^2$ i $y=3x^2$. Entre elles ($x^2<y<3x^2$) un factor és positiu i l'altre negatiu: $f<0$; per exemple $f(x,2x^2)=(-x^2)(x^2)=-x^4<0$ per a $x\neq0$. Fora d'elles, $f>0$; per exemple $f(0,y)=y^2>0$ per a $y\neq0$. Tota bola centrada a l'origen conté punts de tots dos tipus: l'origen és un punt de sella.
      fuites:
      - -\s*x\^\{?4\}?\s*<\s*0
      - x\^\{?2\}?\s*<\s*y\s*<\s*3\s*x\^\{?2
      teoria:
      - T5.25
    errors_comuns:
    - id: hessiana_semidefinida_minim
      descripcio: |
        Com que la hessiana és semidefinida positiva, conclou que l'origen és un mínim local.
      pregunta: |
        La propietat de la hessiana que has trobat, el teorema de condicions suficients la presenta com a condició necessària o com a condició suficient de mínim local?
    - id: nomes_rectes
      descripcio: |
        Estudia $f$ només sobre rectes que passen per l'origen (on sempre té mínim) i conclou que l'origen és un mínim.
      pregunta: |
        Les rectes per l'origen són les úniques maneres d'acostar-s'hi? Què passa si t'hi acostes per una corba situada entre les dues paràboles on s'anul·la $f$?
    - id: perd_solucio
      descripcio: |
        En resoldre el sistema divideix per $x$ i no comprova el cas $x=0$, o no justifica que no hi ha altres solucions.
      pregunta: |
        En simplificar les equacions, has dividit per alguna expressió que es pugui anul·lar?
    nota_professor: |
      Exemple clàssic de Peano: l'origen és mínim estricte sobre cada recta (apartat b) però és punt de sella.
  - id: t5-7b
    apartat: b
    tipus: teoric
    enunciat: |
      Proveu que la funció $\varphi=f\circ c$, on $c(t)=(at,bt)$ és una recta que passa per l'origen, té un mínim a $t=0$ independentment de la recta triada.
    teoria:
    - T5.9
    teoria_reservada: []
    resultat:
      valor: |
        $\varphi(t)=b^2t^2-4a^2b\,t^3+3a^4t^4$ (amb $(a,b)\neq(0,0)$). Si $b\neq0$: $\varphi'(0)=0$, $\varphi''(0)=2b^2>0$, mínim local estricte. Si $b=0$: $\varphi(t)=3a^4t^4$, amb $a\neq0$, que té un mínim estricte (absolut) a $t=0$. En tots els casos $t=0$ és un mínim local estricte de $\varphi$.
      fuites: []
    passos:
    - id: calcular_phi
      titol: Escriure $\varphi$
      objectiu: |
        Obtenir l'expressió explícita de $\varphi(t)=f(at,bt)$.
      idea: |
        Substituir $x=at$, $y=bt$ a $f$ i ordenar per potències de $t$. Cal que $(a,b)\neq(0,0)$ perquè $c$ sigui una recta.
      detall: |
        $\varphi(t)=(bt-3a^2t^2)(bt-a^2t^2)=b^2t^2-4a^2b\,t^3+3a^4t^4$.
      fuites:
      - b\^\{?2\}?\s*t\^\{?2\}?\s*-\s*4\s*a\^\{?2\}?\s*b
      teoria: []
    - id: cas_b_no_nul
      titol: Cas $b\neq0$
      objectiu: |
        Veure que $t=0$ és un mínim de $\varphi$ quan $b\neq0$.
      idea: |
        Criteri de les derivades successives en una variable: mirar la primera derivada de $\varphi$ que no s'anul·la a $t=0$ i el seu signe.
      detall: |
        $\varphi'(0)=0$ i $\varphi''(0)=2b^2>0$. Pel criteri de la derivada $r$-èsima amb $r=2$ (parell), $t=0$ és un mínim local estricte.
      fuites:
      - 2\s*b\^\{?2\}?\s*>\s*0
      teoria:
      - T5.11
    - id: cas_b_nul
      titol: Cas $b=0$
      objectiu: |
        Veure que $t=0$ també és un mínim quan la recta és l'eix horitzontal ($b=0$).
      idea: |
        Amb $b=0$ desapareixen els termes de grau 2 i 3: mirar què queda i el seu signe.
      detall: |
        $\varphi(t)=3a^4t^4$ amb $a\neq0$, que és $>0=\varphi(0)$ per a $t\neq0$: mínim estricte (també es pot veure amb el criteri de la derivada $r$-èsima amb $r=4$, $\varphi^{(4)}(0)=72a^4>0$).
      fuites:
      - 3\s*a\^\{?4\}?\s*t\^\{?4
      teoria:
      - T5.11
    errors_comuns:
    - id: oblida_b_zero
      descripcio: |
        Usa $\varphi''(0)=2b^2>0$ per a totes les rectes i oblida el cas $b=0$, on $\varphi''(0)=0$.
      pregunta: |
        Hi ha alguna recta per a la qual la segona derivada de $\varphi$ a $t=0$ no sigui estrictament positiva? Què hi passa?
    - id: conclou_minim_de_f
      descripcio: |
        Dedueix que, com que hi ha mínim sobre totes les rectes, l'origen és un mínim local de $f$ (contradient l'apartat a).
      pregunta: |
        Ser mínim sobre cada recta per l'origen és el mateix que ser mínim sobre tota una bola? Recorda què has trobat a l'apartat anterior.
    nota_professor: |
      La moral del problema: el comportament sobre totes les rectes no determina el caràcter d'un punt crític. Al cas $b\neq0$ es pot argumentar també factoritzant $\varphi(t)=t^2(b^2-4a^2bt+3a^4t^2)$, amb el segon factor positiu prop de $t=0$.
- num: 8
  font: null
  preambul: |
    Trobeu i classifiqueu tots els punts crítics de les funcions següents:
  indicacio: null
  exercicis:
  - id: t5-8a
    apartat: a
    tipus: calcul
    enunciat: |
      $f(x,y)=(x-y)^3+(x+y)^2$;
    teoria:
    - T5.21
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        L'únic punt crític és $(0,0)$. La hessiana hi és $\begin{pmatrix}2&2\\2&2\end{pmatrix}$ (semidefinida positiva, no decideix). Sobre la recta $y=-x$, $f(x,-x)=8x^3$ canvia de signe: l'origen és un punt de sella.
      fuites:
      - (\(\s*0\s*,\s*0\s*\)|origen)\$?\s*(és|es)\s+(un\s+)?punt\s+de\s+sella
      - f\s*\(\s*x\s*,\s*-\s*x\s*\)\s*=\s*8\s*x\^\{?3
    passos:
    - id: punts_critics
      titol: Trobar els punts crítics
      objectiu: |
        Trobar tots els punts on s'anul·len les dues derivades parcials.
      idea: |
        Les dues derivades parcials comparteixen els mateixos termes amb signes diferents: sumar-les i restar-les dona dues equacions molt senzilles.
      detall: |
        $f_x=3(x-y)^2+2(x+y)$, $f_y=-3(x-y)^2+2(x+y)$. Sumant: $4(x+y)=0$; restant: $6(x-y)^2=0$. Per tant $x=y$ i $x=-y$, i l'únic punt crític és $(0,0)$.
      fuites:
      - 4\s*\(\s*x\s*\+\s*y\s*\)\s*=\s*0
      - 6\s*\(\s*x\s*-\s*y\s*\)\^\{?2\}?\s*=\s*0
      teoria:
      - T5.22
    - id: hessiana
      titol: Provar el criteri de la hessiana
      objectiu: |
        Calcular la hessiana a l'origen i veure si decideix.
      idea: |
        Calcular les derivades segones, avaluar a l'origen i estudiar el signe de la forma quadràtica (determinant i traça).
      detall: |
        $f_{xx}=6(x-y)+2$, $f_{xy}=-6(x-y)+2$, $f_{yy}=6(x-y)+2$. $Hf(0,0)=\begin{pmatrix}2&2\\2&2\end{pmatrix}$, $\det=0$, $\mathrm{tr}=4$: semidefinida positiva (valors propis $0$ i $4$). No decideix.
      fuites:
      - 2\s*&\s*2\s*\\\\\s*2\s*&\s*2
      teoria:
      - T5.32
      - T5.33
      - T5.30
    - id: estudi_directe
      titol: Estudiar $f$ sobre la direcció degenerada
      objectiu: |
        Decidir el caràcter de l'origen estudiant directament el signe de $f$ a prop seu.
      idea: |
        Restringir $f$ a la recta en la direcció del vector propi de valor propi $0$, on el terme quadràtic desapareix, i mirar el signe del que queda.
      detall: |
        Sobre $y=-x$: $f(x,-x)=(2x)^3+0=8x^3$, positiu per a $x>0$ i negatiu per a $x<0$. Com que $f(0,0)=0$, tota bola centrada a l'origen conté punts amb $f>0$ i amb $f<0$: l'origen és un punt de sella.
      fuites:
      - 8\s*x\^\{?3
      teoria:
      - T5.25
    errors_comuns:
    - id: semidefinida_minim
      descripcio: |
        Conclou que l'origen és un mínim perquè la hessiana és semidefinida positiva.
      pregunta: |
        Una hessiana semidefinida positiva és una condició necessària o suficient per tenir un mínim local?
    - id: direccio_equivocada
      descripcio: |
        Estudia $f$ només sobre rectes com $y=0$ o $y=x$, on $f$ sembla tenir mínim, i conclou que és un mínim.
      pregunta: |
        Sobre quina recta per l'origen desapareix el terme de grau 2 de $f$? Què hi passa amb el terme de grau 3?
    nota_professor: |
      Amb el canvi lineal $u=x-y$, $v=x+y$, $f=u^3+v^2$, i el caràcter de sella és immediat.
  - id: t5-8b
    apartat: b
    tipus: calcul
    enunciat: |
      $g(x,y)=x^4+x^2y^2+2xy^2+12y^2$.
    teoria:
    - T5.21
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        L'únic punt crític és $(0,0)$. La hessiana hi és $\begin{pmatrix}0&0\\0&24\end{pmatrix}$ (no decideix). Com que $g(x,y)=x^4+y^2\big((x+1)^2+11\big)>0=g(0,0)$ per a $(x,y)\neq(0,0)$, l'origen és un mínim local estricte (de fet, mínim absolut).
      fuites:
      - (\(\s*0\s*,\s*0\s*\)|origen)\$?\s*(és|es)\s+(un\s+)?m[íi]nim
      - \(\s*x\s*\+\s*1\s*\)\^\{?2\}?\s*\+\s*11
    passos:
    - id: punts_critics
      titol: Trobar els punts crítics
      objectiu: |
        Trobar tots els punts on s'anul·len les dues derivades parcials de $g$.
      idea: |
        Factoritzar $g_y$: un dels factors no s'anul·la mai (completar quadrats). Després substituir a $g_x=0$.
      detall: |
        $g_x=4x^3+2xy^2+2y^2$, $g_y=2y(x^2+2x+12)=2y\big((x+1)^2+11\big)$. El segon factor és sempre $\geq11$, per tant $g_y=0\iff y=0$. Llavors $g_x=4x^3=0$, $x=0$. Únic punt crític: $(0,0)$.
      fuites:
      - \(\s*x\s*\+\s*1\s*\)\^\{?2\}?\s*\+\s*11
      teoria:
      - T5.22
    - id: hessiana
      titol: Provar el criteri de la hessiana
      objectiu: |
        Calcular la hessiana a l'origen i veure si decideix.
      idea: |
        Calcular les derivades segones a l'origen i estudiar el signe de la forma quadràtica.
      detall: |
        $g_{xx}=12x^2+2y^2$, $g_{xy}=4xy+4y$, $g_{yy}=2x^2+4x+24$. $Hg(0,0)=\begin{pmatrix}0&0\\0&24\end{pmatrix}$: semidefinida positiva, $\det=0$. No decideix (només descarta un màxim).
      fuites:
      - 0\s*&\s*0\s*\\\\\s*0\s*&\s*24
      teoria:
      - T5.32
      - T5.33
    - id: estudi_directe
      titol: Estudiar el signe de $g$
      objectiu: |
        Decidir el caràcter de l'origen comparant $g(x,y)$ amb $g(0,0)$.
      idea: |
        Agrupar els termes que contenen $y^2$ i reconèixer, com al primer pas, un factor que és sempre positiu.
      detall: |
        $g(x,y)=x^4+y^2(x^2+2x+12)=x^4+y^2\big((x+1)^2+11\big)$. Els dos sumands són $\geq0$ i la suma val $0$ només si $x=0$ i $y=0$. Per tant $g(x,y)>0=g(0,0)$ per a $(x,y)\neq(0,0)$: mínim local estricte, i de fet mínim absolut.
      fuites:
      - x\^\{?4\}?\s*\+\s*y\^\{?2\}?\s*\(\s*x\^\{?2\}?\s*\+\s*2\s*x\s*\+\s*12
      teoria:
      - T5.21
    errors_comuns:
    - id: perd_factor
      descripcio: |
        No veu que $x^2+2x+12$ no s'anul·la mai, o en cerca arrels reals i s'hi encalla, o divideix per $y$ sense considerar $y=0$.
      pregunta: |
        El polinomi $x^2+2x+12$ té arrels reals? Com ho pots veure ràpidament?
    - id: hessiana_conclou
      descripcio: |
        Amb $\det Hg(0,0)=0$ conclou que no es pot dir res, o que és un punt de sella.
      pregunta: |
        Que la hessiana no decideixi vol dir que no hi ha extrem? Pots comparar directament $g(x,y)$ amb $g(0,0)$?
    - id: nomes_eixos
      descripcio: |
        Comprova $g>0$ només sobre els eixos i en conclou el mínim.
      pregunta: |
        Has comprovat que $g>0$ a tots els punts propers a l'origen, o només a alguns?
    nota_professor: |
      Contrast amb l'apartat (a): la mateixa situació (hessiana semidefinida) acaba en mínim aquí i en sella allà.
- num: 9
  font: null
  preambul: |
    Considerem la funció $f(x,y)=(x^2+y^2+2x)\,x^3$.
  indicacio: null
  exercicis:
  - id: t5-9a
    apartat: a
    tipus: calcul
    enunciat: |
      Dibuixeu $C_0$, la corba de nivell 0 de $f$.
    teoria:
    - T2.4
    teoria_reservada: []
    resultat:
      valor: |
        $C_0=\{x=0\}\cup\{(x+1)^2+y^2=1\}$: la unió de l'eix vertical i la circumferència de centre $(-1,0)$ i radi $1$, que és tangent a l'eix vertical a l'origen.
      fuites:
      - centre\s+\$?\s*\(\s*-\s*1\s*,\s*0\s*\)
      - \(\s*x\s*\+\s*1\s*\)\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*=\s*1
    passos:
    - id: factors
      titol: Descompondre l'equació $f=0$
      objectiu: |
        Escriure el conjunt $C_0$ com a unió de conjunts més senzills.
      idea: |
        Un producte s'anul·la si i només si s'anul·la algun dels factors.
      detall: |
        $f=0\iff x^3=0$ o $x^2+y^2+2x=0$. El primer dona la recta $x=0$.
      fuites: []
      teoria:
      - T2.4
    - id: circumferencia
      titol: Identificar la segona corba
      objectiu: |
        Reconèixer geomètricament el conjunt $x^2+y^2+2x=0$ i dibuixar $C_0$.
      idea: |
        Completar quadrats en $x$.
      detall: |
        $x^2+2x+y^2=(x+1)^2+y^2-1=0$: circumferència de centre $(-1,0)$ i radi $1$. Passa per l'origen i hi és tangent a l'eix $x=0$ (està continguda a $-2\leq x\leq0$). $C_0$ és la unió d'aquesta circumferència i l'eix vertical.
      fuites:
      - \(\s*x\s*\+\s*1\s*\)\^\{?2\}?\s*\+\s*y\^\{?2
      - centre\s+\$?\s*\(\s*-\s*1\s*,\s*0
      teoria: []
    errors_comuns:
    - id: oblida_recta
      descripcio: |
        Només dibuixa la circumferència i oblida el factor $x^3$ (la recta $x=0$).
      pregunta: |
        Quan s'anul·la un producte de dos factors? Has tingut en compte tots dos?
    - id: centre_equivocat
      descripcio: |
        Completa malament el quadrat i situa la circumferència centrada a $(1,0)$ o amb radi equivocat.
      pregunta: |
        Si desenvolupes l'expressió que has obtingut en completar quadrats, recuperes exactament $x^2+y^2+2x$?
    nota_professor: |
      Convé que el dibuix mostri la tangència a l'origen: és la clau de l'apartat (c).
  - id: t5-9b
    apartat: b
    tipus: calcul
    enunciat: |
      Estudieu el signe de la funció $f$ en les diferents regions en què la corba $C_0$ divideix $\mathbb{R}^2$.
    teoria:
    - T2.4
    teoria_reservada: []
    resultat:
      valor: |
        - Semiplà $x>0$: $f>0$.
        - Interior del disc $(x+1)^2+y^2<1$: $f>0$.
        - Punts amb $x<0$ exteriors al disc, $(x+1)^2+y^2>1$: $f<0$.
      fuites:
      - interior\s+del\s+(disc|cercle)[^.\n]{0,40}f\s*>\s*0
      - exteriors?[^.\n]{0,60}f\s*<\s*0
    passos:
    - id: regions
      titol: Identificar les regions
      objectiu: |
        Determinar en quantes regions divideix $C_0$ el pla i descriure-les.
      idea: |
        Fer servir el dibuix de l'apartat (a): l'eix vertical separa dos semiplans, i la circumferència (continguda en un d'ells) en separa l'interior de l'exterior.
      detall: |
        Tres regions: el semiplà $x>0$; l'interior del disc $(x+1)^2+y^2<1$ (contingut a $x<0$); i la resta del semiplà $x<0$, és a dir els punts amb $x<0$ i $(x+1)^2+y^2>1$.
      fuites: []
      teoria: []
    - id: signes
      titol: Signe a cada regió
      objectiu: |
        Determinar el signe de $f$ a cada regió.
      idea: |
        Estudiar per separat el signe de cada factor: $x^3$ té el signe de $x$, i $x^2+y^2+2x=(x+1)^2+y^2-1$ és negatiu dins el disc i positiu fora.
      detall: |
        Si $x>0$: $x^3>0$ i $(x+1)^2>1$, per tant el segon factor és $>0$ i $f>0$.
        Dins el disc: segon factor $<0$ i $x<0$, per tant $f>0$.
        Exterior del disc amb $x<0$: segon factor $>0$ i $x^3<0$, per tant $f<0$.
      fuites:
      - exterior[^.\n]{0,80}f\s*<\s*0
      - dins\s+(el\s+)?disc[^.\n]{0,60}f\s*>\s*0
      teoria: []
    errors_comuns:
    - id: signe_x3
      descripcio: |
        Oblida que $x^3$ és negatiu per a $x<0$ i dona el mateix signe a tot el semiplà esquerre.
      pregunta: |
        Quin signe té $x^3$ quan $x$ és negatiu? I el segon factor, dins i fora del disc?
    - id: regio_dreta
      descripcio: |
        No justifica que el segon factor és positiu al semiplà $x>0$ (per exemple, pensa que la circumferència també talla aquest semiplà).
      pregunta: |
        La circumferència té algun punt amb $x>0$? Què implica això sobre el signe de $x^2+y^2+2x$ en aquell semiplà?
    nota_professor: |
      Les tres regions són connexes i $f$ és contínua i no s'anul·la a cap d'elles, de manera que n'hi ha prou a avaluar-la en un punt de cada una (per exemple $(1,0)$, $(-1,0)$, $(-3,0)$).
  - id: t5-9c
    apartat: c
    tipus: teoric
    enunciat: |
      Useu els apartats anteriors per determinar si el punt $(0,0)$ és un extrem local de $f$.
    teoria:
    - T5.21
    teoria_reservada: []
    resultat:
      valor: |
        $(0,0)$ no és un extrem local de $f$: $f(0,0)=0$ i tota bola centrada a l'origen conté punts del semiplà $x>0$ (on $f>0$) i punts amb $x<0$ exteriors al disc (on $f<0$), per exemple $(-s,\sqrt{2s})$ amb $f=-s^5$. De fet, com que $Df(0,0)=0$, és un punt de sella.
      fuites:
      - no\s+(és|es)\s+(un\s+)?extrem
      - (és|es)\s+(un\s+)?punt\s+de\s+sella
    passos:
    - id: punts_positius
      titol: Punts propers amb $f>0$
      objectiu: |
        Assumint els apartats (a) i (b), veure que tota bola centrada a l'origen conté punts on $f$ és més gran que $f(0,0)$.
      idea: |
        Mirar quines regions de l'apartat (b) tenen l'origen a la seva frontera.
      detall: |
        $f(0,0)=0$. Els punts $(t,0)$ amb $t>0$ petit són al semiplà $x>0$, on $f>0$ (per exemple $f(t,0)=t^5+2t^4>0$).
      fuites: []
      teoria: []
    - id: punts_negatius
      titol: Punts propers amb $f<0$
      objectiu: |
        Veure que tota bola centrada a l'origen conté també punts on $f<0$.
      idea: |
        La regió on $f<0$ és la part del semiplà esquerre fora del disc; com que la circumferència és tangent a l'eix vertical a l'origen, aquesta regió arriba fins a l'origen. Cal trobar una família explícita de punts en aquesta regió que tendeixin a l'origen.
      detall: |
        Per a $s>0$ petit, el punt $(-s,\sqrt{2s})$ compleix $x^2+y^2+2x=s^2+2s-2s=s^2>0$ i $x<0$: és exterior al disc, i $f(-s,\sqrt{2s})=s^2\cdot(-s^3)=-s^5<0$. La seva distància a l'origen, $\sqrt{s^2+2s}$, tendeix a $0$.
      fuites:
      - -\s*s\^\{?5
      - \\sqrt\s*\{\s*2\s*s\s*\}
      teoria: []
    - id: concloure
      titol: Concloure
      objectiu: |
        Decidir si l'origen és un extrem local de $f$.
      idea: |
        Comparar amb la definició de màxim i mínim local: cap de les dues desigualtats es pot complir en tota una bola.
      detall: |
        En tota bola $B((0,0),\epsilon)$ hi ha punts amb $f>f(0,0)$ i punts amb $f<f(0,0)$, de manera que l'origen no és ni màxim ni mínim local. Com que $f=2x^4+x^5+x^3y^2$ només té termes de grau $\geq4$, $Df(0,0)=0$: l'origen és un punt crític i, de fet, un punt de sella.
      fuites:
      - ni\s+m[àa]xim\s+ni\s+m[íi]nim
      teoria:
      - T5.21
      - T5.25
    errors_comuns:
    - id: nomes_eix_horitzontal
      descripcio: |
        Mira $f$ només sobre l'eix $y=0$, on $f(x,0)=x^4(x+2)\geq0$ prop de l'origen, i conclou que l'origen és un mínim.
      pregunta: |
        L'eix horitzontal passa per totes les regions de l'apartat (b) que toquen l'origen? N'hi ha alguna que no hagis visitat?
    - id: regio_negativa_lluny
      descripcio: |
        Creu que la regió on $f<0$ queda lluny de l'origen (a $x<-2$) perquè no veu que la circumferència és tangent a l'eix vertical.
      pregunta: |
        Al dibuix de l'apartat (a), entre la circumferència i l'eix vertical, hi ha punts del semiplà esquerre arbitràriament a prop de l'origen que no siguin dins el disc?
    - id: hessiana
      descripcio: |
        Intenta usar la hessiana, que a l'origen és nul·la, i conclou que no es pot decidir (o que és un extrem).
      pregunta: |
        L'enunciat et demana usar els apartats anteriors. Què et diu l'estudi de signes sobre els valors de $f$ a prop de l'origen?
    nota_professor: |
      La hessiana a l'origen és la matriu nul·la, de manera que l'estudi de signes és el mètode natural. També serveix qualsevol família de punts dins la regió negativa que tendeixi a l'origen, per exemple $(-s^3,s)$; en canvi $(-s^2,s)$ és dins el disc per a $s$ petit.
- num: 10
  font: null
  preambul: |
    Considereu la funció $f(x,y)=-y^4-e^{-x^2}+2y^2\sqrt{e^x+e^{-x^2}}$.
  indicacio: Podeu considerar $f(0,y)$. (Indicació de l'apartat e.)
  exercicis:
  - id: t5-10a
    apartat: a
    tipus: teoric
    enunciat: |
      Quin és el seu domini? Hi és de classe $\mathcal{C}^\infty$?
    teoria:
    - T3.31
    teoria_reservada: []
    resultat:
      valor: |
        El domini és tot $\mathbb{R}^2$, perquè $e^x+e^{-x^2}>0$ sempre. $f$ hi és de classe $\mathcal{C}^\infty$: és suma i producte de polinomis, exponencials i l'arrel quadrada composta amb una funció $\mathcal{C}^\infty$ estrictament positiva, i l'arrel és $\mathcal{C}^\infty$ a $(0,+\infty)$.
      fuites: []
    passos:
    - id: domini
      titol: Determinar el domini
      objectiu: |
        Determinar el conjunt de punts on l'expressió de $f$ té sentit.
      idea: |
        L'única operació que pot fallar és l'arrel quadrada: cal estudiar el signe del radicand.
      detall: |
        $e^x+e^{-x^2}>0$ per a tot $x$, ja que les exponencials són positives. Domini: $\mathbb{R}^2$.
      fuites: []
      teoria: []
    - id: regularitat
      titol: Regularitat
      objectiu: |
        Justificar si $f$ és de classe $\mathcal{C}^\infty$ a $\mathbb{R}^2$.
      idea: |
        Polinomis i exponencials són $\mathcal{C}^\infty$; sumes, productes i composicions de funcions $\mathcal{C}^\infty$ ho són (regla de la cadena aplicada repetidament). Cal comprovar que l'arrel s'aplica on és derivable.
      detall: |
        $\sqrt{\cdot}$ és $\mathcal{C}^\infty$ a $(0,+\infty)$ i el radicand és $\mathcal{C}^\infty$ i estrictament positiu, per tant $\sqrt{e^x+e^{-x^2}}$ és $\mathcal{C}^\infty$ a $\mathbb{R}^2$, i $f$, que s'obté amb sumes i productes, també.
      fuites: []
      teoria:
      - T3.21
      - T3.31
    errors_comuns:
    - id: arrel_no_derivable
      descripcio: |
        Diu que l'arrel no és derivable i per tant $f$ no és $\mathcal{C}^\infty$, sense mirar si el radicand s'anul·la.
      pregunta: |
        On deixa de ser derivable la funció $\sqrt{u}$? El radicand d'aquesta funció pot arribar a aquest valor?
    - id: domini_restringit
      descripcio: |
        Imposa alguna restricció innecessària al domini (per exemple $x\geq0$).
      pregunta: |
        Pot ser negatiu $e^x+e^{-x^2}$ per a algun $x$ real?
    nota_professor: |
      Apartat de rutina, però prepara els següents: cal $\mathcal{C}^2$ per aplicar el criteri de la hessiana i el teorema de Taylor.
  - id: t5-10b
    apartat: b
    tipus: teoric
    enunciat: |
      Proveu que el seu únic punt crític és $(0,0)$.
    teoria:
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        Amb $g(x)=e^x+e^{-x^2}$: $f_y=4y\big(\sqrt{g(x)}-y^2\big)$ i $f_x=2xe^{-x^2}+y^2\dfrac{e^x-2xe^{-x^2}}{\sqrt{g(x)}}$. Si $y=0$, $f_x=2xe^{-x^2}=0$ dona $x=0$. Si $y^2=\sqrt{g(x)}$, $f_x=e^x>0$, sense solucions. L'únic punt crític és $(0,0)$.
      fuites: []
    passos:
    - id: derivades
      titol: Calcular les derivades parcials
      objectiu: |
        Calcular $f_x$ i $f_y$.
      idea: |
        Anomenar $g(x)=e^x+e^{-x^2}$ i derivar $\sqrt{g(x)}$ amb la regla de la cadena; factoritzar $f_y$.
      detall: |
        $f_y=-4y^3+4y\sqrt{g(x)}=4y\big(\sqrt{g(x)}-y^2\big)$.
        $f_x=2xe^{-x^2}+2y^2\dfrac{g'(x)}{2\sqrt{g(x)}}=2xe^{-x^2}+y^2\dfrac{e^x-2xe^{-x^2}}{\sqrt{g(x)}}$.
      fuites:
      - 4\s*y\s*\\big\(|4\s*y\s*\(\s*\\sqrt
      teoria:
      - T3.21
    - id: cas_y_zero
      titol: Cas $y=0$
      objectiu: |
        Trobar els punts crítics amb $y=0$.
      idea: |
        Substituir $y=0$ a l'equació $f_x=0$.
      detall: |
        $f_x(x,0)=2xe^{-x^2}=0\iff x=0$. Punt crític $(0,0)$.
      fuites: []
      teoria:
      - T5.22
    - id: cas_altre_factor
      titol: L'altre factor de $f_y$
      objectiu: |
        Veure que no hi ha punts crítics on s'anul·la l'altre factor de $f_y$.
      idea: |
        Substituir la relació que dona aquest factor a l'expressió de $f_x$: hi ha una simplificació que deixa una expressió de signe constant.
      detall: |
        Si $y^2=\sqrt{g(x)}$: $f_x=2xe^{-x^2}+\big(e^x-2xe^{-x^2}\big)=e^x>0$. Mai s'anul·la, per tant no hi ha punts crítics en aquest cas.
      fuites:
      - f_x\s*=\s*e\^\{?x\}?\s*>\s*0
      - =\s*e\^\{?x\}?\s*>\s*0
      teoria:
      - T5.22
    errors_comuns:
    - id: divideix_per_y
      descripcio: |
        Divideix $f_y=0$ per $y$ i perd el cas $y=0$, o al revés, només considera $y=0$ i oblida l'altre factor.
      pregunta: |
        Quan un producte s'anul·la, quins casos cal estudiar? Els has estudiat tots dos?
    - id: derivada_arrel
      descripcio: |
        Deriva malament $\sqrt{e^x+e^{-x^2}}$ (oblida la regla de la cadena o el signe de la derivada de $e^{-x^2}$).
      pregunta: |
        Quina és la derivada de $e^{-x^2}$? I com es deriva l'arrel d'una funció de $x$?
    - id: no_simplifica
      descripcio: |
        En el segon cas s'encalla intentant resoldre una equació transcendent sense substituir la relació $y^2=\sqrt{g(x)}$.
      pregunta: |
        En aquest cas tens una relació entre $y^2$ i l'arrel. Què passa si la substitueixes dins de $f_x$ abans de fer res més?
    nota_professor: |
      La simplificació $f_x=e^x$ al segon cas és el punt clau i és molt neta.
  - id: t5-10c
    apartat: c
    tipus: calcul
    enunciat: |
      Calculeu el polinomi de Taylor de $f$ de grau $\leqslant3$ en $(0,0)$.
    teoria:
    - T5.14
    teoria_reservada: []
    resultat:
      valor: |
        $P_3(x,y)=-1+x^2+2\sqrt2\,y^2+\dfrac{\sqrt2}{2}\,xy^2$.
      fuites:
      - 2\s*\\sqrt\s*\{?2\}?\s*\\?,?\s*y\^\{?2
      - \\frac\s*\{\s*\\sqrt\s*\{?2\}?\s*\}\s*\{\s*2\s*\}\s*\\?,?\s*x\s*y\^\{?2
      - \\sqrt\s*\{?2\}?\s*/\s*2\s*\)?\s*\\?,?\s*x\s*y\^\{?2
      - -\s*1\s*\+\s*x\^\{?2
    passos:
    - id: estrategia
      titol: Triar el mètode
      objectiu: |
        Decidir com calcular el polinomi sense haver de fer totes les derivades fins a ordre 3.
      idea: |
        Per la unicitat del polinomi de Taylor, n'hi ha prou a combinar desenvolupaments d'una variable (exponencial, arrel) i quedar-se amb els termes de grau $\leq3$. El terme $-y^4$ no hi contribueix, i com que $\sqrt{\cdot}$ va multiplicat per $2y^2$, de l'arrel només cal el desenvolupament fins a grau 1 en $x$.
      detall: |
        $f=-y^4-e^{-x^2}+2y^2\,h(x)$ amb $h(x)=\sqrt{e^x+e^{-x^2}}$. Cal: $e^{-x^2}$ fins a grau 3 i $h(x)$ fins a grau 1.
      fuites: []
      teoria:
      - T5.16
      - T5.17
    - id: desenvolupaments
      titol: Desenvolupaments d'una variable
      objectiu: |
        Obtenir els desenvolupaments necessaris de $e^{-x^2}$ i de $\sqrt{e^x+e^{-x^2}}$ a $x=0$.
      idea: |
        Substituir $-x^2$ al desenvolupament de l'exponencial; per a l'arrel, desenvolupar el radicand i usar $\sqrt{2+u}=\sqrt2\sqrt{1+u/2}\approx\sqrt2(1+u/4)$.
      detall: |
        $e^{-x^2}=1-x^2+O(x^4)$. $e^x+e^{-x^2}=2+x+O(x^2)$, per tant $\sqrt{e^x+e^{-x^2}}=\sqrt2\big(1+\frac{x}{4}\big)+O(x^2)=\sqrt2+\frac{\sqrt2}{4}x+O(x^2)$.
      fuites:
      - \\frac\s*\{\s*\\sqrt\s*\{?2\}?\s*\}\s*\{\s*4\s*\}
      - 1\s*\+\s*\\frac\s*\{?\s*x\s*\}?\s*\{?\s*4
      teoria:
      - T5.8
    - id: combinar
      titol: Combinar i truncar
      objectiu: |
        Obtenir el polinomi de Taylor de grau $\leq3$ de $f$ a l'origen.
      idea: |
        Substituir els desenvolupaments a $f$ i quedar-se amb els monomis de grau total $\leq3$.
      detall: |
        $f=-y^4-(1-x^2)+2y^2\big(\sqrt2+\frac{\sqrt2}{4}x\big)+O_4=-1+x^2+2\sqrt2\,y^2+\frac{\sqrt2}{2}xy^2+O_4(x,y)$. Per tant $P_3(x,y)=-1+x^2+2\sqrt2\,y^2+\frac{\sqrt2}{2}xy^2$.
      fuites:
      - 2\s*\\sqrt\s*\{?2\}?\s*\\?,?\s*y\^\{?2
      - \\frac\s*\{\s*\\sqrt\s*\{?2\}?\s*\}\s*\{\s*2\s*\}\s*\\?,?\s*x\s*y\^\{?2
      teoria:
      - T5.14
      - T5.16
    errors_comuns:
    - id: termes_sobrants
      descripcio: |
        Inclou termes de grau 4 (com $-y^4$ o $x^4/2$) al polinomi de grau 3.
      pregunta: |
        Quin és el grau total del monomi $y^4$? Ha d'aparèixer en un polinomi de grau $\leq3$?
    - id: arrel_mal_desenvolupada
      descripcio: |
        Desenvolupa l'arrel com $\sqrt{e^x}+\sqrt{e^{-x^2}}$ o oblida el factor $\sqrt2$.
      pregunta: |
        L'arrel d'una suma és la suma de les arrels? Quant val $\sqrt{e^x+e^{-x^2}}$ a $x=0$?
    - id: oblida_terme_xy2
      descripcio: |
        Només desenvolupa l'arrel fins a grau 0 i perd el terme $xy^2$, que és de grau 3.
      pregunta: |
        El factor $2y^2$ ja té grau 2. Fins a quin grau en $x$ necessites l'arrel perquè el producte arribi a grau 3?
    nota_professor: |
      Comprovat amb sympy. Alternativament es poden calcular les derivades parcials a l'origen: $f_{xx}=2$, $f_{yy}=4\sqrt2$, $f_{xyy}=\sqrt2$, la resta de derivades d'ordre $\leq3$ nul·les.
  - id: t5-10d
    apartat: d
    tipus: calcul
    enunciat: |
      Determineu el caràcter del punt crític de $f$.
    teoria:
    - T5.21
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        $Hf(0,0)=\begin{pmatrix}2&0\\0&4\sqrt2\end{pmatrix}$, definida positiva: $(0,0)$ és un mínim local estricte, amb $f(0,0)=-1$.
      fuites:
      - m[íi]nim\s+local
      - 2\s*&\s*0\s*\\\\\s*0\s*&\s*4\s*\\sqrt
    passos:
    - id: hessiana
      titol: Obtenir la hessiana a l'origen
      objectiu: |
        Obtenir la matriu hessiana de $f$ a $(0,0)$.
      idea: |
        Llegir-la del polinomi de Taylor de l'apartat (c): la part de grau 2 és $\frac12$ de la forma hessiana (o bé derivar directament).
      detall: |
        La part de grau 2 de $P_3$ és $x^2+2\sqrt2\,y^2=\frac12\big(2x^2+4\sqrt2\,y^2\big)$, per tant $Hf(0,0)=\begin{pmatrix}2&0\\0&4\sqrt2\end{pmatrix}$.
      fuites:
      - 2\s*&\s*0\s*\\\\\s*0\s*&\s*4\s*\\sqrt
      teoria:
      - T5.14
      - T5.16
      - T5.32
    - id: classificar
      titol: Classificar
      objectiu: |
        Decidir el caràcter del punt crític a partir de la hessiana.
      idea: |
        Aplicar les condicions suficients d'extrem: determinar el signe de la forma hessiana pels seus valors propis.
      detall: |
        La hessiana és diagonal amb valors propis $2>0$ i $4\sqrt2>0$: definida positiva. Per tant $(0,0)$ és un mínim local estricte, amb $f(0,0)=-1$.
      fuites:
      - definida\s+positiva
      - m[íi]nim\s+local
      teoria:
      - T5.33
      - T5.29
    errors_comuns:
    - id: factor_un_mig
      descripcio: |
        Llegeix la hessiana del polinomi de Taylor oblidant el factor $\frac12$ (per exemple, posa $1$ i $2\sqrt2$ a la diagonal).
      pregunta: |
        Quin coeficient acompanya la forma hessiana al terme de grau 2 de la fórmula de Taylor?
    - id: confon_local_absolut
      descripcio: |
        Afirma que l'origen és un mínim absolut perquè és l'únic punt crític i és un mínim local.
      pregunta: |
        El teorema de condicions suficients et dona informació local o global?
    nota_professor: |
      Encara que el signe de la diagonal no canviaria la conclusió, convé insistir en el factor $\frac12$. L'error `confon_local_absolut` és justament el que desmunta l'apartat (e).
  - id: t5-10e
    apartat: e
    tipus: teoric
    enunciat: |
      Proveu que $f$ no té mínim absolut. (Indicació: podeu considerar $f(0,y)$.)
    teoria:
    - T5.21
    teoria_reservada: []
    resultat:
      valor: |
        $f(0,y)=-y^4+2\sqrt2\,y^2-1\to-\infty$ quan $y\to\infty$, de manera que $f$ no està fitada inferiorment i no té mínim absolut (tot i que $(0,0)$ és un mínim local estricte i l'únic punt crític).
      fuites: []
    passos:
    - id: restriccio
      titol: Restringir a l'eix vertical
      objectiu: |
        Calcular $f(0,y)$.
      idea: |
        Substituir $x=0$ a l'expressió de $f$.
      detall: |
        $f(0,y)=-y^4-1+2y^2\sqrt{1+1}=-y^4+2\sqrt2\,y^2-1$.
      fuites:
      - -\s*y\^\{?4\}?\s*\+\s*2\s*\\sqrt\s*\{?2
      teoria: []
    - id: no_fitada
      titol: Concloure
      objectiu: |
        Deduir que $f$ no té mínim absolut.
      idea: |
        Estudiar el comportament de $f(0,y)$ quan $|y|$ creix: el terme dominant decideix. Si una funció no està fitada inferiorment, no pot tenir mínim absolut.
      detall: |
        $f(0,y)=-y^4+2\sqrt2\,y^2-1\to-\infty$ quan $|y|\to\infty$, ja que domina $-y^4$. Per tant per a qualsevol candidat $p$ existeix $y$ amb $f(0,y)<f(p)$: no hi ha mínim absolut. Per exemple, $f(0,2)=-17+8\sqrt2<-1=f(0,0)$, de manera que el mínim local de l'apartat (d) no és absolut.
      fuites:
      - -\s*\\infty
      - -\s*17\s*\+\s*8\s*\\sqrt
      teoria: []
    errors_comuns:
    - id: unic_critic_absolut
      descripcio: |
        Argumenta que, com que $(0,0)$ és l'únic punt crític i és mínim local, ha de ser el mínim absolut.
      pregunta: |
        Si $f$ tingués mínim absolut, on hauria d'estar? Compara $f(0,0)$ amb el valor de $f$ en algun punt de l'eix vertical llunyà.
    - id: compara_un_punt
      descripcio: |
        Troba un punt amb $f<f(0,0)$ i conclou que no hi ha mínim absolut, sense descartar que el mínim s'assoleixi en un altre punt.
      pregunta: |
        Trobar un punt amb valor menor que $f(0,0)$ descarta l'origen. Descarta també tots els altres punts del pla?
    nota_professor: |
      Fenomen notable: en una variable, una funció derivable amb un únic punt crític que és mínim local té mínim absolut; en dues variables no. Un argument alternatiu complet: si hi hagués mínim absolut seria un punt crític, per tant $(0,0)$, però $f(0,2)<f(0,0)$.
- num: 11
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t5-11
    apartat: null
    tipus: calcul
    enunciat: |
      Calculeu el polinomi de Taylor de grau $\leqslant3$ de la funció $f(x,y)=(x-1+\sin^2y)\log(x-y)$ en el punt $(1,0)$. És $(1,0)$ un extrem local de $f(x,y)$?
    teoria:
    - T5.14
    - T5.21
    teoria_reservada: []
    resultat:
      valor: |
        Amb $u=x-1$: $P_3(x,y)=u^2-uy-\frac12u^3+u^2y+\frac12uy^2-y^3$, és a dir,
        $P_3(x,y)=(x-1)^2-(x-1)y-\frac12(x-1)^3+(x-1)^2y+\frac12(x-1)y^2-y^3$.
        El punt $(1,0)$ és crític (no hi ha termes de grau $1$), però la hessiana $Hf(1,0)=\begin{pmatrix}2&-1\\-1&0\end{pmatrix}$ té determinant $-1<0$: és indefinida i $(1,0)$ és un punt de sella, no un extrem local.
      fuites:
      - punt\s+de\s+sella
      - no\s+(és|és\s+pas|pot\s+ser)\s+(un\s+)?extrem
      - -\s*\(x\s*-\s*1\)\s*(\\[,;:! ]|\s)*y\b
      - -\s*y\s*(\\[,;:! ]|\s)*\(x\s*-\s*1\)
      - -\s*u\s*(\\[,;:! ]|\s)*y\b
    passos:
    - id: desenvolupar_factors
      titol: Desenvolupar cada factor
      objectiu: |
        Obtenir els desenvolupaments de Taylor fins a grau $3$ de cadascun dels dos factors de $f$ al voltant de $(1,0)$.
      idea: |
        Canviar a la variable $u=x-1$ (centre a l'origen) i usar desenvolupaments coneguts d'una variable ($\log(1+z)$, $\sin y$) substituint-hi l'expressió adequada; la unicitat del polinomi de Taylor garanteix que el resultat és el polinomi de Taylor.
      detall: |
        Amb $u=x-1$ tenim $x-y=1+(u-y)$ i, posant $z=u-y$ a $\log(1+z)=z-\frac{z^2}{2}+\frac{z^3}{3}+O_4(z)$:
        $\log(x-y)=(u-y)-\frac12(u-y)^2+\frac13(u-y)^3+O_4(u,y)$.
        D'altra banda $\sin y=y+O_3(y)$, de manera que $\sin^2y=y^2+O_4(y)$ i el primer factor és $u+y^2+O_4(u,y)$.
      fuites:
      - \(u\s*-\s*y\)\^\{?2\}?
      - \\sin\^\{?2\}?\s*y\s*=\s*y\^\{?2\}?
      teoria:
      - T5.16
      - T5.17
    - id: producte
      titol: Multiplicar i truncar
      objectiu: |
        Obtenir $P_3$ multiplicant els desenvolupaments i quedant-se amb els monomis de grau $\leq 3$.
      idea: |
        El primer factor no té terme constant, així que del segon factor només calen els termes de grau $\leq 2$; tots els productes de grau $\geq 4$ van al residu.
      detall: |
        $(u+y^2)\left((u-y)-\frac12(u-y)^2\right)=u^2-uy-\frac12u(u^2-2uy+y^2)+uy^2-y^3+O_4$
        $=u^2-uy-\frac12u^3+u^2y+\frac12uy^2-y^3+O_4(u,y)$.
        Per tant $P_3(x,y)=(x-1)^2-(x-1)y-\frac12(x-1)^3+(x-1)^2y+\frac12(x-1)y^2-y^3$ (i $f(1,0)=0$).
      fuites:
      - -\s*u\s*(\\[,;:! ]|\s)*y\b
      - -\s*\(x\s*-\s*1\)\s*(\\[,;:! ]|\s)*y\b
      - \\[dt]?frac\s*\{?1\}?\s*\{?2\}?\s*u\s*(\\[,;:! ]|\s)*y\^\{?2\}?
      - u\s*y\^\{?2\}?\s*/\s*2
      teoria:
      - T5.16
      - T5.17
    - id: hessiana
      titol: Punt crític i hessiana
      objectiu: |
        Comprovar si $(1,0)$ és un punt crític i obtenir la matriu hessiana de $f$ en $(1,0)$ a partir del polinomi.
      idea: |
        Els termes de grau $1$ de $P_3$ són $Df(1,0)$; la part de grau $2$ és $\frac12$ de la forma quadràtica hessiana, i en podem llegir les derivades segones.
      detall: |
        $P_3$ no té termes de grau $1$, per tant $Df(1,0)=(0\ \ 0)$ i $(1,0)$ és crític.
        La part quadràtica és $u^2-uy=\frac12\left(2u^2-2uy+0\cdot y^2\right)$, d'on $f_{xx}(1,0)=2$, $f_{xy}(1,0)=-1$, $f_{yy}(1,0)=0$:
        $Hf(1,0)=\begin{pmatrix}2&-1\\-1&0\end{pmatrix}$.
      fuites:
      - pmatrix\}\s*2\s*&\s*-\s*1
      - f_\{?xy\}?\s*\(1\s*,\s*0\)\s*=\s*-\s*1
      teoria:
      - T5.14
      - T5.22
      - T5.32
    - id: classificar
      titol: Classificar el punt
      objectiu: |
        Decidir el caràcter del punt crític $(1,0)$.
      idea: |
        Estudiar el signe de la forma quadràtica hessiana (en dues variables, el signe del determinant i de la traça) i aplicar les condicions suficients de segon ordre.
      detall: |
        $\det Hf(1,0)=2\cdot0-(-1)^2=-1<0$, per tant els valors propis tenen signes oposats i la forma és indefinida. Com que $f$ és $\mathcal{C}^2$ en un entorn de $(1,0)$ (on $x-y>0$), $(1,0)$ és un punt de sella i no és extrem local.
        Comprovació directa: $f(x,0)=(x-1)\log x>0$ per $x\neq1$ proper a $1$, mentre que $f(1,y)=\sin^2y\,\log(1-y)<0$ per $y>0$ petit.
      fuites:
      - \\det\s*Hf\s*\(1\s*,\s*0\)\s*=\s*.*-\s*1\s*<\s*0
      - indefinida
      - punt\s+de\s+sella
      teoria:
      - T5.30
      - T5.33
      - T5.25
    errors_comuns:
    - id: sin2_grau1
      descripcio: |
        Desenvolupa $\sin^2y$ com si fos $y$ (o hi posa un terme $-y^3/3$), confonent $\sin^2y$ amb $\sin y$.
      pregunta: |
        Si $\sin y$ comença per $y$, per quina potència de $y$ comença el seu quadrat? Quin és el primer terme que hi falta després?
    - id: truncar_malament
      descripcio: |
        Multiplica els desenvolupaments i oblida termes creuats de grau $3$ (per exemple els de $u\cdot(u-y)^2$ o $y^2\cdot(u-y)$), o en manté de grau $4$.
      pregunta: |
        Has revisat, terme a terme, tots els productes d'un monomi del primer factor per un del segon que donen grau exactament $3$?
    - id: oblida_punt_critic
      descripcio: |
        Classifica el punt amb la hessiana sense comprovar abans que és crític, o creu que el grau $3$ del polinomi decideix el caràcter.
      pregunta: |
        El criteri de la hessiana té una hipòtesi sobre el punt. Quina és, i com la pots comprovar mirant $P_3$?
    - id: determinant_signe
      descripcio: |
        Amb $f_{yy}=0$ creu que la hessiana és semidefinida o que el criteri no decideix, sense calcular el determinant.
      pregunta: |
        Un zero a la diagonal vol dir que la forma no pren valors dels dos signes? Què diu el determinant sobre el signe dels valors propis?
    nota_professor: |
      $f$ és $\mathcal{C}^\infty$ en el semiplà $x>y$, que conté $(1,0)$, així que la unicitat del polinomi de Taylor justifica el càlcul per desenvolupaments. El terme $\frac13(u-y)^3$ del logaritme no contribueix a $P_3$ perquè el primer factor no té terme constant. Alternativa a la hessiana: restriccions $f(x,0)$ i $f(1,y)$, que prenen signes oposats.
- num: 12
  font: null
  preambul: |
    Sigui $f(x,y)=-3x^2y^2+x^3y^3$.
  indicacio: null
  exercicis:
  - id: t5-12a
    apartat: a
    tipus: calcul
    enunciat: |
      Calculeu-ne els punts crítics.
    teoria:
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        Els punts crítics són tots els punts dels dos eixos ($x=0$ o $y=0$) i tots els punts de la hipèrbola $xy=2$:
        $\{(x,y): xy=0\}\cup\{(x,y): xy=2\}$.
      fuites:
      - x\s*y\s*=\s*2
      - hip[èe]rbola
    passos:
    - id: gradient
      titol: Calcular i factoritzar el gradient
      objectiu: |
        Calcular les derivades parcials de $f$ i escriure-les en forma factoritzada.
      idea: |
        Treure factor comú a cada derivada parcial: les dues comparteixen un mateix factor que depèn només del producte $xy$.
      detall: |
        $f_x=-6xy^2+3x^2y^3=3xy^2(xy-2)$, $\quad f_y=-6x^2y+3x^3y^2=3x^2y(xy-2)$.
        Com que $f$ és polinòmica, és diferenciable a tot $\mathbb{R}^2$.
      fuites:
      - 3\s*x\s*y\^\{?2\}?\s*\(\s*x\s*y\s*-\s*2\s*\)
      - 3\s*x\^\{?2\}?\s*y\s*\(\s*x\s*y\s*-\s*2\s*\)
      teoria:
      - T3.2
      - T5.22
    - id: resoldre
      titol: Resoldre el sistema
      objectiu: |
        Trobar tots els punts on s'anul·len simultàniament les dues derivades parcials.
      idea: |
        Un producte és zero quan algun factor ho és; distingir el cas en què s'anul·la el factor comú del cas en què s'anul·len els altres factors.
      detall: |
        Si $xy=2$, les dues parcials s'anul·len. Si $xy\neq2$, cal $xy^2=0$ i $x^2y=0$, és a dir $x=0$ o $y=0$ (i qualsevol punt d'un eix anul·la totes dues).
        Punts crítics: els dos eixos $\{xy=0\}$ i la hipèrbola $\{xy=2\}$.
      fuites:
      - x\s*y\s*=\s*2
      - hip[èe]rbola
      teoria:
      - T5.22
    errors_comuns:
    - id: dividir_per_variables
      descripcio: |
        Divideix per $x$ o per $y$ en resoldre el sistema i perd els punts dels eixos (o bé només troba l'origen).
      pregunta: |
        En simplificar les equacions, has dividit per alguna expressió? Què passa amb els punts on aquesta expressió val zero?
    - id: nomes_origen
      descripcio: |
        Troba només punts aïllats (per exemple $(0,0)$ o uns quants punts concrets) en lloc de corbes senceres de punts crítics.
      pregunta: |
        Si prens un punt qualsevol de l'eix $x$, per exemple $(5,0)$, s'anul·la el gradient? Què et diu això sobre la forma del conjunt de punts crítics?
    - id: derivada_malament
      descripcio: |
        Deriva malament algun terme (exponents o coeficients de $x^3y^3$).
      pregunta: |
        Pots comprovar les teves parcials derivant $f$ com a funció de $t=xy$ amb la regla de la cadena?
    nota_professor: |
      Observació útil per a l'apartat (b): $f(x,y)=g(xy)$ amb $g(t)=t^3-3t^2$, i $g'(t)=3t(t-2)$; per això els punts crítics són exactament $\{xy=0\}\cup\{xy=2\}$.
  - id: t5-12b
    apartat: b
    tipus: teoric
    enunciat: |
      Sense usar derivades segones, raoneu el caràcter dels punts crítics de $f(x,y)$ que es troben a la bola unitat $B(\mathbf{0},1)$.
    teoria:
    - T5.21
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        Els punts crítics de $B(\mathbf{0},1)$ són els punts dels eixos amb $\|(x,y)\|<1$ (la hipèrbola $xy=2$ queda fora de la bola). Tots són màxims locals no estrictes: dins de la bola $f(x,y)=(xy)^2(xy-3)\leq0=f(p)$, i $f$ és constantment $0$ sobre els eixos.
      fuites:
      - m[àa]xims?\s+locals?\s+no\s+estrict
      - m[àa]xims?\s+(locals?\s+)?no\s+estrict
    passos:
    - id: punts_a_la_bola
      titol: Quins punts crítics hi ha a la bola
      objectiu: |
        Sabent per l'apartat (a) que els punts crítics són els dels eixos i els de la hipèrbola $xy=2$, determinar quins són a $B(\mathbf{0},1)$.
      idea: |
        Comparar $x^2+y^2$ amb $|xy|$ mitjançant una desigualtat elemental.
      detall: |
        Com que $x^2+y^2\geq2|xy|$, els punts amb $xy=2$ compleixen $x^2+y^2\geq4$: cap és a la bola. Els punts crítics de la bola són els dels eixos: $(x,0)$ amb $|x|<1$ i $(0,y)$ amb $|y|<1$, on $f$ val $0$.
      fuites:
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*(\\ge|\\geq|≥)\s*4
      teoria: []
    - id: reescriure
      titol: Reescriure f en funció de xy
      objectiu: |
        Escriure $f$ d'una manera que en faci evident el signe.
      idea: |
        $f$ només depèn del producte $t=xy$: factoritzar com a polinomi en $t$.
      detall: |
        Amb $t=xy$, $f(x,y)=-3t^2+t^3=t^2(t-3)$.
      fuites:
      - t\^\{?2\}?\s*\(\s*t\s*-\s*3\s*\)
      - \(x\s*y\)\^\{?2\}?\s*\(\s*x\s*y\s*-\s*3\s*\)
      teoria: []
    - id: signe_i_caracter
      titol: Signe a la bola i conclusió
      objectiu: |
        Comparar $f$ en un entorn de cada punt crític de la bola amb el valor de $f$ en aquest punt, i deduir-ne el caràcter.
      idea: |
        Fitar $|xy|$ dins de la bola per saber el signe de cada factor, i aplicar la definició d'extrem local (la bola és oberta, així que conté un entorn de cada punt seu).
      detall: |
        A $B(\mathbf{0},1)$, $|xy|\leq\frac12(x^2+y^2)<\frac12$, de manera que $t-3<0$ i $f=t^2(t-3)\leq0$, amb igualtat si i només si $t=0$. Per a $p$ a un eix de la bola, $f(p)=0$, i prenent $\epsilon$ amb $B(p,\epsilon)\subseteq B(\mathbf{0},1)$ es té $f(x,y)\leq f(p)$ a $B(p,\epsilon)$: $p$ és màxim local. No és estricte perquè $f=0$ en tots els punts de l'eix propers a $p$.
      fuites:
      - t\s*-\s*3\s*<\s*0
      - f\s*(\\le|\\leq|≤)\s*0
      - m[àa]xim\s+local
      teoria:
      - T5.21
    errors_comuns:
    - id: hipèrbola_dins
      descripcio: |
        Inclou (o no descarta raonadament) punts de $xy=2$ dins la bola.
      pregunta: |
        Si $|xy|=2$, quant ha de valer com a mínim $x^2+y^2$?
    - id: estricte
      descripcio: |
        Afirma que són extrems estrictes, oblidant que els punts crítics no són aïllats.
      pregunta: |
        Quant val $f$ als punts de l'eix que estan molt a prop de $p$? Compleixen la desigualtat estricta de la definició?
    - id: usa_hessiana
      descripcio: |
        Intenta usar la hessiana (prohibit per l'enunciat; a més, als eixos és semidefinida i no decideix).
      pregunta: |
        L'enunciat no et deixa usar derivades segones. Hi ha alguna manera d'escriure $f$ que et digui directament el seu signe?
    - id: signe_sense_fita
      descripcio: |
        Afirma $f\leq0$ sense justificar per què $xy-3<0$, o ho conclou al pla sencer.
      pregunta: |
        El signe de $f$ és el mateix a tot el pla? Què fa servir el teu raonament de la condició de ser dins la bola?
    nota_professor: |
      Fora de la bola: tots els punts dels eixos són de fet màxims locals no estrictes (prop d'un eix, $|xy|$ és petit), i els punts de $xy=2$ són mínims locals no estrictes, perquè $g(t)=t^2(t-3)$ té un mínim local a $t=2$ amb $g(2)=-4$. La restricció a la bola simplifica la fita $|xy|<1/2$.
- num: 13
  font: null
  preambul: |
    Considerem la funció $f(x,y)=e^{x-y}\left(\cos(x+1)-\sin(y+1)-1\right)$ i el punt $p=(-1,-1)$.
  indicacio: null
  exercicis:
  - id: t5-13a
    apartat: a
    tipus: calcul
    enunciat: |
      Calculeu el polinomi de Taylor de grau $\leqslant3$ de $f$ en $p$.
    teoria:
    - T5.14
    teoria_reservada: []
    resultat:
      valor: |
        Amb $u=x+1$, $v=y+1$:
        $P_3=-v-\frac12u^2-uv+v^2-\frac12u^3+uv^2-\frac13v^3$, és a dir,
        $P_3(x,y)=-(y+1)-\frac12(x+1)^2-(x+1)(y+1)+(y+1)^2-\frac12(x+1)^3+(x+1)(y+1)^2-\frac13(y+1)^3$.
      fuites:
      - -\s*\\[dt]?frac\s*\{?1\}?\s*\{?3\}?\s*v\^\{?3\}?
      - -\s*v\^\{?3\}?\s*/\s*3
      - -\s*\\[dt]?frac\s*\{?1\}?\s*\{?3\}?\s*\(y\s*\+\s*1\)\^\{?3\}?
      - \+\s*u\s*(\\[,;:! ]|\s)*v\^\{?2\}?
      - \+\s*\(x\s*\+\s*1\)\s*(\\[,;:! ]|\s)*\(y\s*\+\s*1\)\^\{?2\}?
    passos:
    - id: canvi_i_factors
      titol: Centrar i desenvolupar els factors
      objectiu: |
        Escriure $f$ en variables centrades en $p$ i desenvolupar cada factor fins a grau $3$.
      idea: |
        Amb $u=x+1$, $v=y+1$ s'observa que $x-y=u-v$; usar els desenvolupaments d'una variable de l'exponencial, el cosinus i el sinus, justificats per la unicitat del polinomi de Taylor.
      detall: |
        $f=e^{u-v}\left(\cos u-\sin v-1\right)$.
        $\cos u-1-\sin v=-v-\frac12u^2+\frac16v^3+O_4(u,v)$ i $e^{u-v}=1+(u-v)+\frac12(u-v)^2+O_3(u,v)$.
      fuites:
      - -\s*v\s*-\s*\\[dt]?frac\s*\{?1\}?\s*\{?2\}?\s*u\^\{?2\}?
      - \\[dt]?frac\s*\{?1\}?\s*\{?6\}?\s*v\^\{?3\}?
      - v\^\{?3\}?\s*/\s*6
      teoria:
      - T5.16
      - T5.17
    - id: producte
      titol: Multiplicar per graus
      objectiu: |
        Obtenir els termes de grau $1$, $2$ i $3$ del producte.
      idea: |
        El segon factor no té terme constant: el terme de grau $k$ del producte combina el de grau $j\geq1$ del segon factor amb el de grau $k-j$ de l'exponencial.
      detall: |
        Grau 1: $-v$. Grau 2: $-\frac12u^2+(u-v)(-v)=-\frac12u^2-uv+v^2$.
        Grau 3: $\frac16v^3+(u-v)\left(-\frac12u^2\right)+\frac12(u-v)^2(-v)=-\frac12u^3+uv^2-\frac13v^3$.
        $P_3=-v-\frac12u^2-uv+v^2-\frac12u^3+uv^2-\frac13v^3$, amb $u=x+1$, $v=y+1$ (i $f(p)=0$).
      fuites:
      - -\s*\\[dt]?frac\s*\{?1\}?\s*\{?3\}?\s*v\^\{?3\}?
      - -\s*v\^\{?3\}?\s*/\s*3
      - -\s*u\s*(\\[,;:! ]|\s)*v\s*\+\s*v\^\{?2\}?
      - \+\s*u\s*(\\[,;:! ]|\s)*v\^\{?2\}?
      teoria:
      - T5.16
    errors_comuns:
    - id: no_centrar
      descripcio: |
        Desenvolupa $\cos(x+1)$ i $\sin(y+1)$ en potències de $x$ i $y$ (al voltant de l'origen) en lloc de $x+1$ i $y+1$.
      pregunta: |
        Al voltant de quin punt has de desenvolupar? En quines variables petites s'escriu aleshores l'argument del cosinus?
    - id: exponencial_mal_centrada
      descripcio: |
        Escriu $e^{x-y}$ com $e^{u-v}$ multiplicat per una constant incorrecta, o desenvolupa $e^{x-y}$ al voltant de $0$ en $x,y$.
      pregunta: |
        Què val $x-y$ en termes de $u=x+1$ i $v=y+1$? Hi apareix alguna constant?
    - id: oblida_creuats
      descripcio: |
        Oblida termes de grau $3$ que provenen de $(u-v)^2\cdot(-v)$ o de $(u-v)\cdot(-\frac12u^2)$.
      pregunta: |
        Quins parells de termes (un de cada factor) tenen graus que sumen exactament $3$? Els has inclòs tots?
    nota_professor: |
      Comprovat amb sympy. Els termes $u^2v$ s'anul·len: $+\frac12u^2v$ de $(u-v)(-\frac12u^2)$ i $-\frac12u^2v$ de $\frac12(u-v)^2(-v)$.
  - id: t5-13b
    apartat: b
    tipus: calcul
    enunciat: |
      Useu el polinomi per determinar la hessiana de $f$ en $p$.
    teoria:
    - T5.32
    teoria_reservada: []
    resultat:
      valor: |
        $Hf(p)=\begin{pmatrix}-1&-1\\-1&2\end{pmatrix}$, és a dir $f_{xx}(p)=-1$, $f_{xy}(p)=-1$, $f_{yy}(p)=2$.
      fuites:
      - matrix\}\s*-\s*1\s*&\s*-\s*1\s*\\\\\s*-\s*1\s*&\s*2
      - f_\{?yy\}?\s*\(p\)\s*=\s*2
      - f_\{?xy\}?\s*\(p\)\s*=\s*-\s*1
      - f_\{?xx\}?\s*\(p\)\s*=\s*-\s*1
    passos:
    - id: relacio
      titol: Relació entre part quadràtica i hessiana
      objectiu: |
        Sabent el polinomi de l'apartat (a), identificar quina relació hi ha entre els seus termes de grau $2$ i les derivades segones de $f$ en $p$.
      idea: |
        Comparar amb la fórmula de Taylor: el terme de grau $2$ és $\frac12$ de la forma quadràtica hessiana avaluada en $(x+1,y+1)$.
      detall: |
        Termes de grau $2$: $\frac12\left(f_{xx}(p)u^2+2f_{xy}(p)uv+f_{yy}(p)v^2\right)$, on per Schwarz $f_{xy}=f_{yx}$ ($f$ és $\mathcal{C}^\infty$). Cal igualar-ho a $-\frac12u^2-uv+v^2$.
      fuites: []
      teoria:
      - T5.14
      - T5.6
    - id: llegir
      titol: Llegir els coeficients
      objectiu: |
        Obtenir les derivades segones i escriure la matriu hessiana.
      idea: |
        Identificar coeficient a coeficient; compte amb el factor $2$ del terme creuat.
      detall: |
        $\frac12f_{xx}=-\frac12\Rightarrow f_{xx}(p)=-1$; $f_{xy}(p)=-1$; $\frac12f_{yy}=1\Rightarrow f_{yy}(p)=2$.
        $Hf(p)=\begin{pmatrix}-1&-1\\-1&2\end{pmatrix}$.
      fuites:
      - f_\{?yy\}?\s*\(p\)\s*=\s*2
      - f_\{?xy\}?\s*\(p\)\s*=\s*-\s*1
      - matrix\}\s*-\s*1\s*&\s*-\s*1
      teoria:
      - T5.32
    errors_comuns:
    - id: oblida_factor_meitat
      descripcio: |
        Pren directament els coeficients de $u^2$ i $v^2$ com a $f_{xx}$ i $f_{yy}$, oblidant el $\frac12$ de la fórmula de Taylor.
      pregunta: |
        A la fórmula de Taylor, quin factor multiplica la suma de derivades segones? Quin és aleshores el coeficient de $u^2$?
    - id: creuat_dividit
      descripcio: |
        Divideix el coeficient de $uv$ entre $2$ (o el multiplica), obtenint $f_{xy}=-\frac12$ o $-2$.
      pregunta: |
        Quantes vegades apareix el producte $uv$ a $\frac12\sum_{i,j}D_{ij}f(p)u_iu_j$?
    nota_professor: |
      Comprovació directa: $f_x=e^{x-y}(\cos(x+1)-\sin(y+1)-1-\sin(x+1))$, etc.; dona els mateixos valors.
  - id: t5-13c
    apartat: c
    tipus: teoric
    enunciat: |
      És $p$ un extrem local de $f$?
    teoria:
    - T5.21
    teoria_reservada: []
    resultat:
      valor: |
        No. El polinomi té terme de grau $1$ igual a $-(y+1)$, de manera que $\nabla f(p)=(0,-1)\neq(0,0)$: $p$ no és un punt crític i, com que $f$ és diferenciable, no pot ser extrem local.
      fuites:
      - no\s+és\s+(un\s+)?punt\s+crític
      - no\s+(és|pot\s+ser)\s+(un\s+)?extrem
      - \(\s*0\s*(,|\\[,;:! ]|\\quad|\s)*-\s*1\s*\)
      - f_\{?y\}?\s*\(p\)\s*=\s*-\s*1
      - \\partial\s*y\}?\s*\(p\)\s*=\s*-\s*1
    passos:
    - id: gradient
      titol: Llegir el gradient
      objectiu: |
        Usant el polinomi de l'apartat (a), determinar $Df(p)$.
      idea: |
        Els termes de grau $1$ del polinomi de Taylor són $Df(p)$ aplicada a $(x+1,y+1)$.
      detall: |
        L'única part lineal és $-(y+1)$, per tant $f_x(p)=0$ i $f_y(p)=-1$: $Df(p)=(0\ \ -1)\neq0$.
      fuites:
      - f_\{?y\}?\s*\(p\)\s*=\s*-\s*1
      - \\partial\s*y\}?\s*\(p\)\s*=\s*-\s*1
      - \(\s*0\s*(,|\\[,;:! ]|\\quad|\s)*-\s*1\s*\)
      teoria:
      - T5.14
    - id: concloure
      titol: Concloure
      objectiu: |
        Decidir si $p$ pot ser un extrem local.
      idea: |
        Usar la condició necessària d'extrem per a funcions diferenciables.
      detall: |
        $f$ és diferenciable en $p$ i $Df(p)\neq0$, així que $p$ no és punt crític; pel resultat que diu que els extrems locals d'una funció diferenciable són crítics, $p$ no és extrem local (la hessiana no hi té cap paper).
      fuites:
      - no\s+és\s+(un\s+)?punt\s+crític
      teoria:
      - T5.22
      - T5.23
    errors_comuns:
    - id: usa_hessiana
      descripcio: |
        Usa la hessiana de (b) (indefinida, $\det=-3$) per concloure que $p$ és un punt de sella, sense mirar si $p$ és crític.
      pregunta: |
        El criteri de la hessiana té una hipòtesi sobre el punt. Es compleix aquí? Mira els termes de grau $1$ del polinomi.
    - id: sella_no_critic
      descripcio: |
        Anomena "punt de sella" un punt no crític.
      pregunta: |
        Segons la definició, quina condició ha de complir un punt per poder-se anomenar punt de sella?
    nota_professor: |
      L'apartat (b) és un parany: la hessiana existeix i és indefinida, però el que decideix és el terme lineal. Directament, $f(-1,y)=e^{-1-y}(-\sin(y+1))$ canvia de signe en $y=-1$.
- num: 14
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t5-14
    apartat: null
    tipus: calcul
    enunciat: |
      Sigui $\varphi:\mathbb{R}\to\mathbb{R}$ una funció derivable i tal que $a<b$ en són els únics zeros, complint a més $\varphi'(a)>0$ i $\varphi'(b)<0$. Considerem la funció $f(x,y)=\int_x^y\varphi(t)\,dt$. Calculeu els punts crítics de $f$, discutiu-ne el caràcter i interpreteu els resultats obtinguts.
    teoria:
    - T5.21
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        $\nabla f(x,y)=(-\varphi(x),\varphi(y))$; punts crítics: $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$.
        $\varphi<0$ a $(-\infty,a)$, $\varphi>0$ a $(a,b)$, $\varphi<0$ a $(b,+\infty)$. Amb $\Phi'=\varphi$, $f(x,y)=\Phi(y)-\Phi(x)$, i $\Phi$ té un mínim local estricte a $a$ i un màxim local estricte a $b$. Per tant:
        $(a,b)$ és màxim local estricte, amb $f(a,b)=\int_a^b\varphi>0$; $(b,a)$ és mínim local estricte, amb $f(b,a)=-\int_a^b\varphi<0$; $(a,a)$ i $(b,b)$ són punts de sella (amb $f=0$).
        Interpretació: entre els intervals d'integració propers, el que dona més àrea és exactament el tram $[a,b]$ on $\varphi>0$ (afegir o treure trossos on $\varphi<0$, o treure trossos on $\varphi>0$, fa disminuir la integral); el mínim és el mateix interval recorregut al revés. A la diagonal $f(x,x)=0$.
      fuites:
      - \(a\s*,\s*b\)\$?\s*(és\s+)?(un\s+)?m[àa]xim
      - \(b\s*,\s*a\)\$?\s*(és\s+)?(un\s+)?m[íi]nim
      - m[àa]xim\s+(local\s+)?(estricte\s+)?(a|en)\s+\$?\(a\s*,\s*b\)
      - m[íi]nim\s+(local\s+)?(estricte\s+)?(a|en)\s+\$?\(b\s*,\s*a\)
    passos:
    - id: punts_critics
      titol: Gradient i punts crítics
      objectiu: |
        Calcular les derivades parcials de $f$, justificar que és diferenciable i trobar-ne els punts crítics.
      idea: |
        Pel teorema fonamental del càlcul (una variable; $\varphi$ és contínua perquè és derivable), derivar la integral respecte del límit superior i de l'inferior. Parcials contínues impliquen diferenciabilitat.
      detall: |
        $\frac{\partial f}{\partial x}(x,y)=-\varphi(x)$, $\frac{\partial f}{\partial y}(x,y)=\varphi(y)$, contínues, de manera que $f$ és diferenciable (de fet $\mathcal{C}^1$).
        $\nabla f=0\iff\varphi(x)=\varphi(y)=0\iff x,y\in\{a,b\}$: punts crítics $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$.
      fuites:
      - -\s*\\varphi\s*\(x\)
      teoria:
      - T3.2
      - T3.18
      - T5.22
    - id: signe_phi
      titol: Signe de φ
      objectiu: |
        Determinar el signe de $\varphi$ a cadascun dels intervals en què $a$ i $b$ divideixen la recta.
      idea: |
        El signe de $\varphi'$ en un zero diu el signe de $\varphi$ just a cada costat; entre zeros consecutius, una funció contínua sense zeros no canvia de signe (valor intermedi).
      detall: |
        $\varphi'(a)=\lim_{t\to a}\frac{\varphi(t)}{t-a}>0$: $\varphi(t)$ té el signe de $t-a$ prop de $a$. Igualment $\varphi'(b)<0$: $\varphi(t)$ té el signe contrari de $t-b$ prop de $b$. Pel teorema del valor intermedi, el signe és constant a cada interval: $\varphi<0$ a $(-\infty,a)$, $\varphi>0$ a $(a,b)$, $\varphi<0$ a $(b,+\infty)$.
        Amb $\Phi(s)=\int_a^s\varphi$: $\Phi$ decreix, creix, decreix; $a$ és mínim local estricte i $b$ màxim local estricte de $\Phi$.
      fuites:
      - \\varphi\s*>\s*0\$?\s*(a|en)\s*\$?\s*\(a\s*,\s*b\)
      - a\$?\s*és\s+(un\s+)?m[íi]nim\s+local
      teoria:
      - T2.24
      - T5.9
    - id: classificar
      titol: Caràcter dels punts crítics
      objectiu: |
        Decidir el caràcter de cadascun dels quatre punts crítics.
      idea: |
        Com que $f(x,y)=\Phi(y)-\Phi(x)$ separa variables, l'increment de $f$ és la diferència de dos increments d'una variable; combinar el caràcter de $a$ i $b$ per a $\Phi$ en cada coordenada.
      detall: |
        $f(x,y)-f(x_0,y_0)=[\Phi(y)-\Phi(y_0)]-[\Phi(x)-\Phi(x_0)]$.
        $(a,b)$: per $(x,y)$ proper, $\Phi(y)\leq\Phi(b)$ i $\Phi(x)\geq\Phi(a)$, amb igualtat només si $y=b$ i $x=a$ respectivament; si $(x,y)\neq(a,b)$ alguna de les dues és estricta i $f(x,y)<f(a,b)$: màxim local estricte.
        $(b,a)$: tot al revés, mínim local estricte.
        $(a,a)$: $f(a,y)-f(a,a)=\Phi(y)-\Phi(a)>0$ per $y\neq a$ proper, i $f(x,a)-f(a,a)=-(\Phi(x)-\Phi(a))<0$: punt de sella. $(b,b)$: anàlogament, sella.
        (Si $\varphi\in\mathcal{C}^1$, ho confirma la hessiana $Hf=\mathrm{diag}(-\varphi'(x),\varphi'(y))$.)
      fuites:
      - \(a\s*,\s*b\)\$?\s*:.*m[àa]xim
      - m[àa]xim\s+local\s+estricte
      - m[íi]nim\s+local\s+estricte
      teoria:
      - T5.21
      - T5.25
    - id: interpretar
      titol: Interpretar
      objectiu: |
        Explicar en termes d'àrees per què els punts crítics tenen aquest caràcter.
      idea: |
        $f(x,y)$ és l'àrea amb signe sota $\varphi$ entre $x$ i $y$; pensar què passa en moure lleugerament els extrems de l'interval d'integració.
      detall: |
        $f(a,b)=\int_a^b\varphi>0$ és l'àrea de tot el tram on $\varphi$ és positiva: moure $a$ o $b$ cap a fora afegeix àrea negativa i cap a dins en treu de positiva, així que la integral decreix. $f(b,a)=-f(a,b)$ és el mateix interval recorregut al revés (mínim). A la diagonal $f(x,x)=0$, i prop de $(a,a)$ o $(b,b)$ la integral sobre un interval petit pot tenir qualsevol signe segons cap a on el posem: sella.
      fuites: []
      teoria: []
    errors_comuns:
    - id: signe_derivada_inferior
      descripcio: |
        Oblida el signe menys en derivar respecte del límit inferior ($\partial f/\partial x=\varphi(x)$).
      pregunta: |
        Si escrius $\int_x^y\varphi=\Phi(y)-\Phi(x)$, què dona derivar respecte de $x$?
    - id: hessiana_sense_c2
      descripcio: |
        Aplica el criteri de la hessiana assumint $f\in\mathcal{C}^2$, quan només sabem que $\varphi$ és derivable ($\varphi'$ podria no ser contínua).
      pregunta: |
        Quina regularitat demana el criteri de la hessiana? Te la garanteixen les hipòtesis sobre $\varphi$? Hi ha alguna manera d'evitar-lo aprofitant la forma de $f$?
    - id: signe_phi_sense_justificar
      descripcio: |
        Afirma el signe de $\varphi$ entre zeros sense justificar per què no canvia (o confon el signe de $\varphi$ amb el de $\varphi'$).
      pregunta: |
        Saps el signe de $\varphi$ prop de $a$. Per què no pot canviar de signe abans d'arribar a $b$?
    - id: oblida_punts_diagonal
      descripcio: |
        Només troba $(a,b)$ i $(b,a)$, oblidant $(a,a)$ i $(b,b)$.
      pregunta: |
        Les condicions $\varphi(x)=0$ i $\varphi(y)=0$ obliguen $x$ i $y$ a ser diferents?
    nota_professor: |
      Com que $\varphi$ només és derivable, $f$ és $\mathcal{C}^1$ i les seves parcials són derivables, però no necessàriament $\mathcal{C}^2$: el Teorema 33 tal com està enunciat no s'aplica en general. L'argument per separació de variables és complet i no en depèn. $(a,b)$ no és necessàriament màxim absolut: per $x>y$, $f(x,y)=-\int_y^x\varphi$ pot ser gran si $\varphi$ és molt negativa a $(b,\infty)$. Sí que és el màxim de $f$ restringida a $x\leq y$.
- num: 15
  font: null
  preambul: |
    Repetiu el problema anterior amb les altres tres variants possibles:
  indicacio: null
  exercicis:
  - id: t5-15a
    apartat: a
    tipus: calcul
    enunciat: |
      $\varphi'(a)<0$ i $\varphi'(b)>0$;
    teoria:
    - T5.21
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        Punts crítics: $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$. Ara $\varphi>0$ a $(-\infty,a)$, $\varphi<0$ a $(a,b)$, $\varphi>0$ a $(b,+\infty)$; $\Phi$ (primitiva de $\varphi$) té màxim local estricte a $a$ i mínim local estricte a $b$.
        $(a,b)$ és mínim local estricte, amb $f(a,b)=\int_a^b\varphi<0$; $(b,a)$ és màxim local estricte, amb $f(b,a)=\int_a^b|\varphi|>0$; $(a,a)$ i $(b,b)$ són punts de sella.
        Interpretació: $[a,b]$ és ara el tram on $\varphi<0$; integrant-lo d'esquerra a dreta s'obté l'àrea més negativa possible a prop, i al revés la més positiva.
      fuites:
      - \(a\s*,\s*b\)\$?\s*(és\s+)?(un\s+)?m[íi]nim
      - \(b\s*,\s*a\)\$?\s*(és\s+)?(un\s+)?m[àa]xim
      - m[íi]nim\s+(local\s+)?(estricte\s+)?(a|en)\s+\$?\(a\s*,\s*b\)
      - m[àa]xim\s+(local\s+)?(estricte\s+)?(a|en)\s+\$?\(b\s*,\s*a\)
    passos:
    - id: punts_critics
      titol: Punts crítics
      objectiu: |
        Amb $f(x,y)=\int_x^y\varphi(t)\,dt$ com al problema 14 i les noves hipòtesis, trobar els punts crítics de $f$.
      idea: |
        El gradient no depèn dels signes de $\varphi'$: és el mateix càlcul del problema anterior (teorema fonamental del càlcul).
      detall: |
        $\nabla f=(-\varphi(x),\varphi(y))$, que s'anul·la exactament a $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$; $f$ és diferenciable perquè les parcials són contínues.
      fuites: []
      teoria:
      - T3.18
      - T5.22
    - id: signe_phi
      titol: Signe de φ
      objectiu: |
        Determinar el signe de $\varphi$ a cada interval determinat per $a$ i $b$, i el caràcter de $a$ i $b$ per a una primitiva $\Phi$ de $\varphi$.
      idea: |
        El signe de $\varphi'$ en cada zero fixa el signe de $\varphi$ a cada costat; el valor intermedi el propaga fins al zero següent.
      detall: |
        $\varphi'(a)<0$: $\varphi>0$ just a l'esquerra de $a$ i $\varphi<0$ just a la dreta; $\varphi'(b)>0$: $\varphi<0$ just a l'esquerra de $b$ i $\varphi>0$ a la dreta. Per valor intermedi: $\varphi>0$ a $(-\infty,a)$, $\varphi<0$ a $(a,b)$, $\varphi>0$ a $(b,+\infty)$ (coherent). Per tant $\Phi$ creix, decreix, creix: $a$ és màxim local estricte i $b$ mínim local estricte de $\Phi$.
      fuites:
      - \\varphi\s*<\s*0\$?\s*(a|en)\s*\$?\s*\(a\s*,\s*b\)
      teoria:
      - T2.24
      - T5.9
    - id: classificar
      titol: Caràcter dels punts crítics
      objectiu: |
        Decidir el caràcter dels quatre punts crítics.
      idea: |
        Escriure $f(x,y)=\Phi(y)-\Phi(x)$ i combinar el caràcter de $a$ i $b$ per a $\Phi$ a cada coordenada, com al problema 14.
      detall: |
        $(a,b)$: per $(x,y)$ proper, $\Phi(y)\geq\Phi(b)$ i $\Phi(x)\leq\Phi(a)$, amb igualtat només si $y=b$ i $x=a$ respectivament; així $f(x,y)>f(a,b)$ si $(x,y)\neq(a,b)$: mínim local estricte. $(b,a)$: màxim local estricte. $(a,a)$: $f(a,y)-f(a,a)=\Phi(y)-\Phi(a)<0$ i $f(x,a)-f(a,a)=\Phi(a)-\Phi(x)>0$: sella; $(b,b)$ igual, sella.
      fuites:
      - m[íi]nim\s+local\s+estricte
      - m[àa]xim\s+local\s+estricte
      teoria:
      - T5.21
      - T5.25
    - id: interpretar
      titol: Interpretar
      objectiu: |
        Interpretar els resultats en termes d'àrees.
      idea: |
        Identificar on $\varphi$ és positiva i negativa i pensar quin interval d'integració proper maximitza o minimitza l'àrea amb signe.
      detall: |
        $[a,b]$ és el tram on $\varphi<0$: $\int_a^b\varphi$ és l'àrea més negativa que es pot aconseguir movent poc els extrems, i $\int_b^a\varphi=\int_a^b|\varphi|$ la més positiva. A la diagonal $f=0$ i els punts $(a,a)$, $(b,b)$ són selles.
      fuites: []
      teoria: []
    errors_comuns:
    - id: copia_resultat_anterior
      descripcio: |
        Copia la classificació del problema 14 sense refer el signe de $\varphi$.
      pregunta: |
        Han canviat els signes de $\varphi'(a)$ i $\varphi'(b)$. Què implica això per al signe de $\varphi$ a $(a,b)$?
    - id: signe_derivada_inferior
      descripcio: |
        Oblida el signe menys de $\partial f/\partial x$ i inverteix el caràcter en la coordenada $x$.
      pregunta: |
        En $f=\Phi(y)-\Phi(x)$, si $\Phi$ té un màxim a $x=a$, què té $-\Phi(x)$ en aquest punt?
    nota_professor: |
      És el cas del problema 14 aplicat a $-\varphi$: $f$ canvia de signe i màxims i mínims s'intercanvien. Igual que abans, $\varphi$ només derivable fa preferible l'argument directe al de la hessiana.
  - id: t5-15b
    apartat: b
    tipus: teoric
    enunciat: |
      $\varphi'(a)>0$ i $\varphi'(b)>0$;
    teoria:
    - T5.21
    - T5.22
    teoria_reservada: []
    resultat:
      valor: |
        Les hipòtesis són incompatibles: no existeix cap $\varphi$ derivable amb exactament dos zeros $a<b$ i $\varphi'(a)>0$, $\varphi'(b)>0$. En efecte, $\varphi'(a)>0$ fa $\varphi>0$ just a la dreta de $a$; sense zeros a $(a,b)$, $\varphi>0$ a tot $(a,b)$, i aleshores $\varphi'(b)=\lim_{t\to b^-}\frac{\varphi(t)}{t-b}\leq0$. Contradicció.
        (Formalment, $\nabla f=(-\varphi(x),\varphi(y))$ donaria els punts crítics $(a,a),(a,b),(b,a),(b,b)$, i la hessiana $\mathrm{diag}(-\varphi'(x),\varphi'(y))$ seria indefinida a tots quatre: totes serien selles. Però el problema és buit.)
        Interpretació: en zeros simples consecutius el signe de $\varphi'$ ha d'alternar-se.
      fuites:
      - incompatibles?
      - no\s+existeix\s+cap
      - no\s+pot\s+existir
      - impossibles?
      - contradicci[óo]
    passos:
    - id: punts_critics_formals
      titol: Punts crítics (formalment)
      objectiu: |
        Amb $f(x,y)=\int_x^y\varphi(t)\,dt$ com al problema 14, escriure els punts crítics que tindria $f$.
      idea: |
        El gradient és el mateix que al problema anterior; no depèn dels signes de $\varphi'$.
      detall: |
        $\nabla f=(-\varphi(x),\varphi(y))$: punts crítics $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$.
      fuites: []
      teoria:
      - T5.22
    - id: signe_phi
      titol: Signe de φ i coherència
      objectiu: |
        Determinar el signe de $\varphi$ a l'interval $(a,b)$ i deduir-ne què passa amb el signe de $\varphi'(b)$.
      idea: |
        Del signe de $\varphi'(a)$ deduir el signe de $\varphi$ just a la dreta de $a$, propagar-lo fins a $b$ amb el valor intermedi, i calcular $\varphi'(b)$ com a límit lateral per l'esquerra.
      detall: |
        $\varphi'(a)>0\Rightarrow\varphi>0$ a $(a,a+\delta)$. Com que $\varphi$ és contínua i no s'anul·la a $(a,b)$, pel valor intermedi $\varphi>0$ a tot $(a,b)$. Aleshores, per $t<b$, $\frac{\varphi(t)-\varphi(b)}{t-b}=\frac{\varphi(t)}{t-b}<0$, d'on $\varphi'(b)\leq0$, en contradicció amb $\varphi'(b)>0$.
      fuites:
      - \\varphi'\s*\(b\)\s*(\\le|\\leq|≤)\s*0
      - contradicci[óo]
      teoria:
      - T2.24
    - id: concloure
      titol: Conclusió i interpretació
      objectiu: |
        Treure la conclusió sobre el problema plantejat i interpretar-la.
      idea: |
        Pensar què diu el pas anterior sobre l'existència de $\varphi$, i com seria el càlcul formal si no ens n'adonéssim.
      detall: |
        No existeix cap $\varphi$ amb aquestes hipòtesis: el problema és buit. Si es fes el càlcul formal amb la hessiana $\mathrm{diag}(-\varphi'(x),\varphi'(y))$, els quatre punts sortirien selles (a $(a,b)$: $\mathrm{diag}(-\varphi'(a),\varphi'(b))$, signes $(-,+)$), però és una conclusió sobre un objecte inexistent. Lliçó: en zeros simples consecutius $\varphi'$ alterna de signe.
      fuites:
      - no\s+existeix\s+cap
      - buit
      teoria: []
    errors_comuns:
    - id: calcul_formal
      descripcio: |
        Fa el càlcul formal (totes selles) sense adonar-se que les hipòtesis no es poden complir.
      pregunta: |
        Abans de classificar: pots dibuixar una $\varphi$ que s'anul·li només a $a$ i $b$ i que creixi en tots dos zeros?
    - id: signe_sense_valor_intermedi
      descripcio: |
        Pressuposa el signe de $\varphi$ a $(a,b)$ sense justificar-lo, o creu que pot canviar sense passar per zero.
      pregunta: |
        Una funció contínua pot passar de positiva a negativa dins $(a,b)$ sense anul·lar-se?
    nota_professor: |
      L'enunciat parla de "les altres tres variants possibles" de signes, però (b) i (c) són impossibles; probablement és intencionat (part de la "interpretació"). Si l'estudiant dona la resposta formal (quatre selles), cal acceptar el càlcul però portar-lo a veure la incompatibilitat.
