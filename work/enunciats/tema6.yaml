tema: 6
titol: "Varietats diferenciables i extrems condicionats"
problemes:
  - num: 1
    font: null
    preambul: |
      Doneu una parametrització de classe $\mathcal{C}^1$ de les corbes següents:
    apartats:
      - lletra: a
        text: |
          Una el·lipse centrada a l'origen, de semieixos $a,b>0$, recorreguda dos cops en sentit horari.
      - lletra: b
        text: |
          La gràfica de la funció $f(x)=2^x-2x$, entre els punts $(0,1)$ i $(3,2)$.
      - lletra: c
        text: |
          Una paràbola en un pla paral·lel al pla $YZ$, de vèrtex en $(3,-5,-2)$ i que passi per $(3,-1.0)$.
      - lletra: d
        text: |
          La corba intersecció del cilindre $9x^2+y^2=1$ amb el pla $2x-z+4=0$.
      - lletra: e
        text: |
          La circumferència de centre $(-1,1,3)$ i radi $R>0$ al pla $z=3$.
      - lletra: f
        text: |
          El tros d'hipèrbola d'equació $\dfrac{x^2}{a^2}-\dfrac{(y-1)^2}{b^2}=1$, amb $x\leq0$, $y\leq1$.
    indicacio: null
  - num: 2
    font: null
    preambul: |
      Doneu una parametrització de classe $\mathcal{C}^1$ de les superfícies següents:
    apartats:
      - lletra: a
        text: |
          El pla $Ax+By+Cz=D$, on $B\neq0$.
      - lletra: b
        text: |
          La gràfica de la funció $f(x,y)=x^2-y^2$ en el seu domini.
      - lletra: c
        text: |
          Un cilindre d'altura $H$, radi de la base $R$ i eix $OY$.
      - lletra: d
        text: |
          Una esfera de radi $R$, centrada a l'origen.
      - lletra: e
        text: |
          Un el·lipsoide de semieixos $a,b,c>0$, centrat a l'origen.
      - lletra: f
        text: |
          Un cilindre inclinat de base la circumferència $x^2+y^2=4$ al pla $XY$ i eix la recta $\{z=x,\ y=0\}$.
      - lletra: g
        text: |
          Un cilindre inclinat de base l'el·lipse $(x-1)^2+4y^2=4$ al pla $XY$ i que té l'eix paral·lel a la recta $\{x+y=3,\ 2y-z=0\}$.
    indicacio: null
  - num: 3
    font: null
    preambul: |
      Determineu els extrems absoluts de $f$ quan les variables estan sotmeses als lligams que s'indiquen. (Intenteu resoldre l'exercici sense fer servir multiplicadors de Lagrange.)
    apartats:
      - lletra: a
        text: |
          $f(x,y)=x$, $\quad x^2+2y^2=3$;
      - lletra: b
        text: |
          $f(x,y)=x^2y$, $\quad xy=1$;
      - lletra: c
        text: |
          $f(x,y)=x^2+y^2$, $\quad x^2+y^2=1$;
      - lletra: d
        text: |
          $f(x,y)=x^2+y^2+1$, $\quad 2x+3y=0$;
      - lletra: e
        text: |
          $f(x,y,z)=x-y+z$, $\quad x^2+y^2+z^2=2$:
      - lletra: f
        text: |
          $f(x,y,z)=x+y+z$, $\quad x^2-y^2=1$, $\quad 2x+z=1$.
    indicacio: null
  - num: 4
    font: null
    preambul: |
      Determineu els extrems absoluts de les funcions $f$ següents sobre els recintes $K$ que s'especifiquen:
    apartats:
      - lletra: a
        text: |
          $f(x,y,z)=\sin x\sin y\sin z$, $\quad K=\{(x,y,z)\in\mathbb{R}^3\mid x,y,z\geqslant0,\ x+y+z\leqslant\frac{\pi}{2}\}$;
      - lletra: b
        text: |
          $f(x,y)=x^4+2x^2y-x^3+3y^2$, $\quad K=\{(x,y)\in\mathbb{R}^2\mid|x|\leqslant1,\ |y|\leqslant1\}$;
      - lletra: c
        text: |
          $f(x,y)=x^2+y^2-xy+y+x$, $\quad K=\{(x,y)\in\mathbb{R}^2\mid x+y\geqslant-3,\ x\leqslant y,\ y\leqslant0\}$.
    indicacio: null
  - num: 5
    font: null
    preambul: |
      Trobeu la distància entre el punt $(0,b)$ i la paràbola $x^2-4y=0$. Resoleu el problema emprant dos mètodes diferents.
    apartats: []
    indicacio: null
  - num: 6
    font: null
    preambul: |
      Trobeu la distància entre les corbes d'equació $x+y=4$ i $x^2+4y^2=4$.
    apartats: []
    indicacio: null
  - num: 7
    font: null
    preambul: |
      Trobeu els vèrtexs i semieixos de l'el·lipse obtinguda intersecant el pla d'equació $x+y+z=0$ amb l'el·lipsoide d'equació $x^2/4+y^2+z^2=1$.
    apartats: []
    indicacio: null
  - num: 8
    font: null
    preambul: |
      Trobeu els extrems absoluts de $f(x,y)=x-x^2-y^2$ en el disc $\{(x,y)\mid x^2+y^2<1\}$.
    apartats: []
    indicacio: null
  - num: 9
    font: null
    preambul: |
      Calculeu els extrems absoluts de $f(x,y)=\log\left(8xy-x^2+1\right)$ sobre el compacte
      $$K=\{(x,y)\in\mathbb{R}^2\mid x>0,\ xy\leqslant8,\ 1\leqslant y\leqslant x^2\}.$$
    apartats: []
    indicacio: null
  - num: 10
    font: null
    preambul: |
      Considereu la funció $f\colon\mathbb{R}^2\to\mathbb{R}$ definida per $f(x,y)=\sin(x+y)+\cos(x-y)$.
    apartats:
      - lletra: a
        text: |
          Trobeu i classifiqueu tots els seus punts crítics.
      - lletra: b
        text: |
          Calculeu els extrems absoluts de $f$ en el quadrat $[\pi/2,\pi]\times[\pi/2,\pi]$.
    indicacio: null
  - num: 11
    font: null
    preambul: |
      Trobeu els extrems absoluts de la funció $f(x,y)=x^3-3xy^2$ sobre la circumferència de radi 1 centrada a l'origen (la superfície $z=f(x,y)$ s'anomena *cadira del mico*).
    apartats: []
    indicacio: null
  - num: 12
    font: null
    preambul: |
      Considerem la funció $f(x,y,z)=x^4+y^2/4+z^2-x^2y-2z+1$ i el conjunt $M=\{(x,y,z)\in\mathbb{R}^3\mid2x^2+y^2+z^3-5xz-2=0\}$. Proveu que en el punt $p=(1,2,1)$ s'assoleix un mínim local de la restricció de $f$ a $M$. Es tracta d'un mínim absolut de la restricció de $f$ a $M$?
    apartats: []
    indicacio: null
  - num: 13
    font: null
    preambul: |
      Calculeu el màxim volum d'un paral·lelepípede de cares paral·leles als plans coordenats, inscrit dins l'el·lipsoide d'equació $\frac{x^2}{a^2}+\frac{y^2}{b^2}+\frac{z^2}{c^2}=1$, amb $a,b,c\in\mathbb{R}^+$.
    apartats: []
    indicacio: null
  - num: 14
    font: null
    preambul: |
      Considerem el conjunt $D=\{(x,y)\in\mathbb{R}^2\mid x^2+y^2-2x\leqslant0,\ x\geqslant1\}$ i la funció $f\colon\mathbb{R}^2\to\mathbb{R}$ definida per $f(x,y)=x^4+x^2y^2+2xy^2+12y^2$. Trobeu, si existeixen, els punts de $D$ on $f$ assoleix valors màxim i mínim.
    apartats: []
    indicacio: null
  - num: 15
    font: null
    preambul: |
      Considerem la funció donada per $f(x,y,z)=(x+1)^2+(y-1)^2+2z$ i el conjunt $A=\{(x,y,z)\in\mathbb{R}^3\mid z\geqslant x^2+y^2,\ z\leqslant2y-2x+1\}$.
    apartats:
      - lletra: a
        text: |
          Demostreu que el conjunt $A$ és tancat.
      - lletra: b
        text: |
          Justifiqueu l'existència d'extrems absoluts de $f$ en $A$ i calculeu-los.
    indicacio: null
