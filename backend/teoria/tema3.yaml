    pagina: 19
    nom: "Pre-convex implica connex"
    enunciat: |
      $\Omega$ pre-convex $\Rightarrow$ $\Omega$ connex (si $\Omega$ és disconnex, aleshores $\Omega$ és no pre-convex).
