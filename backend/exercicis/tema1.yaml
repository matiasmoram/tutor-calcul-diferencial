    - id: descriure
      titol: Descriure el conjunt
      objectiu: |
        Entendre la forma del conjunt $E$.
      idea: |
        Separar els casos segons el signe de $y$.
      detall: |
        Si $y\geq0$: $y=5-x^2$ (cal $x^2\leq5$). Si $y<0$: $y=x^2-5$ (amb $x^2<5$). $E$ és la unió dels dos arcs de paràbola, que s'uneixen als punts $(\pm\sqrt5,0)$: una corba tancada i fitada.
