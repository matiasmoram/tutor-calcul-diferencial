    - id: hessiana
      titol: Hessiana
      objectiu: |
        Calcular la hessiana de $f$ al punt crític.
      idea: |
        Derivar un altre cop; com que $f$ és un polinomi de grau 2, la hessiana és constant.
      detall: |
        $Hf=\begin{pmatrix}4&-2\\-2&2\end{pmatrix}$, amb $\det=4>0$ i $\mathrm{tr}=6>0$.
      fuites:
      - 4\s*&\s*-\s*2
