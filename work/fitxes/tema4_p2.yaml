problemes:
  - num: 8
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t4-8"
        apartat: null
        tipus: calcul
        enunciat: |
          Proveu que la funció $G(x,y,z)=(x+y+z^2,\ x-y+z,\ 2x+y-z)$ admet una inversa local diferenciable al voltant del punt $(1,-1,2)$ i calculeu $DG^{-1}(4,4,-1)$. Admet $G$ inversa global?
        teoria: ["T4.9"]
        teoria_reservada: []
        resultat:
          valor: |
            $G$ és de classe $\mathcal{C}^\infty$ i $\det JG(x,y,z)=3+6z$, que en $(1,-1,2)$ val $15\neq 0$. Pel teorema de la funció inversa, $G$ té inversa local de classe $\mathcal{C}^\infty$ en un entorn de $G(1,-1,2)=(4,4,-1)$, i
            $$DG^{-1}(4,4,-1)=\big(JG(1,-1,2)\big)^{-1}=\begin{pmatrix}1&1&4\\ 1&-1&1\\ 2&1&-1\end{pmatrix}^{-1}=\begin{pmatrix}0&\frac13&\frac13\\ \frac15&-\frac35&\frac15\\ \frac15&\frac1{15}&-\frac2{15}\end{pmatrix}.$$
            $G$ no admet inversa global: no és injectiva, per exemple $G(0,0,0)=G(0,-1,-1)=(0,0,0)$ (en general, $(x,y,z)$ i el punt amb $z'=-1-z$ corresponent tenen la mateixa imatge). A més $\det JG=0$ sobre el pla $z=-\frac12$.
          fuites: ['1\s*/\s*15', '\\frac\s*\{?\s*-?\s*1\s*\}?\s*\{\s*15\s*\}', '\\frac\s*1\s*\{\s*15\s*\}', 'no\s+(admet|té|te)\s+(cap\s+)?inversa\s+global', 'no\s+és\s+injectiva', '\(\s*0\s*,\s*-\s*1\s*,\s*-\s*1\s*\)']
        passos:
          - id: punt_imatge
            titol: "Situar el punt i la seva imatge"
            objectiu: |
              Relacionar el punt $(1,-1,2)$ amb el punt $(4,4,-1)$ on es demana la diferencial de la inversa.
            idea: |
              La diferencial de la inversa s'avalua en la imatge del punt on s'inverteix: cal comprovar quin punt de l'espai de sortida correspon a $(4,4,-1)$.
            detall: |
              $G(1,-1,2)=(1-1+4,\ 1+1+2,\ 2-1-2)=(4,4,-1)$. Per tant $(4,4,-1)$ és la imatge de $(1,-1,2)$ i $DG^{-1}(4,4,-1)$ és la diferencial de la inversa local definida al voltant de $(1,-1,2)$.
            fuites: []
            teoria: []
          - id: jacobiana
            titol: "Jacobiana i hipòtesis del TFI"
            objectiu: |
              Comprovar que $G$ satisfà les hipòtesis del teorema de la funció inversa en $(1,-1,2)$.
            idea: |
              $G$ és polinòmica, per tant de classe $\mathcal{C}^\infty$. Cal calcular la matriu jacobiana i veure que el seu determinant no s'anul·la en el punt.
            detall: |
              $JG(x,y,z)=\begin{pmatrix}1&1&2z\\ 1&-1&1\\ 2&1&-1\end{pmatrix}$, i desenvolupant, $\det JG(x,y,z)=1\cdot(1-1)-1\cdot(-1-2)+2z\cdot(1+2)=3+6z$. En $(1,-1,2)$: $\det JG(1,-1,2)=15\neq 0$. Pel teorema de la funció inversa existeix un entorn $U$ de $(1,-1,2)$ tal que $G|_U$ és injectiva, $G(U)$ és obert i la inversa és de classe $\mathcal{C}^\infty$.
            fuites: ['3\s*\+\s*6\s*z', '=\s*15\b']
            teoria: ["T4.5", "T3.31"]
          - id: diferencial_inversa
            titol: "Calcular la diferencial de la inversa"
            objectiu: |
              Calcular $DG^{-1}(4,4,-1)$.
            idea: |
              El teorema de la funció inversa dona la diferencial de la inversa com la inversa de la diferencial de $G$ en el punt antiimatge. Cal invertir una matriu $3\times 3$.
            detall: |
              $DG^{-1}(4,4,-1)=\big(JG(1,-1,2)\big)^{-1}$ amb $JG(1,-1,2)=\begin{pmatrix}1&1&4\\ 1&-1&1\\ 2&1&-1\end{pmatrix}$. Per adjunts (determinant $15$):
              $\big(JG(1,-1,2)\big)^{-1}=\frac{1}{15}\begin{pmatrix}0&5&5\\ 3&-9&3\\ 3&1&-2\end{pmatrix}=\begin{pmatrix}0&\frac13&\frac13\\ \frac15&-\frac35&\frac15\\ \frac15&\frac1{15}&-\frac2{15}\end{pmatrix}$.
              Comprovació: multiplicant per $JG(1,-1,2)$ dona la identitat.
            fuites: ['\\frac\s*\{\s*1\s*\}\s*\{\s*15\s*\}', '\\frac\s*1\s*\{\s*15\s*\}', '\\frac\s*\{?\s*3\s*\}?\s*\{?\s*5\s*\}?', '1\s*/\s*15']
            teoria: ["T4.5"]
          - id: inversa_global
            titol: "Inversa global"
            objectiu: |
              Decidir si $G$ admet una inversa definida globalment.
            idea: |
              Una inversa global requereix que $G$ sigui injectiva a tot $\mathbb{R}^3$. Proveu de resoldre $G(x,y,z)=(u,v,w)$: les dues darreres components són lineals i permeten eliminar $x$ i $y$; mireu quantes solucions té l'equació en $z$ que en resulta.
            detall: |
              De $v+w=3x$ s'obté $x=\frac{v+w}{3}$, i de la segona component $y=x+z-v$. Substituint a la primera: $u=2x-v+z+z^2$, és a dir $z^2+z=u+v-2x$. Aquesta equació de segon grau en $z$ té en general dues solucions, $z$ i $-1-z$, que donen dues antiimatges diferents. Exemple: $G(0,0,0)=(0,0,0)$ i $G(0,-1,-1)=(0-1+1,\ 0+1-1,\ 0-1+1)=(0,0,0)$. Per tant $G$ no és injectiva i no té inversa global. (També: $\det JG=0$ al pla $z=-\frac12$, on cap inversa local pot ser diferenciable; i $G$ no és exhaustiva, ja que $z^2+z\geq-\frac14$.)
            fuites: ['z\s*\^\s*\{?2\}?\s*\+\s*z\s*=', '\(\s*0\s*,\s*-\s*1\s*,\s*-\s*1\s*\)', '-\s*1\s*-\s*z']
            teoria: ["T4.9"]
        errors_comuns:
          - id: punt_equivocat
            descripcio: |
              Avalua la jacobiana de $G$ en $(4,4,-1)$ en lloc d'avaluar-la en l'antiimatge $(1,-1,2)$.
            pregunta: |
              El punt $(4,4,-1)$ pertany al domini de $G$ o al de la seva inversa? En quin punt s'ha d'avaluar $JG$?
          - id: local_implica_global
            descripcio: |
              Conclou que hi ha inversa global perquè el determinant de la jacobiana no és zero en el punt (o en molts punts).
            pregunta: |
              El teorema de la funció inversa et dona una inversa en un entorn. Què hauria de complir $G$ a tot $\mathbb{R}^3$ per tenir una inversa global?
          - id: inversa_mal_calculada
            descripcio: |
              S'equivoca en invertir la matriu (oblida transposar la matriu d'adjunts o dividir pel determinant).
            pregunta: |
              Has comprovat que el producte de la matriu que has obtingut per $JG(1,-1,2)$ dona la identitat?
        nota_professor: |
          La no injectivitat també es veu observant que $G(x,y,z)$ i $G(x,y',z')$ coincideixen per $z'=-1-z$ i $y'=y+z'-z$. El pla crític $z=-\frac12$ és justament on les dues branques $z$ i $-1-z$ s'ajunten.

  - num: 9
    font: null
    preambul: |
      Demostreu que les funcions següents són difeomorfismes locals de classe $\mathcal{C}^\infty$ en tot punt del domini indicat. Doneu oberts màxims dins d'aquests dominis on les seves restriccions siguin difeomorfismes:
    indicacio: null
    exercicis:
      - id: "t4-9a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          $F(r,\varphi)=(r\cos\varphi,r\sin\varphi)$, $(r,\varphi)\in(0,\infty)\times\mathbb{R}$ *(polars)*;
          (Indicació: $F:(0,\infty)\times(0,2\pi)\to\mathbb{R}^2\setminus\{(x,y)\mid y=0,\ x\geqslant 0\}$ té inversa i $F^{-1}$ no es pot estendre amb continuïtat a cap obert que contingui estrictament $\mathbb{R}^2\setminus\{(x,y)\mid y=0,\ x>0\}$.)
        teoria: ["T4.9"]
        teoria_reservada: ["T4.11"]
        resultat:
          valor: |
            $F$ és de classe $\mathcal{C}^\infty$ i $\det JF(r,\varphi)=r>0$ en tot el domini; pel teorema de la funció inversa, $F$ és un difeomorfisme local de classe $\mathcal{C}^\infty$ en tot punt. Oberts màxims: per a cada $\alpha\in\mathbb{R}$, $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)$; $F:U_\alpha\to\mathbb{R}^2\setminus\{(t\cos\alpha,t\sin\alpha)\mid t\geq 0\}$ és un difeomorfisme, i cap obert del domini que contingui estrictament $U_\alpha$ fa $F$ injectiva.
          fuites: ['\\alpha\s*\+\s*2\s*\\pi']
        passos:
          - id: jacobiana
            titol: "Regularitat i jacobiana"
            objectiu: |
              Comprovar la regularitat de $F$ i estudiar on s'anul·la el determinant de la seva jacobiana.
            idea: |
              Les components són productes de funcions $\mathcal{C}^\infty$. Calculeu $\det JF$ i mireu-ne el signe al domini.
            detall: |
              $JF(r,\varphi)=\begin{pmatrix}\cos\varphi&-r\sin\varphi\\ \sin\varphi&r\cos\varphi\end{pmatrix}$, $\det JF(r,\varphi)=r\cos^2\varphi+r\sin^2\varphi=r>0$ per a tot $(r,\varphi)\in(0,\infty)\times\mathbb{R}$.
            fuites: ['\\det\s*J\s*F[^$]{0,20}=\s*r\b']
            teoria: ["T3.31"]
          - id: difeo_local
            titol: "Difeomorfisme local"
            objectiu: |
              Deduir que $F$ és un difeomorfisme local de classe $\mathcal{C}^\infty$ en tot punt.
            idea: |
              Aplicar el teorema de la funció inversa en cada punt del domini, per a qualsevol classe $\mathcal{C}^k$, $k\geq 1$.
            detall: |
              Per a cada $p$ del domini, $F$ és $\mathcal{C}^\infty$ i $\det JF(p)\neq 0$; el teorema de la funció inversa dona un entorn obert $U_p$ tal que $F|_{U_p}:U_p\to F(U_p)$ és bijectiva, $F(U_p)$ és obert i la inversa és $\mathcal{C}^k$ per a tot $k$, és a dir $\mathcal{C}^\infty$. Així $F$ és un difeomorfisme local $\mathcal{C}^\infty$ en tot punt.
            fuites: []
            teoria: ["T4.5", "T4.9"]
          - id: injectivitat
            titol: "Quan dos punts tenen la mateixa imatge"
            objectiu: |
              Caracteritzar quan $F(r,\varphi)=F(r',\varphi')$.
            idea: |
              Compareu primer les normes de les imatges i després les direccions.
            detall: |
              Si $F(r,\varphi)=F(r',\varphi')$, prenent normes $r=r'$, i aleshores $(\cos\varphi,\sin\varphi)=(\cos\varphi',\sin\varphi')$, que equival a $\varphi-\varphi'\in 2\pi\mathbb{Z}$. Per tant $F$ no és injectiva al domini sencer: $F(r,\varphi+2\pi)=F(r,\varphi)$.
            fuites: ['2\s*\\pi\s*\\mathbb\s*\{?\s*Z', '\\varphi\s*\+\s*2\s*\\pi']
            teoria: []
          - id: oberts_maxims
            titol: "Oberts màxims"
            objectiu: |
              Trobar oberts del domini on la restricció de $F$ sigui un difeomorfisme i que no es puguin ampliar.
            idea: |
              Pel pas anterior, la restricció és injectiva si i només si l'obert no conté dos punts amb el mateix $r$ i angles que difereixin en un múltiple de $2\pi$. Injectivitat més jacobiana invertible a tot arreu dona difeomorfisme sobre la imatge.
            detall: |
              Sigui $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)$. Dos angles d'aquest interval difereixen en menys de $2\pi$, per tant $F|_{U_\alpha}$ és injectiva; és $\mathcal{C}^\infty$ amb $\det JF\neq 0$, així que és un difeomorfisme sobre la seva imatge $F(U_\alpha)=\mathbb{R}^2\setminus\{(t\cos\alpha,t\sin\alpha)\mid t\geq 0\}$ (el pla menys la semirecta tancada d'angle $\alpha$). Maximalitat: sigui $W\supsetneq U_\alpha$ un obert del domini i $(r_0,\varphi_0)\in W\setminus U_\alpha$. Si $\varphi_0\not\equiv\alpha\pmod{2\pi}$, hi ha un únic $\varphi_1\in(\alpha,\alpha+2\pi)$ amb $\varphi_1\equiv\varphi_0$, i $\varphi_1\neq\varphi_0$ (perquè $\varphi_0\notin(\alpha,\alpha+2\pi)$): els punts $(r_0,\varphi_0)\in W$ i $(r_0,\varphi_1)\in U_\alpha\subseteq W$ són diferents i tenen la mateixa imatge. Si $\varphi_0=\alpha+2k\pi$ amb $k\in\mathbb{Z}$, com que $W$ és obert conté $(r_0,\varphi_0\pm\varepsilon)$ per a $\varepsilon\in(0,2\pi)$ petit; si $k\leq 0$, $\varphi_0-\varepsilon<\alpha$, i si $k\geq 1$, $\varphi_0+\varepsilon>\alpha+2\pi$, així que un d'aquests dos punts és de $W\setminus U_\alpha$ amb angle no congruent amb $\alpha$, i som al cas anterior. En tots els casos $F|_W$ no és injectiva. Per $\alpha=0$ és el cas de la indicació.
            fuites: ['\\alpha\s*\+\s*2\s*\\pi']
            teoria: ["T4.9"]
        errors_comuns:
          - id: global_per_jacobiana
            descripcio: |
              Creu que, com que $\det JF\neq 0$ a tot el domini, $F$ és un difeomorfisme de tot el domini.
            pregunta: |
              Si augmentes l'angle $\varphi$ en una volta completa sense canviar $r$, què li passa a la imatge?
          - id: interval_no_obert
            descripcio: |
              Proposa $(0,\infty)\times[0,2\pi)$, que fa $F$ bijectiva sobre $\mathbb{R}^2\setminus\{0\}$ però no és obert.
            pregunta: |
              El conjunt que proposes és obert a $\mathbb{R}^2$? La definició de difeomorfisme ho demana?
          - id: unicitat_maxim
            descripcio: |
              Pensa que l'obert màxim és únic.
            pregunta: |
              Si desplaces l'interval d'angles, la restricció continua sent injectiva? Quantes opcions màximes hi ha?
        nota_professor: |
          Hi ha més oberts màxims que les franges: per exemple $\{(r,\varphi)\mid g(r)<\varphi<g(r)+2\pi\}$ amb $g$ contínua (la imatge és el pla menys una espiral). La indicació de l'enunciat justifica la maximalitat des del costat de la imatge. L'exemple de les polars de les notes (T4.11) fa aquest càlcul per $\alpha=0$. La indicació de l'enunciat (transcrita fidelment del PDF) diu "$x>0$" al darrer conjunt; probablement és una errata per "$x\geqslant 0$", és a dir, la imatge $F((0,\infty)\times(0,2\pi))$.

      - id: "t4-9b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          $G(r,\varphi,\theta)=(r\cos\varphi\sin\theta,r\sin\varphi\sin\theta,r\cos\theta)$, $(r,\varphi,\theta)\in(0,\infty)\times\mathbb{R}\times(0,\pi)$ *(esfèriques)*;
        teoria: ["T4.9"]
        teoria_reservada: ["T4.11"]
        resultat:
          valor: |
            $G$ és $\mathcal{C}^\infty$ i $\det JG(r,\varphi,\theta)=-r^2\sin\theta\neq 0$ al domini (ja que $r>0$ i $\theta\in(0,\pi)$); pel teorema de la funció inversa és un difeomorfisme local $\mathcal{C}^\infty$ en tot punt. Oberts màxims: $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)\times(0,\pi)$, $\alpha\in\mathbb{R}$; $G:U_\alpha\to\mathbb{R}^3\setminus\{(t\cos\alpha,t\sin\alpha,z)\mid t\geq 0,\ z\in\mathbb{R}\}$ és un difeomorfisme.
          fuites: ['\\alpha\s*\+\s*2\s*\\pi']
        passos:
          - id: jacobiana
            titol: "Regularitat i jacobiana"
            objectiu: |
              Comprovar la regularitat de $G$ i estudiar on s'anul·la $\det JG$.
            idea: |
              Calculeu la jacobiana respecte de $(r,\varphi,\theta)$ i el determinant (per exemple desenvolupant per la tercera fila, que té un zero), i useu les restriccions del domini.
            detall: |
              $JG=\begin{pmatrix}\cos\varphi\sin\theta&-r\sin\varphi\sin\theta&r\cos\varphi\cos\theta\\ \sin\varphi\sin\theta&r\cos\varphi\sin\theta&r\sin\varphi\cos\theta\\ \cos\theta&0&-r\sin\theta\end{pmatrix}$, i $\det JG=-r^2\sin\theta$. Com que $r>0$ i $\sin\theta>0$ per $\theta\in(0,\pi)$, el determinant no s'anul·la al domini.
            fuites: ['r\s*\^\s*\{?2\}?\s*\\sin\s*\\theta']
            teoria: ["T3.31"]
          - id: difeo_local
            titol: "Difeomorfisme local"
            objectiu: |
              Deduir que $G$ és un difeomorfisme local $\mathcal{C}^\infty$ en tot punt del domini.
            idea: |
              Aplicar el teorema de la funció inversa punt per punt.
            detall: |
              $G$ és $\mathcal{C}^\infty$ i $\det JG\neq 0$ a cada punt; el teorema de la funció inversa dona en cada punt un entorn on $G$ és bijectiva sobre un obert amb inversa $\mathcal{C}^\infty$.
            fuites: []
            teoria: ["T4.5", "T4.9"]
          - id: injectivitat
            titol: "Quan dos punts tenen la mateixa imatge"
            objectiu: |
              Caracteritzar quan $G(r,\varphi,\theta)=G(r',\varphi',\theta')$.
            idea: |
              Recupereu successivament $r$ (norma), $\theta$ (tercera component) i finalment la direcció de les dues primeres components.
            detall: |
              Prenent normes, $r=r'$. Llavors $\cos\theta=\cos\theta'$ amb $\theta,\theta'\in(0,\pi)$, on el cosinus és injectiu, per tant $\theta=\theta'$ i $\sin\theta>0$. Dividint les dues primeres components per $r\sin\theta$: $(\cos\varphi,\sin\varphi)=(\cos\varphi',\sin\varphi')$, és a dir $\varphi-\varphi'\in 2\pi\mathbb{Z}$.
            fuites: ['2\s*\\pi\s*\\mathbb\s*\{?\s*Z']
            teoria: []
          - id: oberts_maxims
            titol: "Oberts màxims"
            objectiu: |
              Trobar oberts del domini on la restricció de $G$ sigui un difeomorfisme i que no es puguin ampliar, i la seva imatge.
            idea: |
              La no injectivitat només ve de la variable $\varphi$: cal limitar-la igual que a les polars, mantenint $r$ i $\theta$ lliures dins del domini.
            detall: |
              $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)\times(0,\pi)$: pel pas anterior $G|_{U_\alpha}$ és injectiva, i amb $\det JG\neq 0$ és un difeomorfisme sobre la imatge. Com que $x^2+y^2=r^2\sin^2\theta>0$, la imatge no toca l'eix $z$, i $G(U_\alpha)=\mathbb{R}^3\setminus\{(t\cos\alpha,t\sin\alpha,z)\mid t\geq 0,\ z\in\mathbb{R}\}$ (l'espai menys un semiplà tancat que conté l'eix $z$). És màxim pel mateix argument que a les polars: un obert del domini més gran conté dos punts amb el mateix $r,\theta$ i angles $\varphi$ congruents mòdul $2\pi$.
            fuites: ['\\alpha\s*\+\s*2\s*\\pi']
            teoria: ["T4.9"]
        errors_comuns:
          - id: global_per_jacobiana
            descripcio: |
              Conclou que $G$ és un difeomorfisme global perquè el determinant no s'anul·la.
            pregunta: |
              Què passa amb la imatge si canvies $\varphi$ per $\varphi+2\pi$?
          - id: eix_z
            descripcio: |
              Inclou l'eix $z$ a la imatge o oblida que $\theta\in(0,\pi)$ ja l'exclou.
            pregunta: |
              Pot un punt de la forma $(0,0,z)$ ser imatge d'algun punt del domini? Quant val $x^2+y^2$ en termes de $r$ i $\theta$?
          - id: restringir_theta
            descripcio: |
              Intenta restringir també $\theta$ o $r$, quan l'única variable que fa perdre la injectivitat és $\varphi$.
            pregunta: |
              Si fixes $\varphi$, és injectiva la dependència respecte de $r$ i $\theta$ dins del domini?
        nota_professor: |
          A l'enunciat $\varphi$ és la longitud i $\theta$ la colatitud (al revés que a l'exemple T4.11, que usa $f(r,\theta,\varphi)$). Atenció: la imatge que dona T4.11 per a les esfèriques ("$\cup\{z=\pm1\}$") sembla un error de les notes; la imatge correcta és l'espai menys el semiplà tancat.

      - id: "t4-9c"
        apartat: "c"
        tipus: teoric
        enunciat: |
          $H(r,\varphi,z)=(r\cos\varphi,r\sin\varphi,z)$, $(r,\varphi,z)\in(0,\infty)\times\mathbb{R}\times\mathbb{R}$ *(cilíndriques)*.
        teoria: ["T4.9"]
        teoria_reservada: ["T4.11"]
        resultat:
          valor: |
            $H$ és $\mathcal{C}^\infty$ i $\det JH(r,\varphi,z)=r>0$; pel teorema de la funció inversa és un difeomorfisme local $\mathcal{C}^\infty$ en tot punt. Oberts màxims: $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)\times\mathbb{R}$, $\alpha\in\mathbb{R}$; $H:U_\alpha\to\mathbb{R}^3\setminus\{(t\cos\alpha,t\sin\alpha,z)\mid t\geq 0,\ z\in\mathbb{R}\}$ és un difeomorfisme.
          fuites: ['\\alpha\s*\+\s*2\s*\\pi']
        passos:
          - id: jacobiana
            titol: "Regularitat i jacobiana"
            objectiu: |
              Comprovar la regularitat de $H$ i estudiar on s'anul·la $\det JH$.
            idea: |
              La jacobiana té estructura de blocs: el bloc de les polars i la variable $z$ que no es barreja amb les altres.
            detall: |
              $JH=\begin{pmatrix}\cos\varphi&-r\sin\varphi&0\\ \sin\varphi&r\cos\varphi&0\\ 0&0&1\end{pmatrix}$, $\det JH=r>0$ al domini.
            fuites: ['\\det\s*J\s*H[^$]{0,20}=\s*r\b']
            teoria: ["T3.31"]
          - id: difeo_local
            titol: "Difeomorfisme local"
            objectiu: |
              Deduir que $H$ és un difeomorfisme local $\mathcal{C}^\infty$ en tot punt.
            idea: |
              Aplicar el teorema de la funció inversa punt per punt.
            detall: |
              $H$ és $\mathcal{C}^\infty$ i $\det JH\neq 0$ a cada punt; pel teorema de la funció inversa, en cada punt hi ha un entorn on $H$ és bijectiva sobre un obert amb inversa $\mathcal{C}^\infty$.
            fuites: []
            teoria: ["T4.5", "T4.9"]
          - id: injectivitat
            titol: "Quan dos punts tenen la mateixa imatge"
            objectiu: |
              Caracteritzar quan $H(r,\varphi,z)=H(r',\varphi',z')$.
            idea: |
              La tercera component és la identitat; les dues primeres són les polars.
            detall: |
              $z=z'$ i $(r\cos\varphi,r\sin\varphi)=(r'\cos\varphi',r'\sin\varphi')$, que dona $r=r'$ i $\varphi-\varphi'\in 2\pi\mathbb{Z}$.
            fuites: ['2\s*\\pi\s*\\mathbb\s*\{?\s*Z']
            teoria: []
          - id: oberts_maxims
            titol: "Oberts màxims"
            objectiu: |
              Trobar oberts del domini on la restricció de $H$ sigui un difeomorfisme i que no es puguin ampliar, i la seva imatge.
            idea: |
              Limitar només la variable angular, com a les polars.
            detall: |
              $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)\times\mathbb{R}$: $H|_{U_\alpha}$ és injectiva, $\mathcal{C}^\infty$ i amb $\det JH\neq 0$, per tant un difeomorfisme sobre $H(U_\alpha)=\mathbb{R}^3\setminus\{(t\cos\alpha,t\sin\alpha,z)\mid t\geq 0,\ z\in\mathbb{R}\}$. És màxim pel mateix argument que a les polars.
            fuites: ['\\alpha\s*\+\s*2\s*\\pi']
            teoria: ["T4.9"]
        errors_comuns:
          - id: global_per_jacobiana
            descripcio: |
              Conclou que $H$ és difeomorfisme global perquè $\det JH\neq 0$.
            pregunta: |
              Què val $H(r,\varphi+2\pi,z)$?
          - id: imatge_eix
            descripcio: |
              Oblida que l'eix $z$ no és a la imatge (perquè $r>0$) o descriu malament la imatge.
            pregunta: |
              Quins punts $(x,y,z)$ tenen $x^2+y^2=0$? Poden ser imatge d'algun punt amb $r>0$?
        nota_professor: |
          És el producte de les polars per la identitat en $z$; tot l'argument de l'apartat (a) es trasllada directament.

  - num: 10
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t4-10"
        apartat: null
        tipus: calcul
        enunciat: |
          Siguin $G:\mathbb{R}^2\to\mathbb{R}^2$ definida per $G(u,v)=(u+v,\ v-u^2)$ i $T$ l'interior del triangle limitat per les rectes $u+v=2$, $u=0$, $v=0$. Determineu el recinte $S=G(T)$ i comproveu que $G:T\to S$ és un canvi de variables (o difeomorfisme).
        teoria: ["T4.9"]
        teoria_reservada: []
        resultat:
          valor: |
            $S=G(T)=\{(x,y)\in\mathbb{R}^2\mid 0<x<2,\ -x^2<y<x\}$ (limitat per la recta $y=x$, la paràbola $y=-x^2$ i la recta $x=2$). $G$ és $\mathcal{C}^\infty$, $\det JG(u,v)=1+2u>0$ a $T$, i $G:T\to S$ és bijectiva amb inversa $u=\frac{-1+\sqrt{1+4(x-y)}}{2}$, $v=x-u$, de classe $\mathcal{C}^\infty$. Per tant $G:T\to S$ és un difeomorfisme.
          fuites: ['-\s*x\s*\^\s*\{?2\}?\s*<\s*y\s*<\s*x', 'y\s*=\s*-\s*x\s*\^\s*\{?2\}?']
        passos:
          - id: imatge_vores
            titol: "Imatge de les vores"
            objectiu: |
              Determinar en què es transformen els tres costats del triangle.
            idea: |
              Parametritzeu cada costat i apliqueu-hi $G$; és útil anomenar $(x,y)=G(u,v)$ i expressar la corba imatge com a relació entre $x$ i $y$.
            detall: |
              Costat $u=0$, $0<v<2$: $(x,y)=(v,v)$, segment de $y=x$ amb $0<x<2$. Costat $v=0$, $0<u<2$: $(x,y)=(u,-u^2)$, arc de paràbola $y=-x^2$ amb $0<x<2$. Costat $u+v=2$, $0<u<2$: $x=2$, $y=2-u-u^2\in(-4,2)$, segment vertical de $(2,2)$ a $(2,-4)$. El candidat és la regió limitada per aquestes tres corbes.
            fuites: ['y\s*=\s*-\s*x\s*\^\s*\{?2\}?', '\(\s*2\s*,\s*-\s*4\s*\)']
            teoria: []
          - id: invertir
            titol: "Resoldre G(u,v)=(x,y)"
            objectiu: |
              Determinar exactament $S$ i veure que cada punt de $S$ té una única antiimatge a $T$.
            idea: |
              Aïlleu $v$ de la primera equació i substituïu a la segona: queda una equació de segon grau en $u$. Traduïu les condicions $u>0$, $v>0$, $u+v<2$ en condicions sobre $(x,y)$.
            detall: |
              $v=x-u$ i $y=x-u-u^2$, és a dir $u^2+u=x-y$. Amb $u>0$ cal $x-y>0$ i aleshores l'única arrel positiva és $u=\frac{-1+\sqrt{1+4(x-y)}}{2}$. La condició $v>0$ és $u<x$; com que $t\mapsto t^2+t$ és creixent per $t>0$, $u<x\iff x-y<x^2+x\iff y>-x^2$. La condició $u+v<2$ és $x<2$. Per tant $(x,y)\in G(T)$ si i només si $0<x<2$ i $-x^2<y<x$ (a més $x=u+v>0$; recíprocament, si $0<x<2$ i $-x^2<y<x$, la $u$ anterior compleix $u>0$, $v=x-u>0$ i $u+v=x<2$), i l'antiimatge és única: $G:T\to S$ és bijectiva amb $S=\{0<x<2,\ -x^2<y<x\}$.
            fuites: ['u\s*\^\s*\{?2\}?\s*\+\s*u\s*=\s*x\s*-\s*y', '\\sqrt\s*\{\s*1\s*\+\s*4', '-\s*x\s*\^\s*\{?2\}?\s*<\s*y']
            teoria: []
          - id: jacobiana
            titol: "Jacobiana"
            objectiu: |
              Comprovar que la diferencial de $G$ és invertible a tot $T$.
            idea: |
              Calculeu $\det JG(u,v)$ i useu el signe de $u$ a $T$.
            detall: |
              $JG(u,v)=\begin{pmatrix}1&1\\ -2u&1\end{pmatrix}$, $\det JG(u,v)=1+2u>0$ per $u>0$, en particular a tot $T$.
            fuites: ['1\s*\+\s*2\s*u']
            teoria: []
          - id: concloure
            titol: "Concloure que és un difeomorfisme"
            objectiu: |
              Justificar que $G:T\to S$ és un canvi de variables.
            idea: |
              Un difeomorfisme és una bijecció $\mathcal{C}^1$ entre oberts amb inversa $\mathcal{C}^1$; equivalentment, una aplicació $\mathcal{C}^1$ injectiva amb jacobiana invertible a cada punt de l'obert.
            detall: |
              $T$ és obert, $G$ és polinòmica ($\mathcal{C}^\infty$), injectiva a $T$ i amb $\det JG\neq 0$ a $T$. Pel teorema de la funció inversa (aplicat a cada punt), $S=G(T)$ és obert i la inversa és $\mathcal{C}^\infty$; també es veu directament de la fórmula explícita, ja que $1+4(x-y)>1$ a $S$. Per tant $G:T\to S$ és un difeomorfisme $\mathcal{C}^\infty$.
            fuites: []
            teoria: ["T4.9", "T4.5", "T4.8"]
        errors_comuns:
          - id: imatge_triangle
            descripcio: |
              Suposa que la imatge del triangle és el triangle de vèrtexs $G(0,0)$, $G(2,0)$, $G(0,2)$, com si $G$ fos lineal.
            pregunta: |
              $G$ és lineal? En què es transforma el costat $v=0$ quan hi apliques $G$?
          - id: sense_injectivitat
            descripcio: |
              Només comprova $\det JG\neq 0$ i conclou que és un difeomorfisme, sense provar la injectivitat.
            pregunta: |
              Que la jacobiana sigui invertible a cada punt garanteix que dos punts diferents de $T$ no tinguin la mateixa imatge?
          - id: arrel_equivocada
            descripcio: |
              En aïllar $u$ pren l'arrel negativa o no comprova que l'arrel triada compleixi $u>0$ i $v>0$.
            pregunta: |
              De les dues solucions de l'equació en $u$, quantes compleixen les condicions de $T$?
        nota_professor: |
          La injectivitat també es pot provar directament: $G(u,v)=G(u',v')$ implica $(u-u')(u+u'+1)=0$ i $u+u'+1>0$ a $T$.

  - num: 11
    font: null
    preambul: |
      Per cadascun dels següents oberts $U\subseteq\mathbb{R}^2$, estudieu si la funció $G:U\to G(U)$ definida per $G(x,y)=(x^2-y^2,2xy)$ és un canvi de variables (o difeomorfisme):
    indicacio: null
    exercicis:
      - id: "t4-11a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          $U=\mathbb{R}^2$;
        teoria: ["T4.9"]
        teoria_reservada: []
        resultat:
          valor: |
            No és un difeomorfisme: $G(-x,-y)=G(x,y)$, així que no és injectiva; a més $\det JG(0,0)=0$.
          fuites: ['no\s+és\s+(un\s+)?(canvi|difeomorfisme)', 'G\s*\(\s*-\s*x\s*,\s*-\s*y\s*\)']
        passos:
          - id: jacobiana
            titol: "Jacobiana"
            objectiu: |
              Estudiar on la diferencial de $G$ és invertible.
            idea: |
              Calculeu $\det JG(x,y)$ i mireu on s'anul·la.
            detall: |
              $JG(x,y)=\begin{pmatrix}2x&-2y\\ 2y&2x\end{pmatrix}$, $\det JG(x,y)=4(x^2+y^2)$, que només s'anul·la a l'origen.
            fuites: ['4\s*\(\s*x\s*\^\s*\{?2\}?\s*\+\s*y\s*\^\s*\{?2\}?\s*\)']
            teoria: []
          - id: injectivitat
            titol: "Injectivitat"
            objectiu: |
              Decidir si $G$ és injectiva a $\mathbb{R}^2$.
            idea: |
              Busqueu una simetria de $G$: quines transformacions del punt deixen $x^2-y^2$ i $2xy$ invariants?
            detall: |
              $G(-x,-y)=G(x,y)$ i $(x,y)\neq(-x,-y)$ si $(x,y)\neq(0,0)$; per exemple $G(1,0)=G(-1,0)=(1,0)$. No és injectiva.
            fuites: ['G\s*\(\s*-\s*x\s*,\s*-\s*y\s*\)', 'G\s*\(\s*-\s*1\s*,\s*0\s*\)', 'no\s+és\s+injectiva']
            teoria: []
          - id: concloure
            titol: "Conclusió"
            objectiu: |
              Decidir si $G:\mathbb{R}^2\to G(\mathbb{R}^2)$ és un canvi de variables.
            idea: |
              Un difeomorfisme ha de ser bijectiu i amb inversa diferenciable.
            detall: |
              Com que no és injectiva, no és un difeomorfisme. A més, a l'origen $\det JG(0,0)=0$, per tant cap inversa local podria ser diferenciable en $G(0,0)=(0,0)$.
            fuites: []
            teoria: ["T4.9"]
        errors_comuns:
          - id: oblida_origen
            descripcio: |
              No s'adona que la jacobiana s'anul·la a l'origen.
            pregunta: |
              Hi ha algun punt de $\mathbb{R}^2$ on $\det JG$ valgui zero?
          - id: jacobiana_suficient
            descripcio: |
              Pensa que si $\det JG\neq 0$ a gairebé tot arreu, $G$ és un difeomorfisme.
            pregunta: |
              El teorema de la funció inversa et dona injectivitat a tot $U$ o només en un entorn de cada punt?
        nota_professor: |
          Identificant $(x,y)$ amb $z=x+iy$, $G(z)=z^2$; és l'anàleg quadràtic de l'exemple T4.3 ($z^3$).

      - id: "t4-11b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          $U=\{(x,y)\in\mathbb{R}^2\mid x>0\}$;
        teoria: ["T4.9"]
        teoria_reservada: []
        resultat:
          valor: |
            Sí que és un difeomorfisme: $\det JG=4(x^2+y^2)>0$ a $U$ i $G$ és injectiva a $U$. La imatge és $G(U)=\mathbb{R}^2\setminus\{(s,0)\mid s\leq 0\}$.
          fuites: ['\{\s*\(\s*s\s*,\s*0\s*\)\s*\\mid\s*s\s*(\\le|\\leq|\\leqslant|≤)\s*0', 'semieix\s+(real\s+)?negatiu']
        passos:
          - id: jacobiana
            titol: "Jacobiana"
            objectiu: |
              Comprovar que la diferencial de $G$ és invertible a tot $U$.
            idea: |
              Calculeu $\det JG$ i observeu que l'únic punt problemàtic no és a $U$.
            detall: |
              $\det JG(x,y)=4(x^2+y^2)$, que és $>0$ a $U$ perquè l'origen no hi pertany.
            fuites: ['4\s*\(\s*x\s*\^\s*\{?2\}?\s*\+\s*y\s*\^\s*\{?2\}?\s*\)']
            teoria: []
          - id: injectivitat
            titol: "Injectivitat a U"
            objectiu: |
              Provar que $G$ és injectiva al semiplà $x>0$.
            idea: |
              Si $G(a,b)=G(c,d)$, la suma dels quadrats de les components de la imatge dona informació sobre la norma; combineu-ho amb la primera component.
            detall: |
              Si $G(a,b)=G(c,d)$, com que $(x^2-y^2)^2+(2xy)^2=(x^2+y^2)^2$, tenim $a^2+b^2=c^2+d^2$. Sumant amb $a^2-b^2=c^2-d^2$: $a^2=c^2$, i com que $a,c>0$, $a=c$. De $2ab=2cd$ amb $a=c\neq 0$, $b=d$. Per tant $G|_U$ és injectiva.
            fuites: ['a\s*\^\s*\{?2\}?\s*\+\s*b\s*\^\s*\{?2\}?\s*=\s*c\s*\^\s*\{?2\}?\s*\+\s*d\s*\^\s*\{?2\}?', '\(\s*x\s*\^\s*\{?2\}?\s*\+\s*y\s*\^\s*\{?2\}?\s*\)\s*\^\s*\{?2']
            teoria: []
          - id: concloure
            titol: "Conclusió i imatge"
            objectiu: |
              Concloure si $G:U\to G(U)$ és un canvi de variables i descriure $G(U)$.
            idea: |
              Una aplicació $\mathcal{C}^1$ injectiva en un obert amb jacobiana invertible a cada punt és un difeomorfisme sobre la seva imatge. Per la imatge, penseu en polars: què fa $G$ amb el mòdul i amb l'angle?
            detall: |
              $G$ és $\mathcal{C}^\infty$, injectiva a $U$ i amb $\det JG\neq 0$; pel teorema de la funció inversa $G(U)$ és obert i la inversa és $\mathcal{C}^\infty$: és un difeomorfisme. En polars, $G(\rho\cos t,\rho\sin t)=(\rho^2\cos 2t,\rho^2\sin 2t)$; $U$ correspon a $t\in(-\frac{\pi}{2},\frac{\pi}{2})$, per tant $2t\in(-\pi,\pi)$ i $G(U)=\mathbb{R}^2\setminus\{(s,0)\mid s\leq 0\}$.
            fuites: ['\{\s*\(\s*s\s*,\s*0\s*\)\s*\\mid\s*s\s*(\\le|\\leq|\\leqslant|≤)\s*0', '\(\s*-\s*\\pi\s*,\s*\\pi\s*\)']
            teoria: ["T4.9", "T4.5"]
        errors_comuns:
          - id: injectivitat_per_jacobiana
            descripcio: |
              Dedueix la injectivitat a partir de $\det JG\neq 0$.
            pregunta: |
              A l'apartat (a), fora de l'origen el determinant tampoc s'anul·la. Era injectiva allà?
          - id: arrel_signe
            descripcio: |
              De $a^2=c^2$ conclou $a=c$ sense usar que $a,c>0$.
            pregunta: |
              Quina hipòtesi sobre els punts de $U$ estàs fent servir per passar de $a^2=c^2$ a $a=c$?
        nota_professor: |
          En complex: $z^2=w^2\iff(z-w)(z+w)=0$, i si $\mathrm{Re}\,z,\mathrm{Re}\,w>0$ aleshores $z+w\neq 0$.

      - id: "t4-11c"
        apartat: "c"
        tipus: calcul
        enunciat: |
          $U=\{(x,y)\in\mathbb{R}^2\mid |y|>|x|\}$;
        teoria: ["T4.9"]
        teoria_reservada: []
        resultat:
          valor: |
            No és un difeomorfisme: tot i que $\det JG\neq 0$ a $U$ (l'origen no hi és), $U$ és simètric respecte de l'origen i $G(-x,-y)=G(x,y)$, així que $G|_U$ no és injectiva (per exemple $G(0,1)=G(0,-1)=(-1,0)$).
          fuites: ['no\s+és\s+(un\s+)?(canvi|difeomorfisme)', 'G\s*\(\s*0\s*,\s*-\s*1\s*\)']
        passos:
          - id: jacobiana
            titol: "Jacobiana"
            objectiu: |
              Estudiar si la diferencial de $G$ és invertible a $U$.
            idea: |
              Calculeu $\det JG$ i comproveu si el punt on s'anul·la pertany a $U$.
            detall: |
              $\det JG(x,y)=4(x^2+y^2)$, només nul a l'origen, que no és de $U$ (allà $|y|=|x|$). Per tant $G$ és un difeomorfisme local a cada punt de $U$.
            fuites: ['4\s*\(\s*x\s*\^\s*\{?2\}?\s*\+\s*y\s*\^\s*\{?2\}?\s*\)']
            teoria: ["T4.5"]
          - id: injectivitat
            titol: "Injectivitat a U"
            objectiu: |
              Decidir si $G$ és injectiva a $U$.
            idea: |
              Mireu si $U$ és invariant per alguna transformació que deixi $G$ invariant.
            detall: |
              Si $(x,y)\in U$ aleshores $(-x,-y)\in U$, i $G(-x,-y)=G(x,y)$. Per exemple $(0,1),(0,-1)\in U$ i $G(0,1)=G(0,-1)=(-1,0)$. No és injectiva.
            fuites: ['G\s*\(\s*0\s*,\s*-\s*1\s*\)', '\(\s*-\s*x\s*,\s*-\s*y\s*\)\s*\\in\s*U', 'no\s+és\s+injectiva']
            teoria: []
          - id: concloure
            titol: "Conclusió"
            objectiu: |
              Decidir si $G:U\to G(U)$ és un canvi de variables.
            idea: |
              Un difeomorfisme ha de ser, en particular, bijectiu sobre la imatge.
            detall: |
              Com que $G|_U$ no és injectiva, no és un difeomorfisme, encara que sigui difeomorfisme local a cada punt. (La imatge és el semiplà $\{(s,t)\mid s<0\}$, i cada punt hi té exactament dues antiimatges, una a cada component connexa de $U$.)
            fuites: []
            teoria: ["T4.9"]
        errors_comuns:
          - id: jacobiana_suficient
            descripcio: |
              Conclou que és un difeomorfisme perquè $\det JG\neq 0$ a tot $U$.
            pregunta: |
              Has comprovat que dos punts diferents de $U$ no puguin tenir la mateixa imatge?
          - id: no_veu_simetria
            descripcio: |
              No s'adona que $U$ té dues components simètriques respecte de l'origen.
            pregunta: |
              Si $(x,y)$ és de $U$, què pots dir del punt $(-x,-y)$?
        nota_professor: |
          Restringit a una sola component, per exemple $\{y>|x|\}$, sí que seria un difeomorfisme (està dins del semiplà $y>0$, on $G$ és injectiva pel mateix argument que a (b)).

      - id: "t4-11d"
        apartat: "d"
        tipus: calcul
        enunciat: |
          $U=\{(x,y)\in\mathbb{R}^2\mid x>0,\ y>0\}$.
        teoria: ["T4.9"]
        teoria_reservada: []
        resultat:
          valor: |
            Sí que és un difeomorfisme: $\det JG=4(x^2+y^2)\neq 0$ a $U$ i $G$ és injectiva a $U$ (perquè $U\subseteq\{x>0\}$, apartat (b)). La imatge és el semiplà superior $G(U)=\{(s,t)\in\mathbb{R}^2\mid t>0\}$.
          fuites: ['\{\s*\(\s*s\s*,\s*t\s*\)[^$]{0,40}t\s*>\s*0', 'semipl[àa]\s+superior', 'semipl[àa]\s*\$?\s*\{?\s*(t|y)\s*>\s*0']
        passos:
          - id: jacobiana
            titol: "Jacobiana"
            objectiu: |
              Comprovar que la diferencial de $G$ és invertible a tot $U$.
            idea: |
              Calculeu $\det JG$; l'origen no és a $U$.
            detall: |
              $\det JG(x,y)=4(x^2+y^2)>0$ a $U$.
            fuites: ['4\s*\(\s*x\s*\^\s*\{?2\}?\s*\+\s*y\s*\^\s*\{?2\}?\s*\)']
            teoria: []
          - id: injectivitat
            titol: "Injectivitat a U"
            objectiu: |
              Provar que $G$ és injectiva al primer quadrant obert.
            idea: |
              Relacioneu $U$ amb un dels oberts dels apartats anteriors.
            detall: |
              $U\subseteq\{x>0\}$, i a l'apartat (b) hem vist que $G$ és injectiva a $\{x>0\}$; per tant també ho és a $U$. (Directament: $G(a,b)=G(c,d)$ dona $a^2+b^2=c^2+d^2$ i $a^2-b^2=c^2-d^2$, d'on $a=c$ i $b=d$ per positivitat.)
            fuites: []
            teoria: []
          - id: concloure
            titol: "Conclusió i imatge"
            objectiu: |
              Concloure si $G:U\to G(U)$ és un canvi de variables i descriure $G(U)$.
            idea: |
              Injectiva, $\mathcal{C}^1$ i amb jacobiana invertible en un obert implica difeomorfisme sobre la imatge. Per la imatge, penseu què fa $G$ amb l'angle polar.
            detall: |
              Pel teorema de la funció inversa, $G(U)$ és obert i la inversa és $\mathcal{C}^\infty$: $G$ és un difeomorfisme. En polars $U$ correspon a angles $t\in(0,\frac{\pi}{2})$, que $G$ porta a $2t\in(0,\pi)$ amb mòdul $\rho^2\in(0,\infty)$: $G(U)=\{(s,t)\mid t>0\}$, el semiplà superior obert.
            fuites: ['\{\s*\(\s*s\s*,\s*t\s*\)[^$]{0,40}t\s*>\s*0', 'semipl[àa]\s+superior', 'semipl[àa]\s*\$?\s*\{?\s*(t|y)\s*>\s*0']
            teoria: ["T4.9", "T4.5"]
        errors_comuns:
          - id: injectivitat_per_jacobiana
            descripcio: |
              Dedueix la injectivitat de $\det JG\neq 0$.
            pregunta: |
              A l'apartat (c) el determinant tampoc s'anul·lava. Era injectiva?
          - id: imatge_quadrant
            descripcio: |
              Creu que la imatge del primer quadrant és el primer quadrant.
            pregunta: |
              Quina és la imatge del punt $(1,1)$? És al primer quadrant?

  - num: 12
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t4-12a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          Comproveu quines hipòtesis i quines tesis del teorema de la funció inversa satisfà $f(x)=x^3$.
        teoria: ["T4.5"]
        teoria_reservada: []
        resultat:
          valor: |
            $f$ és $\mathcal{C}^\infty$. En punts $a\neq 0$, $f'(a)=3a^2\neq 0$: es compleixen totes les hipòtesis i totes les tesis. En $a=0$ falla la hipòtesi $f'(0)\neq 0$. Tesis en $0$: (i) injectivitat — sí ($f$ és estrictament creixent, bijectiva $\mathbb{R}\to\mathbb{R}$), però $f'(z)\neq 0$ a tot l'entorn — no ($f'(0)=0$); (ii) $f(U)$ obert — sí; (iii) la inversa $f^{-1}(y)=\sqrt[3]{y}$ és contínua però no és derivable en $0$, per tant no és $\mathcal{C}^1$ (ni la fórmula de la derivada té sentit).
          fuites: ['inversa[^.]{0,60}no\s+és\s+(derivable|diferenciable)']
        passos:
          - id: hipotesis
            titol: "Hipòtesis"
            objectiu: |
              Comprovar quines hipòtesis del teorema de la funció inversa compleix $f$, i en quins punts.
            idea: |
              Les hipòtesis són regularitat $\mathcal{C}^r$ en un obert i jacobiana (aquí, derivada) no nul·la en el punt.
            detall: |
              $f$ és polinòmica, $\mathcal{C}^\infty(\mathbb{R})$. $f'(a)=3a^2$, no nul si $a\neq 0$; en $a=0$, $f'(0)=0$ i la hipòtesi falla. En $a\neq 0$ el teorema s'aplica i dona totes les tesis, així que l'interès és el punt $0$.
            fuites: ['f\s*''\s*\(\s*0\s*\)\s*=\s*0']
            teoria: ["T4.5", "T4.2"]
          - id: tesis_i_ii
            titol: "Injectivitat i obertura"
            objectiu: |
              Estudiar en $0$ les tesis (i) i (ii): injectivitat local, derivada no nul·la a l'entorn i imatge oberta.
            idea: |
              Penseu en la monotonia de $x^3$ i en la imatge d'un interval obert per una funció contínua estrictament monòtona.
            detall: |
              $f$ és estrictament creixent a $\mathbb{R}$, per tant injectiva en qualsevol entorn de $0$, i porta $(-\delta,\delta)$ a $(-\delta^3,\delta^3)$, obert. Però la segona part de (i), $f'(z)\neq 0$ per a tot $z$ de l'entorn, falla perquè $f'(0)=0$.
            fuites: []
            teoria: []
          - id: tesi_iii
            titol: "Regularitat de la inversa"
            objectiu: |
              Estudiar en $f(0)=0$ la tesi (iii): diferenciabilitat (i classe $\mathcal{C}^r$) de la inversa.
            idea: |
              Escriviu la inversa explícitament i estudieu el quocient incremental en $0$.
            detall: |
              $f^{-1}(y)=\sqrt[3]{y}=y^{1/3}$, contínua. En $0$: $\frac{f^{-1}(h)-f^{-1}(0)}{h}=h^{-2/3}\to+\infty$, de manera que $f^{-1}$ no és derivable en $0$. Falla la tesi (iii), coherent amb que la fórmula $(f^{-1})'(0)=1/f'(0)$ no té sentit.
            fuites: ['h\s*\^\s*\{?\s*-\s*2\s*/\s*3', 'no\s+és\s+derivable\s+(a|en)\s+\$?\s*0']
            teoria: ["T3.8"]
        errors_comuns:
          - id: no_invertible
            descripcio: |
              Creu que, com que $f'(0)=0$, $f$ no és invertible a prop de $0$.
            pregunta: |
              És $x^3$ injectiva a prop de $0$? Les hipòtesis del teorema són necessàries o suficients?
          - id: inversa_regular
            descripcio: |
              Pensa que la inversa d'una funció $\mathcal{C}^\infty$ bijectiva és automàticament diferenciable.
            pregunta: |
              Com és la gràfica de $\sqrt[3]{y}$ a l'origen? Quin pendent hi té la recta tangent?
          - id: oblida_punts_no_nuls
            descripcio: |
              Només estudia el punt $0$ i no diu res dels altres punts.
            pregunta: |
              Què passa en un punt $a\neq 0$? S'hi compleixen les hipòtesis?

      - id: "t4-12b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          Doneu un exemple de funció a $\mathbb{R}^2$ que satisfaci les mateixes hipòtesis i tesis que la funció anterior.
        teoria: ["T4.5"]
        teoria_reservada: []
        resultat:
          valor: |
            Per exemple $F(x,y)=(x^3,y)$ al punt $(0,0)$: és $\mathcal{C}^\infty$, $\det JF(0,0)=0$ (falla la hipòtesi), és bijectiva de $\mathbb{R}^2$ en $\mathbb{R}^2$ (injectiva, imatge oberta), però la inversa $F^{-1}(u,v)=(\sqrt[3]{u},v)$, contínua, no és diferenciable a $(0,0)$.
          fuites: ['\(\s*x\s*\^\s*\{?3\}?\s*,\s*y\s*\)', '\(\s*x\s*\^\s*\{?3\}?\s*,\s*y\s*\^\s*\{?3\}?\s*\)']
        passos:
          - id: construir
            titol: "Construir l'exemple"
            objectiu: |
              Proposar una funció de $\mathbb{R}^2$ en $\mathbb{R}^2$ amb el mateix comportament que la de l'apartat (a) en un punt.
            idea: |
              Feu servir la funció de l'apartat (a) en una de les variables i una funció ben regular en l'altra.
            detall: |
              $F(x,y)=(x^3,y)$, al punt $(0,0)$ (també serviria $(x^3,y^3)$).
            fuites: ['\(\s*x\s*\^\s*\{?3\}?\s*,\s*y\s*\)', '\(\s*x\s*\^\s*\{?3\}?\s*,\s*y\s*\^\s*\{?3\}?\s*\)']
            teoria: []
          - id: hipotesis
            titol: "Hipòtesis"
            objectiu: |
              Comprovar quines hipòtesis del teorema compleix l'exemple al punt escollit.
            idea: |
              Calculeu la jacobiana al punt.
            detall: |
              $F$ és $\mathcal{C}^\infty$ i $JF(x,y)=\begin{pmatrix}3x^2&0\\ 0&1\end{pmatrix}$, amb $\det JF(0,0)=0$: falla la mateixa hipòtesi que a (a).
            fuites: []
            teoria: ["T3.31"]
          - id: tesis
            titol: "Tesis"
            objectiu: |
              Comprovar quines tesis compleix l'exemple.
            idea: |
              Calculeu la inversa explícitament i estudieu-ne les derivades parcials a l'origen.
            detall: |
              $F$ és bijectiva $\mathbb{R}^2\to\mathbb{R}^2$ amb inversa $F^{-1}(u,v)=(\sqrt[3]{u},v)$, contínua; per tant és injectiva en tot entorn i porta oberts a oberts. Però $\frac{\partial}{\partial u}\sqrt[3]{u}$ no existeix en $u=0$, de manera que $F^{-1}$ no és diferenciable a $(0,0)$; i $\det JF$ s'anul·la a tot l'eix $x=0$ de qualsevol entorn. Mateixes tesis satisfetes i fallides que a (a).
            fuites: ['\\sqrt\s*\[\s*3\s*\]\s*\{?\s*u']
            teoria: ["T3.8"]
        errors_comuns:
          - id: exemple_amb_jacobiana_no_nula
            descripcio: |
              Dona un exemple on el determinant de la jacobiana no s'anul·la al punt (aleshores satisfà totes les hipòtesis, no les mateixes que $x^3$).
            pregunta: |
              Quina hipòtesi fallava a l'apartat (a)? Falla també en el teu exemple?
          - id: exemple_no_injectiu
            descripcio: |
              Proposa una funció que no és localment injectiva (per exemple $(x^2,y)$), que no satisfà les mateixes tesis.
            pregunta: |
              La teva funció és injectiva en algun entorn del punt?
        nota_professor: |
          "Mateixes hipòtesis i tesis" s'interpreta com: falla $\det JF(p)\neq 0$, hi ha inversa (continua) i imatge oberta, però la inversa no és diferenciable. L'apartat (c) justifica en general per què la inversa no pot ser diferenciable.

      - id: "t4-12c"
        apartat: "c"
        tipus: teoric
        enunciat: |
          Proveu que si $F:\mathbb{R}^m\to\mathbb{R}^m$ és diferenciable i invertible al voltant d'un punt $a$ on $\det JF(a)=0$, aleshores la inversa no pot ser diferenciable a $F(a)$.
        teoria: ["T3.8"]
        teoria_reservada: []
        resultat:
          valor: |
            Si $G=F^{-1}$ fos diferenciable a $b=F(a)$, com que $G\circ F=\mathrm{Id}$ en un entorn de $a$, la regla de la cadena donaria $JG(b)\,JF(a)=I$, i prenent determinants $\det JG(b)\cdot\det JF(a)=1$, en contradicció amb $\det JF(a)=0$.
          fuites: []
        passos:
          - id: plantejament
            titol: "Plantejament per reducció a l'absurd"
            objectiu: |
              Escriure amb precisió la hipòtesi d'invertibilitat local i què vol dir que la inversa sigui diferenciable a $F(a)$.
            idea: |
              Suposeu que la inversa és diferenciable i busqueu una identitat entre funcions que lligui $F$ i la seva inversa en un entorn de $a$.
            detall: |
              Hi ha entorns oberts $U\ni a$ i $V\ni b=F(a)$ amb $F:U\to V$ bijectiva; sigui $G=F^{-1}:V\to U$ i suposem $G$ diferenciable a $b$ (punt interior de $V$). Aleshores $G(F(x))=x$ per a tot $x\in U$, és a dir $G\circ F=\mathrm{Id}$ a l'obert $U$.
            fuites: []
            teoria: ["T3.8"]
          - id: regla_cadena
            titol: "Aplicar la regla de la cadena"
            objectiu: |
              Obtenir una relació entre les jacobianes de $F$ en $a$ i de la inversa en $F(a)$.
            idea: |
              Deriveu la identitat del pas anterior al punt $a$; comproveu que es compleixen les hipòtesis de diferenciabilitat necessàries.
            detall: |
              $F$ és diferenciable en $a$ i $G$ en $F(a)=b$, punts interiors; per la regla de la cadena $G\circ F$ és diferenciable en $a$ i $JG(b)\,JF(a)=J(\mathrm{Id})(a)=I_m$.
            fuites: ['J\s*G\s*\(\s*b\s*\)\s*(\\[,;]|\\cdot)?\s*J\s*F\s*\(\s*a\s*\)\s*=']
            teoria: ["T3.21", "T3.22"]
          - id: determinants
            titol: "Contradicció amb els determinants"
            objectiu: |
              Arribar a una contradicció amb la hipòtesi sobre $\det JF(a)$.
            idea: |
              El determinant és multiplicatiu.
            detall: |
              $1=\det I_m=\det JG(b)\cdot\det JF(a)=\det JG(b)\cdot 0=0$, absurd. Per tant $G$ no pot ser diferenciable a $F(a)$.
            fuites: ['\\det\s*J\s*G\s*\(\s*b\s*\)\s*(\\cdot\s*)?\\det\s*J\s*F\s*\(\s*a\s*\)']
            teoria: []
        errors_comuns:
          - id: cadena_sense_hipotesis
            descripcio: |
              Aplica la regla de la cadena a $G\circ F$ sense haver suposat que $G$ és diferenciable (cercle viciós), o la usa fora d'un entorn on $G\circ F=\mathrm{Id}$.
            pregunta: |
              Quines hipòtesis demana la regla de la cadena? On fas servir la suposició que vols refutar?
          - id: confon_amb_tfi
            descripcio: |
              Argumenta que "el teorema de la funció inversa no s'aplica", que no prova res: el teorema dona condicions suficients, no necessàries.
            pregunta: |
              Si les hipòtesis d'un teorema no es compleixen, pots concloure que la seva tesi és falsa?
        nota_professor: |
          Il·lustra els apartats (a) i (b): allà la inversa existeix però no és diferenciable, com ha de ser.

      - id: "t4-12d"
        apartat: "d"
        tipus: teoric
        enunciat: |
          Doneu un exemple de funció $f:U\subseteq\mathbb{R}\to\mathbb{R}$ localment invertible en $p\in U$ que no sigui de classe $\mathcal{C}^1$ en $U$, però que tingui inversa de classe $\mathcal{C}^1$.
        teoria: ["T3.20"]
        teoria_reservada: []
        resultat:
          valor: |
            Per exemple $f(x)=\sqrt[3]{x}$ a $U=\mathbb{R}$, $p=0$: és bijectiva (localment invertible a $0$), no és derivable en $0$ (per tant no és $\mathcal{C}^1$ en $U$), i la seva inversa $f^{-1}(y)=y^3$ és $\mathcal{C}^\infty$.
          fuites: ['\\sqrt\s*\[\s*3\s*\]\s*\{?\s*x', 'x\s*\^\s*\{?\s*1\s*/\s*3', 'x\s*\^\s*\{?\s*\\frac\s*\{?\s*1\s*\}?\s*\{?\s*3']
        passos:
          - id: construir
            titol: "Construir l'exemple"
            objectiu: |
              Trobar una funció localment invertible, no $\mathcal{C}^1$, amb inversa $\mathcal{C}^1$.
            idea: |
              Penseu-ho al revés: busqueu primer una funció $\mathcal{C}^1$ bijectiva la inversa de la qual no sigui diferenciable (l'apartat (a) en dona una) i intercanvieu els papers.
            detall: |
              $g(y)=y^3$ és $\mathcal{C}^\infty$ i bijectiva amb inversa no derivable en $0$. Prenem $f=g^{-1}$, és a dir $f(x)=\sqrt[3]{x}$, $U=\mathbb{R}$, $p=0$.
            fuites: ['\\sqrt\s*\[\s*3\s*\]\s*\{?\s*x', 'x\s*\^\s*\{?\s*1\s*/\s*3']
            teoria: []
          - id: verificar
            titol: "Verificar les propietats"
            objectiu: |
              Comprovar que l'exemple compleix totes les condicions.
            idea: |
              Comproveu la invertibilitat, la no derivabilitat en $p$ amb el quocient incremental, i la regularitat de la inversa.
            detall: |
              $f$ és contínua i estrictament creixent, bijectiva $\mathbb{R}\to\mathbb{R}$: localment invertible a $0$. $\frac{f(h)-f(0)}{h}=h^{-2/3}\to+\infty$, així que $f$ no és derivable en $0$ i no és $\mathcal{C}^1$ en cap $U\ni 0$. La inversa $y\mapsto y^3$ és $\mathcal{C}^\infty$. (Coherent amb (c): $(f^{-1})'(0)=0$.)
            fuites: ['h\s*\^\s*\{?\s*-\s*2\s*/\s*3']
            teoria: ["T3.20"]
        errors_comuns:
          - id: exemple_c1
            descripcio: |
              Dona una funció que sí és $\mathcal{C}^1$.
            pregunta: |
              La funció que proposes, és derivable a $p$? I la derivada hi és contínua?
          - id: no_invertible
            descripcio: |
              Proposa una funció no derivable però no injectiva a prop de $p$ (per exemple $|x|$).
            pregunta: |
              La teva funció és injectiva en algun entorn de $p$?

  - num: 13
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t4-13a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          Sigui $I\subseteq\mathbb{R}$ un interval obert. Demostreu que tota funció $g:I\to\mathbb{R}$ de classe $\mathcal{C}^1$ tal que $g'(x)\neq 0$ per tot $x\in I$ té inversa global de classe $\mathcal{C}^1$ en $g(I)$.
        teoria: ["T3.20"]
        teoria_reservada: ["T4.1"]
        resultat:
          valor: |
            $g'$ és contínua i no s'anul·la a l'interval $I$, per tant té signe constant; pel teorema del valor mitjà $g$ és estrictament monòtona, per tant injectiva, i $g:I\to g(I)$ és bijectiva, amb $g(I)$ un interval obert. En cada $y_0=g(x_0)$ la inversa local (teorema de la funció inversa) coincideix amb $g^{-1}$, que per tant és derivable amb $(g^{-1})'(y)=\frac{1}{g'(g^{-1}(y))}$, contínua: $g^{-1}\in\mathcal{C}^1(g(I))$.
          fuites: []
        passos:
          - id: signe_constant
            titol: "Signe constant de la derivada"
            objectiu: |
              Veure que $g'$ no canvia de signe a $I$.
            idea: |
              $g'$ és contínua; useu que la imatge contínua d'un connex és connexa (o el teorema de Bolzano).
            detall: |
              $I$ és un interval, per tant connex, i $g'$ és contínua, així que $g'(I)$ és un connex de $\mathbb{R}$ (un interval) que no conté el $0$. Per tant $g'(I)\subseteq(0,\infty)$ o $g'(I)\subseteq(-\infty,0)$.
            fuites: []
            teoria: ["T2.21", "T1.35"]
          - id: injectivitat
            titol: "Monotonia estricta i injectivitat"
            objectiu: |
              Provar que $g$ és injectiva a $I$.
            idea: |
              Compareu $g(x_1)$ i $g(x_2)$ amb el teorema del valor mitjà.
            detall: |
              Per $x_1<x_2$ de $I$, $[x_1,x_2]\subseteq I$ i existeix $\xi\in[x_1,x_2]$ amb $g(x_2)-g(x_1)=g'(\xi)(x_2-x_1)$, que té el signe (constant, no nul) de $g'$. Per tant $g$ és estrictament monòtona i injectiva, i $g:I\to g(I)$ és bijectiva.
            fuites: []
            teoria: ["T3.26"]
          - id: imatge_oberta
            titol: "La imatge és un interval obert"
            objectiu: |
              Descriure el conjunt $g(I)$ on ha d'estar definida la inversa.
            idea: |
              Connexió per veure que és un interval; per veure que és obert, useu el teorema de l'aplicació oberta o la monotonia estricta.
            detall: |
              $g(I)$ és connex (imatge contínua de connex), per tant un interval. És obert pel teorema de l'aplicació oberta ($g\in\mathcal{C}^1$, $g'\neq 0$ a tot $I$); alternativament, per monotonia estricta $g$ no assoleix ni màxim ni mínim a l'interval obert $I$.
            fuites: []
            teoria: ["T2.21", "T4.8"]
          - id: inversa_c1
            titol: "La inversa és de classe C^1"
            objectiu: |
              Provar que $g^{-1}:g(I)\to I$ és de classe $\mathcal{C}^1$.
            idea: |
              Localment, el teorema de la funció inversa dona una inversa diferenciable; relacioneu-la amb la inversa global. Després estudieu la continuïtat de la derivada que s'obté.
            detall: |
              Sigui $y_0=g(x_0)\in g(I)$. Com que $g'(x_0)\neq 0$, el teorema de la funció inversa (en una variable) dona entorns $U\ni x_0$, $V\ni y_0$ amb $g|_U:U\to V$ bijectiva i inversa $h$ de classe $\mathcal{C}^1$, amb $h'(y)=\frac{1}{g'(h(y))}$. Per injectivitat global, $h=g^{-1}|_V$. Per tant $g^{-1}$ és derivable a tot $g(I)$ amb $(g^{-1})'(y)=\frac{1}{g'(g^{-1}(y))}$, que és contínua (composició i quocient de contínues amb denominador no nul). Així $g^{-1}\in\mathcal{C}^1(g(I))$.
            fuites: ['\\frac\s*\{\s*1\s*\}\s*\{\s*g''\s*\(\s*g\s*\^']
            teoria: ["T4.2", "T4.5"]
        errors_comuns:
          - id: local_per_global
            descripcio: |
              Aplica el teorema de la funció inversa i conclou directament que hi ha inversa global, sense provar la injectivitat a tot $I$.
            pregunta: |
              El teorema de la funció inversa et dona injectivitat a tot $I$ o només a prop de cada punt? Què et falta?
          - id: sense_continuitat
            descripcio: |
              Usa que $g'$ té signe constant sense justificar-ho (o oblida que cal la continuïtat de $g'$ i que $I$ sigui un interval).
            pregunta: |
              Si $I$ fos la unió de dos intervals disjunts, podria $g'$ ser positiva en un i negativa en l'altre? Què fa servir aquest argument de $I$ i de $g'$?
          - id: derivabilitat_inversa
            descripcio: |
              Dedueix la fórmula de $(g^{-1})'$ derivant $g(g^{-1}(y))=y$ amb la regla de la cadena, suposant ja que $g^{-1}$ és derivable.
            pregunta: |
              Per aplicar la regla de la cadena a $g\circ g^{-1}$, què has de saber ja sobre $g^{-1}$?
        nota_professor: |
          És exactament la Proposició 1 del Tema 4 (inversió global en una variable), que les notes enuncien sense demostració; per això és reservada.

      - id: "t4-13b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          Demostreu que $F(x,y)=(e^x\cos y,e^x\sin y)$ té inversa local de classe $\mathcal{C}^1$ en tot punt, però que no té inversa global.
        teoria: ["T3.20"]
        teoria_reservada: ["T4.6"]
        resultat:
          valor: |
            $F$ és $\mathcal{C}^\infty$ i $\det JF(x,y)=e^{2x}\neq 0$ a tot $\mathbb{R}^2$; pel teorema de la funció inversa té inversa local $\mathcal{C}^\infty$ (en particular $\mathcal{C}^1$) en tot punt. No té inversa global perquè no és injectiva: $F(x,y+2\pi)=F(x,y)$.
          fuites: []
        passos:
          - id: jacobiana
            titol: "Jacobiana"
            objectiu: |
              Calcular el determinant de la jacobiana de $F$ i estudiar si s'anul·la.
            idea: |
              Calculeu les derivades parcials de cada component i el determinant; useu $\cos^2+\sin^2=1$.
            detall: |
              $JF(x,y)=\begin{pmatrix}e^x\cos y&-e^x\sin y\\ e^x\sin y&e^x\cos y\end{pmatrix}$, $\det JF(x,y)=e^{2x}(\cos^2y+\sin^2y)=e^{2x}>0$.
            fuites: ['e\s*\^\s*\{\s*2\s*x\s*\}']
            teoria: ["T3.31"]
          - id: inversa_local
            titol: "Inversa local"
            objectiu: |
              Deduir que $F$ té inversa local de classe $\mathcal{C}^1$ en tot punt.
            idea: |
              Aplicar el teorema de la funció inversa en cada punt.
            detall: |
              $F$ és $\mathcal{C}^\infty$ (producte i composició de $\mathcal{C}^\infty$) i $\det JF\neq 0$ a tot arreu; pel teorema de la funció inversa, per a cada $p\in\mathbb{R}^2$ hi ha un entorn $U$ de $p$ amb $F|_U$ injectiva, $F(U)$ obert i inversa $\mathcal{C}^\infty$, en particular $\mathcal{C}^1$.
            fuites: []
            teoria: ["T4.5"]
          - id: no_global
            titol: "No hi ha inversa global"
            objectiu: |
              Provar que $F$ no té inversa global.
            idea: |
              Una inversa global requereix injectivitat; mireu la dependència de $F$ respecte de $y$.
            detall: |
              Per periodicitat del sinus i el cosinus, $F(x,y+2\pi)=F(x,y)$ per a tot $(x,y)$; per exemple $F(0,0)=F(0,2\pi)=(1,0)$. $F$ no és injectiva i per tant no té inversa global.
            fuites: ['y\s*\+\s*2\s*\\pi', '\(\s*0\s*,\s*2\s*\\pi\s*\)']
            teoria: []
        errors_comuns:
          - id: jacobiana_implica_global
            descripcio: |
              Creu que, com en una variable, $\det JF\neq 0$ a tot arreu implica inversa global.
            pregunta: |
              En dimensió 1 la inversió global usa que el domini és un interval i que $g'$ té signe constant. Hi ha cap resultat anàleg a $\mathbb{R}^2$? Què passa si compares $F$ en punts amb la mateixa $x$?
          - id: confon_exhaustivitat
            descripcio: |
              Argumenta la no existència d'inversa global només amb que $F$ no és exhaustiva (l'origen no és a la imatge), cosa que no impedeix tenir inversa sobre la imatge.
            pregunta: |
              Si $F$ fos injectiva, podries definir una inversa a $F(\mathbb{R}^2)$? Quin és realment l'obstacle?
        nota_professor: |
          És el primer exemple de T4.6 (la funció exponencial complexa $e^z$); per això és reservat.

      - id: "t4-13c"
        apartat: "c"
        tipus: teoric
        enunciat: |
          Determineu un obert maximal on $F$ tingui inversa global.
        teoria: ["T4.9"]
        teoria_reservada: ["T4.6"]
        resultat:
          valor: |
            Per exemple $U_\alpha=\mathbb{R}\times(\alpha,\alpha+2\pi)$ per a qualsevol $\alpha\in\mathbb{R}$ (en particular $\mathbb{R}\times(0,2\pi)$): $F:U_\alpha\to\mathbb{R}^2\setminus\{(t\cos\alpha,t\sin\alpha)\mid t\geq 0\}$ és bijectiva amb inversa $\mathcal{C}^\infty$, i cap obert que contingui estrictament $U_\alpha$ fa $F$ injectiva.
          fuites: ['\\alpha\s*\+\s*2\s*\\pi', '\\mathbb\s*\{?R\}?\s*\\times\s*\(\s*0\s*,\s*2\s*\\pi\s*\)']
        passos:
          - id: injectivitat
            titol: "Quan dos punts tenen la mateixa imatge"
            objectiu: |
              Caracteritzar quan $F(x,y)=F(x',y')$.
            idea: |
              Compareu primer les normes de les imatges i després les direccions.
            detall: |
              $\|F(x,y)\|=e^x$, així que $F(x,y)=F(x',y')$ implica $e^x=e^{x'}$, és a dir $x=x'$, i llavors $(\cos y,\sin y)=(\cos y',\sin y')$, és a dir $y-y'\in 2\pi\mathbb{Z}$.
            fuites: ['2\s*\\pi\s*\\mathbb\s*\{?\s*Z']
            teoria: []
          - id: candidat
            titol: "Un obert on hi ha inversa"
            objectiu: |
              Proposar un obert on $F$ sigui injectiva i justificar que hi té inversa regular.
            idea: |
              Restringiu la variable $y$ a un interval obert on no hi hagi dos valors que difereixin en un múltiple de $2\pi$. Injectivitat i jacobiana invertible donen difeomorfisme sobre la imatge.
            detall: |
              $U_\alpha=\mathbb{R}\times(\alpha,\alpha+2\pi)$: dos valors de $y$ en un interval de longitud $2\pi$ obert no difereixen en un múltiple no nul de $2\pi$, per tant $F|_{U_\alpha}$ és injectiva. Amb $\det JF=e^{2x}\neq 0$, és un difeomorfisme $\mathcal{C}^\infty$ sobre la imatge. Com que $e^x$ recorre $(0,\infty)$ i l'angle $y$ recorre $(\alpha,\alpha+2\pi)$, $F(U_\alpha)=\mathbb{R}^2\setminus\{(t\cos\alpha,t\sin\alpha)\mid t\geq 0\}$ (el pla menys la semirecta tancada d'angle $\alpha$).
            fuites: ['\\alpha\s*\+\s*2\s*\\pi', '\(\s*0\s*,\s*2\s*\\pi\s*\)']
            teoria: ["T4.9", "T4.5"]
          - id: maximalitat
            titol: "Maximalitat"
            objectiu: |
              Justificar que l'obert proposat no es pot ampliar mantenint la injectivitat.
            idea: |
              Qualsevol obert més gran conté un punt fora de la franja; useu la caracterització del primer pas.
            detall: |
              Si $W\supsetneq U_\alpha$ és obert i $(x_0,y_0)\in W\setminus U_\alpha$: si $y_0\not\equiv\alpha\pmod{2\pi}$, hi ha un únic $y_1\in(\alpha,\alpha+2\pi)$ amb $y_1\equiv y_0$, i $y_1\neq y_0$, de manera que $(x_0,y_0)$ i $(x_0,y_1)\in U_\alpha$ són dos punts diferents de $W$ amb la mateixa imatge. Si $y_0=\alpha+2k\pi$ amb $k\in\mathbb{Z}$, $W$ conté $(x_0,y_0\pm\varepsilon)$ per a $\varepsilon\in(0,2\pi)$ petit, i un d'aquests dos punts ($y_0-\varepsilon$ si $k\leq 0$, $y_0+\varepsilon$ si $k\geq 1$) és fora de $[\alpha,\alpha+2\pi]$ amb $y$ no congruent amb $\alpha$: es redueix al cas anterior. En tots els casos $F|_W$ no és injectiva.
            fuites: []
            teoria: []
        errors_comuns:
          - id: interval_tancat
            descripcio: |
              Proposa $\mathbb{R}\times[0,2\pi)$, que no és obert.
            pregunta: |
              El conjunt que proposes és obert? Què passa amb els punts de la vora $y=0$?
          - id: no_justifica_maximal
            descripcio: |
              Dona la franja però no justifica per què és maximal.
            pregunta: |
              Si afegeixes a l'obert un punt fora de la franja, pots trobar un altre punt de l'obert amb la mateixa imatge?
          - id: massa_petit
            descripcio: |
              Proposa una franja més estreta (per exemple d'amplada $\pi$), on hi ha inversa però que no és maximal.
            pregunta: |
              Es pot ampliar el teu obert sense perdre la injectivitat?
        nota_professor: |
          Alternativa: $F=P\circ E$ amb $E(x,y)=(e^x,y)$, difeomorfisme de $\mathbb{R}\times(\alpha,\alpha+2\pi)$ sobre $(0,\infty)\times(\alpha,\alpha+2\pi)$, i $P$ les polars (T4.11), i compondre difeomorfismes (T4.10). Com a les polars, també són maximals regions $\{g(x)<y<g(x)+2\pi\}$ amb $g$ contínua; "un obert maximal" admet moltes respostes.
