    - id: nomes_local
      descripcio: |
        Afirma que és un mínim absolut a partir només de la hessiana.
      pregunta: |
        El criteri de la hessiana parla de tot el pla o només d'un entorn del punt? Hi ha algun argument més directe per a aquesta funció?
