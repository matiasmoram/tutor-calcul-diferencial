      descripcio: |
        Conclou mínim només perquè la hessiana és semidefinida positiva.
      pregunta: |
        Recorda l'exemple $y^2-x^3$: la seva hessiana a l'origen també és semidefinida positiva. Què hi passa?
    - id: terme_negatiu
      descripcio: |
        Afirma que $xy^2$ pot fer negativa la funció i busca camins on $f<0$ sense èxit, o conclou sella sense comprovar-ho.
      pregunta: |
        Has trobat algun punt concret, a prop de l'origen, on $f$ sigui negativa? Si no en trobes, podries intentar demostrar que no n'hi ha?
    - id: perd_branca
