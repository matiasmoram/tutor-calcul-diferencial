      titol: Trobar els punts crítics
      objectiu: |
        Trobar els punts on s'anul·la el gradient de $f$.
      idea: |
        Plantejar $f_x=0$, $f_y=0$; una de les equacions dona directament una relació entre $x$ i $y$.
      detall: |
        $f_x=2(x-1)+2(x-y)$, $f_y=-2(x-y)$. De $f_y=0$: $y=x$; aleshores $f_x=2(x-1)=0$, $x=1$. Únic punt crític: $(1,1)$.
