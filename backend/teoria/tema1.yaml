items:
  - id: "T1.x1"
    tipus: text
    num: null
    resum: null
    seccio: null
    pagina: 2
    nom: "Introducció del tema"
    enunciat: |
      El protagonista d'aquest curs és, essencialment, $\mathbb{R}^n$. Els conceptes més importants que s'introduiran al final d'aquest tema són: completesa, compacitat i connexió.
    problemes: []

  - id: "T1.x2"
    tipus: text
    num: null
    resum: null
    seccio: "1.1"
    pagina: 2
    nom: "Espai vectorial de partida"
    enunciat: |
      Sigui $E$ un $\mathbb{R}$-espai vectorial ($\mathbb{R}$-e.v.).
    problemes: []

  - id: "T1.1"
    tipus: definicio
    num: 1
    resum: 1
    seccio: "1.1"
    pagina: 2
    nom: "Producte escalar"
    enunciat: |
      Una funció $\langle\cdot,\cdot\rangle: E\times E\longrightarrow\mathbb{R}$ es diu que és un _producte escalar_ si compleix; $\forall u,u_j,v\in E$:

      i) $\langle u,u\rangle\geq 0$; $\langle u,u\rangle=0\iff u=0$.

      ii) $\langle u,v\rangle=\langle v,u\rangle$ (simètric).

      iii) $\langle\lambda u,v\rangle=\lambda\langle u,v\rangle$, $\forall\lambda\in\mathbb{R}$ (i, per tant, $\langle u,\lambda v\rangle=\lambda\langle u,v\rangle$).

      iv) $\langle u_1+u_2,v\rangle=\langle u_1,v\rangle+\langle u_2,v\rangle$ (ídem respecte a la segona component).

      En aquest cas es diu que $(E,\langle\cdot,\cdot\rangle)$ és un _espai euclidià_.
    problemes: []

  - id: "T1.x3"
    tipus: text
    num: null
    resum: null
    seccio: "1.1"
    pagina: 2
    nom: "Linealitat del producte escalar"
    enunciat: |
      Observem que les condicions (iii) o (iv) ens asseguren la linealitat del producte escalar.
    problemes: []

  - id: "T1.2"
    tipus: exemple
    num: 2
    resum: null
    seccio: "1.1"
    pagina: 2
    nom: "Exemples de productes escalars"
    enunciat: |
      a) $E=\mathbb{R}^2$, amb $\langle(a,b),(c,d)\rangle=ac+bd$.

      b) $E=\mathcal{C}([a,b])=\{f:[a,b]\to\mathbb{R}\mid f \text{ contínua}\}$, amb

      $$\begin{aligned}E\times E&\longrightarrow\mathbb{R}\\(f,g)&\longmapsto\langle f,g\rangle=\int_a^b f(x)g(x)\,dx.\end{aligned}$$
    problemes: []

  - id: "T1.3"
    tipus: definicio
    num: 3
    resum: 2
    seccio: "1.1"
    pagina: 2
    nom: "Norma"
    enunciat: |
      Una funció $\|\cdot\|:E\longrightarrow\mathbb{R}$ es diu que és una _norma_ si compleix, $\forall u,v\in E$:

      i) $\|u\|\geq 0$; $\|u\|=0\iff u=0$.

      ii) $\|\lambda u\|=|\lambda|\,\|u\|$, $\forall\lambda\in\mathbb{R}$.

      iii) $\|u+v\|\leq\|u\|+\|v\|$ (desigualtat triangular).

      En aquest cas es diu que $(E,\|\cdot\|)$ és un _espai normat_.
    problemes: []

  - id: "T1.4"
    tipus: exemple
    num: 4
    resum: null
    seccio: "1.1"
    pagina: 2
    nom: "Exemples de normes"
    enunciat: |
      a) $E=\mathbb{R}^2$, $\|(u_1,u_2)\|=\sqrt{u_1^2+u_2^2}$.

      b) $E=\mathcal{C}([a,b])$, amb

      $$\|f\|_1=\int_a^b|f(t)|dt.$$

      En aquest cas, les propietats (i), (ii), (iii) es verifiquen fàcilment. La propietat $\|f\|_1>0\iff f\equiv 0$ es demostra com a conseqüència del teorema del valor mitjà (que veurem més endavant).
    problemes: []

  - id: "T1.5"
    tipus: definicio
    num: 5
    resum: 3
    seccio: "1.1"
    pagina: 3
    nom: "Distància"
    enunciat: |
      Sigui $M$ un conjunt. Una funció $d(\cdot,\cdot):M\times M\longrightarrow\mathbb{R}$ es diu que és una _distància_ si per a tot $x,y,z\in M$, es compleixen:

      i) $d(x,y)\geq 0$; $d(x,y)=0\iff x=y$.

      ii) $d(x,y)=d(y,x)$ (simètrica).

      iii) $d(x,y)\leq d(x,z)+d(z,y)$ (desigualtat triangular).

      Direm en aquest cas que $(M,d)$ és un _espai mètric_.
    problemes: []

  - id: "T1.6"
    tipus: proposicio
    num: 6
    resum: 4
    seccio: "1.1"
    pagina: 3
    nom: "Euclidià implica normat implica mètric"
    enunciat: |
      i) Tot espai euclidià és un espai normat si definim $\|u\|=\sqrt{\langle u,u\rangle}$.

      ii) Tot espai normat és un espai mètric si prenem $d(u,v)=\|u-v\|$.

      [Figura: diagrama de conjunts imbricats: espais euclidians dins d'espais normats dins d'espais mètrics.]

      Figura 1: Espais euclidians $\subset$ espais normats $\subset$ espais mètrics.

      Per a demostrar aquesta proposició usarem, en algun moment, el següent resultat:
    demostracio: |
      **Demostració de la proposició 6:**

      i) Sigui $E$ un espai euclidià i definim la norma $\|u\|=\sqrt{\langle u,u\rangle}$.
      Vegem que satisfà les propietats que defineixen una norma:

      - $\|u\|=\sqrt{\langle u,u\rangle}\geq 0$ ja que $\langle u,u\rangle\geq 0$. $\|u\|=0\iff\langle u,u\rangle=0\iff u=0$.
      - $\|\lambda u\|=\sqrt{\langle\lambda u,\lambda u\rangle}=\sqrt{\lambda^2\langle u,u\rangle}=|\lambda|\sqrt{\langle u,u\rangle}=|\lambda|\,\|u\|$.
      - Veure que $\|u+v\|\leq\|u\|+\|v\|$ és equivalent a veure que $(\|u+v\|)^2\leq(\|u\|+\|v\|)^2$ (ja que ambdós costats són positius).

      Aleshores,

      $$\|u+v\|^2=\langle u+v,u+v\rangle=\langle u,u\rangle+2\langle u,v\rangle+\langle v,v\rangle=\|u\|^2+\|v\|^2+2\langle u,v\rangle\ \underset{\text{Cauchy-Schwarz}}{\leq}\ \|u\|^2+\|v\|^2+2\|u\|\,\|v\|=(\|u\|+\|v\|)^2.$$

      Per tant, $\|u\|=\sqrt{\langle u,u\rangle}$ és una norma i $(E,\|\cdot\|)$ és un espai normat.

      ii) Anàlogament, veiem que si $(E,\|\cdot\|)$ és un espai normat i definim $d(u,v)=\|u-v\|$, aleshores $d(\cdot,\cdot)$ satisfà les propietats per a ser una distància i, per tant, $(E,d)$ és un espai mètric.

      - $d(u,v)=\|u-v\|\geq 0$; $d(u,v)=0\iff\|u-v\|=0\iff u-v=0\iff u=v$.
      - $d(u,v)=\|u-v\|=\|(-1)(v-u)\|=|-1|\,\|v-u\|=\|v-u\|=d(v,u)$.
      - Respecte la desigualtat triangular:

      $$\begin{aligned}d(u,w)&=\|u-w\|=\|u-v+v-w\|=\|(u-v)+(v-w)\|\\&\leq\|u-v\|+\|v-w\|=d(u,v)+d(v,w).\end{aligned}$$
    problemes: []

  - id: "T1.7"
    tipus: proposicio
    num: 7
    resum: 5
    seccio: "1.1"
    pagina: 3
    nom: "Desigualtat de Cauchy-Schwarz"
    enunciat: |
      (Desigualtat de Cauchy-Schwarz.) Sigui $(E,\langle\cdot,\cdot\rangle)$ un espai euclidià (normat si definim $\|u\|=\sqrt{\langle u,u\rangle}$). Aleshores es verifica que

      $$|\langle u,v\rangle|\leq\|u\|\cdot\|v\|.$$

      (Nota: Augustin Louis Cauchy (1789-1857), Hermann Schwarz (1843-1921).)
    demostracio: |
      **Demostració de la desigualtat de Cauchy-Schwarz:**

      - Vegem primer que se satisfà per al cas $u=0$ (anàlogament, per al cas $v=0$). D'un costat, $u=0\implies\|u\|=0\implies\|u\|\cdot\|v\|=0$. De l'altre,

      $$\langle 0,v\rangle=\langle 0+0,v\rangle=\langle 0,v\rangle+\langle 0,v\rangle\implies\langle 0,v\rangle=2\langle 0,v\rangle\implies\langle 0,v\rangle=0.$$

      Per tant,

      $$\left.\begin{aligned}|\langle 0,v\rangle|&=0\\\|0\|\cdot\|v\|&=0\end{aligned}\right\}\implies|\langle 0,v\rangle|\leq\|0\|\cdot\|v\|.$$

      - Suposem ara el cas que $u\neq 0$ i $v\neq 0$. Això implica que $\|u\|\neq 0$ i $\|v\|\neq 0$, de manera que podem definir

      $$u'=\frac{1}{\|u\|}u\quad\text{i}\quad v'=\frac{1}{\|v\|}v.$$

      És directe comprovar que $\|u'\|=1$ i $\|v'\|=1$. En efecte:

      $$\|u'\|=\left\|\frac{1}{\|u\|}u\right\|=\frac{1}{\|u\|}\|u\|=1.\quad\text{(ídem per a } v'\text{)}.$$

      Aleshores:

      $$\begin{aligned}0&\leq\|u'-v'\|^2=\langle u'-v',u'-v'\rangle=\langle u',u'\rangle-2\langle u',v'\rangle+\langle v',v'\rangle\\&=\underbrace{\|u'\|^2}_{=1}-2\langle u',v'\rangle+\underbrace{\|v'\|^2}_{=1}=2-2\langle u',v'\rangle.\end{aligned}$$

      Per tant,

      $$2\langle u',v'\rangle\leq 2,\ \text{és a dir, }\langle u',v'\rangle\leq 1\Rightarrow\langle u,v\rangle\leq\|u\|\cdot\|v\|,\tag{1}$$

      on hem usat que

      $$\langle u',v'\rangle=\left\langle\frac{u}{\|u\|},\frac{v}{\|v\|}\right\rangle=\frac{1}{\|u\|\,\|v\|}\langle u,v\rangle.$$

      Vegem ara la desigualtat contrària, és a dir, que $\langle u,v\rangle\geq-\|u\|\,\|v\|$. En efecte:

      $$-\langle u,v\rangle=\langle u,-v\rangle\ \underset{C-S}{\leq}\ \|u\|\,\|-v\|=\|u\|\,\|v\|\implies\langle u,v\rangle\geq-\|u\|\,\|v\|.\tag{2}$$

      Usant (1) i (2), es dedueix que:

      $$-\|u\|\,\|v\|\leq\langle u,v\rangle\leq\|u\|\,\|v\|\implies|\langle u,v\rangle|\leq\|u\|\,\|v\|.$$

      Ara ja podem fer la demostració de la proposició anterior.
    problemes: []

  - id: "T1.8"
    tipus: exemple
    num: 8
    resum: 6
    seccio: "1.1"
    pagina: 5
    nom: "Norma i distància en exemples"
    enunciat: |
      a) A $\mathbb{R}^2$, definim $\langle(a,b),(c,d)\rangle=ac+bd$. Llavors,

      $$\begin{aligned}\|(a,b)\|&=\sqrt{\langle(a,b),(a,b)\rangle}=\sqrt{a^2+b^2},\\d((a,b),(c,d))&=\|(a,b)-(c,d)\|=\|(a-c,b-d)\|\\&=\sqrt{\langle(a-c,b-d),(a-c,b-d)\rangle}=\sqrt{(a-c)^2+(b-d)^2}\quad\text{(Pitàgores).}\end{aligned}$$

      b) A $\mathbb{R}^3$, $\|(a,b,c)\|=\sqrt{a^2+b^2+c^2}$ i, en general, a $\mathbb{R}^n$:

      $$\begin{aligned}\langle(a_1,a_2,\ldots,a_n),(b_1,b_2,\ldots,b_n)\rangle&:=\sum_{i=1}^n a_i\cdot b_i;\\\|(a_1,a_2,\ldots,a_n)\|&=\sqrt{\sum_{i=1}^n a_i^2};\\d((a_1,a_2,\ldots,a_n),(b_1,b_2,\ldots,b_n))&=\sqrt{\sum_{i=1}^n(a_i-b_i)^2}.\end{aligned}$$

      c) $E=\mathcal{C}([a,b])$. Aleshores:

      $$\begin{aligned}\langle f,g\rangle&:=\int_a^b f(x)g(x)\,dx;\\\|f\|&=\sqrt{\int_a^b f^2(x)\,dx};\\d(f,g)=\|f-g\|&=\sqrt{\int_a^b(f(x)-g(x))^2dx}\quad\text{("àrea" entre }y=f(x)\text{ i }y=g(x)\text{).}\end{aligned}$$

      d) $E=\mathcal{B}(A)=$ conjunt de funcions $f:A\to\mathbb{R}$ fitades (inferiorment i superior), amb $A$ conjunt arbitrari. Aleshores, $d(f,g)=\displaystyle\sup_{t\in A}|f(t)-g(t)|$ és una distància.
    problemes: []

  - id: "T1.9"
    tipus: definicio
    num: 9
    resum: 7
    seccio: "1.1"
    pagina: 5
    nom: "Ortogonalitat i angle"
    enunciat: |
      Sigui $(E,\langle\cdot,\cdot\rangle)$ un espai euclidià. Aleshores:

      i) $u$ i $v$ són _ortogonals_ $\Leftrightarrow\langle u,v\rangle=0$.

      ii) L'angle entre dos vectors $u$ i $v$ es defineix com

      $$\alpha=\Delta(u,v)=\arccos\frac{\langle u,v\rangle}{\|u\|\,\|v\|}\in[0,\pi].$$
    problemes: []

  - id: "T1.10"
    tipus: observacio
    num: 10
    resum: null
    seccio: "1.1"
    pagina: 6
    nom: "Espais mètrics no normats"
    enunciat: |
      Hi ha espais mètrics que no són normats. Per exemple:

      a) Donat $M$ un conjunt, definim la següent _distància discreta_:

      $$d(x,y)=\begin{cases}0&\text{si }x=y,\\1&\text{si }x\neq y.\end{cases}$$

      Aleshores, la norma induïda, $\|x-y\|=d(x,y)$, no té sentit en un espai vectorial.

      b) En un espai mètric $(M,d)$, $M$ és un conjunt arbitrari (en particular, podria ser finit) mentre que per a ser normat caldria que fos espai vectorial (en particular, infinit).
    problemes: []

  - id: "T1.11"
    tipus: definicio
    num: 11
    resum: 8
    seccio: "1.2"
    pagina: 6
    nom: "Boles, oberts i tancats"
    enunciat: |
      Sigui $(M,d)$ un espai mètric i sigui $x\in M$ un element. Aleshores, es defineix:

      i) _Bola oberta_ de centre $x$ i radi $r>0$: $B_r(x)=B(x,r)=\{y\in M\mid d(x,y)<r\}$.

      ii) _Bola tancada_ de centre $x$ i radi $r>0$: $\overline{B}_r(x)=\overline{B}(x,r)=\{y\in M\mid d(x,y)\leq r\}$.

      iii) $A$ és un _conjunt obert_ de $M\Leftrightarrow A\subseteq M$ i per a tot $x\in A$ existeix $r>0$ tal que $B_r(x)\subseteq A$.

      iv) $A$ és un _conjunt tancat_ de $M\Leftrightarrow A^c=M\setminus A$, el seu complementari a $M$, és obert.

      Noteu que sempre $x\in B(x,r)$ i $x\in\overline{B}(x,r)$.
    problemes: []

  - id: "T1.12"
    tipus: proposicio
    num: 12
    resum: 9
    seccio: "1.2"
    pagina: 6
    nom: "Propietats dels conjunts oberts"
    enunciat: |
      (Propietats dels conjunts oberts.) Sigui $(M,d)$ un espai mètric. Aleshores,

      i) tota bola oberta $B_r(x)$ és un conjunt obert;

      ii) la unió arbitrària (finita o infinita) d'oberts és un obert;

      iii) la intersecció finita d'oberts és un obert;

      iv) $M$ i $\varnothing$ són conjunts oberts.
    demostracio: |
      **Demostració de la proposició 12:**

      i) Cal veure que $\forall y\in B_r(x)$ existeix $r_y>0$ tal que $B_{r_y}(y)\subset B_r(x)$.

      Del fet que $y\in B_r(x)$ es dedueix que $d(x,y)<r$. Definim $r_y:=r-d(x,y)>0$. Aleshores, si $z\in B_{r_y}(y)\Rightarrow d(y,z)<r_y=r-d(x,y)$, de forma que

      $$d(z,x)\leq d(z,y)+d(y,x)<(r-d(x,y))+d(x,y)=r,$$

      fet que implica que $B_{r_y}(y)\subset B_r(x)$.

      ii) Sigui $(A_\mu)_{\mu\in I}$, $I$ conjunt arbitrari, $A_\mu$ obert, $A_\mu\subset M$. Volem veure que $\bigcup_{\mu\in I}A_\mu$ és també un conjunt obert de $M$.

      Clarament $\bigcup_{\mu\in I}A_\mu\subset M$. Per tant, si $x\in\bigcup_{\mu\in I}A_\mu$ llavors existeix $\mu_0\in I$ tal que $x\in A_{\mu_0}$. Del fet que $A_{\mu_0}$ és un obert (a $M$) es té que existeix $r_0>0$ de manera que $B_{r_0}(x)\subseteq A_{\mu_0}\subseteq\bigcup_{\mu\in I}A_\mu$.

      iii) És suficient mostrar que si $A_1$ i $A_2$ són oberts de $M$ aleshores $A_1\cap A_2$ també és un obert de $M$. La resta s'obté per inducció

      En efecte, sigui $x\in A_1\cap A_2$. D'una banda, $x\in A_1$, obert, i per tant existeix $r_1>0$ tal que $B_{r_1}(x)\subseteq A_1$. De l'altra, $x\in A_2$, obert, d'on es té que existeix $r_2>0$ tal que $B_{r_2}(x)\subseteq A_2$. Aleshores, si definim $r=\min\{r_1,r_2\}$ tenim:

      $$B_r(x)\subseteq B_{r_1}(x)\subseteq A_1,\quad\text{i}\quad B_r(x)\subseteq B_{r_2}(x)\subseteq A_2\quad\Rightarrow B_r(x)\subseteq A_1\cap A_2$$

      iv) Clarament $M$ és obert. En efecte, sigui $x\in M$. Considerem $r>0$ qualsevol. Aleshores la bola oberta de centre $x$ i radi $r$ es defineix com $B_r(x)=\{y\in M\mid d(x,y)<r\}$. Noteu que, per definició, tot punt $y$ d'aquesta bola ha de pertànyer, necessàriament, al conjunt $M$. Per tant $B_r(x)\subseteq M$, que implica que $M$ és un obert.

      La demostració de que $\varnothing$ és un obert serà conseqüència del fet que $M$ és també un tancat (vegeu Prop. 13) i $\varnothing$ és el seu complementari a $M$.
    problemes: []

  - id: "T1.x4"
    tipus: text
    num: null
    resum: 10
    seccio: "1.2"
    pagina: 7
    nom: "Comentaris sobre oberts"
    enunciat: |
      **Comentaris:**

      1) Per exemple, a $\mathbb{R}$, tot interval del tipus $(a,+\infty)$ és un obert car $(a,+\infty)=\bigcup_{x>a}(a,x)$. (usem (ii)). De manera anàloga es mostra que $(-\infty,a)$ és un obert de $\mathbb{R}$.

      2) En general, la intersecció infinita d'oberts no és un obert. Per exemple $O_n=\left(-\dfrac{1}{n},\dfrac{1}{n}\right)$ és un obert de $\mathbb{R}$. En canvi

      $$\bigcap_{n\geq 1}O_n=\{0\},$$

      que no és obert (ja que $\forall r>0$, $B(0,r)\not\subset\{0\}$ a $\mathbb{R}$).
    problemes: []

  - id: "T1.x5"
    tipus: text
    num: null
    resum: 11
    seccio: "1.2"
    pagina: 7
    nom: "Topologia discreta sobre un conjunt"
    enunciat: |
      **Comentari (topologia discreta sobre un conjunt $M$):**
      Donat un conjunt $M$ es defineix la _topologia discreta sobre_ $M$, com aquella topologia $\mathcal{T}$ en la qual tots els seus subconjunts són oberts. És a dir

      $$\mathcal{T}=\mathcal{P}(M),$$

      on $\mathcal{P}(M)$ denota el conjunt de les parts de $M$. És la topologia més fina sobre $M$ (conté tots els oberts de qualsevol altra topologia $\mathcal{T}_1$ sobre $M$). Satisfà, entre d'altres, les següents propietats:

      (i) Tot element de $M$ és un obert: en efecte, si $x\in M$ aleshores $\{x\}\in\mathcal{P}(M)$. Del fet que l'unió arbitrària d'oberts és un obert, es dedueix que tot subconjunt $A\subseteq M$ és un conjunt obert, ja que

      $$A=\bigcup_{x\in A}\{x\}.$$

      (ii) Tot subconjunt $A\subset M$ és també tancat: en efecte, $A^c=M\setminus A\in\mathcal{P}(M)$ és un obert.

      Per tant, amb la topologia discreta, tot subconjunt $A\subseteq M$ és tancat i obert a la vegada.

      (iii) La topologia discreta sobre $M$ es pot definir també a través de la distància

      $$d(x,y)=\begin{cases}0&\text{si }x=y,\\1&\text{si }x\neq y.\end{cases}$$

      **Exemple 1:** Si considerem $M=\mathbb{Z}$ amb la topologia discreta, aleshores qualsevol conjunt de nombres enters és un obert. En particular també ho són $\mathbb{Z}$ i $\varnothing$.

      **Exemple 2:** Si $M=\{a,b,c\}$ aleshores la topologia discreta associada a $M$ és

      $$\mathcal{T}=\mathcal{P}(M)=\{\varnothing,\{a\},\{b\},\{c\},\{a,b\},\{a,c\},\{b,c\},\{a,b,c\}\}.$$
    problemes: []

  - id: "T1.x6"
    tipus: text
    num: null
    resum: 12
    seccio: "1.2"
    pagina: 8
    nom: "Topologia euclidiana sobre Z"
    enunciat: |
      Sigui ara $M=\mathbb{Z}$ i considereu sobre $\mathbb{Z}$ la topologia induïda per la distància euclidiana

      $$d(m,n)=|m-n|.$$

      És aleshores $\mathbb{N}$ un obert a $\mathbb{Z}$?

      Observeu que si $n\in\mathbb{Z}$ i $r>0$, aleshores la bola oberta de centre $n$ i radi $r$ es defineix com

      $$B_r(n)=\left\{m\in\mathbb{Z}\ \middle|\ |m-n|<r\right\}.$$

      Així, per exemple, $B_{1/2}(n)=\{n\}$ i $B_{3/2}(n)=\{n-1,n,n+1\}$. Per tant, del fet que

      $$\mathbb{N}=\bigcup_{n\in\mathbb{N}}B_{1/2}(n)$$

      és unió arbitrària d'oberts es dedueix que $\mathbb{N}$ és un obert de $\mathbb{Z}$ en la topologia induïda per aquesta distància euclidiana.

      Recordeu que $A\subseteq M$ és tancat $\Leftrightarrow A^c=M\setminus A$ és obert.
    problemes: []

  - id: "T1.13"
    tipus: proposicio
    num: 13
    resum: 13
    seccio: "1.2"
    pagina: 8
    nom: "Propietats dels conjunts tancats"
    enunciat: |
      Sigui $M$ un conjunt i $d$ una distància definida sobre ell. Considereu la topologia sobre $M$ induïda per $d$. Aleshores:

      i) les boles tancades de $M$ són conjunts tancats.

      ii) La intersecció arbitrària de tancats és un tancat.

      iii) La unió finita de tancats és un tancat.

      iv) $M$ i $\varnothing$ són conjunts tancats.
    demostracio: |
      **Demostració de la proposició 13:**

      i) Sigui $\overline{B}_r(x)=\{y\in M\mid d(x,y)\leq r\}$, amb $x\in M$ i $r>0$. Vegem que és un tancat.

      Per a fer-ho, demostrarem que el seu complementari a $M$, $\overline{B}_r^c(x)$ és un obert.

      En efecte, per a qualsevol $y\in\overline{B}_r^c(x)$ es té que $d(x,y)>r$. Sigui $r_1=d(x,y)-r>0$. Si provem que $B_{r_1}(y)\subseteq\overline{B}_r^c(x)$ aleshores $\overline{B}_r^c(x)$ és un obert.

      En efecte (per reducció a l'absurd, _R.A._): suposem que $B_{r_1}(y)\not\subseteq\overline{B}_r^c(x)$. Això implica que existeix $z\in B_{r_1}(y)\cap\overline{B}_r(x)$, d'on es deriva que

      $$\begin{cases}z\in B_{r_1}(y)&\Rightarrow d(z,y)<r_1\\z\in\overline{B}_r(x)&\Rightarrow d(z,x)\leq r\end{cases}$$

      En conseqüència, per la desigualtat triangular,

      $$d(y,x)\leq d(y,z)+d(z,x)<r_1+r=d(x,y)-r+r=d(x,y),\qquad\text{contradicció!!}$$

      Per tant, $B_{r_1}(y)\subseteq\overline{B}_r^c(x)$ i $\overline{B}_r(x)$ és un tancat.

      ii) D'un costat, si $(F_\mu)_{\mu\in I}$ és una col·lecció arbitrària de tancats, aleshores $(F_\mu^c)_{\mu\in I}$ és una col·lecció arbitrària d'oberts. De l'altre, per teoria de conjunts, tenim que

      $$\bigcap_{\mu\in I}F_\mu=\left(\bigcup_{\mu\in I}F_\mu^c\right)^c$$

      De la Proposició 12 es dedueix que $\bigcup_{\mu\in I}F_\mu^c$ és un obert (per ser unió arbitrària d'oberts) i, conseqüentment, el seu complementari $\left(\cup_{\mu\in I}F_\mu^c\right)^c$ és un tancat.

      iii) Siguin $F_1,F_2,\ldots,F_k$ una col·lecció finita de tancats. Per tant $F_1^c,F_2^c,\ldots,F_k^c$ és una col·lecció finita d'oberts. A més, per teoria de conjunts,

      $$\bigcup_{i=1}^k F_i=\left(\bigcap_{i=1}^k F_i^c\right)^c.$$

      Com que $\bigcap_{i=1}^k F_i^c$ és un obert (per ser intersecció finita d'oberts), el seu complementari és un tancat. És a dir, $\bigcup_{i=1}^k F_i$ és un tancat.

      iv) La demostració de que $M$ és tancat dins de $M$ és directa: per a tot punt $x\in M$, donat $r>0$, la bola tancada $\{y\in M\mid d(y,x)\leq r\}$ cau dins del conjunt $M$.

      D'aquest fet i del que $M$ sigui també un conjunt obert (dins $M$) es dedueix que $\varnothing$ és obert i tancat a $M$ (per ser complementari de tancat i obert, respectivament).
    problemes: []

  - id: "T1.14"
    tipus: definicio
    num: 14
    resum: 14
    seccio: "1.2"
    pagina: 10
    nom: "Tipus de punts d'un conjunt"
    enunciat: |
      Sigui $A\subseteq M$. Aleshores:

      i) Un punt $x\in A$ és _interior_ a $A$ si existeix $r>0$ tal que $B_r(x)\subseteq A$.

      ii) Un punt $x\in M$ és _d'acumulació_ d'$A$ si per a tot $r>0$ es té que $B_r(x)\cap(A\setminus\{x\})\neq\varnothing$.

      iii) Un punt $x\in M$ és de la frontera d'$A$, si per a tot $r>0$ es té que $B_r(x)\cap A\neq\varnothing$ i també $B_r(x)\cap A^c\neq\varnothing$.

      iv) Un punt $x\in M$ és _exterior_ d'$A$ si $x$ és interior a $A^c$ (és a dir, si existeix $r>0$ tal que $B_r(x)\subseteq A^c$).
    problemes: []

  - id: "T1.15"
    tipus: exemple
    num: 15
    resum: 15
    seccio: "1.2"
    pagina: 10
    nom: "Punts d'un conjunt a R"
    enunciat: |
      Siguin $M=\mathbb{R}$ i $A=(1,2]\cup[3,5]$. Aleshores:

      - Tot punt $x\in(1,2)\cup(3,5)$ és interior a $A$;
      - $x=1$ i $x=3$ són punts d'acumulació d'$A$; de fet, tot $x\in[1,2]\cup[3,5]$ ho és;
      - $x=1,2,3,5$ són punts de la frontera d'$A$;
      - Tot $x\in(-\infty,1)\cup(2,3)\cup(5,+\infty)$ és exterior a $A$. En efecte, $A^c=(-\infty,1]\cup(2,3)\cup[5,+\infty)$ i els seus punts interiors són $(-\infty,1)\cup(2,3)\cup(5,+\infty)$.
    problemes: []

  - id: "T1.16"
    tipus: definicio
    num: 16
    resum: 16
    seccio: "1.2"
    pagina: 10
    nom: "Interior, derivat, frontera, clausura"
    enunciat: |
      Sigui $A\subseteq M$. Aleshores es defineixen:

      i) _Interior_ d'$A$: $\mathring{A}=\{x\in A\mid x\text{ és interior a }A\}$. També s'acostuma a denotar per $\mathrm{int}(A)$.

      ii) _Conjunt derivat_ d'$A$: $A'=\{x\in M\mid x\text{ és punt d'acumulació d'}A\}$.

      iii) _Frontera_ d'$A$: $\mathrm{Fr}A=\{x\in M\mid x\text{ és de la frontera d'}A\}$. També és denota per $\partial A$.

      iv) _Clausura_ o _adherència_ d'$A$: $\overline{A}=\{x\in M\mid\forall r>0\text{ es té que }B_r(x)\cap A\neq\varnothing\}$.
      De manera equivalent, es pot definir de les dues maneres següents:
      a) $\overline{A}=A\cup A'$; b) $\overline{A}$ és el conjunt tancat més petit que conté $A$.

      v) _Exterior_ d'$A$: $\mathrm{ext}(A)=\mathrm{int}(A^c)$.
    problemes: []

  - id: "T1.17"
    tipus: proposicio
    num: 17
    resum: 17
    seccio: "1.2"
    pagina: 10
    nom: "Propietats de la clausura"
    enunciat: |
      Les següents afirmacions són certes:

      i) $A\subseteq B\Rightarrow\overline{A}\subseteq\overline{B}$.

      ii) $A$ és tancat $\Leftrightarrow\overline{A}=A$.

      iii) $\overline{A\cup B}=\overline{A}\cup\overline{B}$.

      iv) $\overline{A\cap B}\subseteq\overline{A}\cap\overline{B}$.
    demostracio: |
      **Demostració de la proposició 17:**

      i) Suposem que $A\subseteq B$. Aleshores: si $x\in\overline{A}$ llavors per a tot $r>0$ es té que $B_r(x)\cap A\neq\varnothing$. Del fet $A\subseteq B$ es dedueix que $\forall r>0$ $B_r(x)\cap B\neq\varnothing$, que implica que $x\in\overline{B}$.

      ii) Demostrem primer la implicació $\Rightarrow$):
      D'un costat, sabem que $A\subseteq\overline{A}$. Vegem ara que $\overline{A}\subseteq A$. Ho farem per reducció a l'absurd (_R.A._). És a dir, suposem que existeix $x\in\overline{A}$ tal que $x\notin A$. Del fet que $A$ és tancat tenim que $A^c$ és un obert. Per tant, usant que $x\notin A\Leftrightarrow x\in A^c$, obert, tenim que existeix $r_0>0$ de manera que $B_{r_0}(x)\subseteq A^c\Rightarrow B_{r_0}(x)\cap A=\varnothing$, fet que contradiu la hipòtesi que $x\in\overline{A}$. Per tant, $\overline{A}\subseteq A\Rightarrow A=\overline{A}$.

      Vegem ara la implicació $\Leftarrow$) :
      que $A$ sigui tancat és equivalent a comprovar que $A^c$ és un obert. En efecte, sigui $x\in A^c$. Això implica que $x\notin A=\overline{A}$, per hipòtesi. Aleshores $x\notin\overline{A}\Rightarrow$ existeix $r_0>0$ tal que $B_{r_0}(x)\cap A=\varnothing$ que, a la vegada, implica que $B_{r_0}(x)\subseteq A^c$; és a dir, $A^c$ obert.

      iii) Cal veure les dues inclusions. $\subseteq$): D'un costat, de la propietat i) tenim:

      $$A\subseteq A\cup B\Rightarrow\overline{A}\subseteq\overline{A\cup B},\qquad B\subseteq A\cup B\Rightarrow\overline{B}\subseteq\overline{A\cup B}.$$

      Per tant, $\overline{A}\cup\overline{B}\subseteq\overline{A\cup B}$.

      $\supseteq$): Vegem ara que $\overline{A}\cup\overline{B}\supseteq\overline{A\cup B}$ o, anàlogament, que $\overline{A\cup B}\subseteq\overline{A}\cup\overline{B}$. Ho fem per _R.A._: suposem que existeix $x\in\overline{A\cup B}$ tal que $x\notin\overline{A}\cup\overline{B}$. Del fet que $x\notin\overline{A}\cup\overline{B}$ tenim que $x\notin\overline{A}$ i $x\notin\overline{B}$. Ara: $x\notin\overline{A}\Rightarrow\exists r_1>0$ tal que $B_{r_1}(x)\cap A=\varnothing$. D'igual manera, de $x\notin\overline{B}$ es dedueix que existeix $r_2>0$ tal que $B_{r_2}(x)\cap B=\varnothing$. Sigui ara $r_0<\min\{r_1,r_2\}$. Aleshores $B_{r_0}(x)\cap A=\varnothing$, $B_{r_0}(x)\cap B=\varnothing\Rightarrow B_{r_0}(x)\cap(A\cup B)=\varnothing$, en contradicció amb la hipòtesi que $x\in\overline{A\cup B}$.

      En conclusió, $\overline{A\cup B}\subseteq\overline{A}\cup\overline{B}$ i, per tant, $\overline{A\cup B}=\overline{A}\cup\overline{B}$.

      iv) Prenem $x\in\overline{A\cap B}$. Per tant, per a tot $r>0$, $B_r(x)\cap A\cap B\neq\varnothing$; d'aquí es dedueix fàcilment que $B_r(x)\cap A\neq\varnothing$ i que $B_r(x)\cap B\neq\varnothing$ i, en conseqüència, que $x\in\overline{A}\cap\overline{B}$.

      Un contraexemple mostrant que la inclusió és estricta és el següent: considereu a $M=\mathbb{R}$ els conjunts $A=[0,1]$ i $B=(1,2]$. Aleshores, $A\cap B=\varnothing\Rightarrow\overline{A\cap B}=\varnothing$; per contra, $\overline{A}=[0,1]$, $\overline{B}=[1,2]$ i $\overline{A}\cap\overline{B}=\{1\}$.
    problemes: []

  - id: "T1.18"
    tipus: definicio
    num: 18
    resum: 18
    seccio: "1.3"
    pagina: 11
    nom: "Successió convergent"
    enunciat: |
      Sigui $(M,d)$ un espai mètric. Direm que una successió $(x_n)_{n\in\mathbb{N}}$ és _convergent_ a $M$ si existeix $x\in M$ tal que $\forall\varepsilon>0,\exists n_0\in\mathbb{N}$ tal que $d(x_n,x)<\varepsilon$ $\forall n\geq n_0$. En aquest cas, diem que $x$ és el límit de la successió, i ho denotem per $x=\displaystyle\lim_{n\to\infty}x_n$ (el límit, si existeix, és únic).
    problemes: []

  - id: "T1.19"
    tipus: proposicio
    num: 19
    resum: 19
    seccio: "1.3"
    pagina: 11
    nom: "Caracterització amb successions"
    enunciat: |
      Sigui $(M,d)$ un espai mètric, $A\subseteq M$ i $x\in M$. Aleshores:

      i) $x$ és un punt d'acumulació d'$A\Leftrightarrow$ existeix una successió $(a_n)_{n\in\mathbb{N}}$, amb $a_n\neq x$, $a_n\in A$, tal que $x=\lim_n a_n$.

      ii) $x\in\overline{A}\Leftrightarrow$ existeix una successió $(a_n)_{n\in\mathbb{N}}$, amb $a_n\in A$ tal que $x=\lim_n a_n$.

      iii) $A$ és tancat $\Leftrightarrow$ el límit de tota successió convergent d'elements d'$A$ és d'$A$.
    demostracio: |
      **Demostració de la proposició 19:**

      i) $\Rightarrow$): Si $x\in A'$ aleshores per a tot $r>0$ es té que $B_r(x)\cap(A\setminus\{x\})\neq\varnothing$. Prenem $\varepsilon_n:=\frac{1}{n}$ i considerem $B_{\varepsilon_n}(x)$. Pel comentari anterior, per a cada $n\in\mathbb{N}$ tenim que $B_{\varepsilon_n}(x)\cap(A\setminus\{x\})\neq\varnothing$. Prenem $a_n\in B_{\varepsilon_n}(x)\cap(A\setminus\{x\})$ i definim $(a_n)_n$ la successió així generada. Observeu que, en particular, $d(a_n,x)<\varepsilon_n=\frac{1}{n}$ per a tot $n\geq 1$.

      Fixat $\varepsilon>0$, sigui $n_0=n_0(\varepsilon)\in\mathbb{N}$ tal que $\varepsilon_{n_0}=\frac{1}{n_0}<\varepsilon$. Això implica que per a tot $n\geq n_0(\varepsilon)$ es té que $d(a_n,x)<\frac{1}{n}<\frac{1}{n_0}<\varepsilon$, és a dir, que $\lim_n a_n=x$.

      $\Leftarrow$): Suposem ara que existeix una successió $(a_n)_n$ amb $a_n\in A\setminus\{x\}$ tal que $\lim_n a_n=x$. Volem veure que $x\in A'$, és a dir, és punt d'acumulació d'$A$.

      Sigui $r=\varepsilon>0$. Del fet que $\lim_n a_n=x$ i que $a_n\in A\setminus\{x\}$ per a tot $n\in\mathbb{N}$, es dedueix que existeix un $n_0=n_0(r)$ de forma que per a tot $n\geq n_0$ tenim $0<d(a_n,x)<r$. És a dir, que $a_n\in B_r(x)\cap(A\setminus\{x\})$, que és la definició de que $x$ sigui punt d'acumulació d'$A$.

      ii) Recordeu que $x\in\overline{A}\Leftrightarrow x\in A'\cup A$. La demostració és anàloga a la del punt i) però sense haver d'imposar que $a_n\neq x$.

      iii) $\Rightarrow$): Suposem que $A$ és tancat. Considerem una successió $(a_n)_n$, amb $a_n\in A$ per a tot $n$, que sigui convergent. Sigui $x=\lim_n a_n$. Per la propietat ii), es dedueix que $x\in\overline{A}=A$, on hem usat a la darrera igualtat que $A$ és tancat.

      $\Leftarrow$): Suposem ara que qualsevol successió convergent de punts d'$A$ té el seu límit a $A$. Volem veure que $A=\overline{A}$.

      Clarament, $A\subseteq\overline{A}$. Vegem que la inclusió contrària, $\overline{A}\subseteq A$, també es dona i que, per tant, tenim la igualtat. En efecte, sigui $x\in\overline{A}$. Per la propietat ii), tenim que existeix una successió $(a_n)_n$, amb $a_n\in A$, tal que $x=\lim_n a_n$. Per hipòtesi, aquest valor límit $x$ pertany a $A$ i, per tant, $\overline{A}\subseteq A$.
    problemes: []

  - id: "T1.20"
    tipus: definicio
    num: 20
    resum: 20
    seccio: "1.3"
    pagina: 12
    nom: "Successió de Cauchy"
    enunciat: |
      Sigui $(M,d)$ un espai mètric. Una successió $(a_n)_{n\in\mathbb{N}}$, amb $a_n\in M$ per a tot $n$, es diu que és de _Cauchy_ si per a tot $\varepsilon>0$, existeix $n_0$ tal que per a tot $n,m\geqslant n_0$, es té que $d(a_n,a_m)<\varepsilon$.
    problemes: []

  - id: "T1.21"
    tipus: proposicio
    num: 21
    resum: 21
    seccio: "1.3"
    pagina: 12
    nom: "Convergent, Cauchy i fitada"
    enunciat: |
      Sigui $(M,d)$ espai mètric.

      i) Si $(x_n)_{n\in\mathbb{N}}$ és convergent, aleshores és de Cauchy.

      ii) Si $(x_n)_{n\in\mathbb{N}}$ és convergent, aleshores és fitada.

      iii) Si $(x_n)_{n\in\mathbb{N}}$ és de Cauchy i té una subsuccessió convergent, aleshores és convergent.
    demostracio: |
      **Demostració de la proposició 21:**

      i) Suposem que $\lim_{n\to\infty}x_n=x$. Volem veure que $(x_n)_n$ és de Cauchy. Sabem que $\forall\varepsilon>0,\exists n_0\in\mathbb{N}$ tal que $d(x_n,x)<\frac{\varepsilon}{2}$ per a tot $n\geq n_0$. Per tant, si $p,q\geq n_0$, aleshores $d(x_p,x_q)\leq d(x_p,x)+d(x,x_q)<\frac{\varepsilon}{2}+\frac{\varepsilon}{2}=\varepsilon$.

      ii) Suposem que $(x_n)_n$ és convergent i sigui $x=\lim_n x_n$. Volem veure que $(x_n)_n$ és fitada. Prenem, per exemple, $\varepsilon=1$. Aleshores, existeix $n_0=n_0(\varepsilon)\in\mathbb{N}$ tal que $d(x_n,x)<1$ $\forall n\geq n_0$. Considerem ara

      $$R=\max\{d(x_1,x),d(x_2,x),\ldots,d(x_{n_0-1},x),1\}.$$

      Aleshores, $d(x_n,x)\leq R$ per a tot $n\in\mathbb{N}$ i, en conclusió, $(x_n)_n$ és fitada.

      iii) Sigui $(x_n)_n$ de Cauchy. Sigui $(x_{n_k})_k$ una subsuccessió de $(x_n)_n$ convergent. Sigui $x=\lim_k x_{n_k}$. Volem veure que $\lim_n x_n=x$. En efecte, sigui $\varepsilon>0$ qualsevol: com que $(x_n)_n$ és de Cauchy, existeix $n_1\in\mathbb{N}$ tal que $d(x_p,x_q)<\frac{\varepsilon}{2}$ $\forall p,q\geq n_1$. D'altra banda, com que $(x_{n_k})_k$ convergeix a $x$, existeix $n_2\in\mathbb{N}$ tal que $d(x_{n_k},x)<\frac{\varepsilon}{2}$ per a tot $n_k\geq n_2$. Escollim $N=\max\{n_1,n_2\}$. Per a $n\geq N$, prenem un $n_k\geq N$. Aleshores: $d(x_n,x)\leq d(x_n,x_{n_k})+d(x_{n_k},x)<\frac{\varepsilon}{2}+\frac{\varepsilon}{2}=\varepsilon$.
    problemes: []

  - id: "T1.22"
    tipus: definicio
    num: 22
    resum: 22
    seccio: "1.3"
    pagina: 13
    nom: "Espai mètric complet"
    enunciat: |
      Un espai mètric $(M,d)$ es diu que és _complet_ si tota successió de Cauchy en $M$ és convergent a $M$.
    problemes: []

  - id: "T1.23"
    tipus: exemple
    num: 23
    resum: null
    seccio: "1.3"
    pagina: 13
    nom: "R complet, Q no complet"
    enunciat: |
      $\mathbb{R}$ amb la distància euclidiana és complet. En canvi, $\mathbb{Q}$ amb la distància euclidiana no és complet. Per exemple: considereu el nombre $\sqrt{2}$. Del fet que sigui irracional, $\sqrt{2}$ admet una expressió en forma decimal infinita on cap bloc es repeteix de forma periòdica (en cas contrari seria racional). Considereu la successió $(a_n)_n$ definida de la forma següent: $a_1$ és el truncament a $1$ xifra decimal de l'expressió (infinita) de $\sqrt{2}$; el terme $a_2$ és el mateix però truncant a $2$ xifres decimals; en general, $a_n$ serà el seu truncament a $n$ xifres decimals. Per exemple:

      $$a_1=1.4,\qquad a_2=1.41,\qquad a_3=1.414,\qquad a_4=1.4142,\qquad\ldots$$

      Aleshores, la successió $(a_n)_n$, amb $a_n\in\mathbb{Q}$, és de Cauchy perquè la diferència entre els seus termes es fa cada cop més petita. En canvi, aquesta successió no convergeix a un valor a $\mathbb{Q}$ (perquè $\sqrt{2}\notin\mathbb{Q}$).
    problemes: []

  - id: "T1.x7"
    tipus: text
    num: null
    resum: 23
    seccio: "1.3"
    pagina: 13
    nom: "R^n és complet"
    enunciat: |
      **Comentari:** $\mathbb{R}^n$ és complet. En efecte: suposem que $(x_k)_{k\in\mathbb{N}}$ és una successió de Cauchy en $\mathbb{R}^n$. Denotem els seus elements com $x_k=(x_{k_1},\ldots,x_{k_n})$. Per a cada component $j=1,\ldots,n$, la successió $(x_{k_j})_j$ és una successió de Cauchy en $\mathbb{R}$, complet, d'on se dedueix que $(x_{k_j})_j$ convergeix a un cert $x_j$ en $\mathbb{R}$. Per tant, la successió $(x_k)_k\subset\mathbb{R}^n$ convergeix al punt $x=(x_1,\ldots,x_n)\in\mathbb{R}^n$.
    problemes: []

  - id: "T1.24"
    tipus: definicio
    num: 24
    resum: 24
    seccio: "1.4"
    pagina: 13
    nom: "Compacte i seqüencialment compacte"
    enunciat: |
      Sigui $(M,d)$ espai mètric, $A\subseteq M$.

      i) $A$ és _compacte_ si tot recobriment per oberts de $A$ admet un subrecobriment finit, és a dir: si $A\subseteq\bigcup_{i\in I}U_i$, amb $U_i$ obert, aleshores existeixen $i_1,\ldots,i_k\in I$ tals que $A\subseteq\bigcup_{j=1}^k U_{i_j}$.

      ii) $A$ és _seqüencialment compacte_ si tota successió $(x_n)_{n\in\mathbb{N}}\subseteq A$ admet una subsuccessió (una parcial) convergent a un punt de $A$.
    problemes: []

  - id: "T1.25"
    tipus: exemple
    num: 25
    resum: null
    seccio: "1.4"
    pagina: 14
    nom: "Intervals compactes i no compactes"
    enunciat: |
      i) $[0,1]$ a $\mathbb{R}$ és compacte.

      ii) $(0,1)$ a $\mathbb{R}$ no és compacte.
    problemes: []

  - id: "T1.x8"
    tipus: text
    num: null
    resum: null
    seccio: "1.4"
    pagina: 14
    nom: "Mètode de l'interval de Cantor"
    enunciat: |
      **Comentari:** La primera prova de que l'interval $[0,1]$ és compacte (a $\mathbb{R}$) va ser donada pel matemàtic alemany Georg Cantor. Va usar el posteriorment anomenat "mètode de l'interval (de Cantor)".

      Es fa per reducció a l'absurd (_R.A._): Donat $\cup_i U_i$ un recobriment obert (infinit) de $[0,1]$, suposem que no es pot obtenir d'ell cap subrecobriment finit. Hi apliquem un mètode iteratiu tipus bisecció. En efecte:

      _Pas 1_: Del fet que $I_0=[0,1]$ no admet cap subrecobriment finit es pot deduir que o bé l'interval $\left[0,\frac{1}{2}\right]$ o l'interval $\left[\frac{1}{2},1\right]$ tampoc l'admeten (en cas contrari hauríem arribat a que $[0,1]$ l'admet!) Suposem que és, per exemple, $I_1=\left[0,\frac{1}{2}\right]$ qui no admet cap subrecobriment finit. Noteu que $I_1\subset I_0$.

      _Pas n_: De la mateixa manera, construïm una successió d'intervals $(I_n)_n$, encaixats, la longitud dels quals satisfà $\mathrm{long}(I_n)=\frac{1}{2^n}$, amb la propietat que cap d'ells admet un recobriment finit: $I_{n+1}\subset I_n$. Si fem $n\to\infty$ aleshores $\mathrm{long}(I_n)\to 0$ i tenim que $\cap_n I_n=\{x^*\}$. Aquest punt $x^*$ ha de pertànyer, necessàriament, a algun dels oberts $U_i$ del recobriment inicial de $I_0=[0,1]$, ja que el recobreixen. Sigui $U^*\in\{U_i\}_i$ un d'aquests oberts tal que $x^*\in U^*$. A més, $\exists N$ tal que $x^*\in I_N\subset U^*$. Però, per construcció, cap interval $I_n$ pot ser recobert per un nombre finit d'oberts del recobriment (i ara acabem de trobar un únic obert que recobreix $I_N$). Contradicció !! Per tant, l'interval $[0,1]$ és compacte.

      (Nota: Georg Cantor, Saint Petersburg 1845 - Halle 1918.)
    problemes: []

  - id: "T1.26"
    tipus: teorema
    num: 26
    resum: 26
    seccio: "1.4"
    pagina: 14
    nom: "Teorema de Bolzano-Weierstrass"
    enunciat: |
      (Bolzano-Weierstrass.) Sigui $(M,d)$ espai mètric i $A\subseteq M$. Aleshores:
      $A$ és compacte $\Leftrightarrow$ $A$ és seqüencialment compacte.
    demostracio: |
      **Demostració del teorema 26:**

      $\Rightarrow$): Suposem que $A$ és compacte. Volem veure que $A$ és seqüencialment compacte. Apliquem un argument de _R.A._: sigui $(x_n)_n$ una successió d'elements $x_n\in A$ tal que no admet cap parcial convergent.

      Clarament, $(x_n)_n$ no pot contenir infinites còpies d'un mateix element $x_{n_0}$ (en cas contrari, la subsuccessió o parcial $x_n=x_{n_0}$ $\forall n$ seria convergent). Definim ara la successió $(y_n)_n\subset A$ formada pels elements de $(x_n)_n$ que són diferents dos a dos; és a dir, eliminem les còpies de punts de $(x_n)_n$. Noteu que $(y_n)_n$ és una subsuccessió de $(x_n)_n$.

      **Afirmació:** Existeix una successió d'oberts $(U_n)_n$, amb $U_n\subseteq M$, tal que $y_n\in U_n$ és l'únic punt de la successió $(y_n)_n$ que pertany a $U_n$.

      **Demostració de l'afirmació:** Novament, per _R.A._: la successió d'oberts $(U_n)_n$ es pot construir de manera trivial considerant boles d'un determinat radi (fixat o no). El fet de suposar que l'afirmació no és certa implica que no podem construir cap successió $(U_n)_n$ tal que cada $U_n$ contingui un, i només un, punt $y_n$ de la successió $(y_n)_n$. És a dir, qualsevol d'aquestes successions $(U_n)_n$ satisfà que existeix almenys un $y_{n_0}\in U_{n_0}$ de manera que $U_{n_0}$ conté una infinitat de punts (diferents entre ells per construcció) de la successió $(y_n)_n$ a banda del punt $y_{n_0}$. En particular, això s'ha de donar també pel següent conjunt d'entorns del punt $y_{n_0}$ :

      $$V_m=B_{\frac{1}{m}}(y_{n_0})\cap U_{n_0},\qquad m\geq 1.$$

      Anomenem $y_m^0\in V_m\setminus\{y_{n_0}\}$ a cadascun d'aquests punts i definim la successió $(y_m^0)_m$. Del fet que $y_m^0\in V_m$ i que el radi d'aquestes boles $\frac{1}{m}\to 0$ si $m\to+\infty$, s'obté que la subsuccessió $(y_m^0)_m$ és convergent al punt $y_{n_0}\in A$. Això contradiu la hipòtesi que $(x_n)_n$ no tingui cap parcial convergent dins del conjunt $A$.

      Per tant, continuant amb la demostració del teorema, podem considerar aquesta successió d'oberts $(U_n)_n$ d'$A$ que satisfà que cada $U_n$ conté un i només un element $y_n$ de la successió $(y_n)_n$.

      Sigui $Y$ el conjunt format pels elements de la successió $(y_n)_n$, és a dir, $Y=\{y_1,y_2,\ldots,y_n,\ldots\}\subseteq A$. Per l'afirmació anterior, $Y$ no té punts d'acumulació. Això implica que $\overline{Y}=Y\Rightarrow Y$ és un conjunt tancat dins d'$A$. A més $\cup_{n\geq 1}U_m\ni Y$ és un recobriment d'oberts de $Y$. Pel Lema 28, car $A$ és compacte, es dedueix que $Y$ és també un compacte. En canvi, però, del recobriment $\cup_{n\geq 1}U_m$ no se'n pot extraure cap recobriment finit perquè cada obert $U_m$ conté exactament un punt diferent $y_m\in Y$ i tots són essencials. Contradicció!! Per tant, $(x_n)_n$ admet una subsuccessió convergent. Falta veure que és convergent a un punt de $A$.

      En efecte, sigui $(x_{n_k})_k\subseteq(x_n)_n$ aquesta parcial convergent i sigui $x=\lim_k x_{n_k}$ el seu límit. En principi $x\in M$. Del fet que $x_{n_k}\in A$ per a tot $k\geq 1$ es dedueix, per definició de punt adherent, que $x\in\overline{A}$. Però, aplicant el Lema 28, $A$ compacte $\Rightarrow A$ tancat $\Leftrightarrow\overline{A}=A$. En conclusió, $x=\lim_k x_{n_k}\in A$.

      $\Leftarrow$) : Suposem ara que $A$ és seqüencialment compacte. Vegem que aleshores és compacte.

      Sigui $\bigcup_{i\in I}U_i\supseteq A$ un recobriment (de fet infinit) per oberts d'$A$. Cal veure que podem extraure un subrecobriment finit. Aleshores:

      - Pel Lema 29 existeix un $\delta>0$ de manera que per a tot $a\in A$ tenim $B_\delta(a)\subseteq U_i$, per a un cert $i\in I$ (que depèn de $a$).
      - Prenem ara, al Lema 30, $\varepsilon=\delta$, on $\delta>0$ és el valor trobat al punt anterior. Aleshores, tenim que existeixen $y_1,y_2,\ldots,y_r$ punts de $A$ tals que

      $$A\subseteq B_\delta(y_1)\cup B_\delta(y_2)\cup\ldots\cup B_\delta(y_r)\subseteq U_{i_1}\cup U_{i_2}\cup\ldots\cup U_{i_r}.$$

      És a dir, hem extret un subrecobriment finit d'$A$. Per tant, $A$ és compacte.
    problemes: []

