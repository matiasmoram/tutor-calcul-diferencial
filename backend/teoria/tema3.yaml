  - id: "T3.6"
    tipus: observacio
    num: 6
    resum: 68
    seccio: "3.1"
    pagina: 3
    nom: "Derivades direccionals sense continuïtat"
    enunciat: |
      L'existència de totes les derivades direccionals en un punt $a$, és a dir $D_uf(a)$, $\forall u\neq0$, no implica la continuïtat de $f$ al punt $a$. Ho podem veure en els dos exemples següents:

      (a) (vegeu el problema 6 del tema 2) Considerem $A=\left\{(x,y)\in\mathbb{R}^2\mid 0<y<x^2\right\}$ i $f(x,y)$ la funció que val $0$ en $A$ i val $1$ en $A^c$.
      Per a aquesta funció, es té que
      $$\lim_{x\to0}f(x,mx)=1,\quad m\in\mathbb{R},$$
      ja que totes les rectes amb $m\neq0$ (inclosa $x=0$, que no es pot expressar com a $y=mx$ amb $m\in\mathbb{R}$) arriben a l'origen per sobre de la paràbola donada per $y=x^2$, mentre que $y=0$ també pertany a $A^c$. Tanmateix, però, no existeix $\displaystyle\lim_{(x,y)\to(0,0)}f(x,y)$. Per tant, no és contínua en $(0,0)$.
      Les derivades direccionals en l'origen, en canvi, existeixen totes: efectivament, donat $u=(u_1,u_2)\neq(0,0)$,
      $$\begin{aligned}D_uf(0,0)&=\lim_{t\to0}\frac{f((0,0)+t(u_1,u_2))-f(0,0)}{t}=\lim_{t\to0}\frac{f(tu_1,tu_2)-f(0,0)}{t}\\&=\lim_{t\to0}\frac{1-1}{t}=0,\end{aligned}$$

      (b) Considerem $f:\mathbb{R}^2\to\mathbb{R}$ definida per
      $$f(x,y)=\begin{cases}\dfrac{xy^2}{x^2+y^4} & \text{si } (x,y)\neq(0,0),\\ 0 & \text{si } (x,y)=(0,0).\end{cases}$$
      Aleshores, donat $u=(u_1,u_2)\neq(0,0)$, vegem que existeix $D_uf(0,0)$:
      $$D_uf(0,0)=\lim_{t\to0}\frac{f(tu_1,tu_2)-f(0,0)}{t}=\lim_{t\to0}\frac{(tu_1)(t^2u_2^2)}{t\left((t^2u_1^2)+(t^4u_2^4)\right)}=\lim_{t\to0}\frac{u_1u_2^2}{u_1^2+t^2u_2^4}.$$
      Per tant, si $u_1=0$ tenim $D_{(0,u_2)}f(0,0)=0$; d'altra banda, si $u_1\neq0$,
      $$D_{(u_1,u_2)}f(0,0)=\frac{u_1u_2^2}{u_1^2}=\frac{u_2^2}{u_1}.$$
      En canvi, $f$ no és contínua a $(0,0)$. Per a veure-ho n'hi ha prou a trobar dos camins que condueixin $(x,y)$ al punt $(0,0)$ de manera que els corresponents límits de $f$ siguin diferents. En efecte, si prenem com a primer camí $x=0$, s'obté:
      $$\lim_{\substack{(x,y)\to(0,0)\\x=0}}f(x,y)=\lim_{y\to0}f(0,y)=\lim_{y\to0}0=0.$$
      Per contra, si prenem el camí $x=y^2$, tenim
      $$\lim_{\substack{(x,y)\to(0,0)\\x=y^2}}f(x,y)=\lim_{y\to0}f(y^2,y)=\lim_{y\to0}\frac{y^4}{y^4+y^4}=\lim_{y\to0}\frac{1}{2}=\frac{1}{2}\neq0.$$
      Per tant, $\nexists\displaystyle\lim_{(x,y)\to(0,0)}f(x,y)$ i, en conseqüència, $f$ no és contínua al punt $(0,0)$. (Nota: De fet, a partir del darrer límit calculat ja hauríem pogut concloure que $f$ no era contínua al $(0,0)$ donat que $f(0,0)=0$.)

      [Figura: Superfície generada per la funció del darrer apartat de l'observació 6, prop de l'origen, on s'observen canvis bruscos de pendent en canviar de direcció.]
      Figura 2: Representació de la superfície generada per la funció del darrer apartat de l'observació 6, prop de l'origen. Observeu els canvis bruscos de pendent al canviar de direcció.
    problemes: ["T2.6"]

  - id: "T3.7"
    tipus: observacio
    num: 7
    resum: null
    seccio: "3.1"
    pagina: 4
    nom: "Derivada direccional de camps vectorials"
    enunciat: |
      En el cas que $f:\mathbb{R}^n\to\mathbb{R}^m$, amb $f=(f_1,f_2,\ldots,f_m)$, si $a\in\mathbb{R}^n$ i $u\in\mathbb{R}^n\setminus\{0\}$, aleshores $D_uf(a)=(D_uf_1(a),D_uf_2(a),\ldots,D_uf_m(a))$.
    problemes: []

  - id: "T3.x3"
    tipus: text
    num: null
    resum: null
    seccio: "3.1"
    pagina: 4
    nom: "Recordatori: aplicacions lineals"
    enunciat: |
      Recordeu que $\mathcal{L}(\mathbb{R}^n,\mathbb{R}^m)$ denota el conjunt de les aplicacions lineals de $\mathbb{R}^n$ a $\mathbb{R}^m$. Si $g\in\mathcal{L}(\mathbb{R}^n,\mathbb{R}^m)$ i denotem per $A\in\mathcal{M}_{m\times n}$ la matriu associada a $g$ en les bases $\{u\}$, $\{v\}$ de $\mathbb{R}^n$ i $\mathbb{R}^m$, respectivament, aleshores $\forall x\in\mathbb{R}^n$ es té que $g(x)=Ax$.
    problemes: []

  - id: "T3.8"
    tipus: definicio
    num: 8
    resum: 69
    seccio: "3.1"
    pagina: 4
    nom: "Funció diferenciable"
    enunciat: |
      Sigui $f:\Omega\subseteq\mathbb{R}^n\to\mathbb{R}^m$. Direm que $f$ és diferenciable a un punt $a\in\mathring{\Omega}$ si existeix $Df(a)\in\mathcal{L}(\mathbb{R}^n;\mathbb{R}^m)$ tal que
      $$\lim_{x\to a}\frac{\|f(x)-f(a)-Df(a)(x-a)\|}{\|x-a\|}=0.\tag{3}$$
    problemes: []

  - id: "T3.x4"
    tipus: text
    num: null
    resum: null
    seccio: "3.1"
    pagina: 4
    nom: "Reformulació epsilon-delta i aproximació afí"
    enunciat: |
      És a dir, en altres paraules, si $\forall\varepsilon>0$ $\exists\delta=\delta(\varepsilon)>0$ tal que si $x\in\Omega$ amb $\|x-a\|<\delta$ aleshores $\|f(x)-(f(a)+Df(a)(x-a))\|\leq\varepsilon\|x-a\|$.

      Per tant, si $f$ és diferenciable al punt $a$, per a valors d'$x$ propers a $a$ la funció $f(x)$ es pot aproximar per la funció afí $f(a)+Df(a)(x-a)$.
    problemes: []

  - id: "T3.9"
    tipus: proposicio
    num: 9
    resum: 70
    seccio: "3.1"
    pagina: 5
    nom: "Derivades direccionals, jacobiana i hiperplà tangent"
    enunciat: |
      Sigui $f:\Omega\subseteq\mathbb{R}^n\to\mathbb{R}^m$, $f=(f_1,f_2,\ldots,f_m)$, diferenciable en $a\in\mathring{\Omega}$. Llavors:

      (i) Existeixen totes les derivades direccionals de $f$ al punt $a$ i, a més, $D_uf(a)=Df(a)\,u$, $\forall u\neq0$.

      (ii) La diferencial $Df(a)$ és única i, fixades les bases canòniques a $\mathbb{R}^n$ i $\mathbb{R}^m$, té matriu
      $$Jf(a)=\begin{pmatrix}\dfrac{\partial f_1}{\partial x_1}(a)&\cdots&\dfrac{\partial f_1}{\partial x_n}(a)\\ \dfrac{\partial f_2}{\partial x_1}(a)&\cdots&\dfrac{\partial f_2}{\partial x_n}(a)\\ \vdots&\ddots&\vdots\\ \dfrac{\partial f_m}{\partial x_1}(a)&\cdots&\dfrac{\partial f_m}{\partial x_n}(a)\end{pmatrix}=\left(\frac{\partial f_i}{\partial x_j}(a)\right)_{i,j}.\tag{4}$$

      (iii) Per al cas $m=1$, és a dir, $f:\Omega\subseteq\mathbb{R}^n\to\mathbb{R}$, l'hiperplà tangent al graf de $f$, $x_{n+1}=f(x)$, en el punt $(a,f(a))$ ve donat per
      $$x_{n+1}=f(a)+Jf(a)(x-a).\tag{5}$$
      En el cas particular $n=2$, és a dir $f:\Omega\subseteq\mathbb{R}^2\to\mathbb{R}$, l'equació del pla tangent a la superfície $z=f(x,y)$ al punt $(a,f(a))=(a_1,a_2,f(a_1,a_2))$ és
      $$z=f(a)+\frac{\partial f}{\partial x}(a)\,(x-a_1)+\frac{\partial f}{\partial y}(a)\,(y-a_2).\tag{6}$$
      En aquest cas, tenim que
      $$D_uf(a)=Df(a)\,u=\langle\nabla f(a),u\rangle,\quad\forall u\neq0.$$
    demostracio: |
      (i) Que $f$ sigui diferenciable al punt $a$ equival al fet que
      $$\lim_{x\to a}\frac{\|f(x)-f(a)-Df(a)(x-a)\|}{\|x-a\|}=0.$$
      En particular, aquest límit és zero sigui quin sigui el camí que porti $x$ cap a $a$ (proposició 10 del tema 2). Prenem com a tal la recta definida per $x=a+t\,u$, amb $t\in\mathbb{R}$ i $u$ qualsevol vector no nul a $\mathbb{R}^n$. Així,
      $$\begin{aligned}0&=\lim_{t\to0}\frac{\|f(a+tu)-f(a)-Df(a)(tu)\|}{\|tu\|}=\lim_{t\to0}\frac{\|f(a+tu)-f(a)-tDf(a)(u)\|}{\|tu\|}\\&=\frac{1}{\|u\|}\lim_{t\to0}\left\|\frac{f(a+tu)-f(a)-tDf(a)u}{t}\right\|=\frac{1}{\|u\|}\lim_{t\to0}\left\|\frac{f(a+tu)-f(a)}{t}-Df(a)u\right\|.\end{aligned}$$
      És a dir,
      $$\lim_{t\to0}\frac{f(a+tu)-f(a)}{t}=Df(a)u$$
      o, equivalentment,
      $$D_uf(a)=Df(a)u.$$

      (ii) $Df(a)$ és lineal i, per tant, fixades les bases canòniques a $\mathbb{R}^n$ i $\mathbb{R}^m$, la seva matriu associada $M$ en aquestes bases és única. Noteu que
      $$Me_j=D_{e_j}f(a)=\frac{\partial f}{\partial x_j}(a)=\left(\frac{\partial f_1}{\partial x_j}(a)\ \ \frac{\partial f_2}{\partial x_j}(a)\ \ \ldots\ \ \frac{\partial f_m}{\partial x_j}(a)\right)^\top$$
      proporciona, necessàriament, la columna $j$-èsima $1\leq j\leq n$ de la matriu, de manera que la matriu $M$ coincideix amb l'expressió donada per a $Jf(a)$ a (4).

      (iii) L'hiperplà tangent a $x_{n+1}=f(x)$ en un punt $(a,f(a))$ ve donat per
      $$(a,f(a))+\left\langle\left(e_1,\frac{\partial f}{\partial x_1}(a)\right),\ldots,\left(e_n,\frac{\partial f}{\partial x_n}(a)\right)\right\rangle,$$
      on $e_j$ és el vector $j$-èsim de la base canònica; és a dir, és el pla a $\mathbb{R}^{n+1}$ que conté el punt $(a,f(a))$ i està generat pels vectors $\left(e_j,\dfrac{\partial f}{\partial x_j}(a)\right)$, per a $j=1,\ldots,n$.
      Vegem ara que $(u,D_uf(a))$ es pot posar com a combinació dels generadors de l'hiperplà per a tot $u\in\mathbb{R}^n\setminus\{0\}$.

      En efecte, si $u\in\mathbb{R}^n\setminus\{0\}$, el podem expressar de la forma $u=\lambda_1e_1+\lambda_2e_2+\cdots+\lambda_ne_n$ (és a dir, $(\lambda_1,\lambda_2,\ldots,\lambda_n)$ és l'expressió d'$u$ en coordenades de la base $\{e_j\}_{j=1}^n$). Aleshores, $f$ diferenciable en $a$ implica que
      $$\begin{aligned}(u,D_uf(a))&=(u,Jf(a)u)=\left(u,\sum_{i=1}^n\lambda_iJf(a)e_i\right)\\&=\left(\lambda_1e_1+\cdots+\lambda_ne_n,\sum_{i=1}^n\lambda_iJf(a)e_i\right)=\sum_{i=1}^n\lambda_i\left(e_i,\frac{\partial f}{\partial x_i}(a)\right).\end{aligned}$$
      En el cas particular de $m=1$, tenim que els punts de l'hiperplà tangent satisfan
      $$(x,x_{n+1})=(a,f(a))+\lambda_1\left(e_1,\frac{\partial f}{\partial x_1}(a)\right)+\cdots+\lambda_n\left(e_n,\frac{\partial f}{\partial x_n}(a)\right),$$
      d'on
      $$\begin{aligned}x&=a+\lambda_1e_1+\cdots\lambda_ne_n\Longrightarrow x_i-a_i=\lambda_i,\quad i=1,\ldots n,\\x_{n+1}&=f(a)+\lambda_1\frac{\partial f}{\partial x_1}(a)+\cdots+\lambda_n\frac{\partial f}{\partial x_n}(a).\end{aligned}$$
      Ajuntant ambdues expressions obtenim l'expressió del corresponent hiperplà tangent
      $$x_{n+1}=f(a)+\frac{\partial f}{\partial x_1}(a)\,(x-a_1)+\cdots+\frac{\partial f}{\partial x_n}(a)\,(x_n-a_n)=f(a)+Jf(a)(x-a).$$
      Si $n=1$ l'expressió de la recta tangent al punt $(a,f(a))$ és
      $$y=f(a)+f'(a)(x-a),$$
      mentre que per a $n=2$, el pla tangent ve donat per l'expressió
      $$z=f(a_1,a_2)+\frac{\partial f}{\partial x}(a_1,a_2)\,(x-a_1)+\frac{\partial f}{\partial y}(a_1,a_2)\,(y-a_2).$$
    problemes: []

  - id: "T3.10"
    tipus: definicio
    num: 10
    resum: null
    seccio: "3.1"
    pagina: 5
    nom: "Matriu jacobiana i gradient"
    enunciat: |
      La matriu $Jf(a)$ s'anomena matriu de Jacobi o jacobiana de $f$ al punt $a$.
      En el cas $m=1$, la matriu $Jf(a)\in\mathcal{M}_{1\times n}(\mathbb{R})$ s'identifica amb l'anomenat vector gradient de $f$ al punt $a$, que es denota per
      $$\nabla f(a)=\left(\frac{\partial f}{\partial x_1}(a),\frac{\partial f}{\partial x_2}(a),\ldots,\frac{\partial f}{\partial x_n}(a)\right).\tag{7}$$
    problemes: []

  - id: "T3.11"
    tipus: observacio
    num: 11
    resum: null
    seccio: "3.1"
    pagina: 7
    nom: "Derivada direccional via derivades parcials"
    enunciat: |
      Observeu que si $f:\Omega\subseteq\mathbb{R}^n\to\mathbb{R}$ és diferenciable en $a\in\mathring{\Omega}$ aleshores, si $u=\lambda_1e_1+\lambda_2e_2+\cdots+\lambda_ne_n$ llavors
      $$D_uf(a)=\sum_{j=1}^n\lambda_j\frac{\partial f}{\partial x_j}(a).$$
    problemes: []

  - id: "T3.12"
    tipus: exemple
    num: 12
    resum: null
    seccio: "3.1"
    pagina: 7
    nom: "Diferenciabilitat de x^2+y^2 a (1,2)"
    enunciat: |
      La funció $f:\mathbb{R}^2\to\mathbb{R}$, definida per $f(x,y)=x^2+y^2$ és diferenciable al punt $a=(1,2)$.
    demostracio: |
      Per començar, si ho fos, l'única possible candidata a matriu jacobiana és
      $$Jf(a)=\left(\frac{\partial f}{\partial x}(1,2)\quad\frac{\partial f}{\partial y}(1,2)\right)=\left.(2x\ \ 2y)\right|_{(1,2)}=(2\ \ 4).$$
      Comprovem ara que, amb aquesta matriu, el següent límit s'anul·la:
      $$\lim_{(x,y)\to(1,2)}\frac{\left|f(x,y)-f(1,2)-(2\ \ 4)\begin{pmatrix}x-1\\y-2\end{pmatrix}\right|}{\|(x,y)-(1,2)\|}=0.$$
      En efecte,
      $$\begin{aligned}&\lim_{(x,y)\to(1,2)}\frac{\left|f(x,y)-f(1,2)-(2\ \ 4)\begin{pmatrix}x-1\\y-2\end{pmatrix}\right|}{\|(x,y)-(1,2)\|}\\&=\lim_{(x,y)\to(1,2)}\frac{|x^2+y^2-5-2(x-1)-4(y-2)|}{\sqrt{(x-1)^2+(y-2)^2}}=\lim_{(x,y)\to(1,2)}\frac{|x^2+y^2-2x-4y+5|}{\sqrt{(x-1)^2+(y-2)^2}}\\&=\lim_{(x,y)\to(1,2)}\frac{(x-1)^2+(y-2)^2}{\sqrt{(x-1)^2+(y-2)^2}}=\lim_{(x,y)\to(1,2)}\sqrt{(x-1)^2+(y-2)^2}=0.\end{aligned}$$
    problemes: []

  - id: "T3.13"
    tipus: proposicio
    num: 13
    resum: 71
    seccio: "3.1"
    pagina: 8
    nom: "Direcció de màxim creixement i gradient"
    enunciat: |
      Sigui $f:\Omega\subseteq\mathbb{R}^n\to\mathbb{R}$ diferenciable en un punt $a\in\mathring{\Omega}$. Aleshores:

      (i) $\displaystyle\max_{\|u\|=1}\{D_uf(a)\}=\|\nabla f(a)\|$ i aquest valor s'obté per a $u=\dfrac{\nabla f(a)}{\|\nabla f(a)\|}$.

      (ii) De manera anàloga, $\displaystyle\min_{\|u\|=1}\{D_uf(a)\}=-\|\nabla f(a)\|$ i aquest valor s'obté per al vector $u=-\dfrac{\nabla f(a)}{\|\nabla f(a)\|}$.

      (iii) Considerem el cas $n=2$. Sigui $\gamma=\{x\in\mathbb{R}^2\mid f(x,y)=f(a_1,a_2)\}$ la corba de nivell (al pla $(x,y)$) d'alçada $f(a_1,a_2)$. Aleshores, el vector gradient de $f$ al punt $(a_1,a_2)$, $\nabla f(a_1,a_2)$, és ortogonal a la corba $\gamma$ en el punt $(a_1,a_2)$.
    demostracio: |
      Sigui $u\in\mathbb{R}^n\setminus\{0\}$, normalitzat (és a dir $\|u\|=1$). (Nota: Per defecte, si no es diu el contrari, al llarg d'aquesta secció la norma vectorial considerada serà l'euclidiana. En qualsevol cas, les fites emprades són també vàlides per a normes matricials que siguin consistents amb la norma vectorial fixada.) Del fet que $f$ és diferenciable al punt $a$ es deriva que
      $$D_uf(a)=\langle\nabla f(a),u\rangle=\|\nabla f(a)\|\|u\|\cos\alpha=\|\nabla f(a)\|\cos\alpha,$$
      on $\alpha$ és l'angle (petit) comprès entre els vectors $\nabla f(a)$ i $u$. És clar que
      $$-\|\nabla f(a)\|\leq\|\nabla f(a)\|\cos\alpha\leq\|\nabla f(a)\|.$$
      El valor màxim s'ateny per a $\cos\alpha=1$, és a dir $\alpha=0$ i, en conseqüència, per a $u=\nabla f(a)/\|\nabla f(a)\|$:
      $$\max_{\|u\|=1}\{D_uf(a)\}=D_{\frac{\nabla f(a)}{\|\nabla f(a)\|}}f(a)=\|\nabla f(a)\|.$$
      De manera similar, el valor mínim correspon a $\cos\alpha=-1$, o sigui, l'angle entre $u$ i $\nabla f(a)$ és igual a $\pi$. Així, $u=-\nabla f(a)/\|\nabla f(a)\|$ i
      $$\min_{\|u\|=1}\{D_uf(a)\}=D_{-\frac{\nabla f(a)}{\|\nabla f(a)\|}}f(a)=-\|\nabla f(a)\|.$$

      (iii) Clarament, el punt $(a_1,a_2)$ pertany a la corba $\gamma$. La corresponent corba dins de la gràfica $z=f(x,y)$, donada per
      $$\Gamma=\{(x,y,z)\in\mathbb{R}^3\mid(x,y)\in\gamma,\ z=f(a_1,a_2)\},$$
      està caracteritzada pel fet que tots els seus punts tenen la mateixa alçada $f(a_1,a_2)$. En particular, al punt $(a_1,a_2)\in\gamma$. La derivada direccional $D_{u_\tau}f(a_1,a_2)$ en la direcció i sentit del vector (unitari) tangent $u_\tau$ a $\gamma$ ens manté dins la corba $\gamma$, no varia el valor de $f$ i, per tant, satisfà que $D_{u_\tau}f(a_1,a_2)=0$. Del fet que $f$ és diferenciable al punt $a$ es dedueix que
      $$0=D_{u_\tau}f(a_1,a_2)=\langle\nabla f(a_1,a_2),u_\tau\rangle\Rightarrow\nabla f(a_1,a_2)\perp u_\tau.$$
      És a dir, per definició, $\nabla f(a_1,a_2)$ és ortogonal a la corba $\gamma$ al punt $(a_1,a_2)$.
    problemes: []

  - id: "T3.x5"
    tipus: text
