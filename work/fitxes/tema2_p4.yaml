problemes:
  - num: 13
    font: null
    preambul: |
      Raoneu si són oberts els subconjunts de $\mathbb{R}^2$ o $\mathbb{R}^3$ següents:
    indicacio: null
    exercicis:
      - id: "t2-13a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          $A=\{(x,y)\in\mathbb{R}^2\ \mid\ \cos\left(x+y\right)+\sin\left(x-y\right)<1\}$.
        teoria: ["T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $A$ és obert: $f(x,y)=\cos(x+y)+\sin(x-y)$ és contínua a tot $\mathbb{R}^2$ i $A=\{f<1\}$ és un conjunt definit per una desigualtat estricta entre funcions contínues a $\mathbb{R}^2$.
          fuites: ['(?<!si\s)(?<!si\s\$)(\$A\$|\bA\b)\s+és\s+(un\s+)?(conjunt\s+)?obert\b', '\bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?obert\b']
        passos:
          - id: continuitat
            titol: "Continuïtat de la funció que defineix el conjunt"
            objectiu: |
              Identificar la funció que defineix $A$ i decidir on està definida i on és contínua.
            idea: |
              Escriure $A$ com el conjunt on una certa funció és menor que una constant, i justificar la continuïtat d'aquesta funció com a composició i suma de funcions contínues (polinomis de grau $1$ i les funcions $\sin$, $\cos$ d'una variable).
            detall: |
              Sigui $f(x,y)=\cos(x+y)+\sin(x-y)$. Les aplicacions $(x,y)\mapsto x+y$ i $(x,y)\mapsto x-y$ són polinòmiques (contínues), $\cos$ i $\sin$ són contínues a $\mathbb{R}$, de manera que les composicions són contínues i la seva suma també. Per tant $f$ és contínua a tot $\mathbb{R}^2$ (el seu domini és tot $\mathbb{R}^2$).
            fuites: []
            teoria: ["T2.19", "T2.20"]
          - id: concloure
            titol: "Aplicar el resultat sobre desigualtats estrictes"
            objectiu: |
              Deduir, a partir de la continuïtat, si $A$ compleix la definició de conjunt obert.
            idea: |
              Un conjunt definit per una desigualtat estricta entre dues funcions contínues a tot $\mathbb{R}^n$ és obert (equivalentment, és l'antiimatge d'un obert de $\mathbb{R}$ per una funció contínua).
            detall: |
              Amb $g\equiv 1$ (contínua), $A=\{(x,y)\in\mathbb{R}^2: g(x,y)>f(x,y)\}$, que és obert pel corol·lari dels conjunts definits per desigualtats. Equivalentment, $A=f^{-1}((-\infty,1))$ és l'antiimatge d'un obert de $\mathbb{R}$ per una funció contínua definida a tot $\mathbb{R}^2$. Per tant $A$ és obert.
            fuites: ['f\^\{?-1\}?\s*\(\s*\(\s*-\s*\\infty\s*,\s*1\s*\)']
            teoria: ["T2.18", "T2.17"]
        errors_comuns:
          - id: busca_boles_explicites
            descripcio: |
              Intenta trobar explícitament el radi de la bola al voltant de cada punt i s'encalla, sense adonar-se que la continuïtat ja ho resol.
            pregunta: |
              Hi ha algun resultat de teoria que relacioni la continuïtat d'una funció amb el caràcter dels conjunts que defineix amb desigualtats?
          - id: confon_estricta
            descripcio: |
              Pensa que el resultat depèn de si el conjunt és fitat o no, o confon el cas de desigualtat estricta amb el de desigualtat no estricta.
            pregunta: |
              Quina diferència hi ha entre $\{f<1\}$ i $\{f\le 1\}$ pel que fa al tipus de conjunt que s'obté? Importa que el conjunt sigui fitat?
          - id: no_justifica_continuitat
            descripcio: |
              Afirma que $f$ és contínua sense justificar-ho ni comprovar on està definida.
            pregunta: |
              On està definida $f$, i per què hi és contínua? De quines funcions més simples està construïda?
        nota_professor: |
          Aplicació directa del corol·lari 18 (T2.18). El conjunt no és fitat (és invariant per $(x,y)\mapsto(x+2\pi,y+2\pi)$), però això no afecta l'obertura.

      - id: "t2-13b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          $B=\{(x,y)\in\mathbb{R}^2\ \mid\ xy\log\left(x-y\right)>5\}$.
        teoria: ["T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $B$ és obert. La funció $f(x,y)=xy\log(x-y)$ és contínua al seu domini $\Omega=\{x>y\}$, que és obert; aleshores $B=f^{-1}((5,+\infty))=U\cap\Omega$ amb $U$ obert de $\mathbb{R}^2$, intersecció de dos oberts.
          fuites: ['(?<!si\s)(?<!si\s\$)(\$B\$|\bB\b)\s+és\s+(un\s+)?(conjunt\s+)?obert\b', '\bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?obert\b']
        passos:
          - id: domini
            titol: "Domini de la funció"
            objectiu: |
              Determinar on està definida la funció que apareix a la condició de $B$, i quin tipus de conjunt és aquest domini.
            idea: |
              El logaritme només està definit per arguments positius; el domini resultant també és un conjunt definit per una desigualtat entre funcions contínues.
            detall: |
              $f(x,y)=xy\log(x-y)$ està definida a $\Omega=\{(x,y)\in\mathbb{R}^2: x>y\}$. Com que $(x,y)\mapsto x$ i $(x,y)\mapsto y$ són contínues a $\mathbb{R}^2$, $\Omega$ és obert (desigualtat estricta entre funcions contínues). En particular $B\subseteq\Omega$.
            fuites: ['x\s*>\s*y\b', 'x\s*-\s*y\s*>\s*0']
            teoria: ["T2.18"]
          - id: continuitat
            titol: "Continuïtat a $\\Omega$"
            objectiu: |
              Justificar on és contínua la funció que defineix $B$.
            idea: |
              Producte i composició de funcions contínues; el logaritme és continu a $(0,+\infty)$.
            detall: |
              $(x,y)\mapsto x-y$ és contínua i pren valors a $(0,+\infty)$ sobre $\Omega$, on $\log$ és contínua; la composició $\log(x-y)$ és contínua a $\Omega$, i multiplicada pel polinomi $xy$ dona $f$ contínua a $\Omega$.
            fuites: []
            teoria: ["T2.19", "T2.20"]
          - id: concloure
            titol: "Antiimatge d'un obert"
            objectiu: |
              Deduir si $B$ és obert de $\mathbb{R}^2$ (no només dins del domini).
            idea: |
              La caracterització topològica de la continuïtat dona l'antiimatge d'un obert com la intersecció d'un obert de l'espai amb el domini; cal combinar-ho amb el caràcter del domini.
            detall: |
              $B=f^{-1}((5,+\infty))$ i $(5,+\infty)$ és obert de $\mathbb{R}$. Per la caracterització de la continuïtat, existeix $U\subseteq\mathbb{R}^2$ obert amb $B=U\cap\Omega$. Com que $\Omega$ és obert, $B$ és intersecció finita d'oberts, i per tant és obert de $\mathbb{R}^2$.
            fuites: ['U\s*\\cap\s*\\Omega']
            teoria: ["T2.17", "T2.x4", "T1.12"]
        errors_comuns:
          - id: oblida_domini
            descripcio: |
              Aplica el corol·lari de les desigualtats com si $f$ fos contínua a tot $\mathbb{R}^2$, sense mirar el domini del logaritme.
            pregunta: |
              El resultat que fas servir demana funcions contínues a tot $\mathbb{R}^2$. Està definida $f$ a tot arreu?
          - id: domini_no_obert_irrellevant
            descripcio: |
              Creu que l'antiimatge d'un obert per una funció contínua és sempre oberta, sigui quin sigui el domini.
            pregunta: |
              Si una funció contínua només està definida en un conjunt $\Omega$, què diu exactament la teoria de l'antiimatge d'un obert? Quin paper hi juga $\Omega$?
          - id: confon_signe_log
            descripcio: |
              Posa com a domini $x-y\ge 0$ o $x-y>1$ (confusió amb el signe o el valor del logaritme).
            pregunta: |
              Per a quins valors de $t$ està definit $\log t$? I quins valors pot prendre $\log t$ en aquest domini?
        nota_professor: |
          Combina T2.17(c) amb el comentari T2.x4: si el domini $\Omega$ és obert, les antiimatges d'oberts són obertes de $\mathbb{R}^n$.

      - id: "t2-13c"
        apartat: "c"
        tipus: teoric
        enunciat: |
          $C=\{(x,y)\in\mathbb{R}^2\ \mid\ \sqrt{x+y}<1\}$.
        teoria: ["T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $C$ no és obert. Com que l'arrel només està definida per $x+y\ge 0$, $C=\{(x,y): 0\le x+y<1\}$. El punt $(0,0)\in C$, però tota bola $B_r(0,0)$ conté punts $(-t,0)$ amb $0<t<r$, que no són de $C$. (És obert relatiu al domini $\{x+y\ge0\}$, però no és obert de $\mathbb{R}^2$.)
          fuites: ['(\$C\$|\bC\b)\s+no\s+és\s+(un\s+)?(conjunt\s+)?obert\b', '\bno,?\s+no\s+és\s+(un\s+)?(conjunt\s+)?obert\b']
        passos:
          - id: domini
            titol: "Domini i descripció de $C$"
            objectiu: |
              Determinar exactament quins punts formen $C$, tenint en compte on té sentit l'expressió.
            idea: |
              L'arrel quadrada real només està definida per a arguments no negatius; després es pot eliminar l'arrel perquè és creixent.
            detall: |
              $\sqrt{x+y}$ només té sentit si $x+y\ge 0$, i en aquest cas $\sqrt{x+y}<1\iff x+y<1$. Per tant $C=\{(x,y)\in\mathbb{R}^2: 0\le x+y<1\}$, una franja que conté la recta $x+y=0$.
            fuites: ['0\s*(\\le|\\leq|≤|\\leqslant)\s*x\s*\+\s*y\s*<\s*1']
            teoria: []
          - id: punt_frontera
            titol: "Buscar un punt problemàtic"
            objectiu: |
              Comprovar la definició d'obert en els punts de $C$ que siguin a la vora del domini.
            idea: |
              Un conjunt és obert si cada punt seu té una bola continguda en el conjunt; mirar un punt de $C$ amb $x+y=0$.
            detall: |
              $(0,0)\in C$ perquè $\sqrt{0}=0<1$. Però per a tot $r>0$, el punt $(-r/2,0)\in B_r(0,0)$ compleix $x+y=-r/2<0$, de manera que no és de $C$. Cap bola centrada a $(0,0)$ està continguda en $C$, i per tant $C$ no és obert.
            fuites: ['\(\s*-\s*r\s*/\s*2\s*,\s*0\s*\)', '\(\s*-\s*\\frac\{r\}\{2\}\s*,\s*0\s*\)']
            teoria: ["T1.11"]
        errors_comuns:
          - id: aplica_corollari_cec
            descripcio: |
              Diu que és obert perquè $\sqrt{x+y}$ és contínua i la desigualtat és estricta, sense tenir en compte que la funció no està definida a tot $\mathbb{R}^2$.
            pregunta: |
              El corol·lari de les desigualtats estrictes, quina hipòtesi demana sobre el domini de les funcions? Es compleix aquí?
          - id: oblida_domini
            descripcio: |
              Escriu $C=\{x+y<1\}$, oblidant la condició $x+y\ge 0$ que imposa l'arrel.
            pregunta: |
              Quant val $\sqrt{x+y}$ al punt $(-5,0)$? Pertany aquest punt a $C$?
          - id: obert_relatiu
            descripcio: |
              Confon ser obert dins del domini (obert relatiu) amb ser obert de $\mathbb{R}^2$.
            pregunta: |
              La pregunta és sobre $\mathbb{R}^2$. Si agafes un punt de $C$ sobre la recta $x+y=0$, quina bola de $\mathbb{R}^2$ cap dins de $C$?
        nota_professor: |
          És l'exemple típic del comentari T2.x4: per una funció contínua en un domini $\Omega$ no obert, $\{f<1\}=U\cap\Omega$ només és obert relatiu a $\Omega$. $C$ no és obert ni tancat.

      - id: "t2-13d"
        apartat: "d"
        tipus: teoric
        enunciat: |
          $D=\{(x,y,z)\in\mathbb{R}^3\ \mid\ 1<x+y^2+z^3<3,\ xyz<0\}$.
        teoria: ["T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $D$ és obert: és la intersecció dels tres conjunts $\{x+y^2+z^3>1\}$, $\{x+y^2+z^3<3\}$ i $\{xyz<0\}$, cadascun definit per una desigualtat estricta entre funcions polinòmiques (contínues a tot $\mathbb{R}^3$), i per tant oberts; la intersecció finita d'oberts és oberta.
          fuites: ['(?<!si\s)(?<!si\s\$)(\$D\$|\bD\b)\s+és\s+(un\s+)?(conjunt\s+)?obert\b', '\bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?obert\b']
        passos:
          - id: descompondre
            titol: "Escriure $D$ com a intersecció"
            objectiu: |
              Expressar $D$ en termes de conjunts més simples, cadascun definit per una sola condició.
            idea: |
              Una doble desigualtat i una condició addicional són una conjunció de condicions: cada condició defineix un conjunt i $D$ és la seva intersecció.
            detall: |
              $D=D_1\cap D_2\cap D_3$ amb $D_1=\{x+y^2+z^3>1\}$, $D_2=\{x+y^2+z^3<3\}$, $D_3=\{xyz<0\}$.
            fuites: []
            teoria: []
          - id: cada_un_obert
            titol: "Cada condició dona un obert"
            objectiu: |
              Decidir quin tipus de conjunt és cadascuna de les peces.
            idea: |
              Les funcions que hi apareixen són polinomis, contínues a tot $\mathbb{R}^3$, i les desigualtats són estrictes.
            detall: |
              $p(x,y,z)=x+y^2+z^3$ i $q(x,y,z)=xyz$ són polinomis, contínues a $\mathbb{R}^3$. Pel corol·lari dels conjunts definits per desigualtats estrictes, $D_1=\{p>1\}$, $D_2=\{3>p\}$ i $D_3=\{0>q\}$ són oberts.
            fuites: []
            teoria: ["T2.20", "T2.18"]
          - id: interseccio
            titol: "Intersecció finita"
            objectiu: |
              Concloure sobre $D$ a partir de les peces.
            idea: |
              Propietats dels oberts respecte de les interseccions.
            detall: |
              La intersecció finita d'oberts és oberta, per tant $D=D_1\cap D_2\cap D_3$ és obert de $\mathbb{R}^3$.
            fuites: []
            teoria: ["T1.12"]
        errors_comuns:
          - id: doble_desigualtat
            descripcio: |
              No sap tractar la doble desigualtat i intenta aplicar el corol·lari directament a "$1<p<3$".
            pregunta: |
              La condició $1<p<3$ és una sola desigualtat o la conjunció de dues? Quin conjunt defineix cadascuna?
          - id: interseccio_infinita
            descripcio: |
              Justifica la intersecció amb una propietat que no s'aplica (per exemple, creu que tota intersecció d'oberts és oberta, o confon amb les propietats dels tancats).
            pregunta: |
              Quantes interseccions fas aquí? La propietat que fas servir, val per a qualsevol nombre d'interseccions d'oberts?
        nota_professor: |
          No cal saber si $D$ és no buit (ho és: per exemple $(2,1,-0.1)$ compleix $1<2+1-0.001<3$ i $xyz=-0.2<0$).

      - id: "t2-13e"
        apartat: "e"
        tipus: teoric
        enunciat: |
          $E=\left\{(x,y,z)\in\mathbb{R}^3\ \mid\ \left|\dfrac{x+y+z}{x^3+y^3+z^3}\right|<1\right\}$.
        teoria: ["T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $E$ és obert. Si $s_1=x+y+z$ i $s_3=x^3+y^3+z^3$, aleshores $E=\{(x,y,z)\in\mathbb{R}^3: |s_1|<|s_3|\}$ (on $s_3=0$ la desigualtat $|s_1|<0$ és impossible, i on $s_3\neq0$ les dues condicions són equivalents), que és obert per ser una desigualtat estricta entre funcions contínues a $\mathbb{R}^3$. Alternativament: el domini $\{s_3\neq0\}$ és obert i la funció hi és contínua.
          fuites: ['(?<!si\s)(?<!si\s\$)(\$E\$|\bE\b)\s+és\s+(un\s+)?(conjunt\s+)?obert\b', '\bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?obert\b']
        passos:
          - id: domini
            titol: "Domini de l'expressió"
            objectiu: |
              Determinar on té sentit la condició que defineix $E$ i com és aquest conjunt.
            idea: |
              Un quocient només està definit on el denominador no s'anul·la; el conjunt on un polinomi és diferent de zero es pot descriure amb una desigualtat estricta.
            detall: |
              La condició té sentit a $\Omega=\{(x,y,z): x^3+y^3+z^3\neq0\}=\{|x^3+y^3+z^3|>0\}$, que és obert perquè $|x^3+y^3+z^3|$ és contínua a $\mathbb{R}^3$. Així $E\subseteq\Omega$.
            fuites: []
            teoria: ["T2.18", "T2.20"]
          - id: reescriure
            titol: "Eliminar el denominador"
            objectiu: |
              Descriure $E$ amb una condició que involucri només funcions contínues a tot $\mathbb{R}^3$ (o bé usar la continuïtat al domini).
            idea: |
              Multiplicar la desigualtat pel valor absolut del denominador (positiu on està definit) i comprovar què passa als punts on s'anul·la.
            detall: |
              Si $s_3=x^3+y^3+z^3\neq0$: $|s_1/s_3|<1\iff|s_1|<|s_3|$, amb $s_1=x+y+z$. Si $s_3=0$, el punt no és de $E$ i tampoc compleix $|s_1|<|s_3|=0$. Per tant $E=\{|s_1|<|s_3|\}$.
            fuites: ['\|\s*x\s*\+\s*y\s*\+\s*z\s*\|\s*<\s*\|\s*x\^\{?3\}?', '\|s_\{?1\}?\|\s*<\s*\|s_\{?3\}?\|']
            teoria: []
          - id: concloure
            titol: "Concloure"
            objectiu: |
              Decidir si $E$ és obert de $\mathbb{R}^3$.
            idea: |
              Valor absolut d'un polinomi és continu; desigualtat estricta entre funcions contínues a tot l'espai.
            detall: |
              $|s_1|$ i $|s_3|$ són contínues a $\mathbb{R}^3$ (composició del valor absolut amb polinomis). Pel corol·lari de les desigualtats estrictes, $E=\{|s_3|>|s_1|\}$ és obert. (Alternativament: $g=s_1/s_3$ és contínua a l'obert $\Omega$, $E=g^{-1}((-1,1))=U\cap\Omega$ amb $U$ obert, i per tant obert.)
            fuites: []
            teoria: ["T2.20", "T2.18", "T2.17", "T1.12"]
        errors_comuns:
          - id: oblida_denominador
            descripcio: |
              Aplica el corol·lari al quocient com si fos continu a tot $\mathbb{R}^3$, sense tractar els zeros del denominador.
            pregunta: |
              Està definida l'expressió $\frac{x+y+z}{x^3+y^3+z^3}$ a tot $\mathbb{R}^3$? Per exemple, al punt $(1,-1,0)$?
          - id: multiplica_sense_cura
            descripcio: |
              Multiplica per $x^3+y^3+z^3$ sense valor absolut (o sense considerar el signe) i obté una condició incorrecta.
            pregunta: |
              Si multipliques una desigualtat per un nombre que pot ser negatiu, què li passa? Com ho pots evitar aquí?
          - id: zeros_denominador_tancat
            descripcio: |
              Pensa que, com que cal treure el conjunt tancat $\{s_3=0\}$, el resultat no pot ser obert.
            pregunta: |
              Si a un obert li treus un tancat, quin tipus de conjunt obtens? Pots escriure-ho com una intersecció?
        nota_professor: |
          La reescriptura $E=\{|s_1|<|s_3|\}$ evita haver d'argumentar amb el domini. Totes dues vies són correctes.

  - num: 14
    font: null
    preambul: |
      Anàlogament, raoneu si són tancats els subconjunts de $\mathbb{R}^2$ o $\mathbb{R}^3$ següents:
    indicacio: null
    exercicis:
      - id: "t2-14a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          $A=\{(x,y)\in\mathbb{R}^2\ \mid\ 2x-3y=6,\ x^2+y^3\leqslant10\}$.
        teoria: ["T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $A$ és tancat: és la intersecció de la recta $\{2x-3y=6\}$ i del conjunt $\{x^2+y^3\le10\}$, tots dos tancats per estar definits per igualtats o desigualtats no estrictes entre funcions polinòmiques (contínues a $\mathbb{R}^2$); la intersecció de tancats és tancada.
          fuites: ['(?<!si\s)(?<!si\s\$)(\$A\$|\bA\b)\s+és\s+(un\s+)?(conjunt\s+)?tancat\b', '\bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?tancat\b']
        passos:
          - id: descompondre
            titol: "Escriure $A$ com a intersecció"
            objectiu: |
              Expressar $A$ en termes de conjunts definits per una sola condició.
            idea: |
              Cada condició defineix un conjunt i $A$ n'és la intersecció; una igualtat es pot veure com dues desigualtats no estrictes, o com l'antiimatge d'un punt.
            detall: |
              $A=A_1\cap A_2$ amb $A_1=\{2x-3y=6\}=\{2x-3y\ge6\}\cap\{6\ge 2x-3y\}$ i $A_2=\{10\ge x^2+y^3\}$.
            fuites: []
            teoria: []
          - id: cada_un_tancat
            titol: "Cada condició dona un tancat"
            objectiu: |
              Decidir quin tipus de conjunt és cadascuna de les peces i concloure per a $A$.
            idea: |
              Funcions polinòmiques contínues a tot $\mathbb{R}^2$ i desigualtats no estrictes; propietats de les interseccions de tancats.
            detall: |
              $2x-3y$ i $x^2+y^3$ són polinomis, contínues a $\mathbb{R}^2$. Pel corol·lari de les desigualtats no estrictes, $\{2x-3y\ge6\}$, $\{6\ge2x-3y\}$ i $\{10\ge x^2+y^3\}$ són tancats; la intersecció de tancats és tancada, per tant $A$ és tancat.
            fuites: []
            teoria: ["T2.18", "T1.13"]
        errors_comuns:
          - id: igualtat_no_desigualtat
            descripcio: |
              No sap com tractar la igualtat $2x-3y=6$ amb un resultat enunciat per a desigualtats.
            pregunta: |
              Pots escriure la condició $u=6$ fent servir dues desigualtats? O bé: el conjunt $\{6\}$ és tancat de $\mathbb{R}$?
          - id: necessita_fitat
            descripcio: |
              Confon tancat amb compacte i intenta veure si $A$ és fitat per decidir si és tancat.
            pregunta: |
              La definició de tancat, demana alguna cosa sobre si el conjunt és fitat? Quina és la diferència entre tancat i compacte?
        nota_professor: |
          $A$ és de fet un subconjunt de la recta $y=(2x-6)/3$; no cal estudiar si és fitat (és un tram no fitat de la recta, perquè $y^3$ domina per $y\to-\infty$).

      - id: "t2-14b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          $B=\{(x,y)\in\mathbb{R}^2\ \mid\ 2x^2+3y^2\in\mathbb{N}\}$.
        teoria: ["T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $B$ és tancat: $B=f^{-1}(\mathbb{N})$ amb $f(x,y)=2x^2+3y^2$ contínua a tot $\mathbb{R}^2$, i $\mathbb{N}$ és tancat de $\mathbb{R}$ (el seu complementari és una unió d'intervals oberts). L'antiimatge d'un tancat per una funció contínua a tot $\mathbb{R}^2$ és tancada.
          fuites: ['(?<!si\s)(?<!si\s\$)(\$B\$|\bB\b)\s+és\s+(un\s+)?(conjunt\s+)?tancat\b', '\bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?tancat\b']
        passos:
          - id: antiimatge
            titol: "Escriure $B$ com a antiimatge"
            objectiu: |
              Expressar $B$ en termes d'una funció i d'un subconjunt de $\mathbb{R}$.
            idea: |
              La condició diu que el valor d'una funció pertany a un cert conjunt de nombres reals.
            detall: |
              Amb $f(x,y)=2x^2+3y^2$, polinòmica i per tant contínua a $\mathbb{R}^2$, es té $B=f^{-1}(\mathbb{N})$.
            fuites: ['f\^\{?-1\}?\s*\(\s*\\mathbb\{N\}\s*\)']
            teoria: ["T2.20"]
          - id: n_tancat
            titol: "$\\mathbb{N}$ dins de $\\mathbb{R}$"
            objectiu: |
              Decidir quin tipus de subconjunt de $\mathbb{R}$ és $\mathbb{N}$.
            idea: |
              Mirar el complementari de $\mathbb{N}$ a $\mathbb{R}$ i escriure'l com a unió de conjunts coneguts.
            detall: |
              $\mathbb{R}\setminus\mathbb{N}=(-\infty,1)\cup\bigcup_{n\ge1}(n,n+1)$ (o $(-\infty,0)\cup\bigcup_{n\ge0}(n,n+1)$ si $0\in\mathbb{N}$), unió d'intervals oberts, i per tant obert. Així $\mathbb{N}$ és tancat de $\mathbb{R}$.
            fuites: ['\\bigcup_\{?n\s*(\\ge|\\geq|≥)', 'uni[óo]\s+d''intervals\s+oberts']
            teoria: ["T1.12", "T1.11"]
          - id: concloure
            titol: "Antiimatge d'un tancat"
            objectiu: |
              Concloure si $B$ és tancat de $\mathbb{R}^2$.
            idea: |
              Caracterització de la continuïtat amb antiimatges de tancats, quan el domini és tot l'espai.
            detall: |
              Per la caracterització topològica de la continuïtat, $f^{-1}(\mathbb{N})=F\cap\mathbb{R}^2=F$ amb $F$ tancat de $\mathbb{R}^2$. Per tant $B$ és tancat.
            fuites: []
            teoria: ["T2.17"]
        errors_comuns:
          - id: unio_infinita
            descripcio: |
              Veu $B$ com la unió de les el·lipses $\{2x^2+3y^2=n\}$ i conclou que és tancat perquè "la unió de tancats és tancada", o bé que no ho és perquè la unió és infinita.
            pregunta: |
              La propietat de la unió de tancats, per a quantes unions val? Hi ha una manera de tractar $B$ de cop, sense passar per la unió?
          - id: n_no_tancat
            descripcio: |
              Pensa que $\mathbb{N}$ no és tancat perquè no és un interval o perquè no és fitat.
            pregunta: |
              Quin és el complementari de $\mathbb{N}$ a $\mathbb{R}$? Quin tipus de conjunt és?
          - id: confon_imatge_antiimatge
            descripcio: |
              Usa que la imatge (en lloc de l'antiimatge) d'un tancat per una funció contínua és tancada.
            pregunta: |
              La caracterització de la continuïtat parla d'imatges o d'antiimatges de tancats?
        nota_professor: |
          Les el·lipses $\{f=n\}$ s'allunyen (radis $\sim\sqrt n$), per això la unió infinita és tancada; però l'argument net és l'antiimatge. Contrastar amb 14(c).

      - id: "t2-14c"
        apartat: "c"
        tipus: teoric
        enunciat: |
          $C=\{(x,y)\in\mathbb{R}^2\ \mid\ \dfrac{1}{x^2+y^2}\in\mathbb{N}\}$.
        teoria: ["T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $C$ no és tancat. $C=\bigcup_{n\ge1}\{x^2+y^2=1/n\}$ (circumferències de radi $1/\sqrt n$). La successió $(1/\sqrt n,0)\in C$ convergeix a $(0,0)\notin C$, de manera que $C$ no conté tots els límits de les seves successions convergents.
          fuites: ['(\$C\$|\bC\b)\s+no\s+és\s+(un\s+)?(conjunt\s+)?tancat\b', '\bno,?\s+no\s+és\s+(un\s+)?(conjunt\s+)?tancat\b']
        passos:
          - id: descripcio
            titol: "Descriure $C$"
            objectiu: |
              Determinar on té sentit la condició i descriure geomètricament els punts de $C$.
            idea: |
              El quocient no està definit a l'origen; per a cada natural $n$, la condició $\frac{1}{x^2+y^2}=n$ és una corba coneguda.
            detall: |
              La condició té sentit a $\mathbb{R}^2\setminus\{(0,0)\}$ i $\frac{1}{x^2+y^2}=n\iff x^2+y^2=\frac1n$. Per tant $C$ és la unió de les circumferències centrades a l'origen de radi $1/\sqrt n$, $n\ge1$, i $(0,0)\notin C$.
            fuites: ['x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*=\s*\\?(d?frac\{1\}\{n\}|1\s*/\s*n)', 'radi\s*\$?\s*(1\s*/\s*\\sqrt|\\frac\{1\}\{\\sqrt)']
            teoria: []
          - id: successio
            titol: "Un punt d'acumulació fora de $C$"
            objectiu: |
              Comprovar si $C$ conté els límits de les successions convergents formades per punts seus.
            idea: |
              Caracterització seqüencial dels tancats: buscar una successió de punts de $C$ que convergeixi a un punt que no sigui de $C$.
            detall: |
              $p_n=(1/\sqrt n,0)\in C$ i $p_n\to(0,0)$, però $(0,0)\notin C$. Per la caracterització seqüencial, $C$ no és tancat.
            fuites: ['\(\s*(1\s*/\s*\\sqrt\{?n\}?|\\frac\{1\}\{\\sqrt\{?n\}?\})\s*,\s*0\s*\)', '\(0\s*,\s*0\)\s*\\notin']
            teoria: ["T1.19"]
        errors_comuns:
          - id: copia_14b
            descripcio: |
              Raona com a l'apartat anterior: "$C$ és l'antiimatge de $\mathbb{N}$, tancat, per una funció contínua", sense mirar el domini.
            pregunta: |
              On està definida $g(x,y)=\frac{1}{x^2+y^2}$? Què diu exactament la teoria de l'antiimatge d'un tancat quan el domini no és tot $\mathbb{R}^2$?
          - id: unio_de_tancats
            descripcio: |
              Diu que és tancat perquè és unió de circumferències (tancades).
            pregunta: |
              La unió d'una quantitat infinita de tancats és sempre tancada? Què passa amb els radis d'aquestes circumferències quan $n$ creix?
          - id: origen_dins
            descripcio: |
              Considera que l'origen pertany a $C$.
            pregunta: |
              Es pot avaluar la condició que defineix $C$ al punt $(0,0)$?
        nota_professor: |
          Comparar amb 14(b): mateix tipus d'expressió, però aquí el domini $\mathbb{R}^2\setminus\{0\}$ no és tancat i els conjunts de nivell s'acumulen a l'origen. $\overline C=C\cup\{(0,0)\}$.

      - id: "t2-14d"
        apartat: "d"
        tipus: teoric
        enunciat: |
          $D=\{(x,y,z)\in\mathbb{R}^3\ \mid\ x+2y+3z=1,\ x^2y^2z\geqslant7\}$.
        teoria: ["T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $D$ és tancat: és la intersecció del pla $\{x+2y+3z=1\}$ i del conjunt $\{x^2y^2z\ge7\}$, tots dos tancats per estar definits per una igualtat o una desigualtat no estricta entre funcions polinòmiques (contínues a $\mathbb{R}^3$); la intersecció de tancats és tancada.
          fuites: ['(?<!si\s)(?<!si\s\$)(\$D\$|\bD\b)\s+és\s+(un\s+)?(conjunt\s+)?tancat\b', '\bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?tancat\b']
        passos:
          - id: descompondre
            titol: "Escriure $D$ com a intersecció"
            objectiu: |
              Expressar $D$ en termes de conjunts definits per una sola condició.
            idea: |
              Cada condició defineix un conjunt; la igualtat es pot veure com dues desigualtats no estrictes o com l'antiimatge d'un punt.
            detall: |
              $D=D_1\cap D_2$ amb $D_1=\{x+2y+3z=1\}=\{x+2y+3z\ge1\}\cap\{1\ge x+2y+3z\}$ i $D_2=\{x^2y^2z\ge7\}$.
            fuites: []
            teoria: []
          - id: cada_un_tancat
            titol: "Cada condició dona un tancat"
            objectiu: |
              Decidir quin tipus de conjunt és cada peça i concloure per a $D$.
            idea: |
              Polinomis, contínues a tot $\mathbb{R}^3$, i desigualtats no estrictes; propietats de les interseccions de tancats.
            detall: |
              $x+2y+3z$ i $x^2y^2z$ són polinomis, contínues a $\mathbb{R}^3$. Pel corol·lari de les desigualtats no estrictes, els tres conjunts $\{x+2y+3z\ge1\}$, $\{1\ge x+2y+3z\}$ i $\{x^2y^2z\ge7\}$ són tancats, i la seva intersecció $D$ també.
            fuites: []
            teoria: ["T2.18", "T1.13"]
        errors_comuns:
          - id: igualtat_no_desigualtat
            descripcio: |
              No sap com tractar la igualtat amb un resultat enunciat per a desigualtats.
            pregunta: |
              Pots escriure la condició $u=1$ fent servir dues desigualtats no estrictes?
          - id: necessita_fitat
            descripcio: |
              Confon tancat amb compacte i dedica l'esforç a veure si $D$ és fitat.
            pregunta: |
              La definició de tancat, demana que el conjunt sigui fitat?
        nota_professor: |
          Mateixa estructura que 14(a). $D$ no és fitat (per exemple, sobre el pla es pot fer $|x|,|y|$ grans amb $z>0$ adequat), però no es demana.

  - num: 15
    font: null
    preambul: |
      Justifiqueu adequadament si els conjunts següents són compactes:
    indicacio: null
    exercicis:
      - id: "t2-15a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          $A=\{(x,y,z,t)\in\mathbb{R}^4\ \mid\ 2x^2+y^2-z^2=2,\ y^2+2z^2\leqslant10,\ |z|\geqslant|t|\ \}$.
        teoria: ["T1.24"]
        teoria_reservada: []
        resultat:
          valor: |
            $A$ és compacte. És tancat (intersecció de conjunts definits per una igualtat i desigualtats no estrictes entre funcions contínues a $\mathbb{R}^4$) i fitat: de $y^2+2z^2\le10$ surt $y^2\le10$ i $z^2\le5$; llavors $t^2\le z^2\le5$ i $x^2=1+\frac{z^2-y^2}{2}\le\frac72$. Pel teorema de Heine-Borel, $A$ és compacte.
          fuites: ['(?<!si\s)(?<!si\s\$)(\$A\$|\bA\b)\s+és\s+(un\s+)?(conjunt\s+)?compacte\b', '\bsí,?\s+(que\s+)?és\s+(un\s+)?(conjunt\s+)?compacte\b']
        passos:
          - id: criteri
            titol: "Triar el criteri"
            objectiu: |
              Decidir quines propietats de $A$ cal estudiar per saber si és compacte.
            idea: |
              A $\mathbb{R}^n$ hi ha una caracterització dels compactes en termes de dues propietats més fàcils de comprovar que la definició amb recobriments.
            detall: |
              Pel teorema de Heine-Borel, un subconjunt de $\mathbb{R}^4$ és compacte si i només si és tancat i fitat.
            fuites: []
            teoria: ["T1.34"]
          - id: tancat
            titol: "$A$ és tancat"
            objectiu: |
              Determinar si $A$ és tancat.
            idea: |
              Cada condició és una igualtat o desigualtat no estricta entre funcions contínues a tot $\mathbb{R}^4$.
            detall: |
              $2x^2+y^2-z^2$, $y^2+2z^2$, $|z|$ i $|t|$ són contínues a $\mathbb{R}^4$. Els conjunts $\{2x^2+y^2-z^2\ge2\}$, $\{2\ge2x^2+y^2-z^2\}$, $\{10\ge y^2+2z^2\}$ i $\{|z|\ge|t|\}$ són tancats pel corol·lari de les desigualtats, i $A$ n'és la intersecció, per tant tancat.
            fuites: []
            teoria: ["T2.18", "T1.13", "T2.20"]
          - id: fitat
            titol: "$A$ és fitat"
            objectiu: |
              Trobar una fita per a cadascuna de les quatre coordenades dels punts de $A$.
            idea: |
              Començar per la desigualtat que fita directament algunes coordenades, i usar-ne el resultat a les altres condicions per fitar les restants.
            detall: |
              De $y^2+2z^2\le10$: $y^2\le10$ i $z^2\le5$. De $|t|\le|z|$: $t^2\le5$. De la igualtat, $2x^2=2-y^2+z^2\le2+5=7$, és a dir $x^2\le\frac72$. Per tant $\|(x,y,z,t)\|^2\le\frac72+10+5+5$, i $A$ està contingut en una bola centrada a l'origen: és fitat.
            fuites: ['x\^\{?2\}?\s*(\\le|\\leq|≤|\\leqslant)\s*\\?(d?frac\{7\}\{2\}|7\s*/\s*2)', '2x\^\{?2\}?\s*=\s*2\s*-\s*y\^\{?2\}?\s*\+\s*z\^\{?2\}?']
            teoria: ["T1.33"]
          - id: concloure
            titol: "Concloure"
            objectiu: |
              Combinar les propietats obtingudes per respondre la pregunta.
            idea: |
              Aplicar el criteri triat al primer pas.
            detall: |
              $A$ és tancat i fitat a $\mathbb{R}^4$, i per Heine-Borel és compacte.
            fuites: []
            teoria: ["T1.34"]
        errors_comuns:
          - id: x_no_fitada
            descripcio: |
              Pensa que $x$ no està fitada perquè cap desigualtat la conté directament (o perquè la igualtat defineix un hiperboloide, no fitat).
            pregunta: |
              Si ja tens fites per a $y$ i $z$, què et diu la igualtat $2x^2+y^2-z^2=2$ sobre $x^2$?
          - id: t_oblidada
            descripcio: |
              Fita $x,y,z$ però s'oblida de la coordenada $t$.
            pregunta: |
              $A$ viu a $\mathbb{R}^4$. Has fitat totes quatre coordenades?
          - id: nomes_tancat
            descripcio: |
              Conclou compacitat només a partir de ser tancat (o només de ser fitat).
            pregunta: |
              Què diu exactament el teorema de Heine-Borel? En coneixes un tancat no compacte?
        nota_professor: |
          La condició sobre $t$ és la que fa falta per fitar $t$; sense ella el conjunt seria un cilindre no fitat.

      - id: "t2-15b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          $B=\{(x,y,z)\in\mathbb{R}^3\ \mid\ x^3=y^2,\ z=x\}$.
        teoria: ["T1.24"]
        teoria_reservada: []
        resultat:
          valor: |
            $B$ no és compacte. És tancat, però no és fitat: per a tot $s\in\mathbb{R}$, $(s^2,s^3,s^2)\in B$, i $\|(s^2,s^3,s^2)\|\to\infty$ quan $s\to\infty$. Per Heine-Borel no és compacte.
          fuites: ['(\$B\$|\bB\b)\s+no\s+és\s+(un\s+)?(conjunt\s+)?compacte\b', '\bno,?\s+no\s+és\s+(un\s+)?(conjunt\s+)?compacte\b']
        passos:
          - id: tancat
            titol: "$B$ és tancat"
            objectiu: |
              Determinar si $B$ és tancat.
            idea: |
              Igualtats entre funcions polinòmiques: cadascuna defineix un tancat.
            detall: |
              $B=\{x^3-y^2=0\}\cap\{z-x=0\}$; cada igualtat és la intersecció de dues desigualtats no estrictes entre polinomis (contínues a $\mathbb{R}^3$), per tant $B$ és tancat.
            fuites: []
            teoria: ["T2.18", "T1.13"]
          - id: fitat
            titol: "Estudiar si $B$ és fitat"
            objectiu: |
              Esbrinar si existeix alguna bola que contingui tot $B$.
            idea: |
              Parametritzar la corba $x^3=y^2$ (per exemple, buscant $x$ i $y$ com a potències d'un paràmetre) i veure què passa quan el paràmetre creix.
            detall: |
              Per a $s\in\mathbb{R}$, $(x,y,z)=(s^2,s^3,s^2)$ compleix $x^3=s^6=y^2$ i $z=x$, així que és de $B$. La seva norma és $\ge s^2\to\infty$, per tant $B$ no està contingut en cap bola: no és fitat.
            fuites: ['\(\s*s\^\{?2\}?\s*,\s*s\^\{?3\}?', '\(\s*t\^\{?2\}?\s*,\s*t\^\{?3\}?', '\(\s*n\^\{?2\}?\s*,\s*n\^\{?3\}?']
            teoria: ["T1.33"]
          - id: concloure
            titol: "Concloure"
            objectiu: |
              Respondre si $B$ és compacte.
            idea: |
              Caracterització dels compactes de $\mathbb{R}^n$.
            detall: |
              Per Heine-Borel, un compacte de $\mathbb{R}^3$ ha de ser fitat; $B$ no ho és, així que no és compacte.
            fuites: []
            teoria: ["T1.34"]
        errors_comuns:
          - id: tancat_implica_compacte
            descripcio: |
              Conclou que és compacte perquè és tancat.
            pregunta: |
              Quines dues condicions demana el teorema de Heine-Borel? Has comprovat totes dues?
          - id: creu_fitat
            descripcio: |
              Creu que la corba és fitada perquè $x^3=y^2$ "lliga" les variables.
            pregunta: |
              Pots trobar punts de $B$ amb $x$ tan gran com vulguis? Quin $y$ els correspondria?
        nota_professor: |
          $B$ és una corba (amb una cúspide a l'origen) dins del pla $z=x$. També es pot veure amb la successió $(n^2,n^3,n^2)$, que no té cap parcial convergent.

  - num: 16
    font: null
    preambul: |
      Per a $A,B\subset\mathbb{R}^n$, recordem que $d(A,B)=\inf\{d(a,b)\mid a\in A,\ b\in B\}$, on $d(a,b)$ és la distància euclídia a $\mathbb{R}^n$ (vegeu l'exercici 5 del Tema 1). Demostreu:
    indicacio: null
    exercicis:
      - id: "t2-16a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          $A,B$ compactes $\Rightarrow\exists a_0\in A,\,b_0\in B$ tals que $d(A,B)=d(a_0,b_0)$,
        teoria: ["T1.5", "T1.24"]
        teoria_reservada: []
        resultat:
          valor: |
            Si $A,B$ són compactes (no buits), existeixen $a_0\in A$, $b_0\in B$ amb $d(A,B)=d(a_0,b_0)$. Prova: per la definició d'ínfim hi ha $a_k\in A$, $b_k\in B$ amb $d(a_k,b_k)\to d(A,B)$; per compacitat seqüencial, passant a parcials, $a_{k_j}\to a_0\in A$ i $b_{k_j}\to b_0\in B$; com que $|d(a,b)-d(a',b')|\le d(a,a')+d(b,b')$, $d(a_{k_j},b_{k_j})\to d(a_0,b_0)$, i per unicitat del límit $d(a_0,b_0)=d(A,B)$.
          fuites: []
        passos:
          - id: successio_minimitzant
            titol: "Successió minimitzant"
            objectiu: |
              Traduir la definició de $d(A,B)$ com a ínfim en l'existència de parelles de punts de $A$ i $B$ adequades.
            idea: |
              Propietat de l'ínfim: per a cada $\varepsilon>0$, hi ha elements del conjunt a distància menor que $\varepsilon$ de l'ínfim. Prendre $\varepsilon=1/k$.
            detall: |
              Sigui $\delta=d(A,B)$. Per a cada $k\ge1$, $\delta+1/k$ no és fita inferior de $\{d(a,b)\}$, de manera que existeixen $a_k\in A$, $b_k\in B$ amb $\delta\le d(a_k,b_k)<\delta+1/k$. Així $d(a_k,b_k)\to\delta$.
            fuites: ['d\(a_k\s*,\s*b_k\)\s*<\s*\\delta\s*\+']
            teoria: []
          - id: parcials
            titol: "Extreure parcials convergents"
            objectiu: |
              Obtenir punts candidats $a_0\in A$ i $b_0\in B$ a partir de les successions anteriors.
            idea: |
              Compacte equival a seqüencialment compacte. Cal extreure parcials en dues etapes, perquè els índexs de les dues successions coincideixin.
            detall: |
              Per Bolzano-Weierstrass, $A$ és seqüencialment compacte: hi ha una parcial $a_{k_j}\to a_0\in A$. La successió $(b_{k_j})_j\subseteq B$ té, per la mateixa raó, una parcial $b_{k_{j_l}}\to b_0\in B$; la corresponent $a_{k_{j_l}}$ continua convergint a $a_0$. Reanomenant, tenim una parcial comuna amb $a_{k_j}\to a_0$, $b_{k_j}\to b_0$.
            fuites: []
            teoria: ["T1.26", "T1.24"]
          - id: pas_al_limit
            titol: "Passar al límit"
            objectiu: |
              Comprovar que $d(a_0,b_0)=d(A,B)$.
            idea: |
              Veure que la distància és contínua en les dues variables usant la desigualtat triangular, i aplicar la unicitat del límit.
            detall: |
              Per la desigualtat triangular, $|d(a,b)-d(a',b')|\le d(a,a')+d(b,b')$. Per tant $|d(a_{k_j},b_{k_j})-d(a_0,b_0)|\le d(a_{k_j},a_0)+d(b_{k_j},b_0)\to0$, i $d(a_{k_j},b_{k_j})\to d(a_0,b_0)$. Com que també tendeix a $\delta$ (és parcial d'una successió que hi tendeix), $d(a_0,b_0)=\delta=d(A,B)$.
            fuites: ['\|d\(a\s*,\s*b\)\s*-\s*d\(a''\s*,\s*b''\)\|']
            teoria: ["T1.5"]
        errors_comuns:
          - id: parcials_independents
            descripcio: |
              Extreu una parcial convergent de $(a_k)$ i una altra, amb índexs diferents, de $(b_k)$, i les combina com si fossin la mateixa subsuccessió.
            pregunta: |
              Si $a_{k_j}$ i $b_{m_j}$ són parcials amb índexs diferents, la parella $(a_{k_j},b_{m_j})$ prové de les parelles $(a_k,b_k)$ que tenies? Com t'ho pots arreglar perquè sí?
          - id: continuitat_no_justificada
            descripcio: |
              Afirma que $d(a_{k_j},b_{k_j})\to d(a_0,b_0)$ sense justificar la continuïtat de la distància en les dues variables.
            pregunta: |
              Per què el límit de $d(a_{k_j},b_{k_j})$ és $d(a_0,b_0)$? Pots fitar la diferència entre les dues distàncies?
          - id: inf_es_min
            descripcio: |
              Suposa d'entrada que l'ínfim s'assoleix (confon ínfim amb mínim).
            pregunta: |
              Per definició, $d(A,B)$ és un ínfim. Està garantit que hi hagi una parella que l'assoleixi? Què et dona la definició d'ínfim?
        nota_professor: |
          Cal suposar $A,B$ no buits (si no, l'ínfim no té sentit). Alternativa: $A\times B\subseteq\mathbb{R}^{2n}$ és tancat i fitat, per tant compacte (Heine-Borel), i $(a,b)\mapsto d(a,b)$ és contínua; per Weierstrass (T2.23) assoleix el mínim.

      - id: "t2-16b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          $A$ compacte $\Rightarrow\exists a_0\in A$ tal que $d(A,B)=d(\{a_0\},B)$,
        teoria: ["T1.5", "T1.24"]
        teoria_reservada: []
        resultat:
          valor: |
            Si $A$ és compacte (i $A,B$ no buits), existeix $a_0\in A$ amb $d(A,B)=d(\{a_0\},B)$. Prova: $d(A,B)=\inf_{a\in A}d(a,B)$; la funció $g(x)=d(x,B)$ compleix $|g(x)-g(y)|\le d(x,y)$, per tant és contínua; pel teorema de Weierstrass $g$ assoleix el mínim sobre el compacte $A$ en un $a_0$, i $d(A,B)=g(a_0)=d(\{a_0\},B)$.
          fuites: []
        passos:
          - id: inf_iterat
            titol: "Reescriure $d(A,B)$"
            objectiu: |
              Relacionar $d(A,B)$ amb les distàncies $d(a,B)=d(\{a\},B)$ dels punts de $A$ a $B$.
            idea: |
              Un ínfim sobre parelles $(a,b)$ es pot fer en dues etapes: primer sobre $b$ amb $a$ fix, després sobre $a$. Demostrar-ho amb dues desigualtats.
            detall: |
              Volem $d(A,B)=\inf_{a\in A}d(a,B)$. ($\ge$): per a tot $a,b$, $d(a,b)\ge d(a,B)\ge\inf_{a'\in A}d(a',B)$, i passant a l'ínfim sobre $(a,b)$. ($\le$): per a $a\in A$ fix i tot $b\in B$, $d(A,B)\le d(a,b)$, i per tant $d(A,B)\le d(a,B)$; així $d(A,B)$ és fita inferior de $\{d(a,B)\}$ i $d(A,B)\le\inf_a d(a,B)$.
            fuites: ['d\(A\s*,\s*B\)\s*=\s*\\inf_\{?a\s*\\in\s*A\}?\s*d\(a\s*,\s*B\)']
            teoria: []
          - id: continuitat
            titol: "Continuïtat de $x\\mapsto d(x,B)$"
            objectiu: |
              Estudiar la regularitat de la funció $g(x)=d(x,B)$ a $\mathbb{R}^n$.
            idea: |
              És l'exercici 5(b) del Tema 1: la desigualtat triangular dona una fita de $|g(x)-g(y)|$ en termes de $d(x,y)$, i d'aquí la continuïtat.
            detall: |
              Per a $b\in B$: $d(x,B)\le d(x,b)\le d(x,y)+d(y,b)$; prenent l'ínfim en $b$, $g(x)\le d(x,y)+g(y)$. Per simetria, $|g(x)-g(y)|\le d(x,y)$. Així, donat $\varepsilon>0$, prenent $\delta=\varepsilon$, si $d(x,y)<\delta$ aleshores $|g(x)-g(y)|<\varepsilon$: $g$ és (uniformement) contínua a $\mathbb{R}^n$.
            fuites: ['\|g\(x\)\s*-\s*g\(y\)\|\s*(\\le|\\leq|≤|\\leqslant)\s*d\(x\s*,\s*y\)', '\|d\(x\s*,\s*B\)\s*-\s*d\(y\s*,\s*B\)\|']
            teoria: ["T1.5", "T2.14"]
          - id: weierstrass
            titol: "Mínim sobre el compacte"
            objectiu: |
              Trobar $a_0\in A$ que compleixi la igualtat demanada.
            idea: |
              Una funció real contínua sobre un compacte assoleix el seu mínim.
            detall: |
              Pel teorema de Weierstrass aplicat a $g$ contínua i $A$ compacte, existeix $a_0\in A$ amb $g(a_0)=\min_{a\in A}g(a)$. Pel primer pas, $d(A,B)=\inf_{a\in A}g(a)=g(a_0)=d(\{a_0\},B)$.
            fuites: []
            teoria: ["T2.23"]
        errors_comuns:
          - id: usa_16a
            descripcio: |
              Intenta aplicar l'apartat (a), que demana que $B$ també sigui compacte.
            pregunta: |
              Quines hipòtesis té l'apartat (a)? Les compleix $B$ aquí?
          - id: continuitat_sense_prova
            descripcio: |
              Afirma que $x\mapsto d(x,B)$ és contínua sense justificar-ho, o ho justifica com si $B$ fos un punt.
            pregunta: |
              $d(x,B)$ és un ínfim, no una distància entre dos punts. Pots comparar $d(x,B)$ i $d(y,B)$ fent servir la desigualtat triangular?
          - id: ordre_infims
            descripcio: |
              Dona per fet que $d(A,B)=\inf_a d(a,B)$ sense justificar-ho, o en justifica només una desigualtat.
            pregunta: |
              Has comprovat les dues desigualtats entre $d(A,B)$ i $\inf_{a\in A}d(\{a\},B)$?
        nota_professor: |
          $B$ arbitrari (no buit): no cal ni que sigui tancat. $g$ és 1-lipschitziana en el sentit habitual ($\le$); la definició de Lipschitz de les notes (T2.26) està escrita amb desigualtat estricta, que falla per a $x=y$, i per això el pas cita directament la definició de continuïtat (T2.14) amb $\delta=\varepsilon$. La desigualtat $|g(x)-g(y)|\le d(x,y)$ és l'exercici 5(b) del Tema 1.

      - id: "t2-16c"
        apartat: "c"
        tipus: teoric
        enunciat: |
          És cert l'apartat (a) si $A$ i $B$ són tancats però no fitats? I si $A=\{a\}$ i $B$ és tancat?
        teoria: ["T1.11", "T1.33"]
        teoria_reservada: []
        resultat:
          valor: |
            (1) No. Contraexemple a $\mathbb{R}^2$: $A=\{y=0\}$ i $B=\{xy=1\}$, tancats i no fitats; $d((t,0),(t,1/t))=1/t\to0$, per tant $d(A,B)=0$, però $A\cap B=\varnothing$ i $d(a,b)>0$ per a tota parella: la distància no s'assoleix. (A $\mathbb{R}$: $A=\mathbb{N}$, $B=\{n+1/n: n\ge2\}$.)
            (2) Sí. Si $b_1\in B$ i $R=d(a,b_1)$, el conjunt $K=B\cap\overline{B}(a,R)$ és tancat, fitat i no buit, per tant compacte, i $d(a,B)=d(a,K)$; per l'apartat (a) amb $\{a\}$ i $K$ hi ha $b_0\in K\subseteq B$ amb $d(a,b_0)=d(\{a\},B)$.
          fuites: ['\(a\)\s+(no\s+és\s+cert|és\s+fals|falla)', '(no\s+és\s+cert|és\s+fals|falla)[^.]{0,40}tancats\s+no\s+fitats']
        passos:
          - id: contraexemple
            titol: "Tancats no fitats: buscar un contraexemple"
            objectiu: |
              Decidir si l'apartat (a) continua sent cert per a tancats no fitats; si no, construir un contraexemple.
            idea: |
              Buscar dos tancats disjunts que s'acostin indefinidament "a l'infinit" (un d'ells asimptòtic a l'altre), de manera que l'ínfim de les distàncies sigui $0$.
            detall: |
              A $\mathbb{R}^2$, $A=\{(x,0)\}$ (eix $x$) i $B=\{(x,y): xy=1\}$ són tancats (igualtats entre polinomis) i no fitats. Per a $t>0$, $d((t,0),(t,1/t))=1/t\to0$, així $d(A,B)=0$. Però $A\cap B=\varnothing$ (a $B$, $y\neq0$), i $d(a,b)=0\iff a=b$; per tant cap parella $(a_0,b_0)$ dona $d(a_0,b_0)=0$. L'apartat (a) és fals en aquest cas.
            fuites: ['xy\s*=\s*1', 'y\s*=\s*(1\s*/\s*x|\\frac\{1\}\{x\})', '\(\s*t\s*,\s*(1\s*/\s*t|\\frac\{1\}\{t\})\s*\)']
            teoria: ["T2.18", "T1.5"]
          - id: reduir_compacte
            titol: "$A=\\{a\\}$, $B$ tancat: reduir a un compacte"
            objectiu: |
              Per a la segona pregunta, substituir $B$ per un subconjunt compacte de $B$ que tingui la mateixa distància a $a$.
            idea: |
              Els punts de $B$ molt lluny de $a$ no influeixen en l'ínfim: n'hi ha prou amb els que són dins d'una bola tancada centrada en $a$ que contingui algun punt de $B$.
            detall: |
              Sigui $b_1\in B$ i $R=d(a,b_1)$. Posem $K=B\cap\overline{B}(a,R)$: és tancat (intersecció de tancats), fitat i conté $b_1$, per tant és un compacte no buit (Heine-Borel). Si $b\in B\setminus K$, $d(a,b)>R=d(a,b_1)\ge d(a,K)$; i si $b\in K$, $d(a,b)\ge d(a,K)$. Així $d(a,B)=d(a,K)$.
            fuites: ['B\s*\\cap\s*\\overline\{?B\}?\s*\(\s*a']
            teoria: ["T1.13", "T1.34"]
          - id: concloure
            titol: "Aplicar l'apartat (a)"
            objectiu: |
              Concloure la segona pregunta.
            idea: |
              Un conjunt amb un sol punt és compacte; aplicar el resultat ja demostrat per a dos compactes.
            detall: |
              $\{a\}$ i $K$ són compactes; per l'apartat (a) existeix $b_0\in K\subseteq B$ amb $d(a,b_0)=d(\{a\},K)=d(\{a\},B)$. Per tant, en aquest cas sí que és cert.
            fuites: []
            teoria: ["T1.24"]
        errors_comuns:
          - id: contraexemple_que_toca
            descripcio: |
              Proposa tancats no fitats que es tallen o que estan a distància positiva assolida (per exemple, dues rectes paral·leles), que no són contraexemple.
            pregunta: |
              En el teu exemple, la distància entre els dos conjunts s'assoleix o no? Què hauria de passar perquè no s'assolís?
          - id: no_tancat
            descripcio: |
              Fa servir un conjunt no tancat (per exemple, una bola oberta i un punt de la seva vora), que no respon la pregunta.
            pregunta: |
              Els conjunts del teu exemple compleixen totes les hipòtesis de la pregunta?
          - id: reduccio_sense_cura
            descripcio: |
              A la segona pregunta, aplica Weierstrass sobre $B$ directament, que no és compacte.
            pregunta: |
              La funció $b\mapsto d(a,b)$ és contínua, però $B$ no és compacte. Pots canviar $B$ per un conjunt més petit sense canviar l'ínfim?
        nota_professor: |
          El contraexemple funciona en qualsevol $\mathbb{R}^n$ (a $\mathbb{R}$, $A=\mathbb{N}$ i $B=\{n+1/n\}_{n\ge2}$, tots dos tancats perquè no tenen punts d'acumulació). La segona part també es pot fer amb Weierstrass sobre $K$, o amb l'apartat (b) aplicat al compacte $K$ i al conjunt $\{a\}$.

      - id: "t2-16d"
        apartat: "d"
        tipus: teoric
        enunciat: |
          $\overline{A}=\{x\in\mathbb{R}^n\mid d(x,A)=0\}$.
        teoria: ["T1.16"]
        teoria_reservada: []
        resultat:
          valor: |
            Per a $A\neq\varnothing$: $x\in\overline{A}\iff\forall r>0,\ B_r(x)\cap A\neq\varnothing\iff\forall r>0\ \exists a\in A$ amb $d(x,a)<r\iff\inf_{a\in A}d(x,a)=0$ (perquè $d(x,a)\ge0$ i, per la caracterització de l'ínfim, l'ínfim és $0$ si i només si cap $r>0$ és fita inferior). Per tant $\overline{A}=\{x: d(x,A)=0\}$.
          fuites: []
        passos:
          - id: inclusio_1
            titol: "$\\overline{A}\\subseteq\\{d(x,A)=0\\}$"
            objectiu: |
              Demostrar que tot punt adherent a $A$ és a distància $0$ de $A$.
            idea: |
              Usar la definició de clausura amb boles (o amb successions) i que l'ínfim és menor o igual que qualsevol element del conjunt.
            detall: |
              Si $x\in\overline{A}$, per a tot $r>0$ hi ha $a\in B_r(x)\cap A$, i llavors $0\le d(x,A)\le d(x,a)<r$. Com que això val per a tot $r>0$, $d(x,A)=0$.
            fuites: ['(\\le|\\leq|≤|\\leqslant)\s*d\(x\s*,\s*a\)\s*<\s*r']
            teoria: ["T1.16"]
          - id: inclusio_2
            titol: "$\\{d(x,A)=0\\}\\subseteq\\overline{A}$"
            objectiu: |
              Demostrar que si $d(x,A)=0$ aleshores $x$ és adherent a $A$.
            idea: |
              Si l'ínfim és $0$, cap nombre positiu és fita inferior del conjunt de distàncies; traduir-ho en termes de boles centrades en $x$.
            detall: |
              Si $d(x,A)=0$ i $r>0$, aleshores $r$ no és fita inferior de $\{d(x,a): a\in A\}$, així que existeix $a\in A$ amb $d(x,a)<r$, és a dir $a\in B_r(x)\cap A\neq\varnothing$. Com que val per a tot $r>0$, $x\in\overline{A}$.
            fuites: []
            teoria: ["T1.16", "T1.11"]
        errors_comuns:
          - id: inf_zero_vol_dir_dins
            descripcio: |
              Creu que $d(x,A)=0$ implica $x\in A$ (confon ínfim amb mínim).
            pregunta: |
              Si $A=(0,1)\subset\mathbb{R}$, quant val $d(0,A)$? És $0\in A$?
          - id: una_sola_inclusio
            descripcio: |
              Demostra només una de les dues inclusions.
            pregunta: |
              Per demostrar una igualtat de conjunts, quantes inclusions cal veure? Les has fet totes dues?
          - id: no_usa_def_infim
            descripcio: |
              Al segon sentit, no justifica l'existència d'un $a\in A$ amb $d(x,a)<r$.
            pregunta: |
              Què vol dir exactament que l'ínfim d'un conjunt de nombres no negatius sigui $0$? Què pots dir d'un nombre $r>0$ respecte d'aquest conjunt?
        nota_professor: |
          Cal $A\neq\varnothing$ (si $A=\varnothing$, $d(x,\varnothing)=\inf\varnothing=+\infty$ i $\overline{\varnothing}=\varnothing$, coherent). Alternativa amb successions (T1.19(ii)): $x\in\overline{A}$ si i només si hi ha $a_k\in A$ amb $a_k\to x$, és a dir $d(x,a_k)\to0$.
