    passos:
    - id: hipotesis
      titol: Hipòtesis del TFI
      objectiu: |
        Comprovar si $G$ compleix les hipòtesis del teorema de la funció inversa en els punts del domini.
      idea: |
        Calcular la jacobiana i el seu determinant i veure on s'anul·la.
      detall: |
        $JG=\begin{pmatrix}2x&-2y\\ y&x\end{pmatrix}$, $\det JG=2x^2+2y^2$, que només s'anul·la a $(0,0)$, punt exclòs del domini (obert). $G$ és polinòmica, per tant $\mathcal{C}^\infty$.
      fuites:
      - 2\s*x\^\{?2\}?\s*\+\s*2\s*y\^\{?2\}?
      - 2\s*\(x\^\{?2\}?\s*\+\s*y\^\{?2\}?\)
      teoria:
      - T4.5
      - T3.31
    - id: injectivitat
      titol: Injectivitat
      objectiu: |
        Decidir si $G$ és injectiva en el seu domini.
      idea: |
        Buscar simetries de l'expressió de $G$: hi ha punts diferents amb la mateixa imatge?
      detall: |
        $G(-x,-y)=((-x)^2-(-y)^2,(-x)(-y))=G(x,y)$ i $(-x,-y)\neq(x,y)$ si $(x,y)\neq(0,0)$. No és injectiva: no hi ha $G^{-1}$ global (només inverses locals pel TFI).
      fuites:
      - G\s*\(\s*-\s*x,\s*-\s*y\)
      teoria: []
    - id: imatge
      titol: Imatge
      objectiu: |
        Determinar $G(\mathbb{R}^2\setminus\{(0,0)\})$.
      idea: |
        Donat $(u,v)$, resoldre $x^2-y^2=u$, $xy=v$. Pot ajudar escriure $z=x+iy$ i observar que $z^2=(x^2-y^2)+2ixy$, o bé usar polars.
      detall: |
        $G(x,y)=(0,0)$ obliga $xy=0$ i $x^2=y^2$, és a dir $x=y=0$: l'origen no és a la imatge. Recíprocament, donat $(u,v)\neq(0,0)$, el nombre complex $w=u+2iv\neq 0$ té una arrel quadrada $z=x+iy\neq 0$, i llavors $x^2-y^2=u$, $2xy=2v$. En polars: $G(\rho\cos\theta,\rho\sin\theta)=\rho^2(\cos 2\theta,\tfrac12\sin 2\theta)$, que recorre tot el pla menys l'origen. Imatge: $\mathbb{R}^2\setminus\{(0,0)\}$.
      fuites:
      - u\s*\+\s*2\s*i\s*v
      - \\tfrac12\s*\\sin\s*2
      teoria: []
    errors_comuns:
    - id: det_no_nul_injectiva
      descripcio: |
        Conclou que $G$ és injectiva perquè el determinant de la jacobiana no s'anul·la en cap punt del domini.
      pregunta: |
        Què garanteix exactament el teorema de la funció inversa: injectivitat en tot el domini o només a prop de cada punt?
    - id: imatge_incompleta
      descripcio: |
        Afirma que la imatge és tot $\mathbb{R}^2$, o només un semiplà, sense resoldre l'equació $G(x,y)=(u,v)$.
      pregunta: |
        Pot ser $G(x,y)=(0,0)$ amb $(x,y)$ al domini? I un punt amb $u<0$, s'assoleix?
    nota_professor: |
      Cada punt de la imatge té exactament dues antiimatges $\pm(x,y)$. Comparar amb l'Exemple 3 del Tema 4 ($z^3$). Aquí $G$ correspon a $z\mapsto z^2$ amb la segona component dividida per $2$.
  - id: t4-5d
    apartat: d
    tipus: calcul
    enunciat: |
      $\mathrm{Dom}(G)=\{(x,y)\in\mathbb{R}^2\mid 0<y<x\}$, $G(x,y)=(\log(xy),(x^2+y^2)^{-1})$.
    teoria:
    - T4.5
    teoria_reservada: []
    resultat:
      valor: |
        $G$ és $\mathcal{C}^\infty$ en el domini (obert) i $\det JG=\frac{2(x^2-y^2)}{xy(x^2+y^2)^2}>0$ (perquè $x>y>0$): satisfà les hipòtesis del TFI a tot punt. És injectiva i la imatge és $\{(u,v)\in\mathbb{R}^2\mid v>0,\ 2e^uv<1\}$, és a dir $0<v<\frac{e^{-u}}{2}$. La inversa és
        $G^{-1}(u,v)=\Big(\tfrac12\big(\sqrt{\tfrac1v+2e^u}+\sqrt{\tfrac1v-2e^u}\big),\ \tfrac12\big(\sqrt{\tfrac1v+2e^u}-\sqrt{\tfrac1v-2e^u}\big)\Big)$.
      fuites:
      - \\sqrt\{\s*(\\[td]?frac\{?1\}?\{?v\}?|1\s*/\s*v)\s*\+\s*2\s*e\^\{?u\}?\s*\}
      - 2\s*e\^\{?u\}?\s*v\s*<\s*1
      - 2\s*v\s*e\^\{?u\}?\s*<\s*1
      - e\^\{-u\}\}?\{?2\}?
      - u\s*<\s*-\s*\\(log|ln)\s*\(?\s*2\s*v
    passos:
    - id: hipotesis
      titol: Hipòtesis del TFI
      objectiu: |
        Comprovar si $G$ compleix les hipòtesis del teorema de la funció inversa a tots els punts del domini.
      idea: |
        Comprovar que el domini és obert i $G$ hi és de classe $\mathcal{C}^1$ (on estan definits el logaritme i la potència?), i estudiar el signe del determinant de la jacobiana usant $0<y<x$.
      detall: |
        Al domini $xy>0$ i $x^2+y^2>0$, per tant $G\in\mathcal{C}^\infty$. $JG=\begin{pmatrix}\frac1x&\frac1y\\ \frac{-2x}{(x^2+y^2)^2}&\frac{-2y}{(x^2+y^2)^2}\end{pmatrix}$ i $\det JG=\frac{2}{(x^2+y^2)^2}\big(\frac xy-\frac yx\big)=\frac{2(x^2-y^2)}{xy(x^2+y^2)^2}>0$ perquè $x>y>0$.
      fuites:
      - \\frac\{2\s*\(x\^\{?2\}?\s*-\s*y\^\{?2\}?\)\}
      teoria:
      - T4.5
      - T3.31
    - id: injectivitat_inversa
      titol: Injectivitat i inversa
      objectiu: |
        Decidir si $G$ és injectiva i, si ho és, trobar l'expressió de $G^{-1}$.
      idea: |
        De $G(x,y)=(u,v)$ es coneixen el producte $xy$ i la suma de quadrats $x^2+y^2$. Combinant-los s'obtenen $(x+y)^2$ i $(x-y)^2$; la condició $0<y<x$ fixa els signes de les arrels.
      detall: |
        $xy=e^u$, $x^2+y^2=\frac1v$. Llavors $(x+y)^2=\frac1v+2e^u$ i $(x-y)^2=\frac1v-2e^u$. Com que $x+y>0$ i $x-y>0$: $x+y=\sqrt{\frac1v+2e^u}$, $x-y=\sqrt{\frac1v-2e^u}$, i $(x,y)$ queda determinat de manera única: $x=\frac12\big(\sqrt{\frac1v+2e^u}+\sqrt{\frac1v-2e^u}\big)$, $y=\frac12\big(\sqrt{\frac1v+2e^u}-\sqrt{\frac1v-2e^u}\big)$. Per tant $G$ és injectiva.
      fuites:
      - \(x\s*-\s*y\)\^\{?2\}?\s*=\s*\\frac\{?1\}?\{?v\}?\s*-\s*2\s*e\^\{?u
      teoria: []
    - id: imatge
      titol: Imatge
      objectiu: |
        Determinar exactament quins $(u,v)$ s'assoleixen.
      idea: |
        Mirar quines condicions sobre $(u,v)$ calen perquè les expressions del pas anterior tinguin sentit i donin un punt del domini (amb desigualtats estrictes).
      detall: |
        Cal $v>0$ i $\frac1v-2e^u>0$ (estricte, ja que $x\neq y$), és a dir $2e^uv<1$. Recíprocament, si $v>0$ i $2e^uv<1$, les fórmules donen $x>y>0$ (ja que $\frac1v+2e^u>\frac1v-2e^u>0$) amb $xy=\frac14\big((x+y)^2-(x-y)^2\big)=e^u$ i $x^2+y^2=\frac12\big((x+y)^2+(x-y)^2\big)=\frac1v$. Imatge: $\{(u,v)\mid v>0,\ 2e^uv<1\}$.
      fuites:
      - 2\s*e\^\{?u\}?\s*v\s*<\s*1
      teoria: []
    errors_comuns:
    - id: oblidar_signes
      descripcio: |
        En treure arrels quadrades no usa $0<y<x$ per triar els signes, i conclou que hi ha diverses antiimatges (o no justifica la unicitat).
      pregunta: |
        Quins signes poden tenir $x+y$ i $x-y$ en el domini donat?
    - id: imatge_sense_restriccio
      descripcio: |
        Dona com a imatge $\{v>0\}$ o tot $\mathbb{R}^2$, sense la restricció que ve de $x\neq y$ i de la desigualtat $x^2+y^2>2xy$.
      pregunta: |
        Per a qualsevol parell de reals, quina desigualtat lliga $x^2+y^2$ amb $2xy$? Què implica per a $u$ i $v$?
    - id: determinant_signe
      descripcio: |
        Calcula el determinant però no justifica que és no nul usant la condició $y<x$.
      pregunta: |
        On es fa servir la condició $y<x$ del domini en la comprovació de les hipòtesis?
    nota_professor: |
      La recta $y=x$ (exclosa del domini) és on el determinant s'anul·la; correspon a la frontera $2e^uv=1$ de la imatge. Fent la comprovació: si $G(x,y)=(u,v)$, $x^2+y^2>2xy$ equival a $\frac1v>2e^u$.
- num: 6
  font: null
  preambul: |
    Considerem la funció definida per $G(s,t)=(\cosh(s)\cos(t),\sinh(s)\sin(t))$.
  indicacio: null
  exercicis:
  - id: t4-6a
    apartat: a
    tipus: teoric
    enunciat: |
      Demostreu que $G$ té inversa local entorn de tot punt del semipla $A=\{(s,t)\in\mathbb{R}^2\mid s>0\}$.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        $G\in\mathcal{C}^\infty(\mathbb{R}^2)$ i $\det JG(s,t)=\sinh^2s\cos^2t+\cosh^2s\sin^2t=\sinh^2s+\sin^2t$, que és $>0$ si $s>0$ (perquè $\sinh s>0$). Pel teorema de la funció inversa, $G$ té inversa local de classe $\mathcal{C}^\infty$ entorn de tot punt de $A$.
      fuites:
      - \\sinh\^\{?2\}?\s*s\s*\+\s*\\sin\^\{?2\}?\s*t
    passos:
    - id: jacobiana
      titol: Jacobiana i determinant
      objectiu: |
        Calcular la matriu jacobiana de $G$ i el seu determinant.
      idea: |
        Derivar cada component. Per simplificar el determinant, usar $\cosh^2s-\sinh^2s=1$ i $\sin^2t+\cos^2t=1$.
      detall: |
        $JG=\begin{pmatrix}\sinh s\cos t&-\cosh s\sin t\\ \cosh s\sin t&\sinh s\cos t\end{pmatrix}$, $\det JG=\sinh^2s\cos^2t+\cosh^2s\sin^2t=\sinh^2s\cos^2t+(1+\sinh^2s)\sin^2t=\sinh^2s+\sin^2t$.
      fuites:
      - \\sinh\^\{?2\}?\s*s\s*\+\s*\\sin\^\{?2\}?\s*t
      teoria:
      - T3.10
    - id: aplicar_tfi
      titol: Aplicar el TFI
      objectiu: |
        Concloure l'existència d'inversa local entorn de cada punt de $A$.
      idea: |
        Comprovar regularitat i que el determinant no s'anul·la quan $s>0$.
      detall: |
        Les components són productes de funcions $\mathcal{C}^\infty$, per tant $G\in\mathcal{C}^\infty$. Si $s>0$, $\sinh s>0$ i $\det JG\geq\sinh^2s>0$. Pel TFI, per a cada $(s_0,t_0)\in A$ hi ha un entorn $U$ on $G|_U$ és injectiva, $G(U)$ és obert i la inversa és $\mathcal{C}^\infty$.
      fuites: []
      teoria:
      - T4.5
      - T3.31
    errors_comuns:
    - id: identitat_hiperbolica
      descripcio: |
        Usa $\cosh^2s+\sinh^2s=1$ (signe equivocat) o no simplifica i no aconsegueix veure que el determinant és positiu.
      pregunta: |
        Quina identitat relaciona $\cosh^2s$ i $\sinh^2s$? Comprova-la a $s=0$.
    - id: confondre_local_global
      descripcio: |
        Afirma que $G$ és injectiva a tot $A$ com a conseqüència del TFI.
      pregunta: |
        El teorema de la funció inversa et dona una inversa definida a on? Què passa amb $G(s,t+2\pi)$?
    nota_professor: |
      Observació útil: $G(s,t)$ són la part real i imaginària de $\cosh(s+it)$, i $\det JG=|\sinh(s+it)|^2$. A $s=0$ el determinant s'anul·la en $t\in\pi\mathbb{Z}$.
  - id: t4-6b
    apartat: b
    tipus: teoric
    enunciat: |
      Demostreu que $G(A)$ és un subconjunt obert de $\mathbb{R}^2$.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        $A$ és obert, $G\in\mathcal{C}^1(A)$ i $\det JG\neq 0$ a tot $A$ (apartat a). Pel teorema de l'aplicació oberta, $G(A)$ és obert.
      fuites: []
    passos:
    - id: hipotesis
      titol: Hipòtesis
      objectiu: |
        Recollir el que ja se sap de $G$ sobre $A$ (assumint l'apartat a) i quin resultat permet passar de propietats locals a l'obertura de la imatge.
      idea: |
        Hi ha un corol·lari del teorema de la funció inversa sobre imatges d'oberts per funcions $\mathcal{C}^1$ amb jacobiana invertible a tot punt.
      detall: |
        $A=\{s>0\}$ és obert, $G\in\mathcal{C}^\infty(A)$ i, per l'apartat (a), $\det JG(s,t)=\sinh^2s+\sin^2t>0$ per a tot $(s,t)\in A$.
      fuites: []
      teoria:
      - T4.8
    - id: concloure
      titol: Concloure
      objectiu: |
        Demostrar que $G(A)$ és obert.
      idea: |
        Aplicar el resultat a l'obert $B=A$; alternativament, fer-ho a mà: cada punt $G(a)$ té un entorn obert $G(U_a)\subseteq G(A)$ donat pel TFI.
      detall: |
        Pel teorema de l'aplicació oberta, $G(A)$ és obert. Directament: si $y=G(a)$, $a\in A$, el TFI dona $U_a\subseteq A$ entorn obert de $a$ amb $G(U_a)$ obert, i $y\in G(U_a)\subseteq G(A)$; per tant $G(A)=\bigcup_{a\in A}G(U_a)$ és unió d'oberts.
      fuites: []
      teoria:
      - T4.8
      - T4.5
    errors_comuns:
    - id: imatge_oberta_per_continuitat
      descripcio: |
        Argumenta que $G(A)$ és obert perquè $G$ és contínua i $A$ és obert.
      pregunta: |
        La continuïtat garanteix que les antiimatges d'oberts són obertes. I les imatges? Penses un exemple d'una funció contínua que envia un obert a un no obert?
    - id: necessita_injectivitat
      descripcio: |
        Creu que cal la injectivitat global de $G$ a $A$ per concloure.
      pregunta: |
        Per veure que un conjunt és obert, què cal trobar al voltant de cada un dels seus punts? Cal que $G$ sigui injectiva a tot $A$ per això?
    nota_professor: |
      Per l'apartat (d), $G(A)=\mathbb{R}^2\setminus\{(x,0)\mid |x|\leq 1\}$, que efectivament és obert.
  - id: t4-6c
    apartat: c
    tipus: teoric
    enunciat: |
      Demostreu que la restricció de $G$ a $\{(s,t)\in A\mid 0<t<2\pi\}$ té inversa global.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        Sigui $B=\{s>0,\ 0<t<2\pi\}$. $G|_B$ és injectiva: si $G(s,t)=(x,y)$, aleshores $\frac{x^2}{\cosh^2s}+\frac{y^2}{\sinh^2s}=1$, i com que $(x,y)\neq(0,0)$ la funció $s\mapsto\frac{x^2}{\cosh^2s}+\frac{y^2}{\sinh^2s}$ és estrictament decreixent a $(0,\infty)$, $s$ queda determinat; llavors $\cos t=x/\cosh s$ i $\sin t=y/\sinh s$ determinen $t\in(0,2\pi)$. Com que $G\in\mathcal{C}^\infty$, és injectiva a $B$ i $\det JG\neq 0$ a $B$, $G:B\to G(B)$ és un difeomorfisme $\mathcal{C}^\infty$ (amb $G(B)$ obert): té inversa global $\mathcal{C}^\infty$.
      fuites: []
    passos:
    - id: el_lipses
      titol: Corbes s constant
      objectiu: |
        Trobar una relació entre $x=\cosh s\cos t$ i $y=\sinh s\sin t$ que no depengui de $t$.
      idea: |
        Aïllar $\cos t$ i $\sin t$ (amb $s>0$ els denominadors no s'anul·len) i usar $\cos^2t+\sin^2t=1$.
      detall: |
        Per $s>0$: $\cos t=\frac{x}{\cosh s}$, $\sin t=\frac{y}{\sinh s}$, per tant $\frac{x^2}{\cosh^2s}+\frac{y^2}{\sinh^2s}=1$: la corba $s=$ constant és una el·lipse (de focus $(\pm1,0)$).
      fuites:
      - \\frac\{x\^\{?2\}?\}\{\\cosh\^\{?2\}?\s*s\}\s*\+\s*\\frac\{y\^\{?2\}?\}\{\\sinh\^\{?2\}?\s*s\}
      teoria: []
    - id: injectivitat
      titol: Injectivitat a B
      objectiu: |
        Demostrar que si $G(s_1,t_1)=G(s_2,t_2)$ amb $(s_i,t_i)\in B$, aleshores $(s_1,t_1)=(s_2,t_2)$.
      idea: |
        Veure que el punt imatge determina $s$ (estudiant la monotonia en $s$ de l'expressió del pas anterior) i que, fixat $s$, el punt determina $t$ dins d'un interval de longitud $2\pi$.
      detall: |
        Sigui $(x,y)=G(s,t)$ amb $s>0$; no pot ser $(0,0)$ (caldria $\cos t=0$ i llavors $\sinh s\,|\sin t|=\sinh s>0$). La funció $\phi(\sigma)=\frac{x^2}{\cosh^2\sigma}+\frac{y^2}{\sinh^2\sigma}$ és estrictament decreixent a $(0,\infty)$ (cada terme és no creixent i almenys un és estrictament decreixent perquè $x$ o $y$ és no nul), per tant $\phi(\sigma)=1$ té com a única solució $\sigma=s$. Fixat $s$, $(\cos t,\sin t)=\big(\frac{x}{\cosh s},\frac{y}{\sinh s}\big)$ determina $t$ mòdul $2\pi$, i per tant de manera única a $(0,2\pi)$.
      fuites:
      - estrictament\s+decreixent
      teoria: []
    - id: difeomorfisme
      titol: Inversa global diferenciable
      objectiu: |
        Concloure que $G|_B$ té inversa global (i quina regularitat té).
      idea: |
        Combinar la injectivitat amb el que ja se sap del determinant i de la regularitat: hi ha una caracterització de difeomorfisme amb aquestes tres condicions.
      detall: |
        $B$ és obert, $G\in\mathcal{C}^\infty(B)$, injectiva a $B$ i $\det JG>0$ a $B$. Per tant $G:B\to G(B)$ és bijectiva, $G(B)$ és obert (aplicació oberta) i la inversa és $\mathcal{C}^\infty$ (localment coincideix amb les inverses locals del TFI): $G|_B$ és un difeomorfisme sobre la seva imatge.
      fuites: []
      teoria:
      - T4.9
      - T4.8
      - T4.5
    errors_comuns:
    - id: injectivitat_per_det
      descripcio: |
        Dedueix la injectivitat de $G|_B$ només de $\det JG\neq 0$.
      pregunta: |
        A tot $A$ el determinant tampoc s'anul·la. És $G$ injectiva a tot $A$? Què canvia en restringir $t$?
    - id: nomes_t
      descripcio: |
        Demostra que, fixat $s$, $t$ és únic, però no que punts amb $s$ diferents tinguin imatges diferents.
      pregunta: |
        Dues el·lipses de la família, per a valors diferents de $s$, es poden tallar?
    - id: inversa_sense_regularitat
      descripcio: |
        Conclou "té inversa" però no justifica que sigui contínua o diferenciable.
      pregunta: |
        Una bijecció té inversa. Què aporta, a més, el teorema de la funció inversa sobre aquesta inversa?
    nota_professor: |
      Les corbes $t=$ constant són branques d'hipèrboles confocals. Alternativa via complexos: $G(s,t)=\cosh(s+it)$. $G(B)=\mathbb{R}^2\setminus\{(x,0)\mid x\geq -1\}$ (la imatge de $t=0$ és la semirecta $x>1$, $y=0$, que queda exclosa, i el segment $[-1,1]$ no s'assoleix).
  - id: t4-6d
    apartat: d
    tipus: calcul
    enunciat: |
      Dibuixeu $G(A)$.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        $G(A)=\mathbb{R}^2\setminus\{(x,0)\mid -1\leq x\leq 1\}$: tot el pla menys el segment que uneix $(-1,0)$ i $(1,0)$. És la unió de les el·lipses confocals $\frac{x^2}{\cosh^2s}+\frac{y^2}{\sinh^2s}=1$, $s>0$, de focus $(\pm1,0)$, que s'aplanen sobre el segment quan $s\to 0^+$ i creixen indefinidament quan $s\to\infty$.
      fuites:
      - menys\s+(el\s+)?segment
      - \\setminus\s*\\\{\s*\(x,\s*0\)\s*\\mid\s*-?\s*1\s*(\\le|\\leq|≤)
      - \|x\|\s*(\\le|\\leq|≤)\s*1
      - \[\s*-\s*1\s*,\s*1\s*\]
    passos:
    - id: el_lipses
      titol: Imatge de les corbes s constant
      objectiu: |
        Descriure la imatge per $G$ de cada recta $s=s_0$ ($s_0>0$).
      idea: |
        Eliminar $t$ entre les dues components; reconèixer la corba i els seus semieixos.
      detall: |
        $t\mapsto(\cosh s_0\cos t,\sinh s_0\sin t)$ recorre (periòdicament) l'el·lipse sencera $\frac{x^2}{\cosh^2s_0}+\frac{y^2}{\sinh^2s_0}=1$, de semieixos $\cosh s_0>1$ i $\sinh s_0>0$; com que $\cosh^2s_0-\sinh^2s_0=1$, els focus són $(\pm1,0)$ per a tot $s_0$.
      fuites:
      - focus\s+(són\s+)?\$?\(\s*\\pm\s*1,\s*0\)
      teoria: []
    - id: unio
      titol: Unió de les el·lipses
      objectiu: |
        Determinar quins punts del pla estan en alguna d'aquestes el·lipses.
      idea: |
        Per a un punt $(x,y)$ fix, estudiar la funció $\sigma\mapsto\frac{x^2}{\cosh^2\sigma}+\frac{y^2}{\sinh^2\sigma}$ a $(0,\infty)$: límits als extrems i monotonia. Separar els casos $y\neq 0$ i $y=0$.
      detall: |
        $\phi(\sigma)=\frac{x^2}{\cosh^2\sigma}+\frac{y^2}{\sinh^2\sigma}$ és contínua i decreixent, amb $\phi\to0$ quan $\sigma\to\infty$. Si $y\neq 0$, $\phi\to+\infty$ quan $\sigma\to0^+$: pren el valor $1$. Si $y=0$, $\phi(\sigma)=\frac{x^2}{\cosh^2\sigma}$, amb límit $x^2$ a $0^+$ i $\phi<x^2$: pren el valor $1$ si i només si $|x|>1$. Per tant $G(A)$ és el pla menys el segment $\{(x,0)\mid |x|\leq 1\}$.
      fuites:
      - si\s+i\s+nom[ée]s\s+si\s+\$?\|x\|\s*>\s*1
      teoria: []
    - id: dibuix
      titol: Dibuix i coherència
      objectiu: |
        Fer el dibuix i comprovar que és coherent amb l'apartat (b).
      idea: |
        Dibuixar algunes el·lipses confocals i el conjunt excepcional; recordar què s'ha demostrat sobre $G(A)$ a l'apartat (b).
      detall: |
        El dibuix és el pla amb un tall rectilini al segment $[-1,1]\times\{0\}$, foliat per el·lipses de focus $(\pm1,0)$. És un obert, d'acord amb el teorema de l'aplicació oberta (apartat b).
      fuites: []
      teoria:
      - T4.8
    errors_comuns:
    - id: semieixos
      descripcio: |
        Pensa que les el·lipses poden ser arbitràriament petites (fins a l'origen) i conclou que $G(A)=\mathbb{R}^2\setminus\{(0,0)\}$.
      pregunta: |
        Quan $s\to 0^+$, quant tendeixen a valer els semieixos $\cosh s$ i $\sinh s$? En què es converteix l'el·lipse?
    - id: extrems_segment
      descripcio: |
        Exclou només l'interior del segment i inclou els punts $(\pm1,0)$ a la imatge.
      pregunta: |
        Per obtenir $(1,0)$ caldria $\cosh s\cos t=1$ i $\sinh s\sin t=0$ amb $s>0$. És possible?
    nota_professor: |
      $G$ és la funció complexa $\cosh$: envia el semiplà $\mathrm{Re}\,z>0$ a $\mathbb{C}\setminus[-1,1]$.
- num: 7
  font: null
  preambul: |
    Sigui $F:\mathbb{R}^2\to\mathbb{R}^2$ definida per $F(x,y)=(x^2y,xy^2)$.
  indicacio: null
  exercicis:
  - id: t4-7a
    apartat: a
    tipus: teoric
    enunciat: |
      Proveu que $F$ és localment invertible al voltant de $(x,y)$, si $x\neq 0$ i $y\neq 0$.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        $F$ és polinòmica ($\mathcal{C}^\infty$) i $\det JF(x,y)=\det\begin{pmatrix}2xy&x^2\\y^2&2xy\end{pmatrix}=3x^2y^2\neq 0$ si $x\neq0$ i $y\neq 0$. Pel teorema de la funció inversa, $F$ és localment invertible (amb inversa $\mathcal{C}^\infty$) al voltant d'aquests punts.
      fuites:
      - 3\s*x\^\{?2\}?\s*y\^\{?2\}?
    passos:
    - id: jacobiana
      titol: Jacobiana i determinant
      objectiu: |
        Calcular la matriu jacobiana de $F$ i el seu determinant.
      idea: |
        Derivar cada component respecte de $x$ i de $y$.
      detall: |
        $JF(x,y)=\begin{pmatrix}2xy&x^2\\ y^2&2xy\end{pmatrix}$, $\det JF=4x^2y^2-x^2y^2=3x^2y^2$.
      fuites:
      - 3\s*x\^\{?2\}?\s*y\^\{?2\}?
      teoria:
      - T3.10
    - id: aplicar_tfi
      titol: Aplicar el TFI
      objectiu: |
        Concloure la invertibilitat local en els punts amb $x\neq0$, $y\neq0$.
      idea: |
        Comprovar regularitat i que el determinant és no nul en aquests punts.
      detall: |
        $F\in\mathcal{C}^\infty(\mathbb{R}^2)$ i $\det JF(x,y)\neq 0$ si $xy\neq0$. Pel TFI existeix un entorn $U$ del punt amb $F|_U$ injectiva, $F(U)$ obert i inversa $\mathcal{C}^\infty$.
      fuites: []
      teoria:
      - T4.5
    errors_comuns:
    - id: determinant_mal
      descripcio: |
        Calcula malament el determinant (per exemple, $4x^2y^2+x^2y^2$) o posa les derivades a la posició equivocada.
      pregunta: |
        Quin element va a la fila $i$, columna $j$ de la jacobiana? I quin signe té el producte de la diagonal secundària en un determinant $2\times2$?
    - id: reciproc
      descripcio: |
        Conclou que als eixos $F$ no pot ser localment invertible perquè el determinant s'anul·la.
      pregunta: |
        El TFI dona una condició suficient. Diu alguna cosa quan el determinant s'anul·la?
    nota_professor: |
      De fet als eixos no és localment invertible: $F$ s'anul·la a tot l'eix $x=0$ i a tot l'eix $y=0$, i per tant no és injectiva en cap entorn d'un punt dels eixos. No es demana.
  - id: t4-7b
    apartat: b
    tipus: calcul
    enunciat: |
      Calculeu la diferencial de la inversa local de $F$ en el punt $F(2,1)$.
    teoria:
    - T3.10
    teoria_reservada: []
    resultat:
      valor: |
        $F(2,1)=(4,2)$ i $DF^{-1}(4,2)=\big(DF(2,1)\big)^{-1}=\begin{pmatrix}4&4\\1&4\end{pmatrix}^{-1}=\frac{1}{12}\begin{pmatrix}4&-4\\-1&4\end{pmatrix}=\begin{pmatrix}\frac13&-\frac13\\-\frac1{12}&\frac13\end{pmatrix}$.
      fuites:
      - \\frac\{?1\}?\{?12\}?\s*\\begin\{pmatrix\}\s*4\s*&\s*-\s*4
      - -\s*\\frac\{?1\}?\{?12\}?\s*&\s*\\frac\{?1\}?\{?3\}?
    passos:
    - id: punt_i_jacobiana
      titol: Punt imatge i jacobiana
      objectiu: |
        Calcular $F(2,1)$ i $JF(2,1)$, i comprovar que la inversa local existeix al voltant de $F(2,1)$.
      idea: |
        Substituir a $F$ i a la jacobiana de l'apartat (a).
      detall: |
        $F(2,1)=(4,2)$, $JF(2,1)=\begin{pmatrix}4&4\\1&4\end{pmatrix}$, amb determinant $16-4=12=3\cdot4\cdot1\neq0$.
      fuites:
      - \\begin\{pmatrix\}\s*4\s*&\s*4\s*\\\\\s*1\s*&\s*4
      teoria:
      - T3.10
    - id: invertir
      titol: Diferencial de la inversa
      objectiu: |
        Obtenir la matriu de $DF^{-1}(4,2)$.
      idea: |
        El teorema de la funció inversa dona la diferencial de la inversa en termes de la diferencial de $F$ en el punt corresponent.
      detall: |
        $DF^{-1}(4,2)=\big(DF(2,1)\big)^{-1}=\frac{1}{12}\begin{pmatrix}4&-4\\-1&4\end{pmatrix}=\begin{pmatrix}\frac13&-\frac13\\-\frac1{12}&\frac13\end{pmatrix}$.
      fuites:
      - \\frac\{?1\}?\{?12\}?\s*\\begin\{pmatrix\}\s*4\s*&\s*-\s*4
      teoria:
      - T4.5
    errors_comuns:
    - id: punt_equivocat
      descripcio: |
        Avalua $DF$ en $(4,2)$ en lloc de $(2,1)$, o escriu $DF^{-1}(2,1)$.
      pregunta: |
        $F^{-1}$ està definida a prop de quin punt? I $DF$ s'ha d'avaluar en el punt de sortida o en el d'arribada?
    - id: inversa_element_a_element
      descripcio: |
        Inverteix la matriu element a element (pren $1/4$, $1/4$, $1$, $1/4$).
      pregunta: |
        Si multipliques la matriu que proposes per $JF(2,1)$, obtens la identitat?
    nota_professor: |
      Es pot comprovar amb l'apartat (e): $DF^{-1}(u,v)$ avaluada a $(4,2)$ dona la mateixa matriu.
  - id: t4-7c
    apartat: c
    tipus: calcul
    enunciat: |
      Suposeu que la inversa local de l'apartat anterior està definida en un entorn que conté el punt $(4.1,1.9)$. Obteniu un valor aproximat de $F^{-1}(4.1,1.9)$.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        $F^{-1}(4.1,1.9)\approx(2,1)+DF^{-1}(4,2)\begin{pmatrix}0.1\\-0.1\end{pmatrix}=\big(2+\tfrac{0.2}{3},\,1-\tfrac{0.5}{12}\big)=\big(\tfrac{31}{15},\tfrac{23}{24}\big)\approx(2.0667,\ 0.9583)$.
      fuites:
      - 2[.,]0667
      - 0[.,]958
      - \\t?frac\{31\}\{15\}
      - \\t?frac\{23\}\{24\}
    passos:
    - id: aproximacio_lineal
      titol: Plantejar l'aproximació
      objectiu: |
        Escriure una aproximació de $F^{-1}(4.1,1.9)$ a partir de la informació coneguda a $(4,2)$.
      idea: |
        $F^{-1}$ és diferenciable a $(4,2)$: aproximar-la per la seva aproximació afí (de primer ordre) en aquest punt, usant l'apartat (b).
      detall: |
        $F^{-1}(4.1,1.9)\approx F^{-1}(4,2)+DF^{-1}(4,2)\big((4.1,1.9)-(4,2)\big)=(2,1)+DF^{-1}(4,2)(0.1,-0.1)^T$.
      fuites:
      - \(0[.,]1,\s*-\s*0[.,]1\)
      teoria:
      - T4.6
      - T3.8
    - id: calcular
      titol: Calcular
      objectiu: |
        Obtenir el valor numèric de l'aproximació.
      idea: |
        Multiplicar la matriu de l'apartat (b) pel vector increment i sumar.
      detall: |
        $\begin{pmatrix}\frac13&-\frac13\\-\frac1{12}&\frac13\end{pmatrix}\begin{pmatrix}0.1\\-0.1\end{pmatrix}=\begin{pmatrix}0.0667\\-0.0417\end{pmatrix}$, per tant $F^{-1}(4.1,1.9)\approx(2.0667,\ 0.9583)$.
      fuites:
      - 2[.,]0667
      - 0[.,]958
      teoria: []
    errors_comuns:
    - id: increment_al_reves
      descripcio: |
        Usa l'increment en el domini ($(2,1)$) en lloc de l'increment en la imatge, o pren $(4,2)-(4.1,1.9)$ amb el signe canviat.
      pregunta: |
        L'aproximació afí de $F^{-1}$ a $(4,2)$ actua sobre quin vector diferència?
    - id: usar_df_en_lloc_dfinv
      descripcio: |
        Multiplica per $DF(2,1)$ en lloc de per $DF^{-1}(4,2)$.
      pregunta: |
        Quina funció estàs aproximant? Quina és la seva diferencial?
    nota_professor: |
      És la idea de l'Exemple 6.2 del Tema 4 (un pas del mètode de Newton). Valor exacte (apartat d): $\approx(2.0683,\ 0.9585)$.
  - id: t4-7d
    apartat: d
    tipus: calcul
    enunciat: |
      Sigui $A=\{(x,y)\in\mathbb{R}^2\mid x\neq 0,\ y\neq 0\}$. Proveu que la restricció de $F$ a $A$ és injectiva i doneu-ne explícitament la funció inversa. Calculeu $F^{-1}(4.1,1.9)$ i compareu el resultat amb l'aproximació de l'apartat anterior.
    teoria: []
    teoria_reservada: []
    resultat:
      valor: |
        Si $F(x,y)=(u,v)$ amb $(x,y)\in A$, aleshores $u^2/v=x^3$ i $v^2/u=y^3$, que determinen $x,y$ (l'arrel cúbica real és injectiva): $F|_A$ és injectiva, $F(A)=A$ i $F^{-1}(u,v)=\big(\sqrt[3]{u^2/v},\ \sqrt[3]{v^2/u}\big)$. Llavors $F^{-1}(4.1,1.9)=\big(\sqrt[3]{16.81/1.9},\sqrt[3]{3.61/4.1}\big)\approx(2.0683,\ 0.9585)$; l'aproximació $(2.0667,\ 0.9583)$ té errors d'ordre $2\cdot10^{-3}$ i $10^{-4}$, petits respecte de l'increment $\|(0.1,-0.1)\|\approx0.14$.
      fuites:
      - \\sqrt\[3\]\{\s*u\^\{?2\}?\s*/\s*v\s*\}
      - \\sqrt\[3\]\{\s*\\[dt]?frac\{u\^\{?2\}?\}\{v\}
      - u\^\{?2/3\}?\s*v\^\{?-1/3
      - \(\s*\\[dt]?frac\{u\^\{?2\}?\}\{v\}\s*\)\^\{?1/3
      - \(\s*u\^\{?2\}?\s*/\s*v\s*\)\^\{?1/3
      - 2[.,]068
      - 0[.,]9585
    passos:
    - id: injectivitat
      titol: Injectivitat a A
      objectiu: |
        Demostrar que $F|_A$ és injectiva.
      idea: |
        A partir de $u=x^2y$ i $v=xy^2$, buscar combinacions (quocients de potències) que aïllin $x$ i $y$ per separat.
      detall: |
        Si $(x,y)\in A$ i $F(x,y)=(u,v)$, llavors $u,v\neq0$ i $\frac{u^2}{v}=\frac{x^4y^2}{xy^2}=x^3$, $\frac{v^2}{u}=y^3$. Com que $t\mapsto t^3$ és injectiva a $\mathbb{R}$, $(u,v)$ determina $(x,y)$: $F|_A$ és injectiva.
      fuites:
      - \\frac\{u\^\{?2\}?\}\{v\}\s*=\s*\\frac\{x\^\{?4
      teoria: []
    - id: inversa
      titol: Imatge i inversa explícita
      objectiu: |
        Trobar $F(A)$ i l'expressió de $F^{-1}$.
      idea: |
        Treure l'arrel cúbica real de les expressions anteriors i comprovar que, per a qualsevol $(u,v)$ amb $uv\neq0$, el punt obtingut és a $A$ i té imatge $(u,v)$.
      detall: |
        $F^{-1}(u,v)=\big(\sqrt[3]{u^2/v},\sqrt[3]{v^2/u}\big)$. Per a tot $(u,v)\in A$ aquest punt és a $A$ i $x^2y=\sqrt[3]{u^4/v^2}\sqrt[3]{v^2/u}=\sqrt[3]{u^3}=u$, i anàlogament $xy^2=v$. Per tant $F(A)=A$ i $F|_A:A\to A$ és bijectiva.
      fuites:
      - \\sqrt\[3\]\{\s*u\^\{?2\}?\s*/\s*v\s*\}
      teoria: []
    - id: comparar
      titol: Valor exacte i comparació
      objectiu: |
        Calcular $F^{-1}(4.1,1.9)$ i comparar-lo amb l'aproximació de l'apartat (c).
      idea: |
        Substituir a la fórmula; l'error de l'aproximació afí ha de ser petit comparat amb la mida de l'increment (és $o(\|y-q\|)$).
      detall: |
        $F^{-1}(4.1,1.9)=\big(\sqrt[3]{8.8474},\sqrt[3]{0.8805}\big)\approx(2.0683,\ 0.9585)$. L'aproximació $(2.0667,\ 0.9583)$ difereix en $\approx1.6\cdot10^{-3}$ i $\approx1.3\cdot10^{-4}$, molt menys que $\|(0.1,-0.1)\|\approx0.14$: coherent amb que l'error de l'aproximació de primer ordre és $o(\|(0.1,-0.1)\|)$.
      fuites:
      - 2[.,]068
      - 0[.,]9585
      teoria:
      - T4.6
      - T3.8
    errors_comuns:
    - id: arrel_parell
      descripcio: |
        Escriu potències com $(u^2/v)^{1/3}$ pensant només en valors positius, o usa arrels quadrades, i perd els punts amb $u$ o $v$ negatius.
      pregunta: |
        La teva fórmula, funciona per a un punt com $F(-1,1)=(1,-1)$?
    - id: imatge_no_justificada
      descripcio: |
        Dona la fórmula de la inversa sense comprovar que tot punt de $A$ és imatge (no determina $F(A)$).
      pregunta: |
        Si apliques $F$ al punt que dona la teva fórmula, recuperes $(u,v)$? Per a quins $(u,v)$ té sentit la fórmula?
    - id: injectiva_per_det
      descripcio: |
        Argumenta la injectivitat a $A$ amb el fet que $\det JF\neq0$ a $A$.
      pregunta: |
        El determinant no nul a tot $A$, què garanteix exactament? Coneixes alguna funció amb determinant no nul arreu que no sigui injectiva?
    nota_professor: |
      $F$ conserva els quadrants: el signe de $u$ és el de $y$ i el de $v$ el de $x$. Valors: $16.81/1.9\approx8.84737$, $\sqrt[3]{\cdot}\approx2.06826$; $3.61/4.1\approx0.88049$, $\sqrt[3]{\cdot}\approx0.95846$.
  - id: t4-7e
    apartat: e
    tipus: calcul
    enunciat: |
      Obteniu $DF^{-1}(u,v)$.
    teoria:
    - T3.10
    teoria_reservada: []
    resultat:
      valor: |
        Per $uv\neq0$: $DF^{-1}(u,v)=\begin{pmatrix}\frac{2}{3\sqrt[3]{uv}}&-\frac13\sqrt[3]{\frac{u^2}{v^4}}\\[1mm] -\frac13\sqrt[3]{\frac{v^2}{u^4}}&\frac{2}{3\sqrt[3]{uv}}\end{pmatrix}$, equivalentment $\big(DF(x,y)\big)^{-1}=\begin{pmatrix}\frac{2}{3xy}&-\frac{1}{3y^2}\\-\frac{1}{3x^2}&\frac{2}{3xy}\end{pmatrix}$ amb $(x,y)=F^{-1}(u,v)$.
      fuites:
      - \\[dt]?frac\{2\}\{3\s*\\sqrt\[3\]\{u\s*v\}\}
      - \\[dt]?frac\{2\}\{3\s*x\s*y\}
    passos:
    - id: formula_tfi
      titol: Inversa de la jacobiana
      objectiu: |
        Expressar $DF^{-1}(u,v)$ en termes del punt $(x,y)=F^{-1}(u,v)$.
      idea: |
        Usar la fórmula del TFI per a la diferencial de la inversa i invertir la matriu $2\times2$ de l'apartat (a).
      detall: |
        $DF^{-1}(u,v)=\big(DF(x,y)\big)^{-1}=\frac{1}{3x^2y^2}\begin{pmatrix}2xy&-x^2\\-y^2&2xy\end{pmatrix}=\begin{pmatrix}\frac{2}{3xy}&-\frac{1}{3y^2}\\-\frac{1}{3x^2}&\frac{2}{3xy}\end{pmatrix}$.
      fuites:
      - \\frac\{2\}\{3\s*x\s*y\}
      teoria:
      - T4.5
    - id: en_u_v
      titol: Escriure-ho en funció de (u,v)
      objectiu: |
        Escriure la matriu anterior com a funció de $(u,v)$.
      idea: |
        Substituir $(x,y)$ per l'expressió de l'apartat (d), o bé derivar directament les components de $F^{-1}$. Pot ajudar calcular primer $(xy)^3$.
      detall: |
        $(xy)^3=\frac{u^2}{v}\cdot\frac{v^2}{u}=uv$, per tant $xy=\sqrt[3]{uv}$; $x^2=\sqrt[3]{u^4/v^2}$, $y^2=\sqrt[3]{v^4/u^2}$. Llavors $DF^{-1}(u,v)=\begin{pmatrix}\frac{2}{3\sqrt[3]{uv}}&-\frac13\sqrt[3]{\frac{u^2}{v^4}}\\-\frac13\sqrt[3]{\frac{v^2}{u^4}}&\frac{2}{3\sqrt[3]{uv}}\end{pmatrix}$. Comprovació a $(4,2)$: $\frac13$, $-\frac13$, $-\frac1{12}$, $\frac13$, com a l'apartat (b).
      fuites:
      - \\frac\{2\}\{3\s*\\sqrt\[3\]\{uv\}\}
      - x\s*y\s*=\s*\\sqrt\[3\]\{uv\}
      teoria: []
    errors_comuns:
    - id: punt_equivocat
      descripcio: |
        Escriu $(DF(u,v))^{-1}$, és a dir, avalua $DF$ en $(u,v)$ en lloc de $F^{-1}(u,v)$.
      pregunta: |
        A la fórmula del TFI per a $Df^{-1}(y_0)$, en quin punt s'avalua $Df$?
    - id: no_comprovar
      descripcio: |
        Obté una expressió sense comprovar-la amb el valor de l'apartat (b), i hi ha errors d'exponents en les arrels cúbiques.
      pregunta: |
        Què dona la teva fórmula al punt $(4,2)$? Coincideix amb l'apartat (b)?
    nota_professor: |
      Derivant directament $x=u^{2/3}v^{-1/3}$, $y=u^{-1/3}v^{2/3}$ (amb arrels cúbiques reals) s'obté el mateix. Vàlid per a $(u,v)\in A$.
- num: 8
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t4-8
    apartat: null
    tipus: calcul
    enunciat: |
      Proveu que la funció $G(x,y,z)=(x+y+z^2,\ x-y+z,\ 2x+y-z)$ admet una inversa local diferenciable al voltant del punt $(1,-1,2)$ i calculeu $DG^{-1}(4,4,-1)$. Admet $G$ inversa global?
    teoria:
    - T4.9
    teoria_reservada: []
    resultat:
      valor: |
        $G$ és de classe $\mathcal{C}^\infty$ i $\det JG(x,y,z)=3+6z$, que en $(1,-1,2)$ val $15\neq 0$. Pel teorema de la funció inversa, $G$ té inversa local de classe $\mathcal{C}^\infty$ en un entorn de $G(1,-1,2)=(4,4,-1)$, i
        $$DG^{-1}(4,4,-1)=\big(JG(1,-1,2)\big)^{-1}=\begin{pmatrix}1&1&4\\ 1&-1&1\\ 2&1&-1\end{pmatrix}^{-1}=\begin{pmatrix}0&\frac13&\frac13\\ \frac15&-\frac35&\frac15\\ \frac15&\frac1{15}&-\frac2{15}\end{pmatrix}.$$
        $G$ no admet inversa global: no és injectiva, per exemple $G(0,0,0)=G(0,-1,-1)=(0,0,0)$ (en general, $(x,y,z)$ i el punt amb $z'=-1-z$ corresponent tenen la mateixa imatge). A més $\det JG=0$ sobre el pla $z=-\frac12$.
      fuites:
      - 1\s*/\s*15
      - \\frac\s*\{?\s*-?\s*1\s*\}?\s*\{\s*15\s*\}
      - \\frac\s*1\s*\{\s*15\s*\}
      - no\s+(admet|té|te)\s+(cap\s+)?inversa\s+global
      - no\s+és\s+injectiva
      - \(\s*0\s*,\s*-\s*1\s*,\s*-\s*1\s*\)
    passos:
    - id: punt_imatge
      titol: Situar el punt i la seva imatge
      objectiu: |
        Relacionar el punt $(1,-1,2)$ amb el punt $(4,4,-1)$ on es demana la diferencial de la inversa.
      idea: |
        La diferencial de la inversa s'avalua en la imatge del punt on s'inverteix: cal comprovar quin punt de l'espai de sortida correspon a $(4,4,-1)$.
      detall: |
        $G(1,-1,2)=(1-1+4,\ 1+1+2,\ 2-1-2)=(4,4,-1)$. Per tant $(4,4,-1)$ és la imatge de $(1,-1,2)$ i $DG^{-1}(4,4,-1)$ és la diferencial de la inversa local definida al voltant de $(1,-1,2)$.
      fuites: []
      teoria: []
    - id: jacobiana
      titol: Jacobiana i hipòtesis del TFI
      objectiu: |
        Comprovar que $G$ satisfà les hipòtesis del teorema de la funció inversa en $(1,-1,2)$.
      idea: |
        $G$ és polinòmica, per tant de classe $\mathcal{C}^\infty$. Cal calcular la matriu jacobiana i veure que el seu determinant no s'anul·la en el punt.
      detall: |
        $JG(x,y,z)=\begin{pmatrix}1&1&2z\\ 1&-1&1\\ 2&1&-1\end{pmatrix}$, i desenvolupant, $\det JG(x,y,z)=1\cdot(1-1)-1\cdot(-1-2)+2z\cdot(1+2)=3+6z$. En $(1,-1,2)$: $\det JG(1,-1,2)=15\neq 0$. Pel teorema de la funció inversa existeix un entorn $U$ de $(1,-1,2)$ tal que $G|_U$ és injectiva, $G(U)$ és obert i la inversa és de classe $\mathcal{C}^\infty$.
      fuites:
      - 3\s*\+\s*6\s*z
      - =\s*15\b
      teoria:
      - T4.5
      - T3.31
    - id: diferencial_inversa
      titol: Calcular la diferencial de la inversa
      objectiu: |
        Calcular $DG^{-1}(4,4,-1)$.
      idea: |
        El teorema de la funció inversa dona la diferencial de la inversa com la inversa de la diferencial de $G$ en el punt antiimatge. Cal invertir una matriu $3\times 3$.
      detall: |
        $DG^{-1}(4,4,-1)=\big(JG(1,-1,2)\big)^{-1}$ amb $JG(1,-1,2)=\begin{pmatrix}1&1&4\\ 1&-1&1\\ 2&1&-1\end{pmatrix}$. Per adjunts (determinant $15$):
        $\big(JG(1,-1,2)\big)^{-1}=\frac{1}{15}\begin{pmatrix}0&5&5\\ 3&-9&3\\ 3&1&-2\end{pmatrix}=\begin{pmatrix}0&\frac13&\frac13\\ \frac15&-\frac35&\frac15\\ \frac15&\frac1{15}&-\frac2{15}\end{pmatrix}$.
        Comprovació: multiplicant per $JG(1,-1,2)$ dona la identitat.
      fuites:
      - \\frac\s*\{\s*1\s*\}\s*\{\s*15\s*\}
      - \\frac\s*1\s*\{\s*15\s*\}
      - \\frac\s*\{?\s*3\s*\}?\s*\{?\s*5\s*\}?
      - 1\s*/\s*15
      teoria:
      - T4.5
    - id: inversa_global
      titol: Inversa global
      objectiu: |
        Decidir si $G$ admet una inversa definida globalment.
      idea: |
        Una inversa global requereix que $G$ sigui injectiva a tot $\mathbb{R}^3$. Proveu de resoldre $G(x,y,z)=(u,v,w)$: les dues darreres components són lineals i permeten eliminar $x$ i $y$; mireu quantes solucions té l'equació en $z$ que en resulta.
      detall: |
        De $v+w=3x$ s'obté $x=\frac{v+w}{3}$, i de la segona component $y=x+z-v$. Substituint a la primera: $u=2x-v+z+z^2$, és a dir $z^2+z=u+v-2x$. Aquesta equació de segon grau en $z$ té en general dues solucions, $z$ i $-1-z$, que donen dues antiimatges diferents. Exemple: $G(0,0,0)=(0,0,0)$ i $G(0,-1,-1)=(0-1+1,\ 0+1-1,\ 0-1+1)=(0,0,0)$. Per tant $G$ no és injectiva i no té inversa global. (També: $\det JG=0$ al pla $z=-\frac12$, on cap inversa local pot ser diferenciable; i $G$ no és exhaustiva, ja que $z^2+z\geq-\frac14$.)
      fuites:
      - z\s*\^\s*\{?2\}?\s*\+\s*z\s*=
      - \(\s*0\s*,\s*-\s*1\s*,\s*-\s*1\s*\)
      - -\s*1\s*-\s*z
      teoria:
      - T4.9
    errors_comuns:
    - id: punt_equivocat
      descripcio: |
        Avalua la jacobiana de $G$ en $(4,4,-1)$ en lloc d'avaluar-la en l'antiimatge $(1,-1,2)$.
      pregunta: |
        El punt $(4,4,-1)$ pertany al domini de $G$ o al de la seva inversa? En quin punt s'ha d'avaluar $JG$?
    - id: local_implica_global
      descripcio: |
        Conclou que hi ha inversa global perquè el determinant de la jacobiana no és zero en el punt (o en molts punts).
      pregunta: |
        El teorema de la funció inversa et dona una inversa en un entorn. Què hauria de complir $G$ a tot $\mathbb{R}^3$ per tenir una inversa global?
    - id: inversa_mal_calculada
      descripcio: |
        S'equivoca en invertir la matriu (oblida transposar la matriu d'adjunts o dividir pel determinant).
      pregunta: |
        Has comprovat que el producte de la matriu que has obtingut per $JG(1,-1,2)$ dona la identitat?
    nota_professor: |
      La no injectivitat també es veu observant que $G(x,y,z)$ i $G(x,y',z')$ coincideixen per $z'=-1-z$ i $y'=y+z'-z$. El pla crític $z=-\frac12$ és justament on les dues branques $z$ i $-1-z$ s'ajunten.
- num: 9
  font: null
  preambul: |
    Demostreu que les funcions següents són difeomorfismes locals de classe $\mathcal{C}^\infty$ en tot punt del domini indicat. Doneu oberts màxims dins d'aquests dominis on les seves restriccions siguin difeomorfismes:
  indicacio: null
  exercicis:
  - id: t4-9a
    apartat: a
    tipus: teoric
    enunciat: |
      $F(r,\varphi)=(r\cos\varphi,r\sin\varphi)$, $(r,\varphi)\in(0,\infty)\times\mathbb{R}$ *(polars)*;
      (Indicació: $F:(0,\infty)\times(0,2\pi)\to\mathbb{R}^2\setminus\{(x,y)\mid y=0,\ x\geqslant 0\}$ té inversa i $F^{-1}$ no es pot estendre amb continuïtat a cap obert que contingui estrictament $\mathbb{R}^2\setminus\{(x,y)\mid y=0,\ x>0\}$.)
    teoria:
    - T4.9
    teoria_reservada:
    - T4.11
    resultat:
      valor: |
        $F$ és de classe $\mathcal{C}^\infty$ i $\det JF(r,\varphi)=r>0$ en tot el domini; pel teorema de la funció inversa, $F$ és un difeomorfisme local de classe $\mathcal{C}^\infty$ en tot punt. Oberts màxims: per a cada $\alpha\in\mathbb{R}$, $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)$; $F:U_\alpha\to\mathbb{R}^2\setminus\{(t\cos\alpha,t\sin\alpha)\mid t\geq 0\}$ és un difeomorfisme, i cap obert del domini que contingui estrictament $U_\alpha$ fa $F$ injectiva.
      fuites:
      - \\alpha\s*\+\s*2\s*\\pi
    passos:
    - id: jacobiana
      titol: Regularitat i jacobiana
      objectiu: |
        Comprovar la regularitat de $F$ i estudiar on s'anul·la el determinant de la seva jacobiana.
      idea: |
        Les components són productes de funcions $\mathcal{C}^\infty$. Calculeu $\det JF$ i mireu-ne el signe al domini.
      detall: |
        $JF(r,\varphi)=\begin{pmatrix}\cos\varphi&-r\sin\varphi\\ \sin\varphi&r\cos\varphi\end{pmatrix}$, $\det JF(r,\varphi)=r\cos^2\varphi+r\sin^2\varphi=r>0$ per a tot $(r,\varphi)\in(0,\infty)\times\mathbb{R}$.
      fuites:
      - \\det\s*J\s*F[^$]{0,20}=\s*r\b
      teoria:
      - T3.31
    - id: difeo_local
      titol: Difeomorfisme local
      objectiu: |
        Deduir que $F$ és un difeomorfisme local de classe $\mathcal{C}^\infty$ en tot punt.
      idea: |
        Aplicar el teorema de la funció inversa en cada punt del domini, per a qualsevol classe $\mathcal{C}^k$, $k\geq 1$.
      detall: |
        Per a cada $p$ del domini, $F$ és $\mathcal{C}^\infty$ i $\det JF(p)\neq 0$; el teorema de la funció inversa dona un entorn obert $U_p$ tal que $F|_{U_p}:U_p\to F(U_p)$ és bijectiva, $F(U_p)$ és obert i la inversa és $\mathcal{C}^k$ per a tot $k$, és a dir $\mathcal{C}^\infty$. Així $F$ és un difeomorfisme local $\mathcal{C}^\infty$ en tot punt.
      fuites: []
      teoria:
      - T4.5
      - T4.9
    - id: injectivitat
      titol: Quan dos punts tenen la mateixa imatge
      objectiu: |
        Caracteritzar quan $F(r,\varphi)=F(r',\varphi')$.
      idea: |
        Compareu primer les normes de les imatges i després les direccions.
      detall: |
        Si $F(r,\varphi)=F(r',\varphi')$, prenent normes $r=r'$, i aleshores $(\cos\varphi,\sin\varphi)=(\cos\varphi',\sin\varphi')$, que equival a $\varphi-\varphi'\in 2\pi\mathbb{Z}$. Per tant $F$ no és injectiva al domini sencer: $F(r,\varphi+2\pi)=F(r,\varphi)$.
      fuites:
      - 2\s*\\pi\s*\\mathbb\s*\{?\s*Z
      - \\varphi\s*\+\s*2\s*\\pi
      teoria: []
    - id: oberts_maxims
      titol: Oberts màxims
      objectiu: |
        Trobar oberts del domini on la restricció de $F$ sigui un difeomorfisme i que no es puguin ampliar.
      idea: |
        Pel pas anterior, la restricció és injectiva si i només si l'obert no conté dos punts amb el mateix $r$ i angles que difereixin en un múltiple de $2\pi$. Injectivitat més jacobiana invertible a tot arreu dona difeomorfisme sobre la imatge.
      detall: |
        Sigui $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)$. Dos angles d'aquest interval difereixen en menys de $2\pi$, per tant $F|_{U_\alpha}$ és injectiva; és $\mathcal{C}^\infty$ amb $\det JF\neq 0$, així que és un difeomorfisme sobre la seva imatge $F(U_\alpha)=\mathbb{R}^2\setminus\{(t\cos\alpha,t\sin\alpha)\mid t\geq 0\}$ (el pla menys la semirecta tancada d'angle $\alpha$). Maximalitat: sigui $W\supsetneq U_\alpha$ un obert del domini i $(r_0,\varphi_0)\in W\setminus U_\alpha$. Si $\varphi_0\not\equiv\alpha\pmod{2\pi}$, hi ha un únic $\varphi_1\in(\alpha,\alpha+2\pi)$ amb $\varphi_1\equiv\varphi_0$, i $\varphi_1\neq\varphi_0$ (perquè $\varphi_0\notin(\alpha,\alpha+2\pi)$): els punts $(r_0,\varphi_0)\in W$ i $(r_0,\varphi_1)\in U_\alpha\subseteq W$ són diferents i tenen la mateixa imatge. Si $\varphi_0=\alpha+2k\pi$ amb $k\in\mathbb{Z}$, com que $W$ és obert conté $(r_0,\varphi_0\pm\varepsilon)$ per a $\varepsilon\in(0,2\pi)$ petit; si $k\leq 0$, $\varphi_0-\varepsilon<\alpha$, i si $k\geq 1$, $\varphi_0+\varepsilon>\alpha+2\pi$, així que un d'aquests dos punts és de $W\setminus U_\alpha$ amb angle no congruent amb $\alpha$, i som al cas anterior. En tots els casos $F|_W$ no és injectiva. Per $\alpha=0$ és el cas de la indicació.
      fuites:
      - \\alpha\s*\+\s*2\s*\\pi
      teoria:
      - T4.9
    errors_comuns:
    - id: global_per_jacobiana
      descripcio: |
        Creu que, com que $\det JF\neq 0$ a tot el domini, $F$ és un difeomorfisme de tot el domini.
      pregunta: |
        Si augmentes l'angle $\varphi$ en una volta completa sense canviar $r$, què li passa a la imatge?
    - id: interval_no_obert
      descripcio: |
        Proposa $(0,\infty)\times[0,2\pi)$, que fa $F$ bijectiva sobre $\mathbb{R}^2\setminus\{0\}$ però no és obert.
      pregunta: |
        El conjunt que proposes és obert a $\mathbb{R}^2$? La definició de difeomorfisme ho demana?
    - id: unicitat_maxim
      descripcio: |
        Pensa que l'obert màxim és únic.
      pregunta: |
        Si desplaces l'interval d'angles, la restricció continua sent injectiva? Quantes opcions màximes hi ha?
    nota_professor: |
      Hi ha més oberts màxims que les franges: per exemple $\{(r,\varphi)\mid g(r)<\varphi<g(r)+2\pi\}$ amb $g$ contínua (la imatge és el pla menys una espiral). La indicació de l'enunciat justifica la maximalitat des del costat de la imatge. L'exemple de les polars de les notes (T4.11) fa aquest càlcul per $\alpha=0$. La indicació de l'enunciat (transcrita fidelment del PDF) diu "$x>0$" al darrer conjunt; probablement és una errata per "$x\geqslant 0$", és a dir, la imatge $F((0,\infty)\times(0,2\pi))$.
  - id: t4-9b
    apartat: b
    tipus: teoric
    enunciat: |
      $G(r,\varphi,\theta)=(r\cos\varphi\sin\theta,r\sin\varphi\sin\theta,r\cos\theta)$, $(r,\varphi,\theta)\in(0,\infty)\times\mathbb{R}\times(0,\pi)$ *(esfèriques)*;
    teoria:
    - T4.9
    teoria_reservada:
    - T4.11
    resultat:
      valor: |
        $G$ és $\mathcal{C}^\infty$ i $\det JG(r,\varphi,\theta)=-r^2\sin\theta\neq 0$ al domini (ja que $r>0$ i $\theta\in(0,\pi)$); pel teorema de la funció inversa és un difeomorfisme local $\mathcal{C}^\infty$ en tot punt. Oberts màxims: $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)\times(0,\pi)$, $\alpha\in\mathbb{R}$; $G:U_\alpha\to\mathbb{R}^3\setminus\{(t\cos\alpha,t\sin\alpha,z)\mid t\geq 0,\ z\in\mathbb{R}\}$ és un difeomorfisme.
      fuites:
      - \\alpha\s*\+\s*2\s*\\pi
    passos:
    - id: jacobiana
      titol: Regularitat i jacobiana
      objectiu: |
        Comprovar la regularitat de $G$ i estudiar on s'anul·la $\det JG$.
      idea: |
        Calculeu la jacobiana respecte de $(r,\varphi,\theta)$ i el determinant (per exemple desenvolupant per la tercera fila, que té un zero), i useu les restriccions del domini.
      detall: |
        $JG=\begin{pmatrix}\cos\varphi\sin\theta&-r\sin\varphi\sin\theta&r\cos\varphi\cos\theta\\ \sin\varphi\sin\theta&r\cos\varphi\sin\theta&r\sin\varphi\cos\theta\\ \cos\theta&0&-r\sin\theta\end{pmatrix}$, i $\det JG=-r^2\sin\theta$. Com que $r>0$ i $\sin\theta>0$ per $\theta\in(0,\pi)$, el determinant no s'anul·la al domini.
      fuites:
      - r\s*\^\s*\{?2\}?\s*\\sin\s*\\theta
      teoria:
      - T3.31
    - id: difeo_local
      titol: Difeomorfisme local
      objectiu: |
        Deduir que $G$ és un difeomorfisme local $\mathcal{C}^\infty$ en tot punt del domini.
      idea: |
        Aplicar el teorema de la funció inversa punt per punt.
      detall: |
        $G$ és $\mathcal{C}^\infty$ i $\det JG\neq 0$ a cada punt; el teorema de la funció inversa dona en cada punt un entorn on $G$ és bijectiva sobre un obert amb inversa $\mathcal{C}^\infty$.
      fuites: []
      teoria:
      - T4.5
      - T4.9
    - id: injectivitat
      titol: Quan dos punts tenen la mateixa imatge
      objectiu: |
        Caracteritzar quan $G(r,\varphi,\theta)=G(r',\varphi',\theta')$.
      idea: |
        Recupereu successivament $r$ (norma), $\theta$ (tercera component) i finalment la direcció de les dues primeres components.
      detall: |
        Prenent normes, $r=r'$. Llavors $\cos\theta=\cos\theta'$ amb $\theta,\theta'\in(0,\pi)$, on el cosinus és injectiu, per tant $\theta=\theta'$ i $\sin\theta>0$. Dividint les dues primeres components per $r\sin\theta$: $(\cos\varphi,\sin\varphi)=(\cos\varphi',\sin\varphi')$, és a dir $\varphi-\varphi'\in 2\pi\mathbb{Z}$.
      fuites:
      - 2\s*\\pi\s*\\mathbb\s*\{?\s*Z
      teoria: []
    - id: oberts_maxims
      titol: Oberts màxims
      objectiu: |
        Trobar oberts del domini on la restricció de $G$ sigui un difeomorfisme i que no es puguin ampliar, i la seva imatge.
      idea: |
        La no injectivitat només ve de la variable $\varphi$: cal limitar-la igual que a les polars, mantenint $r$ i $\theta$ lliures dins del domini.
      detall: |
        $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)\times(0,\pi)$: pel pas anterior $G|_{U_\alpha}$ és injectiva, i amb $\det JG\neq 0$ és un difeomorfisme sobre la imatge. Com que $x^2+y^2=r^2\sin^2\theta>0$, la imatge no toca l'eix $z$, i $G(U_\alpha)=\mathbb{R}^3\setminus\{(t\cos\alpha,t\sin\alpha,z)\mid t\geq 0,\ z\in\mathbb{R}\}$ (l'espai menys un semiplà tancat que conté l'eix $z$). És màxim pel mateix argument que a les polars: un obert del domini més gran conté dos punts amb el mateix $r,\theta$ i angles $\varphi$ congruents mòdul $2\pi$.
      fuites:
      - \\alpha\s*\+\s*2\s*\\pi
      teoria:
      - T4.9
    errors_comuns:
    - id: global_per_jacobiana
      descripcio: |
        Conclou que $G$ és un difeomorfisme global perquè el determinant no s'anul·la.
      pregunta: |
        Què passa amb la imatge si canvies $\varphi$ per $\varphi+2\pi$?
    - id: eix_z
      descripcio: |
        Inclou l'eix $z$ a la imatge o oblida que $\theta\in(0,\pi)$ ja l'exclou.
      pregunta: |
        Pot un punt de la forma $(0,0,z)$ ser imatge d'algun punt del domini? Quant val $x^2+y^2$ en termes de $r$ i $\theta$?
    - id: restringir_theta
      descripcio: |
        Intenta restringir també $\theta$ o $r$, quan l'única variable que fa perdre la injectivitat és $\varphi$.
      pregunta: |
        Si fixes $\varphi$, és injectiva la dependència respecte de $r$ i $\theta$ dins del domini?
    nota_professor: |
      A l'enunciat $\varphi$ és la longitud i $\theta$ la colatitud (al revés que a l'exemple T4.11, que usa $f(r,\theta,\varphi)$). Atenció: la imatge que dona T4.11 per a les esfèriques ("$\cup\{z=\pm1\}$") sembla un error de les notes; la imatge correcta és l'espai menys el semiplà tancat.
  - id: t4-9c
    apartat: c
    tipus: teoric
    enunciat: |
      $H(r,\varphi,z)=(r\cos\varphi,r\sin\varphi,z)$, $(r,\varphi,z)\in(0,\infty)\times\mathbb{R}\times\mathbb{R}$ *(cilíndriques)*.
    teoria:
    - T4.9
    teoria_reservada:
    - T4.11
    resultat:
      valor: |
        $H$ és $\mathcal{C}^\infty$ i $\det JH(r,\varphi,z)=r>0$; pel teorema de la funció inversa és un difeomorfisme local $\mathcal{C}^\infty$ en tot punt. Oberts màxims: $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)\times\mathbb{R}$, $\alpha\in\mathbb{R}$; $H:U_\alpha\to\mathbb{R}^3\setminus\{(t\cos\alpha,t\sin\alpha,z)\mid t\geq 0,\ z\in\mathbb{R}\}$ és un difeomorfisme.
      fuites:
      - \\alpha\s*\+\s*2\s*\\pi
    passos:
    - id: jacobiana
      titol: Regularitat i jacobiana
      objectiu: |
        Comprovar la regularitat de $H$ i estudiar on s'anul·la $\det JH$.
      idea: |
        La jacobiana té estructura de blocs: el bloc de les polars i la variable $z$ que no es barreja amb les altres.
      detall: |
        $JH=\begin{pmatrix}\cos\varphi&-r\sin\varphi&0\\ \sin\varphi&r\cos\varphi&0\\ 0&0&1\end{pmatrix}$, $\det JH=r>0$ al domini.
      fuites:
      - \\det\s*J\s*H[^$]{0,20}=\s*r\b
      teoria:
      - T3.31
    - id: difeo_local
      titol: Difeomorfisme local
      objectiu: |
        Deduir que $H$ és un difeomorfisme local $\mathcal{C}^\infty$ en tot punt.
      idea: |
        Aplicar el teorema de la funció inversa punt per punt.
      detall: |
        $H$ és $\mathcal{C}^\infty$ i $\det JH\neq 0$ a cada punt; pel teorema de la funció inversa, en cada punt hi ha un entorn on $H$ és bijectiva sobre un obert amb inversa $\mathcal{C}^\infty$.
      fuites: []
      teoria:
      - T4.5
      - T4.9
    - id: injectivitat
      titol: Quan dos punts tenen la mateixa imatge
      objectiu: |
        Caracteritzar quan $H(r,\varphi,z)=H(r',\varphi',z')$.
      idea: |
        La tercera component és la identitat; les dues primeres són les polars.
      detall: |
        $z=z'$ i $(r\cos\varphi,r\sin\varphi)=(r'\cos\varphi',r'\sin\varphi')$, que dona $r=r'$ i $\varphi-\varphi'\in 2\pi\mathbb{Z}$.
      fuites:
      - 2\s*\\pi\s*\\mathbb\s*\{?\s*Z
      teoria: []
    - id: oberts_maxims
      titol: Oberts màxims
      objectiu: |
        Trobar oberts del domini on la restricció de $H$ sigui un difeomorfisme i que no es puguin ampliar, i la seva imatge.
      idea: |
        Limitar només la variable angular, com a les polars.
      detall: |
        $U_\alpha=(0,\infty)\times(\alpha,\alpha+2\pi)\times\mathbb{R}$: $H|_{U_\alpha}$ és injectiva, $\mathcal{C}^\infty$ i amb $\det JH\neq 0$, per tant un difeomorfisme sobre $H(U_\alpha)=\mathbb{R}^3\setminus\{(t\cos\alpha,t\sin\alpha,z)\mid t\geq 0,\ z\in\mathbb{R}\}$. És màxim pel mateix argument que a les polars.
      fuites:
      - \\alpha\s*\+\s*2\s*\\pi
      teoria:
      - T4.9
    errors_comuns:
    - id: global_per_jacobiana
      descripcio: |
        Conclou que $H$ és difeomorfisme global perquè $\det JH\neq 0$.
      pregunta: |
        Què val $H(r,\varphi+2\pi,z)$?
    - id: imatge_eix
      descripcio: |
        Oblida que l'eix $z$ no és a la imatge (perquè $r>0$) o descriu malament la imatge.
      pregunta: |
        Quins punts $(x,y,z)$ tenen $x^2+y^2=0$? Poden ser imatge d'algun punt amb $r>0$?
    nota_professor: |
      És el producte de les polars per la identitat en $z$; tot l'argument de l'apartat (a) es trasllada directament.
- num: 10
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t4-10
    apartat: null
    tipus: calcul
    enunciat: |
      Siguin $G:\mathbb{R}^2\to\mathbb{R}^2$ definida per $G(u,v)=(u+v,\ v-u^2)$ i $T$ l'interior del triangle limitat per les rectes $u+v=2$, $u=0$, $v=0$. Determineu el recinte $S=G(T)$ i comproveu que $G:T\to S$ és un canvi de variables (o difeomorfisme).
    teoria:
    - T4.9
    teoria_reservada: []
    resultat:
      valor: |
        $S=G(T)=\{(x,y)\in\mathbb{R}^2\mid 0<x<2,\ -x^2<y<x\}$ (limitat per la recta $y=x$, la paràbola $y=-x^2$ i la recta $x=2$). $G$ és $\mathcal{C}^\infty$, $\det JG(u,v)=1+2u>0$ a $T$, i $G:T\to S$ és bijectiva amb inversa $u=\frac{-1+\sqrt{1+4(x-y)}}{2}$, $v=x-u$, de classe $\mathcal{C}^\infty$. Per tant $G:T\to S$ és un difeomorfisme.
      fuites:
      - -\s*x\s*\^\s*\{?2\}?\s*<\s*y\s*<\s*x
      - y\s*=\s*-\s*x\s*\^\s*\{?2\}?
    passos:
    - id: imatge_vores
      titol: Imatge de les vores
      objectiu: |
        Determinar en què es transformen els tres costats del triangle.
      idea: |
        Parametritzeu cada costat i apliqueu-hi $G$; és útil anomenar $(x,y)=G(u,v)$ i expressar la corba imatge com a relació entre $x$ i $y$.
      detall: |
        Costat $u=0$, $0<v<2$: $(x,y)=(v,v)$, segment de $y=x$ amb $0<x<2$. Costat $v=0$, $0<u<2$: $(x,y)=(u,-u^2)$, arc de paràbola $y=-x^2$ amb $0<x<2$. Costat $u+v=2$, $0<u<2$: $x=2$, $y=2-u-u^2\in(-4,2)$, segment vertical de $(2,2)$ a $(2,-4)$. El candidat és la regió limitada per aquestes tres corbes.
      fuites:
      - y\s*=\s*-\s*x\s*\^\s*\{?2\}?
      - \(\s*2\s*,\s*-\s*4\s*\)
      teoria: []
    - id: invertir
      titol: Resoldre G(u,v)=(x,y)
      objectiu: |
        Determinar exactament $S$ i veure que cada punt de $S$ té una única antiimatge a $T$.
      idea: |
        Aïlleu $v$ de la primera equació i substituïu a la segona: queda una equació de segon grau en $u$. Traduïu les condicions $u>0$, $v>0$, $u+v<2$ en condicions sobre $(x,y)$.
      detall: |
        $v=x-u$ i $y=x-u-u^2$, és a dir $u^2+u=x-y$. Amb $u>0$ cal $x-y>0$ i aleshores l'única arrel positiva és $u=\frac{-1+\sqrt{1+4(x-y)}}{2}$. La condició $v>0$ és $u<x$; com que $t\mapsto t^2+t$ és creixent per $t>0$, $u<x\iff x-y<x^2+x\iff y>-x^2$. La condició $u+v<2$ és $x<2$. Per tant $(x,y)\in G(T)$ si i només si $0<x<2$ i $-x^2<y<x$ (a més $x=u+v>0$; recíprocament, si $0<x<2$ i $-x^2<y<x$, la $u$ anterior compleix $u>0$, $v=x-u>0$ i $u+v=x<2$), i l'antiimatge és única: $G:T\to S$ és bijectiva amb $S=\{0<x<2,\ -x^2<y<x\}$.
      fuites:
      - u\s*\^\s*\{?2\}?\s*\+\s*u\s*=\s*x\s*-\s*y
      - \\sqrt\s*\{\s*1\s*\+\s*4
      - -\s*x\s*\^\s*\{?2\}?\s*<\s*y
      teoria: []
    - id: jacobiana
      titol: Jacobiana
      objectiu: |
        Comprovar que la diferencial de $G$ és invertible a tot $T$.
      idea: |
        Calculeu $\det JG(u,v)$ i useu el signe de $u$ a $T$.
      detall: |
        $JG(u,v)=\begin{pmatrix}1&1\\ -2u&1\end{pmatrix}$, $\det JG(u,v)=1+2u>0$ per $u>0$, en particular a tot $T$.
      fuites:
      - 1\s*\+\s*2\s*u
      teoria: []
    - id: concloure
      titol: Concloure que és un difeomorfisme
      objectiu: |
        Justificar que $G:T\to S$ és un canvi de variables.
      idea: |
        Un difeomorfisme és una bijecció $\mathcal{C}^1$ entre oberts amb inversa $\mathcal{C}^1$; equivalentment, una aplicació $\mathcal{C}^1$ injectiva amb jacobiana invertible a cada punt de l'obert.
      detall: |
        $T$ és obert, $G$ és polinòmica ($\mathcal{C}^\infty$), injectiva a $T$ i amb $\det JG\neq 0$ a $T$. Pel teorema de la funció inversa (aplicat a cada punt), $S=G(T)$ és obert i la inversa és $\mathcal{C}^\infty$; també es veu directament de la fórmula explícita, ja que $1+4(x-y)>1$ a $S$. Per tant $G:T\to S$ és un difeomorfisme $\mathcal{C}^\infty$.
      fuites: []
      teoria:
      - T4.9
      - T4.5
      - T4.8
    errors_comuns:
    - id: imatge_triangle
      descripcio: |
        Suposa que la imatge del triangle és el triangle de vèrtexs $G(0,0)$, $G(2,0)$, $G(0,2)$, com si $G$ fos lineal.
      pregunta: |
        $G$ és lineal? En què es transforma el costat $v=0$ quan hi apliques $G$?
    - id: sense_injectivitat
      descripcio: |
        Només comprova $\det JG\neq 0$ i conclou que és un difeomorfisme, sense provar la injectivitat.
      pregunta: |
        Que la jacobiana sigui invertible a cada punt garanteix que dos punts diferents de $T$ no tinguin la mateixa imatge?
    - id: arrel_equivocada
      descripcio: |
        En aïllar $u$ pren l'arrel negativa o no comprova que l'arrel triada compleixi $u>0$ i $v>0$.
      pregunta: |
        De les dues solucions de l'equació en $u$, quantes compleixen les condicions de $T$?
    nota_professor: |
      La injectivitat també es pot provar directament: $G(u,v)=G(u',v')$ implica $(u-u')(u+u'+1)=0$ i $u+u'+1>0$ a $T$.
- num: 11
  font: null
  preambul: |
    Per cadascun dels següents oberts $U\subseteq\mathbb{R}^2$, estudieu si la funció $G:U\to G(U)$ definida per $G(x,y)=(x^2-y^2,2xy)$ és un canvi de variables (o difeomorfisme):
  indicacio: null
  exercicis:
  - id: t4-11a
    apartat: a
    tipus: calcul
    enunciat: |
      $U=\mathbb{R}^2$;
    teoria:
    - T4.9
    teoria_reservada: []
    resultat:
      valor: |
        No és un difeomorfisme: $G(-x,-y)=G(x,y)$, així que no és injectiva; a més $\det JG(0,0)=0$.
      fuites:
      - no\s+és\s+(un\s+)?(canvi|difeomorfisme)
      - G\s*\(\s*-\s*x\s*,\s*-\s*y\s*\)
    passos:
    - id: jacobiana
      titol: Jacobiana
      objectiu: |
        Estudiar on la diferencial de $G$ és invertible.
      idea: |
        Calculeu $\det JG(x,y)$ i mireu on s'anul·la.
      detall: |
        $JG(x,y)=\begin{pmatrix}2x&-2y\\ 2y&2x\end{pmatrix}$, $\det JG(x,y)=4(x^2+y^2)$, que només s'anul·la a l'origen.
      fuites:
      - 4\s*\(\s*x\s*\^\s*\{?2\}?\s*\+\s*y\s*\^\s*\{?2\}?\s*\)
      teoria: []
    - id: injectivitat
      titol: Injectivitat
      objectiu: |
        Decidir si $G$ és injectiva a $\mathbb{R}^2$.
      idea: |
        Busqueu una simetria de $G$: quines transformacions del punt deixen $x^2-y^2$ i $2xy$ invariants?
      detall: |
        $G(-x,-y)=G(x,y)$ i $(x,y)\neq(-x,-y)$ si $(x,y)\neq(0,0)$; per exemple $G(1,0)=G(-1,0)=(1,0)$. No és injectiva.
      fuites:
      - G\s*\(\s*-\s*x\s*,\s*-\s*y\s*\)
      - G\s*\(\s*-\s*1\s*,\s*0\s*\)
      - no\s+és\s+injectiva
      teoria: []
    - id: concloure
      titol: Conclusió
      objectiu: |
        Decidir si $G:\mathbb{R}^2\to G(\mathbb{R}^2)$ és un canvi de variables.
      idea: |
        Un difeomorfisme ha de ser bijectiu i amb inversa diferenciable.
      detall: |
        Com que no és injectiva, no és un difeomorfisme. A més, a l'origen $\det JG(0,0)=0$, per tant cap inversa local podria ser diferenciable en $G(0,0)=(0,0)$.
      fuites: []
      teoria:
      - T4.9
    errors_comuns:
    - id: oblida_origen
      descripcio: |
        No s'adona que la jacobiana s'anul·la a l'origen.
      pregunta: |
        Hi ha algun punt de $\mathbb{R}^2$ on $\det JG$ valgui zero?
    - id: jacobiana_suficient
      descripcio: |
        Pensa que si $\det JG\neq 0$ a gairebé tot arreu, $G$ és un difeomorfisme.
      pregunta: |
        El teorema de la funció inversa et dona injectivitat a tot $U$ o només en un entorn de cada punt?
    nota_professor: |
      Identificant $(x,y)$ amb $z=x+iy$, $G(z)=z^2$; és l'anàleg quadràtic de l'exemple T4.3 ($z^3$).
  - id: t4-11b
    apartat: b
    tipus: calcul
    enunciat: |
      $U=\{(x,y)\in\mathbb{R}^2\mid x>0\}$;
    teoria:
    - T4.9
    teoria_reservada: []
    resultat:
      valor: |
        Sí que és un difeomorfisme: $\det JG=4(x^2+y^2)>0$ a $U$ i $G$ és injectiva a $U$. La imatge és $G(U)=\mathbb{R}^2\setminus\{(s,0)\mid s\leq 0\}$.
      fuites:
      - \{\s*\(\s*s\s*,\s*0\s*\)\s*\\mid\s*s\s*(\\le|\\leq|\\leqslant|≤)\s*0
      - semieix\s+(real\s+)?negatiu
    passos:
    - id: jacobiana
      titol: Jacobiana
      objectiu: |
        Comprovar que la diferencial de $G$ és invertible a tot $U$.
      idea: |
        Calculeu $\det JG$ i observeu que l'únic punt problemàtic no és a $U$.
      detall: |
        $\det JG(x,y)=4(x^2+y^2)$, que és $>0$ a $U$ perquè l'origen no hi pertany.
      fuites:
      - 4\s*\(\s*x\s*\^\s*\{?2\}?\s*\+\s*y\s*\^\s*\{?2\}?\s*\)
      teoria: []
    - id: injectivitat
      titol: Injectivitat a U
      objectiu: |
        Provar que $G$ és injectiva al semiplà $x>0$.
      idea: |
        Si $G(a,b)=G(c,d)$, la suma dels quadrats de les components de la imatge dona informació sobre la norma; combineu-ho amb la primera component.
      detall: |
        Si $G(a,b)=G(c,d)$, com que $(x^2-y^2)^2+(2xy)^2=(x^2+y^2)^2$, tenim $a^2+b^2=c^2+d^2$. Sumant amb $a^2-b^2=c^2-d^2$: $a^2=c^2$, i com que $a,c>0$, $a=c$. De $2ab=2cd$ amb $a=c\neq 0$, $b=d$. Per tant $G|_U$ és injectiva.
      fuites:
      - a\s*\^\s*\{?2\}?\s*\+\s*b\s*\^\s*\{?2\}?\s*=\s*c\s*\^\s*\{?2\}?\s*\+\s*d\s*\^\s*\{?2\}?
      - \(\s*x\s*\^\s*\{?2\}?\s*\+\s*y\s*\^\s*\{?2\}?\s*\)\s*\^\s*\{?2
      teoria: []
    - id: concloure
      titol: Conclusió i imatge
      objectiu: |
        Concloure si $G:U\to G(U)$ és un canvi de variables i descriure $G(U)$.
      idea: |
        Una aplicació $\mathcal{C}^1$ injectiva en un obert amb jacobiana invertible a cada punt és un difeomorfisme sobre la seva imatge. Per la imatge, penseu en polars: què fa $G$ amb el mòdul i amb l'angle?
      detall: |
        $G$ és $\mathcal{C}^\infty$, injectiva a $U$ i amb $\det JG\neq 0$; pel teorema de la funció inversa $G(U)$ és obert i la inversa és $\mathcal{C}^\infty$: és un difeomorfisme. En polars, $G(\rho\cos t,\rho\sin t)=(\rho^2\cos 2t,\rho^2\sin 2t)$; $U$ correspon a $t\in(-\frac{\pi}{2},\frac{\pi}{2})$, per tant $2t\in(-\pi,\pi)$ i $G(U)=\mathbb{R}^2\setminus\{(s,0)\mid s\leq 0\}$.
      fuites:
      - \{\s*\(\s*s\s*,\s*0\s*\)\s*\\mid\s*s\s*(\\le|\\leq|\\leqslant|≤)\s*0
      - \(\s*-\s*\\pi\s*,\s*\\pi\s*\)
      teoria:
      - T4.9
      - T4.5
    errors_comuns:
    - id: injectivitat_per_jacobiana
      descripcio: |
        Dedueix la injectivitat a partir de $\det JG\neq 0$.
      pregunta: |
        A l'apartat (a), fora de l'origen el determinant tampoc s'anul·la. Era injectiva allà?
    - id: arrel_signe
      descripcio: |
        De $a^2=c^2$ conclou $a=c$ sense usar que $a,c>0$.
      pregunta: |
        Quina hipòtesi sobre els punts de $U$ estàs fent servir per passar de $a^2=c^2$ a $a=c$?
    nota_professor: |
      En complex: $z^2=w^2\iff(z-w)(z+w)=0$, i si $\mathrm{Re}\,z,\mathrm{Re}\,w>0$ aleshores $z+w\neq 0$.
  - id: t4-11c
    apartat: c
    tipus: calcul
    enunciat: |
      $U=\{(x,y)\in\mathbb{R}^2\mid |y|>|x|\}$;
    teoria:
    - T4.9
    teoria_reservada: []
    resultat:
      valor: |
        No és un difeomorfisme: tot i que $\det JG\neq 0$ a $U$ (l'origen no hi és), $U$ és simètric respecte de l'origen i $G(-x,-y)=G(x,y)$, així que $G|_U$ no és injectiva (per exemple $G(0,1)=G(0,-1)=(-1,0)$).
      fuites:
      - no\s+és\s+(un\s+)?(canvi|difeomorfisme)
      - G\s*\(\s*0\s*,\s*-\s*1\s*\)
    passos:
    - id: jacobiana
      titol: Jacobiana
      objectiu: |
        Estudiar si la diferencial de $G$ és invertible a $U$.
      idea: |
        Calculeu $\det JG$ i comproveu si el punt on s'anul·la pertany a $U$.
      detall: |
        $\det JG(x,y)=4(x^2+y^2)$, només nul a l'origen, que no és de $U$ (allà $|y|=|x|$). Per tant $G$ és un difeomorfisme local a cada punt de $U$.
      fuites:
      - 4\s*\(\s*x\s*\^\s*\{?2\}?\s*\+\s*y\s*\^\s*\{?2\}?\s*\)
      teoria:
      - T4.5
    - id: injectivitat
      titol: Injectivitat a U
      objectiu: |
        Decidir si $G$ és injectiva a $U$.
      idea: |
        Mireu si $U$ és invariant per alguna transformació que deixi $G$ invariant.
      detall: |
        Si $(x,y)\in U$ aleshores $(-x,-y)\in U$, i $G(-x,-y)=G(x,y)$. Per exemple $(0,1),(0,-1)\in U$ i $G(0,1)=G(0,-1)=(-1,0)$. No és injectiva.
      fuites:
      - G\s*\(\s*0\s*,\s*-\s*1\s*\)
      - \(\s*-\s*x\s*,\s*-\s*y\s*\)\s*\\in\s*U
      - no\s+és\s+injectiva
      teoria: []
    - id: concloure
      titol: Conclusió
      objectiu: |
        Decidir si $G:U\to G(U)$ és un canvi de variables.
      idea: |
        Un difeomorfisme ha de ser, en particular, bijectiu sobre la imatge.
      detall: |
        Com que $G|_U$ no és injectiva, no és un difeomorfisme, encara que sigui difeomorfisme local a cada punt. (La imatge és el semiplà $\{(s,t)\mid s<0\}$, i cada punt hi té exactament dues antiimatges, una a cada component connexa de $U$.)
      fuites: []
      teoria:
      - T4.9
    errors_comuns:
    - id: jacobiana_suficient
      descripcio: |
        Conclou que és un difeomorfisme perquè $\det JG\neq 0$ a tot $U$.
      pregunta: |
        Has comprovat que dos punts diferents de $U$ no puguin tenir la mateixa imatge?
    - id: no_veu_simetria
      descripcio: |
        No s'adona que $U$ té dues components simètriques respecte de l'origen.
      pregunta: |
        Si $(x,y)$ és de $U$, què pots dir del punt $(-x,-y)$?
    nota_professor: |
      Restringit a una sola component, per exemple $\{y>|x|\}$, sí que seria un difeomorfisme (està dins del semiplà $y>0$, on $G$ és injectiva pel mateix argument que a (b)).
  - id: t4-11d
    apartat: d
    tipus: calcul
    enunciat: |
      $U=\{(x,y)\in\mathbb{R}^2\mid x>0,\ y>0\}$.
    teoria:
    - T4.9
    teoria_reservada: []
    resultat:
      valor: |
        Sí que és un difeomorfisme: $\det JG=4(x^2+y^2)\neq 0$ a $U$ i $G$ és injectiva a $U$ (perquè $U\subseteq\{x>0\}$, apartat (b)). La imatge és el semiplà superior $G(U)=\{(s,t)\in\mathbb{R}^2\mid t>0\}$.
      fuites:
      - \{\s*\(\s*s\s*,\s*t\s*\)[^$]{0,40}t\s*>\s*0
      - semipl[àa]\s+superior
      - semipl[àa]\s*\$?\s*\{?\s*(t|y)\s*>\s*0
    passos:
    - id: jacobiana
      titol: Jacobiana
      objectiu: |
        Comprovar que la diferencial de $G$ és invertible a tot $U$.
      idea: |
        Calculeu $\det JG$; l'origen no és a $U$.
      detall: |
        $\det JG(x,y)=4(x^2+y^2)>0$ a $U$.
      fuites:
      - 4\s*\(\s*x\s*\^\s*\{?2\}?\s*\+\s*y\s*\^\s*\{?2\}?\s*\)
      teoria: []
    - id: injectivitat
      titol: Injectivitat a U
      objectiu: |
        Provar que $G$ és injectiva al primer quadrant obert.
      idea: |
        Relacioneu $U$ amb un dels oberts dels apartats anteriors.
      detall: |
        $U\subseteq\{x>0\}$, i a l'apartat (b) hem vist que $G$ és injectiva a $\{x>0\}$; per tant també ho és a $U$. (Directament: $G(a,b)=G(c,d)$ dona $a^2+b^2=c^2+d^2$ i $a^2-b^2=c^2-d^2$, d'on $a=c$ i $b=d$ per positivitat.)
