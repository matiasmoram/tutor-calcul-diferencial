    errors_comuns:
    - id: no_obert_implica_tancat
      descripcio: |
        Conclou que un conjunt és tancat perquè no és obert (o a l'inrevés).
      pregunta: |
        Ser obert i ser tancat són propietats complementàries? Pot un conjunt no ser ni una cosa ni l'altra?
    - id: imatge_vs_antiimatge
      descripcio: |
        Aplica el teorema al revés: dedueix propietats de la imatge per $\det$ en lloc de l'antiimatge, o pensa que $\det$ de tancat és tancat.
      pregunta: |
        El resultat que estàs usant parla d'imatges o d'antiimatges per una funció contínua?
    - id: tancat_implica_compacte
      descripcio: |
        Diu que $C_2$ és compacte perquè és tancat.
      pregunta: |
        A $\mathbb{R}^4$, quines dues condicions caracteritzen els compactes? Les has comprovat totes dues per a aquest conjunt?
    - id: fitat_falsament
      descripcio: |
        Creu que $\det A=1$ obliga les entrades a ser petites.
      pregunta: |
        Pots trobar matrius amb determinant fix però amb alguna entrada tan gran com vulguis?
    nota_professor: |
      Cap dels tres és alhora obert i tancat, coherent amb que $\mathbb{R}^4$ és connex i cap és buit ni tot l'espai.
- num: 19
  font: null
  preambul: |
    Volem demostrar que el conjunt $O_2(\mathbb{R})=\{A\in M_2(\mathbb{R})\,:\,A^T\cdot A=I\}$ és un compacte de $M_2(\mathbb{R})$.
  indicacio: |
    Comentaris: els resultats anteriors es poden generalitzar al cas $M_n(\mathbb{R})$, $n\in\mathbb{N}$.
    El conjunt $O_2(\mathbb{R})$, amb l'operació producte de matrius, s'anomena grup ortogonal de dimensió 2. Els seus elements són les matrius ortogonals i ens descriuen els girs i les simetries al pla.
  exercicis:
  - id: t2-19a
    apartat: a
    tipus: teoric
    enunciat: |
      Useu la funció $g:M_2(\mathbb{R})\to M_2(\mathbb{R})$, tal que $g(A)=A\cdot A^T$, per demostrar que $O_2(\mathbb{R})$ és tancat.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        Per a matrius quadrades, $A^TA=I\Leftrightarrow AA^T=I$ (la inversa per l'esquerra és també per la dreta), per tant $O_2(\mathbb{R})=g^{-1}(\{I\})$. Amb $A=\begin{pmatrix}a&c\\b&d\end{pmatrix}$, $g(A)=\begin{pmatrix}a^2+c^2&ab+cd\\ab+cd&b^2+d^2\end{pmatrix}$: les components de $g$ (via $F$) són polinomis, per tant $g$ és contínua. Com que $\{I\}$ és tancat, $g^{-1}(\{I\})$ és tancat.
      fuites: []
    passos:
    - id: reescriure
      titol: Expressar $O_2(\mathbb{R})$ amb $g$
      objectiu: |
        Expressar $O_2(\mathbb{R})$ en termes de la funció $g$.
      idea: |
        La definició usa $A^T A$ i $g$ usa $AA^T$: cal relacionar les dues condicions. Per a matrius quadrades, una inversa per l'esquerra és també inversa per la dreta.
      detall: |
        Si $A^TA=I$, aleshores $(\det A)^2=\det(A^T)\det A=1$, de manera que $A$ és invertible i $A^T=A^T(AA^{-1})=(A^TA)A^{-1}=A^{-1}$; per tant també $AA^T=I$. Recíprocament, si $AA^T=I$, el mateix argument dona $A^T=A^{-1}$ i $A^TA=I$. Per tant $O_2(\mathbb{R})=\{A:g(A)=I\}=g^{-1}(\{I\})$.
      fuites:
      - g\^\{-1\}\s*\(\s*\\\{\s*I\s*\\\}
      teoria: []
    - id: g_continua
      titol: Continuïtat de $g$
      objectiu: |
        Justificar que $g$ és contínua.
      idea: |
        Calcular $g(A)$ en coordenades: cada component és un polinomi en $a,b,c,d$, i una funció vectorial és contínua si ho són les seves components.
      detall: |
        $g(A)=\begin{pmatrix}a^2+c^2&ab+cd\\ab+cd&b^2+d^2\end{pmatrix}$, és a dir, $F\circ g\circ F^{-1}(a,b,c,d)=(a^2+c^2,\,ab+cd,\,ab+cd,\,b^2+d^2)$. Les coordenades $a,b,c,d$ són funcions lineals de $\mathbb{R}^4$, per tant contínues (exemple 27 i proposició 28); cada component $h_i$ és suma de productes de coordenades, contínua per la proposició 20(i)(ii). Aleshores $F\circ g\circ F^{-1}=\sum_{i=1}^4 h_i\,e_i$ és contínua, també per la proposició 20(i)(ii) (funció escalar contínua per un vector constant, i sumes); per tant $g$ és contínua.
      fuites:
      - a\^\{?2\}?\s*\+\s*c\^\{?2\}?
      teoria:
      - T2.20
      - T2.27
      - T2.28
    - id: tancat
      titol: Antiimatge d'un tancat
      objectiu: |
        Concloure que $O_2(\mathbb{R})$ és tancat.
      idea: |
        Caracterització de la continuïtat per tancats, amb la funció definida a tot l'espai.
      detall: |
        Un punt $\{I\}$ és tancat a $M_2(\mathbb{R})\cong\mathbb{R}^4$. Pel teorema 17(d) amb $\Omega=M_2(\mathbb{R})$, $g^{-1}(\{I\})=D$ és tancat. Per tant $O_2(\mathbb{R})$ és tancat.
      fuites: []
      teoria:
      - T2.17
    errors_comuns:
    - id: confon_AtA_AAt
      descripcio: |
        Escriu $O_2(\mathbb{R})=g^{-1}(\{I\})$ sense observar que la definició usa $A^TA$ i $g$ usa $AA^T$.
      pregunta: |
        La condició que defineix el conjunt i la que dona $g(A)=I$ són literalment la mateixa? Per què són equivalents?
    - id: antiimatge_de_quin
      descripcio: |
        No identifica quin conjunt tancat del codomini es pren (o pren l'antiimatge d'un conjunt que no és tancat).
      pregunta: |
        Quin subconjunt de $M_2(\mathbb{R})$ has de prendre perquè la seva antiimatge sigui exactament $O_2(\mathbb{R})$? És tancat?
    - id: continuitat_g
      descripcio: |
        Afirma que $g$ és contínua sense justificar-ho, o diu que és lineal.
      pregunta: |
        $g(2A)$ és igual a $2g(A)$? Com justificaries la continuïtat de $g$, doncs?
    nota_professor: |
      Alternativament, $O_2(\mathbb{R})=h^{-1}(\{I\})$ amb $h(A)=A^TA$, sense necessitat de l'equivalència; l'enunciat proposa $g$, cosa que obliga a observar $A^TA=I\Leftrightarrow AA^T=I$.
  - id: t2-19b
    apartat: b
    tipus: teoric
    enunciat: |
      Demostreu que $O_2(\mathbb{R})$ està contingut en $S(0,\sqrt{2})$. És una inclusió estricta?
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        Si $A^TA=I$, les columnes $(a,b)$ i $(c,d)$ són ortonormals: $a^2+b^2=1$, $c^2+d^2=1$, $ac+bd=0$. Per tant $\|F(A)\|^2=a^2+b^2+c^2+d^2=2$, és a dir $A\in S(0,\sqrt2)$. La inclusió és estricta: $A=\begin{pmatrix}\sqrt2&0\\0&0\end{pmatrix}$ té $\|F(A)\|=\sqrt2$ però $A^TA\neq I$ ($\det A=0$).
      fuites:
      - és\s+(una\s+inclusió\s+)?estricta(?!\s*\?)
      - no\s+(és\s+)?(una\s+)?igualtat
    passos:
    - id: coordenades
      titol: Traduir la condició a coordenades
      objectiu: |
        Escriure què diu $A^TA=I$ sobre les entrades $a,b,c,d$.
      idea: |
        Les entrades de $A^TA$ són els productes escalars de les columnes de $A$.
      detall: |
        $A^TA=\begin{pmatrix}a^2+b^2&ac+bd\\ac+bd&c^2+d^2\end{pmatrix}=I$ dona $a^2+b^2=1$, $c^2+d^2=1$, $ac+bd=0$.
      fuites:
      - a\^\{?2\}?\s*\+\s*b\^\{?2\}?\s*=\s*1
      teoria: []
    - id: norma
      titol: Calcular la norma
      objectiu: |
        Calcular la norma euclidiana de $F(A)$ per a $A\in O_2(\mathbb{R})$.
      idea: |
        Sumar les condicions obtingudes i comparar amb la definició d'esfera $S(0,r)=\{x:\|x\|=r\}$.
      detall: |
        $\|F(A)\|^2=a^2+b^2+c^2+d^2=1+1=2$, per tant $\|F(A)\|=\sqrt2$ i $A\in S(0,\sqrt2)$.
      fuites:
      - a\^\{?2\}?\s*\+\s*b\^\{?2\}?\s*\+\s*c\^\{?2\}?\s*\+\s*d\^\{?2\}?\s*=\s*(1\s*\+\s*1\s*=\s*)?2
      teoria: []
    - id: estricta
      titol: Comparar els dos conjunts
      objectiu: |
        Decidir si tot punt de $S(0,\sqrt2)$ correspon a una matriu de $O_2(\mathbb{R})$.
      idea: |
        Només s'ha usat la suma de dues de les tres condicions; buscar un punt de l'esfera que en falli alguna.
      detall: |
        $A=\begin{pmatrix}\sqrt2&0\\0&0\end{pmatrix}$, és a dir $F(A)=(\sqrt2,0,0,0)$, té norma $\sqrt2$ però $a^2+b^2=2\neq1$ (de fet $\det A=0$, i una matriu ortogonal té $\det=\pm1$). Per tant la inclusió és estricta.
      fuites:
      - \(\s*\\sqrt\{?2\}?\s*,\s*0\s*,\s*0\s*,\s*0\s*\)
      - \\sqrt\{?2\}?\s*&\s*0\s*\\\\\s*0\s*&\s*0
      teoria: []
    errors_comuns:
    - id: files_vs_columnes
      descripcio: |
        Calcula malament $A^TA$ (per exemple, confon files i columnes o obté només dues condicions).
      pregunta: |
        Quina és l'entrada $(1,2)$ de $A^TA$? Quantes condicions independents en surten?
    - id: esfera_vs_bola
      descripcio: |
        Confon l'esfera $S(0,\sqrt2)$ amb la bola, o demostra només $\|F(A)\|\le\sqrt2$.
      pregunta: |
        Què significa exactament $S(0,\sqrt2)$? N'hi ha prou amb una desigualtat?
    - id: reciproc_sense_contraexemple
      descripcio: |
        Respon la segona pregunta sense donar cap matriu concreta que ho justifiqui.
      pregunta: |
        Per justificar la resposta a la segona pregunta, quin tipus d'argument necessites: una demostració general o un exemple concret?
    nota_professor: |
      $O_2(\mathbb{R})$ és la unió de dues circumferències (girs i simetries) dins de l'esfera tridimensional $S(0,\sqrt2)\subset\mathbb{R}^4$. Cal la norma euclidiana a $\mathbb{R}^4$ (norma de Frobenius).
  - id: t2-19c
    apartat: c
    tipus: teoric
    enunciat: |
      Deduïu-ne la compacitat de $O_2(\mathbb{R})$.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        Per (a), $O_2(\mathbb{R})$ és tancat; per (b), $O_2(\mathbb{R})\subseteq S(0,\sqrt2)\subseteq B(0,2)$, per tant és fitat. Per Heine-Borel (via la identificació $F$ amb $\mathbb{R}^4$), $O_2(\mathbb{R})$ és compacte.
      fuites: []
    passos:
    - id: fitat
      titol: Fitació
      objectiu: |
        Suposant demostrats (a) i (b), veure que $O_2(\mathbb{R})$ és fitat.
      idea: |
        Usar la definició de conjunt fitat amb una bola que contingui l'esfera de l'apartat (b).
      detall: |
        $O_2(\mathbb{R})\subseteq S(0,\sqrt2)\subseteq B(0,2)$, ja que $\sqrt2<2$. Per tant és fitat.
      fuites: []
      teoria:
      - T1.33
    - id: heine_borel
      titol: Aplicar Heine-Borel
      objectiu: |
        Concloure la compacitat.
      idea: |
        A $\mathbb{R}^n$, tancat i fitat equival a compacte.
      detall: |
        Per (a) és tancat i acabem de veure que és fitat; com que $F$ identifica $M_2(\mathbb{R})$ amb $\mathbb{R}^4$, pel teorema de Heine-Borel $O_2(\mathbb{R})$ és compacte.
      fuites: []
      teoria:
      - T1.34
    errors_comuns:
    - id: nomes_fitat
      descripcio: |
        Conclou compacitat només de la fitació (o només del tancament).
      pregunta: |
        El teorema de Heine-Borel té dues hipòtesis. D'on surt cadascuna en aquest problema?
    - id: espai_general
      descripcio: |
        Aplica "tancat i fitat implica compacte" sense indicar que estem a un espai de dimensió finita ($\mathbb{R}^4$).
      pregunta: |
        En un espai mètric qualsevol, tancat i fitat implica compacte? Què fa que aquí sí que funcioni?
    nota_professor: |
      Alternativa: $O_2(\mathbb{R})$ és un tancat dins del compacte $\overline{B}(0,\sqrt2)$ (lema 28 del Tema 1).
- num: 20
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t2-20
    apartat: null
    tipus: teoric
    enunciat: |
      Doneu un exemple de dues funcions $f,g:A\subset\mathbb{R}^m\to\mathbb{R}$ uniformement contínues, tals que el producte $h=f\cdot g$ no ho sigui.
    teoria:
    - T2.25
    teoria_reservada: []
    resultat:
      valor: |
        $m=1$, $A=\mathbb{R}$, $f(x)=g(x)=x$. $f$ és uniformement contínua (amb $\delta=\varepsilon$), però $h(x)=x^2$ no ho és: per a $\varepsilon=1$ i qualsevol $\delta>0$, $x=\frac1\delta$, $y=\frac1\delta+\frac\delta2$ compleixen $|x-y|<\delta$ i $|x^2-y^2|=\frac\delta2\left(\frac2\delta+\frac\delta2\right)=1+\frac{\delta^2}4\geq1$.
      fuites:
      - f\(x\)\s*=\s*g\(x\)\s*=\s*x\b
      - h\(x\)\s*=\s*x\^\{?2\}?
      - f\(x\)\s*=\s*x\s*\$?\s*(i|,)\s*\$?\s*g\(x\)\s*=\s*x\b
    passos:
    - id: on_buscar
      titol: On buscar l'exemple
      objectiu: |
        Entendre quina característica han de tenir $f$ i $g$ perquè el producte pugui deixar de ser uniformement continu.
      idea: |
        Mirar què passa si $f$ i $g$ són fitades: estimar $|f(x)g(x)-f(y)g(y)|$ sumant i restant un terme creuat. Si això ja dona continuïtat uniforme, l'exemple ha de tenir funcions no fitades (domini no fitat).
      detall: |
        Si $|f|,|g|\leq K$: $|fg(x)-fg(y)|\leq K|f(x)-f(y)|+K|g(x)-g(y)|$, i $h$ seria uniformement contínua. Cal, doncs, funcions no fitades: la més senzilla és la identitat $f(x)=g(x)=x$ a $A=\mathbb{R}$.
      fuites:
      - f\(x\)\s*=\s*g\(x\)\s*=\s*x\b
      - f\(x\)\s*=\s*x\s*\$?\s*(i|,)\s*\$?\s*g\(x\)\s*=\s*x\b
      teoria:
      - T2.25
    - id: f_uniforme
      titol: Les funcions són uniformement contínues
      objectiu: |
        Demostrar que les funcions triades són uniformement contínues.
      idea: |
        Aplicar la definició: trobar un $\delta$ que només depengui de $\varepsilon$.
      detall: |
        Per a $f(x)=x$: donat $\varepsilon>0$, prenem $\delta=\varepsilon$; si $|x-y|<\delta$, $|f(x)-f(y)|=|x-y|<\varepsilon$.
      fuites:
      - \\delta\s*=\s*\\(var)?epsilon
      teoria:
      - T2.25
    - id: negacio
      titol: Negar la continuïtat uniforme del producte
      objectiu: |
        Escriure què cal demostrar per veure que $h$ no és uniformement contínua.
      idea: |
        Negar la definició amb els quantificadors en ordre: existeix un $\varepsilon$ per al qual cap $\delta$ funciona.
      detall: |
        Cal: $\exists\varepsilon>0$ tal que $\forall\delta>0$ $\exists x,y\in A$ amb $|x-y|<\delta$ i $|h(x)-h(y)|\geq\varepsilon$.
      fuites: []
      teoria:
      - T2.25
    - id: parells
      titol: Construir els parells de punts
      objectiu: |
        Per a cada $\delta>0$, trobar dos punts propers on $h$ prengui valors allunyats.
      idea: |
        Factoritzar la diferència de valors de $h$: un factor és $|x-y|$ i l'altre creix amb la mida dels punts. Prendre punts lluny de l'origen, tant més lluny com més petit sigui $\delta$.
      detall: |
        $\varepsilon=1$, $x=\frac1\delta$, $y=\frac1\delta+\frac\delta2$: $|x-y|=\frac\delta2<\delta$ i $|x^2-y^2|=|x-y|\,|x+y|=\frac\delta2\left(\frac2\delta+\frac\delta2\right)=1+\frac{\delta^2}4\geq1$.
      fuites:
      - x\s*=\s*\\[dt]?frac\s*\{?1\}?\s*\{?\\delta\}?
      - 1\s*\+\s*\\frac\{\\delta\^\{?2\}?\}\{4\}
      teoria:
      - T2.25
    errors_comuns:
    - id: domini_fitat
      descripcio: |
        Proposa funcions sobre un domini compacte o fitat (per exemple $[0,1]$), on el producte acaba sent uniformement continu.
      pregunta: |
        Si el domini és compacte, què diu el teorema de Heine-Cantor sobre el producte (que és continu)?
    - id: quantificadors
      descripcio: |
        Nega malament la definició: tria $\delta$ concret i troba punts, o fa dependre $\varepsilon$ de $\delta$.
      pregunta: |
        A la negació de la continuïtat uniforme, qui es tria primer, $\varepsilon$ o $\delta$? Qui pot dependre de qui?
    - id: punts_fixos
      descripcio: |
        Mostra que la diferència de valors és gran per a uns punts fixos, sense que s'acostin quan $\delta\to0$.
      pregunta: |
        Els punts que tries compleixen $|x-y|<\delta$ per a qualsevol $\delta$ que et donin?
    - id: no_continu
      descripcio: |
        Proposa funcions que no són uniformement contínues (per exemple $1/x$ a $(0,1)$) com a $f$ o $g$.
      pregunta: |
        Has comprovat que cadascuna de les dues funcions que proposes és uniformement contínua per separat?
    nota_professor: |
      Altres exemples: $f(x)=x$, $g(x)=\sin x$ a $\mathbb{R}$ (el producte $x\sin x$ no és uniformement continu). A $\mathbb{R}^m$ val $f=g=x_1$. Evitem citar la definició de Lipschitz de les notes perquè hi apareix amb desigualtat estricta, que falla per a $x=y$.
- num: 21
  font: Exercici d'examen, maig 2000
  preambul: |
    Siguin $F:\mathbb{R}^m\to\mathbb{R}^n$ una funció contínua i $A\subseteq\mathbb{R}^m$ un conjunt fitat.
  indicacio: null
  exercicis:
  - id: t2-21a
    apartat: a
    tipus: teoric
    enunciat: |
      Demostreu que $\overline{F(A)}\subseteq F(\overline{A})$.
    teoria:
    - T1.16
    - T1.33
    - T2.14
    teoria_reservada: []
    resultat:
      valor: |
        $\overline A$ és tancat i fitat (si $A\subseteq B(x,L)$, aleshores $\overline A\subseteq\overline B(x,L)$), per tant compacte per Heine-Borel. Com que $F$ és contínua, $F(\overline A)$ és compacte i, per tant, tancat. Com que $F(A)\subseteq F(\overline A)$ i $\overline{F(A)}$ és el tancat més petit que conté $F(A)$, $\overline{F(A)}\subseteq F(\overline A)$.
      fuites: []
    passos:
    - id: clausura_compacta
      titol: L'adherència d'$A$ és compacta
      objectiu: |
        Obtenir una propietat forta de $\overline{A}$ a partir de la fitació d'$A$.
      idea: |
        Veure que $\overline A$ és tancat i fitat, i aplicar Heine-Borel.
      detall: |
        $\overline A$ és tancat. Si $A\subseteq B(x,L)\subseteq\overline B(x,L)$, que és tancat, aleshores $\overline A\subseteq\overline B(x,L)\subseteq B(x,L+1)$: $\overline A$ és fitat. Per Heine-Borel, $\overline A$ és compacte.
      fuites:
      - \\overline\s*\{?B\}?\s*\(\s*x\s*,\s*L\s*\)
      teoria:
      - T1.16
      - T1.13
      - T1.17
      - T1.33
      - T1.34
    - id: imatge
      titol: La imatge és tancada
      objectiu: |
        Deduir una propietat topològica de $F(\overline A)$.
      idea: |
        La imatge contínua d'un compacte és compacta, i els compactes són tancats.
      detall: |
        Per la proposició 21(i), $F(\overline A)$ és compacte; pel lema 27 del Tema 1, és tancat.
      fuites: []
      teoria:
      - T2.21
      - T1.27
    - id: concloure
      titol: Concloure la inclusió
      objectiu: |
        Comparar $\overline{F(A)}$ amb $F(\overline A)$.
      idea: |
        Usar que l'adherència d'un conjunt és el tancat més petit que el conté.
      detall: |
        $A\subseteq\overline A\Rightarrow F(A)\subseteq F(\overline A)$, i $F(\overline A)$ és tancat; per tant $\overline{F(A)}\subseteq\overline{F(\overline A)}=F(\overline A)$.
      fuites: []
      teoria:
      - T1.17
      - T1.16
    errors_comuns:
    - id: inclusio_inversa
      descripcio: |
        Demostra (o creu demostrar) la inclusió contrària $F(\overline A)\subseteq\overline{F(A)}$, que és la que val sempre per continuïtat.
      pregunta: |
        Quin és el conjunt de l'esquerra i quin el de la dreta a l'enunciat? Quina de les dues inclusions estàs provant?
    - id: no_usa_fitat
      descripcio: |
        Fa una demostració que no usa que $A$ és fitat (i que, per tant, no pot ser correcta, vegeu l'apartat (b)).
      pregunta: |
        On has fet servir que $A$ és fitat? Si no l'has fet servir, la teva demostració també valdria per a conjunts no fitats?
    - id: continua_tanca
      descripcio: |
        Afirma que una funció contínua envia tancats a tancats.
      pregunta: |
        La continuïtat garanteix que les imatges de tancats siguin tancades, o és una propietat de les antiimatges?
    - id: subsuccessio
      descripcio: |
        Amb successions: pren $y_n=F(x_n)\to y$ i suposa que $(x_n)$ convergeix, sense extreure una parcial.
      pregunta: |
        Per què hauria de convergir la successió $(x_n)$? Què et garanteix que en tingui una parcial convergent?
    nota_professor: |
      Alternativa per successions: si $y\in\overline{F(A)}$, $y=\lim F(x_n)$ amb $x_n\in A$; $(x_n)$ és dins del compacte $\overline A$, té una parcial $x_{n_k}\to x\in\overline A$, i per continuïtat $y=F(x)$. La inclusió $F(\overline A)\subseteq\overline{F(A)}$ val sempre per continuïtat, de manera que de fet hi ha igualtat.
  - id: t2-21b
    apartat: b
    tipus: teoric
    enunciat: |
      És cert l'enunciat si $A$ no és fitat?
    teoria:
    - T1.16
    - T1.33
    teoria_reservada: []
    resultat:
      valor: |
        No en general. Contraexemple: $m=n=1$, $F(x)=\frac1{1+x^2}$, $A=\mathbb{R}$ (tancat, no fitat). $F(A)=(0,1]$, $\overline{F(A)}=[0,1]$, però $F(\overline A)=F(\mathbb{R})=(0,1]$; $0\in\overline{F(A)}\setminus F(\overline A)$.
      fuites:
      - \\[dt]?frac\s*\{?1\}?\s*\{\s*1\s*\+\s*x\^\{?2\}?\s*\}
      - (l.enunciat|la\s+inclusió|l.afirmació|el\s+resultat)\s+(ja\s+)?no\s+(és|es|seria)\s+(certa?|vàlida?)
      - no\s+(és\s+)?cert\s+en\s+general
      - deixa\s+de\s+ser\s+cert
    passos:
    - id: on_falla
      titol: Identificar on es fa servir la fitació
      objectiu: |
        Detectar quin pas de la demostració de (a) depèn de la fitació d'$A$ i quin fenomen podria trencar la inclusió.
      idea: |
        Sense fitació, $\overline A$ no és compacte i $F(\overline A)$ pot no ser tancat: cal una funció que s'acosti a un valor quan $|x|\to\infty$ sense assolir-lo.
      detall: |
        La fitació s'usa per tenir $\overline A$ compacte i, per tant, $F(\overline A)$ tancat. Busquem $A$ tancat no fitat ($\overline A=A$) amb $F(A)$ no tancat: una funció contínua amb una asímptota horitzontal que no s'assoleix.
      fuites: []
      teoria:
      - T1.34
      - T2.21
    - id: contraexemple
      titol: Construir el contraexemple
      objectiu: |
        Donar $F$ i $A$ concrets i calcular $\overline{F(A)}$ i $F(\overline A)$.
      idea: |
        Prendre $A$ tot $\mathbb{R}$ i una funció contínua positiva que tendeixi a $0$ a l'infinit.
      detall: |
        $F(x)=\frac1{1+x^2}$, $A=\mathbb{R}=\overline A$. $F(\mathbb{R})=(0,1]$. $0=\lim_n F(n)$ amb $F(n)\in F(A)$, per tant $0\in\overline{F(A)}=[0,1]$, però $0\notin F(\overline A)=(0,1]$.
      fuites:
      - \\[dt]?frac\s*\{?1\}?\s*\{\s*1\s*\+\s*x\^\{?2\}?\s*\}
      - \\arctan\s*\(?\s*x
      - e\^\{?x\}?\b
      - =\s*\(\s*0\s*,\s*1\s*\]
      teoria:
      - T1.19
      - T1.16
    errors_comuns:
    - id: a_no_tancat
      descripcio: |
        Busca el contraexemple amb $A$ obert i confon $F(A)$ amb $F(\overline A)$.
      pregunta: |
        En el teu exemple, quin conjunt és $\overline A$ i quina és la seva imatge? Has comparat amb el conjunt correcte?
    - id: resposta_sense_exemple
      descripcio: |
        Respon només "no, perquè la demostració usa la fitació", sense exemple concret.
      pregunta: |
        Que una demostració concreta deixi de funcionar prova que l'afirmació sigui falsa? Què necessites per refutar-la?
    - id: imatge_tancada
      descripcio: |
        Proposa una funció amb $F(\overline A)$ tancat (per exemple, polinomis a $\mathbb{R}$ amb imatge $\mathbb{R}$ o $[0,\infty)$), que no és contraexemple.
      pregunta: |
        En el teu exemple, la imatge de $\overline A$ és un tancat? Si ho és, pot fallar la inclusió?
    nota_professor: |
      Altres contraexemples: $F(x)=e^x$ o $\arctan x$ a $A=\mathbb{R}$; o $F(x,y)=x$ amb $A=\{xy=1\}$ (tancat no fitat), $F(A)=\mathbb{R}\setminus\{0\}$.
- num: 22
  font: Exercici d'examen, maig 2000
  preambul: ''
  indicacio: null
  exercicis:
  - id: t2-22
    apartat: null
    tipus: teoric
    enunciat: |
      Sigui $f:\mathbb{R}^2\to\mathbb{R}$ definida per
      $$f(x,y)=\begin{cases}0 & \text{si } y\neq0\\ 1+x^2 & \text{si } y=0.\end{cases}$$
      Demostreu que $f$ no és contínua trobant un $A\subseteq\mathbb{R}$ tancat tal que $f^{-1}(A)$ no sigui tancat.
      Escriviu el resultat teòric que utilitzeu, i demostreu explícitament que $f^{-1}(A)$ no és tancat.
    teoria:
    - T1.11
    - T2.14
    teoria_reservada: []
    resultat:
      valor: |
        Teorema 17 ((a)$\Leftrightarrow$(d)) amb $\Omega=\mathbb{R}^2$: $f$ contínua $\Leftrightarrow$ $f^{-1}(E)$ tancat per a tot tancat $E\subseteq\mathbb{R}$. Prenem $A=\{0\}$ (tancat): com que $1+x^2\neq0$, $f^{-1}(\{0\})=\{(x,y):y\neq0\}$. No és tancat: $(0,\frac1n)\in f^{-1}(\{0\})$ i $(0,\frac1n)\to(0,0)\notin f^{-1}(\{0\})$. Per tant $f$ no és contínua.
      fuites:
      - A\s*=\s*\\\{\s*0\s*\\\}
      - f\^\{-1\}\s*\(\s*\\\{\s*0\s*\\\}\s*\)\s*=
    passos:
    - id: teorema
      titol: Resultat teòric
      objectiu: |
        Enunciar el resultat que relaciona la continuïtat amb antiimatges de tancats, adaptat a una funció definida a tot $\mathbb{R}^2$.
      idea: |
        Caracterització de la continuïtat per tancats (teorema de caracteritzacions de la continuïtat), amb $\Omega=\mathbb{R}^2$.
      detall: |
        Teorema 17, (a)$\Leftrightarrow$(d): $f:\mathbb{R}^2\to\mathbb{R}$ és contínua si i només si per a tot tancat $E\subseteq\mathbb{R}$, $f^{-1}(E)=D\cap\mathbb{R}^2=D$ és tancat. Per tant, n'hi ha prou de trobar un tancat amb antiimatge no tancada.
      fuites: []
      teoria:
      - T2.17
    - id: triar_A
      titol: Triar el tancat
      objectiu: |
        Triar un tancat $A\subseteq\mathbb{R}$ i calcular $f^{-1}(A)$.
      idea: |
        Mirar els valors que pren $f$ i escollir un tancat que capturi només una de les dues "branques" de la definició, de manera que l'antiimatge sigui un conjunt obert gran de $\mathbb{R}^2$.
      detall: |
        $A=\{0\}$, tancat a $\mathbb{R}$. Com que $1+x^2\geq1\neq0$, $f(x,y)=0\Leftrightarrow y\neq0$; per tant $f^{-1}(\{0\})=\{(x,y)\in\mathbb{R}^2:y\neq0\}$, el pla sense l'eix $OX$.
      fuites:
      - A\s*=\s*\\\{\s*0\s*\\\}
      - y\s*\\neq\s*0\s*\\\}
      teoria: []
    - id: no_tancat
      titol: Demostrar que l'antiimatge no és tancada
      objectiu: |
        Demostrar explícitament que $f^{-1}(A)$ no és tancat.
      idea: |
        Caracterització dels tancats per successions: trobar una successió del conjunt que convergeixi a un punt de fora.
      detall: |
        $p_n=(0,\frac1n)\in f^{-1}(\{0\})$ i $p_n\to(0,0)$, però $f(0,0)=1\neq0$, de manera que $(0,0)\notin f^{-1}(\{0\})$. Per la proposició 19(iii) del Tema 1, $f^{-1}(\{0\})$ no és tancat. Per tant $f$ no és contínua.
      fuites:
      - \(\s*0\s*,\s*(\\[dt]?frac\s*\{?1\}?\s*\{?n\}?|1/n)\s*\)
      teoria:
      - T1.19
    errors_comuns:
    - id: tancat_trivial
      descripcio: |
        Tria un tancat com $A=[1,+\infty)$ o $A=\{1\}$, l'antiimatge del qual (l'eix $OX$ o un punt) sí que és tancada.
      pregunta: |
        Calcula l'antiimatge del tancat que has triat: és realment no tancada? Quins valors pren $f$ fora de l'eix?
    - id: obert_no_tancat
      descripcio: |
        Justifica que l'antiimatge no és tancada dient només que és oberta.
      pregunta: |
        Un conjunt obert no pot ser tancat? Pensa en $\mathbb{R}^2$. Què has de mostrar realment?
    - id: imatge_en_lloc_antiimatge
      descripcio: |
        Treballa amb imatges $f(B)$ de tancats de $\mathbb{R}^2$ en lloc d'antiimatges.
      pregunta: |
        El resultat de continuïtat que fas servir parla d'imatges o d'antiimatges? De quin espai ha de ser el tancat?
    nota_professor: |
      També val qualsevol tancat que contingui $0$ i no talli $[1,+\infty)$, com $A=(-\infty,\frac12]$. La discontinuïtat és a tots els punts de l'eix $OX$.
- num: 23
  font: Problema nou (no és de la col·lecció)
  preambul: |
    Certes o falses? Per a cada afirmació, demostreu-la si és certa o doneu-ne un contraexemple justificat si és falsa. A tots els apartats, $f:\mathbb{R}^2\to\mathbb{R}$.
  indicacio: null
  exercicis:
  - id: t2-23a
    apartat: a
    tipus: teoric
    enunciat: |
      Si existeixen els dos límits iterats $\displaystyle\lim_{x\to0}\lim_{y\to0}f(x,y)$ i $\displaystyle\lim_{y\to0}\lim_{x\to0}f(x,y)$ i són iguals, aleshores existeix $\displaystyle\lim_{(x,y)\to(0,0)}f(x,y)$.
    teoria:
    - T2.6
    teoria_reservada:
    - T2.13
    - T2.x3
    resultat:
      valor: |
        Falsa. Contraexemple: $f(x,y)=\frac{xy}{x^2+y^2}$ si $(x,y)\neq(0,0)$, $f(0,0)=0$. Els dos límits iterats existeixen i valen $0$, però sobre la recta $y=mx$ el límit és $\frac{m}{1+m^2}$, que depèn de $m$; per tant no existeix el límit a $(0,0)$.
      fuites:
      - afirmaci[óo]\s+(és\s+)?falsa(?!\s*(\?|o\b))
      - \bés\s+falsa\b(?!\s*(\?|o\b))
      - \bno\s+és\s+certa\b(?!\s*(\?|o\b))
    passos:
    - id: decidir
      titol: Decidir i triar un candidat
      objectiu: |
        Decidir si l'afirmació és certa o falsa i, si cal un contraexemple, triar una funció candidata.
      idea: |
        La teoria només dona una implicació: si hi ha límit doble (i existeixen els límits interiors), els iterats hi coincideixen. Per refutar el recíproc cal una funció que es comporti bé sobre els eixos (així els iterats coincideixen) però que, acostant-se a l'origen per alguna altra corba, doni un valor diferent.
      detall: |
        És falsa. Un candidat: $f(x,y)=\frac{xy}{x^2+y^2}$ si $(x,y)\neq(0,0)$, $f(0,0)=0$. Val $0$ sobre tots dos eixos, però no és constant sobre les rectes per l'origen.
      fuites:
      - \\frac\s*\{\s*x\s*y\s*\}\s*\{\s*x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*\}
      - x\s*y\s*/\s*\(\s*x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*\)
      teoria:
      - T2.12
    - id: iterats
      titol: Calcular els límits iterats
      objectiu: |
        Comprovar que, per a la funció triada, els dos límits iterats existeixen i són iguals.
      idea: |
        Fixar una variable, distingint si el valor fixat és $0$ o no, i calcular el límit d'una variable en l'altra; després fer tendir a $0$ la variable fixada.
      detall: |
        Fixat $y\neq0$: $\lim_{x\to0}\frac{xy}{x^2+y^2}=\frac{0}{y^2}=0$. Fixat $y=0$: $f(x,0)=0$ per a tot $x$, i el límit és $0$. Per tant $\lim_{x\to0}f(x,y)=0$ per a tot $y$ i $\lim_{y\to0}\lim_{x\to0}f(x,y)=0$. Per simetria, $\lim_{x\to0}\lim_{y\to0}f(x,y)=0$.
      fuites: []
      teoria: []
    - id: no_limit
      titol: Veure que no hi ha límit doble
      objectiu: |
        Demostrar que la funció triada no té límit a $(0,0)$.
      idea: |
        Si el límit existís, la restricció a qualsevol corba contínua que passi per l'origen hauria de tendir al mateix valor. N'hi ha prou de trobar una família de corbes on el límit depengui de la corba.
      detall: |
        Sobre $y=mx$: $f(x,mx)=\frac{mx^2}{x^2+m^2x^2}=\frac{m}{1+m^2}$ per a $x\neq0$, que depèn de $m$ (val $0$ per $m=0$ i $\frac{1}{2}$ per $m=1$). Per la proposició del límit per camins, no existeix $\lim_{(x,y)\to(0,0)}f(x,y)$.
      fuites:
      - \\frac\s*\{\s*m\s*\}\s*\{\s*1\s*\+\s*m\^\{?2\}?\s*\}
      - m\s*/\s*\(\s*1\s*\+\s*m\^\{?2\}?\s*\)
      teoria:
      - T2.10
    errors_comuns:
    - id: iterats_impliquen_limit
      descripcio: |
        Creu que si els dos iterats coincideixen el límit doble existeix (confon el resultat de la teoria amb el seu recíproc).
      pregunta: |
        Els límits iterats només miren dues maneres molt concretes d'acostar-se a l'origen. Què et garanteixen sobre totes les altres maneres d'acostar-s'hi?
    - id: iterat_mal_calculat
      descripcio: |
        En calcular un iterat fa tendir les dues variables a $0$ alhora, o oblida el cas en què el valor fixat és $0$.
      pregunta: |
        Quan fixes $y$ i fas tendir $x$ a $0$, el valor de $y$ es mou o queda fix? Què passa si el valor que has fixat és precisament $0$?
    - id: contraexemple_no_compleix_hipotesi
      descripcio: |
        Proposa una funció on els iterats són diferents (per exemple $\frac{x^2-y^2}{x^2+y^2}$) o on no existeixen: no compleix la hipòtesi de l'afirmació.
      pregunta: |
        La funció que proposes, compleix exactament les hipòtesis de l'afirmació? Què diuen els seus dos límits iterats?
    nota_professor: |
      És l'exemple 13 del Tema 2 (reservat). Altres contraexemples vàlids: $\frac{x^2y}{x^4+y^2}$ (iterats $0$, paràbola $y=x^2$ dona $\frac12$), o qualsevol funció nul·la sobre els eixos i sense límit. Accepteu qualsevol contraexemple ben justificat; el detall dels passos usa $\frac{xy}{x^2+y^2}$.
  - id: t2-23b
    apartat: b
    tipus: teoric
    enunciat: |
      Si $f$ és contínua en cada variable per separat, és a dir, per a tot $(x_0,y_0)\in\mathbb{R}^2$ les funcions $x\mapsto f(x,y_0)$ i $y\mapsto f(x_0,y)$ són contínues a $\mathbb{R}$, aleshores $f$ és contínua a $\mathbb{R}^2$.
    teoria:
    - T2.14
    teoria_reservada: []
    resultat:
      valor: |
        Falsa. Contraexemple: $f(x,y)=\frac{xy}{x^2+y^2}$ si $(x,y)\neq(0,0)$, $f(0,0)=0$. És contínua en cada variable per separat (sobre cada recta horitzontal o vertical és un quocient amb denominador no nul, o bé idènticament $0$), però $f(x,x)=\frac12$ per a $x\neq0$, que no tendeix a $f(0,0)=0$: no és contínua a $(0,0)$.
      fuites:
      - afirmaci[óo]\s+(és\s+)?falsa(?!\s*(\?|o\b))
      - \bés\s+falsa\b(?!\s*(\?|o\b))
      - \bno\s+és\s+certa\b(?!\s*(\?|o\b))
    passos:
    - id: decidir
      titol: Decidir i triar un candidat
      objectiu: |
        Decidir si l'afirmació és certa o falsa i, si cal un contraexemple, triar una funció candidata.
      idea: |
        La continuïtat en cada variable només controla què fa $f$ sobre les rectes horitzontals i verticals. Cal una funció que sigui contínua sobre aquestes rectes però que, acostant-se a un punt per una altra direcció, no tendeixi al valor de la funció en aquest punt.
      detall: |
        És falsa. Un candidat: $f(x,y)=\frac{xy}{x^2+y^2}$ si $(x,y)\neq(0,0)$, $f(0,0)=0$ (la mateixa funció de l'apartat (a) serveix).
      fuites:
      - \\frac\s*\{\s*x\s*y\s*\}\s*\{\s*x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*\}
      - x\s*y\s*/\s*\(\s*x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*\)
      teoria: []
    - id: separada
      titol: Continuïtat en cada variable
      objectiu: |
        Comprovar que la funció triada és contínua en cada variable per separat.
      idea: |
        Fixar $y_0$ i distingir dos casos: si $y_0\neq0$, el denominador no s'anul·la mai sobre aquesta recta; si $y_0=0$, mirar directament quins valors pren $f$. Per simetria, el mateix per a $x_0$.
      detall: |
        Si $y_0\neq0$: $x\mapsto\frac{xy_0}{x^2+y_0^2}$ és quocient de polinomis amb denominador $x^2+y_0^2\ge y_0^2>0$, per tant contínua a $\mathbb{R}$. Si $y_0=0$: $f(x,0)=0$ per a tot $x$ (també $x=0$), funció constant. Com que $f(x,y)=f(y,x)$, el mateix val per a $y\mapsto f(x_0,y)$.
      fuites: []
      teoria:
      - T2.20
    - id: discontinua
      titol: Veure que no és contínua
      objectiu: |
        Demostrar que la funció triada no és contínua en algun punt de $\mathbb{R}^2$.
      idea: |
        Per definició, ser contínua a $(0,0)$ vol dir que el límit en aquest punt existeix i val $f(0,0)$. Cal trobar una corba cap a l'origen on la restricció tendeixi a un altre valor.
      detall: |
        Sobre la diagonal, $f(x,x)=\frac{x^2}{2x^2}=\frac12$ per a $x\neq0$, que tendeix a $\frac12\neq0=f(0,0)$. Per la proposició del límit per camins, $\lim_{(x,y)\to(0,0)}f(x,y)$ no pot valer $0$; per tant $f$ no és contínua a $(0,0)$.
      fuites:
      - f\(\s*x\s*,\s*x\s*\)\s*=
      - f\(\s*t\s*,\s*t\s*\)\s*=
      teoria:
      - T2.10
      - T2.14
    errors_comuns:
    - id: separada_implica_conjunta
      descripcio: |
        Creu que la continuïtat en cada variable implica la continuïtat (pensa que acostar-se per les dues direccions dels eixos ja és «acostar-se de totes les maneres»).
      pregunta: |
        La continuïtat en cada variable, quines maneres d'acostar-se a un punt controla? Són totes les maneres possibles?
    - id: oblida_cas_zero
      descripcio: |
        En comprovar la continuïtat separada només tracta el cas $y_0\neq0$ amb la fórmula del quocient i oblida que per $y_0=0$ la fórmula no val a $x=0$.
      pregunta: |
        Quan fixes $y_0=0$, la fórmula del quocient és vàlida per a tots els valors de $x$? Quins valors pren $f$ sobre aquesta recta?
    - id: discontinuitat_per_formula
      descripcio: |
        Argumenta la discontinuïtat dient que «la fórmula no està definida a $(0,0)$», sense comparar cap límit amb $f(0,0)$.
      pregunta: |
        La funció està definida a $(0,0)$? Què has de comparar exactament per decidir si és contínua en aquest punt?
    nota_professor: |
      Qualsevol contraexemple de l'apartat (a) que valgui $0$ als eixos i sigui contínua fora de l'origen serveix. Matís: la continuïtat separada sí que implica que les restriccions als eixos són contínues, però no diu res de les rectes $y=mx$ amb $m\neq0$.
  - id: t2-23c
    apartat: c
    tipus: teoric
    enunciat: |
      Si existeix $\displaystyle\lim_{(x,y)\to(0,0)}f(x,y)=L$, aleshores existeix el límit iterat $\displaystyle\lim_{x\to0}\lim_{y\to0}f(x,y)$ i val $L$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        Falsa. Contraexemple: $f(x,y)=x\sin(1/y)$ si $y\neq0$, $f(x,0)=0$. Com que $|f(x,y)|\le|x|$, el límit a $(0,0)$ existeix i val $0$; però per a cada $x\neq0$ el límit $\lim_{y\to0}x\sin(1/y)$ no existeix, de manera que el límit iterat $\lim_{x\to0}\lim_{y\to0}f(x,y)$ no existeix.
      fuites:
      - afirmaci[óo]\s+(és\s+)?falsa(?!\s*(\?|o\b))
      - \bés\s+falsa\b(?!\s*(\?|o\b))
      - \bno\s+és\s+certa\b(?!\s*(\?|o\b))
    passos:
    - id: decidir
      titol: Decidir i triar un candidat
      objectiu: |
        Decidir si l'afirmació és certa o falsa i, si cal un contraexemple, triar una funció candidata.
      idea: |
        El límit iterat només té sentit si, per a cada $x$ proper a $0$, existeix el límit interior en $y$. El límit doble no obliga que aquest límit interior existeixi: cal una funció que tendeixi a $L$ a l'origen però que, amb $x\neq0$ fix, oscil·li sense límit quan $y\to0$.
      detall: |
        És falsa. Un candidat: $f(x,y)=x\sin(1/y)$ si $y\neq0$, $f(x,0)=0$. El factor $x$ fa que tendeixi a $0$ a l'origen; el factor $\sin(1/y)$ oscil·la quan $y\to0$.
      fuites:
      - x\s*\\sin\s*\(\s*1\s*/\s*y\s*\)
      - \\sin\s*\(?\s*\\frac\s*\{\s*1\s*\}\s*\{\s*y\s*\}
      teoria:
      - T2.12
    - id: limit_doble
      titol: El límit doble existeix
      objectiu: |
        Demostrar que la funció triada té límit a $(0,0)$ i calcular-lo.
      idea: |
        Fitar $|f(x,y)|$ per una expressió que només depengui de la distància a l'origen i que tendeixi a $0$, usant que el sinus està fitat, i aplicar la definició de límit.
      detall: |
        Per a tot $(x,y)$ (també si $y=0$): $|f(x,y)|\le|x|\le\|(x,y)\|$. Donat $\varepsilon>0$, prenent $\delta=\varepsilon$, si $0<\|(x,y)\|<\delta$ aleshores $|f(x,y)-0|<\varepsilon$. Per tant $\lim_{(x,y)\to(0,0)}f(x,y)=0$.
      fuites:
      - \|f\(x,\s*y\)\|\s*(\\le|\\leq|≤)\s*\|x\|
      teoria:
      - T2.6
    - id: interior_no_existeix
      titol: El límit interior no existeix
      objectiu: |
        Veure que, per a $x\neq0$ fix, no existeix $\lim_{y\to0}f(x,y)$, i concloure sobre el límit iterat.
      idea: |
        Usar la caracterització del límit per successions: trobar dues successions $y_n\to0$, $y_n\neq0$, sobre les quals $f(x,y_n)$ tendeix a valors diferents.
      detall: |
        Fixat $x\neq0$, prenem $y_n=\frac{1}{n\pi}$: $f(x,y_n)=x\sin(n\pi)=0$; i $y_n'=\frac{1}{\pi/2+2n\pi}$: $f(x,y_n')=x\neq0$. Totes dues tendeixen a $0$ però donen límits diferents, de manera que $\lim_{y\to0}f(x,y)$ no existeix per a cap $x\neq0$. La funció $x\mapsto\lim_{y\to0}f(x,y)$ no està definida en cap punt proper a $0$ diferent de $0$, i el límit iterat $\lim_{x\to0}\lim_{y\to0}f(x,y)$ no existeix.
      fuites:
      - \\frac\s*\{\s*1\s*\}\s*\{\s*n\s*\\pi\s*\}
      - \\frac\s*\{\s*1\s*\}\s*\{\s*\\pi\s*/\s*2
      - 1\s*/\s*\(?\s*n\s*\\pi
      teoria:
      - T2.6
      - T2.7
    errors_comuns:
    - id: aplica_teorema_sense_hipotesis
      descripcio: |
        Aplica el resultat de la teoria sobre límits iterats sense comprovar que els límits interiors existeixen (és una hipòtesi del resultat).
      pregunta: |
        El resultat de la teoria sobre límits iterats, quines hipòtesis demana a més de l'existència del límit doble? Les has comprovades?
    - id: ordre_equivocat
      descripcio: |
        Calcula l'altre límit iterat, $\lim_{y\to0}\lim_{x\to0}f(x,y)$, que sí que existeix i val $0$, i conclou que l'afirmació és certa.
      pregunta: |
        En quin ordre es prenen els límits a l'afirmació? El límit que has calculat és exactament aquest?
    - id: oscillacio_sense_justificar
      descripcio: |
        Afirma que $\sin(1/y)$ no té límit quan $y\to0$ sense cap justificació.
      pregunta: |
        Com pots justificar amb precisió que una funció d'una variable no té límit en un punt?
    nota_professor: |
      Per a aquest $f$, l'altre iterat sí que existeix: per a $y\neq0$ fix, $x\sin(1/y)\to0$, i $\lim_{y\to0}\lim_{x\to0}f=0$. Si es vol que fallin tots dos iterats: $f(x,y)=x\sin(1/y)+y\sin(1/x)$ (definint $0$ sobre els eixos). Bon moment per remarcar que la Proposició 12 del Tema 2 demana com a hipòtesi que els límits interiors existeixin.
  - id: t2-23d
    apartat: d
    tipus: teoric
    enunciat: |
      Si existeix $\displaystyle\lim_{(x,y)\to(0,0)}f(x,y)=L$ i existeix $\eta>0$ tal que, per a cada $x$ amb $0<|x|<\eta$, existeix $g(x)=\displaystyle\lim_{y\to0}f(x,y)$, aleshores $\displaystyle\lim_{x\to0}g(x)=L$.
    teoria:
    - T2.6
    teoria_reservada:
    - T2.12+dem
    resultat:
      valor: |
        Certa. Donat $\varepsilon>0$, sigui $\delta_1=\delta_1(\varepsilon/2)$ el del límit doble i $\delta=\min\{\eta,\delta_1/\sqrt2\}$. Per a $0<|x|<\delta$, triant $y$ amb $0<|y|<\min\{\delta_2(\varepsilon/2,x),\delta_1/\sqrt2\}$ (on $\delta_2$ és el del límit en $y$), es té $|g(x)-L|\le|g(x)-f(x,y)|+|f(x,y)-L|<\varepsilon$. Per tant $\lim_{x\to0}g(x)=L$.
      fuites:
      - afirmaci[óo]\s+(és\s+)?certa(?!\s*(\?|o\b))
      - (?<!no\s)\bés\s+certa\b(?!\s*(\?|o\b))
    passos:
    - id: plantejar
      titol: Escriure hipòtesis i objectiu
      objectiu: |
        Escriure amb $\varepsilon$ i $\delta$ què diuen les dues hipòtesis i què cal demostrar.
      idea: |
        Aplicar la definició de límit al límit doble (el $\delta$ depèn només de $\varepsilon$) i al límit en $y$ amb $x$ fix (el $\delta$ depèn de $\varepsilon$ i de $x$).
      detall: |
        (H1) $\forall\varepsilon>0\ \exists\delta_1(\varepsilon)>0$: si $0<\|(x,y)\|<\delta_1$, aleshores $|f(x,y)-L|<\varepsilon$. (H2) Per a cada $x$ amb $0<|x|<\eta$: $\forall\varepsilon>0\ \exists\delta_2(\varepsilon,x)>0$: si $0<|y|<\delta_2$, aleshores $|f(x,y)-g(x)|<\varepsilon$. Objectiu: $\forall\varepsilon>0\ \exists\delta>0$: si $0<|x|<\delta$, aleshores $|g(x)-L|<\varepsilon$.
      fuites: []
      teoria:
      - T2.6
    - id: valor_intermedi
      titol: Comparar a través de $f(x,y)$
      objectiu: |
        Trobar com relacionar $g(x)$ amb $L$ fent servir les dues hipòtesis alhora.
      idea: |
        Passar per un valor intermedi $f(x,y)$, amb $y$ auxiliar ben triat, i repartir $\varepsilon$ entre les dues hipòtesis.
      detall: |
        Per a qualsevol $y$, $|g(x)-L|\le|g(x)-f(x,y)|+|f(x,y)-L|$. N'hi ha prou que cada sumand sigui $<\varepsilon/2$ per a algun $y$: el primer el controla (H2) i el segon (H1).
      fuites:
      - \|g\(x\)\s*-\s*f\(x,\s*y\)\|\s*\+\s*\|f\(x,\s*y\)\s*-\s*L\|
      teoria: []
    - id: triar_delta
      titol: Triar $\delta$ i acabar
      objectiu: |
        Triar un $\delta$ que depengui només de $\varepsilon$ i completar la demostració.
      idea: |
        El $\delta$ per a $x$ s'obté del límit doble i de $\eta$; el $y$ auxiliar es tria després de fixar $x$, prou petit per complir les dues condicions alhora. El valor $g(x)$ no depèn de $y$.
      detall: |
        Donat $\varepsilon>0$, sigui $\delta=\min\{\eta,\ \delta_1(\varepsilon/2)/\sqrt{2}\}$. Sigui $0<|x|<\delta$. Triem $y$ amb $0<|y|<\min\{\delta_2(\varepsilon/2,x),\ \delta_1(\varepsilon/2)/\sqrt{2}\}$. Aleshores $0<\|(x,y)\|<\sqrt{2}\cdot\delta_1(\varepsilon/2)/\sqrt{2}=\delta_1(\varepsilon/2)$, per (H1) $|f(x,y)-L|<\varepsilon/2$, i per (H2) $|f(x,y)-g(x)|<\varepsilon/2$. Per tant $|g(x)-L|<\varepsilon$, i com que aquesta desigualtat no depèn de $y$, $\lim_{x\to0}g(x)=L$.
      fuites:
      - \\delta_\{?1\}?\s*\(\s*\\?(epsilon|varepsilon|ε)\s*/\s*2\s*\)\s*/\s*\\sqrt
      teoria: []
    errors_comuns:
    - id: cita_teorema_sense_hipotesis
      descripcio: |
        Cita directament la Proposició 12 del Tema 2, que demana també que existeixin els límits interiors en $x$ (per a cada $y$); aquí només se suposen els límits en $y$. Cal reproduir l'argument.
      pregunta: |
        El resultat de la teoria que vols citar, quines hipòtesis té exactament? Les tens totes a l'enunciat d'aquest apartat?
    - id: delta_depen_de_y
      descripcio: |
        Tria un $\delta$ que depèn de $y$ o de $x$ (per exemple hi fica $\delta_2(\varepsilon,x)$), o fixa $y$ abans de $x$.
      pregunta: |
        El $\delta$ que tries, de quines quantitats depèn? Pot dependre d'alguna variable que encara no has fixat en aquell moment de la demostració?
    - id: usa_y_zero
      descripcio: |
        Pren $y=0$ com a valor intermedi, suposant $f(x,0)=g(x)$: la definició de límit en $y$ no diu res del valor a $y=0$.
      pregunta: |
        La definició de $\lim_{y\to0}f(x,y)$, diu alguna cosa sobre el valor $f(x,0)$?
    nota_professor: |
      És la meitat de la Proposició 12 del Tema 2 (reservada amb la seva demostració): la demostració dels apunts només usa els límits interiors en $y$, que és exactament la hipòtesi d'aquest apartat. Cal que l'estudiant vegi que no pot citar la proposició tal qual, perquè no se suposa res sobre $\lim_{x\to0}f(x,y)$. Combinat amb l'apartat (c), mostra que la hipòtesi sobre els límits interiors és imprescindible.
  - id: t2-23e
    apartat: e
    tipus: teoric
    enunciat: |
      Si existeixen els dos límits iterats a $(0,0)$ i són diferents, aleshores no existeix $\displaystyle\lim_{(x,y)\to(0,0)}f(x,y)$.
    teoria:
    - T2.6
    teoria_reservada: []
    resultat:
      valor: |
        Certa. Si existís $\lim_{(x,y)\to(0,0)}f(x,y)=L$, com que existeixen els límits interiors (si no, els iterats no existirien), l'apartat (d) (o la Proposició 12 del Tema 2) dona que tots dos iterats valen $L$, i per tant serien iguals: contradicció.
      fuites:
      - afirmaci[óo]\s+(és\s+)?certa(?!\s*(\?|o\b))
      - (?<!no\s)\bés\s+certa\b(?!\s*(\?|o\b))
    passos:
    - id: suposar_limit
      titol: Suposar que el límit existeix
      objectiu: |
        Plantejar la demostració i veure què implicaria l'existència del límit doble sobre els dos iterats.
      idea: |
        Reducció a l'absurd: suposar que el límit doble existeix i aplicar l'apartat (d) a cada ordre. Cal comprovar que les hipòtesis sobre els límits interiors es compleixen.
      detall: |
        Suposem $\lim_{(x,y)\to(0,0)}f(x,y)=L$. Que existeixi $\lim_{x\to0}\lim_{y\to0}f(x,y)$ vol dir, en particular, que $g(x)=\lim_{y\to0}f(x,y)$ existeix per a tot $0<|x|<\eta$; per (d), $\lim_{x\to0}g(x)=L$. Intercanviant els papers de $x$ i $y$, també $\lim_{y\to0}\lim_{x\to0}f(x,y)=L$.
      fuites: []
      teoria:
      - T2.12
    - id: contradiccio
      titol: Arribar a contradicció
      objectiu: |
        Concloure a partir del pas anterior.
      idea: |
        Comparar els dos valors obtinguts amb la hipòtesi que els iterats són diferents.
      detall: |
        Tots dos iterats valdrien $L$, i per tant serien iguals, en contra de la hipòtesi. Per tant el límit doble no existeix. (Exemple: $\frac{x^2-y^2}{x^2+y^2}$ té iterats $1$ i $-1$.)
      fuites: []
      teoria: []
    errors_comuns:
    - id: prova_amb_exemple
      descripcio: |
        «Demostra» l'afirmació amb un sol exemple, com ara $\frac{x^2-y^2}{x^2+y^2}$.
      pregunta: |
        Un exemple on passa això, demostra que passa per a qualsevol funció?
    - id: confon_reciproc
      descripcio: |
        Confon l'afirmació amb el seu recíproc o amb la de l'apartat (a), i la considera falsa per l'exemple de l'apartat (a).
      pregunta: |
        Què suposa exactament aquesta afirmació i què en conclou? És la mateixa implicació que la de l'apartat (a)?
    - id: oblida_limits_interiors
      descripcio: |
        Aplica el resultat dels iterats sense observar que l'existència dels iterats ja garanteix la dels límits interiors.
      pregunta: |
        Per poder escriure un límit iterat, què ha d'existir primer? Ho necessites per aplicar el resultat que fas servir?
    nota_professor: |
      És la contrarecíproca de la Proposició 12 del Tema 2 (o de l'apartat (d)). Serveix per tancar el problema: els iterats diferents demostren la no existència; els iterats iguals no demostren res (apartat (a)).
