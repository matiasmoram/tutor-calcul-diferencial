[project]
name = "tutor-calcul-diferencial"
version = "0.1.0"
description = "Socratic tutor for Càlcul Diferencial (FME-UPC)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.9",
    "openai>=1.60",
    "google-genai>=1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1",
    "pyyaml>=6",
    "httpx>=0.27",
    "sympy>=1.13",
    "lark>=1.2",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["backend"]
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108"]
unfixable = ["F401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pyright]
include = ["backend/core", "backend/apps", "backend/settings"]
extraPaths = ["backend"]
venvPath = "."
venv = ".venv"
# sympy's stubs are too imprecise to type-check the CAS code (Basic vs Expr vs Relational on every operation).
ignore = ["backend/core/shared/math"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportMissingTypeArgument = "error"
