    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera de $C$.
      idea: |
        Combinar el que saps de l'interior i de l'adherència.
      detall: |
        Tot punt de $C$ és de la frontera: tota bola el conté i, com que $\mathring{C}=\varnothing$, conté punts de $C^c$. Els punts de fora de $C$ són exteriors perquè $C^c$ és obert. Per tant $\mathrm{Fr}\,C=C$.
