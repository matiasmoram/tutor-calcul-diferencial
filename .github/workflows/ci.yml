name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run pyright
      - run: uv run python scripts/check_fitxes.py
      - name: Schema snapshot matches the code
        run: |
          uv run python scripts/db.py schema > /tmp/schema.sql
          diff -u supabase/schema.sql /tmp/schema.sql

  tests:
    runs-on: ubuntu-latest
    # Each test also has a 300 s pytest-timeout (pyproject.toml).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tutor" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: tutor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # No API keys: the suite uses scripted LLMs. First on SQLite (as in development), then the storage-backed
      # tests again on Postgres, the production engine.
      - run: uv run pytest -q
      - name: Migrations, applied in order to an empty Postgres, match the code
        run: |
          psql -h localhost -U tutor -d tutor -c "create database migrated"
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h localhost -U tutor -d migrated -f "$f"; done
          DATABASE_URL=postgresql+psycopg://tutor:tutor@localhost:5432/migrated uv run python scripts/db.py check-migrations
      - name: Tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tutor:tutor@localhost:5432/tutor
        run: uv run pytest -q backend/tests/core backend/tests/scripts

  docker:
    runs-on: ubuntu-latest
    needs: [checks, tests]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tutor-calcul .
      # The image must start: the start-up checks (course YAML, counterexample theory citations, seeding) run before
      # /health answers. The key is a placeholder (the OpenAI client needs one to be built; nothing calls the model)
      # and the database is a throwaway SQLite file in the container. 512 MB as on the Render free plan.
      - name: Container starts and answers /health
        run: |
          docker run -d --name app -m 512m -p 8000:8000 -e LLM_PROVIDER=openai -e OPENAI_API_KEY=sk-ci-placeholder \
            -e DATABASE_URL=sqlite:////tmp/tutor.db tutor-calcul
          for i in $(seq 60); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then break; fi
            sleep 2
          done
          docker logs app
          exit 1
