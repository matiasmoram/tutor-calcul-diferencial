    - id: punts_critics
      titol: Trobar els punts crítics
      objectiu: |
        Trobar tots els punts on s'anul·la el gradient de $f$.
      idea: |
        Factoritzar l'equació $f_y=0$ i estudiar cada factor juntament amb $f_x=0$.
      detall: |
        $f_x=2x+y^2$, $f_y=2xy+4y^3=2y(x+2y^2)$. Si $y=0$, $f_x=0$ dona $x=0$. Si $x=-2y^2$, $f_x=-4y^2+y^2=-3y^2=0$, d'on $y=0$ i $x=0$. Únic punt crític: $(0,0)$.
      fuites:
      - -\s*3\s*y\^\{?2
      teoria:
      - T5.22
    - id: hessiana
      titol: Hessiana
      objectiu: |
        Calcular la hessiana al punt crític i veure si el criteri decideix.
      idea: |
