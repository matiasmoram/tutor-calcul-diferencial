      descripcio: |
        Creu que, com que existeixen les derivades parcials a l'origen, $f$ hi és diferenciable i la regla de la cadena s'hi pot aplicar.
      pregunta: |
        Quina hipòtesi sobre $f$ demana exactament la regla de la cadena? L'existència de parcials és suficient per tenir-la?
    - id: oblida_cas_origen
      descripcio: |
        Usa la fórmula $\frac{x^2y}{x^2+y^2}$ també a l'origen o no comprova que $(f\circ\gamma)(0)=0$.
