      objectiu: |
        Detectar la indeterminació $0/0$ i obtenir un candidat a límit amb algun camí.
      idea: |
        Provar camins, especialment els adaptats a l'estructura del denominador: camins on $x^4$ i $y^2$ tinguin el mateix ordre de magnitud.
      detall: |
        Per $y=kx$ i per $y=kx^2$ el quocient tendeix a $0$: el candidat és $0$, però això encara no demostra res.
      fuites:
      - y\s*=\s*k\s*x\^\{?2\}?
