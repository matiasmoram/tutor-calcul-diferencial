      valor: |
        Si $G=F^{-1}$ fos diferenciable a $b=F(a)$, com que $G\circ F=\mathrm{Id}$ en un entorn de $a$, la regla de la cadena donaria $JG(b)\,JF(a)=I$, i prenent determinants $\det JG(b)\cdot\det JF(a)=1$, en contradicció amb $\det JF(a)=0$.
