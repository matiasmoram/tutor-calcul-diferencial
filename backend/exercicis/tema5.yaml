    passos:
    - id: punts_critics
      titol: Trobar els punts crítics
      objectiu: |
        Determinar el domini i trobar-hi els punts on s'anul·la el gradient.
      idea: |
        Començar per les derivades respecte de $y$ i de $z$, que són les més senzilles.
      detall: |
        Domini: $x\neq0$. $f_y=\dfrac zx$, $f_z=\dfrac yx$, d'on $y=z=0$. $f_x=1-\dfrac{1+yz}{x^2}=1-\dfrac1{x^2}=0$, $x=\pm1$. Punts crítics: $(1,0,0)$ i $(-1,0,0)$.
