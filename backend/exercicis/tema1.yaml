    - id: valor_absolut_no_continu
      descripcio: |
        Dubta que $x^2+|y|$ sigui contínua (pel valor absolut) i no sap justificar que $E$ és tancat.
      pregunta: |
        La funció valor absolut és contínua? I la suma i composició de funcions contínues?
    - id: punts_unio
      descripcio: |
        Pensa que als punts on s'uneixen els dos arcs la corba "fa punta" i que això els fa especials topològicament (aïllats o interiors).
      pregunta: |
        Una punta a la corba impedeix trobar-hi altres punts de $E$ tan a prop com vulguis?
    nota_professor: |
      $E$ és compacte (tancat i fitat) i connex. Els punts $(\pm\sqrt5,0)$ són angulosos però topològicament no tenen res d'especial.
  - id: t1-8f
    apartat: f
    tipus: calcul
    enunciat: |
      $F=\{(x,y,z)\in\mathbb{R}^3\mid x^2+y^2<1,\ \text{i } |z|<1\}$.
    teoria:
    - T1.11
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        $F$ és el cilindre sòlid obert. $\mathring{F}=F$; $\overline{F}=F'=\{(x,y,z)\mid x^2+y^2\leq1,\ |z|\leq1\}$; $\mathrm{Fr}\,F=\{x^2+y^2=1,\ |z|\leq1\}\cup\{x^2+y^2\leq1,\ |z|=1\}$ (superfície lateral i les dues tapes). $F$ és obert i no és tancat.
      fuites:
      - (?<!si )\$F\$\s+és\s+obert
      - obert\s+(però|i)\s+no\s+(és\s+)?tancat
      - (\\mathring\{?\s*F\s*\}?|int\}?\s*\(\s*F\s*\)|F\^\{?\\circ\}?)\s*=\s*F\b
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*(\\leq|\\le|≤)\s*1
      - \|\s*z\s*\|\s*(\\leq|\\le|≤)\s*1
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*=\s*1
      - \|\s*z\s*\|\s*=\s*1
    passos:
    - id: interior
      titol: Interior
      objectiu: |
        Determinar l'interior de $F$.
      idea: |
        Reconèixer $F$ com a intersecció de conjunts definits per desigualtats estrictes entre funcions contínues.
      detall: |
        $\{x^2+y^2<1\}$ i $\{|z|<1\}$ són oberts (Corol·lari 18(i) del Tema 2) i la seva intersecció és oberta (Proposició 12(iii)). Per tant $F$ és obert i $\mathring{F}=F$.
      fuites:
      - (?<!si )\$F\$\s+és\s+obert
      - (\\mathring\{?\s*F\s*\}?|int\}?\s*\(\s*F\s*\)|F\^\{?\\circ\}?)\s*=\s*F\b
      teoria:
      - T2.18
      - T1.12
      - T1.16
    - id: adherencia
      titol: Adherència
      objectiu: |
        Determinar l'adherència $\overline{F}$.
      idea: |
        Proposar el tancat que s'obté "tancant" les desigualtats i comprovar que tots els seus punts són límit de punts de $F$ (per exemple, contraient cap a l'origen).
      detall: |
        $K=\{x^2+y^2\leq1\}\cap\{|z|\leq1\}$ és tancat (Corol·lari 18(ii) del Tema 2, Proposició 13(ii)) i conté $F$: $\overline{F}\subseteq K$. Si $p\in K$, $p_n=(1-\frac1n)p$ compleix $x^2+y^2\leq(1-\frac1n)^2<1$ i $|z|<1$, així $p_n\in F$ i $p_n\to p$. Per tant $\overline{F}=\{x^2+y^2\leq1,\ |z|\leq1\}$.
      fuites:
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*(\\leq|\\le|≤)\s*1
      - \|\s*z\s*\|\s*(\\leq|\\le|≤)\s*1
      teoria:
      - T1.16
      - T1.19
      - T1.13
      - T2.18
    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera de $F$.
      idea: |
        Un punt és de la frontera si és adherent i no és interior. Identificar quins punts de l'adherència no són de $F$: on alguna desigualtat esdevé igualtat.
      detall: |
        Els punts de $F$ són interiors i no són frontera; els de fora de $\overline{F}$ són exteriors. Si $p\in\overline{F}\setminus F$, tota bola talla $F$ (és adherent) i conté $p\notin F$. Per tant $\mathrm{Fr}\,F=\overline{F}\setminus F=\{x^2+y^2=1,\ |z|\leq1\}\cup\{x^2+y^2\leq1,\ |z|=1\}$.
      fuites:
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*=\s*1
      - \|\s*z\s*\|\s*=\s*1
      teoria:
      - T1.14
      - T1.16
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt derivat $F'$.
      idea: |
        Reaprofitar les successions de l'adherència i comprovar si els seus termes són diferents del límit.
      detall: |
        Si $p\in\overline{F}$, $p\neq0$, la successió $(1-\frac1n)p$ és de $F$ i té termes diferents de $p$; per a $p=0$, prenem $(0,0,\frac1n)$, $n\geq2$. Per la Proposició 19(i), $F'=\overline{F}$.
      fuites:
      - F('|\^\{?\\prime\}?)\s*=\s*(\\overline|\\bar)
      teoria:
      - T1.14
      - T1.19
    - id: obert_tancat
      titol: Obert o tancat
      objectiu: |
        Classificar $F$: obert, tancat, totes dues coses o cap.
      idea: |
        Comparar $F$ amb el seu interior i amb la seva adherència.
      detall: |
        $\mathring{F}=F$: és obert. $\overline{F}\neq F$ (per exemple $(1,0,0)\in\overline{F}\setminus F$): no és tancat. Per tant $F$ és obert però no és tancat.
      fuites:
      - (?<!si )\$F\$\s+és\s+obert
      - obert\s+(però|i)\s+no\s+(és\s+)?tancat
      - \(\s*1\s*,\s*0\s*,\s*0\s*\)\s*\\in\s*(\\overline|\\bar)
      teoria:
      - T1.11
      - T1.17
    errors_comuns:
    - id: frontera_sense_tapes
      descripcio: |
        Dona com a frontera només la superfície lateral del cilindre (o només les tapes).
      pregunta: |
        El punt $(0,0,1)$ és de $F$? Tota bola centrada en ell conté punts de $F$?
    - id: frontera_sense_restriccio
      descripcio: |
        Escriu la frontera com la unió del cilindre infinit $\{x^2+y^2=1\}$ i dels plans $\{z=\pm1\}$ sencers, sense restringir l'altra coordenada.
      pregunta: |
        Un punt com $(5,0,1)$ és a prop de $F$? Quina condició hi falta?
    - id: fitat_vs_tancat
      descripcio: |
        Conclou que $F$ és tancat perquè és fitat, o que no pot ser obert si és fitat.
      pregunta: |
        Les definicions d'obert i tancat tenen res a veure amb ser fitat?
    nota_professor: |
      Exemple típic d'obert fitat; la seva adherència és un compacte.
  - id: t1-8g
    apartat: g
    tipus: calcul
    enunciat: |
      $G=\{(x,y,z)\in\mathbb{R}^3\mid x^2-y^2+z^2<2,\ \text{i } |z|=1\}$.
    teoria:
    - T1.11
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        $G=\{(x,y,z)\mid x^2-y^2<1,\ z=\pm1\}$ (dues regions planes, entre les branques d'una hipèrbola, als plans $z=1$ i $z=-1$). $\mathring{G}=\varnothing$; $\mathrm{Fr}\,G=\overline{G}=G'=\{(x,y,z)\mid x^2-y^2\leq1,\ |z|=1\}$. $G$ no és ni obert ni tancat.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - x\^\{?2\}?\s*-\s*y\^\{?2\}?\s*(\\leq|\\le|≤)\s*1
      - ni\s+(obert|tancat)\s+ni\s+(obert|tancat)
      - (\\mathring\{?\s*G\s*\}?|int\}?\s*\(\s*G\s*\)|G\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
    passos:
    - id: descriure
      titol: Simplificar la descripció
      objectiu: |
        Reescriure $G$ de manera més senzilla.
      idea: |
        Usar la condició sobre $z$ per simplificar la desigualtat.
      detall: |
        $|z|=1\iff z=\pm1$, i llavors $z^2=1$, així que $G=\{x^2-y^2<1,\ z=\pm1\}$: dues còpies, als plans $z=1$ i $z=-1$, de la regió plana entre les branques de la hipèrbola $x^2-y^2=1$.
      fuites:
      - x\^\{?2\}?\s*-\s*y\^\{?2\}?\s*<\s*1
      teoria: []
    - id: interior
      titol: Interior
      objectiu: |
        Decidir si $G$ té punts interiors a $\mathbb{R}^3$.
      idea: |
        $G$ està contingut en dos plans: moure's una mica en la direcció perpendicular.
      detall: |
        Si $p=(x_0,y_0,z_0)\in G$ (amb $z_0=\pm1$) i $r>0$, sigui $t=\min\{r,1\}/2$. El punt $(x_0,y_0,z_0+t)$ és a $B_r(p)$ i la seva tercera coordenada és $1+t$ o $-1+t$, cap de les quals té valor absolut $1$; per tant no és de $G$. Així $G$ no té punts interiors, $\mathring{G}=\varnothing$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*G\s*\}?|int\}?\s*\(\s*G\s*\)|G\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      teoria:
      - T1.14
      - T1.16
    - id: adherencia
      titol: Adherència
      objectiu: |
        Determinar l'adherència $\overline{G}$.
      idea: |
        Proposar el tancat que s'obté "tancant" la desigualtat estricta i comprovar que els punts afegits són límit de punts de $G$.
      detall: |
        $K=\{x^2-y^2\leq1\}\cap\{|z|=1\}$ és tancat (Corol·lari 18(ii) del Tema 2, Proposició 13(ii)) i conté $G$. Si $(x_0,y_0,z_0)\in K$ amb $x_0^2-y_0^2=1$, els punts $((1-\frac1n)x_0,y_0,z_0)$ compleixen $(1-\frac1n)^2x_0^2-y_0^2<x_0^2-y_0^2=1$ (perquè $x_0\neq0$), són de $G$ i hi convergeixen. Per tant $\overline{G}=\{x^2-y^2\leq1,\ |z|=1\}$.
      fuites:
      - x\^\{?2\}?\s*-\s*y\^\{?2\}?\s*(\\leq|\\le|≤)\s*1
      teoria:
      - T1.16
      - T1.19
      - T1.13
      - T2.18
    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera de $G$.
      idea: |
        Combinar el que saps de l'interior i de l'adherència: un punt adherent que no és interior, què és?
      detall: |
        Com que $\mathring{G}=\varnothing$, tota bola centrada en un punt de $\overline{G}$ talla $G$ i talla $G^c$; els punts de fora de $\overline{G}$ són exteriors. Per tant $\mathrm{Fr}\,G=\overline{G}=\{x^2-y^2\leq1,\ |z|=1\}$.
      fuites:
      - x\^\{?2\}?\s*-\s*y\^\{?2\}?\s*(\\leq|\\le|≤)\s*1
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*G\s*\)?\s*=\s*(\\overline|\\bar)
      teoria:
      - T1.14
      - T1.16
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt derivat $G'$.
      idea: |
        Dins de cada pla, la regió no té punts aïllats: construir successions de punts de $G$ diferents del límit.
      detall: |
        Sigui $p=(x_0,y_0,z_0)\in\overline{G}$. Si $x_0\neq0$, els punts $((1-\frac1n)x_0,y_0,z_0)$ compleixen $(1-\frac1n)^2x_0^2-y_0^2<x_0^2-y_0^2\leq1$, són de $G$, diferents de $p$ i hi convergeixen. Si $x_0=0$, prenem $(\frac1n,y_0,z_0)$, que compleix $\frac1{n^2}-y_0^2<1$ per $n\geq2$. Per la Proposició 19(i), $G'=\overline{G}$.
      fuites:
      - G('|\^\{?\\prime\}?)\s*=\s*(\\overline|\\bar)
      teoria:
      - T1.14
      - T1.19
    - id: obert_tancat
      titol: Obert o tancat
      objectiu: |
        Classificar $G$: obert, tancat, totes dues coses o cap.
      idea: |
        Comparar $G$ amb el seu interior i amb la seva adherència.
      detall: |
        $\mathring{G}=\varnothing\neq G$: no és obert. $(1,0,1)\in\overline{G}\setminus G$: no és tancat. No és ni obert ni tancat.
      fuites:
      - ni\s+(obert|tancat)\s+ni\s+(obert|tancat)
      - \(\s*1\s*,\s*0\s*,\s*1\s*\)\s*\\in\s*(\\overline|\\bar)
      teoria:
      - T1.11
      - T1.17
    errors_comuns:
    - id: desigualtat_estricta_obert
      descripcio: |
        Conclou que $G$ és obert perquè està definit amb una desigualtat estricta, ignorant la condició $|z|=1$.
      pregunta: |
        Totes les condicions que defineixen $G$ són desigualtats estrictes? Què hi aporta la condició sobre $z$?
    - id: no_simplifica
      descripcio: |
        No substitueix $z^2=1$ i intenta treballar amb una quàdrica de $\mathbb{R}^3$, o confon la regió amb el seu complementari ($x^2-y^2>1$).
      pregunta: |
        Si saps que $|z|=1$, quant val $z^2$? Quina desigualtat en queda per a $x$ i $y$? El punt $(0,0,1)$ hi és?
    - id: tancat_per_igualtat
      descripcio: |
        Conclou que $G$ és tancat perquè conté una igualtat ($|z|=1$).
      pregunta: |
        Un punt de la hipèrbola dins del pla $z=1$, és de $G$? És límit de punts de $G$?
    nota_professor: |
      Cal no confondre "obert/tancat a $\mathbb{R}^3$" amb "obert/tancat relatiu al pla": dins de cada pla $z=\pm1$, la regió $x^2-y^2<1$ seria oberta, però a $\mathbb{R}^3$ té interior buit.
- num: 9
  font: null
  preambul: |
    Siguin $A\subset\mathbb{R}^m$ i $x\in\mathbb{R}^m$. Proveu que:
  indicacio: null
  exercicis:
  - id: t1-9a
    apartat: a
    tipus: teoric
    enunciat: |
      $x\in Fr(A)\Leftrightarrow\exists$ successions convergents $(x_n)_{n\in\mathbb{N}}$ i $(y_n)_{n\in\mathbb{N}}$, ambdues amb límit $x$, tals que $\forall n\in\mathbb{N}$, $x_n\in A$ i $y_n\notin A$.
    teoria:
    - T1.14
    - T1.16
    - T1.18
    teoria_reservada: []
    resultat:
      valor: |
        Demostració de les dues implicacions. ($\Rightarrow$) Si $x\in Fr(A)$, per a cada $n\geq 1$ les interseccions $B_{1/n}(x)\cap A$ i $B_{1/n}(x)\cap A^c$ són no buides; triant $x_n$ a la primera i $y_n$ a la segona, $d(x_n,x)<1/n$ i $d(y_n,x)<1/n$, de manera que $x_n\to x$, $y_n\to x$, amb $x_n\in A$ i $y_n\notin A$. ($\Leftarrow$) Donat $r>0$, per convergència hi ha termes $x_n\in B_r(x)\cap A$ i $y_m\in B_r(x)\cap A^c$, així que $x\in Fr(A)$.
      fuites: []
    passos:
    - id: directa_construir
      titol: Construir les successions
      objectiu: |
        Suposant $x\in Fr(A)$, construir una successió de punts d'$A$ i una de punts d'$A^c$ que s'acostin a $x$.
      idea: |
        Aplicar la definició de punt frontera amb una família numerable de radis que tendeixin a $0$, i triar un punt a cada intersecció.
      detall: |
        Per a cada $n\geq 1$, com que $x\in Fr(A)$, tenim $B_{1/n}(x)\cap A\neq\varnothing$ i $B_{1/n}(x)\cap A^c\neq\varnothing$. Triem $x_n\in B_{1/n}(x)\cap A$ i $y_n\in B_{1/n}(x)\cap A^c$. Llavors $x_n\in A$, $y_n\notin A$ i $d(x_n,x)<1/n$, $d(y_n,x)<1/n$.
      fuites:
      - B_\{?\s*(1/n|\\[dt]?frac\s*\{?1\}?\s*\{?n\}?)
      - B\(\s*x\s*,\s*(1/n|\\[dt]?frac\s*\{?1\}?\s*\{?n\}?)
      teoria:
      - T1.14
      - T1.16
    - id: directa_convergencia
      titol: Comprovar la convergència
      objectiu: |
        Demostrar que les dues successions construïdes convergeixen a $x$.
      idea: |
        Usar la fita de la distància de cada terme a $x$ i la definició de successió convergent.
      detall: |
        Donat $\varepsilon>0$, prenem $n_0\in\mathbb{N}$ amb $n_0>1/\varepsilon$. Per a $n\geq n_0$: $d(x_n,x)<1/n\leq 1/n_0<\varepsilon$, i igualment $d(y_n,x)<\varepsilon$. Per tant $x_n\to x$ i $y_n\to x$.
      fuites: []
      teoria:
      - T1.18
    - id: reciproca
      titol: Implicació recíproca
      objectiu: |
        Suposant que existeixen les dues successions, demostrar que $x\in Fr(A)$.
      idea: |
        Fixat un radi qualsevol, la convergència de cada successió garanteix que algun terme cau dins la bola corresponent.
      detall: |
        Sigui $r>0$. Com que $x_n\to x$, existeix $n$ amb $d(x_n,x)<r$, és a dir $x_n\in B_r(x)\cap A$. Com que $y_n\to x$, existeix $m$ amb $y_m\in B_r(x)\cap A^c$. Les dues interseccions són no buides per a tot $r>0$, per tant $x\in Fr(A)$.
      fuites: []
      teoria:
      - T1.18
      - T1.14
    errors_comuns:
    - id: radi_fix
      descripcio: |
        Tria tots els punts dins d'una mateixa bola de radi fix (o no fa dependre el radi de $n$), i per tant no pot garantir la convergència.
      pregunta: |
        Si tots els $x_n$ estan en una bola de radi $1$ al voltant de $x$, pots assegurar que $d(x_n,x)\to 0$?
    - id: confon_acumulacio
      descripcio: |
        Exigeix $x_n\neq x$ o creu que $x$ no pot pertànyer a $A$, confonent frontera amb acumulació.
      pregunta: |
        L'enunciat demana que $x_n\neq x$? Si $x\in A$, què impedeix prendre algun $x_n$ igual a $x$?
    - id: reciproca_un_sol_radi
      descripcio: |
        A la recíproca només comprova la condició per a radis de la forma $1/n$, o per a un radi concret, i no per a tot $r>0$.
      pregunta: |
        La definició de punt frontera, per a quins radis $r$ demana que les interseccions siguin no buides?
    nota_professor: |
      Alternativa curta: $Fr(A)=\overline{A}\cap\overline{A^c}$ (per definició) i aplicar la Proposició 19(ii) a $A$ i a $A^c$. Tant si es fa així com directament, cal l'axioma d'elecció numerable per triar els $x_n$ (no se sol mencionar a aquest nivell).
  - id: t1-9b
    apartat: b
    tipus: teoric
    enunciat: |
      $x\in A'\Leftrightarrow\exists$ una successió $(x_n)_{n\in\mathbb{N}}$ amb límit $x$, tal que $\forall n\in\mathbb{N}$, $x\neq x_n\in A$.
    teoria:
    - T1.14
    - T1.16
    - T1.18
    teoria_reservada:
    - T1.19
    resultat:
      valor: |
        Demostració de les dues implicacions. ($\Rightarrow$) Si $x\in A'$, per a cada $n\geq1$ existeix $x_n\in B_{1/n}(x)\cap(A\setminus\{x\})$; llavors $x_n\in A$, $x_n\neq x$ i $d(x_n,x)<1/n\to 0$, així que $x_n\to x$. ($\Leftarrow$) Donat $r>0$, existeix $n$ amb $d(x_n,x)<r$, i com que $x_n\in A$, $x_n\neq x$, tenim $x_n\in B_r(x)\cap(A\setminus\{x\})\neq\varnothing$; per tant $x\in A'$.
      fuites: []
    passos:
    - id: directa_construir
      titol: Construir la successió
      objectiu: |
        Suposant $x\in A'$, construir una successió de punts d'$A$, diferents de $x$, que s'acostin a $x$.
      idea: |
        Aplicar la definició de punt d'acumulació amb una família numerable de radis que tendeixin a $0$.
      detall: |
        Per a cada $n\geq1$, $B_{1/n}(x)\cap(A\setminus\{x\})\neq\varnothing$; triem $x_n$ en aquesta intersecció. Llavors $x_n\in A$, $x_n\neq x$ i $d(x_n,x)<1/n$.
      fuites:
      - B_\{?\s*(1/n|\\[dt]?frac\s*\{?1\}?\s*\{?n\}?)
      - B\(\s*x\s*,\s*(1/n|\\[dt]?frac\s*\{?1\}?\s*\{?n\}?)
      teoria:
      - T1.14
    - id: directa_convergencia
      titol: Comprovar la convergència
      objectiu: |
        Demostrar que la successió construïda convergeix a $x$.
      idea: |
        Usar la fita de $d(x_n,x)$ i la definició de límit.
      detall: |
        Donat $\varepsilon>0$, sigui $n_0>1/\varepsilon$. Per a $n\geq n_0$, $d(x_n,x)<1/n\leq1/n_0<\varepsilon$. Per tant $x_n\to x$.
      fuites: []
      teoria:
      - T1.18
    - id: reciproca
      titol: Implicació recíproca
      objectiu: |
        Suposant que existeix una tal successió, demostrar que $x$ és punt d'acumulació d'$A$.
      idea: |
        Fixat un radi, la convergència dona un terme dins la bola; cal veure que aquest terme és a $A\setminus\{x\}$.
      detall: |
        Sigui $r>0$. Com que $x_n\to x$, existeix $n$ amb $d(x_n,x)<r$. Com que $x_n\in A$ i $x_n\neq x$, $x_n\in B_r(x)\cap(A\setminus\{x\})$, que és per tant no buit. Com que $r>0$ és arbitrari, $x\in A'$.
      fuites: []
      teoria:
      - T1.18
      - T1.14
    errors_comuns:
    - id: oblida_diferent
      descripcio: |
        A la construcció tria $x_n\in B_{1/n}(x)\cap A$ sense imposar $x_n\neq x$ (això només demostraria $x\in\overline{A}$).
      pregunta: |
        El punt que has triat a la bola, pot ser el mateix $x$? Què et diu exactament la definició de punt d'acumulació?
    - id: radi_fix
      descripcio: |
        Usa un radi fix o no relaciona el radi amb $n$, i no pot garantir que $d(x_n,x)\to0$.
      pregunta: |
        Què et garanteix que la distància de $x_n$ a $x$ es faci tan petita com vulguis?
    - id: reciproca_sense_x_diferent
      descripcio: |
        A la recíproca troba un punt d'$A$ a la bola però no justifica que sigui diferent de $x$.
      pregunta: |
        On fas servir, a la recíproca, la hipòtesi $x_n\neq x$?
    nota_professor: |
      És exactament la Proposició 19(i) dels apunts (reservada): no s'ha d'acceptar citar-la com a demostració. Les successions de punts amb $x_n\neq x$ poden repetir valors; no cal que siguin injectives.
  - id: t1-9c
    apartat: c
    tipus: teoric
    enunciat: |
      $x\in\mathring{A}\Leftrightarrow\forall$ successió $(x_n)_{n\in\mathbb{N}}$ amb límit $x$. $\exists n_0$ tal que, $\forall n\geqslant n_0$, $x_n\in A$.
    teoria:
    - T1.14
    - T1.16
    - T1.18
    teoria_reservada: []
    resultat:
      valor: |
        Demostració de les dues implicacions. ($\Rightarrow$) Si $B_r(x)\subseteq A$ i $x_n\to x$, existeix $n_0$ amb $d(x_n,x)<r$ per a $n\geq n_0$, és a dir $x_n\in B_r(x)\subseteq A$. ($\Leftarrow$) Pel contrarecíproc: si $x\notin\mathring{A}$, per a cada $n$ hi ha $x_n\in B_{1/n}(x)\setminus A$; aquesta successió convergeix a $x$ i cap terme és a $A$, en contra de la hipòtesi.
      fuites: []
    passos:
    - id: directa
      titol: Implicació directa
      objectiu: |
        Suposant $x$ interior a $A$, demostrar que tota successió que convergeix a $x$ acaba dins d'$A$.
      idea: |
        Prendre la bola continguda a $A$ que dona la definició d'interior i usar la definició de límit amb $\varepsilon$ igual al seu radi.
      detall: |
        Sigui $r>0$ amb $B_r(x)\subseteq A$, i sigui $x_n\to x$. Amb $\varepsilon=r$ existeix $n_0$ tal que $d(x_n,x)<r$ per a tot $n\geq n_0$, és a dir $x_n\in B_r(x)\subseteq A$.
      fuites: []
      teoria:
      - T1.14
      - T1.18
    - id: reciproca_construir
      titol: 'Recíproca: negar i construir'
      objectiu: |
        Per a la implicació recíproca, partir de la negació de la tesi ($x$ no interior) i construir una successió adequada.
      idea: |
        Si $x$ no és interior, cap bola centrada en $x$ està continguda a $A$; aplicar-ho a una família de radis que tendeixin a $0$.
      detall: |
        Suposem $x\notin\mathring{A}$. Per a cada $n\geq1$, $B_{1/n}(x)\not\subseteq A$, de manera que existeix $x_n\in B_{1/n}(x)$ amb $x_n\notin A$.
      fuites:
      - B_\{?\s*(1/n|\\[dt]?frac\s*\{?1\}?\s*\{?n\}?)
      - B\(\s*x\s*,\s*(1/n|\\[dt]?frac\s*\{?1\}?\s*\{?n\}?)
      teoria:
      - T1.14
    - id: reciproca_concloure
      titol: 'Recíproca: contradicció'
      objectiu: |
        Comprovar que la successió construïda contradiu la hipòtesi.
      idea: |
        Veure que convergeix a $x$ i mirar quins dels seus termes són a $A$.
      detall: |
        $d(x_n,x)<1/n\to0$, per tant $x_n\to x$. Però cap $x_n$ pertany a $A$, així que no existeix cap $n_0$ amb $x_n\in A$ per a $n\geq n_0$: contradicció amb la hipòtesi. Per tant $x\in\mathring{A}$.
      fuites: []
      teoria:
      - T1.18
    errors_comuns:
    - id: una_sola_successio
      descripcio: |
        A la recíproca usa una successió concreta (per exemple la constant $x_n=x$) i en dedueix que $x$ és interior.
      pregunta: |
        Saber que una successió concreta acaba dins d'$A$, et diu res sobre els punts d'$A^c$ propers a $x$?
    - id: negacio_incorrecta
      descripcio: |
        Nega malament la condició d'interior (per exemple, "existeix una bola que no està continguda a $A$" en lloc de "cap bola està continguda a $A$").
      pregunta: |
        Escriu la definició de punt interior amb quantificadors. Com queda exactament la seva negació?
    - id: n0_uniforme
      descripcio: |
        A la directa pretén un $n_0$ independent de la successió.
      pregunta: |
        L'$n_0$ que trobes, de què depèn? L'enunciat demana que sigui el mateix per a totes les successions?
    nota_professor: |
      L'enunciat transcrit té un punt on hauria d'anar una coma ("amb límit $x$, $\exists n_0$..."). Si $x\notin A$, la successió constant $x_n=x$ ja dona la contradicció; la construcció general cobreix aquest cas.
- num: 10
  font: null
  preambul: |
    Si $A\subset\mathbb{R}^m$, demostreu que
  indicacio: null
  exercicis:
  - id: t1-10a
    apartat: a
    tipus: teoric
    enunciat: |
      $\mathring{A}$ és el conjunt obert més gran contingut en $A$, és a dir, si $B$ és un obert dins $A$, aleshores $B\subset\mathring{A}$.
    teoria:
    - T1.11
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        (1) $\mathring{A}\subseteq A$ per definició, i $\mathring{A}$ és obert: si $x\in\mathring{A}$ amb $B_r(x)\subseteq A$, cada $y\in B_r(x)$ té una bola $B_s(y)\subseteq B_r(x)\subseteq A$ (la bola oberta és oberta), de manera que $B_r(x)\subseteq\mathring{A}$. (2) Si $B\subseteq A$ és obert i $x\in B$, hi ha $r>0$ amb $B_r(x)\subseteq B\subseteq A$, així que $x\in\mathring{A}$; per tant $B\subseteq\mathring{A}$.
      fuites: []
    passos:
    - id: interior_obert
      titol: L'interior és un obert contingut a A
      objectiu: |
        Comprovar que $\mathring{A}\subseteq A$ i que $\mathring{A}$ és un conjunt obert.
      idea: |
        Donat un punt interior, veure que tots els punts de la seva bola dins d'$A$ també són interiors, usant que les boles obertes són conjunts oberts.
      detall: |
        $\mathring{A}\subseteq A$ per definició. Sigui $x\in\mathring{A}$ i $r>0$ amb $B_r(x)\subseteq A$. Per la Proposició 12(i), per a cada $y\in B_r(x)$ existeix $s>0$ (per exemple $s=r-d(x,y)$) amb $B_s(y)\subseteq B_r(x)\subseteq A$, de manera que $y\in\mathring{A}$. Així $B_r(x)\subseteq\mathring{A}$ i $\mathring{A}$ és obert.
      fuites:
      - B_\{?s\}?\s*\(y\)\s*(\\subseteq|\\subset|⊂)\s*B_\{?r\}?\s*\(x\)
      teoria:
      - T1.12
      - T1.11
      - T1.14
    - id: maximalitat
      titol: Maximalitat
      objectiu: |
        Demostrar que tot obert $B$ contingut en $A$ està contingut en $\mathring{A}$.
      idea: |
        Aplicar la definició d'obert a un punt de $B$ i comparar amb la definició de punt interior d'$A$.
      detall: |
        Sigui $x\in B$. Com que $B$ és obert, existeix $r>0$ amb $B_r(x)\subseteq B\subseteq A$. Per tant $x$ és interior a $A$, $x\in\mathring{A}$. Així $B\subseteq\mathring{A}$.
      fuites: []
      teoria:
      - T1.11
      - T1.14
    errors_comuns:
    - id: oblida_obert
      descripcio: |
        Demostra només la maximalitat i oblida comprovar que $\mathring{A}$ és, de fet, un obert.
      pregunta: |
        "El més gran dels oberts continguts a $A$" pressuposa que $\mathring{A}$ és un d'ells. Ho has comprovat?
    - id: bola_no_interior
      descripcio: |
        Per veure que $\mathring{A}$ és obert, només comprova que $B_r(x)\subseteq A$, sense veure que els punts d'aquesta bola són interiors.
      pregunta: |
        Per dir que $\mathring{A}$ és obert, quin conjunt ha de contenir la bola al voltant de $x$? És el mateix que has comprovat?
    nota_professor: |
      Equivalentment, $\mathring{A}$ és la unió de tots els oberts continguts a $A$ (unió d'oberts, Proposició 12(ii)).
  - id: t1-10b
    apartat: b
    tipus: teoric
    enunciat: |
      $\overline{A}$ és el conjunt tancat més petit que conté $A$, és a dir, si $C$ és un tancat que conté $A$, aleshores $\overline{A}\subset C$.
    teoria:
    - T1.11
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        (1) $A\subseteq\overline{A}$, ja que $x\in B_r(x)\cap A$ si $x\in A$. (2) $\overline{A}$ és tancat: si $x\notin\overline{A}$ hi ha $r>0$ amb $B_r(x)\cap A=\varnothing$; per a $y\in B_r(x)$, una bola $B_s(y)\subseteq B_r(x)$ tampoc talla $A$, així $B_r(x)\subseteq(\overline{A})^c$, que és obert. (3) Si $C\supseteq A$ és tancat i $x\notin C$, existeix $r>0$ amb $B_r(x)\subseteq C^c\subseteq A^c$, és a dir $B_r(x)\cap A=\varnothing$ i $x\notin\overline{A}$; per tant $\overline{A}\subseteq C$.
      fuites: []
    passos:
    - id: conte_A
      titol: A està contingut a la clausura
      objectiu: |
        Comprovar que $A\subseteq\overline{A}$.
      idea: |
        Usar la definició de clausura amb boles i el fet que el centre pertany a la bola.
      detall: |
        Si $x\in A$, per a tot $r>0$, $x\in B_r(x)\cap A$, que és no buit. Per tant $x\in\overline{A}$.
      fuites: []
      teoria:
      - T1.16
      - T1.11
    - id: clausura_tancada
      titol: La clausura és tancada
      objectiu: |
        Demostrar que $\overline{A}$ és un conjunt tancat.
      idea: |
        Veure que el complementari és obert: negar la definició de clausura i usar que les boles obertes són oberts.
      detall: |
        Sigui $x\notin\overline{A}$: existeix $r>0$ amb $B_r(x)\cap A=\varnothing$. Per a $y\in B_r(x)$, amb $s=r-d(x,y)>0$ es té $B_s(y)\subseteq B_r(x)$ (Proposició 12(i)), de manera que $B_s(y)\cap A=\varnothing$ i $y\notin\overline{A}$. Així $B_r(x)\subseteq(\overline{A})^c$, que és obert, i $\overline{A}$ és tancat.
      fuites:
      - B_\{?s\}?\s*\(y\)\s*\\cap\s*A\s*=\s*(\\varnothing|\\emptyset|∅)
      teoria:
      - T1.11
      - T1.12
      - T1.16
    - id: minimalitat
      titol: Minimalitat
      objectiu: |
        Demostrar que si $C$ és tancat i $A\subseteq C$, llavors $\overline{A}\subseteq C$.
      idea: |
        Provar la inclusió contrarecíproca: un punt fora de $C$ queda fora de $\overline{A}$, usant que $C^c$ és obert.
      detall: |
        Sigui $x\notin C$. Com que $C^c$ és obert, existeix $r>0$ amb $B_r(x)\subseteq C^c\subseteq A^c$, és a dir $B_r(x)\cap A=\varnothing$. Per tant $x\notin\overline{A}$. Així $C^c\subseteq(\overline{A})^c$, és a dir $\overline{A}\subseteq C$.
      fuites:
      - C\^\{?c\}?\s*(\\subseteq|\\subset|⊂)\s*A\^\{?c\}?
      teoria:
      - T1.11
      - T1.16
    errors_comuns:
    - id: cita_definicio
      descripcio: |
        Cita la caracterització "$\overline{A}$ és el tancat més petit que conté $A$" de la Definició 16 com a prova, que és justament el que es demana demostrar.
      pregunta: |
        Quina de les definicions equivalents de clausura estàs prenent com a punt de partida? Pots usar-ne una altra per demostrar l'enunciat sense cercle?
    - id: oblida_tancat
      descripcio: |
        Demostra la minimalitat però no comprova que $\overline{A}$ sigui tancat.
      pregunta: |
        Per ser "el tancat més petit", $\overline{A}$ ha de ser tancat. Ho has demostrat?
    - id: circular_17
      descripcio: |
        Per veure que $\overline{A}$ és tancat, usa $\overline{\overline{A}}=\overline{A}$ sense demostrar-ho.
      pregunta: |
        La igualtat $\overline{\overline{A}}=\overline{A}$, d'on la treus? No pressuposa ja que $\overline{A}$ és tancat?
    nota_professor: |
      La Definició 16(iv)(b) dels apunts enuncia aquest resultat com a definició equivalent sense demostració; l'exercici és demostrar-lo a partir de la definició amb boles. Alternativa per a la minimalitat: Proposició 17(i)+(ii): $A\subseteq C\Rightarrow\overline{A}\subseteq\overline{C}=C$ (vàlid si la Prop. 17 s'ha provat independentment). També es pot deduir de l'apartat (a) via $(\overline{A})^c=\mathrm{int}(A^c)$.
- num: 11
  font: null
  preambul: |
    Donats dos subconjunts $A,B\subseteq\mathbb{R}^n$, es defineix $A+B=\{x+y\mid x\in A,\ y\in B\}$. Suposem que $A$ és obert.
  indicacio: null
  exercicis:
  - id: t1-11a
    apartat: a
    tipus: teoric
    enunciat: |
      Demostreu que si $y\in\mathbb{R}^n$, el conjunt $A+\{y\}$ és obert.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        Sigui $z\in A+\{y\}$; llavors $a=z-y\in A$ i, com que $A$ és obert, hi ha $r>0$ amb $B_r(a)\subseteq A$. Si $w\in B_r(z)$, $\|(w-y)-a\|=\|w-z\|<r$, així $w-y\in A$ i $w=(w-y)+y\in A+\{y\}$. Per tant $B_r(z)\subseteq A+\{y\}$ i $A+\{y\}$ és obert (el traslladat d'una bola és la bola del mateix radi centrada al punt traslladat).
      fuites: []
    passos:
    - id: pertinenca
      titol: Caracteritzar la pertinença
      objectiu: |
        Descriure quan un punt $z$ pertany a $A+\{y\}$ en termes d'$A$.
      idea: |
        Restar $y$.
      detall: |
        $z\in A+\{y\}\iff z=a+y$ amb $a\in A\iff z-y\in A$.
      fuites: []
      teoria: []
    - id: bola_traslladada
      titol: Trobar una bola
      objectiu: |
        Donat $z\in A+\{y\}$, trobar una bola centrada en $z$ continguda a $A+\{y\}$.
      idea: |
        Usar que $A$ és obert en el punt $z-y$ i veure que la distància és invariant per translacions.
      detall: |
        Sigui $a=z-y\in A$ i $r>0$ amb $B_r(a)\subseteq A$. Si $w\in B_r(z)$, llavors $\|(w-y)-a\|=\|w-z\|<r$, de manera que $w-y\in B_r(a)\subseteq A$ i $w\in A+\{y\}$. Per tant $B_r(z)\subseteq A+\{y\}$.
      fuites:
      - \(w\s*-\s*y\)\s*-\s*a
      teoria:
      - T1.11
      - T1.6
    errors_comuns:
    - id: radi_canviat
      descripcio: |
        Busca un radi nou o diferent sense adonar-se que la translació conserva distàncies.
      pregunta: |
        Si desplaces dos punts pel mateix vector $y$, com canvia la distància entre ells?
    - id: nomes_intuicio
      descripcio: |
        Diu que "una translació d'un obert és obert" sense comprovar la inclusió de boles.
      pregunta: |
        Quina és exactament la definició de conjunt obert? Has trobat, per a cada punt, una bola explícita dins el conjunt?
    nota_professor: |
      Formulació alternativa: $B_r(a)+\{y\}=B_r(a+y)$.
  - id: t1-11b
    apartat: b
    tipus: teoric
    enunciat: |
      Demostreu que el conjunt $A+B$ és obert.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $A+B=\bigcup_{y\in B}(A+\{y\})$; cada $A+\{y\}$ és obert per l'apartat (a), i una unió arbitrària d'oberts és oberta (Proposició 12(ii)). Si $B=\varnothing$, $A+B=\varnothing$, que també és obert.
      fuites: []
    passos:
    - id: unio
      titol: Escriure A+B com una unió
      objectiu: |
        Expressar $A+B$ en termes dels conjunts de l'apartat (a). Pots suposar l'apartat (a) demostrat.
      idea: |
        Agrupar els punts de $A+B$ segons quin element de $B$ s'hi ha sumat.
      detall: |
        $A+B=\bigcup_{y\in B}(A+\{y\})$: si $z=a+y$ amb $a\in A$, $y\in B$, llavors $z\in A+\{y\}$; i recíprocament cada $A+\{y\}$ amb $y\in B$ està contingut en $A+B$.
      fuites:
      - \\bigcup_\{?\s*y\s*\\in\s*B
      teoria: []
    - id: concloure
      titol: Concloure
      objectiu: |
        Deduir que $A+B$ és obert.
      idea: |
        Aplicar l'apartat (a) i la propietat dels oberts sobre unions.
      detall: |
        Cada $A+\{y\}$ és obert per (a), i la unió arbitrària d'oberts és oberta (Proposició 12(ii)); per tant $A+B$ és obert. (Si $B=\varnothing$, $A+B=\varnothing$, obert.)
      fuites: []
      teoria:
      - T1.12
    errors_comuns:
    - id: unio_infinita
      descripcio: |
        Creu que la unió no és oberta perquè té infinits termes (confon amb la intersecció).
      pregunta: |
        Quina operació, unió o intersecció, necessita ser finita per preservar oberts?
    - id: obert_B
      descripcio: |
        Suposa que $B$ també ha de ser obert.
      pregunta: |
        On faries servir que $B$ és obert? L'enunciat ho suposa?
    nota_professor: |
      $B$ és arbitrari (fins i tot pot ser un sol punt o un conjunt tancat).
- num: 12
  font: null
  preambul: |
    Estudieu si són compactes els conjunts següents. Per als que no ho siguin, trobeu el compacte més petit que els conté (si és que n'hi ha cap).
  indicacio: null
  exercicis:
  - id: t1-12a
    apartat: a
    tipus: calcul
    enunciat: |
      $A=\{(x,y,z)\in\mathbb{R}^3\mid x+y=1,\ x^2+y^2=9,\ \text{i } z=0\}$.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        $A=\left\{\left(\frac{1+\sqrt{17}}{2},\frac{1-\sqrt{17}}{2},0\right),\left(\frac{1-\sqrt{17}}{2},\frac{1+\sqrt{17}}{2},0\right)\right\}$ té exactament dos punts; és un conjunt finit i, per tant, compacte.
      fuites:
      - \\sqrt\{?\s*17
      - dos\s+punts
      - \bA\$?\s+(sí\s+)?és\s+(un\s+)?(conjunt\s+)?(compacte|finit)
    passos:
    - id: resoldre
      titol: Resoldre el sistema
      objectiu: |
        Determinar explícitament quins punts formen $A$.
      idea: |
        Aïllar una variable de l'equació lineal i substituir-la a la quadràtica.
      detall: |
        $y=1-x$ i $x^2+(1-x)^2=9\iff 2x^2-2x-8=0\iff x^2-x-4=0$, d'on $x=\frac{1\pm\sqrt{17}}{2}$ i $y=1-x=\frac{1\mp\sqrt{17}}{2}$. Hi ha dos punts (amb $z=0$).
      fuites:
      - \\sqrt\{?\s*17
      - x\^\{?2\}?\s*-\s*x\s*-\s*4
      teoria: []
    - id: concloure
      titol: Decidir la compacitat
      objectiu: |
        Decidir la compacitat d'$A$ a partir de la seva descripció.
      idea: |
        Un conjunt amb un nombre finit de punts: usar directament la definició de compacte, o bé Heine-Borel.
      detall: |
        Si $\{U_i\}$ és un recobriment obert d'$A=\{p,q\}$, triem $U_{i_1}\ni p$ i $U_{i_2}\ni q$: subrecobriment finit. (O bé: un conjunt finit és tancat i fitat, i per Heine-Borel és compacte.) $A$ és compacte.
      fuites: []
      teoria:
      - T1.24
      - T1.34
    errors_comuns:
    - id: corba_infinita
      descripcio: |
        Pensa que $A$ és una corba (circumferència o recta) sense adonar-se que és la intersecció de totes dues.
      pregunta: |
        Quants punts tenen en comú, en general, una recta i una circumferència del pla?
    - id: error_algebraic
      descripcio: |
        Errors en resoldre l'equació de segon grau (discriminant mal calculat).
      pregunta: |
        Pots comprovar que els punts trobats satisfan totes dues equacions?
    nota_professor: |
      La distància de la recta $x+y=1$ a l'origen és $1/\sqrt2<3$, així que talla la circumferència en dos punts.
  - id: t1-12b
    apartat: b
    tipus: calcul
    enunciat: |
      $B=\{(x,y,z)\in\mathbb{R}^3\mid x=2,\ y=3,\ \text{i } z\in(-1,1)\}$.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        $B$ no és compacte: és fitat però no tancat ($(2,3,1)\in\overline{B}\setminus B$). El compacte més petit que el conté és $\overline{B}=\{(2,3,z)\mid z\in[-1,1]\}$ (el conjunt $C$ de l'apartat (c)).
      fuites:
      - no\s+és\s+compacte
      - z\s*\\in\s*\[\s*-\s*1\s*,\s*1\s*\]
    passos:
    - id: fitat
      titol: Fitat
      objectiu: |
        Decidir si $B$ és fitat.
      idea: |
        Trobar una bola que el contingui.
      detall: |
        Per a $(2,3,z)\in B$, $\|(2,3,z)-(2,3,0)\|=|z|<1$, així $B\subseteq B_1((2,3,0))$: és fitat.
      fuites: []
      teoria:
      - T1.33
    - id: tancat
      titol: Tancat?
      objectiu: |
        Decidir si $B$ és tancat.
      idea: |
        Usar la caracterització dels tancats amb successions: estudiar on poden anar a parar els límits de successions de punts de $B$.
      detall: |
        $(2,3,1-1/n)\in B$ i convergeix a $(2,3,1)\notin B$. Per la Proposició 19(iii), $B$ no és tancat, i per Heine-Borel (o Lema 27) no és compacte.
      fuites:
      - 1\s*-\s*(1/n|\\[dt]?frac\s*\{?1\}?\s*\{?n\}?)
      - \(\s*2\s*,\s*3\s*,\s*-?\s*1\s*\)
      - no\s+és\s+tancat
      teoria:
      - T1.19
      - T1.34
      - T1.27
    - id: minim
      titol: Compacte més petit
      objectiu: |
        Trobar el compacte més petit que conté $B$, si n'hi ha.
      idea: |
        Tot compacte és tancat, i el tancat més petit que conté un conjunt és la seva clausura (problema 10b). Calcular la clausura i comprovar que és compacta.
      detall: |
        Si $K\supseteq B$ és compacte, és tancat (Lema 27), i llavors $K\supseteq\overline{B}$. El segment $S=\{(2,3,z)\mid z\in[-1,1]\}$ és tancat i conté $B$, i els seus extrems $(2,3,\pm1)$ són límits de punts de $B$; per tant $\overline{B}=S$. $S$ és tancat i fitat, compacte per Heine-Borel. Així $S$ és el compacte més petit que conté $B$.
      fuites:
      - z\s*\\in\s*\[\s*-\s*1\s*,\s*1\s*\]
      teoria:
      - T1.27
      - T1.16
      - T1.19
      - T1.34
    errors_comuns:
    - id: fitat_implica_compacte
      descripcio: |
        Conclou que $B$ és compacte només perquè és fitat.
      pregunta: |
        Heine-Borel demana dues condicions. Les has comprovat totes dues?
    - id: compacte_minim_arbitrari
      descripcio: |
        Proposa un compacte que conté $B$ (una bola tancada, un cub) però no el més petit, o no justifica la minimalitat.
      pregunta: |
        Per què qualsevol compacte que contingui $B$ hauria de contenir també el teu candidat?
    - id: tancat_en_recta
      descripcio: |
        Pensa que $B$ és tancat perquè és la intersecció dels plans $x=2$, $y=3$ amb alguna cosa, sense mirar els extrems.
      pregunta: |
        Què passa amb els punts $(2,3,z)$ quan $z$ s'acosta a $1$?
    nota_professor: |
      Principi general: el compacte més petit que conté $S\subseteq\mathbb{R}^n$ existeix si i només si $\overline{S}$ és compacte (és a dir, $S$ fitat), i aleshores és $\overline{S}$.
  - id: t1-12c
    apartat: c
    tipus: calcul
    enunciat: |
      $C=\{(x,y,z)\in\mathbb{R}^3\mid x=2,\ y=3,\ \text{i } z\in[-1,1]\}$.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        $C$ és compacte: és tancat (el límit d'una successió de punts $(2,3,z_n)$ amb $z_n\in[-1,1]$ és $(2,3,z)$ amb $z\in[-1,1]$) i fitat ($C\subseteq\overline{B}_1((2,3,0))$); per Heine-Borel és compacte.
      fuites:
      - \bC\$?\s+(sí\s+)?és\s+(un\s+)?(conjunt\s+)?compacte
      - \bC\$?\s+és\s+tancat\s+i\s+fitat
    passos:
    - id: tancat
      titol: Tancat
      objectiu: |
        Decidir si $C$ és tancat.
      idea: |
        Usar la caracterització dels tancats amb successions i el fet que la convergència a $\mathbb{R}^3$ és component a component.
      detall: |
        Si $(2,3,z_n)\in C$ convergeix a $(a,b,c)$, llavors $a=2$, $b=3$ i $z_n\to c$; com que $-1\leq z_n\leq1$, també $-1\leq c\leq1$. Per tant el límit és a $C$ i $C$ és tancat (Proposició 19(iii)).
      fuites: []
      teoria:
      - T1.19
    - id: fitat
      titol: Fitat
      objectiu: |
        Decidir si $C$ és fitat.
      idea: |
        Trobar una bola que el contingui.
      detall: |
        $\|(2,3,z)-(2,3,0)\|=|z|\leq1<2$, així $C\subseteq B_2((2,3,0))$.
      fuites: []
      teoria:
      - T1.33
    - id: concloure
      titol: Concloure
      objectiu: |
        Decidir la compacitat de $C$.
      idea: |
        Aplicar el teorema que caracteritza els compactes de $\mathbb{R}^n$.
      detall: |
        Tancat i fitat a $\mathbb{R}^3$: per Heine-Borel, compacte.
      fuites: []
      teoria:
      - T1.34
    errors_comuns:
    - id: tancat_sense_justificar
      descripcio: |
        Afirma que és tancat "perquè l'interval és tancat" sense relacionar-ho amb $\mathbb{R}^3$.
      pregunta: |
        Que $[-1,1]$ sigui tancat a $\mathbb{R}$, com et diu que el segment ho és a $\mathbb{R}^3$? Quin argument ho connecta?
    - id: oblida_fitat
      descripcio: |
        Conclou compacitat només amb la tancadura.
      pregunta: |
        Un pla també és tancat a $\mathbb{R}^3$. És compacte? Què hi falta?
    nota_professor: |
      $C=\overline{B}$ de l'apartat (b).
  - id: t1-12d
    apartat: d
    tipus: calcul
    enunciat: |
      $D=\{(x,y)\in\mathbb{R}^2\mid x^2+y=5\}$.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        $D$ (la paràbola $y=5-x^2$) és tancat però no és fitat, per tant no és compacte. No hi ha cap compacte que el contingui, ja que tot compacte és fitat i un subconjunt d'un fitat és fitat.
      fuites:
      - no\s+és\s+compacte
      - no\s+(hi\s+ha|existeix)\s+cap\s+compacte
    passos:
    - id: fitat
      titol: Fitat?
      objectiu: |
        Decidir si $D$ és fitat.
      idea: |
        Estudiar com es comporta la norma dels punts de $D$ quan $|x|$ creix.
      detall: |
        $(n,5-n^2)\in D$ per a tot $n\in\mathbb{N}$ i $\|(n,5-n^2)\|\geq n\to\infty$. Cap bola el conté: $D$ no és fitat, i per Heine-Borel no és compacte.
      fuites:
      - \(\s*n\s*,\s*5\s*-\s*n\^\{?2\}?\s*\)
      - no\s+és\s+fitat
      teoria:
      - T1.33
      - T1.34
    - id: cap_compacte
      titol: Hi ha algun compacte que el contingui?
      objectiu: |
        Decidir si existeix algun compacte que contingui $D$.
      idea: |
        Pensar quina propietat dels compactes es transmet als seus subconjunts.
      detall: |
        Si $K\supseteq D$ fos compacte, seria fitat (Heine-Borel), i llavors $D\subseteq K$ també ho seria. Contradicció: no existeix cap compacte que contingui $D$.
      fuites: []
      teoria:
      - T1.34
      - T1.33
    errors_comuns:
    - id: tancat_implica_compacte
      descripcio: |
        Conclou que és compacte perquè és tancat (corba definida per una igualtat).
      pregunta: |
        Totes les corbes definides per una igualtat estan dins d'alguna bola? Què passa amb $y$ quan $x$ creix?
    - id: clausura_com_a_compacte
      descripcio: |
        Proposa $\overline{D}$ o una regió tancada com a "compacte més petit".
      pregunta: |
        El conjunt que proposes, està dins d'alguna bola?
    nota_professor: |
      És tancat (límit de successions, o antiimatge d'un tancat per una funció contínua), però no cal per concloure.
  - id: t1-12e
    apartat: e
    tipus: calcul
    enunciat: |
      $E=\{(x,y)\in\mathbb{R}^2\mid x^2+|y|=5\}$.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        $E$ és compacte: és fitat ($|y|\leq5$ i $|x|\leq\sqrt5$) i tancat (si $(x_n,y_n)\in E$ convergeix a $(x,y)$, llavors $x_n^2+|y_n|\to x^2+|y|$, així $x^2+|y|=5$); per Heine-Borel és compacte.
      fuites:
      - \bE\$?\s+(sí\s+)?és\s+(un\s+)?(conjunt\s+)?compacte
      - \bE\$?\s+és\s+tancat\s+i\s+fitat
    passos:
    - id: fitat
      titol: Fitat
      objectiu: |
        Decidir si $E$ és fitat.
      idea: |
        Com que els dos sumands són no negatius, cadascun està fitat pel total.
      detall: |
        $|y|=5-x^2\leq5$ i $x^2=5-|y|\leq5$, és a dir $|x|\leq\sqrt5$. Per tant $\|(x,y)\|\leq\sqrt{5+25}=\sqrt{30}$ i $E$ és fitat.
      fuites:
      - \|y\|\s*=\s*5\s*-\s*x\^\{?2\}?\s*(\\leq?(slant)?|≤)\s*5
      - \\sqrt\{?\s*30
      teoria:
      - T1.33
    - id: tancat
      titol: Tancat
      objectiu: |
        Decidir si $E$ és tancat.
      idea: |
        Usar la caracterització amb successions: passar al límit a l'equació que defineix $E$.
      detall: |
        Si $(x_n,y_n)\in E$ i $(x_n,y_n)\to(x,y)$, llavors $x_n\to x$, $y_n\to y$, $|y_n|\to|y|$ i $x_n^2\to x^2$, de manera que $5=x_n^2+|y_n|\to x^2+|y|$. Per tant $(x,y)\in E$ i $E$ és tancat (Proposició 19(iii)).
      fuites: []
      teoria:
      - T1.19
    - id: concloure
      titol: Concloure
      objectiu: |
        Decidir la compacitat d'$E$.
      idea: |
        Aplicar el teorema que caracteritza els compactes de $\mathbb{R}^n$.
      detall: |
        Tancat i fitat a $\mathbb{R}^2$: per Heine-Borel, compacte.
      fuites: []
      teoria:
      - T1.34
    errors_comuns:
    - id: confon_amb_d
      descripcio: |
        El tracta com l'apartat (d) i diu que no és fitat, sense veure que el valor absolut fita $y$ per dalt i per baix.
      pregunta: |
        Si $|y|=5-x^2$, quin és el valor màxim que pot prendre $x^2$? I $|y|$?
    - id: tancat_sense_argument
      descripcio: |
        Afirma que és tancat sense cap argument.
      pregunta: |
        Si una successió de punts d'$E$ convergeix, com saps que el límit compleix l'equació?
    nota_professor: |
      $E$ és la unió de dos arcs de paràbola $y=\pm(5-x^2)$, $|x|\leq\sqrt5$: una corba tancada.
  - id: t1-12f
    apartat: f
    tipus: calcul
    enunciat: |
      $F=\{(x,y,z)\in\mathbb{R}^3\mid x^2+y^2<1,\ \text{i } |z|<1\}$.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        $F$ (cilindre obert) no és compacte: és fitat però no tancat ($(0,0,1)\in\overline{F}\setminus F$). El compacte més petit que el conté és $\overline{F}=\{(x,y,z)\in\mathbb{R}^3\mid x^2+y^2\leq1,\ |z|\leq1\}$.
      fuites:
      - no\s+és\s+compacte
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*(\\leq?(slant)?|≤)\s*1
    passos:
    - id: fitat
      titol: Fitat
      objectiu: |
        Decidir si $F$ és fitat.
      idea: |
        Fitar la norma d'un punt de $F$ amb les dues desigualtats.
      detall: |
        $\|(x,y,z)\|^2=x^2+y^2+z^2<2$, així $F\subseteq B_{\sqrt2}(0)$.
      fuites: []
      teoria:
      - T1.33
    - id: tancat
      titol: Tancat?
      objectiu: |
        Decidir si $F$ és tancat.
      idea: |
        Usar la caracterització dels tancats amb successions: estudiar on poden anar a parar els límits de successions de punts de $F$.
      detall: |
        $(0,0,1-1/n)\in F$ convergeix a $(0,0,1)\notin F$. Per la Proposició 19(iii) $F$ no és tancat, i per tant no és compacte.
      fuites:
      - \(\s*0\s*,\s*0\s*,\s*-?\s*1\s*\)
      - no\s+és\s+tancat
      teoria:
      - T1.19
      - T1.27
    - id: minim
      titol: Compacte més petit
      objectiu: |
        Trobar el compacte més petit que conté $F$.
      idea: |
        Tot compacte que contingui $F$ és tancat, i per tant conté la clausura (problema 10b). Calcular la clausura i comprovar que és compacta.
      detall: |
        Sigui $G=\{x^2+y^2\leq1,\ |z|\leq1\}$. $G$ és tancat (les desigualtats no estrictes es conserven al límit) i conté $F$, així $\overline{F}\subseteq G$. Recíprocament, si $p\in G$, $p_n=(1-\frac1n)p\in F$ (perquè $(1-\frac1n)^2(x^2+y^2)<1$ i $(1-\frac1n)|z|<1$) i $p_n\to p$, així $p\in\overline{F}$. Per tant $\overline{F}=G$, que és tancat i fitat, compacte per Heine-Borel; i tot compacte $K\supseteq F$ és tancat (Lema 27), per tant $K\supseteq G$.
      fuites:
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*(\\leq?(slant)?|≤)\s*1
      teoria:
      - T1.27
      - T1.16
      - T1.19
      - T1.34
    errors_comuns:
    - id: fitat_implica_compacte
      descripcio: |
        Conclou que és compacte perquè és fitat.
      pregunta: |
        Heine-Borel demana dues condicions. Les has comprovat totes dues?
    - id: clausura_sense_justificar
      descripcio: |
        Dona la clausura sense justificar les dues inclusions (en particular, que tot punt del cilindre tancat és límit de punts de $F$).
      pregunta: |
        Com saps que un punt de la vora del cilindre és realment límit de punts de $F$?
    - id: minimalitat_sense_argument
      descripcio: |
        No justifica per què el compacte proposat és el més petit.
      pregunta: |
        Si $K$ és un compacte qualsevol que conté $F$, per què ha de contenir també el conjunt que proposes?
    nota_professor: |
      Com a l'apartat (b): el compacte més petit és la clausura, que existeix perquè $F$ és fitat.
- num: 13
  font: null
  preambul: |
    Demostreu que
  indicacio: null
  exercicis:
  - id: t1-13a
    apartat: a
    tipus: teoric
    enunciat: |
      la intersecció d'un nombre arbitrari (finit o infinit) de subconjunts compactes de $\mathbb{R}^n$ també és compacte,
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        Sigui $\{K_i\}_{i\in I}$ ($I\neq\varnothing$) una família de compactes. Cada $K_i$ és tancat (Lema 27), així $K=\bigcap_i K_i$ és tancat (Proposició 13(ii)). Fixat $i_0\in I$, $K\subseteq K_{i_0}$, compacte, i un tancat contingut en un compacte és compacte (Lema 28). Per tant $K$ és compacte.
      fuites: []
    passos:
    - id: tancat
      titol: La intersecció és tancada
      objectiu: |
        Demostrar que $\bigcap_{i\in I}K_i$ és un conjunt tancat.
      idea: |
        Relacionar compacte amb tancat i usar com es comporten els tancats per interseccions.
      detall: |
        Cada $K_i$ és tancat pel Lema 27, i la intersecció arbitrària de tancats és tancada (Proposició 13(ii)).
      fuites: []
      teoria:
      - T1.27
      - T1.13
    - id: dins_compacte
      titol: Tancat dins d'un compacte
      objectiu: |
        Deduir la compacitat de la intersecció.
      idea: |
        La intersecció està continguda en qualsevol dels $K_i$; usar el resultat sobre tancats continguts en compactes.
      detall: |
        Fixat $i_0\in I$, $\bigcap_i K_i\subseteq K_{i_0}$, compacte. Pel Lema 28, un tancat contingut en un compacte és compacte.
      fuites:
      - \\subseteq\s*K_\{?i_\{?0
      teoria:
      - T1.28
    errors_comuns:
    - id: subrecobriment_directe
      descripcio: |
        Intenta extreure directament un subrecobriment finit de la intersecció sense justificar per què el recobriment d'un subconjunt es pot "estendre".
      pregunta: |
        Un recobriment de la intersecció, recobreix també algun dels $K_i$? Què hi hauries d'afegir?
    - id: oblida_tancat
      descripcio: |
        Diu que la intersecció és compacta "perquè està dins d'un compacte", oblidant que cal que sigui tancada.
      pregunta: |
        Tot subconjunt d'un compacte és compacte? Pensa en $(0,1)\subseteq[0,1]$.
    nota_professor: |
      Alternativa a $\mathbb{R}^n$: Heine-Borel (la intersecció és tancada i fitada). Cal $I\neq\varnothing$ (la intersecció de la família buida no té sentit o seria tot l'espai).
  - id: t1-13b
    apartat: b
    tipus: teoric
    enunciat: |
      la unió d'un nombre finit de compactes de $\mathbb{R}^n$ també és compacte,
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        Siguin $K_1,\ldots,K_r$ compactes i $\{U_i\}_{i\in I}$ un recobriment obert de $K_1\cup\cdots\cup K_r$. Recobreix cada $K_j$, que admet un subrecobriment finit $\{U_i\}_{i\in F_j}$. Llavors $\{U_i\}_{i\in F_1\cup\cdots\cup F_r}$ és finit i recobreix la unió, que és per tant compacta.
      fuites: []
    passos:
    - id: recobriment
      titol: Partir d'un recobriment
      objectiu: |
        Donat un recobriment per oberts de $K_1\cup\cdots\cup K_r$, relacionar-lo amb cada $K_j$.
      idea: |
        Aplicar la definició de compacte a cada $K_j$ amb el mateix recobriment.
      detall: |
        $\{U_i\}_{i\in I}$ també recobreix cada $K_j$; per compacitat, existeix $F_j\subseteq I$ finit amb $K_j\subseteq\bigcup_{i\in F_j}U_i$.
      fuites: []
      teoria:
      - T1.24
    - id: concloure
      titol: Ajuntar els subrecobriments
      objectiu: |
        Obtenir un subrecobriment finit de la unió.
      idea: |
        Combinar els subrecobriments trobats i comprovar-ne la finitud.
      detall: |
        $F=F_1\cup\cdots\cup F_r$ és finit (unió finita de conjunts finits) i $K_1\cup\cdots\cup K_r\subseteq\bigcup_{i\in F}U_i$. Per tant la unió és compacta.
      fuites:
      - F_1\s*\\cup\s*\\cdots\s*\\cup\s*F_r
      teoria:
      - T1.24
    errors_comuns:
    - id: on_cal_finit
      descripcio: |
        No identifica on s'usa que el nombre de compactes és finit.
      pregunta: |
        Si tinguessis infinits $K_j$, el conjunt d'índexs que ajuntes continuaria sent finit?
    - id: recobriments_diferents
      descripcio: |
        Agafa un recobriment diferent per a cada $K_j$ en lloc de partir d'un recobriment arbitrari de la unió.
      pregunta: |
        Què has de demostrar exactament: que existeix algun recobriment finit, o que tot recobriment admet un subrecobriment finit?
    nota_professor: |
      Alternativa a $\mathbb{R}^n$: Heine-Borel, amb la Proposició 13(iii) (unió finita de tancats) i el fet que una unió finita de fitats és fitada.
  - id: t1-13c
    apartat: c
    tipus: teoric
    enunciat: |
      la unió d'un nombre infinit de compactes de $\mathbb{R}^n$ pot no ser compacte.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        Contraexemple: a $\mathbb{R}$, $K_n=\{n\}$ ($n\in\mathbb{N}$) és compacte (finit), però $\bigcup_n K_n=\mathbb{N}$ no és fitat i per tant no és compacte (o bé: el recobriment $\{(n-\frac12,n+\frac12)\}_n$ no té subrecobriment finit). Un altre: $K_n=[\frac1n,1]$, amb unió $(0,1]$, que no és tancada.
      fuites: []
    passos:
    - id: triar_familia
      titol: Triar una família
      objectiu: |
        Proposar una família infinita de compactes la unió dels quals pugui fallar alguna condició de compacitat.
      idea: |
        Pensar en quines dues propietats caracteritzen els compactes de $\mathbb{R}^n$ i buscar una unió que en perdi una.
      detall: |
        Per exemple, a $\mathbb{R}$, $K_n=\{n\}$, $n\in\mathbb{N}$: cada $K_n$ és finit, per tant compacte (d'un recobriment obert n'hi ha prou de triar un obert que contingui el punt).
      fuites:
      - K_n\s*=\s*\\\{\s*n\s*\\\}
      - K_n\s*=\s*\[\s*(1/n|\\[dt]?frac\s*\{?1\}?\s*\{?n\}?)
      teoria:
      - T1.24
    - id: no_compacte
      titol: La unió no és compacta
      objectiu: |
        Demostrar que la unió de la família proposada no és compacta.
      idea: |
        Usar Heine-Borel, o bé exhibir un recobriment obert sense subrecobriment finit.
      detall: |
        Directament per la definició: els oberts $(n-\frac12,n+\frac12)$, $n\in\mathbb{N}$, recobreixen $\bigcup_n K_n=\mathbb{N}$, cadascun conté un sol natural, i cap subfamília finita els recobreix tots; per tant $\mathbb{N}$ no és compacte. (Alternativa: $\mathbb{N}$ no és fitat, i tot compacte és fitat; la prova de la implicació "compacte $\Rightarrow$ fitat" de Heine-Borel val a qualsevol espai mètric, també a $\mathbb{R}$.)
      fuites: []
      teoria:
      - T1.24
      - T1.34+dem
    errors_comuns:
    - id: familia_compacte
      descripcio: |
        Tria una família la unió de la qual sí és compacta (p. ex. $K_n=[0,1]$ per a tot $n$, o $K_n=[0,1-\frac1n]\cup\{1\}$, amb unió $[0,1]$), que per tant no és un contraexemple.
      pregunta: |
        Has comprovat explícitament que la unió que proposes falla alguna de les condicions de compacitat?
    - id: compactes_no_compactes
      descripcio: |
        Tria conjunts $K_n$ que no són compactes (p. ex. intervals oberts).
      pregunta: |
        Cadascun dels teus $K_n$ és compacte? Com ho justifiques?
    nota_professor: |
      Qualsevol contraexemple vàlid serveix. $K_n=[\frac1n,1]$ mostra que la unió pot no ser tancada encara que sigui fitada; $K_n=\{n\}$ o $[-n,n]$ que pot no ser fitada. A $\mathbb{R}^n$ amb $n>1$ serveix l'exemple anàleg $K_k=\{(k,0,\ldots,0)\}$.
- num: 14
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t1-14a
    apartat: a
    tipus: teoric
    enunciat: |
      Demostreu que si $K_1\subset\mathbb{R}^{n_1}$ i $K_2\subset\mathbb{R}^{n_2}$ són compactes, aleshores $K_1\times K_2\subset\mathbb{R}^{n_1+n_2}$ també és compacte.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        Per Bolzano-Weierstrass n'hi ha prou de veure que $K_1\times K_2$ és seqüencialment compacte. Sigui $(a_k,b_k)\in K_1\times K_2$. Com que $K_1$ és seqüencialment compacte, hi ha una parcial $a_{k_j}\to a\in K_1$; com que $K_2$ ho és, $(b_{k_j})_j$ té una parcial $b_{k_{j_s}}\to b\in K_2$. Llavors $a_{k_{j_s}}\to a$ també, i com que $\|(u,v)\|^2=\|u\|^2+\|v\|^2$, $(a_{k_{j_s}},b_{k_{j_s}})\to(a,b)\in K_1\times K_2$. (Alternativa: Heine-Borel, $K_1\times K_2$ és tancat i fitat.)
      fuites: []
    passos:
    - id: estrategia
      titol: Reduir a successions
      objectiu: |
        Triar una caracterització de la compacitat que sigui còmoda per a productes.
      idea: |
        Pel Teorema de Bolzano-Weierstrass, compacte equival a seqüencialment compacte; o bé, a $\mathbb{R}^n$, Heine-Borel.
      detall: |
        Pel Teorema de Bolzano-Weierstrass, $K_1$ i $K_2$ són seqüencialment compactes, i n'hi ha prou de veure que $K_1\times K_2$ també ho és: que tota successió $((a_k,b_k))_k$ de $K_1\times K_2$ té una parcial convergent a un punt de $K_1\times K_2$.
      fuites: []
      teoria:
      - T1.26
    - id: parcials_encaixades
      titol: Extreure parcials successives
      objectiu: |
        Donada una successió $((a_k,b_k))_k$ de $K_1\times K_2$, trobar-ne una parcial que convergeixi a $K_1\times K_2$.
      idea: |
        Treballar primer amb la primera component i després, sobre la parcial obtinguda, amb la segona (com a la demostració de Heine-Borel).
      detall: |
        $(a_k)_k\subseteq K_1$ té una parcial $a_{k_j}\to a\in K_1$. La successió $(b_{k_j})_j\subseteq K_2$ té una parcial $b_{k_{j_s}}\to b\in K_2$. Com que $(a_{k_{j_s}})_s$ és parcial d'una successió convergent, també $a_{k_{j_s}}\to a$.
      fuites:
      - b_\{?k_\{?j_\{?s
      teoria:
      - T1.24
      - T1.34+dem
    - id: convergencia_producte
      titol: Convergència al producte
      objectiu: |
        Comprovar que la parcial obtinguda convergeix a $\mathbb{R}^{n_1+n_2}$ cap a un punt de $K_1\times K_2$.
      idea: |
        Expressar la norma euclidiana de $\mathbb{R}^{n_1+n_2}$ en termes de les normes de les dues components.
      detall: |
        $\|(a_{k_{j_s}},b_{k_{j_s}})-(a,b)\|^2=\|a_{k_{j_s}}-a\|^2+\|b_{k_{j_s}}-b\|^2\to0$, així la parcial convergeix a $(a,b)\in K_1\times K_2$. Per Bolzano-Weierstrass, $K_1\times K_2$ és compacte.
      fuites: []
      teoria:
      - T1.8
      - T1.18
      - T1.26
    errors_comuns:
    - id: mateixa_parcial
      descripcio: |
        Agafa parcials convergents de $(a_k)$ i de $(b_k)$ independentment, amb índexs diferents, i les combina.
      pregunta: |
        Les parcials que has triat per a cada component, usen els mateixos índexs? Formen una parcial de la successió de parells?
    - id: recobriment_producte
      descripcio: |
        Intenta fer productes de recobriments oberts sense justificar que tot obert de $\mathbb{R}^{n_1+n_2}$ es pugui descompondre així.
      pregunta: |
        Tot obert de $\mathbb{R}^{n_1+n_2}$ és producte d'oberts? Com tractaries un recobriment arbitrari?
    - id: convergencia_components
      descripcio: |
        No justifica que la convergència de les components implica la convergència del parell.
      pregunta: |
        Com es calcula la distància entre dos punts de $\mathbb{R}^{n_1+n_2}$ a partir de les seves components?
    nota_professor: |
      Via Heine-Borel: si $K_i\subseteq B_{L_i}(0)$, llavors $\|(a,b)\|<\sqrt{L_1^2+L_2^2}$ (fitat); i si $(a_k,b_k)\to(a,b)$, llavors $a_k\to a\in K_1$, $b_k\to b\in K_2$ perquè són tancats (tancat). Totes dues proves són vàlides.
  - id: t1-14b
    apartat: b
    tipus: teoric
    enunciat: |
      Demostreu que si $K_1\subset\mathbb{R}^{n_1},\ldots,K_r\subset\mathbb{R}^{n_r}$ són compactes, aleshores $K_1\times\cdots\times K_r\subset\mathbb{R}^{n_1+\cdots+n_r}$ també és compacte. En particular, proveu que tot $k$-rectangle tancat és compacte.
    teoria:
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        Per inducció sobre $r$: el cas $r=1$ és trivial; si $K_1\times\cdots\times K_{r-1}$ és compacte, llavors $K_1\times\cdots\times K_r=(K_1\times\cdots\times K_{r-1})\times K_r$ (identificant $\mathbb{R}^{n_1+\cdots+n_r}=\mathbb{R}^{n_1+\cdots+n_{r-1}}\times\mathbb{R}^{n_r}$) és compacte per l'apartat (a). Un $k$-rectangle tancat $[a_1,b_1]\times\cdots\times[a_k,b_k]$ és producte de $k$ intervals tancats i fitats de $\mathbb{R}$, compactes per Heine-Borel, i per tant és compacte.
      fuites: []
    passos:
    - id: induccio
      titol: Inducció sobre el nombre de factors
      objectiu: |
        Demostrar el cas general de $r$ factors. Pots suposar l'apartat (a) demostrat.
      idea: |
        Fer inducció sobre $r$ agrupant els primers factors en un de sol.
      detall: |
        Cas $r=1$: trivial (cas $r=2$: apartat (a)). Pas inductiu: $K_1\times\cdots\times K_r=(K_1\times\cdots\times K_{r-1})\times K_r$, on el primer factor és un compacte de $\mathbb{R}^{n_1+\cdots+n_{r-1}}$ per hipòtesi d'inducció; per (a), el producte és compacte a $\mathbb{R}^{n_1+\cdots+n_r}$.
      fuites:
      - \(K_1\s*\\times\s*\\cdots\s*\\times\s*K_\{?r\s*-\s*1\}?\)\s*\\times\s*K_r
      teoria: []
    - id: rectangle
      titol: k-rectangles tancats
      objectiu: |
        Aplicar el resultat als $k$-rectangles tancats.
      idea: |
        Escriure el rectangle com a producte i justificar la compacitat de cada factor.
      detall: |
        $R=[a_1,b_1]\times\cdots\times[a_k,b_k]$ amb $n_1=\cdots=n_k=1$. Cada $[a_i,b_i]$ és tancat i fitat a $\mathbb{R}$, per tant compacte (Heine-Borel, cas $n=1$). Pel cas general, $R$ és compacte.
      fuites: []
      teoria:
      - T1.34
      - T1.25
    errors_comuns:
    - id: induccio_sense_identificacio
      descripcio: |
        No justifica la identificació $\mathbb{R}^{n_1+\cdots+n_{r-1}}\times\mathbb{R}^{n_r}=\mathbb{R}^{n_1+\cdots+n_r}$ (amb la mateixa norma euclidiana).
      pregunta: |
        El producte d'agrupar els factors, és el mateix subconjunt del mateix espai que el producte original?
    - id: interval_compacte
      descripcio: |
        Usa que $[a,b]$ és compacte sense justificar-ho, o només per a $[0,1]$.
      pregunta: |
        Quin resultat et garanteix que un interval tancat i fitat qualsevol de $\mathbb{R}$ és compacte?
    nota_professor: |
      L'enunciat del Teorema 34 dels apunts diu "amb $n>1$", però la demostració inclou explícitament el cas $n=1$ (que $[a,b]$ és compacte). Notar que el $k$-rectangle tancat és compacte s'usa a la prova de Heine-Borel; aquí l'ordre lògic és diferent (la prova via (a) usa Bolzano-Weierstrass), de manera que no hi ha cercle si a (a) s'usa seqüencial compacitat i $[a,b]$ compacte a $\mathbb{R}$.
- num: 15
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t1-15
    apartat: null
    tipus: teoric
    enunciat: |
      Demostreu que, donada una successió $(x_n)_{n\in\mathbb{N}}$ amb $\lim_{n\to\infty}x_n=x_0$, el conjunt $(x_n)_{n\in\mathbb{N}}\cup\{x_0\}$ és compacte.
    teoria:
    - T1.18
    - T1.24
    teoria_reservada: []
    resultat:
      valor: |
        Sigui $K=\{x_n\mid n\in\mathbb{N}\}\cup\{x_0\}$ i $K\subseteq\bigcup_{i\in I}U_i$ un recobriment per oberts. Existeix $i_0$ amb $x_0\in U_{i_0}$ i $r>0$ amb $B_r(x_0)\subseteq U_{i_0}$. Per la convergència, existeix $n_0$ tal que $x_n\in B_r(x_0)\subseteq U_{i_0}$ per a tot $n\ge n_0$. Els termes $x_1,\dots,x_{n_0-1}$ són un nombre finit: cadascun és en algun $U_{i_n}$. Aleshores $K\subseteq U_{i_0}\cup U_{i_1}\cup\dots\cup U_{i_{n_0-1}}$, un subrecobriment finit, i $K$ és compacte.
      fuites: []
    passos:
    - id: recobriment
      titol: Partir d'un recobriment arbitrari
      objectiu: |
        Fixar un recobriment per oberts qualsevol del conjunt i veure què se'n pot dir a prop del punt límit $x_0$.
      idea: |
        Per definició de compacte cal treballar amb un recobriment arbitrari. El punt $x_0$ és del conjunt, per tant és en algun obert del recobriment, i ser obert dona una bola al seu voltant.
      detall: |
        Sigui $K=\{x_n\}_n\cup\{x_0\}\subseteq\bigcup_{i\in I}U_i$ amb $U_i$ oberts. Com que $x_0\in K$, existeix $i_0\in I$ amb $x_0\in U_{i_0}$, i com que $U_{i_0}$ és obert existeix $r>0$ tal que $B_r(x_0)\subseteq U_{i_0}$.
      fuites: []
      teoria:
      - T1.24
      - T1.11
    - id: cua
      titol: Un sol obert conté la cua
      objectiu: |
        Veure que un únic obert del recobriment conté tots els termes de la successió a partir d'un cert índex.
      idea: |
        Aplicar la definició de convergència amb una tolerància ben triada, relacionada amb la bola que tenim al voltant de $x_0$.
      detall: |
        Prenent $\varepsilon=r$ a la definició de límit, existeix $n_0$ tal que $d(x_n,x_0)<r$ per a tot $n\ge n_0$, és a dir, $x_n\in B_r(x_0)\subseteq U_{i_0}$ per a tot $n\ge n_0$.
      fuites:
      - (\\(var)?epsilon|ε)\s*=\s*r\b
      teoria:
      - T1.18
    - id: finits
      titol: Cobrir la resta i concloure
      objectiu: |
        Cobrir els punts del conjunt que encara no estan coberts i extreure'n un subrecobriment finit.
      idea: |
        Els termes que queden fora de la cua són un nombre finit, i cadascun és en algun obert del recobriment.
      detall: |
        Per a cada $n=1,\dots,n_0-1$ triem $i_n\in I$ amb $x_n\in U_{i_n}$. Aleshores $K\subseteq U_{i_0}\cup U_{i_1}\cup\dots\cup U_{i_{n_0-1}}$, que és un subrecobriment finit. Com que el recobriment era arbitrari, $K$ és compacte.
      fuites: []
      teoria:
      - T1.24
    errors_comuns:
    - id: recobriment_particular
      descripcio: |
        Comprova la propietat només per a un recobriment concret (per exemple, boles centrades als punts del conjunt) en lloc d'un recobriment arbitrari.
      pregunta: |
        La definició de compacte parla d'un recobriment concret que tu tries, o de tots els recobriments possibles per oberts?
    - id: conjunt_finit
      descripcio: |
        Argumenta com si el conjunt fos finit, o diu que "només hi ha un nombre finit de punts", quan en general la successió pren infinits valors.
      pregunta: |
        Quants punts diferents pot tenir el conjunt $\{x_n\}_n$? Què passa, per exemple, amb $x_n=1/n$?
    - id: oblida_x0
      descripcio: |
        Oblida incloure el punt límit $x_0$ o no l'aprofita: sense $x_0$ el conjunt no tindria per què ser compacte.
      pregunta: |
        Si traguéssim $x_0$ del conjunt, l'argument encara funcionaria? Quin paper hi juga $x_0$?
    - id: heine_borel_sense_justificar
      descripcio: |
        Aplica Heine-Borel (tancat i fitat) sense justificar que el conjunt és tancat, o en un espai mètric general on Heine-Borel no s'aplica.
      pregunta: |
        L'enunciat diu en quin espai viu la successió? I si fos a $\mathbb{R}^n$, per què seria tancat aquest conjunt?
    nota_professor: |
      L'enunciat no fixa l'espai: la prova per recobriments funciona en qualsevol espai mètric. Alternativa via Bolzano-Weierstrass (T1.26): una successió de $K$ o bé pren algun valor infinites vegades (parcial constant) o bé conté una parcial de $(x_n)$ amb índexs estrictament creixents, que convergeix a $x_0\in K$. A $\mathbb{R}^n$ també es pot fer amb Heine-Borel (T1.34): és fitat per T1.21(ii) i tancat perquè l'únic possible punt d'acumulació és $x_0$, que hi pertany.
- num: 16
  font: Exercici d'examen, maig 2008
  preambul: |
    Doneu exemples de subconjunts $A,B\subseteq\mathbb{R}^n$, $A\neq B$, que satisfacin les condicions següents, o justifiqueu que no n'existeixen.
  indicacio: null
  exercicis:
  - id: t1-16a
    apartat: a
    tipus: teoric
    enunciat: |
      $A\subseteq B$ però $Fr(B)\subseteq Fr(A)$.
    teoria:
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        Existeixen. Per exemple, a $\mathbb{R}$: $A=(0,1)\cup(1,2)\subseteq B=(0,2)$, amb $Fr(B)=\{0,2\}\subseteq Fr(A)=\{0,1,2\}$ (fins i tot inclusió estricta). A $\mathbb{R}^n$: $B=B_1(\mathbf 0)$ i $A=B_1(\mathbf 0)\setminus\{\mathbf 0\}$, amb $Fr(B)=\{\|x\|=1\}\subsetneq Fr(A)=\{\|x\|=1\}\cup\{\mathbf 0\}$.
      fuites:
      - \(0,\s*1\)\s*\\cup\s*\(1,\s*2\)
      - B_\{?1\}?\s*\(\s*\\mathbf\s*\{?0\}?\s*\)\s*\\setminus
    passos:
    - id: mecanisme
      titol: Com pot perdre frontera un conjunt més gran
      objectiu: |
        Entendre com pot ser que, en ampliar un conjunt, la frontera es faci més petita (o no creixi).
      idea: |
        Pensa en "forats": si a un conjunt li treus un punt de l'interior, aquest punt passa a ser de frontera. Ampliar el conjunt omplint el forat elimina aquest punt de la frontera.
      detall: |
        Si $B$ és obert i $p\in B$, el conjunt $A=B\setminus\{p\}\subseteq B$ té $p$ com a punt de frontera (tota bola centrada en $p$ conté $p\notin A$ i punts d'$A$), mentre que $p$ és interior a $B$ i, per tant, no és de $Fr(B)$.
      fuites:
      - \\setminus\s*\\\{\s*p
      teoria:
      - T1.14
    - id: exemple
      titol: Proposar un exemple concret
      objectiu: |
        Escriure dos conjunts concrets $A\neq B$ amb $A\subseteq B$ que encaixin amb aquest mecanisme.
      idea: |
        A $\mathbb{R}$ (és a dir, $n=1$) n'hi ha prou amb intervals: un interval obert i el mateix interval amb un punt interior tret.
      detall: |
        $A=(0,1)\cup(1,2)$ i $B=(0,2)$ a $\mathbb{R}$. Clarament $A\subseteq B$ i $A\neq B$ ($1\in B\setminus A$).
      fuites:
      - \(0,\s*1\)\s*\\cup\s*\(1,\s*2\)
      teoria: []
    - id: verificar
      titol: Calcular les fronteres
      objectiu: |
        Calcular $Fr(A)$ i $Fr(B)$ i comprovar la inclusió demanada.
      idea: |
        Aplica la definició de punt frontera: tota bola centrada al punt talla el conjunt i el seu complementari. Mira els extrems dels intervals i el punt tret.
      detall: |
        $Fr(B)=\{0,2\}$. Per a $A$: $0$ i $2$ són de frontera com abans, i $1$ també, perquè tota bola $(1-r,1+r)$ conté $1\notin A$ i punts d'$A$. Els altres punts són interiors a $A$ o exteriors. Per tant $Fr(A)=\{0,1,2\}\supseteq Fr(B)$.
      fuites:
      - \\\{\s*0\s*,\s*1\s*,\s*2\s*\\\}
      teoria:
      - T1.14
      - T1.16
    errors_comuns:
    - id: frontera_monotona
      descripcio: |
        Creu que $A\subseteq B$ implica $Fr(A)\subseteq Fr(B)$ i, per tant, que no hi ha exemples.
      pregunta: |
        Si a un disc li treus el centre, el conjunt es fa més petit. La frontera es fa més petita o més gran?
    - id: frontera_dins_conjunt
      descripcio: |
        Confon la frontera amb "els punts del conjunt que estan a la vora", oblidant punts de frontera que no pertanyen al conjunt (com el punt tret).
      pregunta: |
        Un punt que no pertany a $A$ pot ser de la frontera d'$A$? Què diu exactament la definició?
    - id: oblida_A_neq_B
      descripcio: |
        Proposa $A=B$, cosa que l'enunciat exclou.
      pregunta: |
        Els teus dos conjunts compleixen totes les condicions de l'enunciat, incloent-hi la primera?
    nota_professor: |
      L'original (PDF) usa efectivament $\subseteq$, de manera que també valen exemples trivials com $A=\varnothing$, $B=\mathbb{R}^n$ ($Fr(B)=\varnothing$). És possible que l'original demanés inclusions estrictes; l'exemple proposat les compleix estrictes ($Fr(B)\subsetneq Fr(A)$), així que és vàlid en les dues lectures. L'exemple a $\mathbb{R}$ correspon a $n=1$; per a $n$ qualsevol, la bola oberta unitat amb el centre tret.
  - id: t1-16b
    apartat: b
    tipus: teoric
    enunciat: |
      $Fr(A\cup B)\subseteq Fr(A)$ però $Fr(B)\subseteq Fr(A\cup B)$.
    teoria:
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        Existeixen. Per exemple, a $\mathbb{R}$: $A=\{-1\}\cup(0,1)$, $B=(0,+\infty)$. Aleshores $A\cup B=\{-1\}\cup(0,+\infty)$ i
        $Fr(B)=\{0\}\subsetneq Fr(A\cup B)=\{-1,0\}\subsetneq Fr(A)=\{-1,0,1\}$ (inclusions fins i tot estrictes). Un exemple més senzill amb inclusions no estrictes: $A=(0,1)\cup(1,2)\subseteq B=(0,2)$, on $A\cup B=B$.
      fuites:
      - \\\{\s*-1\s*\\\}\s*\\cup\s*\(0,\s*1\)
      - \\\{\s*-1\s*,\s*0\s*\\\}
    passos:
    - id: planificar
      titol: Decidir quines fronteres volem
      objectiu: |
        Decidir com han de ser les tres fronteres $Fr(B)$, $Fr(A\cup B)$ i $Fr(A)$ perquè quedin encaixades com demana l'enunciat.
      idea: |
        Cal que $Fr(B)\subseteq Fr(A\cup B)\subseteq Fr(A)$. Comença per un $B$ amb frontera molt petita i afegeix-li trossos (d'$A$) que facin aparèixer punts de frontera nous a la unió; després fes que $A$ tingui encara algun punt de frontera de més, que la unió amb $B$ "tapi".
      detall: |
        Prenem $B$ amb un sol punt de frontera, $B=(0,+\infty)$ amb $Fr(B)=\{0\}$. Un punt aïllat afegit a la unió, per exemple $-1$, aporta un punt de frontera nou. I si $A$ té un extrem dins de $B$ (com el $1$ d'un interval $(0,1)$), aquest extrem és de $Fr(A)$ però desapareix a la unió.
      fuites:
      - B\s*=\s*\(0,\s*\+?\\infty\)
      teoria:
      - T1.14
    - id: exemple
      titol: Escriure l'exemple
      objectiu: |
        Concretar $A$ i $B$ i calcular $A\cup B$.
      idea: |
        Junta les peces que has decidit al pas anterior.
      detall: |
        $A=\{-1\}\cup(0,1)$, $B=(0,+\infty)$, $A\neq B$, i $A\cup B=\{-1\}\cup(0,+\infty)$.
      fuites:
      - \\\{\s*-1\s*\\\}\s*\\cup\s*\(0,\s*1\)
      teoria: []
    - id: verificar
      titol: Calcular les fronteres
      objectiu: |
        Calcular les tres fronteres i comprovar les dues inclusions.
      idea: |
        Definició de punt frontera: tota bola centrada al punt talla el conjunt i el complementari. Un punt aïllat d'un conjunt sempre n'és de frontera.
      detall: |
        $Fr(B)=\{0\}$. $Fr(A\cup B)=\{-1,0\}$: $-1$ és aïllat (tota bola el conté i conté punts de fora), $0$ és extrem, i la resta són interiors o exteriors. $Fr(A)=\{-1,0,1\}$. Per tant $Fr(A\cup B)\subseteq Fr(A)$ i $Fr(B)\subseteq Fr(A\cup B)$, totes dues estrictes.
      fuites:
      - \\\{\s*-1\s*,\s*0\s*\\\}
      - \\\{\s*-1\s*,\s*0\s*,\s*1\s*\\\}
      teoria:
      - T1.14
      - T1.16
    errors_comuns:
    - id: frontera_unio
      descripcio: |
        Creu que $Fr(A\cup B)=Fr(A)\cup Fr(B)$ i, per tant, que la primera condició obliga $Fr(B)\subseteq Fr(A)$ de manera rígida.
      pregunta: |
        Si $A=(0,1)$ i $B=[1,2)$, quina és la frontera de la unió? Coincideix amb $Fr(A)\cup Fr(B)$?
    - id: punt_aillat
      descripcio: |
        No reconeix que un punt aïllat és de frontera (pensa que només ho són els "extrems d'intervals").
      pregunta: |
        Per al conjunt $\{-1\}$, tota bola centrada en $-1$ talla el conjunt? I el complementari?
    - id: oblida_A_neq_B
      descripcio: |
        Proposa $A=B$, cosa que l'enunciat exclou.
      pregunta: |
        Els teus conjunts són diferents, tal com demana l'enunciat?
    nota_professor: |
      Amb $\subseteq$ tal com està transcrit hi ha exemples trivials (qualsevol $A\subseteq B$ amb $Fr(B)\subseteq Fr(A)$, com l'exemple de l'apartat (a), ja que llavors $A\cup B=B$; o $A=\varnothing$, $B=\mathbb{R}^n$). L'exemple proposat compleix les dues inclusions estrictes, per si l'original les demanava estrictes. Per a $n$ qualsevol es pot fer el mateix amb semiespais i un punt aïllat.
  - id: t1-16c
    apartat: c
    tipus: teoric
    enunciat: |
      $Fr(A\cap B)\subseteq Fr(A)$ però $Fr(B)\subseteq Fr(A\cap B)$.
    teoria:
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        Existeixen. Per exemple, a $\mathbb{R}$: $A=\{-1\}\cup(0,1)$, $B=(0,+\infty)$. Aleshores $A\cap B=(0,1)$ i
        $Fr(B)=\{0\}\subsetneq Fr(A\cap B)=\{0,1\}\subsetneq Fr(A)=\{-1,0,1\}$ (inclusions fins i tot estrictes). Un exemple més senzill amb inclusions no estrictes: $A=(0,1)\cup(1,2)\subseteq B=(0,2)$, on $A\cap B=A$.
      fuites:
      - A\s*\\cap\s*B\s*=\s*\(0,\s*1\)
      - \\\{\s*-1\s*\\\}\s*\\cup\s*\(0,\s*1\)
    passos:
    - id: planificar
      titol: Decidir quines fronteres volem
      objectiu: |
        Decidir com han de ser $Fr(B)$, $Fr(A\cap B)$ i $Fr(A)$ perquè quedin encaixades com demana l'enunciat.
      idea: |
        Cal que $Fr(B)\subseteq Fr(A\cap B)\subseteq Fr(A)$. Tria $B$ amb frontera molt petita; tallar-lo amb $A$ pot crear nous extrems a la intersecció; després afegeix a $A$ alguna cosa fora de $B$ que li doni més frontera sense afectar la intersecció.
      detall: |
        $B=(0,+\infty)$ té $Fr(B)=\{0\}$. Si $A$ conté l'interval $(0,1)$, la intersecció és aquest interval, amb un extrem nou ($1$). Afegint a $A$ un punt aïllat fora de $B$, com $-1$, $Fr(A)$ guanya un punt i la intersecció no canvia.
      fuites:
      - B\s*=\s*\(0,\s*\+?\\infty\)
      teoria:
      - T1.14
    - id: exemple
      titol: Escriure l'exemple
      objectiu: |
        Concretar $A$ i $B$ i calcular $A\cap B$.
      idea: |
        Junta les peces que has decidit al pas anterior.
      detall: |
        $A=\{-1\}\cup(0,1)$, $B=(0,+\infty)$, $A\neq B$, i $A\cap B=(0,1)$.
      fuites:
      - \\\{\s*-1\s*\\\}\s*\\cup\s*\(0,\s*1\)
      teoria: []
    - id: verificar
      titol: Calcular les fronteres
      objectiu: |
        Calcular les tres fronteres i comprovar les dues inclusions.
      idea: |
        Definició de punt frontera; recorda que un punt aïllat d'un conjunt és punt frontera.
      detall: |
        $Fr(B)=\{0\}$, $Fr(A\cap B)=Fr((0,1))=\{0,1\}$, $Fr(A)=\{-1,0,1\}$ ($-1$ és aïllat). Per tant $Fr(A\cap B)\subseteq Fr(A)$ i $Fr(B)\subseteq Fr(A\cap B)$, totes dues estrictes.
      fuites:
      - \\\{\s*-1\s*,\s*0\s*,\s*1\s*\\\}
      teoria:
      - T1.14
      - T1.16
    errors_comuns:
    - id: frontera_interseccio
      descripcio: |
        Creu que $Fr(A\cap B)=Fr(A)\cap Fr(B)$, o que la frontera de la intersecció és sempre més petita que la de cada conjunt.
      pregunta: |
        Si $A=(0,2)$ i $B=(1,3)$, quina és $Fr(A\cap B)$? És dins de $Fr(A)\cap Fr(B)$?
    - id: punt_aillat
      descripcio: |
        No reconeix que un punt aïllat és de frontera.
      pregunta: |
        Per al conjunt $\{-1\}$, tota bola centrada en $-1$ talla el conjunt? I el complementari?
    - id: oblida_A_neq_B
      descripcio: |
        Proposa $A=B$, cosa que l'enunciat exclou.
      pregunta: |
        Els teus conjunts són diferents, tal com demana l'enunciat?
    nota_professor: |
      Amb $\subseteq$ tal com està transcrit, qualsevol exemple de l'apartat (a) també serveix (si $A\subseteq B$, $A\cap B=A$ i les condicions es redueixen a $Fr(B)\subseteq Fr(A)$). L'exemple proposat compleix les inclusions estrictes, per si l'original les demanava estrictes.
- num: 17
  font: Exercici d'examen, març 2010
  preambul: |
    Sigui
    $$A=\left\{\left(\cos\frac{1}{t}+2t\sin\frac{1}{t},\ 2t\cos\frac{1}{t}-\sin\frac{1}{t}\right)\in\mathbb{R}^2\ \middle|\ t\in\mathbb{R}\setminus\{0\}\right\}.$$
  indicacio: null
  exercicis:
  - id: t1-17a
    apartat: a
    tipus: calcul
    enunciat: |
      Calculeu $\|\mathbf{a}\|$ per $\mathbf{a}\in A$ i raoneu si és cert que $(0,0)\in A'$.
    teoria:
    - T1.8
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        Per al punt de paràmetre $t$, $\|\mathbf a\|=\sqrt{1+4t^2}>1$. Per tant $B_1((0,0))\cap A=\varnothing$ i $(0,0)\notin A'$: no és cert.
      fuites:
      - 1\s*\+\s*4\s*t\s*\^\s*\{?2\}?
      - 4\s*t\s*\^\s*\{?2\}?\s*\+\s*1\b
      - \(0,\s*0\)\s*\\notin\s*A
    passos:
    - id: norma
      titol: Calcular la norma
      objectiu: |
        Calcular $\|\mathbf a\|^2$ en funció del paràmetre $t$.
      idea: |
        Desenvolupa els dos quadrats: els termes creuats es cancel·len i s'usa $\sin^2+\cos^2=1$.
      detall: |
        Amb $c=\cos\frac1t$, $s=\sin\frac1t$: $(c+2ts)^2+(2tc-s)^2=c^2+4tcs+4t^2s^2+4t^2c^2-4tcs+s^2=1+4t^2$. Per tant $\|\mathbf a\|=\sqrt{1+4t^2}$.
      fuites:
      - 1\s*\+\s*4\s*t\s*\^\s*\{?2\}?
      - 4\s*t\s*\^\s*\{?2\}?\s*\+\s*1\b
      teoria:
      - T1.8
    - id: origen
      titol: Decidir si l'origen és d'acumulació
      objectiu: |
        Decidir, amb la norma calculada, si l'origen és punt d'acumulació d'$A$.
      idea: |
        Un punt d'acumulació necessita punts del conjunt (diferents d'ell) a qualsevol bola centrada en ell. Busca una bola centrada a l'origen on no n'hi hagi cap.
      detall: |
        Com que $t\neq 0$, $\|\mathbf a\|=\sqrt{1+4t^2}>1$ per a tot $\mathbf a\in A$. Per tant $B_1((0,0))\cap A=\varnothing$ i $(0,0)$ no és punt d'acumulació d'$A$.
      fuites:
      - B_\{?1\}?\s*\(\s*\(0,\s*0\)\s*\)\s*\\cap\s*A
      teoria:
      - T1.14
      - T1.16
    errors_comuns:
    - id: termes_creuats
      descripcio: |
        Desenvolupa malament els quadrats (oblida els termes creuats o no veu que es cancel·len) i obté una norma que depèn de $\cos\frac1t$ o $\sin\frac1t$.
      pregunta: |
        Quins termes creuats surten a cada quadrat? Tenen el mateix signe?
    - id: limit_t_zero
      descripcio: |
        Pensa que, com que $2t\to 0$ quan $t\to 0$, els punts s'apropen a l'origen.
      pregunta: |
        Quan $t\to 0$, els termes amb $2t$ tendeixen a $0$, però què fan els termes $\cos\frac1t$ i $\sin\frac1t$?
    - id: acumulacio_vs_pertinenca
      descripcio: |
        Raona només si $(0,0)$ pertany a $A$, en lloc d'estudiar els punts d'$A$ propers a $(0,0)$.
      pregunta: |
        Ser punt d'acumulació és el mateix que pertànyer al conjunt? Què cal mirar exactament?
    nota_professor: |
      La norma només depèn de $|t|$ i és estrictament més gran que $1$, de manera que $A$ queda fora del disc tancat unitat.
  - id: t1-17b
    apartat: b
    tipus: teoric
    enunciat: |
      Què podeu dir sobre l'existència de punts d'acumulació del conjunt $A$ sobre la circumferència unitat $C=\{(x,y)\in\mathbb{R}^2\mid x^2+y^2=1\}$ ?
    teoria:
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        Tot punt de $C$ és punt d'acumulació d'$A$, és a dir, $C\subseteq A'$. Per a $p=(\cos\theta,\sin\theta)$, la successió $t_k=\frac{1}{2\pi k-\theta}\to 0$ dona punts $\mathbf a(t_k)=p+2t_k(-\sin\theta,\cos\theta)\in A$, diferents de $p$ i amb $\|\mathbf a(t_k)-p\|=2t_k\to 0$. A més, per (a), cap d'aquests punts d'acumulació pertany a $A$ ($A\cap C=\varnothing$).
      fuites:
      - C\s*\\subset(eq)?\s*A'
      - tots?\s+(els\s+)?punts?\s+de\s+(\$C\$|la\s+circumfer[eè]ncia)[^.]{0,30}acumulaci
    passos:
    - id: descomposicio
      titol: Comportament quan $t\to 0$
      objectiu: |
        Entendre on van els punts d'$A$ quan el paràmetre $t$ és petit.
      idea: |
        Separa cada punt en una part que no depèn del factor $2t$ i una altra que sí. Usa també la norma de l'apartat (a), que es pot donar per coneguda.
      detall: |
        $\mathbf a(t)=\left(\cos\frac1t,-\sin\frac1t\right)+2t\left(\sin\frac1t,\cos\frac1t\right)$. El primer sumand és a $C$ i el segon té norma $2|t|\to 0$: quan $t\to 0$ els punts d'$A$ s'apropen a $C$ girant-hi al voltant infinites vegades.
      fuites:
      - 2t\s*\\left\(\s*\\sin
      teoria: []
    - id: successio
      titol: Successió que s'acosta a un punt de $C$
      objectiu: |
        Donat un punt $p=(\cos\theta,\sin\theta)$ de $C$, construir una successió de punts d'$A$, diferents de $p$, que hi convergeixi.
      idea: |
        Tria valors del paràmetre que tendeixin a $0$ i per als quals la part sobre $C$ sigui exactament $p$; després usa la caracterització de punt d'acumulació per successions.
      detall: |
        Cal $\cos\frac1t=\cos\theta$ i $-\sin\frac1t=\sin\theta$, és a dir, $\frac1t=-\theta+2\pi k$. Prenem $t_k=\frac{1}{2\pi k-\theta}$, positiu per a $k$ gran i amb $t_k\to 0$. Aleshores $\mathbf a(t_k)=p+2t_k(-\sin\theta,\cos\theta)$, amb $\|\mathbf a(t_k)-p\|=2t_k$, que és $>0$ i tendeix a $0$. Per la Proposició 19(i), $p\in A'$.
      fuites:
      - 2\s*\\pi\s*k\s*-\s*\\theta
      - -\s*\\theta\s*\+\s*2\s*\\pi\s*k
      teoria:
      - T1.19
      - T1.18
    - id: conclusio
      titol: Concloure
      objectiu: |
        Resumir què passa amb els punts d'acumulació d'$A$ sobre $C$ i si pertanyen a $A$.
      idea: |
        El punt $p$ era arbitrari. Per a la pertinença, recorda la norma dels punts d'$A$.
      detall: |
        Com que $p\in C$ era qualsevol, $C\subseteq A'$. Per (a), $\|\mathbf a\|>1$ per a tot $\mathbf a\in A$, així que $A\cap C=\varnothing$: els punts de $C$ són d'acumulació però no pertanyen a $A$ (en particular, $A$ no és tancat).
      fuites:
      - C\s*\\subset(eq)?\s*A'
      teoria:
      - T1.16
    errors_comuns:
    - id: nomes_existencia
      descripcio: |
        Només troba un punt d'acumulació (per exemple $(1,0)$) i no veu que tots els punts de $C$ ho són.
      pregunta: |
        Quan $t\to 0$, quantes voltes fa l'angle $\frac1t$? Hi ha algun angle privilegiat?
    - id: punt_igual
      descripcio: |
        No comprova que els punts de la successió són diferents del punt límit, o confon punt d'acumulació amb punt adherent.
      pregunta: |
        La definició de punt d'acumulació demana alguna condició sobre els punts de la successió respecte al límit?
    - id: pertinenca
      descripcio: |
        Afirma que els punts de $C$ són d'$A$ (punts d'acumulació "dins" del conjunt).
      pregunta: |
        Amb la norma de l'apartat (a), algun punt d'$A$ pot tenir norma exactament $1$?
    nota_professor: |
      No es demana, però de fet $A'=\overline{A}=A\cup C$: els punts d'$A$ també són d'acumulació (la corba és contínua en $t$ i $\|\mathbf a(t)\|=\sqrt{1+4t^2}$ distingeix valors propers de $t$), i quan $|t|\to\infty$ la norma tendeix a $\infty$, de manera que no apareixen altres punts límit. La successió $t_k$ pot ser negativa per a $k$ petit; només cal $k$ gran.
- num: 18
  font: Exercici d'examen, març 2011
  preambul: |
    Considerem $A,B\subseteq\mathbb{R}^n$ i $V=A\cap B$.
  indicacio: null
  exercicis:
  - id: t1-18a
    apartat: a
    tipus: teoric
    enunciat: |
      Demostreu que $\mathring{V}=\mathring{A}\cap\mathring{B}$.
    teoria:
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        $\subseteq$: si $x\in\mathring V$, existeix $r>0$ amb $B_r(x)\subseteq V\subseteq A$ i $B_r(x)\subseteq V\subseteq B$, per tant $x\in\mathring A\cap\mathring B$.
        $\supseteq$: si $x\in\mathring A\cap\mathring B$, existeixen $r_1,r_2>0$ amb $B_{r_1}(x)\subseteq A$, $B_{r_2}(x)\subseteq B$; amb $r=\min\{r_1,r_2\}$, $B_r(x)\subseteq A\cap B=V$, i $x\in\mathring V$.
      fuites: []
    passos:
    - id: inclusio_directa
      titol: Inclusió $\subseteq$
      objectiu: |
        Demostrar que tot punt interior de $V$ és interior a $A$ i a $B$.
      idea: |
        Fes servir la definició de punt interior i que $V$ està contingut en cadascun dels dos conjunts.
      detall: |
        Si $x\in\mathring V$, existeix $r>0$ amb $B_r(x)\subseteq V$. Com que $V\subseteq A$ i $V\subseteq B$, la mateixa bola compleix $B_r(x)\subseteq A$ i $B_r(x)\subseteq B$; per tant $x\in\mathring A\cap\mathring B$.
      fuites: []
      teoria:
      - T1.14
      - T1.16
    - id: inclusio_reciproca
      titol: Inclusió $\supseteq$
      objectiu: |
        Demostrar que un punt interior alhora a $A$ i a $B$ és interior a $V$.
      idea: |
        Tens dues boles, una dins de cada conjunt, possiblement de radis diferents. Cal trobar-ne una dins de tots dos, com es fa per veure que la intersecció finita d'oberts és oberta.
      detall: |
        Si $x\in\mathring A\cap\mathring B$, existeixen $r_1,r_2>0$ amb $B_{r_1}(x)\subseteq A$ i $B_{r_2}(x)\subseteq B$. Amb $r=\min\{r_1,r_2\}>0$, $B_r(x)\subseteq B_{r_1}(x)\cap B_{r_2}(x)\subseteq A\cap B=V$, i $x\in\mathring V$.
      fuites:
      - \\min\s*\\\{\s*r_
      teoria:
      - T1.14
      - T1.12+dem
    errors_comuns:
    - id: una_inclusio
      descripcio: |
        Demostra només una de les dues inclusions i dona la igualtat per feta.
      pregunta: |
        Per demostrar una igualtat de conjunts, què cal comprovar exactament?
    - id: mateixa_bola
      descripcio: |
        A la inclusió $\supseteq$ suposa que les boles dins d'$A$ i de $B$ tenen el mateix radi.
      pregunta: |
        El radi de la bola que et dona $x\in\mathring A$ ha de coincidir amb el que et dona $x\in\mathring B$? Què pots fer si són diferents?
    - id: interior_unio
      descripcio: |
        Generalitza l'argument a la unió o a interseccions infinites sense adonar-se que falla.
      pregunta: |
        Si tinguessis infinits conjunts, el mínim dels radis seria necessàriament positiu?
    nota_professor: |
      Per a interseccions infinites la igualtat falla (cf. $\bigcap_n(-\frac1n,\frac1n)=\{0\}$, T1.x4). Alternativa: $\mathring V\subseteq\mathring A\cap\mathring B$ per monotonia, i $\mathring A\cap\mathring B$ és un obert (T1.12(iii)) contingut en $V$, per tant dins de $\mathring V$ si se sap que l'interior és el màxim obert contingut (això no és explícit a les notes).
  - id: t1-18b
    apartat: b
    tipus: teoric
    enunciat: |
      Doneu un contraexemple que provi la falsedat de $\overline{V}=\overline{A}\cap\overline{B}$.
    teoria:
    - T1.16
    teoria_reservada:
    - T1.17
    resultat:
      valor: |
        Per exemple, a $\mathbb{R}$: $A=(0,1)$, $B=(1,2)$. Llavors $V=A\cap B=\varnothing$ i $\overline V=\varnothing$, mentre que $\overline A\cap\overline B=[0,1]\cap[1,2]=\{1\}\neq\overline V$. (Sempre es té $\overline V\subseteq\overline A\cap\overline B$; la inclusió que falla és l'altra.) Altres: $A=\mathbb{Q}$, $B=\mathbb{R}\setminus\mathbb{Q}$.
      fuites:
      - \\overline\s*\{?A\}?\s*\\cap\s*\\overline\s*\{?B\}?\s*=\s*[^$]*\\\{\s*1\s*\\\}
      - A\s*=\s*\(0,\s*1\)\s*\$?\s*(i|,)\s*\$?\s*B\s*=\s*\(1,\s*2\)
    passos:
    - id: inclusio_certa
      titol: Quina inclusió sempre és certa
      objectiu: |
        Esbrinar quina de les dues inclusions es compleix sempre, per saber quina ha de fallar al contraexemple.
      idea: |
        Si un conjunt està contingut en un altre, què passa amb les seves clausures? Aplica-ho a $V\subseteq A$ i $V\subseteq B$ amb la definició de clausura.
      detall: |
        Si $x\in\overline V$, tota bola centrada en $x$ talla $V\subseteq A$, per tant talla $A$; igual amb $B$. Així $\overline V\subseteq\overline A\cap\overline B$ sempre. El contraexemple ha de tenir un punt de $\overline A\cap\overline B$ que no sigui de $\overline V$.
      fuites: []
      teoria:
      - T1.16
    - id: contraexemple
      titol: Triar els conjunts
      objectiu: |
        Trobar $A$ i $B$ amb intersecció molt petita però amb clausures que es tallin.
      idea: |
        Pensa en dos conjunts disjunts que "es toquin" en un punt que no pertany a cap dels dos.
      detall: |
        A $\mathbb{R}$: $A=(0,1)$ i $B=(1,2)$, disjunts però amb el punt $1$ a la vora de tots dos.
      fuites:
      - A\s*=\s*\(0,\s*1\)\s*\$?\s*(i|,)\s*\$?\s*B\s*=\s*\(1,\s*2\)
      teoria: []
    - id: verificar
      titol: Comprovar el contraexemple
      objectiu: |
        Calcular $\overline V$ i $\overline A\cap\overline B$ per al teu exemple i veure que són diferents.
      idea: |
        La clausura d'un interval obert afegeix els extrems.
      detall: |
        $V=\varnothing$, així que $\overline V=\varnothing$. En canvi $\overline A=[0,1]$, $\overline B=[1,2]$ i $\overline A\cap\overline B=\{1\}\neq\varnothing$.
      fuites:
      - \\overline\s*\{?A\}?\s*\\cap\s*\\overline\s*\{?B\}?\s*=\s*[^$]*\\\{\s*1\s*\\\}
      teoria:
      - T1.16
    errors_comuns:
    - id: inclusio_equivocada
      descripcio: |
        Busca un exemple on $\overline A\cap\overline B$ sigui més petit que $\overline V$, cosa impossible.
      pregunta: |
        Un punt adherent a $V$ pot deixar de ser adherent a $A$, si $V\subseteq A$?
    - id: conjunts_tancats
      descripcio: |
        Prova amb conjunts tancats (o massa "grans"), per als quals no es pot trobar el contraexemple tan fàcilment.
      pregunta: |
        Si $A$ i $B$ fossin tancats, què serien $\overline A$, $\overline B$ i $\overline V$? Pot fallar la igualtat en aquest cas?
    - id: clausura_interval
      descripcio: |
        Calcula malament la clausura d'un interval obert (no hi afegeix els extrems).
      pregunta: |
        Tota bola centrada en l'extrem d'un interval obert talla l'interval?
    nota_professor: |
      La Proposició 17(iv) de les notes conté un contraexemple pràcticament idèntic ($A=[0,1]$, $B=(1,2]$), per això és a `teoria_reservada`. La monotonia de la clausura és la Proposició 17(i), però es pot deduir directament de la definició.
- num: 19
  font: Exercici d'examen, abril 2018
  preambul: |
    Considereu els conjunts i aplicacions següents:
  indicacio: |
    Digueu quins són espais mètrics i quins no, demostrant les propietats de la distància si és el cas o proporcionant contraexemples en cas contrari. En els casos que siguin espai mètric, descriviu la bola oberta $B(\mathbf{0},\epsilon)$, per a $\epsilon>0$.
  exercicis:
  - id: t1-19a
    apartat: a
    tipus: teoric
    enunciat: |
      $(\mathbb{Z},d)$, $d(m,n)=|m-n|^3$.
    teoria:
    - T1.5
    teoria_reservada: []
    resultat:
      valor: |
        No és un espai mètric. Es compleixen la positivitat ($d\ge 0$, $d(m,n)=0\iff m=n$) i la simetria, però falla la desigualtat triangular: $d(0,2)=8>2=d(0,1)+d(1,2)$.
      fuites:
      - no\s+és\s+(un\s+)?(espai\s+)?m[eè]tric
      - no\s+és\s+(una\s+)?dist[aà]ncia
      - d\s*\(\s*0\s*,\s*2\s*\)\s*=\s*8
      - falla\s+(la\s+)?desigualtat\s+triangular
    passos:
    - id: propietats_facils
      titol: Positivitat i simetria
      objectiu: |
        Comprovar les dues primeres propietats de la definició de distància.
      idea: |
        Totes dues es dedueixen directament de les propietats del valor absolut.
      detall: |
        $|m-n|^3\ge 0$ i $|m-n|^3=0\iff m=n$; a més $|m-n|^3=|n-m|^3$.
      fuites: []
      teoria:
      - T1.5
    - id: triangular
      titol: Desigualtat triangular
      objectiu: |
        Estudiar si es compleix la desigualtat triangular.
      idea: |
        Elevar al cub fa créixer molt els valors grans: prova amb tres enters on el del mig parteixi la distància en dues parts iguals.
      detall: |
        Amb $m=0$, $k=1$, $n=2$: $d(0,2)=8>2=d(0,1)+d(1,2)$. Falla la desigualtat triangular i, per tant, $d$ no és una distància; no cal descriure cap bola.
      fuites:
      - d\s*\(\s*0\s*,\s*2\s*\)\s*=\s*8
      - falla\s+(la\s+)?desigualtat\s+triangular
      teoria:
      - T1.5
    errors_comuns:
    - id: prova_generica
      descripcio: |
        Intenta demostrar la desigualtat triangular elevant al cub $|m-n|\le|m-k|+|k-n|$ i conclou $|m-n|^3\le|m-k|^3+|k-n|^3$.
      pregunta: |
        Si $a\le b+c$ amb nombres no negatius, és cert que $a^3\le b^3+c^3$? Prova-ho amb $a=2$, $b=c=1$.
    - id: nomes_positivitat
      descripcio: |
        Comprova la positivitat i la simetria i dona per fet que és una distància.
      pregunta: |
        Quantes propietats ha de complir una distància? Les has comprovades totes?
    - id: descriu_bola
      descripcio: |
        Descriu la bola $B(0,\epsilon)$ sense haver decidit abans si és un espai mètric.
      pregunta: |
        L'enunciat demana la bola en tots els casos o només en alguns?
    nota_professor: |
      En canvi $|m-n|^{1/3}$ (o $|m-n|^p$ amb $0<p\le 1$) sí seria distància, per subadditivitat de $x\mapsto x^p$.
  - id: t1-19b
    apartat: b
    tipus: teoric
    enunciat: |
      $(\mathbb{R}^2,d)$, $d((x_1,x_2),(y_1,y_2))=|x_1+x_2-y_1-y_2|$.
    teoria:
    - T1.5
    teoria_reservada: []
    resultat:
      valor: |
        No és un espai mètric: falla $d(x,y)=0\Rightarrow x=y$, per exemple $d((1,0),(0,1))=|1-1|=0$ amb $(1,0)\neq(0,1)$. (La simetria i la desigualtat triangular sí que es compleixen.)
      fuites:
      - no\s+és\s+(un\s+)?(espai\s+)?m[eè]tric
      - no\s+és\s+(una\s+)?dist[aà]ncia
      - d\s*\(\s*\(1,\s*0\)\s*,\s*\(0,\s*1\)\s*\)\s*=
    passos:
    - id: simetria_triangular
      titol: Simetria i desigualtat triangular
      objectiu: |
        Comprovar la simetria i la desigualtat triangular.
      idea: |
        Escriu $d(x,y)=|s(x)-s(y)|$ amb $s(x)=x_1+x_2$: aleshores tot es redueix a propietats del valor absolut a $\mathbb{R}$.
      detall: |
        $d(x,y)=|s(x)-s(y)|=|s(y)-s(x)|=d(y,x)$ i $|s(x)-s(z)|\le|s(x)-s(y)|+|s(y)-s(z)|$, és a dir, $d(x,z)\le d(x,y)+d(y,z)$. També $d\ge 0$.
      fuites: []
      teoria:
      - T1.5
    - id: separacio
      titol: Distància zero
      objectiu: |
        Comprovar si $d(x,y)=0$ implica $x=y$.
      idea: |
        La distància només veu la suma de les coordenades. Busca dos punts diferents amb la mateixa suma.
      detall: |
        $d((1,0),(0,1))=|1+0-0-1|=0$ però $(1,0)\neq(0,1)$. Falla la propietat (i) i $d$ no és una distància (és una pseudodistància); no cal descriure cap bola.
      fuites:
      - d\s*\(\s*\(1,\s*0\)\s*,\s*\(0,\s*1\)\s*\)\s*=
      teoria:
      - T1.5
    errors_comuns:
    - id: confon_norma
      descripcio: |
        Confon $|x_1+x_2-y_1-y_2|$ amb la norma $1$, $|x_1-y_1|+|x_2-y_2|$.
      pregunta: |
        És el mateix $|a+b|$ que $|a|+|b|$? Quan coincideixen?
    - id: nomes_triangular
      descripcio: |
        Comprova la desigualtat triangular (que sí es compleix) i conclou que és distància sense mirar la separació de punts.
      pregunta: |
        Has comprovat que dos punts a distància zero han de ser el mateix punt?
    - id: descriu_bola
      descripcio: |
        Descriu la "bola" (una franja) com si fos espai mètric.
      pregunta: |
        L'enunciat demana la bola en tots els casos o només en alguns?
    nota_professor: |
      Les "boles" serien franges $\{|x_1+x_2|<\epsilon\}$, però no s'han de donar perquè no és espai mètric.
  - id: t1-19c
    apartat: c
    tipus: teoric
    enunciat: |
      $(\{0,1\}^{\mathbb{N}},d)$, $d(a,b)=\begin{cases}0 & a=b\\ 1/\min\{k\in\mathbb{N}\mid a_k\neq b_k\} & a\neq b.\end{cases}$
    teoria:
    - T1.5
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        Sí que és un espai mètric (de fet, $d(a,b)\le\max\{d(a,c),d(c,b)\}$). Si $\mathbf 0$ és la successió nul·la i $N=\lfloor 1/\epsilon\rfloor$:
        $B(\mathbf 0,\epsilon)=\{b\in\{0,1\}^{\mathbb{N}}\mid b_k=0\ \text{per a tot}\ k\le 1/\epsilon\}=\{b\mid b_1=\dots=b_N=0\}$. Si $\epsilon>1$ ($N=0$), la bola és tot l'espai.
      fuites:
      - b_\{?1\}?\s*=\s*\\[lc]?dots\s*=\s*b_\{?N
      - k\s*(\\le|\\leq|≤)\s*(1\s*/\s*(\\(var)?epsilon|ε)|\\d?frac\s*\{?1\}?\s*\{?\s*(\\(var)?epsilon|ε))
      - \\lfloor\s*(1\s*/\s*(\\(var)?epsilon|ε)|\\d?frac\s*\{?1\}?\s*\{?\s*(\\(var)?epsilon|ε))
    passos:
    - id: positivitat_simetria
      titol: Positivitat i simetria
      objectiu: |
        Comprovar que $d$ està ben definida i les propietats (i) i (ii) de distància.
      idea: |
        Si $a\neq b$ el conjunt d'índexs on difereixen és no buit; tot subconjunt no buit de $\mathbb{N}$ té mínim. La condició "$a_k\neq b_k$" és simètrica en $a$ i $b$.
      detall: |
        Si $a\neq b$, $k(a,b)=\min\{k\mid a_k\neq b_k\}$ existeix (bon ordre de $\mathbb{N}$) i $d(a,b)=1/k(a,b)>0$; si $a=b$, $d=0$. Per tant $d\ge 0$ i $d(a,b)=0\iff a=b$. A més $k(a,b)=k(b,a)$, d'on $d(a,b)=d(b,a)$.
      fuites: []
      teoria:
      - T1.5
    - id: triangular
      titol: Desigualtat triangular
      objectiu: |
        Demostrar $d(a,b)\le d(a,c)+d(c,b)$.
      idea: |
        Compara el primer índex on difereixen $a$ i $b$ amb els primers índexs on difereixen $a,c$ i $c,b$: si dues successions coincideixen fins a un cert punt amb una tercera, coincideixen entre elles fins al menor dels dos punts.
      detall: |
        Si dos dels tres punts coincideixen és immediat. Si no, $a_j=c_j$ per a $j<k(a,c)$ i $c_j=b_j$ per a $j<k(c,b)$, així que $a_j=b_j$ per a $j<\min\{k(a,c),k(c,b)\}$, i $k(a,b)\ge\min\{k(a,c),k(c,b)\}$. Per tant $d(a,b)\le\max\{d(a,c),d(c,b)\}\le d(a,c)+d(c,b)$.
      fuites:
      - \\max\s*\\\{\s*d\s*\(\s*a\s*,\s*c
      teoria:
      - T1.5
    - id: bola
      titol: Descriure la bola
      objectiu: |
        Descriure la bola oberta $B(\mathbf 0,\epsilon)$ centrada a la successió nul·la.
      idea: |
        Tradueix $d(\mathbf 0,b)<\epsilon$ a una condició sobre el primer índex on $b$ no és zero.
      detall: |
        $d(\mathbf 0,b)<\epsilon\iff b=\mathbf 0$ o $k(\mathbf 0,b)>1/\epsilon\iff b_k=0$ per a tot $k\le 1/\epsilon$. Amb $N=\lfloor 1/\epsilon\rfloor$: $B(\mathbf 0,\epsilon)=\{b\mid b_1=\dots=b_N=0\}$, les successions que comencen amb $N$ zeros. Si $\epsilon>1$, no hi ha cap condició i la bola és tot l'espai.
      fuites:
      - b_\{?1\}?\s*=\s*\\[lc]?dots\s*=\s*b_\{?N
      - k\s*(\\le|\\leq|≤)\s*(1\s*/\s*(\\(var)?epsilon|ε)|\\d?frac\s*\{?1\}?\s*\{?\s*(\\(var)?epsilon|ε))
      teoria:
      - T1.11
    errors_comuns:
    - id: desigualtat_invertida
      descripcio: |
        Confon el sentit: com més tard difereixen dues successions, pensa que més lluny són.
      pregunta: |
        Si $a$ i $b$ coincideixen en els 100 primers termes, la seva distància és gran o petita?
    - id: bola_frontera
      descripcio: |
        Descriu la bola amb una condició incorrecta en el límit (per exemple $k<1/\epsilon$ en lloc de $k\le 1/\epsilon$), o oblida el cas $\epsilon>1$.
      pregunta: |
        Si $\epsilon=1/3$, una successió amb $b_1=b_2=0$ i $b_3=1$ és a la bola? I si $\epsilon=2$, quines successions hi ha?
    - id: triangular_sense_cas
      descripcio: |
        A la desigualtat triangular no tracta el cas en què alguns dels punts coincideixen, on $k$ no està definit.
      pregunta: |
        Què val $d(a,c)$ si $a=c$? L'argument amb el primer índex on difereixen funciona aleshores?
    nota_professor: |
      Es pren $\mathbb{N}=\{1,2,\dots\}$ (si $0\in\mathbb{N}$, $1/0$ no tindria sentit). La distància és ultramètrica. La bola és també tancada (és un cilindre). Per a $\epsilon\le 1$ es pot escriure també $N$ com el major enter amb $N\epsilon\le 1$.
- num: 20
  font: Exercici d'examen
  preambul: |
    Siguin $A,B\subseteq\mathbb{R}$ i $E=\{xy\in\mathbb{R}\mid x\in A,\ y\in B\}$. Demostreu:
  indicacio: null
  exercicis:
  - id: t1-20a
    apartat: a
    tipus: teoric
    enunciat: |
      $A$ obert i $B\subseteq(0,+\infty)\Rightarrow E$ obert.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        $E=\bigcup_{y\in B}yA$, amb $yA=\{xy\mid x\in A\}$. Per a $y>0$, si $(a-r,a+r)\subseteq A$ aleshores $(ya-yr,ya+yr)=y(a-r,a+r)\subseteq yA$, de manera que $yA$ és obert. La unió arbitrària d'oberts és oberta, per tant $E$ és obert (si $B=\varnothing$, $E=\varnothing$, també obert).
      fuites: []
    passos:
    - id: descomposar
      titol: Escriure $E$ com una unió
      objectiu: |
        Expressar $E$ en termes de conjunts més senzills, fixant un dels dos factors.
      idea: |
        Fixa $y\in B$ i mira quins productes s'obtenen variant $x\in A$.
      detall: |
        $E=\bigcup_{y\in B}yA$, on $yA=\{xy\mid x\in A\}$.
      fuites:
      - \\bigcup_\{?\s*y\s*\\in\s*B
      teoria: []
    - id: dilatacio_oberta
      titol: Cada dilatació és oberta
      objectiu: |
        Veure que $yA$ és obert per a cada $y>0$.
      idea: |
        Multiplicar per $y>0$ multiplica les distàncies per $y$: una bola de radi $r$ al voltant de $a$ es transforma en una bola de radi proporcional al voltant de $ya$.
      detall: |
        Sigui $z=ya\in yA$ amb $a\in A$; com que $A$ és obert, existeix $r>0$ amb $(a-r,a+r)\subseteq A$. Si $|w-ya|<yr$, aleshores $w=y\cdot\frac wy$ amb $\left|\frac wy-a\right|<r$, és a dir, $\frac wy\in A$ i $w\in yA$. Així $(ya-yr,ya+yr)\subseteq yA$ (cal $y>0$ perquè el radi $yr$ sigui positiu).
      fuites:
      - \(\s*y\s*a\s*-\s*y\s*r
      teoria:
      - T1.11
    - id: unio
      titol: Concloure
      objectiu: |
        Concloure que $E$ és obert.
      idea: |
        Propietats dels oberts respecte de les unions.
      detall: |
        $E$ és unió (arbitrària) dels oberts $yA$, $y\in B$, i per tant és obert. Si $B=\varnothing$, $E=\varnothing$, que també és obert.
      fuites: []
      teoria:
      - T1.12
    errors_comuns:
    - id: producte_intervals
      descripcio: |
        Suposa que $A$ és un interval obert, o que $B$ és obert, i raona només en aquest cas.
      pregunta: |
        L'enunciat diu que $B$ sigui obert? I $A$, ha de ser un interval?
    - id: radi_mal_escalat
      descripcio: |
        Usa el mateix radi $r$ per a la bola al voltant de $ya$, sense escalar-lo per $y$.
      pregunta: |
        Si $y$ és molt gran, la bola de radi $r$ al voltant de $ya$ queda dins de $yA$? I si $y$ és molt petit?
    - id: un_sol_factor
      descripcio: |
        Intenta trobar una bola al voltant de $xy$ movent $x$ i $y$ alhora, i s'embolica amb una fita conjunta.
      pregunta: |
        Per veure que $xy$ és interior a $E$, cal moure tots dos factors o n'hi ha prou amb un?
    nota_professor: |
      L'argument només usa $y\neq 0$: el resultat val per a $B\subseteq\mathbb{R}\setminus\{0\}$ (multiplicar per $y<0$ també és un homeomorfisme). Alternativa: $x\mapsto yx$ és un homeomorfisme de $\mathbb{R}$, però a aquest tema encara no hi ha continuïtat.
  - id: t1-20b
    apartat: b
    tipus: teoric
    enunciat: |
      $A$ obert **no** implica $E$ obert.
    teoria:
    - T1.11
    teoria_reservada: []
    resultat:
      valor: |
        Contraexemple: $A=\mathbb{R}$ (o qualsevol obert no buit) i $B=\{0\}$. Aleshores $E=\{0\}$, que no és obert a $\mathbb{R}$ perquè cap bola $(-r,r)$ hi està continguda.
      fuites:
      - B\s*=\s*\\\{\s*0\s*\\\}
      - E\s*=\s*\\\{\s*0\s*\\\}
    passos:
    - id: on_falla
      titol: On falla l'argument de (a)
      objectiu: |
        Identificar quina hipòtesi de l'apartat (a) cal violar per trencar el resultat.
      idea: |
        A (a), multiplicar per $y$ convertia oberts en oberts perquè $y>0$. Pensa quin valor de $y$ destrueix aquesta propietat completament.
      detall: |
        Per $y=0$: $0\cdot A=\{0\}$ si $A\neq\varnothing$, que no és obert. Els valors $y<0$ no fan fallar res (també donen oberts).
      fuites:
      - 0\s*\\cdot\s*A\s*=\s*\\\{\s*0
      - \by\s*=\s*0\b
      teoria: []
    - id: contraexemple
      titol: Contraexemple
      objectiu: |
        Escriure $A$ i $B$ concrets i comprovar que $E$ no és obert.
      idea: |
        Tria $B$ que contingui només el valor problemàtic i $A$ un obert no buit qualsevol.
      detall: |
        $A=\mathbb{R}$, $B=\{0\}$: $E=\{0\}$. No és obert perquè per a tot $r>0$, $(-r,r)\not\subseteq\{0\}$.
      fuites:
      - B\s*=\s*\\\{\s*0\s*\\\}
      - E\s*=\s*\\\{\s*0\s*\\\}
      teoria:
      - T1.11
      - T1.x4
    errors_comuns:
    - id: A_buit
      descripcio: |
        Proposa $A=\varnothing$, que dona $E=\varnothing$, que sí és obert.
      pregunta: |
        Què val $E$ si $A$ és buit? És obert o no?
    - id: B_negatius
      descripcio: |
        Creu que prenent $B$ amb nombres negatius ja falla, quan multiplicar per un negatiu també dona oberts.
      pregunta: |
        Si $A=(1,2)$ i $y=-1$, què és $yA$? És obert?
    - id: no_justifica
      descripcio: |
        Dona el contraexemple sense justificar per què $E$ no és obert.
      pregunta: |
        Quina definició d'obert has de fer servir per veure que el teu $E$ no ho és?
    nota_professor: |
      L'únic valor de $B$ que pot fer fallar el resultat és $0$ (si $0\notin B$, el mateix argument de (a) funciona). Un altre contraexemple: $A=(-1,1)$, $B=\{0\}$; o $B=\{0\}$ amb qualsevol obert no buit.
