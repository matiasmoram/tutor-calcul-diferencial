        Valors propis $2>0$ i $-2<0$: la forma hessiana és indefinida i, per les condicions suficients, $(0,0,1)$ és un punt de sella. Directament: $f(x,0,1)=x^2>0$, $f(0,y,1)=-y^2<0$.
