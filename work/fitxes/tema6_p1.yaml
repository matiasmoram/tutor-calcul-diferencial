problemes:
  - num: 1
    font: null
    preambul: |
      Doneu una parametrització de classe $\mathcal{C}^1$ de les corbes següents:
    indicacio: null
    exercicis:
      - id: "t6-1a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          Una el·lipse centrada a l'origen, de semieixos $a,b>0$, recorreguda dos cops en sentit horari.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            Per exemple, $\gamma(t)=(a\cos t,\,-b\sin t)$, $t\in[0,4\pi]$ (o bé $\gamma(t)=(a\cos 2t,\,-b\sin 2t)$, $t\in[0,2\pi]$). És $\mathcal{C}^\infty$ i $\gamma'(t)=(-a\sin t,\,-b\cos t)\neq(0,0)$ per a tot $t$. Qualsevol altra parametrització regular que recorri l'el·lipse $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$ dues vegades en sentit horari també és correcta.
          fuites: ['-\s*b\s*\\sin\s*\(?\s*2?\s*t']
        passos:
          - id: una_volta
            titol: "Parametritzar l'el·lipse una vegada"
            objectiu: |
              Donar una parametrització que recorri l'el·lipse una sola vegada, sense preocupar-se encara pel sentit.
            idea: |
              Escriure l'equació de l'el·lipse i adaptar-hi la parametrització de la circumferència unitat amb cosinus i sinus, escalant cada coordenada pel semieix corresponent.
            detall: |
              L'el·lipse és $\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$. Com que $\cos^2t+\sin^2t=1$, la corba $(a\cos t,\,b\sin t)$, $t\in[0,2\pi]$, la recorre una vegada, començant a $(a,0)$.
            fuites: ['a\s*\\cos\s*t\s*,\s*\\?,?\s*b\s*\\sin\s*t']
            teoria: []
          - id: sentit
            titol: "Ajustar el sentit"
            objectiu: |
              Determinar en quin sentit es recorre la corba anterior i, si cal, canviar-lo perquè sigui horari.
            idea: |
              Mirar el vector velocitat en un punt concret (per exemple a $(a,0)$): cap a on es mou el punt? Per invertir el sentit n'hi ha prou de canviar el signe d'una de les coordenades (o substituir $t$ per $-t$).
            detall: |
              A $t=0$, $(a\cos t,b\sin t)$ passa per $(a,0)$ amb velocitat $(0,b)$, cap amunt: sentit antihorari. Canviant $t\mapsto -t$ s'obté $(a\cos t,\,-b\sin t)$, amb velocitat $(0,-b)$ a $(a,0)$: sentit horari.
            fuites: ['-\s*b\s*\\sin']
            teoria: []
          - id: dos_cops
            titol: "Recórrer-la dos cops"
            objectiu: |
              Aconseguir que la corba doni exactament dues voltes.
            idea: |
              O bé s'allarga l'interval de paràmetre, o bé es multiplica el paràmetre per una constant dins de les funcions trigonomètriques.
            detall: |
              Prenent $t\in[0,4\pi]$ (o bé $\gamma(t)=(a\cos 2t,-b\sin 2t)$ amb $t\in[0,2\pi]$) el punt dona dues voltes completes.
            fuites: ['4\s*\\pi', '\\(cos|sin)\s*\(?\s*2\s*t']
            teoria: []
          - id: regularitat
            titol: "Comprovar que és $\\mathcal{C}^1$ i regular"
            objectiu: |
              Justificar que la parametrització obtinguda és de classe $\mathcal{C}^1$ i té vector velocitat no nul.
            idea: |
              Les components són funcions trigonomètriques; cal mirar si $\gamma'(t)$ s'anul·la mai (rang de $D\gamma$ igual a $1$).
            detall: |
              $\gamma'(t)=(-a\sin t,\,-b\cos t)$; com que $\sin t$ i $\cos t$ no s'anul·len simultàniament i $a,b>0$, $\gamma'(t)\neq(0,0)$ per a tot $t$, és a dir, $\mathrm{rang}\,D\gamma(t)=1$.
            fuites: []
            teoria: ["T6.3"]
        errors_comuns:
          - id: sentit_antihorari
            descripcio: |
              Dona $(a\cos t,b\sin t)$ sense adonar-se que es recorre en sentit antihorari.
            pregunta: |
              Si comences al punt $(a,0)$, la teva corba puja o baixa just després de $t=0$? Quin sentit és aquest?
          - id: una_sola_volta
            descripcio: |
              Usa l'interval $[0,2\pi]$ amb $\cos t$, $\sin t$, de manera que només dona una volta.
            pregunta: |
              Quantes voltes fa la teva corba quan el paràmetre recorre tot l'interval que has triat?
          - id: semieixos_intercanviats
            descripcio: |
              Posa el semieix $a$ a la coordenada $y$ i el $b$ a la $x$ (o no especifica quin és quin) sense dir-ho.
            pregunta: |
              Quins són els punts de tall de la teva corba amb els eixos? Coincideixen amb els semieixos que has fixat per a cada direcció?
        nota_professor: |
          L'enunciat no diu quin semieix va en cada direcció: cal fixar-ho (aquí $a$ en la direcció de $OX$). Una parametrització que fa dues voltes no és injectiva, per tant no és una carta en el sentit de la definició 3 del tema; aquí "parametrització $\mathcal{C}^1$" s'entén com a corba $\mathcal{C}^1$ amb velocitat no nul·la.

      - id: "t6-1b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          La gràfica de la funció $f(x)=2^x-2x$, entre els punts $(0,1)$ i $(3,2)$.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            $\gamma(t)=(t,\,2^t-2t)$, $t\in[0,3]$. És $\mathcal{C}^\infty$ i $\gamma'(t)=(1,\,2^t\ln 2-2)\neq(0,0)$.
          fuites: ['\(\s*t\s*,\s*\\?,?\s*2\^\{?t\}?\s*-\s*2\s*t\s*\)']
        passos:
          - id: grafica
            titol: "Parametritzar una gràfica"
            objectiu: |
              Escriure una corba que recorri la gràfica de $f$.
            idea: |
              Una gràfica $y=f(x)$ es parametritza de manera natural prenent la mateixa $x$ com a paràmetre.
            detall: |
              $\gamma(t)=(t,\,f(t))=(t,\,2^t-2t)$.
            fuites: ['\(\s*t\s*,\s*\\?,?\s*2\^\{?t\}?\s*-\s*2\s*t\s*\)']
            teoria: ["T6.8"]
          - id: interval
            titol: "Triar l'interval"
            objectiu: |
              Determinar l'interval de paràmetre que correspon al tros entre els dos punts donats.
            idea: |
              Comprovar que els punts donats són de la gràfica i llegir-ne l'abscissa.
            detall: |
              $f(0)=1$ i $f(3)=8-6=2$, així que els punts són a la gràfica i $t\in[0,3]$.
            fuites: ['t\s*\\in\s*\[\s*0\s*,\s*3\s*\]']
            teoria: []
          - id: regularitat
            titol: "Comprovar que és $\\mathcal{C}^1$ i regular"
            objectiu: |
              Justificar que la parametrització és $\mathcal{C}^1$ amb velocitat no nul·la.
            idea: |
              Derivar component a component; fixeu-vos en la primera component.
            detall: |
              $\gamma'(t)=(1,\,2^t\ln2-2)$: la primera component val sempre $1$, així que $\gamma'(t)\neq 0$ i $\mathrm{rang}\,D\gamma=1$.
            fuites: []
            teoria: ["T6.3", "T6.8"]
        errors_comuns:
          - id: interval_erroni
            descripcio: |
              Tria com a interval de paràmetre $[1,2]$ (les ordenades dels punts) en lloc de les abscisses.
            pregunta: |
              Quin valor del paràmetre et dona el punt $(3,2)$ amb la teva corba?
          - id: derivada_exponencial
            descripcio: |
              Deriva $2^t$ com $t\,2^{t-1}$.
            pregunta: |
              Si escrius $2^t=e^{t\ln 2}$, quina és la seva derivada?
        nota_professor: |
          Cas directe de la proposició sobre gràfiques. Tota parametrització reparametritzada (p. ex. $t\in[0,1]$ amb $x=3t$) també és vàlida.

      - id: "t6-1c"
        apartat: "c"
        tipus: calcul
        enunciat: |
          Una paràbola en un pla paral·lel al pla $YZ$, de vèrtex en $(3,-5,-2)$ i que passi per $(3,-1.0)$.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            (Llegint el punt com $(3,-1,0)$.) La paràbola és al pla $x=3$. Amb l'eix paral·lel a $OZ$: $z+2=k(y+5)^2$ i imposant $(3,-1,0)$, $2=16k$, $k=\frac18$; una parametrització és $\gamma(t)=\left(3,\ t,\ -2+\frac{(t+5)^2}{8}\right)$, $t\in\mathbb{R}$, amb $\gamma'(t)=\left(0,1,\frac{t+5}{4}\right)\neq0$.
            Si es pren l'eix paral·lel a $OY$: $y+5=k(z+2)^2$, $4=4k$, $k=1$, i $\gamma(t)=\left(3,\ -5+(t+2)^2,\ t\right)$, $t\in\mathbb{R}$. Totes dues són respostes vàlides (l'enunciat no fixa l'eix).
          fuites: ['\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*8\s*\}?', 'k\s*=\s*1\s*/\s*8', '\(\s*t\s*\+\s*5\s*\)\^\{?2\}?\s*\}?\s*(/|\}\s*\{)\s*8', '-\s*5\s*\+\s*\(\s*t\s*\+\s*2\s*\)\^\{?2\}?']
        passos:
          - id: pla
            titol: "Identificar el pla"
            objectiu: |
              Determinar en quin pla es troba la paràbola i comprovar que els dos punts hi són.
            idea: |
              Un pla paral·lel a $YZ$ té una de les coordenades constant; quina, i quin valor ha de prendre perquè hi siguin els punts donats?
            detall: |
              El pla és $x=3$ (els dos punts tenen $x=3$). El punt $(3,-1.0)$ s'ha de llegir com $(3,-1,0)$. Dins el pla, la paràbola viu en les coordenades $(y,z)$, amb vèrtex $(y,z)=(-5,-2)$ i passant per $(-1,0)$.
            fuites: []
            teoria: []
          - id: equacio
            titol: "Equació de la paràbola"
            objectiu: |
              Escriure una equació de la paràbola en el pla trobat, triant la direcció del seu eix.
            idea: |
              L'enunciat no fixa l'eix; el més natural és prendre'l paral·lel a un dels eixos coordenats del pla. Una paràbola de vèrtex $(y_0,z_0)$ amb eix paral·lel a $OZ$ té equació $z-z_0=k(y-y_0)^2$; la constant $k$ es fixa amb el punt de pas.
            detall: |
              Eix paral·lel a $OZ$: $z+2=k(y+5)^2$. Amb $(y,z)=(-1,0)$: $2=16k$, és a dir $k=\frac18$. (Amb eix paral·lel a $OY$: $y+5=k(z+2)^2$, $4=4k$, $k=1$.)
            fuites: ['\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*8\s*\}?', 'k\s*=\s*1\s*/\s*8', '2\s*=\s*16\s*k']
            teoria: []
          - id: parametritzar
            titol: "Parametritzar"
            objectiu: |
              Convertir l'equació en una parametrització regular de classe $\mathcal{C}^1$.
            idea: |
              La paràbola és una gràfica dins el pla: prendre com a paràmetre la variable lliure i mantenir la coordenada constant.
            detall: |
              $\gamma(t)=\left(3,\ t,\ -2+\frac{(t+5)^2}{8}\right)$, $t\in\mathbb{R}$, amb $\gamma'(t)=\left(0,\,1,\,\frac{t+5}{4}\right)\neq0$. (Alternativa: $\gamma(t)=(3,\,-5+(t+2)^2,\,t)$.)
            fuites: ['\(\s*t\s*\+\s*5\s*\)\^\{?2\}?\s*\}?\s*(/|\}\s*\{)\s*8']
            teoria: ["T6.3"]
        errors_comuns:
          - id: pla_erroni
            descripcio: |
              Pensa que "paral·lel al pla $YZ$" vol dir $y$ o $z$ constant.
            pregunta: |
              Quina coordenada és la mateixa per a tots els punts del pla $YZ$? I per a un pla paral·lel a ell?
          - id: vertex_no_imposat
            descripcio: |
              Escriu una paràbola $z=ky^2+\dots$ que passa pels dos punts però no té el vèrtex al punt donat (per exemple, amb un terme lineal mal ajustat).
            pregunta: |
              On és el vèrtex de la paràbola que has escrit? Com ho comprovaries?
          - id: oblida_x
            descripcio: |
              Dona una corba plana $(y(t),z(t))$ oblidant la coordenada $x=3$.
            pregunta: |
              La corba que busques és a $\mathbb{R}^2$ o a $\mathbb{R}^3$? Quantes components ha de tenir?
        nota_professor: |
          Errata a l'enunciat (també al PDF original): "$(3,-1.0)$" ha de ser $(3,-1,0)$. A més, l'enunciat no fixa la direcció de l'eix de la paràbola; si el problema es dona per "eix paral·lel a un eix coordenat" hi ha les dues solucions de la fitxa, i qualsevol paràbola del pla $x=3$ amb aquest vèrtex que passi pel punt també és acceptable si l'alumne explica l'eix que ha triat.

      - id: "t6-1d"
        apartat: "d"
        tipus: calcul
        enunciat: |
          La corba intersecció del cilindre $9x^2+y^2=1$ amb el pla $2x-z+4=0$.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            $\gamma(t)=\left(\frac13\cos t,\ \sin t,\ 4+\frac23\cos t\right)$, $t\in[0,2\pi]$, amb $\gamma'(t)=\left(-\frac13\sin t,\,\cos t,\,-\frac23\sin t\right)\neq0$.
          fuites: ['\\[dt]?frac\s*\{?\s*2\s*\}?\s*\{?\s*3\s*\}?\s*\\cos', '2\s*\\cos\s*t\s*/\s*3', '\\[dt]?frac\s*\{\s*2\s*\\cos\s*t\s*\}\s*\{\s*3']
        passos:
          - id: projeccio
            titol: "Parametritzar la projecció sobre el pla $XY$"
            objectiu: |
              Parametritzar la corba del pla $XY$ definida per l'equació del cilindre.
            idea: |
              L'equació del cilindre no depèn de $z$: és una el·lipse al pla $XY$. Escriure-la en forma $\frac{x^2}{\alpha^2}+\frac{y^2}{\beta^2}=1$ i usar cosinus i sinus.
            detall: |
              $9x^2+y^2=1 \iff \frac{x^2}{(1/3)^2}+y^2=1$, i per tant $x=\frac13\cos t$, $y=\sin t$, $t\in[0,2\pi]$.
            fuites: ['\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*3\s*\}?\s*\\cos', '\\cos\s*t\s*/\s*3', '\\[dt]?frac\s*\{\s*\\cos\s*t\s*\}\s*\{\s*3']
            teoria: []
          - id: alcada
            titol: "Afegir la coordenada $z$"
            objectiu: |
              Trobar la tercera coordenada dels punts de la corba.
            idea: |
              Els punts de la corba han de satisfer també l'equació del pla, que permet aïllar una de les coordenades.
            detall: |
              Del pla, $z=2x+4=4+\frac23\cos t$. Per tant $\gamma(t)=\left(\frac13\cos t,\ \sin t,\ 4+\frac23\cos t\right)$, $t\in[0,2\pi]$.
            fuites: ['z\s*=\s*2\s*x\s*\+\s*4', '4\s*\+\s*\\[dt]?frac\s*\{?\s*2']
            teoria: []
          - id: regularitat
            titol: "Comprovar la regularitat"
            objectiu: |
              Justificar que la parametrització és $\mathcal{C}^1$ i regular.
            idea: |
              Calcular $\gamma'(t)$ i veure que no s'anul·la mai.
            detall: |
              $\gamma'(t)=\left(-\frac13\sin t,\,\cos t,\,-\frac23\sin t\right)$; les dues primeres components no s'anul·len a la vegada, així que $\gamma'(t)\neq0$.
            fuites: []
            teoria: ["T6.3"]
        errors_comuns:
          - id: semieix_invers
            descripcio: |
              Pren $x=3\cos t$ en lloc de $x=\frac13\cos t$.
            pregunta: |
              Substitueix la teva $x(t)$ i $y(t)$ a $9x^2+y^2$: dona $1$?
          - id: z_erronia
            descripcio: |
              S'equivoca de signe en aïllar $z$ del pla (p. ex. $z=-2x-4$ o $z=2x-4$).
            pregunta: |
              Comprova un punt: el teu $\gamma(0)$ satisfà l'equació $2x-z+4=0$?
        nota_professor: |
          Intersecció d'un cilindre el·líptic amb un pla no vertical: és una el·lipse. Es pot comprovar que és una 1-varietat (rang 2 de $D\Phi$ amb $\Phi=(9x^2+y^2-1,\,2x-z+4)$ als punts de la corba).

      - id: "t6-1e"
        apartat: "e"
        tipus: calcul
        enunciat: |
          La circumferència de centre $(-1,1,3)$ i radi $R>0$ al pla $z=3$.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            $\gamma(t)=(-1+R\cos t,\ 1+R\sin t,\ 3)$, $t\in[0,2\pi]$, amb $\gamma'(t)=(-R\sin t,\,R\cos t,\,0)\neq0$.
          fuites: ['-\s*1\s*\+\s*R\s*\\cos', '1\s*\+\s*R\s*\\sin']
        passos:
          - id: pla
            titol: "Reduir al pla"
            objectiu: |
              Descriure la circumferència per equacions en $\mathbb{R}^3$.
            idea: |
              És la intersecció del pla donat amb una esfera (o un cilindre) centrada al centre de la circumferència; dins el pla, és una circumferència de les dues coordenades lliures.
            detall: |
              Els punts són els $(x,y,3)$ amb $(x+1)^2+(y-1)^2=R^2$.
            fuites: ['\(\s*x\s*\+\s*1\s*\)\^\{?2\}?\s*\+\s*\(\s*y\s*-\s*1\s*\)\^\{?2\}?']
            teoria: []
          - id: parametritzar
            titol: "Parametritzar"
            objectiu: |
              Donar una parametrització regular de classe $\mathcal{C}^1$.
            idea: |
              Traslladar la parametrització trigonomètrica d'una circumferència de radi $R$ al centre donat, i mantenir la coordenada fixa.
            detall: |
              $\gamma(t)=(-1+R\cos t,\ 1+R\sin t,\ 3)$, $t\in[0,2\pi]$; $\gamma'(t)=(-R\sin t,\,R\cos t,\,0)$ té norma $R>0$.
            fuites: ['-\s*1\s*\+\s*R\s*\\cos']
            teoria: ["T6.3"]
        errors_comuns:
          - id: centre_signes
            descripcio: |
              Escriu $(1+R\cos t,\,-1+R\sin t,\,3)$, amb els signes del centre canviats.
            pregunta: |
              Quin punt s'obté si poses $R=0$ a la teva fórmula? És el centre?
          - id: oblida_z
            descripcio: |
              Dona una parametrització de dues components oblidant $z=3$.
            pregunta: |
              On viu la circumferència? Quantes coordenades han de tenir els seus punts?
        nota_professor: |
          Exercici directe. Qualsevol sentit de recorregut és vàlid.

      - id: "t6-1f"
        apartat: "f"
        tipus: calcul
        enunciat: |
          El tros d'hipèrbola d'equació $\dfrac{x^2}{a^2}-\dfrac{(y-1)^2}{b^2}=1$, amb $x\leq0$, $y\leq1$.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            $\gamma(t)=(-a\cosh t,\ 1-b\sinh t)$, $t\in[0,+\infty)$ (suposant $a,b>0$), amb $\gamma'(t)=(-a\sinh t,\,-b\cosh t)\neq0$ perquè $\cosh t>0$.
          fuites: ['-\s*a\s*\\cosh', '1\s*-\s*b\s*\\sinh']
        passos:
          - id: identitat
            titol: "Triar funcions que satisfacin l'equació"
            objectiu: |
              Trobar una parametrització de tota la branca corresponent de la hipèrbola.
            idea: |
              Per a l'el·lipse s'usa $\cos^2+\sin^2=1$; per a la hipèrbola hi ha una identitat anàloga amb una diferència de quadrats igual a $1$, amb funcions hiperbòliques.
            detall: |
              Com que $\cosh^2t-\sinh^2t=1$, posant $\frac{x}{a}=\pm\cosh t$ i $\frac{y-1}{b}=\sinh t$ (o $-\sinh t$) es compleix l'equació. Com que $\cosh t\geq1$, el signe de $x$ el fixa el signe davant de $\cosh$.
            fuites: ['\\cosh\^\{?2\}?\s*t?\s*-\s*\\sinh\^\{?2\}?']
            teoria: []
          - id: signes
            titol: "Imposar $x\\leq0$ i $y\\leq1$"
            objectiu: |
              Triar signes i interval de paràmetre perquè només es recorri el tros demanat.
            idea: |
              $\cosh t$ és sempre positiu i $\sinh t$ té el signe de $t$: aprofitar-ho per controlar el signe de $x$ i de $y-1$.
            detall: |
              $x=-a\cosh t\leq -a<0$ dona la branca esquerra. $y-1=-b\sinh t\leq0 \iff t\geq0$. Així $\gamma(t)=(-a\cosh t,\ 1-b\sinh t)$, $t\in[0,+\infty)$, que comença al vèrtex $(-a,1)$.
            fuites: ['-\s*a\s*\\cosh', '1\s*-\s*b\s*\\sinh']
            teoria: []
          - id: regularitat
            titol: "Comprovar la regularitat"
            objectiu: |
              Justificar que la parametrització és $\mathcal{C}^1$ i regular.
            idea: |
              Derivar i mirar quina component no s'anul·la mai.
            detall: |
              $\gamma'(t)=(-a\sinh t,\,-b\cosh t)$ i $\cosh t\geq1$, així que $\gamma'(t)\neq0$ per a tot $t$.
            fuites: []
            teoria: ["T6.3"]
        errors_comuns:
          - id: grafica_vertex
            descripcio: |
              Aïlla $y=1-b\sqrt{x^2/a^2-1}$ i parametritza com a gràfica en $x\in(-\infty,-a]$, sense veure que la derivada explota al vèrtex $x=-a$, de manera que no és $\mathcal{C}^1$ en tot l'interval tancat.
            pregunta: |
              Què passa amb la derivada de la teva parametrització quan $x\to -a$?
          - id: branca_equivocada
            descripcio: |
              Pren $x=a\cosh t$ (branca dreta) o $t\in\mathbb{R}$ sencer (inclou $y>1$).
            pregunta: |
              Comprova en un valor concret del paràmetre: el punt que obtens compleix $x\leq0$ i $y\leq1$?
          - id: trig_en_hiperbola
            descripcio: |
              Intenta usar $x=a\cos t$, $y=1+b\sin t$, que dona una el·lipse.
            pregunta: |
              Substitueix la teva parametrització a l'equació: obtens una diferència o una suma de quadrats?
        nota_professor: |
          Alternatives vàlides: $\gamma(s)=\left(-a\sqrt{1+s^2},\ 1-bs\right)$, $s\geq0$, o la versió amb $\frac{1}{\cos}$ i $\tan$ ($x=-\frac{a}{\cos t}$, $y=1-b\tan t$, $t\in[0,\pi/2)$). Es suposa $a,b>0$.

  - num: 2
    font: null
    preambul: |
      Doneu una parametrització de classe $\mathcal{C}^1$ de les superfícies següents:
    indicacio: null
    exercicis:
      - id: "t6-2a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          El pla $Ax+By+Cz=D$, on $B\neq0$.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            $\varphi(u,v)=\left(u,\ \frac{D-Au-Cv}{B},\ v\right)$, $(u,v)\in\mathbb{R}^2$. És $\mathcal{C}^\infty$ i $D\varphi$ té les columnes $(1,-A/B,0)$ i $(0,-C/B,1)$, linealment independents: rang $2$.
          fuites: ['D\s*-\s*A\s*u\s*-\s*C\s*v']
        passos:
          - id: aillar
            titol: "Aïllar una variable"
            objectiu: |
              Escriure el pla com la gràfica d'una funció de dues variables.
            idea: |
              Aprofitar la hipòtesi $B\neq0$ per aïllar la variable corresponent en funció de les altres dues.
            detall: |
              Com que $B\neq0$, $y=\frac{D-Ax-Cz}{B}$: el pla és la gràfica d'una funció de $(x,z)$.
            fuites: ['y\s*=\s*\\?[dt]?(frac)?\s*\{?\(?\s*D\s*-\s*A\s*x\s*-\s*C\s*z']
            teoria: ["T6.8"]
          - id: parametritzar
            titol: "Parametritzar i comprovar el rang"
            objectiu: |
              Donar la parametrització i justificar que és regular.
            idea: |
              Les gràfiques es parametritzen prenent com a paràmetres les variables independents; calcular $D\varphi$ i el seu rang.
            detall: |
              $\varphi(u,v)=\left(u,\ \frac{D-Au-Cv}{B},\ v\right)$, $(u,v)\in\mathbb{R}^2$. $D\varphi=\begin{pmatrix}1&0\\-A/B&-C/B\\0&1\end{pmatrix}$, de rang $2$ (el menor format per les files 1 i 3 és la identitat).
            fuites: ['D\s*-\s*A\s*u\s*-\s*C\s*v']
            teoria: ["T6.8", "T6.3"]
        errors_comuns:
          - id: aillar_sense_hipotesi
            descripcio: |
              Aïlla $x$ o $z$, dividint per $A$ o $C$, que podrien ser nuls.
            pregunta: |
              Per quin coeficient divideixes? Saps que és diferent de zero?
          - id: ordre_coordenades
            descripcio: |
              Escriu $\varphi(u,v)=(u,v,\frac{D-Au-Cv}{B})$, posant la variable aïllada en la posició equivocada.
            pregunta: |
              Comprova-ho: el punt $\varphi(u,v)$ que dones satisfà $Ax+By+Cz=D$?
        nota_professor: |
          Alternativa: $\varphi(u,v)=P_0+u\,\mathbf{w}_1+v\,\mathbf{w}_2$ amb $P_0$ un punt del pla i $\mathbf{w}_1,\mathbf{w}_2$ una base de $\langle(A,B,C)\rangle^\perp$.

      - id: "t6-2b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          La gràfica de la funció $f(x,y)=x^2-y^2$ en el seu domini.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            $\varphi(u,v)=(u,\ v,\ u^2-v^2)$, $(u,v)\in\mathbb{R}^2$, amb $D\varphi$ de columnes $(1,0,2u)$ i $(0,1,-2v)$, de rang $2$.
          fuites: ['\(\s*u\s*,\s*\\?,?\s*v\s*,\s*\\?,?\s*u\^\{?2\}?\s*-\s*v\^\{?2\}?\s*\)', '\(\s*x\s*,\s*\\?,?\s*y\s*,\s*\\?,?\s*x\^\{?2\}?\s*-\s*y\^\{?2\}?\s*\)']
        passos:
          - id: parametritzar
            titol: "Parametritzar la gràfica"
            objectiu: |
              Escriure una parametrització de la gràfica de $f$ definida a tot el seu domini.
            idea: |
              Determinar primer el domini de $f$; una gràfica es parametritza amb les variables independents com a paràmetres.
            detall: |
              El domini és $\mathbb{R}^2$ i $\varphi(u,v)=(u,v,u^2-v^2)$, $(u,v)\in\mathbb{R}^2$.
            fuites: ['\(\s*u\s*,\s*\\?,?\s*v\s*,\s*\\?,?\s*u\^\{?2\}?\s*-\s*v\^\{?2\}?\s*\)']
            teoria: ["T6.8"]
          - id: rang
            titol: "Comprovar el rang"
            objectiu: |
              Justificar que la parametrització és $\mathcal{C}^1$ i té diferencial de rang màxim.
            idea: |
              Calcular $D\varphi$ i buscar-hi un menor $2\times2$ no nul.
            detall: |
              $D\varphi(u,v)=\begin{pmatrix}1&0\\0&1\\2u&-2v\end{pmatrix}$, que conté la identitat: rang $2$ a tot arreu.
            fuites: []
            teoria: ["T6.3", "T6.8"]
        errors_comuns:
          - id: domini_restringit
            descripcio: |
              Restringeix el domini innecessàriament (p. ex. a $x\geq y$) o confon el domini amb la imatge.
            pregunta: |
              Per a quins $(x,y)$ té sentit calcular $x^2-y^2$?
          - id: rang_no_justificat
            descripcio: |
              No comprova (o no sap justificar) que el rang de $D\varphi$ és $2$.
            pregunta: |
              Quin menor $2\times2$ de $D\varphi$ pots calcular sense esforç?
        nota_professor: |
          Aplicació immediata de la proposició sobre gràfiques.

      - id: "t6-2c"
        apartat: "c"
        tipus: calcul
        enunciat: |
          Un cilindre d'altura $H$, radi de la base $R$ i eix $OY$.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            Prenent la base al pla $y=0$: $\varphi(\theta,s)=(R\cos\theta,\ s,\ R\sin\theta)$, $(\theta,s)\in[0,2\pi]\times[0,H]$. Les columnes de $D\varphi$, $(-R\sin\theta,0,R\cos\theta)$ i $(0,1,0)$, són linealment independents (rang $2$). Qualsevol interval de longitud $H$ per a $s$ és igualment vàlid.
          fuites: ['R\s*\\cos\s*\\?\w+\s*,\s*\\?,?\s*\w+\s*,\s*\\?,?\s*R\s*\\sin']
        passos:
          - id: equacio
            titol: "Equació del cilindre"
            objectiu: |
              Escriure les condicions que satisfan els punts del cilindre.
            idea: |
              La distància d'un punt a l'eix $OY$ només depèn de dues de les coordenades; la tercera mesura l'altura al llarg de l'eix.
            detall: |
              Els punts són els $(x,y,z)$ amb $x^2+z^2=R^2$ i $0\leq y\leq H$ (base al pla $y=0$).
            fuites: ['x\^\{?2\}?\s*\+\s*z\^\{?2\}?\s*=\s*R\^\{?2\}?']
            teoria: []
          - id: parametritzar
            titol: "Parametritzar"
            objectiu: |
              Donar una parametrització de classe $\mathcal{C}^1$ i comprovar-ne el rang.
            idea: |
              Parametritzar la circumferència de la secció amb un angle i usar la coordenada de l'eix com a segon paràmetre.
            detall: |
              $\varphi(\theta,s)=(R\cos\theta,\ s,\ R\sin\theta)$, $(\theta,s)\in[0,2\pi]\times[0,H]$. $D\varphi=\begin{pmatrix}-R\sin\theta&0\\0&1\\R\cos\theta&0\end{pmatrix}$, de rang $2$ perquè la primera columna és no nul·la i la segona no n'és múltiple.
            fuites: ['R\s*\\cos\s*\\?\w+\s*,\s*\\?,?\s*\w+\s*,\s*\\?,?\s*R\s*\\sin']
            teoria: ["T6.3"]
        errors_comuns:
          - id: eix_equivocat
            descripcio: |
              Usa la parametrització habitual amb eix $OZ$, $(R\cos\theta,R\sin\theta,s)$.
            pregunta: |
              Quina coordenada varia lliurement al llarg d'una recta paral·lela a l'eix del teu cilindre? És la que correspon a l'eix $OY$?
          - id: altura_infinita
            descripcio: |
              Pren $s\in\mathbb{R}$, oblidant l'altura $H$.
            pregunta: |
              Quina longitud té el teu cilindre en la direcció de l'eix?
        nota_professor: |
          L'enunciat no diu on és la base: qualsevol interval $[y_0,y_0+H]$ és vàlid. Si es vol obert (definició de varietat) es pren $(0,2\pi)\times(0,H)$.

      - id: "t6-2d"
        apartat: "d"
        tipus: calcul
        enunciat: |
          Una esfera de radi $R$, centrada a l'origen.
        teoria: ["T6.5"]
        teoria_reservada: ["T6.6"]
        resultat:
          valor: |
            $\varphi(u,v)=R\,(\cos u\cos v,\ \sin u\cos v,\ \sin v)$, $(u,v)\in[0,2\pi]\times[-\pi/2,\pi/2]$. És $\mathcal{C}^\infty$, i $D\varphi$ té rang $2$ excepte quan $\cos v=0$ (els pols), on té rang $1$; restringint a $(0,2\pi)\times(-\pi/2,\pi/2)$ és una carta regular.
          fuites: ['\\sin\s*\\?\w+\s*\\cos\s*\\?\w+\s*,\s*\\?,?\s*\\sin', '\\sin\s*\\?\w+\s*\\sin\s*\\?\w+\s*,\s*\\?,?\s*\\cos']
        passos:
          - id: esferiques
            titol: "Coordenades esfèriques"
            objectiu: |
              Expressar els punts de l'esfera en funció de dos angles.
            idea: |
              Fixar la "latitud" $v$: la secció horitzontal és una circumferència de radi $R\cos v$ a l'altura $R\sin v$; parametritzar-la amb la "longitud" $u$.
            detall: |
              $\varphi(u,v)=R\,(\cos u\cos v,\ \sin u\cos v,\ \sin v)$, amb $u\in[0,2\pi]$, $v\in[-\pi/2,\pi/2]$. Comprovació: $\|\varphi\|^2=R^2(\cos^2v(\cos^2u+\sin^2u)+\sin^2v)=R^2$.
            fuites: ['\\sin\s*\\?\w+\s*\\cos\s*\\?\w+\s*,\s*\\?,?\s*\\sin']
            teoria: []
          - id: rang
            titol: "Estudiar el rang"
            objectiu: |
              Determinar on la parametrització és regular.
            idea: |
              Calcular $D\varphi$ i mirar per a quins valors dels paràmetres les dues columnes són dependents.
            detall: |
              $D\varphi=R\begin{pmatrix}-\sin u\cos v&-\cos u\sin v\\\cos u\cos v&-\sin u\sin v\\0&\cos v\end{pmatrix}$. Si $\cos v\neq0$ el rang és $2$; per $v=\pm\pi/2$ la primera columna és nul·la (rang $1$). Per tant és regular a $(0,2\pi)\times(-\pi/2,\pi/2)$, que cobreix l'esfera llevat d'un meridià.
            fuites: ['v\s*=\s*\\pm\s*\\pi\s*/\s*2']
            teoria: ["T6.3"]
        errors_comuns:
          - id: dos_angles_complets
            descripcio: |
              Pren els dos angles a $[0,2\pi]$, recobrint l'esfera dues vegades.
            pregunta: |
              Si els dos angles recorren $[0,2\pi]$, quantes vegades passes per un mateix punt de l'esfera?
          - id: no_esfera
            descripcio: |
              Escriu $(R\cos u,R\sin u,R\sin v)$ o similar, que no és sobre l'esfera.
            pregunta: |
              Calcula $x^2+y^2+z^2$ amb la teva parametrització: dona $R^2$ per a tots els valors dels paràmetres?
          - id: pols
            descripcio: |
              No detecta que als pols el rang de $D\varphi$ baixa.
            pregunta: |
              Què li passa a la primera columna de $D\varphi$ quan el punt és al pol nord?
        nota_professor: |
          És exactament l'exemple de l'esfera dels apunts (reservat). Amb el conveni de colatitud, $R(\cos u\sin v,\sin u\sin v,\cos v)$, $v\in[0,\pi]$, també és correcte.

      - id: "t6-2e"
        apartat: "e"
        tipus: calcul
        enunciat: |
          Un el·lipsoide de semieixos $a,b,c>0$, centrat a l'origen.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            $\varphi(u,v)=(a\cos u\cos v,\ b\sin u\cos v,\ c\sin v)$, $(u,v)\in[0,2\pi]\times[-\pi/2,\pi/2]$; és $\mathcal{C}^\infty$ i regular (rang $2$) quan $\cos v\neq0$.
          fuites: ['b\s*\\sin\s*\\?\w+\s*\\cos', 'b\s*\\sin\s*\\?\w+\s*\\sin']
        passos:
          - id: equacio
            titol: "Equació de l'el·lipsoide"
            objectiu: |
              Escriure l'equació de l'el·lipsoide i relacionar-la amb una superfície coneguda.
            idea: |
              Un canvi d'escala independent a cada eix converteix l'esfera unitat en l'el·lipsoide.
            detall: |
              $\frac{x^2}{a^2}+\frac{y^2}{b^2}+\frac{z^2}{c^2}=1$; si $(X,Y,Z)$ és a l'esfera unitat, $(aX,bY,cZ)$ és a l'el·lipsoide.
            fuites: []
            teoria: []
          - id: parametritzar
            titol: "Parametritzar"
            objectiu: |
              Donar la parametrització i el seu domini.
            idea: |
              Aplicar el canvi d'escala a la parametrització de l'esfera unitat amb dos angles.
            detall: |
              $\varphi(u,v)=(a\cos u\cos v,\ b\sin u\cos v,\ c\sin v)$, $(u,v)\in[0,2\pi]\times[-\pi/2,\pi/2]$.
            fuites: ['b\s*\\sin\s*\\?\w+\s*\\cos']
            teoria: ["T6.6"]
          - id: rang
            titol: "Estudiar el rang"
            objectiu: |
              Determinar on la parametrització és regular.
            idea: |
              $D\varphi$ és la de l'esfera unitat multiplicada a l'esquerra per una matriu diagonal invertible.
            detall: |
              $D\varphi=\mathrm{diag}(a,b,c)\begin{pmatrix}-\sin u\cos v&-\cos u\sin v\\\cos u\cos v&-\sin u\sin v\\0&\cos v\end{pmatrix}$, de rang $2$ si i només si $\cos v\neq0$.
            fuites: []
            teoria: ["T6.3"]
        errors_comuns:
          - id: semieixos_mal_posats
            descripcio: |
              Posa els semieixos en coordenades equivocades o els eleva al quadrat.
            pregunta: |
              Substitueix la teva parametrització a $\frac{x^2}{a^2}+\frac{y^2}{b^2}+\frac{z^2}{c^2}$: dona $1$?
          - id: domini_angles
            descripcio: |
              Pren els dos angles a $[0,2\pi]$ i recobreix la superfície dues vegades.
            pregunta: |
              Quin rang d'angles cal perquè cada punt s'obtingui una sola vegada (llevat de les vores)?
        nota_professor: |
          Generalització directa de l'exemple de l'esfera.

      - id: "t6-2f"
        apartat: "f"
        tipus: calcul
        enunciat: |
          Un cilindre inclinat de base la circumferència $x^2+y^2=4$ al pla $XY$ i eix la recta $\{z=x,\ y=0\}$.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            $\varphi(\theta,s)=(2\cos\theta+s,\ 2\sin\theta,\ s)$, $(\theta,s)\in[0,2\pi]\times\mathbb{R}$ (o $s$ en un interval si es vol un tros d'altura finita). Columnes de $D\varphi$: $(-2\sin\theta,2\cos\theta,0)$ i $(1,0,1)$, linealment independents (rang $2$).
          fuites: ['2\s*\\cos\s*\\?\w+\s*\+\s*\w+\s*,\s*\\?,?\s*2\s*\\sin']
        passos:
          - id: direccio
            titol: "Direcció de les generatrius"
            objectiu: |
              Determinar la direcció de les rectes que formen el cilindre.
            idea: |
              Les generatrius són paral·leles a l'eix: trobar-ne un vector director a partir de les seves equacions.
            detall: |
              L'eix $\{z=x,\ y=0\}$ passa per l'origen amb vector director $(1,0,1)$.
            fuites: ['\(\s*1\s*,\s*0\s*,\s*1\s*\)']
            teoria: []
          - id: base
            titol: "Parametritzar la base"
            objectiu: |
              Parametritzar la corba base.
            idea: |
              És una circumferència del pla $XY$ centrada a l'origen.
            detall: |
              $\beta(\theta)=(2\cos\theta,\ 2\sin\theta,\ 0)$, $\theta\in[0,2\pi]$.
            fuites: []
            teoria: []
          - id: superficie
            titol: "Moure la base al llarg de l'eix"
            objectiu: |
              Construir la parametrització del cilindre i comprovar-ne el rang.
            idea: |
              Cada punt del cilindre s'obté des d'un punt de la base desplaçant-se un múltiple del vector director: $\varphi(\theta,s)=\beta(\theta)+s\,\mathbf{d}$.
            detall: |
              $\varphi(\theta,s)=(2\cos\theta+s,\ 2\sin\theta,\ s)$. $D\varphi=\begin{pmatrix}-2\sin\theta&1\\2\cos\theta&0\\0&1\end{pmatrix}$: la primera columna és no nul·la i té tercera component $0$, la segona té tercera component $1$, així que el rang és $2$.
            fuites: ['2\s*\\cos\s*\\?\w+\s*\+\s*\w+\s*,\s*\\?,?\s*2\s*\\sin']
            teoria: ["T6.3"]
        errors_comuns:
          - id: cilindre_recte
            descripcio: |
              Parametritza el cilindre recte $(2\cos\theta,2\sin\theta,s)$, ignorant la inclinació.
            pregunta: |
              Quan fixes l'angle i fas variar l'altre paràmetre, el punt es mou paral·lel a l'eix $\{z=x,\ y=0\}$?
          - id: seccio_perpendicular
            descripcio: |
              Construeix el cilindre amb seccions perpendiculars a l'eix circulars de radi $2$, que no té la base donada.
            pregunta: |
              La intersecció de la teva superfície amb el pla $z=0$, és la circumferència $x^2+y^2=4$?
        nota_professor: |
          L'altura no està especificada: $s\in\mathbb{R}$ o un interval. Equació implícita: $(x-z)^2+y^2=4$.

      - id: "t6-2g"
        apartat: "g"
        tipus: calcul
        enunciat: |
          Un cilindre inclinat de base l'el·lipse $(x-1)^2+4y^2=4$ al pla $XY$ i que té l'eix paral·lel a la recta $\{x+y=3,\ 2y-z=0\}$.
        teoria: ["T6.5"]
        teoria_reservada: []
        resultat:
          valor: |
            Vector director de l'eix: $(-1,1,2)$. $\varphi(\theta,s)=(1+2\cos\theta-s,\ \sin\theta+s,\ 2s)$, $(\theta,s)\in[0,2\pi]\times\mathbb{R}$ (o un interval per a $s$). Columnes de $D\varphi$: $(-2\sin\theta,\cos\theta,0)$ i $(-1,1,2)$, linealment independents (rang $2$).
          fuites: ['\(\s*-?\s*1\s*,\s*-?\s*1\s*,\s*-?\s*2\s*\)', '1\s*\+\s*2\s*\\cos\s*\\?\w+\s*-\s*\w+\s*,']
        passos:
          - id: direccio
            titol: "Direcció de l'eix"
            objectiu: |
              Trobar un vector director de la recta donada.
            idea: |
              La recta és intersecció de dos plans: el seu vector director és perpendicular als dos vectors normals (producte vectorial, o resoldre el sistema homogeni).
            detall: |
              Normals $(1,1,0)$ i $(0,2,-1)$; $(1,1,0)\times(0,2,-1)=(-1,1,2)$. Comprovació: $-1+1=0$ i $2\cdot1-2=0$.
            fuites: ['\(\s*-?\s*1\s*,\s*-?\s*1\s*,\s*-?\s*2\s*\)']
            teoria: []
          - id: base
            titol: "Parametritzar la base"
            objectiu: |
              Parametritzar l'el·lipse base del pla $XY$.
            idea: |
              Escriure l'equació en forma canònica $\frac{(x-x_0)^2}{\alpha^2}+\frac{y^2}{\beta^2}=1$ i usar cosinus i sinus.
            detall: |
              $\frac{(x-1)^2}{4}+y^2=1$, així que $\beta(\theta)=(1+2\cos\theta,\ \sin\theta,\ 0)$, $\theta\in[0,2\pi]$.
            fuites: ['1\s*\+\s*2\s*\\cos']
            teoria: []
          - id: superficie
            titol: "Moure la base al llarg de l'eix"
            objectiu: |
              Construir la parametrització del cilindre i comprovar-ne el rang.
            idea: |
              $\varphi(\theta,s)=\beta(\theta)+s\,\mathbf{d}$, amb $\mathbf{d}$ el vector director trobat; després calcular $D\varphi$.
            detall: |
              $\varphi(\theta,s)=(1+2\cos\theta-s,\ \sin\theta+s,\ 2s)$. $D\varphi=\begin{pmatrix}-2\sin\theta&-1\\\cos\theta&1\\0&2\end{pmatrix}$; la primera columna és no nul·la i té tercera component $0$, la segona té tercera component $2$: rang $2$.
            fuites: ['1\s*\+\s*2\s*\\cos\s*\\?\w+\s*-\s*\w+\s*,']
            teoria: ["T6.3"]
        errors_comuns:
          - id: eix_per_la_recta
            descripcio: |
              Fa passar l'eix per la recta donada en lloc de prendre'n només la direcció, i la superfície ja no té la base donada.
            pregunta: |
              L'enunciat diu que l'eix és la recta o que és paral·lel a la recta? Què necessites realment d'ella?
          - id: base_mal_parametritzada
            descripcio: |
              Parametritza la base amb $(2\cos\theta,\,4\sin\theta)$ o oblida el centre $(1,0)$.
            pregunta: |
              Substitueix la teva base a $(x-1)^2+4y^2$: dona $4$?
          - id: director_erroni
            descripcio: |
              Pren com a director un dels vectors normals dels plans.
            pregunta: |
              El vector que has pres, compleix les equacions homogènies $x+y=0$, $2y-z=0$?
        nota_professor: |
          Equació implícita: amb $s=z/2$, $(x+z/2-1)^2+4(y-z/2)^2=4$.

  - num: 3
    font: null
    preambul: |
      Determineu els extrems absoluts de $f$ quan les variables estan sotmeses als lligams que s'indiquen. (Intenteu resoldre l'exercici sense fer servir multiplicadors de Lagrange.)
    indicacio: null
    exercicis:
      - id: "t6-3a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          $f(x,y)=x$, $\quad x^2+2y^2=3$;
        teoria: ["T6.12"]
        teoria_reservada: []
        resultat:
          valor: |
            Màxim absolut $\sqrt3$, assolit a $(\sqrt3,0)$; mínim absolut $-\sqrt3$, assolit a $(-\sqrt3,0)$.
          fuites: ['\(\s*-?\s*\\sqrt\s*\{?3\}?\s*,\s*0\s*\)', 'm[àa]xim[^.]*\\sqrt\s*(3|\{\s*3\s*\})', 'm[íi]nim[^.]*-\s*\\sqrt\s*(3|\{\s*3\s*\})', '(\\le|\\leq|≤)\s*\\sqrt\s*(3|\{\s*3\s*\})', '\\pm\s*\\sqrt\s*(3|\{\s*3\s*\})']
        passos:
          - id: existencia
            titol: "Existència dels extrems"
            objectiu: |
              Decidir si podem garantir a priori que $f$ assoleix un màxim i un mínim sobre el lligam.
            idea: |
              Mirar si el conjunt definit pel lligam és tancat i fitat, i si $f$ és contínua.
            detall: |
              $M=\{x^2+2y^2=3\}$ és tancat (antiimatge d'un tancat per una funció contínua) i fitat ($x^2\leq3$, $y^2\leq3/2$), per tant compacte; $f$ és contínua, i pel teorema de Weierstrass té màxim i mínim absoluts a $M$.
            fuites: []
            teoria: ["T1.34", "T2.23"]
          - id: fitar
            titol: "Fitar $x$ sobre el lligam"
            objectiu: |
              Trobar entre quins valors pot variar $x$ quan $(x,y)$ satisfà el lligam.
            idea: |
              Aïllar del lligam el terme en $y$ i fer servir que un quadrat és no negatiu.
            detall: |
              $x^2=3-2y^2\leq3$, és a dir $-\sqrt3\leq x\leq\sqrt3$, amb igualtat si i només si $y=0$.
            fuites: ['x\^\{?2\}?\s*=\s*3\s*-\s*2\s*y', '\\sqrt\s*(3|\{\s*3\s*\})\s*(\\le|\\leq|≤)', '(\\le|\\leq|≤)\s*\\sqrt\s*(3|\{\s*3\s*\})', 'x\^\{?2\}?\s*(\\le|\\leq|≤)\s*3\b']
            teoria: []
          - id: concloure
            titol: "Punts on s'assoleixen"
            objectiu: |
              Comprovar que les fites s'assoleixen i identificar els punts.
            idea: |
              Mirar quan es dona la igualtat en la desigualtat anterior i comprovar que els punts són del lligam.
            detall: |
              Amb $y=0$, $x=\pm\sqrt3$: $(\sqrt3,0)$ i $(-\sqrt3,0)$ són a $M$. Màxim absolut $\sqrt3$ a $(\sqrt3,0)$ i mínim absolut $-\sqrt3$ a $(-\sqrt3,0)$.
            fuites: ['\(\s*-?\s*\\sqrt\s*\{?3\}?\s*,\s*0\s*\)']
            teoria: []
        errors_comuns:
          - id: fita_sense_assolir
            descripcio: |
              Troba una fita de $x$ però no comprova que s'assoleixi en un punt del lligam.
            pregunta: |
              Hi ha algun punt de l'el·lipse on $x$ valgui exactament la fita que has trobat?
          - id: arrel_erronia
            descripcio: |
              Divideix malament per $2$ i dona $x=\pm\sqrt{3/2}$ (que són els valors extrems de $y$).
            pregunta: |
              Quina variable va acompanyada del coeficient $2$ al lligam? Quina variable vols fitar?
          - id: sense_existencia
            descripcio: |
              No justifica per què existeixen màxim i mínim absoluts.
            pregunta: |
              Quina propietat del conjunt definit pel lligam et garanteix que una funció contínua hi assoleix els valors extrems?
        nota_professor: |
          Per Lagrange: $(1,0)=\lambda(2x,4y)$ dona $y=0$, $x=\pm\sqrt3$. També es pot parametritzar $(\sqrt3\cos t,\sqrt{3/2}\sin t)$ i $f=\sqrt3\cos t$.

      - id: "t6-3b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          $f(x,y)=x^2y$, $\quad xy=1$;
        teoria: ["T6.12"]
        teoria_reservada: []
        resultat:
          valor: |
            No té extrems absoluts: sobre el lligam ($y=1/x$, $x\neq0$) es té $f=x$, que pren tots els valors de $\mathbb{R}\setminus\{0\}$; per tant $f$ no és fitada ni superiorment ni inferiorment sobre la hipèrbola (tampoc no té extrems locals condicionats).
          fuites: ['no\s+t[ée]\s+(cap\s+)?(extrem|m[àa]xim|m[íi]nim)', 'ni\s+m[àa]xim\s+ni\s+m[íi]nim']
        passos:
          - id: reduir
            titol: "Reduir a una variable"
            objectiu: |
              Escriure $f$ restringida al lligam com a funció d'una sola variable.
            idea: |
              El lligam permet aïllar una variable en funció de l'altra (vigilant on té sentit) i substituir-la a $f$.
            detall: |
              $xy=1$ implica $x\neq0$ i $y=\frac1x$; llavors $f(x,1/x)=x^2\cdot\frac1x=x$, amb $x\in\mathbb{R}\setminus\{0\}$.
            fuites: ['x\^\{?2\}?\s*(\\cdot)?\s*\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*x\s*\}?\s*=\s*x', 'x\s*\\?,?\s*\(\s*xy\s*\)\s*=\s*x', 'f\s*=\s*x(?![\^\w{])']
            teoria: []
          - id: estudiar
            titol: "Estudiar la funció d'una variable"
            objectiu: |
              Determinar quins valors pren la funció obtinguda i si té màxim o mínim.
            idea: |
              Mirar el comportament quan la variable tendeix als extrems del seu domini.
            detall: |
              $x\mapsto x$ a $\mathbb{R}\setminus\{0\}$ tendeix a $+\infty$ quan $x\to+\infty$ i a $-\infty$ quan $x\to-\infty$: no és fitada ni per dalt ni per baix, i per tant no assoleix cap màxim ni mínim.
            fuites: ['\+\s*\\infty']
            teoria: []
        errors_comuns:
          - id: assumir_existencia
            descripcio: |
              Suposa que hi ha d'haver extrems (com si el lligam fos compacte) i dona algun punt com a màxim o mínim.
            pregunta: |
              El conjunt $xy=1$ és fitat? Què et garanteix (o no) l'existència d'extrems?
          - id: oblida_x_negatiu
            descripcio: |
              Només considera la branca $x>0$ i conclou que l'ínfim és $0$ o que hi ha un mínim.
            pregunta: |
              La hipèrbola $xy=1$ té punts amb $x<0$? Quins valors pren allà la funció?
          - id: substitucio_erronia
            descripcio: |
              Substitueix $x=1/y$ i s'equivoca simplificant, o confon $x^2y$ amb $xy^2$.
            pregunta: |
              Si $xy=1$, com pots reescriure $x^2y$ fent servir el producte $xy$?
        nota_professor: |
          Observació ràpida: $x^2y=x\,(xy)=x$ sobre el lligam. Amb Lagrange no hi ha cap punt crític: $(2xy,\,x^2)=\lambda(y,\,x)$ amb $xy=1$ (per tant $x,y\neq0$) dona $\lambda=2x$ i $\lambda=x$, impossible; és coherent amb la inexistència d'extrems (ni tan sols locals).

      - id: "t6-3c"
        apartat: "c"
        tipus: calcul
        enunciat: |
          $f(x,y)=x^2+y^2$, $\quad x^2+y^2=1$;
        teoria: ["T6.12"]
        teoria_reservada: []
        resultat:
          valor: |
            $f\equiv1$ sobre el lligam: tots els punts de la circumferència $x^2+y^2=1$ són alhora màxim i mínim absoluts, amb valor $1$.
          fuites: ['tots\s+els\s+punts[^.]*(m[àa]xim|m[íi]nim)', '(m[àa]xim|m[íi]nim)\s+(absolut\s+)?(és|val)\s*\$?\s*1\b']
        passos:
          - id: observar
            titol: "Avaluar $f$ sobre el lligam"
            objectiu: |
              Calcular quins valors pren $f$ en els punts que compleixen el lligam.
            idea: |
              Comparar l'expressió de $f$ amb la del lligam.
            detall: |
              Si $x^2+y^2=1$, aleshores $f(x,y)=x^2+y^2=1$: $f$ és constant igual a $1$ sobre la circumferència.
            fuites: ['f\s*\(x,\s*y\)\s*=\s*x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*=\s*1', 'constant\s+igual\s+a\s+\$?1']
            teoria: []
          - id: concloure
            titol: "Concloure segons la definició"
            objectiu: |
              Decidir quins punts són màxims i mínims absoluts.
            idea: |
              Aplicar la definició de màxim i de mínim (no estrictes): la desigualtat $f(\mathbf{x})\leq f(\mathbf{a})$ (o $\geq$) ha de valer per a tot punt del lligam.
            detall: |
              Per a qualsevol $\mathbf{a}$ de la circumferència, $f(\mathbf{x})=f(\mathbf{a})=1$ per a tot $\mathbf{x}$ del lligam, així que totes dues desigualtats es compleixen: tot punt és màxim i mínim absolut (no estricte), amb valor $1$.
            fuites: ['tot\s+punt\s+és\s+m[àa]xim']
            teoria: ["T6.12"]
        errors_comuns:
          - id: constant_sense_extrems
            descripcio: |
              Diu que, com que $f$ és constant, no té extrems.
            pregunta: |
              Segons la definició, quina desigualtat ha de complir un màxim absolut? Es compleix en algun punt d'aquí?
          - id: lagrange_mecanic
            descripcio: |
              Aplica Lagrange mecànicament, obté $\lambda=1$ per a tots els punts i no sap interpretar-ho.
            pregunta: |
              Abans de fer cap càlcul, quant val $f$ en un punt qualsevol que compleixi el lligam?
        nota_professor: |
          Exemple que recorda que màxim i mínim absoluts no han de ser únics ni estrictes.

      - id: "t6-3d"
        apartat: "d"
        tipus: calcul
        enunciat: |
          $f(x,y)=x^2+y^2+1$, $\quad 2x+3y=0$;
        teoria: ["T6.12"]
        teoria_reservada: ["T6.1"]
        resultat:
          valor: |
            Mínim absolut $1$, assolit a $(0,0)$. No té màxim absolut ($f\to+\infty$ al llarg de la recta).
          fuites: ['m[íi]nim[^.]*\(\s*0\s*,\s*0\s*\)', 'no\s+t[ée]\s+(cap\s+)?m[àa]xim', 'm[íi]nim\s+(absolut\s+)?(és|val)\s*\$?\s*1\b']
        passos:
          - id: reduir
            titol: "Reduir a una variable"
            objectiu: |
              Escriure $f$ restringida a la recta com a funció d'una sola variable.
            idea: |
              Aïllar una de les variables de l'equació de la recta i substituir-la a $f$.
            detall: |
              $y=-\frac23x$, i $g(x)=f\left(x,-\frac23x\right)=1+x^2+\frac49x^2=1+\frac{13}{9}x^2$, $x\in\mathbb{R}$.
            fuites: ['\\[dt]?frac\s*\{\s*13\s*\}', '13\s*x\^\{?2\}?\s*/\s*9']
            teoria: []
          - id: estudiar
            titol: "Estudiar la funció d'una variable"
            objectiu: |
              Trobar el mínim i el màxim (si n'hi ha) de la funció obtinguda a tot $\mathbb{R}$.
            idea: |
              És una paràbola: mirar on és el seu vèrtex i què passa quan la variable tendeix a $\pm\infty$.
            detall: |
              $g(x)=1+\frac{13}{9}x^2\geq1$ amb igualtat només a $x=0$, i $g(x)\to+\infty$ quan $|x|\to\infty$. Per tant el mínim absolut és $1$, a $(0,0)$, i no hi ha màxim.
            fuites: ['(\\ge|\\geq|≥)\s*1\b']
            teoria: []
        errors_comuns:
          - id: maxim_inexistent_no_justificat
            descripcio: |
              Troba el punt crític i el dona com a únic extrem sense justificar que és mínim absolut, o afirma que també hi ha màxim.
            pregunta: |
              Què fa la funció quan t'allunyes molt de l'origen al llarg de la recta?
          - id: oblida_constant
            descripcio: |
              Dona el valor del mínim sense el $+1$.
            pregunta: |
              Quant val exactament $f$ en el punt que has trobat?
        nota_professor: |
          És el cas $c=0$ de l'exemple inicial dels apunts (recta $ax+by=c$ amb $f=x^2+y^2$), més la constant $1$; reservat. Geomètricament: $f-1$ és la distància a l'origen al quadrat, i la recta passa per l'origen.

      - id: "t6-3e"
        apartat: "e"
        tipus: calcul
        enunciat: |
          $f(x,y,z)=x-y+z$, $\quad x^2+y^2+z^2=2$:
        teoria: ["T6.12"]
        teoria_reservada: []
        resultat:
          valor: |
            Màxim absolut $\sqrt6$, assolit a $\frac{\sqrt6}{3}(1,-1,1)=\left(\sqrt{\tfrac23},-\sqrt{\tfrac23},\sqrt{\tfrac23}\right)$; mínim absolut $-\sqrt6$, assolit a $-\frac{\sqrt6}{3}(1,-1,1)$.
          fuites: ['\\sqrt\s*\{?6\}?', '\\sqrt\s*\{?\s*\\?[dt]?frac\s*\{?\s*2\s*\}?\s*\{?\s*3']
        passos:
          - id: existencia
            titol: "Existència dels extrems"
            objectiu: |
              Justificar que $f$ té màxim i mínim absoluts sobre el lligam.
            idea: |
              Mirar si el lligam defineix un conjunt compacte i si $f$ és contínua.
            detall: |
              L'esfera $x^2+y^2+z^2=2$ és tancada i fitada, per tant compacta; $f$ és contínua i, per Weierstrass, hi assoleix màxim i mínim.
            fuites: []
            teoria: ["T1.34", "T2.23"]
          - id: fitar
            titol: "Fitar $f$"
            objectiu: |
              Trobar una fita superior i una d'inferior de $f$ sobre l'esfera.
            idea: |
              Escriure $f$ com el producte escalar d'un vector fix amb $(x,y,z)$ i fer servir una desigualtat coneguda per a productes escalars, tenint en compte la norma de $(x,y,z)$ sobre el lligam.
            detall: |
              $f(x,y,z)=\langle(1,-1,1),(x,y,z)\rangle$ i, per Cauchy-Schwarz, $|f|\leq\|(1,-1,1)\|\,\|(x,y,z)\|=\sqrt3\cdot\sqrt2=\sqrt6$.
            fuites: ['\\sqrt\s*\{?6\}?', '\\sqrt\s*\{?3\}?\s*(\\cdot)?\s*\\sqrt\s*\{?2\}?']
            teoria: ["T1.7"]
          - id: igualtat
            titol: "Punts on s'assoleix la fita"
            objectiu: |
              Trobar els punts del lligam on $f$ assoleix les fites anteriors.
            idea: |
              La igualtat en la desigualtat usada només es dona quan els dos vectors són proporcionals; imposar després el lligam.
            detall: |
              $(x,y,z)=t(1,-1,1)$ amb $3t^2=2$, $t=\pm\sqrt{2/3}=\pm\frac{\sqrt6}{3}$. A $t=\frac{\sqrt6}{3}$: $f=3t=\sqrt6$ (màxim); a $t=-\frac{\sqrt6}{3}$: $f=-\sqrt6$ (mínim).
            fuites: ['3\s*t\^\{?2\}?\s*=\s*2', '\\sqrt\s*\{?6\}?']
            teoria: []
        errors_comuns:
          - id: norma_esfera
            descripcio: |
              Pren el radi de l'esfera com a $2$ en lloc de $\sqrt2$.
            pregunta: |
              Si $x^2+y^2+z^2=2$, quant val $\|(x,y,z)\|$?
          - id: fita_no_assolida
            descripcio: |
              Dona la fita de Cauchy-Schwarz sense comprovar que s'assoleix sobre l'esfera.
            pregunta: |
              Hi ha algun punt de l'esfera on la desigualtat que has fet servir sigui una igualtat? Quin?
          - id: signe_y
            descripcio: |
              Oblida el signe de $-y$ i dona punts de la forma $t(1,1,1)$.
            pregunta: |
              Comprova el valor de $f$ al punt que proposes: coincideix amb la fita?
        nota_professor: |
          Interpretació geomètrica: $f$ és ($\sqrt3$ vegades) la projecció sobre la direcció $(1,-1,1)$. Lagrange dona $(1,-1,1)=2\lambda(x,y,z)$, els mateixos punts.

      - id: "t6-3f"
        apartat: "f"
        tipus: calcul
        enunciat: |
          $f(x,y,z)=x+y+z$, $\quad x^2-y^2=1$, $\quad 2x+z=1$.
        teoria: ["T6.12"]
        teoria_reservada: []
        resultat:
          valor: |
            No té extrems absoluts. Sobre el lligam, $z=1-2x$ i $f=1-x+y$; a la branca $x\geq1$ ($x=\cosh t$, $y=\sinh t$) $f=1-e^{-t}$ pren tots els valors de $(-\infty,1)$, i a la branca $x\leq-1$ ($x=-\cosh t$, $y=\sinh t$) $f=1+e^{t}$ pren tots els valors de $(1,+\infty)$. Per tant $f$ no és fitada ni superiorment ni inferiorment.
          fuites: ['no\s+t[ée]\s+(cap\s+)?(extrem|m[àa]xim|m[íi]nim)', '\(\s*-\s*\\infty\s*,\s*1\s*\)', '\(\s*1\s*,\s*\+?\s*\\infty\s*\)']
        passos:
          - id: eliminar_z
            titol: "Eliminar una variable"
            objectiu: |
              Reduir el problema a una funció de dues variables sobre una corba plana.
            idea: |
              El lligam lineal permet aïllar una variable i substituir-la a $f$.
            detall: |
              $z=1-2x$, i $f=x+y+1-2x=1-x+y$ sobre la hipèrbola $x^2-y^2=1$ del pla $XY$.
            fuites: ['1\s*-\s*x\s*\+\s*y', 'y\s*-\s*x\s*\+\s*1']
            teoria: []
          - id: parametritzar
            titol: "Parametritzar la hipèrbola"
            objectiu: |
              Escriure la funció obtinguda en termes d'un paràmetre de la corba.
            idea: |
              La hipèrbola té dues branques; cadascuna es parametritza amb funcions hiperbòliques.
            detall: |
              Branca dreta: $x=\cosh t$, $y=\sinh t$, $f=1-\cosh t+\sinh t=1-e^{-t}$. Branca esquerra: $x=-\cosh t$, $y=\sinh t$, $f=1+\cosh t+\sinh t=1+e^{t}$ ($t\in\mathbb{R}$).
            fuites: ['1\s*-\s*e\^\{?\s*-\s*t', '1\s*\+\s*e\^\{?\s*t']
            teoria: []
          - id: concloure
            titol: "Estudiar el recorregut"
            objectiu: |
              Determinar si $f$ és fitada sobre el lligam i si assoleix algun valor extrem.
            idea: |
              Mirar els límits de cada expressió quan el paràmetre tendeix a $\pm\infty$.
            detall: |
              $1-e^{-t}\to-\infty$ quan $t\to-\infty$, i $1+e^{t}\to+\infty$ quan $t\to+\infty$. Així $f$ no és fitada ni per dalt ni per baix sobre el lligam: no hi ha màxim ni mínim absoluts (de fet, cada expressió és estrictament monòtona i tampoc no hi ha extrems locals).
            fuites: ['\\to\s*-\s*\\infty']
            teoria: []
        errors_comuns:
          - id: una_sola_branca
            descripcio: |
              Només considera la branca $x\geq1$ i conclou que el suprem és $1$ o que hi ha un màxim.
            pregunta: |
              La hipèrbola $x^2-y^2=1$ té punts amb $x<0$? Què val $f$ allà?
          - id: lagrange_sense_compacitat
            descripcio: |
              Busca punts crítics (o aplica Lagrange) i en dona algun com a extrem absolut sense comprovar existència.
            pregunta: |
              El conjunt definit pels lligams és compacte? Què et permet assegurar això sobre l'existència d'extrems?
          - id: oblida_z
            descripcio: |
              Substitueix malament $z$ (p. ex. $z=2x-1$) o oblida que $f$ depèn de $z$.
            pregunta: |
              Comprova la teva expressió de $z$ en el lligam lineal: es compleix $2x+z=1$?
        nota_professor: |
          El valor $1$ no s'assoleix ($y=x$ és incompatible amb $x^2-y^2=1$). Alternativa sense hiperbòliques: a la branca dreta $f=1+y-\sqrt{1+y^2}\to-\infty$ quan $y\to-\infty$; a l'esquerra $f=1+y+\sqrt{1+y^2}\to+\infty$ quan $y\to+\infty$.
