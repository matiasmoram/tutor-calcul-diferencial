# Tema 3 — Problemes teòrics (derivades direccionals, diferenciabilitat, regla de la cadena).
# Font: recull de problemes Sado-Rivero. Mateix format de fitxa que limits_4.yaml;
# els enunciats són text amb fórmules entre $...$ (format: text).

llista:
  id: teoria-t3
  etiqueta: "Tema 3"
  titol: "Problemes teòrics: derivades i diferenciabilitat"
  descripcio: "Demostracions i raonaments sobre derivades direccionals, diferenciabilitat, regla de la cadena i teorema del valor mitjà."
  tipus: teoric
  format: text

exercicis:
  - id: "t3-5"
    etiqueta: "Problema 5"
    enunciat: "Estudieu la continuïtat i l'existència de derivades direccionals a $\\mathbb{R}^2$ de la funció $f(x,y)=\\begin{cases} \\dfrac{x^2}{y} & \\text{si } y\\neq 0\\\\ 0 & \\text{si } y=0.\\end{cases}$"
    resultat:
      valor: "$f$ és contínua exactament a $\\{y\\neq 0\\}$ (discontínua a tots els punts de l'eix $y=0$, inclòs l'origen). Derivades direccionals: si $y_0\\neq 0$ existeixen totes; a $(x_0,0)$ amb $x_0\\neq0$ només existeixen en direccions horitzontals ($v_2=0$, valen 0); a l'origen existeixen totes: $D_vf(0,0)=v_1^2/v_2$ si $v_2\\neq0$ i $0$ si $v_2=0$. Per tant, l'existència de totes les derivades direccionals no implica continuïtat."
      fuites: ['v_1\^2\s*/\s*v_2', '\\frac\{v_1\^2\}\{v_2\}']
    passos:
      - id: continuitat_obert
        titol: "Continuïtat fora de l'eix"
        objectiu: "Veure on la funció és clarament contínua."
        idea: "Allà on $y\\neq 0$ la funció ve donada per una sola expressió coneguda."
        detall: "A l'obert $U=\\{y\\neq0\\}$, $f=x^2/y$ és quocient de polinomis amb denominador no nul, per tant és contínua."
        fuites: []
      - id: discontinuitat_eix
        titol: "Discontinuïtat a l'eix, fora de l'origen"
        objectiu: "Estudiar la continuïtat als punts $(x_0,0)$ amb $x_0\\neq 0$."
        idea: "Restringir la funció a una recta que passi pel punt i no sigui l'eix."
        detall: "Sobre la recta vertical $x=x_0$: $f(x_0,y)=x_0^2/y\\to\\pm\\infty$ quan $y\\to0$, mentre que $f(x_0,0)=0$. No és contínua."
        fuites: ['x_0\^2\s*/\s*y']
      - id: discontinuitat_origen
        titol: "Discontinuïtat a l'origen"
        objectiu: "Decidir si $f$ és contínua a $(0,0)$."
        idea: "Les rectes per l'origen no ho decideixen; busca un camí on numerador i denominador siguin del mateix ordre."
        detall: "Sobre la paràbola $y=x^2$: $f(x,x^2)=1\\to 1\\neq 0=f(0,0)$. No és contínua a l'origen."
        fuites: ['y\s*=\s*x\^\{?2\}?', 'f\(x,\s*x\^2\)']
      - id: direccionals_obert
        titol: "Direccionals fora de l'eix"
        objectiu: "Veure si existeixen les derivades direccionals als punts amb $y_0\\neq0$."
        idea: "La restricció a una recta pel punt és, a prop del punt, una funció d'una variable derivable."
        detall: "Si $y_0\\neq0$, $t\\mapsto f(x_0+tv_1,y_0+tv_2)$ és quocient de funcions derivables amb denominador no nul prop de $t=0$: totes les direccionals existeixen, $D_vf=\\frac{2x_0y_0v_1-x_0^2v_2}{y_0^2}$."
        fuites: ['2x_0\s*y_0\s*v_1']
      - id: direccionals_eix
        titol: "Direccionals a l'eix, fora de l'origen"
        objectiu: "Estudiar $D_vf(x_0,0)$ amb $x_0\\neq0$ segons la direcció."
        idea: "Separa el cas de la direcció horitzontal de la resta i aplica la definició."
        detall: "Si $v_2\\neq0$: $\\frac{f(x_0+tv_1,tv_2)}{t}=\\frac{(x_0+tv_1)^2}{t^2v_2}\\to\\infty$, no existeix. Si $v_2=0$, la funció val 0 sobre l'eix i $D_vf(x_0,0)=0$."
        fuites: ['t\^2\s*v_2']
      - id: direccionals_origen
        titol: "Direccionals a l'origen"
        objectiu: "Calcular $D_vf(0,0)$ per a tota direcció."
        idea: "Aplica la definició de derivada direccional directament a l'origen."
        detall: "Si $v_2\\neq0$: $\\frac{f(tv_1,tv_2)}{t}=\\frac{t^2v_1^2}{t^2v_2}=\\frac{v_1^2}{v_2}$; si $v_2=0$ val 0. Totes existeixen, tot i que $f$ no és contínua a l'origen."
        fuites: ['\\frac\{v_1\^2\}\{v_2\}']
    errors_comuns:
      - id: direccionals_implica_continuitat
        descripcio: "Creu que si existeixen totes les derivades direccionals la funció és contínua."
        pregunta: "Què et diu exactament una derivada direccional: el comportament de $f$ en tot un entorn, o només sobre una recta?"
      - id: nomes_rectes
        descripcio: "Estudia la continuïtat a l'origen només amb rectes i conclou que és contínua."
        pregunta: "Hi ha camins cap a l'origen que no siguin rectes on numerador i denominador es comparin de manera diferent?"
      - id: oblida_eix
        descripcio: "Només estudia l'origen i s'oblida dels altres punts de l'eix $y=0$."
        pregunta: "On està definida $f$ per la segona branca? Has estudiat tots aquests punts?"
      - id: direccio_eix_malament
        descripcio: "Als punts $(x_0,0)$ confon quines direccions donen derivada direccional (p. ex. diu que totes o cap)."
        pregunta: "Què val $f$ exactament sobre l'eix horitzontal? Què passa si et mous en una altra direcció?"

  - id: "t3-6"
    etiqueta: "Problema 6"
    enunciat: "Sigui $D\\subset\\mathbb{R}^2$ obert i $f:D\\to\\mathbb{R}$ tal que les seves derivades parcials existeixen i estan fitades en $D$. Demostreu que $f$ és contínua en $D$. És cert a $\\mathbb{R}^m$, per $m>2$?"
    resultat:
      valor: "Sí. Si $M$ fita les parcials, prop de cada $(x_0,y_0)$ es té $|f(x,y)-f(x_0,y_0)|\\le M(|x-x_0|+|y-y_0|)\\to0$, per tant $f$ és contínua. A $\\mathbb{R}^m$ val el mateix argument, amb $m$ sumands (un per coordenada)."
      fuites: ['M\s*\(\s*\|x\s*-\s*x_0\|\s*\+\s*\|y\s*-\s*y_0\|\s*\)']
    passos:
      - id: plantejament
        titol: "Plantejar què cal fitar"
        objectiu: "Traduir 'f és contínua a $(x_0,y_0)$' a una desigualtat concreta."
        idea: "Fixa un punt del domini i estudia la diferència $|f(x,y)-f(x_0,y_0)|$."
        detall: "Cal veure que $|f(x,y)-f(x_0,y_0)|\\to0$ quan $(x,y)\\to(x_0,y_0)$; per tant, fitar-la per una expressió que tendeixi a 0."
        fuites: []
      - id: punt_intermedi
        titol: "Moure una coordenada cada vegada"
        objectiu: "Descompondre la diferència en variacions que només depenguin d'una variable."
        idea: "Passa per un punt intermedi que comparteixi una coordenada amb cada extrem i usa la desigualtat triangular."
        detall: "Amb el punt $(x,y_0)$: $|f(x,y)-f(x_0,y_0)|\\le|f(x,y)-f(x,y_0)|+|f(x,y_0)-f(x_0,y_0)|$."
        fuites: ['\(x\s*,\s*y_0\)']
      - id: dins_domini
        titol: "Els segments són dins de D"
        objectiu: "Garantir que els segments horitzontal i vertical que fas servir estan continguts a $D$."
        idea: "Fes servir que $D$ és obert i treballa en un entorn petit del punt."
        detall: "Com que $D$ és obert, hi ha una bola $B$ centrada a $(x_0,y_0)$ dins de $D$; si $(x,y)\\in B$, el punt intermedi i els dos segments paral·lels als eixos també són a $B\\subset D$."
        fuites: ['bola\s+\$?B']
      - id: valor_mitja
        titol: "Teorema del valor mitjà en una variable"
        objectiu: "Fitar cada terme usant només la informació sobre les parcials."
        idea: "Cada terme és la variació d'una funció d'una variable derivable, la derivada de la qual és una parcial."
        detall: "$g(t)=f(x,t)$ és derivable amb $g'(t)=\\partial_yf(x,t)$; pel TVM, $|f(x,y)-f(x,y_0)|=|\\partial_yf(x,\\tilde y)||y-y_0|\\le M|y-y_0|$. Igualment $|f(x,y_0)-f(x_0,y_0)|\\le M|x-x_0|$."
        fuites: ['M\s*\|y\s*-\s*y_0\|', 'M\s*\|x\s*-\s*x_0\|']
      - id: concloure
        titol: "Concloure i generalitzar"
        objectiu: "Tancar la demostració i respondre la pregunta per a $\\mathbb{R}^m$."
        idea: "Suma les dues fites; per a $m$ variables, repeteix l'argument canviant una coordenada cada vegada."
        detall: "$|f(x,y)-f(x_0,y_0)|\\le M(|x-x_0|+|y-y_0|)\\to0$. A $\\mathbb{R}^m$ es passa de $x_0$ a $x$ per $m$ segments paral·lels als eixos i s'obtenen $m$ sumands $M|x_i-x_{0,i}|$: també és cert."
        fuites: ['M\s*\(\s*\|x\s*-\s*x_0\|']
    errors_comuns:
      - id: suposa_diferenciable
        descripcio: "Suposa que $f$ és diferenciable o de classe $C^1$, cosa que l'enunciat no diu."
        pregunta: "Què diu exactament l'enunciat sobre les parcials? Diu que són contínues?"
      - id: tvm_diagonal
        descripcio: "Aplica un teorema del valor mitjà sobre el segment que uneix els dos punts, cosa que requeriria diferenciabilitat."
        pregunta: "Per aplicar el TVM sobre aquest segment, quina hipòtesi et caldria sobre $f$? La tens?"
      - id: oblida_domini
        descripcio: "No comprova que els segments que fa servir estan dins de $D$."
        pregunta: "Els punts per on passes, són sempre dins del domini on coneixes $f$ i les seves parcials?"
      - id: sense_fita
        descripcio: "Intenta concloure només amb l'existència de parcials, sense usar que estan fitades."
        pregunta: "Coneixes alguna funció amb parcials a l'origen que no sigui contínua? Quina hipòtesi extra té aquest enunciat?"
    nota_professor: "La solució del recull no comenta que el punt intermedi i els segments han de ser dins de $D$; cal restringir-se a una bola (per ser $D$ obert). La fitxa ho inclou com a pas."

  - id: "t3-18"
    etiqueta: "Problema 18"
    enunciat: "Siguin $A=\\{(x,y)\\in\\mathbb{R}^2:\\ 0<y<x^2\\}$ i $f(x,y)=0$ si $(x,y)\\in A$, $f(x,y)=1$ altrament. Proveu que existeixen i tenen el mateix valor totes les derivades direccionals a l'origen, però la funció no hi és diferenciable."
    resultat:
      valor: "Totes les derivades direccionals a l'origen valen 0, perquè cada recta per l'origen evita $A$ prop de 0 i $f\\equiv1$ allà. Però $f$ no és diferenciable a l'origen: sobre un camí dins de $A$ (p. ex. $y=x^2/2$) el quocient de diferenciabilitat no tendeix a 0."
      fuites: []
    passos:
      - id: rectes_fora
        titol: "Les rectes eviten $A$ prop de l'origen"
        objectiu: "Entendre com és $f$ sobre cada recta per l'origen, a prop de l'origen."
        idea: "Mira quan un punt $(tu_1,tu_2)$ pot pertànyer a $A$ i què passa quan $t$ és petit."
        detall: "Si $u_2=0$, $y=0\\notin(0,x^2)$. Si $u_2\\neq0$, caldria $|tu_2|<t^2u_1^2$, és a dir $|u_2|<|t|u_1^2$, fals per a $|t|$ petit. Per tant $f(tu)=1$ prop de $t=0$."
        fuites: ['\|u_2\|\s*<\s*\|t\|']
      - id: calcular_direccionals
        titol: "Calcular les direccionals"
        objectiu: "Calcular $D_uf(0,0)$ amb la definició."
        idea: "Recorda quant val $f$ a l'origen i sobre la recta, prop de l'origen."
        detall: "$(0,0)\\notin A$, així que $f(0,0)=1$, i $D_uf(0,0)=\\lim_{t\\to0}\\frac{1-1}{t}=0$ per a tota $u$."
        fuites: ['\\frac\{1\s*-\s*1\}\{t\}']
      - id: candidat_diferencial
        titol: "Quina hauria de ser la diferencial"
        objectiu: "Veure quina aplicació lineal seria la diferencial si existís."
        idea: "Si $f$ fos diferenciable, la diferencial determinaria totes les derivades direccionals."
        detall: "Si fos diferenciable, $D_uf(0,0)=\\nabla f(0,0)\\cdot u=0$, per tant $Df(0,0)=0$ i caldria $\\frac{f(x,y)-1}{\\|(x,y)\\|}\\to0$."
        fuites: ['\\frac\{f\(x,\s*y\)\s*-\s*1\}']
      - id: cami_dins_A
        titol: "Un camí dins de $A$"
        objectiu: "Comprovar que el quocient de diferenciabilitat no tendeix a 0."
        idea: "Tria un camí cap a l'origen que quedi sempre dins de $A$."
        detall: "Sobre $y=x^2/2$ (dins de $A$): $\\frac{0-1}{\\|(x,x^2/2)\\|}\\to-\\infty$, no tendeix a 0. No és diferenciable (de fet, ni tan sols és contínua)."
        fuites: ['y\s*=\s*x\^\{?2\}?\s*/\s*2', '\\frac\{x\^2\}\{2\}']
    errors_comuns:
      - id: direccionals_implica_diferenciable
        descripcio: "Creu que si totes les derivades direccionals existeixen (i coincideixen) la funció és diferenciable."
        pregunta: "Les derivades direccionals només miren rectes. La diferenciabilitat mira totes les maneres d'acostar-se; hi ha camins que no siguin rectes?"
      - id: f_origen_zero
        descripcio: "Suposa que $f(0,0)=0$."
        pregunta: "L'origen pertany a $A$? Quant val, doncs, $f(0,0)$?"
      - id: nomes_t_positiu
        descripcio: "En estudiar les rectes, només considera $t>0$ o no justifica que la recta surt de $A$ per a $t$ petit."
        pregunta: "La condició per ser a $A$, es compleix per a algun $t$ petit, positiu o negatiu?"
      - id: rectes_per_diferenciabilitat
        descripcio: "Intenta refutar la diferenciabilitat només amb rectes."
        pregunta: "Sobre les rectes tot funciona bé. On s'amaga el problema?"

  - id: "t3-24"
    etiqueta: "Problema 24"
    enunciat: "Sigui $f:\\mathbb{R}\\to\\mathbb{R}$ diferenciable. Proveu que la funció $\\varphi(x,y)=f(2x+3y)$, definida a $\\mathbb{R}^2$, satisfà l'equació en derivades parcials $3\\frac{\\partial\\varphi}{\\partial x}-2\\frac{\\partial\\varphi}{\\partial y}=0$."
    resultat:
      valor: "Per la regla de la cadena, $\\varphi_x=2f'(2x+3y)$ i $\\varphi_y=3f'(2x+3y)$, per tant $3\\varphi_x-2\\varphi_y=6f'(2x+3y)-6f'(2x+3y)=0$."
      fuites: ['6\s*f\S{0,8}\(2x\s*\+\s*3y\)\s*-\s*6']
    passos:
      - id: composicio
        titol: "Veure-ho com una composició"
        objectiu: "Identificar $\\varphi$ com a composició de dues funcions diferenciables."
        idea: "Hi ha una funció 'interior' de dues variables i una 'exterior' d'una variable."
        detall: "$\\varphi=f\\circ g$ amb $g(x,y)=2x+3y$, lineal i per tant diferenciable; $f$ és diferenciable per hipòtesi."
        fuites: ['g\(x,\s*y\)\s*=\s*2x\s*\+\s*3y']
      - id: parcials
        titol: "Aplicar la regla de la cadena"
        objectiu: "Calcular $\\varphi_x$ i $\\varphi_y$."
        idea: "La regla de la cadena multiplica la derivada de l'exterior per la parcial de l'interior."
        detall: "$\\varphi_x=f'(2x+3y)\\cdot 2$ i $\\varphi_y=f'(2x+3y)\\cdot 3$."
        fuites: ['f\S{0,8}\(2x\s*\+\s*3y\)\s*\\cdot\s*[23]', '[23]\s*f\S{0,8}\(2x\s*\+\s*3y\)']
      - id: substituir
        titol: "Substituir a l'equació"
        objectiu: "Comprovar l'equació."
        idea: "Substitueix les parcials a $3\\varphi_x-2\\varphi_y$."
        detall: "$3\\cdot2f'(2x+3y)-2\\cdot3f'(2x+3y)=0$."
        fuites: ['3\s*\\cdot\s*2\s*f']
    errors_comuns:
      - id: oblida_factor
        descripcio: "Deriva $f(2x+3y)$ oblidant el factor de la derivada interior (regla de la cadena)."
        pregunta: "Si només canvies $x$ una mica, quant canvia l'argument $2x+3y$?"
      - id: cas_particular
        descripcio: "Ho comprova per a una $f$ concreta (p. ex. $f(t)=t^2$) en lloc de demostrar-ho en general."
        pregunta: "Has comprovat un exemple. Com saps que funcionarà per a qualsevol $f$ diferenciable?"
      - id: confon_derivades
        descripcio: "Confon $f'$ amb $\\varphi$ o tracta $f'(2x+3y)$ com una constant qualsevol sense relació entre les dues parcials."
        pregunta: "Les dues parcials que has trobat, contenen el mateix factor? Quin?"

  - id: "t3-28"
    etiqueta: "Problema 28"
    enunciat: "Sigui $f:\\mathbb{R}^n\\to\\mathbb{R}$ de classe $C^1$ i $x_0\\in\\mathbb{R}^n$ tal que $f(x_0)=0$ i $Df(x_0)\\neq0$. Trobeu un vector $v$ de $\\mathbb{R}^n$ tal que la funció $\\varphi(t)=f(x_0+tv)$ sigui creixent en un entorn de l'origen."
    resultat:
      valor: "Qualsevol $v$ amb $\\nabla f(x_0)\\cdot v>0$; per exemple $v=\\nabla f(x_0)$, que dona $\\varphi'(0)=\\|\\nabla f(x_0)\\|^2>0$ i, per continuïtat de $\\varphi'$, $\\varphi'>0$ prop de 0. (La hipòtesi $f(x_0)=0$ no fa falta.)"
      fuites: ['v\s*=\s*\\nabla\s*f\(x_0\)']
    passos:
      - id: derivar_phi
        titol: "Derivar $\\varphi$"
        objectiu: "Calcular $\\varphi'(t)$."
        idea: "$\\varphi$ és la composició de $f$ amb una corba; aplica la regla de la cadena."
        detall: "$\\varphi'(t)=Df(x_0+tv)\\,v=\\nabla f(x_0+tv)\\cdot v$."
        fuites: ['\\nabla\s*f\(x_0\s*\+\s*tv\)\s*\\cdot\s*v']
      - id: condicio
        titol: "Condició per ser creixent"
        objectiu: "Reduir 'creixent en un entorn de 0' a una condició a $t=0$."
        idea: "Una derivada positiva en un interval dona creixement; què saps de la continuïtat de $\\varphi'$?"
        detall: "Com que $f\\in C^1$, $\\varphi'$ és contínua; si $\\varphi'(0)=\\nabla f(x_0)\\cdot v>0$, aleshores $\\varphi'>0$ en un entorn de 0 i $\\varphi$ hi és creixent."
        fuites: ['\\nabla\s*f\(x_0\)\s*\\cdot\s*v\s*>\s*0']
      - id: triar_v
        titol: "Triar el vector"
        objectiu: "Trobar un $v$ concret que compleixi la condició."
        idea: "Tria $v$ de manera que el producte escalar amb el gradient sigui clarament positiu."
        detall: "$v=\\nabla f(x_0)$: $\\varphi'(0)=\\|\\nabla f(x_0)\\|^2>0$ perquè $Df(x_0)\\neq0$."
        fuites: ['\\nabla\s*f\(x_0\)\\\|\^2']
    errors_comuns:
      - id: sense_entorn
        descripcio: "Conclou que $\\varphi$ és creixent a prop de 0 només perquè $\\varphi'(0)>0$, sense usar la continuïtat de $\\varphi'$."
        pregunta: "Saber que $\\varphi'(0)>0$, et diu res de $\\varphi'(t)$ per a $t$ proper a 0? Quina hipòtesi ho garanteix?"
      - id: usa_f_x0
        descripcio: "Creu que la hipòtesi $f(x_0)=0$ és essencial o intenta fer-la servir."
        pregunta: "Si canviessis $f$ per $f+5$, canviaria alguna cosa del que vols demostrar?"
      - id: cadena_malament
        descripcio: "Deriva $f(x_0+tv)$ com si fos una funció d'una variable, sense el vector $v$."
        pregunta: "$f$ és de $n$ variables; quina és la derivada de la corba $t\\mapsto x_0+tv$?"
      - id: v_perpendicular
        descripcio: "Tria $v$ perpendicular al gradient o amb producte escalar negatiu."
        pregunta: "Quin signe té $\\nabla f(x_0)\\cdot v$ amb el teu $v$?"

  - id: "t3-31"
    etiqueta: "Problema 31"
    enunciat: "Sigui $F:\\mathbb{R}\\to\\mathbb{R}^2$ definida per $F(t)=(t^2,t^3)$. Existeix algun valor $t_0\\in(0,1)$ tal que $F(1)-F(0)=DF(t_0)\\cdot(1-0)$? Contradiu això el teorema del valor mitjà?"
    resultat:
      valor: "No existeix: caldria alhora $2t_0=1$ i $3t_0^2=1$ ($t_0=1/2$ i $t_0=1/\\sqrt3$). No contradiu el TVM, que en una variable s'aplica a cada component per separat (amb un $t_0$ diferent per a cada una); per a funcions vectorials no hi ha igualtat, només la desigualtat $\\|F(b)-F(a)\\|\\le\\sup\\|F'\\|\\,(b-a)$."
      fuites: ['1\s*/\s*\\sqrt\{?3\}?', '\\frac\{1\}\{\\sqrt\{?3\}?\}']
    passos:
      - id: plantejar
        titol: "Escriure la igualtat"
        objectiu: "Escriure explícitament els dos costats de la igualtat."
        idea: "Calcula $F(1)-F(0)$ i la derivada $DF(t_0)$, que és un vector."
        detall: "$F(1)-F(0)=(1,1)$ i $DF(t_0)=(2t_0,3t_0^2)$."
        fuites: ['\(2t_0\s*,\s*3t_0\^2\)']
      - id: sistema
        titol: "Resoldre el sistema"
        objectiu: "Veure si hi ha un únic $t_0$ que serveixi per a les dues components."
        idea: "La igualtat de vectors són dues equacions que ha de complir el mateix $t_0$."
        detall: "$2t_0=1$ dona $t_0=1/2$, però aleshores $3t_0^2=3/4\\neq1$. No existeix."
        fuites: ['3/4', '\\frac\{3\}\{4\}']
      - id: interpretar
        titol: "Interpretar respecte del TVM"
        objectiu: "Explicar per què això no contradiu el teorema del valor mitjà."
        idea: "Recorda exactament l'enunciat del TVM i per a quin tipus de funcions dona una igualtat."
        detall: "El TVM amb igualtat és per a funcions reals d'una variable: aplicat a cada component dona $t_0=1/2$ per a la primera i $t_0=1/\\sqrt3$ per a la segona, diferents. Per a funcions vectorials només es té $\\|F(1)-F(0)\\|\\le\\sup_{t}\\|F'(t)\\|$."
        fuites: ['1\s*/\s*\\sqrt', '\\le\s*\\sup']
    errors_comuns:
      - id: tvm_vectorial
        descripcio: "Creu que el TVM amb igualtat val per a funcions vectorials."
        pregunta: "L'enunciat del TVM que coneixes, per a quin tipus de funcions és?"
      - id: una_component
        descripcio: "Troba $t_0$ per a una sola component i conclou que existeix."
        pregunta: "El $t_0$ que has trobat, funciona també per a l'altra component?"
      - id: tvm_fals
        descripcio: "Conclou que el TVM és fals o que hi ha una contradicció."
        pregunta: "Quines hipòtesis i quina conclusió té el TVM? Alguna d'elles falla aquí?"
