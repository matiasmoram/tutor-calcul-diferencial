problemes:
  - num: 11
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t5-11"
        apartat: null
        tipus: calcul
        enunciat: |
          Calculeu el polinomi de Taylor de grau $\leqslant3$ de la funció $f(x,y)=(x-1+\sin^2y)\log(x-y)$ en el punt $(1,0)$. És $(1,0)$ un extrem local de $f(x,y)$?
        teoria: ["T5.14", "T5.21"]
        teoria_reservada: []
        resultat:
          valor: |
            Amb $u=x-1$: $P_3(x,y)=u^2-uy-\frac12u^3+u^2y+\frac12uy^2-y^3$, és a dir,
            $P_3(x,y)=(x-1)^2-(x-1)y-\frac12(x-1)^3+(x-1)^2y+\frac12(x-1)y^2-y^3$.
            El punt $(1,0)$ és crític (no hi ha termes de grau $1$), però la hessiana $Hf(1,0)=\begin{pmatrix}2&-1\\-1&0\end{pmatrix}$ té determinant $-1<0$: és indefinida i $(1,0)$ és un punt de sella, no un extrem local.
          fuites: ['punt\s+de\s+sella', 'no\s+(és|és\s+pas|pot\s+ser)\s+(un\s+)?extrem', '-\s*\(x\s*-\s*1\)\s*(\\[,;:! ]|\s)*y\b', '-\s*y\s*(\\[,;:! ]|\s)*\(x\s*-\s*1\)', '-\s*u\s*(\\[,;:! ]|\s)*y\b']
        passos:
          - id: desenvolupar_factors
            titol: "Desenvolupar cada factor"
            objectiu: |
              Obtenir els desenvolupaments de Taylor fins a grau $3$ de cadascun dels dos factors de $f$ al voltant de $(1,0)$.
            idea: |
              Canviar a la variable $u=x-1$ (centre a l'origen) i usar desenvolupaments coneguts d'una variable ($\log(1+z)$, $\sin y$) substituint-hi l'expressió adequada; la unicitat del polinomi de Taylor garanteix que el resultat és el polinomi de Taylor.
            detall: |
              Amb $u=x-1$ tenim $x-y=1+(u-y)$ i, posant $z=u-y$ a $\log(1+z)=z-\frac{z^2}{2}+\frac{z^3}{3}+O_4(z)$:
              $\log(x-y)=(u-y)-\frac12(u-y)^2+\frac13(u-y)^3+O_4(u,y)$.
              D'altra banda $\sin y=y+O_3(y)$, de manera que $\sin^2y=y^2+O_4(y)$ i el primer factor és $u+y^2+O_4(u,y)$.
            fuites: ['\(u\s*-\s*y\)\^\{?2\}?', '\\sin\^\{?2\}?\s*y\s*=\s*y\^\{?2\}?']
            teoria: ["T5.16", "T5.17"]
          - id: producte
            titol: "Multiplicar i truncar"
            objectiu: |
              Obtenir $P_3$ multiplicant els desenvolupaments i quedant-se amb els monomis de grau $\leq 3$.
            idea: |
              El primer factor no té terme constant, així que del segon factor només calen els termes de grau $\leq 2$; tots els productes de grau $\geq 4$ van al residu.
            detall: |
              $(u+y^2)\left((u-y)-\frac12(u-y)^2\right)=u^2-uy-\frac12u(u^2-2uy+y^2)+uy^2-y^3+O_4$
              $=u^2-uy-\frac12u^3+u^2y+\frac12uy^2-y^3+O_4(u,y)$.
              Per tant $P_3(x,y)=(x-1)^2-(x-1)y-\frac12(x-1)^3+(x-1)^2y+\frac12(x-1)y^2-y^3$ (i $f(1,0)=0$).
            fuites: ['-\s*u\s*(\\[,;:! ]|\s)*y\b', '-\s*\(x\s*-\s*1\)\s*(\\[,;:! ]|\s)*y\b', '\\[dt]?frac\s*\{?1\}?\s*\{?2\}?\s*u\s*(\\[,;:! ]|\s)*y\^\{?2\}?', 'u\s*y\^\{?2\}?\s*/\s*2']
            teoria: ["T5.16", "T5.17"]
          - id: hessiana
            titol: "Punt crític i hessiana"
            objectiu: |
              Comprovar si $(1,0)$ és un punt crític i obtenir la matriu hessiana de $f$ en $(1,0)$ a partir del polinomi.
            idea: |
              Els termes de grau $1$ de $P_3$ són $Df(1,0)$; la part de grau $2$ és $\frac12$ de la forma quadràtica hessiana, i en podem llegir les derivades segones.
            detall: |
              $P_3$ no té termes de grau $1$, per tant $Df(1,0)=(0\ \ 0)$ i $(1,0)$ és crític.
              La part quadràtica és $u^2-uy=\frac12\left(2u^2-2uy+0\cdot y^2\right)$, d'on $f_{xx}(1,0)=2$, $f_{xy}(1,0)=-1$, $f_{yy}(1,0)=0$:
              $Hf(1,0)=\begin{pmatrix}2&-1\\-1&0\end{pmatrix}$.
            fuites: ['pmatrix\}\s*2\s*&\s*-\s*1', 'f_\{?xy\}?\s*\(1\s*,\s*0\)\s*=\s*-\s*1']
            teoria: ["T5.14", "T5.22", "T5.32"]
          - id: classificar
            titol: "Classificar el punt"
            objectiu: |
              Decidir el caràcter del punt crític $(1,0)$.
            idea: |
              Estudiar el signe de la forma quadràtica hessiana (en dues variables, el signe del determinant i de la traça) i aplicar les condicions suficients de segon ordre.
            detall: |
              $\det Hf(1,0)=2\cdot0-(-1)^2=-1<0$, per tant els valors propis tenen signes oposats i la forma és indefinida. Com que $f$ és $\mathcal{C}^2$ en un entorn de $(1,0)$ (on $x-y>0$), $(1,0)$ és un punt de sella i no és extrem local.
              Comprovació directa: $f(x,0)=(x-1)\log x>0$ per $x\neq1$ proper a $1$, mentre que $f(1,y)=\sin^2y\,\log(1-y)<0$ per $y>0$ petit.
            fuites: ['\\det\s*Hf\s*\(1\s*,\s*0\)\s*=\s*.*-\s*1\s*<\s*0', 'indefinida', 'punt\s+de\s+sella']
            teoria: ["T5.30", "T5.33", "T5.25"]
        errors_comuns:
          - id: sin2_grau1
            descripcio: |
              Desenvolupa $\sin^2y$ com si fos $y$ (o hi posa un terme $-y^3/3$), confonent $\sin^2y$ amb $\sin y$.
            pregunta: |
              Si $\sin y$ comença per $y$, per quina potència de $y$ comença el seu quadrat? Quin és el primer terme que hi falta després?
          - id: truncar_malament
            descripcio: |
              Multiplica els desenvolupaments i oblida termes creuats de grau $3$ (per exemple els de $u\cdot(u-y)^2$ o $y^2\cdot(u-y)$), o en manté de grau $4$.
            pregunta: |
              Has revisat, terme a terme, tots els productes d'un monomi del primer factor per un del segon que donen grau exactament $3$?
          - id: oblida_punt_critic
            descripcio: |
              Classifica el punt amb la hessiana sense comprovar abans que és crític, o creu que el grau $3$ del polinomi decideix el caràcter.
            pregunta: |
              El criteri de la hessiana té una hipòtesi sobre el punt. Quina és, i com la pots comprovar mirant $P_3$?
          - id: determinant_signe
            descripcio: |
              Amb $f_{yy}=0$ creu que la hessiana és semidefinida o que el criteri no decideix, sense calcular el determinant.
            pregunta: |
              Un zero a la diagonal vol dir que la forma no pren valors dels dos signes? Què diu el determinant sobre el signe dels valors propis?
        nota_professor: |
          $f$ és $\mathcal{C}^\infty$ en el semiplà $x>y$, que conté $(1,0)$, així que la unicitat del polinomi de Taylor justifica el càlcul per desenvolupaments. El terme $\frac13(u-y)^3$ del logaritme no contribueix a $P_3$ perquè el primer factor no té terme constant. Alternativa a la hessiana: restriccions $f(x,0)$ i $f(1,y)$, que prenen signes oposats.

  - num: 12
    font: null
    preambul: |
      Sigui $f(x,y)=-3x^2y^2+x^3y^3$.
    indicacio: null
    exercicis:
      - id: "t5-12a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          Calculeu-ne els punts crítics.
        teoria: ["T5.22"]
        teoria_reservada: []
        resultat:
          valor: |
            Els punts crítics són tots els punts dels dos eixos ($x=0$ o $y=0$) i tots els punts de la hipèrbola $xy=2$:
            $\{(x,y): xy=0\}\cup\{(x,y): xy=2\}$.
          fuites: ['x\s*y\s*=\s*2', 'hip[èe]rbola']
        passos:
          - id: gradient
            titol: "Calcular i factoritzar el gradient"
            objectiu: |
              Calcular les derivades parcials de $f$ i escriure-les en forma factoritzada.
            idea: |
              Treure factor comú a cada derivada parcial: les dues comparteixen un mateix factor que depèn només del producte $xy$.
            detall: |
              $f_x=-6xy^2+3x^2y^3=3xy^2(xy-2)$, $\quad f_y=-6x^2y+3x^3y^2=3x^2y(xy-2)$.
              Com que $f$ és polinòmica, és diferenciable a tot $\mathbb{R}^2$.
            fuites: ['3\s*x\s*y\^\{?2\}?\s*\(\s*x\s*y\s*-\s*2\s*\)', '3\s*x\^\{?2\}?\s*y\s*\(\s*x\s*y\s*-\s*2\s*\)']
            teoria: ["T3.2", "T5.22"]
          - id: resoldre
            titol: "Resoldre el sistema"
            objectiu: |
              Trobar tots els punts on s'anul·len simultàniament les dues derivades parcials.
            idea: |
              Un producte és zero quan algun factor ho és; distingir el cas en què s'anul·la el factor comú del cas en què s'anul·len els altres factors.
            detall: |
              Si $xy=2$, les dues parcials s'anul·len. Si $xy\neq2$, cal $xy^2=0$ i $x^2y=0$, és a dir $x=0$ o $y=0$ (i qualsevol punt d'un eix anul·la totes dues).
              Punts crítics: els dos eixos $\{xy=0\}$ i la hipèrbola $\{xy=2\}$.
            fuites: ['x\s*y\s*=\s*2', 'hip[èe]rbola']
            teoria: ["T5.22"]
        errors_comuns:
          - id: dividir_per_variables
            descripcio: |
              Divideix per $x$ o per $y$ en resoldre el sistema i perd els punts dels eixos (o bé només troba l'origen).
            pregunta: |
              En simplificar les equacions, has dividit per alguna expressió? Què passa amb els punts on aquesta expressió val zero?
          - id: nomes_origen
            descripcio: |
              Troba només punts aïllats (per exemple $(0,0)$ o uns quants punts concrets) en lloc de corbes senceres de punts crítics.
            pregunta: |
              Si prens un punt qualsevol de l'eix $x$, per exemple $(5,0)$, s'anul·la el gradient? Què et diu això sobre la forma del conjunt de punts crítics?
          - id: derivada_malament
            descripcio: |
              Deriva malament algun terme (exponents o coeficients de $x^3y^3$).
            pregunta: |
              Pots comprovar les teves parcials derivant $f$ com a funció de $t=xy$ amb la regla de la cadena?
        nota_professor: |
          Observació útil per a l'apartat (b): $f(x,y)=g(xy)$ amb $g(t)=t^3-3t^2$, i $g'(t)=3t(t-2)$; per això els punts crítics són exactament $\{xy=0\}\cup\{xy=2\}$.

      - id: "t5-12b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          Sense usar derivades segones, raoneu el caràcter dels punts crítics de $f(x,y)$ que es troben a la bola unitat $B(\mathbf{0},1)$.
        teoria: ["T5.21", "T5.22"]
        teoria_reservada: []
        resultat:
          valor: |
            Els punts crítics de $B(\mathbf{0},1)$ són els punts dels eixos amb $\|(x,y)\|<1$ (la hipèrbola $xy=2$ queda fora de la bola). Tots són màxims locals no estrictes: dins de la bola $f(x,y)=(xy)^2(xy-3)\leq0=f(p)$, i $f$ és constantment $0$ sobre els eixos.
          fuites: ['m[àa]xims?\s+locals?\s+no\s+estrict', 'm[àa]xims?\s+(locals?\s+)?no\s+estrict']
        passos:
          - id: punts_a_la_bola
            titol: "Quins punts crítics hi ha a la bola"
            objectiu: |
              Sabent per l'apartat (a) que els punts crítics són els dels eixos i els de la hipèrbola $xy=2$, determinar quins són a $B(\mathbf{0},1)$.
            idea: |
              Comparar $x^2+y^2$ amb $|xy|$ mitjançant una desigualtat elemental.
            detall: |
              Com que $x^2+y^2\geq2|xy|$, els punts amb $xy=2$ compleixen $x^2+y^2\geq4$: cap és a la bola. Els punts crítics de la bola són els dels eixos: $(x,0)$ amb $|x|<1$ i $(0,y)$ amb $|y|<1$, on $f$ val $0$.
            fuites: ['x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*(\\ge|\\geq|≥)\s*4']
            teoria: []
          - id: reescriure
            titol: "Reescriure f en funció de xy"
            objectiu: |
              Escriure $f$ d'una manera que en faci evident el signe.
            idea: |
              $f$ només depèn del producte $t=xy$: factoritzar com a polinomi en $t$.
            detall: |
              Amb $t=xy$, $f(x,y)=-3t^2+t^3=t^2(t-3)$.
            fuites: ['t\^\{?2\}?\s*\(\s*t\s*-\s*3\s*\)', '\(x\s*y\)\^\{?2\}?\s*\(\s*x\s*y\s*-\s*3\s*\)']
            teoria: []
          - id: signe_i_caracter
            titol: "Signe a la bola i conclusió"
            objectiu: |
              Comparar $f$ en un entorn de cada punt crític de la bola amb el valor de $f$ en aquest punt, i deduir-ne el caràcter.
            idea: |
              Fitar $|xy|$ dins de la bola per saber el signe de cada factor, i aplicar la definició d'extrem local (la bola és oberta, així que conté un entorn de cada punt seu).
            detall: |
              A $B(\mathbf{0},1)$, $|xy|\leq\frac12(x^2+y^2)<\frac12$, de manera que $t-3<0$ i $f=t^2(t-3)\leq0$, amb igualtat si i només si $t=0$. Per a $p$ a un eix de la bola, $f(p)=0$, i prenent $\epsilon$ amb $B(p,\epsilon)\subseteq B(\mathbf{0},1)$ es té $f(x,y)\leq f(p)$ a $B(p,\epsilon)$: $p$ és màxim local. No és estricte perquè $f=0$ en tots els punts de l'eix propers a $p$.
            fuites: ['t\s*-\s*3\s*<\s*0', 'f\s*(\\le|\\leq|≤)\s*0', 'm[àa]xim\s+local']
            teoria: ["T5.21"]
        errors_comuns:
          - id: hipèrbola_dins
            descripcio: |
              Inclou (o no descarta raonadament) punts de $xy=2$ dins la bola.
            pregunta: |
              Si $|xy|=2$, quant ha de valer com a mínim $x^2+y^2$?
          - id: estricte
            descripcio: |
              Afirma que són extrems estrictes, oblidant que els punts crítics no són aïllats.
            pregunta: |
              Quant val $f$ als punts de l'eix que estan molt a prop de $p$? Compleixen la desigualtat estricta de la definició?
          - id: usa_hessiana
            descripcio: |
              Intenta usar la hessiana (prohibit per l'enunciat; a més, als eixos és semidefinida i no decideix).
            pregunta: |
              L'enunciat no et deixa usar derivades segones. Hi ha alguna manera d'escriure $f$ que et digui directament el seu signe?
          - id: signe_sense_fita
            descripcio: |
              Afirma $f\leq0$ sense justificar per què $xy-3<0$, o ho conclou al pla sencer.
            pregunta: |
              El signe de $f$ és el mateix a tot el pla? Què fa servir el teu raonament de la condició de ser dins la bola?
        nota_professor: |
          Fora de la bola: tots els punts dels eixos són de fet màxims locals no estrictes (prop d'un eix, $|xy|$ és petit), i els punts de $xy=2$ són mínims locals no estrictes, perquè $g(t)=t^2(t-3)$ té un mínim local a $t=2$ amb $g(2)=-4$. La restricció a la bola simplifica la fita $|xy|<1/2$.

  - num: 13
    font: null
    preambul: |
      Considerem la funció $f(x,y)=e^{x-y}\left(\cos(x+1)-\sin(y+1)-1\right)$ i el punt $p=(-1,-1)$.
    indicacio: null
    exercicis:
      - id: "t5-13a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          Calculeu el polinomi de Taylor de grau $\leqslant3$ de $f$ en $p$.
        teoria: ["T5.14"]
        teoria_reservada: []
        resultat:
          valor: |
            Amb $u=x+1$, $v=y+1$:
            $P_3=-v-\frac12u^2-uv+v^2-\frac12u^3+uv^2-\frac13v^3$, és a dir,
            $P_3(x,y)=-(y+1)-\frac12(x+1)^2-(x+1)(y+1)+(y+1)^2-\frac12(x+1)^3+(x+1)(y+1)^2-\frac13(y+1)^3$.
          fuites: ['-\s*\\[dt]?frac\s*\{?1\}?\s*\{?3\}?\s*v\^\{?3\}?', '-\s*v\^\{?3\}?\s*/\s*3', '-\s*\\[dt]?frac\s*\{?1\}?\s*\{?3\}?\s*\(y\s*\+\s*1\)\^\{?3\}?', '\+\s*u\s*(\\[,;:! ]|\s)*v\^\{?2\}?', '\+\s*\(x\s*\+\s*1\)\s*(\\[,;:! ]|\s)*\(y\s*\+\s*1\)\^\{?2\}?']
        passos:
          - id: canvi_i_factors
            titol: "Centrar i desenvolupar els factors"
            objectiu: |
              Escriure $f$ en variables centrades en $p$ i desenvolupar cada factor fins a grau $3$.
            idea: |
              Amb $u=x+1$, $v=y+1$ s'observa que $x-y=u-v$; usar els desenvolupaments d'una variable de l'exponencial, el cosinus i el sinus, justificats per la unicitat del polinomi de Taylor.
            detall: |
              $f=e^{u-v}\left(\cos u-\sin v-1\right)$.
              $\cos u-1-\sin v=-v-\frac12u^2+\frac16v^3+O_4(u,v)$ i $e^{u-v}=1+(u-v)+\frac12(u-v)^2+O_3(u,v)$.
            fuites: ['-\s*v\s*-\s*\\[dt]?frac\s*\{?1\}?\s*\{?2\}?\s*u\^\{?2\}?', '\\[dt]?frac\s*\{?1\}?\s*\{?6\}?\s*v\^\{?3\}?', 'v\^\{?3\}?\s*/\s*6']
            teoria: ["T5.16", "T5.17"]
          - id: producte
            titol: "Multiplicar per graus"
            objectiu: |
              Obtenir els termes de grau $1$, $2$ i $3$ del producte.
            idea: |
              El segon factor no té terme constant: el terme de grau $k$ del producte combina el de grau $j\geq1$ del segon factor amb el de grau $k-j$ de l'exponencial.
            detall: |
              Grau 1: $-v$. Grau 2: $-\frac12u^2+(u-v)(-v)=-\frac12u^2-uv+v^2$.
              Grau 3: $\frac16v^3+(u-v)\left(-\frac12u^2\right)+\frac12(u-v)^2(-v)=-\frac12u^3+uv^2-\frac13v^3$.
              $P_3=-v-\frac12u^2-uv+v^2-\frac12u^3+uv^2-\frac13v^3$, amb $u=x+1$, $v=y+1$ (i $f(p)=0$).
            fuites: ['-\s*\\[dt]?frac\s*\{?1\}?\s*\{?3\}?\s*v\^\{?3\}?', '-\s*v\^\{?3\}?\s*/\s*3', '-\s*u\s*(\\[,;:! ]|\s)*v\s*\+\s*v\^\{?2\}?', '\+\s*u\s*(\\[,;:! ]|\s)*v\^\{?2\}?']
            teoria: ["T5.16"]
        errors_comuns:
          - id: no_centrar
            descripcio: |
              Desenvolupa $\cos(x+1)$ i $\sin(y+1)$ en potències de $x$ i $y$ (al voltant de l'origen) en lloc de $x+1$ i $y+1$.
            pregunta: |
              Al voltant de quin punt has de desenvolupar? En quines variables petites s'escriu aleshores l'argument del cosinus?
          - id: exponencial_mal_centrada
            descripcio: |
              Escriu $e^{x-y}$ com $e^{u-v}$ multiplicat per una constant incorrecta, o desenvolupa $e^{x-y}$ al voltant de $0$ en $x,y$.
            pregunta: |
              Què val $x-y$ en termes de $u=x+1$ i $v=y+1$? Hi apareix alguna constant?
          - id: oblida_creuats
            descripcio: |
              Oblida termes de grau $3$ que provenen de $(u-v)^2\cdot(-v)$ o de $(u-v)\cdot(-\frac12u^2)$.
            pregunta: |
              Quins parells de termes (un de cada factor) tenen graus que sumen exactament $3$? Els has inclòs tots?
        nota_professor: |
          Comprovat amb sympy. Els termes $u^2v$ s'anul·len: $+\frac12u^2v$ de $(u-v)(-\frac12u^2)$ i $-\frac12u^2v$ de $\frac12(u-v)^2(-v)$.

      - id: "t5-13b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          Useu el polinomi per determinar la hessiana de $f$ en $p$.
        teoria: ["T5.32"]
        teoria_reservada: []
        resultat:
          valor: |
            $Hf(p)=\begin{pmatrix}-1&-1\\-1&2\end{pmatrix}$, és a dir $f_{xx}(p)=-1$, $f_{xy}(p)=-1$, $f_{yy}(p)=2$.
          fuites: ['matrix\}\s*-\s*1\s*&\s*-\s*1\s*\\\\\s*-\s*1\s*&\s*2', 'f_\{?yy\}?\s*\(p\)\s*=\s*2', 'f_\{?xy\}?\s*\(p\)\s*=\s*-\s*1', 'f_\{?xx\}?\s*\(p\)\s*=\s*-\s*1']
        passos:
          - id: relacio
            titol: "Relació entre part quadràtica i hessiana"
            objectiu: |
              Sabent el polinomi de l'apartat (a), identificar quina relació hi ha entre els seus termes de grau $2$ i les derivades segones de $f$ en $p$.
            idea: |
              Comparar amb la fórmula de Taylor: el terme de grau $2$ és $\frac12$ de la forma quadràtica hessiana avaluada en $(x+1,y+1)$.
            detall: |
              Termes de grau $2$: $\frac12\left(f_{xx}(p)u^2+2f_{xy}(p)uv+f_{yy}(p)v^2\right)$, on per Schwarz $f_{xy}=f_{yx}$ ($f$ és $\mathcal{C}^\infty$). Cal igualar-ho a $-\frac12u^2-uv+v^2$.
            fuites: []
            teoria: ["T5.14", "T5.6"]
          - id: llegir
            titol: "Llegir els coeficients"
            objectiu: |
              Obtenir les derivades segones i escriure la matriu hessiana.
            idea: |
              Identificar coeficient a coeficient; compte amb el factor $2$ del terme creuat.
            detall: |
              $\frac12f_{xx}=-\frac12\Rightarrow f_{xx}(p)=-1$; $f_{xy}(p)=-1$; $\frac12f_{yy}=1\Rightarrow f_{yy}(p)=2$.
              $Hf(p)=\begin{pmatrix}-1&-1\\-1&2\end{pmatrix}$.
            fuites: ['f_\{?yy\}?\s*\(p\)\s*=\s*2', 'f_\{?xy\}?\s*\(p\)\s*=\s*-\s*1', 'matrix\}\s*-\s*1\s*&\s*-\s*1']
            teoria: ["T5.32"]
        errors_comuns:
          - id: oblida_factor_meitat
            descripcio: |
              Pren directament els coeficients de $u^2$ i $v^2$ com a $f_{xx}$ i $f_{yy}$, oblidant el $\frac12$ de la fórmula de Taylor.
            pregunta: |
              A la fórmula de Taylor, quin factor multiplica la suma de derivades segones? Quin és aleshores el coeficient de $u^2$?
          - id: creuat_dividit
            descripcio: |
              Divideix el coeficient de $uv$ entre $2$ (o el multiplica), obtenint $f_{xy}=-\frac12$ o $-2$.
            pregunta: |
              Quantes vegades apareix el producte $uv$ a $\frac12\sum_{i,j}D_{ij}f(p)u_iu_j$?
        nota_professor: |
          Comprovació directa: $f_x=e^{x-y}(\cos(x+1)-\sin(y+1)-1-\sin(x+1))$, etc.; dona els mateixos valors.

      - id: "t5-13c"
        apartat: "c"
        tipus: teoric
        enunciat: |
          És $p$ un extrem local de $f$?
        teoria: ["T5.21"]
        teoria_reservada: []
        resultat:
          valor: |
            No. El polinomi té terme de grau $1$ igual a $-(y+1)$, de manera que $\nabla f(p)=(0,-1)\neq(0,0)$: $p$ no és un punt crític i, com que $f$ és diferenciable, no pot ser extrem local.
          fuites: ['no\s+és\s+(un\s+)?punt\s+crític', 'no\s+(és|pot\s+ser)\s+(un\s+)?extrem', '\(\s*0\s*(,|\\[,;:! ]|\\quad|\s)*-\s*1\s*\)', 'f_\{?y\}?\s*\(p\)\s*=\s*-\s*1', '\\partial\s*y\}?\s*\(p\)\s*=\s*-\s*1']
        passos:
          - id: gradient
            titol: "Llegir el gradient"
            objectiu: |
              Usant el polinomi de l'apartat (a), determinar $Df(p)$.
            idea: |
              Els termes de grau $1$ del polinomi de Taylor són $Df(p)$ aplicada a $(x+1,y+1)$.
            detall: |
              L'única part lineal és $-(y+1)$, per tant $f_x(p)=0$ i $f_y(p)=-1$: $Df(p)=(0\ \ -1)\neq0$.
            fuites: ['f_\{?y\}?\s*\(p\)\s*=\s*-\s*1', '\\partial\s*y\}?\s*\(p\)\s*=\s*-\s*1', '\(\s*0\s*(,|\\[,;:! ]|\\quad|\s)*-\s*1\s*\)']
            teoria: ["T5.14"]
          - id: concloure
            titol: "Concloure"
            objectiu: |
              Decidir si $p$ pot ser un extrem local.
            idea: |
              Usar la condició necessària d'extrem per a funcions diferenciables.
            detall: |
              $f$ és diferenciable en $p$ i $Df(p)\neq0$, així que $p$ no és punt crític; pel resultat que diu que els extrems locals d'una funció diferenciable són crítics, $p$ no és extrem local (la hessiana no hi té cap paper).
            fuites: ['no\s+és\s+(un\s+)?punt\s+crític']
            teoria: ["T5.22", "T5.23"]
        errors_comuns:
          - id: usa_hessiana
            descripcio: |
              Usa la hessiana de (b) (indefinida, $\det=-3$) per concloure que $p$ és un punt de sella, sense mirar si $p$ és crític.
            pregunta: |
              El criteri de la hessiana té una hipòtesi sobre el punt. Es compleix aquí? Mira els termes de grau $1$ del polinomi.
          - id: sella_no_critic
            descripcio: |
              Anomena "punt de sella" un punt no crític.
            pregunta: |
              Segons la definició, quina condició ha de complir un punt per poder-se anomenar punt de sella?
        nota_professor: |
          L'apartat (b) és un parany: la hessiana existeix i és indefinida, però el que decideix és el terme lineal. Directament, $f(-1,y)=e^{-1-y}(-\sin(y+1))$ canvia de signe en $y=-1$.

  - num: 14
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t5-14"
        apartat: null
        tipus: calcul
        enunciat: |
          Sigui $\varphi:\mathbb{R}\to\mathbb{R}$ una funció derivable i tal que $a<b$ en són els únics zeros, complint a més $\varphi'(a)>0$ i $\varphi'(b)<0$. Considerem la funció $f(x,y)=\int_x^y\varphi(t)\,dt$. Calculeu els punts crítics de $f$, discutiu-ne el caràcter i interpreteu els resultats obtinguts.
        teoria: ["T5.21", "T5.22"]
        teoria_reservada: []
        resultat:
          valor: |
            $\nabla f(x,y)=(-\varphi(x),\varphi(y))$; punts crítics: $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$.
            $\varphi<0$ a $(-\infty,a)$, $\varphi>0$ a $(a,b)$, $\varphi<0$ a $(b,+\infty)$. Amb $\Phi'=\varphi$, $f(x,y)=\Phi(y)-\Phi(x)$, i $\Phi$ té un mínim local estricte a $a$ i un màxim local estricte a $b$. Per tant:
            $(a,b)$ és màxim local estricte, amb $f(a,b)=\int_a^b\varphi>0$; $(b,a)$ és mínim local estricte, amb $f(b,a)=-\int_a^b\varphi<0$; $(a,a)$ i $(b,b)$ són punts de sella (amb $f=0$).
            Interpretació: entre els intervals d'integració propers, el que dona més àrea és exactament el tram $[a,b]$ on $\varphi>0$ (afegir o treure trossos on $\varphi<0$, o treure trossos on $\varphi>0$, fa disminuir la integral); el mínim és el mateix interval recorregut al revés. A la diagonal $f(x,x)=0$.
          fuites: ['\(a\s*,\s*b\)\$?\s*(és\s+)?(un\s+)?m[àa]xim', '\(b\s*,\s*a\)\$?\s*(és\s+)?(un\s+)?m[íi]nim', 'm[àa]xim\s+(local\s+)?(estricte\s+)?(a|en)\s+\$?\(a\s*,\s*b\)', 'm[íi]nim\s+(local\s+)?(estricte\s+)?(a|en)\s+\$?\(b\s*,\s*a\)']
        passos:
          - id: punts_critics
            titol: "Gradient i punts crítics"
            objectiu: |
              Calcular les derivades parcials de $f$, justificar que és diferenciable i trobar-ne els punts crítics.
            idea: |
              Pel teorema fonamental del càlcul (una variable; $\varphi$ és contínua perquè és derivable), derivar la integral respecte del límit superior i de l'inferior. Parcials contínues impliquen diferenciabilitat.
            detall: |
              $\frac{\partial f}{\partial x}(x,y)=-\varphi(x)$, $\frac{\partial f}{\partial y}(x,y)=\varphi(y)$, contínues, de manera que $f$ és diferenciable (de fet $\mathcal{C}^1$).
              $\nabla f=0\iff\varphi(x)=\varphi(y)=0\iff x,y\in\{a,b\}$: punts crítics $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$.
            fuites: ['-\s*\\varphi\s*\(x\)']
            teoria: ["T3.2", "T3.18", "T5.22"]
          - id: signe_phi
            titol: "Signe de φ"
            objectiu: |
              Determinar el signe de $\varphi$ a cadascun dels intervals en què $a$ i $b$ divideixen la recta.
            idea: |
              El signe de $\varphi'$ en un zero diu el signe de $\varphi$ just a cada costat; entre zeros consecutius, una funció contínua sense zeros no canvia de signe (valor intermedi).
            detall: |
              $\varphi'(a)=\lim_{t\to a}\frac{\varphi(t)}{t-a}>0$: $\varphi(t)$ té el signe de $t-a$ prop de $a$. Igualment $\varphi'(b)<0$: $\varphi(t)$ té el signe contrari de $t-b$ prop de $b$. Pel teorema del valor intermedi, el signe és constant a cada interval: $\varphi<0$ a $(-\infty,a)$, $\varphi>0$ a $(a,b)$, $\varphi<0$ a $(b,+\infty)$.
              Amb $\Phi(s)=\int_a^s\varphi$: $\Phi$ decreix, creix, decreix; $a$ és mínim local estricte i $b$ màxim local estricte de $\Phi$.
            fuites: ['\\varphi\s*>\s*0\$?\s*(a|en)\s*\$?\s*\(a\s*,\s*b\)', 'a\$?\s*és\s+(un\s+)?m[íi]nim\s+local']
            teoria: ["T2.24", "T5.9"]
          - id: classificar
            titol: "Caràcter dels punts crítics"
            objectiu: |
              Decidir el caràcter de cadascun dels quatre punts crítics.
            idea: |
              Com que $f(x,y)=\Phi(y)-\Phi(x)$ separa variables, l'increment de $f$ és la diferència de dos increments d'una variable; combinar el caràcter de $a$ i $b$ per a $\Phi$ en cada coordenada.
            detall: |
              $f(x,y)-f(x_0,y_0)=[\Phi(y)-\Phi(y_0)]-[\Phi(x)-\Phi(x_0)]$.
              $(a,b)$: per $(x,y)$ proper, $\Phi(y)\leq\Phi(b)$ i $\Phi(x)\geq\Phi(a)$, amb igualtat només si $y=b$ i $x=a$ respectivament; si $(x,y)\neq(a,b)$ alguna de les dues és estricta i $f(x,y)<f(a,b)$: màxim local estricte.
              $(b,a)$: tot al revés, mínim local estricte.
              $(a,a)$: $f(a,y)-f(a,a)=\Phi(y)-\Phi(a)>0$ per $y\neq a$ proper, i $f(x,a)-f(a,a)=-(\Phi(x)-\Phi(a))<0$: punt de sella. $(b,b)$: anàlogament, sella.
              (Si $\varphi\in\mathcal{C}^1$, ho confirma la hessiana $Hf=\mathrm{diag}(-\varphi'(x),\varphi'(y))$.)
            fuites: ['\(a\s*,\s*b\)\$?\s*:.*m[àa]xim', 'm[àa]xim\s+local\s+estricte', 'm[íi]nim\s+local\s+estricte']
            teoria: ["T5.21", "T5.25"]
          - id: interpretar
            titol: "Interpretar"
            objectiu: |
              Explicar en termes d'àrees per què els punts crítics tenen aquest caràcter.
            idea: |
              $f(x,y)$ és l'àrea amb signe sota $\varphi$ entre $x$ i $y$; pensar què passa en moure lleugerament els extrems de l'interval d'integració.
            detall: |
              $f(a,b)=\int_a^b\varphi>0$ és l'àrea de tot el tram on $\varphi$ és positiva: moure $a$ o $b$ cap a fora afegeix àrea negativa i cap a dins en treu de positiva, així que la integral decreix. $f(b,a)=-f(a,b)$ és el mateix interval recorregut al revés (mínim). A la diagonal $f(x,x)=0$, i prop de $(a,a)$ o $(b,b)$ la integral sobre un interval petit pot tenir qualsevol signe segons cap a on el posem: sella.
            fuites: []
            teoria: []
        errors_comuns:
          - id: signe_derivada_inferior
            descripcio: |
              Oblida el signe menys en derivar respecte del límit inferior ($\partial f/\partial x=\varphi(x)$).
            pregunta: |
              Si escrius $\int_x^y\varphi=\Phi(y)-\Phi(x)$, què dona derivar respecte de $x$?
          - id: hessiana_sense_c2
            descripcio: |
              Aplica el criteri de la hessiana assumint $f\in\mathcal{C}^2$, quan només sabem que $\varphi$ és derivable ($\varphi'$ podria no ser contínua).
            pregunta: |
              Quina regularitat demana el criteri de la hessiana? Te la garanteixen les hipòtesis sobre $\varphi$? Hi ha alguna manera d'evitar-lo aprofitant la forma de $f$?
          - id: signe_phi_sense_justificar
            descripcio: |
              Afirma el signe de $\varphi$ entre zeros sense justificar per què no canvia (o confon el signe de $\varphi$ amb el de $\varphi'$).
            pregunta: |
              Saps el signe de $\varphi$ prop de $a$. Per què no pot canviar de signe abans d'arribar a $b$?
          - id: oblida_punts_diagonal
            descripcio: |
              Només troba $(a,b)$ i $(b,a)$, oblidant $(a,a)$ i $(b,b)$.
            pregunta: |
              Les condicions $\varphi(x)=0$ i $\varphi(y)=0$ obliguen $x$ i $y$ a ser diferents?
        nota_professor: |
          Com que $\varphi$ només és derivable, $f$ és $\mathcal{C}^1$ i les seves parcials són derivables, però no necessàriament $\mathcal{C}^2$: el Teorema 33 tal com està enunciat no s'aplica en general. L'argument per separació de variables és complet i no en depèn. $(a,b)$ no és necessàriament màxim absolut: per $x>y$, $f(x,y)=-\int_y^x\varphi$ pot ser gran si $\varphi$ és molt negativa a $(b,\infty)$. Sí que és el màxim de $f$ restringida a $x\leq y$.

  - num: 15
    font: null
    preambul: |
      Repetiu el problema anterior amb les altres tres variants possibles:
    indicacio: null
    exercicis:
      - id: "t5-15a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          $\varphi'(a)<0$ i $\varphi'(b)>0$;
        teoria: ["T5.21", "T5.22"]
        teoria_reservada: []
        resultat:
          valor: |
            Punts crítics: $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$. Ara $\varphi>0$ a $(-\infty,a)$, $\varphi<0$ a $(a,b)$, $\varphi>0$ a $(b,+\infty)$; $\Phi$ (primitiva de $\varphi$) té màxim local estricte a $a$ i mínim local estricte a $b$.
            $(a,b)$ és mínim local estricte, amb $f(a,b)=\int_a^b\varphi<0$; $(b,a)$ és màxim local estricte, amb $f(b,a)=\int_a^b|\varphi|>0$; $(a,a)$ i $(b,b)$ són punts de sella.
            Interpretació: $[a,b]$ és ara el tram on $\varphi<0$; integrant-lo d'esquerra a dreta s'obté l'àrea més negativa possible a prop, i al revés la més positiva.
          fuites: ['\(a\s*,\s*b\)\$?\s*(és\s+)?(un\s+)?m[íi]nim', '\(b\s*,\s*a\)\$?\s*(és\s+)?(un\s+)?m[àa]xim', 'm[íi]nim\s+(local\s+)?(estricte\s+)?(a|en)\s+\$?\(a\s*,\s*b\)', 'm[àa]xim\s+(local\s+)?(estricte\s+)?(a|en)\s+\$?\(b\s*,\s*a\)']
        passos:
          - id: punts_critics
            titol: "Punts crítics"
            objectiu: |
              Amb $f(x,y)=\int_x^y\varphi(t)\,dt$ com al problema 14 i les noves hipòtesis, trobar els punts crítics de $f$.
            idea: |
              El gradient no depèn dels signes de $\varphi'$: és el mateix càlcul del problema anterior (teorema fonamental del càlcul).
            detall: |
              $\nabla f=(-\varphi(x),\varphi(y))$, que s'anul·la exactament a $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$; $f$ és diferenciable perquè les parcials són contínues.
            fuites: []
            teoria: ["T3.18", "T5.22"]
          - id: signe_phi
            titol: "Signe de φ"
            objectiu: |
              Determinar el signe de $\varphi$ a cada interval determinat per $a$ i $b$, i el caràcter de $a$ i $b$ per a una primitiva $\Phi$ de $\varphi$.
            idea: |
              El signe de $\varphi'$ en cada zero fixa el signe de $\varphi$ a cada costat; el valor intermedi el propaga fins al zero següent.
            detall: |
              $\varphi'(a)<0$: $\varphi>0$ just a l'esquerra de $a$ i $\varphi<0$ just a la dreta; $\varphi'(b)>0$: $\varphi<0$ just a l'esquerra de $b$ i $\varphi>0$ a la dreta. Per valor intermedi: $\varphi>0$ a $(-\infty,a)$, $\varphi<0$ a $(a,b)$, $\varphi>0$ a $(b,+\infty)$ (coherent). Per tant $\Phi$ creix, decreix, creix: $a$ és màxim local estricte i $b$ mínim local estricte de $\Phi$.
            fuites: ['\\varphi\s*<\s*0\$?\s*(a|en)\s*\$?\s*\(a\s*,\s*b\)']
            teoria: ["T2.24", "T5.9"]
          - id: classificar
            titol: "Caràcter dels punts crítics"
            objectiu: |
              Decidir el caràcter dels quatre punts crítics.
            idea: |
              Escriure $f(x,y)=\Phi(y)-\Phi(x)$ i combinar el caràcter de $a$ i $b$ per a $\Phi$ a cada coordenada, com al problema 14.
            detall: |
              $(a,b)$: per $(x,y)$ proper, $\Phi(y)\geq\Phi(b)$ i $\Phi(x)\leq\Phi(a)$, amb igualtat només si $y=b$ i $x=a$ respectivament; així $f(x,y)>f(a,b)$ si $(x,y)\neq(a,b)$: mínim local estricte. $(b,a)$: màxim local estricte. $(a,a)$: $f(a,y)-f(a,a)=\Phi(y)-\Phi(a)<0$ i $f(x,a)-f(a,a)=\Phi(a)-\Phi(x)>0$: sella; $(b,b)$ igual, sella.
            fuites: ['m[íi]nim\s+local\s+estricte', 'm[àa]xim\s+local\s+estricte']
            teoria: ["T5.21", "T5.25"]
          - id: interpretar
            titol: "Interpretar"
            objectiu: |
              Interpretar els resultats en termes d'àrees.
            idea: |
              Identificar on $\varphi$ és positiva i negativa i pensar quin interval d'integració proper maximitza o minimitza l'àrea amb signe.
            detall: |
              $[a,b]$ és el tram on $\varphi<0$: $\int_a^b\varphi$ és l'àrea més negativa que es pot aconseguir movent poc els extrems, i $\int_b^a\varphi=\int_a^b|\varphi|$ la més positiva. A la diagonal $f=0$ i els punts $(a,a)$, $(b,b)$ són selles.
            fuites: []
            teoria: []
        errors_comuns:
          - id: copia_resultat_anterior
            descripcio: |
              Copia la classificació del problema 14 sense refer el signe de $\varphi$.
            pregunta: |
              Han canviat els signes de $\varphi'(a)$ i $\varphi'(b)$. Què implica això per al signe de $\varphi$ a $(a,b)$?
          - id: signe_derivada_inferior
            descripcio: |
              Oblida el signe menys de $\partial f/\partial x$ i inverteix el caràcter en la coordenada $x$.
            pregunta: |
              En $f=\Phi(y)-\Phi(x)$, si $\Phi$ té un màxim a $x=a$, què té $-\Phi(x)$ en aquest punt?
        nota_professor: |
          És el cas del problema 14 aplicat a $-\varphi$: $f$ canvia de signe i màxims i mínims s'intercanvien. Igual que abans, $\varphi$ només derivable fa preferible l'argument directe al de la hessiana.

      - id: "t5-15b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          $\varphi'(a)>0$ i $\varphi'(b)>0$;
        teoria: ["T5.21", "T5.22"]
        teoria_reservada: []
        resultat:
          valor: |
            Les hipòtesis són incompatibles: no existeix cap $\varphi$ derivable amb exactament dos zeros $a<b$ i $\varphi'(a)>0$, $\varphi'(b)>0$. En efecte, $\varphi'(a)>0$ fa $\varphi>0$ just a la dreta de $a$; sense zeros a $(a,b)$, $\varphi>0$ a tot $(a,b)$, i aleshores $\varphi'(b)=\lim_{t\to b^-}\frac{\varphi(t)}{t-b}\leq0$. Contradicció.
            (Formalment, $\nabla f=(-\varphi(x),\varphi(y))$ donaria els punts crítics $(a,a),(a,b),(b,a),(b,b)$, i la hessiana $\mathrm{diag}(-\varphi'(x),\varphi'(y))$ seria indefinida a tots quatre: totes serien selles. Però el problema és buit.)
            Interpretació: en zeros simples consecutius el signe de $\varphi'$ ha d'alternar-se.
          fuites: ['incompatibles?', 'no\s+existeix\s+cap', 'no\s+pot\s+existir', 'impossibles?', 'contradicci[óo]']
        passos:
          - id: punts_critics_formals
            titol: "Punts crítics (formalment)"
            objectiu: |
              Amb $f(x,y)=\int_x^y\varphi(t)\,dt$ com al problema 14, escriure els punts crítics que tindria $f$.
            idea: |
              El gradient és el mateix que al problema anterior; no depèn dels signes de $\varphi'$.
            detall: |
              $\nabla f=(-\varphi(x),\varphi(y))$: punts crítics $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$.
            fuites: []
            teoria: ["T5.22"]
          - id: signe_phi
            titol: "Signe de φ i coherència"
            objectiu: |
              Determinar el signe de $\varphi$ a l'interval $(a,b)$ i deduir-ne què passa amb el signe de $\varphi'(b)$.
            idea: |
              Del signe de $\varphi'(a)$ deduir el signe de $\varphi$ just a la dreta de $a$, propagar-lo fins a $b$ amb el valor intermedi, i calcular $\varphi'(b)$ com a límit lateral per l'esquerra.
            detall: |
              $\varphi'(a)>0\Rightarrow\varphi>0$ a $(a,a+\delta)$. Com que $\varphi$ és contínua i no s'anul·la a $(a,b)$, pel valor intermedi $\varphi>0$ a tot $(a,b)$. Aleshores, per $t<b$, $\frac{\varphi(t)-\varphi(b)}{t-b}=\frac{\varphi(t)}{t-b}<0$, d'on $\varphi'(b)\leq0$, en contradicció amb $\varphi'(b)>0$.
            fuites: ['\\varphi''\s*\(b\)\s*(\\le|\\leq|≤)\s*0', 'contradicci[óo]']
            teoria: ["T2.24"]
          - id: concloure
            titol: "Conclusió i interpretació"
            objectiu: |
              Treure la conclusió sobre el problema plantejat i interpretar-la.
            idea: |
              Pensar què diu el pas anterior sobre l'existència de $\varphi$, i com seria el càlcul formal si no ens n'adonéssim.
            detall: |
              No existeix cap $\varphi$ amb aquestes hipòtesis: el problema és buit. Si es fes el càlcul formal amb la hessiana $\mathrm{diag}(-\varphi'(x),\varphi'(y))$, els quatre punts sortirien selles (a $(a,b)$: $\mathrm{diag}(-\varphi'(a),\varphi'(b))$, signes $(-,+)$), però és una conclusió sobre un objecte inexistent. Lliçó: en zeros simples consecutius $\varphi'$ alterna de signe.
            fuites: ['no\s+existeix\s+cap', 'buit']
            teoria: []
        errors_comuns:
          - id: calcul_formal
            descripcio: |
              Fa el càlcul formal (totes selles) sense adonar-se que les hipòtesis no es poden complir.
            pregunta: |
              Abans de classificar: pots dibuixar una $\varphi$ que s'anul·li només a $a$ i $b$ i que creixi en tots dos zeros?
          - id: signe_sense_valor_intermedi
            descripcio: |
              Pressuposa el signe de $\varphi$ a $(a,b)$ sense justificar-lo, o creu que pot canviar sense passar per zero.
            pregunta: |
              Una funció contínua pot passar de positiva a negativa dins $(a,b)$ sense anul·lar-se?
        nota_professor: |
          L'enunciat parla de "les altres tres variants possibles" de signes, però (b) i (c) són impossibles; probablement és intencionat (part de la "interpretació"). Si l'estudiant dona la resposta formal (quatre selles), cal acceptar el càlcul però portar-lo a veure la incompatibilitat.

      - id: "t5-15c"
        apartat: "c"
        tipus: teoric
        enunciat: |
          $\varphi'(a)<0$ i $\varphi'(b)<0$.
        teoria: ["T5.21", "T5.22"]
        teoria_reservada: []
        resultat:
          valor: |
            Les hipòtesis són incompatibles: $\varphi'(a)<0$ fa $\varphi<0$ just a la dreta de $a$; sense zeros a $(a,b)$, $\varphi<0$ a tot $(a,b)$, i aleshores $\varphi'(b)=\lim_{t\to b^-}\frac{\varphi(t)}{t-b}\geq0$. Contradicció: no existeix cap $\varphi$ així.
            (Formalment, els punts crítics serien $(a,a),(a,b),(b,a),(b,b)$ i la hessiana $\mathrm{diag}(-\varphi'(x),\varphi'(y))$ seria indefinida a tots quatre: totes selles. Però el problema és buit.)
            Interpretació: en zeros simples consecutius el signe de $\varphi'$ ha d'alternar-se.
          fuites: ['incompatibles?', 'no\s+existeix\s+cap', 'no\s+pot\s+existir', 'impossibles?', 'contradicci[óo]']
        passos:
          - id: punts_critics_formals
            titol: "Punts crítics (formalment)"
            objectiu: |
              Amb $f(x,y)=\int_x^y\varphi(t)\,dt$ com al problema 14, escriure els punts crítics que tindria $f$.
            idea: |
              El gradient és el mateix que al problema anterior; no depèn dels signes de $\varphi'$.
            detall: |
              $\nabla f=(-\varphi(x),\varphi(y))$: punts crítics $(a,a)$, $(a,b)$, $(b,a)$, $(b,b)$.
            fuites: []
            teoria: ["T5.22"]
          - id: signe_phi
            titol: "Signe de φ i coherència"
            objectiu: |
              Determinar el signe de $\varphi$ a l'interval $(a,b)$ i deduir-ne què passa amb el signe de $\varphi'(b)$.
            idea: |
              Del signe de $\varphi'(a)$ deduir el signe de $\varphi$ just a la dreta de $a$, propagar-lo fins a $b$ amb el valor intermedi, i calcular $\varphi'(b)$ com a límit lateral per l'esquerra.
            detall: |
              $\varphi'(a)<0\Rightarrow\varphi<0$ a $(a,a+\delta)$. Com que $\varphi$ és contínua i no s'anul·la a $(a,b)$, pel valor intermedi $\varphi<0$ a tot $(a,b)$. Aleshores, per $t<b$, $\frac{\varphi(t)}{t-b}>0$, d'on $\varphi'(b)\geq0$, en contradicció amb $\varphi'(b)<0$.
            fuites: ['\\varphi''\s*\(b\)\s*(\\ge|\\geq|≥)\s*0', 'contradicci[óo]']
            teoria: ["T2.24"]
          - id: concloure
            titol: "Conclusió i interpretació"
            objectiu: |
              Treure la conclusió sobre el problema plantejat i interpretar-la.
            idea: |
              Pensar què diu el pas anterior sobre l'existència de $\varphi$, i com seria el càlcul formal si no ens n'adonéssim.
            detall: |
              No existeix cap $\varphi$ amb aquestes hipòtesis: el problema és buit. El càlcul formal amb $\mathrm{diag}(-\varphi'(x),\varphi'(y))$ donaria quatre selles (a $(a,b)$: signes $(+,-)$), però sobre un objecte inexistent. Lliçó: en zeros simples consecutius $\varphi'$ alterna de signe.
            fuites: ['no\s+existeix\s+cap', 'buit']
            teoria: []
        errors_comuns:
          - id: calcul_formal
            descripcio: |
              Fa el càlcul formal (totes selles) sense adonar-se que les hipòtesis no es poden complir.
            pregunta: |
              Abans de classificar: pots dibuixar una $\varphi$ que s'anul·li només a $a$ i $b$ i que decreixi en tots dos zeros?
          - id: signe_sense_valor_intermedi
            descripcio: |
              Pressuposa el signe de $\varphi$ a $(a,b)$ sense justificar-lo, o creu que pot canviar sense passar per zero.
            pregunta: |
              Una funció contínua pot passar de negativa a positiva dins $(a,b)$ sense anul·lar-se?
        nota_professor: |
          Simètric de (b). Vegeu la nota de l'apartat (b) sobre l'enunciat.
