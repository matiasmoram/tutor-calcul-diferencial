    - id: classificar
      titol: Classificar
      objectiu: |
        Decidir el caràcter del punt crític, tenint en compte que la hessiana té un valor propi nul.
      idea: |
        Un valor propi nul no impedeix aplicar el criteri si n'hi ha d'altres de signes oposats.
