name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # No API keys: the suite uses scripted LLMs; storage tests use a throwaway SQLite database.
      - run: uv run pytest -q
      - run: uv run ruff check backend/core backend/apps backend/settings
      - run: uv run python scripts/check_fitxes.py
      - name: Supabase migration matches the code
        run: |
          uv run python scripts/db.py schema > /tmp/schema.sql
          diff -u supabase/migrations/20261006000000_init.sql /tmp/schema.sql

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tutor-calcul .
