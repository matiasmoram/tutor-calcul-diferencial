    - id: compacitat
      titol: Compacitat
      objectiu: |
        Decidir quins dels tres conjunts són compactes.
      idea: |
        A $\mathbb{R}^4$, compacte equival a tancat i fitat: només cal estudiar els que són tancats, i mirar si són fitats.
      detall: |
        $C_1$ i $C_3$ no són tancats, per tant no són compactes (compacte $\Rightarrow$ tancat). $C_2$ és tancat però no fitat: $\begin{pmatrix}n&0\\0&1/n\end{pmatrix}\in C_2$ i $\|F(A_n)\|\geq n\to\infty$ per a aquesta matriu $A_n$. Per Heine-Borel, $C_2$ no és compacte. Cap dels tres és compacte.
