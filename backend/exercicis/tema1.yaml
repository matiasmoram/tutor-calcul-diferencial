    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        $C$ és un segment tancat de $\mathbb{R}^3$. $\mathring{C}=\varnothing$; $\mathrm{Fr}\,C=\overline{C}=C'=C$. $C$ és tancat i no és obert.
      fuites:
