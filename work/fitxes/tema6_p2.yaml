    font: null
    preambul: |
      Considereu la funció $f\colon\mathbb{R}^2\to\mathbb{R}$ definida per $f(x,y)=\sin(x+y)+\cos(x-y)$.
    indicacio: null
    exercicis:
      - id: "t6-10a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          Trobeu i classifiqueu tots els seus punts crítics.
        teoria: ["T5.22", "T5.21", "T5.25"]
        teoria_reservada: []
        resultat:
          valor: |
            Els punts crítics són els punts amb $x+y=\frac{\pi}{2}+k\pi$ i $x-y=m\pi$ ($k,m\in\mathbb{Z}$), és a dir, $(x,y)=\left(\frac{\pi}{4}+\frac{(k+m)\pi}{2},\ \frac{\pi}{4}+\frac{(k-m)\pi}{2}\right)$.
            - $k$ i $m$ parells: màxims locals estrictes, amb $f=2$ (de fet màxims absoluts).
            - $k$ i $m$ senars: mínims locals estrictes, amb $f=-2$ (mínims absoluts).
            - $k$ i $m$ de paritat diferent: punts de sella, amb $f=0$.
          fuites: ['k\s*(i|,)\s*m\s+(són\s+)?parells', 'k\s*(i|,)\s*m\s+(són\s+)?senars', 'paritat\s+diferent']
        passos:
          - id: critics
            titol: "Trobar els punts crítics"
            objectiu: |
              Resoldre el sistema $\nabla f=0$.
            idea: |
              Sumar i restar les dues equacions per separar-les en una condició sobre $x+y$ i una sobre $x-y$.
            detall: |
              $f_x=\cos(x+y)-\sin(x-y)$, $f_y=\cos(x+y)+\sin(x-y)$. Sumant i restant: $\cos(x+y)=0$ i $\sin(x-y)=0$, és a dir, $x+y=\frac{\pi}{2}+k\pi$, $x-y=m\pi$, amb $k,m\in\mathbb{Z}$. Equivalentment $(x,y)=\left(\frac{\pi}{4}+\frac{(k+m)\pi}{2},\frac{\pi}{4}+\frac{(k-m)\pi}{2}\right)$.
            fuites: ['\\cos\s*\(\s*x\s*\+\s*y\s*\)\s*=\s*0', '\\sin\s*\(\s*x\s*-\s*y\s*\)\s*=\s*0']
            teoria: ["T5.22"]
          - id: hessiana
            titol: "La hessiana als punts crítics"
            objectiu: |
              Calcular la matriu hessiana en un punt crític genèric, el seu determinant i la seva traça.
            idea: |
              Expressar les derivades segones en termes de $s=\sin(x+y)$ i $c=\cos(x-y)$, que als punts crítics valen $\pm1$.
            detall: |
              $f_{xx}=f_{yy}=-\sin(x+y)-\cos(x-y)=-s-c$, $f_{xy}=-\sin(x+y)+\cos(x-y)=c-s$. Als punts crítics $s=(-1)^k$, $c=(-1)^m$.
              $\det Hf=(s+c)^2-(c-s)^2=4sc$, $\ \mathrm{tr}\,Hf=-2(s+c)$.
            fuites: ['=\s*4\s*s\s*c', '\(\s*s\s*\+\s*c\s*\)\^\{?2\}?\s*-\s*\(\s*c\s*-\s*s\s*\)']
            teoria: ["T5.32"]
          - id: classificar
            titol: "Classificar"
            objectiu: |
              Classificar cada punt crític segons els valors de $k$ i $m$.
            idea: |
              En dues variables, el signe del determinant i de la traça decideixen el signe de la forma quadràtica; aplicar les condicions suficients de segon ordre.
            detall: |
              Si $s=c=1$ ($k,m$ parells): $\det=4>0$, $\mathrm{tr}=-4<0$, definida negativa: màxim local estricte, $f=2$.
              Si $s=c=-1$ ($k,m$ senars): $\det=4$, $\mathrm{tr}=4$, definida positiva: mínim local estricte, $f=-2$.
              Si $sc=-1$: $\det=-4<0$, indefinida: punt de sella, $f=0$.
              Com que $-2\le f\le2$ a tot $\mathbb{R}^2$, els màxims i mínims són de fet absoluts.
            fuites: ['definida\s+negativa', 'punts?\s+de\s+sella', 'k\s*,\s*m\s+parells']
            teoria: ["T5.30", "T5.33"]
        errors_comuns:
          - id: perd_solucions
            descripcio: |
              Resol $\cos(x+y)=0$ i $\sin(x-y)=0$ només en un període (per exemple només $(\frac{\pi}{4},\frac{\pi}{4})$) i oblida la periodicitat.
            pregunta: |
              Quines són totes les solucions de $\cos u=0$ a $\mathbb{R}$? I de $\sin v=0$?
          - id: punts_malament
            descripcio: |
              Passa de $(x+y,x-y)$ a $(x,y)$ amb índexs independents per a $x$ i $y$, obtenint punts que no són crítics.
            pregunta: |
              Si $x+y$ i $x-y$ estan determinats, com recuperes $x$ i $y$? Qualsevol parella de múltiples de $\frac{\pi}{2}$ serveix?
          - id: signe_hessiana
            descripcio: |
              Classifica amb un sol element diagonal sense mirar el determinant, o s'equivoca de signe en $f_{xy}$.
            pregunta: |
              El signe d'un element de la diagonal és suficient per decidir si la forma quadràtica és definida?
        nota_professor: |
          Amb el canvi lineal $u=x+y$, $v=x-y$, $f=\sin u+\cos v$, i la classificació és immediata: màxim quan $\sin u=\cos v=1$, mínim quan $\sin u=\cos v=-1$, sella si no.

      - id: "t6-10b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          Calculeu els extrems absoluts de $f$ en el quadrat $[\pi/2,\pi]\times[\pi/2,\pi]$.
        teoria: ["T1.24"]
        teoria_reservada: []
        resultat:
          valor: |
            Màxim absolut $1$, assolit en $\left(\frac{\pi}{2},\frac{\pi}{2}\right)$ i en $(\pi,\pi)$.
            Mínim absolut $-1$, assolit en $\left(\frac{\pi}{2},\pi\right)$ i en $\left(\pi,\frac{\pi}{2}\right)$.
          fuites: ['m[àa]xim\s+(absolut\s+)?(és|val|=)\s*\$?\s*1\b', 'm[íi]nim\s+(absolut\s+)?(és|val|=)\s*\$?\s*-\s*1\b']
        passos:
          - id: interior
            titol: "Punts crítics a l'interior"
            objectiu: |
              Usant l'apartat (a), trobar els punts crítics de $f$ a l'interior del quadrat i el valor de $f$ en ells.
            idea: |
              Mirar quins valors poden prendre $x+y$ i $x-y$ dins el quadrat i quins punts crítics de (a) hi cauen.
            detall: |
              Al quadrat, $x+y\in[\pi,2\pi]$ i $x-y\in[-\frac{\pi}{2},\frac{\pi}{2}]$. L'únic punt crític interior és $x+y=\frac{3\pi}{2}$, $x-y=0$: $\left(\frac{3\pi}{4},\frac{3\pi}{4}\right)$, un punt de sella amb $f=0$. Com que el quadrat és compacte, els extrems absoluts existeixen (Weierstrass) i han de ser a la frontera.
            fuites: ['\\[dt]?frac\s*\{?\s*3\s*\\pi\s*\}?\s*\{?\s*4', '3\s*\\pi\s*/\s*4']
            teoria: ["T5.23", "T2.23"]
          - id: costats
            titol: "Els quatre costats"
            objectiu: |
              Estudiar $f$ sobre cadascun dels quatre costats del quadrat.
            idea: |
              A cada costat una variable és constant: simplificar amb fórmules trigonomètriques i estudiar la monotonia de la funció d'una variable resultant.
            detall: |
              $x=\frac{\pi}{2}$: $f=\cos y+\sin y$, derivada $\cos y-\sin y<0$ a $(\frac{\pi}{2},\pi)$: decreix de $1$ a $-1$.
              $x=\pi$: $f=-\sin y-\cos y$: creix de $-1$ (a $y=\frac{\pi}{2}$) a $1$ (a $y=\pi$).
              $y=\frac{\pi}{2}$: $f=\cos x+\sin x$: decreix de $1$ a $-1$.
              $y=\pi$: $f=-\sin x-\cos x$: creix de $-1$ a $1$.
              Els extrems de cada costat són als vèrtexs: $f\left(\frac{\pi}{2},\frac{\pi}{2}\right)=f(\pi,\pi)=1$ i $f\left(\frac{\pi}{2},\pi\right)=f\left(\pi,\frac{\pi}{2}\right)=-1$.
            fuites: ['f\s*\(\s*\\pi\s*,\s*\\pi\s*\)\s*=\s*1', 'decreix\s+de\s+\$?1']
            teoria: ["T6.1"]
          - id: concloure
            titol: "Concloure"
            objectiu: |
              Donar el màxim i el mínim absoluts i on s'assoleixen.
            idea: |
              Comparar els valors de tots els candidats.
            detall: |
              Candidats: $0$ (punt de sella interior), $1$ i $-1$ als vèrtexs. Màxim absolut $1$ en $\left(\frac{\pi}{2},\frac{\pi}{2}\right)$ i $(\pi,\pi)$; mínim absolut $-1$ en $\left(\frac{\pi}{2},\pi\right)$ i $\left(\pi,\frac{\pi}{2}\right)$.
            fuites: []
            teoria: []
        errors_comuns:
          - id: critics_fora
            descripcio: |
              Pren com a candidats punts crítics de (a) que no són dins el quadrat, com $\left(\frac{\pi}{4},\frac{\pi}{4}\right)$.
            pregunta: |
              Quins valors pot prendre $x+y$ quan $x,y\in[\frac{\pi}{2},\pi]$?
          - id: sella_com_extrem
            descripcio: |
              Inclou el punt interior com a extrem, o creu que l'absència de màxims locals interiors vol dir que no hi ha màxim absolut.
            pregunta: |
              Un punt de sella pot ser extrem absolut? I on poden ser els extrems d'una funció contínua en un compacte si no són a l'interior?
          - id: un_sol_vertex
            descripcio: |
              Troba només un dels dos punts on s'assoleix cada extrem.
            pregunta: |
              Has avaluat $f$ als quatre vèrtexs?
        nota_professor: |
          Argument directe: amb $u=x+y\in[\pi,2\pi]$ i $v=x-y\in[-\frac{\pi}{2},\frac{\pi}{2}]$, $\sin u\le0$ i $0\le\cos v\le1$, així $-1\le f\le1$, amb igualtats exactament als vèrtexs indicats.

  - num: 11
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t6-11"
        apartat: null
        tipus: calcul
        enunciat: |
          Trobeu els extrems absoluts de la funció $f(x,y)=x^3-3xy^2$ sobre la circumferència de radi 1 centrada a l'origen (la superfície $z=f(x,y)$ s'anomena *cadira del mico*).
        teoria: ["T6.12"]
        teoria_reservada: []
        resultat:
          valor: |
            Màxim absolut $1$, assolit en $(1,0)$, $\left(-\frac12,\frac{\sqrt3}{2}\right)$ i $\left(-\frac12,-\frac{\sqrt3}{2}\right)$.
            Mínim absolut $-1$, assolit en $(-1,0)$, $\left(\frac12,\frac{\sqrt3}{2}\right)$ i $\left(\frac12,-\frac{\sqrt3}{2}\right)$.
          fuites: ['m[àa]xim\s+(absolut\s+)?(és|val|=)\s*\$?\s*1\b', 'm[íi]nim\s+(absolut\s+)?(és|val|=)\s*\$?\s*-\s*1\b', '(\\left)?\(\s*-\s*\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*2\s*\}?\s*,\s*(\\pm|-)?\s*\\[dt]?frac\s*\{?\s*\\sqrt', '(\\left)?\(\s*\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*2\s*\}?\s*,\s*(\\pm|-)?\s*\\[dt]?frac\s*\{?\s*\\sqrt']
        passos:
          - id: existencia_param
            titol: "Existència i parametrització"
            objectiu: |
              Justificar que hi ha extrems absoluts i reduir el problema a una variable.
            idea: |
              La circumferència és compacta. Parametritzar-la amb l'angle i simplificar $f$ amb fórmules trigonomètriques (angle triple).
            detall: |
              La circumferència és tancada i fitada i $f$ és contínua: hi ha extrems absoluts. Amb $(x,y)=(\cos t,\sin t)$, $t\in[0,2\pi]$:
              $f=\cos^3t-3\cos t\sin^2t=\cos3t$.
            fuites: ['\\cos\s*\(?\s*3\s*t']
            teoria: ["T1.34", "T2.23", "T6.1"]
          - id: extrems
            titol: "Extrems de la funció d'una variable"
            objectiu: |
              Trobar el màxim i el mínim de la funció d'una variable i els angles on s'assoleixen.
            idea: |
              Els valors extrems de la funció trigonomètrica obtinguda són coneguts; buscar tots els angles de $[0,2\pi)$ on s'assoleixen.
            detall: |
              $\cos3t=1\iff t\in\{0,\frac{2\pi}{3},\frac{4\pi}{3}\}$ i $\cos3t=-1\iff t\in\{\frac{\pi}{3},\pi,\frac{5\pi}{3}\}$.
            fuites: ['\\[dt]?frac\s*\{?\s*2\s*\\pi\s*\}?\s*\{?\s*3', '\\[dt]?frac\s*\{?\s*5\s*\\pi', '2\s*\\pi\s*/\s*3']
            teoria: []
          - id: punts
            titol: "Tornar als punts del pla"
            objectiu: |
              Escriure els punts de la circumferència on s'assoleixen els extrems.
            idea: |
              Substituir els angles a la parametrització.
            detall: |
              Màxim $1$ en $(1,0)$, $\left(-\frac12,\pm\frac{\sqrt3}{2}\right)$; mínim $-1$ en $(-1,0)$, $\left(\frac12,\pm\frac{\sqrt3}{2}\right)$.
            fuites: ['(\\left)?\(\s*-?\s*\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*2\s*\}?\s*,\s*(\\pm|-)?\s*\\[dt]?frac\s*\{?\s*\\sqrt']
            teoria: []
        errors_comuns:
          - id: nomes_eixos
            descripcio: |
              Troba només $(1,0)$ i $(-1,0)$ i oblida els altres quatre punts.
            pregunta: |
              Quantes vegades arriba al seu màxim la funció trigonomètrica que t'ha sortit quan $t$ recorre $[0,2\pi)$?
          - id: lagrange_casos
            descripcio: |
              Amb Lagrange, divideix per $x$ o per $y$ i perd solucions del sistema $3x^2-3y^2=2\lambda x$, $-6xy=2\lambda y$.
            pregunta: |
              A l'equació $-6xy=2\lambda y$, què passa si $y=0$? Has considerat aquest cas a part?
          - id: punts_critics_lliures
            descripcio: |
              Busca els punts crítics lliures de $f$ (només l'origen) i conclou que no hi ha extrems.
            pregunta: |
              L'origen és de la circumferència? Quin problema estàs resolent: extrems a $\mathbb{R}^2$ o sobre la corba?
        nota_professor: |
          Alternativa amb Lagrange: $3x^2-3y^2=2\lambda x$, $-6xy=2\lambda y$, $x^2+y^2=1$. Si $y=0$: $(\pm1,0)$. Si $y\neq0$: $\lambda=-3x$ i $3x^2-3y^2=-6x^2$, $y^2=3x^2$, $x=\pm\frac12$. En polars, $f=r^3\cos3\theta$: la cadira del mico té tres "valls" i tres "carenes".

  - num: 12
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t6-12"
        apartat: null
        tipus: teoric
        enunciat: |
          Considerem la funció $f(x,y,z)=x^4+y^2/4+z^2-x^2y-2z+1$ i el conjunt $M=\{(x,y,z)\in\mathbb{R}^3\mid2x^2+y^2+z^3-5xz-2=0\}$. Proveu que en el punt $p=(1,2,1)$ s'assoleix un mínim local de la restricció de $f$ a $M$. Es tracta d'un mínim absolut de la restricció de $f$ a $M$?
        teoria: ["T6.12", "T6.2"]
        teoria_reservada: []
        resultat:
          valor: |
            $p$ és un mínim local estricte de $f|_M$: $\nabla f(p)=\mathbf{0}$ (multiplicador $\lambda=0$) i la forma hessiana $q_{Hf(p)}$, que a $\mathbb{R}^3$ és només semidefinida positiva, és definida positiva sobre $T_M(p)=\{v_1-4v_2+2v_3=0\}$.
            Sí, és un mínim absolut: $f=\left(x^2-\frac y2\right)^2+(z-1)^2\ge0=f(p)$ a tot $\mathbb{R}^3$, i en particular a $M$.
          fuites: ['s[íi]\s*,?\s*(és|es\s+tracta\s+d.un)\s+(un\s+)?m[íi]nim\s+absolut', '\(\s*x\^\{?2\}?\s*-\s*(\\[dt]?frac\s*\{?\s*y|y\s*/\s*2)', 'f\s*(\\geq?|≥)\s*0', '\(\s*z\s*-\s*1\s*\)\^\{?2']
        passos:
          - id: varietat
            titol: "$M$ és varietat prop de $p$"
            objectiu: |
              Comprovar que $p\in M$ i que $M$ és una varietat diferenciable en un entorn de $p$.
            idea: |
              Calcular $\Phi(p)$ i el gradient de l'equació definidora $\Phi$ en $p$; si no s'anul·la, per continuïtat té rang màxim en un entorn.
            detall: |
              $\Phi(p)=2+4+1-5-2=0$. $\nabla\Phi=(4x-5z,\ 2y,\ 3z^2-5x)$, $\nabla\Phi(p)=(-1,4,-2)\neq0$. Per continuïtat $\nabla\Phi\neq0$ en un obert $G\ni p$, i $M\cap G$ és una 2-varietat $\mathcal{C}^\infty$.
            fuites: ['\(\s*-\s*1\s*,\s*4\s*,\s*-\s*2\s*\)']
            teoria: ["T6.2"]
          - id: lagrange
            titol: "Punt crític de la funció de Lagrange"
            objectiu: |
              Comprovar que $p$ satisfà la condició necessària de Lagrange i trobar el multiplicador.
            idea: |
              Calcular $\nabla f(p)$ i comparar-lo amb $\nabla\Phi(p)$.
            detall: |
              $\nabla f=(4x^3-2xy,\ \frac y2-x^2,\ 2z-2)$, $\nabla f(p)=(0,0,0)=0\cdot\nabla\Phi(p)$. Per tant $(p,\lambda)$ amb $\lambda=0$ és punt crític de $L=f-\lambda\Phi$, i $F=L(\cdot,0)=f$.
            fuites: ['\\lambda\s*=\s*0', '\\nabla\s*f\s*\(\s*p\s*\)\s*=\s*\(\s*0\s*,\s*0']
            teoria: ["T6.16", "T6.17"]
          - id: hessiana
            titol: "Hessiana de $F$"
            objectiu: |
              Calcular la matriu hessiana de la funció $F$ del criteri de segon ordre en $p$ i veure què diu el criteri lliure.
            idea: |
              Amb el multiplicador trobat, $F$ coincideix amb $f$. Calcular les derivades segones i mirar el signe de la forma a tot $\mathbb{R}^3$.
            detall: |
              $HF(p)=Hf(p)=\begin{pmatrix}8&-2&0\\-2&\frac12&0\\0&0&2\end{pmatrix}$. El menor $2\times2$ té determinant $4-4=0$: la forma és semidefinida positiva (s'anul·la en la direcció $(1,4,0)$), així que el criteri d'extrems lliures no decideix.
            fuites: ['pmatrix\}\s*8\s*&\s*-\s*2', '\(\s*1\s*,\s*4\s*,\s*0\s*\)']
            teoria: ["T5.32", "T5.33"]
          - id: tangent
            titol: "Restringir a l'espai tangent"
            objectiu: |
              Estudiar el signe de la forma quadràtica hessiana sobre $T_M(p)$ i concloure el caràcter local de $p$.
            idea: |
              L'espai tangent és el nucli de $D\Phi(p)$. Escriure la forma com a suma de quadrats i veure si pot anul·lar-se en un vector tangent no nul.
            detall: |
              $T_M(p)=\ker D\Phi(p)=\{v\mid -v_1+4v_2-2v_3=0\}$. $q(v)=8v_1^2-4v_1v_2+\frac12v_2^2+2v_3^2=\frac12(4v_1-v_2)^2+2v_3^2\ge0$, i $q(v)=0$ només si $v_3=0$, $v_2=4v_1$; llavors la condició tangent dona $-v_1+16v_1=0$, $v=0$. Per tant $q$ és definida positiva sobre $T_M(p)$ i, pel teorema de condicions suficients, $p$ és un mínim local estricte de $f|_M$.
            fuites: ['\(\s*4\s*v_\{?1\}?\s*-\s*v_\{?2\}?\s*\)\^\{?2\}?', 'definida\s+positiva\s+sobre']
            teoria: ["T6.10", "T6.19"]
          - id: absolut
            titol: "És mínim absolut?"
            objectiu: |
              Decidir si $p$ és un mínim absolut de $f|_M$.
            idea: |
              Calcular $f(p)$ i intentar reescriure $f$ completant quadrats (fixeu-vos en els termes $x^4$, $-x^2y$, $\frac{y^2}{4}$).
            detall: |
              $f(p)=1+1+1-2-2+1=0$ i $f=\left(x^2-\frac y2\right)^2+(z-1)^2\ge0$ a tot $\mathbb{R}^3$. Per tant $f(q)\ge f(p)$ per a tot $q\in M$: sí, és un mínim absolut de $f|_M$.
            fuites: ['\(\s*x\^\{?2\}?\s*-\s*(\\[dt]?frac\s*\{?\s*y|y\s*/\s*2)', 'f\s*(\\geq?|≥)\s*0', '\(\s*z\s*-\s*1\s*\)\^\{?2']
            teoria: []
        errors_comuns:
          - id: criteri_lliure
            descripcio: |
              Usa la hessiana a tot $\mathbb{R}^3$, veu que és semidefinida i conclou que no es pot decidir (o que no és mínim).
            pregunta: |
              En extrems condicionats, en quin conjunt de vectors cal estudiar el signe de la forma hessiana?
          - id: tangent_malament
            descripcio: |
              Pren com a espai tangent el generat per $\nabla\Phi(p)$ en lloc del seu ortogonal.
            pregunta: |
              El gradient de $\Phi$ és tangent o normal a $M$? Quina dimensió ha de tenir $T_M(p)$?
          - id: oblida_varietat
            descripcio: |
              No comprova que $p\in M$ ni que $\nabla\Phi(p)\neq0$, condicions necessàries per aplicar els teoremes.
            pregunta: |
              Quines hipòtesis sobre $\Phi$ demanen els teoremes de Lagrange i de condicions suficients, i es compleixen en $p$?
          - id: local_implica_absolut
            descripcio: |
              Afirma que és absolut perquè és l'únic punt crític trobat, o que no ho és perquè $M$ no és compacte, sense cap argument.
            pregunta: |
              Saps calcular el valor de $f$ en $p$? Hi ha alguna manera de comparar-lo amb el valor de $f$ en qualsevol altre punt?
        nota_professor: |
          Observació: $p$ és un punt crític lliure de $f$, i el criteri lliure falla perquè $f$ té mínim (no estricte) a tota la corba $\{y=2x^2,\ z=1\}$. Aquesta corba talla $M$ transversalment a $p$, per això la restricció té mínim estricte. L'absolut es pot veure també sense haver fet la part local.

  - num: 13
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t6-13"
        apartat: null
        tipus: calcul
        enunciat: |
          Calculeu el màxim volum d'un paral·lelepípede de cares paral·leles als plans coordenats, inscrit dins l'el·lipsoide d'equació $\frac{x^2}{a^2}+\frac{y^2}{b^2}+\frac{z^2}{c^2}=1$, amb $a,b,c\in\mathbb{R}^+$.
        teoria: ["T6.12"]
        teoria_reservada: []
        resultat:
          valor: |
            $V_{\max}=\dfrac{8abc}{3\sqrt3}=\dfrac{8\sqrt3}{9}abc$, per al paral·lelepípede de vèrtexs $\left(\pm\frac{a}{\sqrt3},\pm\frac{b}{\sqrt3},\pm\frac{c}{\sqrt3}\right)$.
          fuites: ['\\[dt]?frac\s*\{?\s*8\s*a\s*b\s*c\s*\}?\s*\{?\s*3\s*\\sqrt\s*\{?3', '\\[dt]?frac\s*\{?\s*8\s*\\sqrt\s*\{?3\}?\s*\}?\s*\{?\s*9', '8\s*a\s*b\s*c\s*/\s*\(?\s*3\s*\\sqrt', '\\[dt]?frac\s*\{?\s*a\s*\}?\s*\{?\s*\\sqrt\s*\{?3', 'a\s*/\s*\\sqrt\s*\{?3']
        passos:
          - id: plantejament
            titol: "Plantejar el problema"
            objectiu: |
              Escriure el volum com una funció a maximitzar sobre l'el·lipsoide i justificar que el màxim existeix.
            idea: |
              Per simetria, el paral·lelepípede està centrat a l'origen i queda determinat pel vèrtex del primer octant. Restringir-se a la part de l'el·lipsoide amb coordenades no negatives, que és compacta.
            detall: |
              Si els vuit vèrtexs són a l'el·lipsoide, dos vèrtexs que només difereixen en $x$ compleixen $x_1^2=x_2^2$, així que el paral·lelepípede és $[-x,x]\times[-y,y]\times[-z,z]$ i $V=8xyz$ amb $(x,y,z)$ a l'el·lipsoide, $x,y,z\ge0$. Aquest conjunt $S^+$ és compacte i $V$ és contínua: hi ha màxim. Com que $V=0$ quan alguna coordenada és $0$ i $V>0$ en altres punts, el màxim és en un punt amb $x,y,z>0$; com que aquests punts formen un obert de l'el·lipsoide, és un màxim local de $V$ condicionat a l'el·lipsoide, que és una 2-varietat ($\nabla\Phi=\left(\frac{2x}{a^2},\frac{2y}{b^2},\frac{2z}{c^2}\right)\neq0$ sobre ell).
            fuites: ['V\s*=\s*8\s*x\s*y\s*z']
            teoria: ["T1.34", "T2.23", "T6.2", "T6.12"]
          - id: lagrange
            titol: "Sistema de Lagrange"
            objectiu: |
              Escriure les equacions de Lagrange i obtenir una relació entre les coordenades.
            idea: |
              Multiplicar cada equació per la variable corresponent: els tres membres esquerres es tornen iguals.
            detall: |
              $8yz=\lambda\frac{2x}{a^2}$, $8xz=\lambda\frac{2y}{b^2}$, $8xy=\lambda\frac{2z}{c^2}$. Multiplicant per $x$, $y$, $z$ respectivament: $8xyz=2\lambda\frac{x^2}{a^2}=2\lambda\frac{y^2}{b^2}=2\lambda\frac{z^2}{c^2}$. Com que $xyz>0$, $\lambda\neq0$ i $\frac{x^2}{a^2}=\frac{y^2}{b^2}=\frac{z^2}{c^2}$.
            fuites: ['\\[dt]?frac\s*\{?\s*x\^\{?2\}?\s*\}?\s*\{?\s*a\^\{?2\}?\s*\}?\s*=\s*\\[dt]?frac\s*\{?\s*y\^\{?2\}?\s*\}?\s*\{?\s*b\^\{?2', 'x\^\{?2\}?\s*/\s*a\^\{?2\}?\s*=\s*y\^\{?2\}?\s*/\s*b']
            teoria: ["T6.17"]
          - id: resoldre
            titol: "Resoldre i calcular el volum"
            objectiu: |
              Trobar el vèrtex òptim i el volum màxim.
            idea: |
              Substituir la relació obtinguda a l'equació de l'el·lipsoide.
            detall: |
              Cada quocient val $\frac13$: $x=\frac{a}{\sqrt3}$, $y=\frac{b}{\sqrt3}$, $z=\frac{c}{\sqrt3}$. És l'únic candidat amb $x,y,z>0$, per tant és el màxim: $V=8\frac{abc}{3\sqrt3}=\frac{8abc}{3\sqrt3}=\frac{8\sqrt3}{9}abc$.
            fuites: ['\\[dt]?frac\s*\{?\s*a\s*\}?\s*\{?\s*\\sqrt\s*\{?3', 'a\s*/\s*\\sqrt\s*\{?3', '\\[dt]?frac\s*\{?\s*8\s*a\s*b\s*c\s*\}?\s*\{?\s*3\s*\\sqrt\s*\{?3']
            teoria: []
        errors_comuns:
          - id: volum_xyz
            descripcio: |
              Pren com a volum $xyz$ en lloc de $8xyz$ (confon el vèrtex amb les arestes).
            pregunta: |
              Si un vèrtex és $(x,y,z)$ i la caixa està centrada a l'origen, quant mesura cada aresta?
          - id: sense_existencia
            descripcio: |
              Troba el punt crític de Lagrange i afirma que és el màxim sense cap argument d'existència.
            pregunta: |
              Lagrange dona candidats. Per què ha d'existir un paral·lelepípede de volum màxim, i per què no pot ser un amb alguna aresta nul·la?
          - id: dividir_lambda
            descripcio: |
              Divideix les equacions sense justificar que $x,y,z,\lambda\neq0$.
            pregunta: |
              Abans de dividir per $x$ o per $\lambda$, què saps del signe de $x$, $y$, $z$ en el punt òptim?
        nota_professor: |
          Alternativa sense Lagrange: per la desigualtat entre mitjanes aritmètica i geomètrica, $\left(\frac{x^2}{a^2}\frac{y^2}{b^2}\frac{z^2}{c^2}\right)^{1/3}\le\frac13$, d'on $xyz\le\frac{abc}{3\sqrt3}$. Per a l'esfera ($a=b=c=R$) el màxim és el cub d'aresta $\frac{2R}{\sqrt3}$.

  - num: 14
    font: null
    preambul: ""
    indicacio: null
    exercicis:
      - id: "t6-14"
        apartat: null
        tipus: calcul
        enunciat: |
          Considerem el conjunt $D=\{(x,y)\in\mathbb{R}^2\mid x^2+y^2-2x\leqslant0,\ x\geqslant1\}$ i la funció $f\colon\mathbb{R}^2\to\mathbb{R}$ definida per $f(x,y)=x^4+x^2y^2+2xy^2+12y^2$. Trobeu, si existeixen, els punts de $D$ on $f$ assoleix valors màxim i mínim.
        teoria: ["T1.24"]
        teoria_reservada: []
        resultat:
          valor: |
            Existeixen (D és compacte). Mínim $1$, assolit només en $(1,0)$. Màxim $18$, assolit en $\left(\frac32,\frac{\sqrt3}{2}\right)$ i $\left(\frac32,-\frac{\sqrt3}{2}\right)$.
          fuites: ['m[àa]xim\s+(absolut\s+)?(és|val|=|\$)?\s*\$?\s*18', 'm[íi]nim\s+(absolut\s+)?(és|val|=|\$)?\s*\$?\s*1\b', '(\\left)?\(\s*\\[dt]?frac\s*\{?\s*3\s*\}?\s*\{?\s*2\s*\}?\s*,\s*(\\pm|-)?\s*\\[dt]?frac\s*\{?\s*\\sqrt\s*\{?\s*3']
        passos:
          - id: recinte
            titol: "El recinte"
            objectiu: |
              Descriure $D$ i justificar l'existència d'extrems.
            idea: |
              Completar quadrats a la primera desigualtat; un conjunt definit per desigualtats no estrictes de funcions contínues és tancat.
            detall: |
              $x^2+y^2-2x\le0\iff(x-1)^2+y^2\le1$: $D$ és el semidisc dret del disc de centre $(1,0)$ i radi $1$, amb $x\in[1,2]$. És tancat i fitat, per tant compacte, i $f$ és contínua: pel teorema de Weierstrass hi ha màxim i mínim.
            fuites: []
            teoria: ["T2.18", "T1.34", "T2.23"]
          - id: interior
            titol: "Punts crítics interiors"
            objectiu: |
              Trobar els punts crítics de $f$ a l'interior de $D$.
            idea: |
              Factoritzar $f_y$; usar la informació que en surt a $f_x=0$.
            detall: |
              $f_y=2y(x^2+2x+12)$, i $x^2+2x+12>0$, per tant $y=0$; llavors $f_x=4x^3+2xy^2+2y^2=4x^3=0$ dona $x=0\notin D$. No hi ha punts crítics a $D$.
            fuites: ['f_y\s*=\s*2\s*y\s*\(\s*x\^\{?2\}?\s*\+\s*2\s*x\s*\+\s*12']
            teoria: ["T5.23"]
          - id: minim
            titol: "El mínim"
            objectiu: |
              Trobar el mínim de $f$ a $D$.
            idea: |
              Agrupar els termes amb $y^2$ i observar el signe del seu coeficient a $D$.
            detall: |
              $f=x^4+y^2(x^2+2x+12)\ge x^4\ge1$ a $D$ (on $x\ge1$), amb igualtat només si $y=0$ i $x=1$. Mínim $f(1,0)=1$.
            fuites: ['f\s*\(\s*1\s*,\s*0\s*\)\s*=\s*1', 'y\^\{?2\}?\s*\(\s*x\^\{?2\}?\s*\+\s*2\s*x\s*\+\s*12\s*\)']
            teoria: []
          - id: frontera
            titol: "La frontera"
            objectiu: |
              Estudiar $f$ sobre el segment $x=1$ i sobre l'arc de circumferència.
            idea: |
              Sobre l'arc, substituir $y^2$ en funció de $x$ (només hi apareix $y^2$) i estudiar una funció d'una variable a $[1,2]$.
            detall: |
              Segment $x=1$, $y\in[-1,1]$: $f=1+15y^2$, entre $1$ i $16$.
              Arc $y^2=2x-x^2$, $x\in[1,2]$: $f=x^4+(2x-x^2)(x^2+2x+12)=-8x^2+24x$. Derivada $-16x+24=0$ a $x=\frac32$, valor $18$; als extrems, $16$ (en $(1,\pm1)$) i $16$ (en $(2,0)$). Per $x=\frac32$, $y^2=\frac34$.
            fuites: ['-\s*8\s*x\^\{?2\}?\s*\+\s*24\s*x', 'y\^\{?2\}?\s*=\s*\\[dt]?frac\s*\{?\s*3\s*\}?\s*\{?\s*4', 'x\s*=\s*\\[dt]?frac\s*\{?\s*3\s*\}?\s*\{?\s*2']
            teoria: ["T6.1"]
          - id: concloure
            titol: "Concloure"
            objectiu: |
              Donar els punts de màxim i de mínim.
            idea: |
              Comparar tots els valors.
            detall: |
              Mínim $1$ en $(1,0)$; màxim $18$ en $\left(\frac32,\pm\frac{\sqrt3}{2}\right)$.
            fuites: ['(\\left)?\(\s*\\[dt]?frac\s*\{?\s*3\s*\}?\s*\{?\s*2\s*\}?\s*,\s*(\\pm|-)?\s*\\[dt]?frac\s*\{?\s*\\sqrt\s*\{?\s*3']
            teoria: []
        errors_comuns:
          - id: disc_sencer
            descripcio: |
              Treballa amb tot el disc oblidant la condició $x\ge1$, o confon el centre del disc.
            pregunta: |
              Quina part del disc queda després d'imposar $x\ge1$? Quin és el centre del disc?
          - id: substitucio_arrel
            descripcio: |
              Aïlla $y=\sqrt{2x-x^2}$ i oblida la meitat inferior de l'arc, perdent un dels punts de màxim.
            pregunta: |
              La funció depèn del signe de $y$? Quants punts de l'arc corresponen a cada $x$?
          - id: oblida_segment
            descripcio: |
              Estudia només l'arc i oblida el segment $x=1$ (o al revés).
            pregunta: |
              De quines corbes està formada la frontera de $D$?
        nota_professor: |
          Com que per a $x$ fix $f$ és creixent en $y^2$, el màxim és necessàriament sobre l'arc; el segment només aporta el mínim $(1,0)$ i valors $\le16$. També es pot fer l'arc amb Lagrange: $\nabla f=\lambda(2x-2,2y)$.

  - num: 15
    font: null
    preambul: |
      Considerem la funció donada per $f(x,y,z)=(x+1)^2+(y-1)^2+2z$ i el conjunt $A=\{(x,y,z)\in\mathbb{R}^3\mid z\geqslant x^2+y^2,\ z\leqslant2y-2x+1\}$.
    indicacio: null
    exercicis:
      - id: "t6-15a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          Demostreu que el conjunt $A$ és tancat.
        teoria: ["T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $A=\{g_1\ge0\}\cap\{g_2\ge0\}$ amb $g_1=z-x^2-y^2$ i $g_2=2y-2x+1-z$ contínues; cada conjunt és tancat (antiimatge d'un tancat per una funció contínua) i la intersecció de tancats és tancada. Per tant $A$ és tancat.
          fuites: []
        passos:
          - id: escriure
            titol: "Escriure $A$ amb funcions contínues"
            objectiu: |
              Escriure $A$ com a intersecció de conjunts definits cadascun per una sola desigualtat.
            idea: |
              Passar-ho tot a un costat de cada desigualtat i identificar les funcions que hi apareixen.
            detall: |
              $A=A_1\cap A_2$ amb $A_1=\{g_1(x,y,z)\ge0\}$, $g_1=z-x^2-y^2$, i $A_2=\{g_2(x,y,z)\ge0\}$, $g_2=2y-2x+1-z$. Les dues funcions són polinòmiques, per tant contínues a $\mathbb{R}^3$.
            fuites: []
            teoria: []
          - id: tancat
            titol: "Concloure"
            objectiu: |
              Deduir que $A$ és tancat.
            idea: |
              Usar el resultat sobre conjunts definits per desigualtats no estrictes de funcions contínues, i com es comporten els tancats per interseccions.
            detall: |
              $A_i=g_i^{-1}([0,+\infty))$ és l'antiimatge d'un tancat de $\mathbb{R}$ per una funció contínua, per tant és tancat. La intersecció de tancats és tancada: $A$ és tancat.
            fuites: []
            teoria: ["T2.18", "T2.17", "T1.13"]
        errors_comuns:
          - id: sense_continuitat
            descripcio: |
              Diu que és tancat "perquè està definit amb $\le$" sense esmentar la continuïtat de les funcions.
            pregunta: |
              Un conjunt $\{h\ge0\}$ és sempre tancat, sigui quina sigui $h$? Què li has de demanar a $h$?
          - id: tancat_compacte
            descripcio: |
              Confon tancat amb compacte, o intenta demostrar-ho calculant la frontera.
            pregunta: |
              Què et demana l'enunciat exactament, i quin resultat dels apunts relaciona desigualtats i conjunts tancats?
        nota_professor: |
          Es pot fer també amb successions: si $(x_n,y_n,z_n)\in A$ convergeix, les desigualtats passen al límit per continuïtat.

      - id: "t6-15b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          Justifiqueu l'existència d'extrems absoluts de $f$ en $A$ i calculeu-los.
        teoria: ["T1.24"]
        teoria_reservada: []
        resultat:
          valor: |
            Existeixen perquè $A$ és compacte (tancat per (a) i fitat) i $f$ és contínua.
            Mínim absolut $\frac43$, en $\left(-\frac13,\frac13,\frac29\right)$.
            Màxim absolut $13+4\sqrt6$, en $\left(-1-\frac{\sqrt6}{2},\ 1+\frac{\sqrt6}{2},\ 5+2\sqrt6\right)$.
          fuites: ['13\s*\+\s*4\s*\\sqrt\{?6', 'm[íi]nim\s+(absolut\s+)?(és|val|=)\s*\$?\s*(\\[dt]?frac\s*\{?\s*4\s*\}?\s*\{?\s*3|4\s*/\s*3)', '\(\s*-\s*\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*3\s*\}?\s*,\s*\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*3\s*\}?\s*,\s*\\[dt]?frac\s*\{?\s*2']
        passos:
          - id: existencia
            titol: "Existència"
            objectiu: |
              Usant l'apartat (a), justificar que $f$ té extrems absoluts a $A$.
            idea: |
              Falta veure que $A$ és fitat: combinar les dues desigualtats per eliminar $z$ i obtenir una fita per a $(x,y)$, i després per a $z$.
            detall: |
              De $x^2+y^2\le z\le2y-2x+1$ surt $x^2+2x+y^2-2y\le1$, és a dir, $(x+1)^2+(y-1)^2\le3$: $(x,y)$ és al disc $\Delta$ de centre $(-1,1)$ i radi $\sqrt3$. Llavors $0\le z\le2y-2x+1$, que és fitat sobre $\Delta$. $A$ és tancat i fitat, per tant compacte (i no buit: $(0,0,0)\in A$); $f$ és contínua, i per Weierstrass hi ha extrems absoluts.
            fuites: ['\(\s*x\s*\+\s*1\s*\)\^\{?2\}?\s*\+\s*\(\s*y\s*-\s*1\s*\)\^\{?2\}?\s*(\\le|\\leq|≤)\s*3']
            teoria: ["T1.34", "T2.23"]
          - id: interior
            titol: "Interior"
            objectiu: |
              Decidir si hi pot haver extrems a l'interior de $A$.
            idea: |
              A l'interior (obert) un extrem hauria de ser punt crític de $f$.
            detall: |
              $\nabla f=(2(x+1),\ 2(y-1),\ 2)\neq0$: no hi ha punts crítics, i els extrems són a la frontera (al paraboloide $z=x^2+y^2$ o al pla $z=2y-2x+1$).
            fuites: []
            teoria: ["T5.23"]
          - id: reduir
            titol: "Reduir a dues variables"
            objectiu: |
              Per a cada $(x,y)$ fix, decidir a quin $z$ de $A$ la funció és mínima i a quin és màxima, i reduir el problema a funcions de $(x,y)$ sobre un disc.
            idea: |
              $f$ depèn de $z$ de manera creixent. (Alternativament: estudiar cada tros de frontera amb Lagrange, inclosa la corba intersecció.)
            detall: |
              Com que $f$ és creixent en $z$, per a $(x,y)\in\Delta$ el mínim és al paraboloide i el màxim al pla:
              $\min_A f=\min_\Delta g$, $g=f(x,y,x^2+y^2)=3x^2+2x+3y^2-2y+2$;
              $\max_A f=\max_\Delta h$, $h=f(x,y,2y-2x+1)=(x-1)^2+(y+1)^2+2$.
            fuites: ['3\s*x\^\{?2\}?\s*\+\s*2\s*x', '\(\s*x\s*-\s*1\s*\)\^\{?2\}?\s*\+\s*\(\s*y\s*\+\s*1\s*\)\^\{?2\}?']
            teoria: []
          - id: minim
            titol: "El mínim"
            objectiu: |
              Trobar el mínim absolut de $f$ a $A$ i on s'assoleix.
            idea: |
              Completar quadrats a la funció de dues variables obtinguda i comprovar que el punt on s'anul·len els quadrats és del disc.
            detall: |
              $g=3\left(x+\frac13\right)^2+3\left(y-\frac13\right)^2+\frac43$, mínim $\frac43$ en $\left(-\frac13,\frac13\right)$, que és de $\Delta$ ($\frac49+\frac49\le3$). El punt de $A$ és $\left(-\frac13,\frac13,\frac29\right)$, amb $f=\frac49+\frac49+\frac49=\frac43$.
            fuites: ['\(\s*-\s*\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*3\s*\}?\s*,\s*\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*3', '\\[dt]?frac\s*\{?\s*4\s*\}?\s*\{?\s*3\b']
            teoria: []
          - id: maxim
            titol: "El màxim"
            objectiu: |
              Trobar el màxim absolut de $f$ a $A$ i on s'assoleix.
            idea: |
              La funció de dues variables per al màxim és una distància al quadrat a un punt fix (més una constant): el seu màxim sobre el disc és al punt del disc més allunyat d'aquest punt fix.
            detall: |
              $h-2$ és el quadrat de la distància a $(1,-1)$. La distància de $(1,-1)$ al centre $(-1,1)$ és $2\sqrt2$, i el punt més llunyà del disc és $(-1,1)+\sqrt3\frac{(-1,1)}{\sqrt2}=\left(-1-\frac{\sqrt6}{2},1+\frac{\sqrt6}{2}\right)$, a distància $2\sqrt2+\sqrt3$. Màxim: $(2\sqrt2+\sqrt3)^2+2=13+4\sqrt6$, amb $z=2y-2x+1=5+2\sqrt6$ (que també és $x^2+y^2$: el punt és a la corba intersecció).
            fuites: ['13\s*\+\s*4\s*\\sqrt\{?6', '2\s*\\sqrt\{?2\}?\s*\+\s*\\sqrt\{?3', '1\s*\+\s*\\[dt]?frac\s*\{?\s*\\sqrt\s*\{?6']
            teoria: []
        errors_comuns:
          - id: no_fitat
            descripcio: |
              Afirma que $A$ és compacte sense demostrar que és fitat (o creu que un paraboloide sempre dona un conjunt no fitat).
            pregunta: |
              Tancat no és suficient per a compacte. Combinant les dues desigualtats, què pots dir de $x$ i $y$?
          - id: oblida_corba
            descripcio: |
              Estudiant trossos de frontera per separat, oblida la corba intersecció del paraboloide i el pla, on hi ha el màxim.
            pregunta: |
              Els trossos de frontera que has estudiat, inclouen la seva pròpia vora? On es troben les dues superfícies?
          - id: critic_fora
            descripcio: |
              Al pla, troba el punt crític $(1,-1)$ de la funció restringida i el pren com a candidat sense comprovar que és fora del disc.
            pregunta: |
              El punt que t'ha sortit, compleix les dues desigualtats que defineixen $A$?
        nota_professor: |
          Resolució estàndard alternativa: interior sense punts crítics; paraboloide $z=x^2+y^2$ (substituint) amb candidat $\left(-\frac13,\frac13,\frac29\right)$; pla (substituint) sense candidats interiors, ja que $(1,-1)$ és fora de $\Delta$; corba intersecció $(x+1)^2+(y-1)^2=3$ on $f=13-4(u-v)$ amb $u=x+1$, $v=y-1$, d'extrems $13\pm4\sqrt6$. El mínim sobre la corba, $13-4\sqrt6\approx3.2$, no guanya.
