[project]
name = "tutor-calcul-diferencial"
version = "0.1.0"
description = "Socratic tutor for Càlcul Diferencial (FME-UPC)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.9",
    "openai>=1.60",
    "google-genai>=1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1",
    "pyyaml>=6",
    "httpx>=0.27",
    "sympy>=1.13",
    "lark>=1.2",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest-timeout>=2.4.0",
    "poethepoet>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# backend/ is the import root: `core`, `apps` and `settings` are importable from scripts, tests and the server.
packages = ["backend/core", "backend/apps", "backend/settings"]

# Dev tasks: `uv run poe <task>` (`uv run poe` lists them). Extra arguments go to the command, e.g. `poe test -k quiz`.
[tool.poe.tasks]
run = { cmd = "uvicorn apps.tutor_api.server:app --reload --port 8000", help = "Serve the app at http://127.0.0.1:8000" }
test = { cmd = "pytest -q", help = "Run the test suite" }
types = { cmd = "pyright", help = "Type-check" }
schema = { cmd = "python scripts/db.py schema --write", help = "Regenerate supabase/schema.sql from the SQLModel tables" }

[tool.poe.tasks.lint]
help = "Lint and check formatting"
sequence = [{ cmd = "ruff check backend scripts" }, { cmd = "ruff format --check backend scripts" }]

[tool.poe.tasks.format]
help = "Sort imports and format"
sequence = [{ cmd = "ruff check --select I --fix backend scripts" }, { cmd = "ruff format backend scripts" }]

[tool.poe.tasks.check]
help = "Lint, type-check and test"
sequence = ["lint", "types", "test"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# pytest-timeout: a check hung in-process (sympy in a hard limit) fails its test instead of holding CI for hours.
timeout = 300

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108"]
unfixable = ["F401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pyright]
include = ["backend/core", "backend/apps", "backend/settings", "scripts"]
extraPaths = ["backend"]
venvPath = "."
venv = ".venv"
# sympy's stubs are too imprecise to type-check the CAS code (Basic vs Expr vs Relational on every operation).
ignore = ["backend/core/shared/math"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportMissingTypeArgument = "error"
