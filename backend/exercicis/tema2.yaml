      - T2.10
    - id: acotar
      titol: Acotar el quocient
      objectiu: |
        Trobar una fita del mòdul del quocient que tendeixi a $0$.
      idea: |
        Comparar el denominador amb un dels seus sumands (tots dos són no negatius) per fitar el quocient per dalt.
      detall: |
        $\frac{|x|^5}{x^4+y^2}\le\frac{|x|^5}{x^4}=|x|$ (per $x\neq 0$; si $x=0$ i $y\neq0$ la funció val $0$).
      fuites:
      - (\\le|\\leq|≤|=)\s*\|x\|
      - x\^\{?4\}?\s*(\\le|\\leq|≤)\s*x\^\{?4\}?\s*\+\s*y\^\{?2\}?
      teoria: []
    - id: concloure
      titol: Concloure amb el sandvitx
      objectiu: |
        Deduir el valor del límit a partir de la fita.
      idea: |
        Si $|f|\le g$ amb $g\to 0$, la definició $\epsilon$-$\delta$ de límit es compleix directament.
      detall: |
        $0\le|f(x,y)|\le|x|\le\|(x,y)\|$; donat $\epsilon>0$ n'hi ha prou amb $\delta=\epsilon$. El límit és $0$.
