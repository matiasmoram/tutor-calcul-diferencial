      detall: |
        $f_{xx}=2$, $f_{xy}=2y$, $f_{yy}=2x+12y^2$; $Hf(0,0)=\begin{pmatrix}2&0\\0&0\end{pmatrix}$, semidefinida positiva amb un valor propi nul: el criteri no decideix (només descarta que sigui màxim).
