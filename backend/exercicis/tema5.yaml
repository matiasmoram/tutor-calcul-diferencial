    errors_comuns:
    - id: degenerat_no_decideix
      descripcio: |
        Com que $\det Hf=0$, diu que el criteri no decideix.
      pregunta: |
        El teorema de condicions suficients demana que la hessiana sigui no degenerada per al cas indefinit? Què demana exactament?
    - id: z_minim
      descripcio: |
        Com que $(z-1)^4\ge0$ conclou que és mínim.
      pregunta: |
        Què fa $f$ si et mous només en la direcció de $y$?
