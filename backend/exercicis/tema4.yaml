      detall: |
        $F$ és diferenciable en $a$ i $G$ en $F(a)=b$, punts interiors; per la regla de la cadena $G\circ F$ és diferenciable en $a$ i $JG(b)\,JF(a)=J(\mathrm{Id})(a)=I_m$.
      fuites:
