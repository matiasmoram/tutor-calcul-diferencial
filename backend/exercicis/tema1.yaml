# Tema 1: generat per scripts/merge_fitxes.py a partir de work/fitxes/tema1_p*.yaml
llista:
  id: tema-1
  etiqueta: Tema 1
  titol: Topologia a $\mathbb{R}^n$
  descripcio: Problemes del Tema 1 de la col·lecció de Càlcul Diferencial (FME-UPC).
  tema: 1
  tipus: mixt
  format: text
problemes:
- num: 1
  font: null
  preambul: |
    Demostreu que a $\mathbb{R}^n$ les aplicacions $d_k$ són distàncies i, per tant, $(\mathbb{R}^n, d_k)$ són espais mètrics:
  indicacio: null
  exercicis:
  - id: t1-1a
    apartat: a
    tipus: teoric
    enunciat: |
      $d_2(x,y)=\sqrt{\displaystyle\sum_{i=1}^{n}(x_i-y_i)^2}$.
    teoria:
    - T1.5
    teoria_reservada: []
    resultat:
      valor: |
        $d_2$ és una distància a $\mathbb{R}^n$: és no negativa i només s'anul·la si $x=y$, és simètrica i compleix la desigualtat triangular (aquesta última gràcies a la desigualtat de Cauchy-Schwarz per al producte escalar ordinari $\sum_i u_iv_i$).
      fuites: []
    passos:
    - id: positivitat
      titol: Positivitat
      objectiu: |
        Comprovar que $d_2(x,y)\geq 0$ i que $d_2(x,y)=0$ si i només si $x=y$.
      idea: |
        Mirar el signe de cada sumand dins l'arrel i quan una suma de termes no negatius pot valer zero.
      detall: |
        L'arrel quadrada positiva d'un nombre $\geq 0$ és $\geq 0$, així que $d_2(x,y)\geq 0$. Si $d_2(x,y)=0$, aleshores $\sum_{i=1}^n (x_i-y_i)^2=0$; com que cada sumand és $\geq 0$, tots són nuls, és a dir $x_i=y_i$ per a tot $i$, i per tant $x=y$. Recíprocament, si $x=y$ tots els sumands són $0$.
      fuites: []
      teoria:
      - T1.5
    - id: simetria
      titol: Simetria
      objectiu: |
        Comprovar que $d_2(x,y)=d_2(y,x)$.
      idea: |
        Comparar terme a terme els sumands de les dues expressions.
      detall: |
        $(x_i-y_i)^2=(y_i-x_i)^2$ per a cada $i$, per tant les dues sumes, i les seves arrels, coincideixen.
      fuites: []
      teoria:
      - T1.5
    - id: reduir_triangular
      titol: Reduir la desigualtat triangular
      objectiu: |
        Reescriure la desigualtat triangular $d_2(x,y)\leq d_2(x,z)+d_2(z,y)$ com una desigualtat més simple sobre sumes.
      idea: |
        Anomenar $u=x-z$, $v=z-y$ (de manera que $u+v=x-y$), observar que els dos costats són no negatius i elevar al quadrat per treure les arrels.
      detall: |
        Amb $u=x-z$, $v=z-y$ cal veure $\sqrt{\sum_i(u_i+v_i)^2}\leq\sqrt{\sum_i u_i^2}+\sqrt{\sum_i v_i^2}$. Com que els dos costats són $\geq 0$, equival a la desigualtat dels quadrats:
        $\sum_i u_i^2+2\sum_i u_iv_i+\sum_i v_i^2\leq\sum_i u_i^2+2\sqrt{\sum_i u_i^2}\sqrt{\sum_i v_i^2}+\sum_i v_i^2$,
        és a dir, a $\sum_i u_iv_i\leq\sqrt{\sum_i u_i^2}\,\sqrt{\sum_i v_i^2}$.
      fuites:
      - \\sum[_^{}=\w\s]*?u_i\s*(\\,)?\s*v_i\s*(\\leq?(slant)?|≤|<=)
      teoria:
      - T1.6+dem
    - id: cauchy_schwarz
      titol: Aplicar Cauchy-Schwarz
      objectiu: |
        Justificar la desigualtat entre sumes obtinguda al pas anterior.
      idea: |
        Reconèixer $\sum_i u_iv_i$ com el producte escalar ordinari de $\mathbb{R}^n$ i les arrels com les normes associades; aplicar el resultat del curs que fita el producte escalar per les normes.
      detall: |
        Amb $\langle u,v\rangle=\sum_i u_iv_i$ (producte escalar ordinari) i $\|u\|=\sqrt{\langle u,u\rangle}$, Cauchy-Schwarz dona $\sum_i u_iv_i\leq|\langle u,v\rangle|\leq\|u\|\,\|v\|=\sqrt{\sum_i u_i^2}\sqrt{\sum_i v_i^2}$. Desfent el canvi, $d_2(x,y)\leq d_2(x,z)+d_2(z,y)$.
      fuites: []
      teoria:
      - T1.7
      - T1.8
    errors_comuns:
    - id: quadrat_no_triangular
      descripcio: |
        Demostra la desigualtat triangular per a $d_2^2$ (sense arrels) o eleva al quadrat i "simplifica" de manera que acaba provant una desigualtat diferent de la que cal.
      pregunta: |
        La desigualtat que has provat, és la de $d_2$ o la de $d_2^2$? Elevar al quadrat $a\leq b+c$, quina expressió dona exactament a la dreta?
    - id: arrel_suma
      descripcio: |
        Usa $\sqrt{a+b}=\sqrt{a}+\sqrt{b}$ (fals) per separar l'arrel en sumes de components.
      pregunta: |
        Prova amb $a=b=1$: és cert que $\sqrt{a+b}=\sqrt a+\sqrt b$?
    - id: suma_zero
      descripcio: |
        Afirma que de $\sum_i (x_i-y_i)^2=0$ se segueix $x=y$ sense justificar-ho (o amb un argument que també valdria per a sumes de termes de signe qualsevol).
      pregunta: |
        Una suma de nombres reals pot ser zero sense que ho siguin tots els sumands? Què tenen d'especial aquests sumands?
    nota_professor: |
      Via alternativa directa: $d_2(x,y)=\|x-y\|_2$ amb $\|\cdot\|_2$ la norma del producte escalar ordinari (Exemple 8 b), i la Proposició 6 (i)+(ii) dona que és una distància. Si el problema 3(a) ja està fet, n'hi ha prou amb la Proposició 6 (ii). La part delicada és la desigualtat triangular (desigualtat de Minkowski per a $p=2$).
  - id: t1-1b
    apartat: b
    tipus: teoric
    enunciat: |
      $d_1(x,y)=\displaystyle\sum_{i=1}^{n}|x_i-y_i|$.
    teoria:
    - T1.5
    teoria_reservada: []
    resultat:
      valor: |
        $d_1$ és una distància a $\mathbb{R}^n$: no negativa i nul·la només si $x=y$, simètrica, i la desigualtat triangular s'obté sumant les desigualtats triangulars de $\mathbb{R}$ component a component.
      fuites: []
    passos:
    - id: positivitat_simetria
      titol: Positivitat i simetria
      objectiu: |
        Comprovar que $d_1(x,y)\geq 0$, que $d_1(x,y)=0\iff x=y$ i que $d_1(x,y)=d_1(y,x)$.
      idea: |
        Analitzar cada sumand $|x_i-y_i|$: el seu signe, quan s'anul·la i com canvia en intercanviar $x$ i $y$.
      detall: |
        Cada $|x_i-y_i|\geq 0$, per tant la suma és $\geq 0$. Si la suma és $0$, tots els sumands (no negatius) són $0$, és a dir $x_i=y_i$ per a tot $i$, i $x=y$; el recíproc és immediat. A més $|x_i-y_i|=|y_i-x_i|$, d'on la simetria.
      fuites: []
      teoria:
      - T1.5
    - id: triangular
      titol: Desigualtat triangular
      objectiu: |
        Demostrar que $d_1(x,y)\leq d_1(x,z)+d_1(z,y)$ per a tot $x,y,z\in\mathbb{R}^n$.
      idea: |
        Treballar component a component amb la desigualtat triangular del valor absolut a $\mathbb{R}$, $|a+b|\leq|a|+|b|$, i després sumar.
      detall: |
        Per a cada $i$: $|x_i-y_i|=|(x_i-z_i)+(z_i-y_i)|\leq|x_i-z_i|+|z_i-y_i|$. Sumant per $i=1,\dots,n$: $d_1(x,y)\leq d_1(x,z)+d_1(z,y)$.
      fuites:
      - \|\s*\(x_i\s*-\s*z_i\)\s*\+\s*\(z_i\s*-\s*y_i\)\s*\|
      - \|\s*x_i\s*-\s*z_i\s*\|\s*\+\s*\|\s*z_i\s*-\s*y_i\s*\|
      teoria: []
    errors_comuns:
    - id: sense_component
      descripcio: |
        Escriu la desigualtat triangular "en bloc" sense justificar-la (per exemple, assumint ja que $d_1$ prové d'una norma, cosa que és el que es vol veure).
      pregunta: |
        Quina desigualtat coneguda tens per a nombres reals? Pots aplicar-la a cada sumand per separat?
    - id: valor_absolut_igualtat
      descripcio: |
        Usa $|a+b|=|a|+|b|$ com a igualtat.
      pregunta: |
        Quant val $|1+(-1)|$ i quant val $|1|+|-1|$?
    nota_professor: |
      Si el problema 3(b) ja està fet, $d_1(x,y)=\|x-y\|_1$ i la Proposició 6 (ii) acaba.
  - id: t1-1c
    apartat: c
    tipus: teoric
    enunciat: |
      $d_\infty(x,y)=\displaystyle\max_{1\leq i\leq n}|x_i-y_i|$.
    teoria:
    - T1.5
    teoria_reservada: []
    resultat:
      valor: |
        $d_\infty$ és una distància a $\mathbb{R}^n$: no negativa i nul·la només si $x=y$, simètrica, i compleix la desigualtat triangular perquè cada component $|x_i-y_i|$ queda fitada per $d_\infty(x,z)+d_\infty(z,y)$.
      fuites: []
    passos:
    - id: positivitat_simetria
      titol: Positivitat i simetria
      objectiu: |
        Comprovar que $d_\infty(x,y)\geq 0$, que $d_\infty(x,y)=0\iff x=y$ i que $d_\infty(x,y)=d_\infty(y,x)$.
      idea: |
        El màxim d'una família finita de nombres no negatius és no negatiu, i és zero exactament quan tots ho són.
      detall: |
        Cada $|x_i-y_i|\geq 0$, per tant el màxim és $\geq 0$. Si $\max_i|x_i-y_i|=0$, com que $0\leq|x_j-y_j|\leq\max_i|x_i-y_i|=0$ per a cada $j$, tenim $x_j=y_j$ per a tot $j$, i $x=y$; el recíproc és immediat. La simetria ve de $|x_i-y_i|=|y_i-x_i|$.
      fuites: []
      teoria:
      - T1.5
    - id: fita_component
      titol: Fitar cada component
      objectiu: |
        Fitar cada $|x_i-y_i|$ per una quantitat que no depengui de $i$.
      idea: |
        Desigualtat triangular del valor absolut a $\mathbb{R}$ i, després, que cada terme és com a màxim el màxim de la seva família.
      detall: |
        Per a cada $i$: $|x_i-y_i|\leq|x_i-z_i|+|z_i-y_i|\leq d_\infty(x,z)+d_\infty(z,y)$.
      fuites:
      - \|\s*(x_i\s*-\s*y_i|z_i\s*-\s*y_i)\s*\|\s*(\\leq?(slant)?|≤)\s*d_\{?\\infty\}?\s*\(\s*x\s*,\s*z\s*\)\s*\+\s*d_\{?\\infty\}?\s*\(\s*z\s*,\s*y\s*\)
      teoria: []
    - id: prendre_maxim
      titol: Prendre el màxim
      objectiu: |
        Passar de la fita per a cada component a la desigualtat triangular per a $d_\infty$.
      idea: |
        Si tots els elements d'una família finita estan fitats per una mateixa constant, el seu màxim també ho està.
      detall: |
        Com que la fita del pas anterior val per a tots els $i$, també val per al màxim: $d_\infty(x,y)=\max_i|x_i-y_i|\leq d_\infty(x,z)+d_\infty(z,y)$.
      fuites: []
      teoria:
      - T1.5
    errors_comuns:
    - id: max_suma
      descripcio: |
        Afirma $\max_i(a_i+b_i)=\max_i a_i+\max_i b_i$ (en general només és $\leq$).
      pregunta: |
        Amb $a=(1,0)$ i $b=(0,1)$, quant val $\max_i(a_i+b_i)$? I $\max_i a_i+\max_i b_i$?
    - id: index_fix
      descripcio: |
        Fixa l'índex $i_0$ on s'assoleix $d_\infty(x,y)$ i suposa que el mateix índex dona també el màxim de $|x_i-z_i|$ i de $|z_i-y_i|$.
      pregunta: |
        L'índex on s'assoleix el màxim de $|x_i-y_i|$ ha de ser el mateix on s'assoleix el màxim de $|x_i-z_i|$? Necessites que ho sigui?
    nota_professor: |
      Si el problema 3(c) ja està fet, $d_\infty(x,y)=\|x-y\|_\infty$ i la Proposició 6 (ii) acaba.
- num: 2
  font: null
  preambul: ''
  indicacio: null
  exercicis:
  - id: t1-2
    apartat: null
    tipus: teoric
    enunciat: |
      Demostreu que a $\mathbb{N}$ l'aplicació
      $$d(m,n)=\begin{cases}\dfrac{1}{m}+\dfrac{1}{n} & \text{si } m\neq n\\ 0 & \text{si } m=n\end{cases}$$
      és una distància i, per tant, $(\mathbb{N},d)$ és un espai mètric.
    teoria:
    - T1.5
    teoria_reservada: []
    resultat:
      valor: |
        $d$ és una distància a $\mathbb{N}=\{1,2,3,\dots\}$: és $\geq 0$ i nul·la només si $m=n$ (perquè $\frac1m+\frac1n>0$), és simètrica, i la desigualtat triangular $d(m,n)\leq d(m,k)+d(k,n)$ es comprova per casos (si $m=n$ és trivial; si $k=m$ o $k=n$ és una igualtat; si $k\neq m,n$ el costat dret val $\frac1m+\frac2k+\frac1n>\frac1m+\frac1n$).
      fuites: []
    passos:
    - id: positivitat
      titol: Positivitat
      objectiu: |
        Comprovar que $d(m,n)\geq 0$ i que $d(m,n)=0\iff m=n$.
      idea: |
        Mirar el signe de $\frac1m+\frac1n$ per a naturals $m,n$.
      detall: |
        Si $m=n$, $d=0$. Si $m\neq n$, $d(m,n)=\frac1m+\frac1n>0$ perquè $m,n\geq 1$. Per tant $d\geq 0$ i $d(m,n)=0\iff m=n$.
      fuites: []
      teoria:
      - T1.5
    - id: simetria
      titol: Simetria
      objectiu: |
        Comprovar que $d(m,n)=d(n,m)$.
      idea: |
        La condició $m\neq n$ i l'expressió de la fórmula són simètriques en $m$ i $n$.
      detall: |
        Si $m=n$ tots dos valen $0$; si $m\neq n$, $\frac1m+\frac1n=\frac1n+\frac1m$.
      fuites: []
      teoria:
      - T1.5
    - id: triangular_casos
      titol: Desigualtat triangular per casos
      objectiu: |
        Demostrar que $d(m,n)\leq d(m,k)+d(k,n)$ per a tots $m,n,k\in\mathbb{N}$.
      idea: |
        Com que la definició va per casos, separar segons quins dels tres naturals coincideixen.
      detall: |
        Si $m=n$: el costat esquerre és $0$ i el dret és $\geq 0$.
        Si $m\neq n$ i $k=m$: el costat dret és $0+d(m,n)$, igualtat. Anàlogament si $k=n$.
        Si $k\neq m$ i $k\neq n$ (i $m\neq n$): el costat dret és $\frac1m+\frac1k+\frac1k+\frac1n=\frac1m+\frac1n+\frac2k>\frac1m+\frac1n=d(m,n)$.
      fuites:
      - \\[dt]?frac\s*(\{\s*2\s*\}|2)\s*(\{\s*k\s*\}|k)
      - 2\s*/\s*k\b
      teoria:
      - T1.5
    errors_comuns:
    - id: oblida_casos
      descripcio: |
        Només tracta el cas en què $m,n,k$ són diferents dos a dos i oblida els casos en què $k$ coincideix amb $m$ o amb $n$ (o $m=n$).
      pregunta: |
        La fórmula de $d(m,k)$ és la mateixa quan $k=m$ que quan $k\neq m$? Has cobert totes les possibilitats?
    - id: zero_natural
      descripcio: |
        Considera $0\in\mathbb{N}$, on la fórmula no té sentit ($\frac10$), o no fa servir enlloc que $m,n\geq 1$.
      pregunta: |
        Per a quins valors de $m$ té sentit $\frac1m$? On fas servir que $m\geq 1$?
    - id: positivitat_sense_justificar
      descripcio: |
        Afirma $d(m,n)=0\iff m=n$ sense justificar que $\frac1m+\frac1n$ no pot ser $0$.
      pregunta: |
        Si $m\neq n$, pot ser que $\frac1m+\frac1n=0$? Per què?
    nota_professor: |
      Cal entendre $\mathbb{N}=\{1,2,3,\dots\}$. Observació interessant: la desigualtat triangular és estricta quan $k$ és diferent de $m$ i $n$. Aquest espai mètric és discret (cada $\{n\}$ és obert, amb $B(n,1/n)=\{n\}$) però la successió $(n)$ és de Cauchy i no convergeix: és un exemple d'espai no complet, útil més endavant.
- num: 3
  font: null
  preambul: |
    Demostreu que a $\mathbb{R}^n$ les aplicacions següents són normes:
  indicacio: null
  exercicis:
  - id: t1-3a
    apartat: a
    tipus: teoric
    enunciat: |
      $\|x\|_2=\sqrt{\sum_{i=1}^{n}x_i^2}$.
    teoria:
    - T1.3
    teoria_reservada: []
    resultat:
      valor: |
        $\|\cdot\|_2$ és una norma a $\mathbb{R}^n$: és $\geq 0$ i nul·la només per a $x=0$, és homogènia ($\|\lambda x\|_2=|\lambda|\,\|x\|_2$) i compleix la desigualtat triangular (via Cauchy-Schwarz per al producte escalar ordinari). Equivalentment, és la norma induïda pel producte escalar ordinari.
      fuites: []
    passos:
    - id: positivitat
      titol: Positivitat
      objectiu: |
        Comprovar que $\|x\|_2\geq 0$ i que $\|x\|_2=0\iff x=0$.
      idea: |
        Signe dels sumands dins l'arrel i quan una suma de termes no negatius s'anul·la.
      detall: |
        $\|x\|_2$ és l'arrel positiva d'una suma de quadrats, per tant $\geq 0$. Si $\sum_i x_i^2=0$, com que cada $x_i^2\geq 0$, tots són $0$ i $x=0$; el recíproc és immediat.
      fuites: []
      teoria:
      - T1.3
    - id: homogeneitat
      titol: Homogeneïtat
      objectiu: |
        Comprovar que $\|\lambda x\|_2=|\lambda|\,\|x\|_2$ per a tot $\lambda\in\mathbb{R}$.
      idea: |
        Treure el factor comú dins l'arrel i recordar quant val $\sqrt{\lambda^2}$.
      detall: |
        $\|\lambda x\|_2=\sqrt{\sum_i\lambda^2x_i^2}=\sqrt{\lambda^2}\sqrt{\sum_i x_i^2}=|\lambda|\,\|x\|_2$.
      fuites:
      - \\sqrt\{\\lambda\^\{?2\}?\}\s*\\sqrt
      teoria:
      - T1.3
    - id: triangular
      titol: Desigualtat triangular
      objectiu: |
        Demostrar que $\|x+y\|_2\leq\|x\|_2+\|y\|_2$.
      idea: |
        Com que els dos costats són no negatius, comparar-ne els quadrats; desenvolupar $\|x+y\|_2^2$ i fitar el terme creuat amb un resultat del curs sobre productes escalars.
      detall: |
        $\|x+y\|_2^2=\sum_i(x_i+y_i)^2=\|x\|_2^2+2\sum_i x_iy_i+\|y\|_2^2$. Per Cauchy-Schwarz amb el producte escalar ordinari $\langle x,y\rangle=\sum_i x_iy_i$ (que compleix $\|x\|_2=\sqrt{\langle x,x\rangle}$): $\sum_i x_iy_i\leq\|x\|_2\|y\|_2$. Per tant $\|x+y\|_2^2\leq(\|x\|_2+\|y\|_2)^2$ i, prenent arrels (tots dos costats $\geq 0$), $\|x+y\|_2\leq\|x\|_2+\|y\|_2$.
      fuites:
      - \\sum_?\{?i?\}?\s*x_i\s*y_i\s*(\\le|\\leq|≤)
      teoria:
      - T1.7
      - T1.8
      - T1.6+dem
    errors_comuns:
    - id: lambda_sense_valor_absolut
      descripcio: |
        Escriu $\sqrt{\lambda^2}=\lambda$, oblidant el cas $\lambda<0$.
      pregunta: |
        Quant val $\sqrt{(-3)^2}$?
    - id: arrel_suma
      descripcio: |
        Usa $\sqrt{a+b}=\sqrt a+\sqrt b$ per "separar" l'arrel en la desigualtat triangular.
      pregunta: |
        Amb $a=b=1$, és cert que $\sqrt{a+b}=\sqrt a+\sqrt b$?
    - id: quadrats_sense_signe
      descripcio: |
        Passa de $A^2\leq B^2$ a $A\leq B$ sense comprovar que $A,B\geq 0$.
      pregunta: |
        Si $A^2\leq B^2$, és sempre cert que $A\leq B$? Què necessites saber de $A$ i $B$?
    nota_professor: |
      Via directa: $\langle x,y\rangle=\sum_i x_iy_i$ és un producte escalar (Exemple 8 b, comprovació de la Definició 1) i la Proposició 6 (i) dona que $\sqrt{\langle x,x\rangle}=\|x\|_2$ és una norma. La desigualtat triangular és la desigualtat de Minkowski per a $p=2$.
  - id: t1-3b
    apartat: b
    tipus: teoric
    enunciat: |
      $\|x\|_1=\sum_{i=1}^{n}|x_i|$.
    teoria:
    - T1.3
    teoria_reservada: []
    resultat:
      valor: |
        $\|\cdot\|_1$ és una norma a $\mathbb{R}^n$: és $\geq 0$ i nul·la només per a $x=0$, $\|\lambda x\|_1=|\lambda|\,\|x\|_1$, i la desigualtat triangular s'obté sumant $|x_i+y_i|\leq|x_i|+|y_i|$.
      fuites: []
    passos:
    - id: positivitat
      titol: Positivitat
      objectiu: |
        Comprovar que $\|x\|_1\geq 0$ i que $\|x\|_1=0\iff x=0$.
      idea: |
        Suma de termes no negatius: quan és zero?
      detall: |
        Cada $|x_i|\geq 0$, per tant la suma és $\geq 0$; si és $0$, tots els $|x_i|$ són $0$ i $x=0$. El recíproc és immediat.
      fuites: []
      teoria:
      - T1.3
    - id: homogeneitat
      titol: Homogeneïtat
      objectiu: |
        Comprovar que $\|\lambda x\|_1=|\lambda|\,\|x\|_1$.
      idea: |
        Propietat multiplicativa del valor absolut a $\mathbb{R}$.
      detall: |
        $\|\lambda x\|_1=\sum_i|\lambda x_i|=\sum_i|\lambda|\,|x_i|=|\lambda|\sum_i|x_i|=|\lambda|\,\|x\|_1$.
      fuites: []
      teoria:
      - T1.3
    - id: triangular
      titol: Desigualtat triangular
      objectiu: |
        Demostrar que $\|x+y\|_1\leq\|x\|_1+\|y\|_1$.
      idea: |
        Desigualtat triangular del valor absolut a $\mathbb{R}$ aplicada a cada component, i sumar.
      detall: |
        Per a cada $i$, $|x_i+y_i|\leq|x_i|+|y_i|$. Sumant: $\|x+y\|_1=\sum_i|x_i+y_i|\leq\sum_i|x_i|+\sum_i|y_i|=\|x\|_1+\|y\|_1$.
      fuites: []
      teoria:
      - T1.3
    errors_comuns:
    - id: valor_absolut_igualtat
      descripcio: |
        Usa $|a+b|=|a|+|b|$ com a igualtat.
      pregunta: |
        Quant val $|1+(-1)|$? I $|1|+|-1|$?
    - id: lambda_sense_valor_absolut
      descripcio: |
        Escriu $\|\lambda x\|_1=\lambda\|x\|_1$, que dona un nombre negatiu si $\lambda<0$.
      pregunta: |
        Si $\lambda=-1$, la teva fórmula dona un valor coherent amb que la norma és $\geq 0$?
    nota_professor: |
      No prové de cap producte escalar (no compleix la llei del paral·lelogram per a $n\geq 2$), així que no es pot fer via Proposició 6 (i).
  - id: t1-3c
    apartat: c
    tipus: teoric
    enunciat: |
      $\|x\|_\infty=\max_{1\leq i\leq n}|x_i|$.
    teoria:
    - T1.3
    teoria_reservada: []
    resultat:
      valor: |
        $\|\cdot\|_\infty$ és una norma a $\mathbb{R}^n$: és $\geq 0$ i nul·la només per a $x=0$, $\|\lambda x\|_\infty=|\lambda|\,\|x\|_\infty$, i la desigualtat triangular surt de $|x_i+y_i|\leq|x_i|+|y_i|\leq\|x\|_\infty+\|y\|_\infty$ per a cada $i$ i prenent el màxim.
      fuites: []
    passos:
    - id: positivitat
      titol: Positivitat
      objectiu: |
        Comprovar que $\|x\|_\infty\geq 0$ i que $\|x\|_\infty=0\iff x=0$.
      idea: |
        Cada component està entre $0$ i el màxim.
      detall: |
        El màxim de nombres $\geq 0$ és $\geq 0$. Si $\max_i|x_i|=0$, llavors $0\leq|x_j|\leq 0$ per a cada $j$, és a dir $x=0$. El recíproc és immediat.
      fuites: []
      teoria:
      - T1.3
    - id: homogeneitat
      titol: Homogeneïtat
      objectiu: |
        Comprovar que $\|\lambda x\|_\infty=|\lambda|\,\|x\|_\infty$.
      idea: |
        Multiplicar per una constant no negativa conserva quin terme és el més gran.
      detall: |
        $|\lambda x_i|=|\lambda|\,|x_i|$ i, com que $|\lambda|\geq 0$, $\max_i|\lambda|\,|x_i|=|\lambda|\max_i|x_i|$.
      fuites: []
      teoria:
      - T1.3
    - id: triangular
      titol: Desigualtat triangular
      objectiu: |
        Demostrar que $\|x+y\|_\infty\leq\|x\|_\infty+\|y\|_\infty$.
      idea: |
        Fitar cada component $|x_i+y_i|$ per una quantitat independent de $i$ i després prendre el màxim.
      detall: |
        Per a cada $i$: $|x_i+y_i|\leq|x_i|+|y_i|\leq\|x\|_\infty+\|y\|_\infty$. Com que la fita no depèn de $i$, també $\max_i|x_i+y_i|\leq\|x\|_\infty+\|y\|_\infty$.
      fuites:
      - \|\s*y_i\s*\|\s*(\\leq?(slant)?|≤)\s*\\\|\s*x\s*\\\|_\{?\\infty
      - \|\s*x_i\s*\+\s*y_i\s*\|\s*(\\leq?(slant)?|≤)\s*\\\|\s*x\s*\\\|_\{?\\infty
      teoria:
      - T1.3
    errors_comuns:
    - id: max_suma
      descripcio: |
        Afirma $\max_i(|x_i|+|y_i|)=\max_i|x_i|+\max_i|y_i|$ (en general només és $\leq$).
      pregunta: |
        Amb $x=(1,0)$ i $y=(0,1)$, quant val cada costat de la igualtat que has escrit?
    - id: mateix_index
      descripcio: |
        Suposa que el màxim de $|x_i+y_i|$, de $|x_i|$ i de $|y_i|$ s'assoleixen al mateix índex.
      pregunta: |
        Has de saber on s'assoleix cada màxim, o n'hi ha prou amb una fita que valgui per a tots els índexs?
    nota_professor: |
      Tampoc prové de cap producte escalar per a $n\geq 2$.
- num: 4
  font: null
  preambul: |
    Si $\|\cdot\|$ és la norma ordinària i $\langle\cdot,\cdot\rangle$ és el producte escalar ordinari a $\mathbb{R}^n$, proveu:
  indicacio: null
  exercicis:
  - id: t1-4a
    apartat: a
    tipus: teoric
    enunciat: |
      $4\langle x,y\rangle=\|x+y\|^2-\|x-y\|^2$ (identitat de polarització).
    teoria:
    - T1.1
    - T1.8
    teoria_reservada: []
    resultat:
      valor: |
        Desenvolupant per bilinealitat i simetria, $\|x+y\|^2=\|x\|^2+2\langle x,y\rangle+\|y\|^2$ i $\|x-y\|^2=\|x\|^2-2\langle x,y\rangle+\|y\|^2$; restant, $\|x+y\|^2-\|x-y\|^2=4\langle x,y\rangle$.
      fuites: []
    passos:
    - id: desenvolupar_suma
      titol: Desenvolupar $\|x+y\|^2$
      objectiu: |
        Expressar $\|x+y\|^2$ en termes de $\|x\|$, $\|y\|$ i $\langle x,y\rangle$.
      idea: |
        Escriure el quadrat de la norma com un producte escalar d'un vector amb ell mateix i usar la bilinealitat i la simetria del producte escalar.
      detall: |
        $\|x+y\|^2=\langle x+y,x+y\rangle=\langle x,x\rangle+\langle x,y\rangle+\langle y,x\rangle+\langle y,y\rangle=\|x\|^2+2\langle x,y\rangle+\|y\|^2$.
      fuites:
      - \+\s*2\s*\\langle\s*x\s*,\s*y\s*\\rangle
      teoria:
      - T1.1
      - T1.8
    - id: desenvolupar_resta
      titol: Desenvolupar $\|x-y\|^2$ i restar
      objectiu: |
        Fer el mateix amb $\|x-y\|^2$ i combinar els dos resultats.
      idea: |
        Mateix desenvolupament, vigilant els signes que surten de $-y$; després restar les dues expressions.
      detall: |
        $\|x-y\|^2=\langle x-y,x-y\rangle=\|x\|^2-2\langle x,y\rangle+\|y\|^2$. Restant: $\|x+y\|^2-\|x-y\|^2=4\langle x,y\rangle$.
      fuites:
      - -\s*2\s*\\langle\s*x\s*,\s*y\s*\\rangle
      teoria:
      - T1.1
    errors_comuns:
    - id: quadrat_norma_components
      descripcio: |
        Escriu $\|x+y\|^2=\|x\|^2+\|y\|^2$ (com si fos un quadrat de nombres sense terme creuat, o oblidant-lo).
      pregunta: |
        Quan desenvolupes $(a+b)^2$ amb nombres apareix un terme creuat. Quin és l'anàleg per a $\langle x+y,x+y\rangle$?
    - id: simetria_oblidada
      descripcio: |
        Deixa $\langle x,y\rangle+\langle y,x\rangle$ sense agrupar o els tracta com a diferents, i no arriba al factor $4$.
      pregunta: |
        Quina relació hi ha entre $\langle x,y\rangle$ i $\langle y,x\rangle$?
    nota_professor: |
      També es pot fer en coordenades ($\sum(x_i+y_i)^2-\sum(x_i-y_i)^2=\sum 4x_iy_i$); el desenvolupament abstracte val per a qualsevol espai euclidià.
  - id: t1-4b
    apartat: b
    tipus: teoric
    enunciat: |
      si $x,y$ són ortogonals, $\|x+y\|^2=\|x\|^2+\|y\|^2$.
    teoria:
    - T1.9
    - T1.8
    teoria_reservada: []
    resultat:
      valor: |
        $\|x+y\|^2=\|x\|^2+2\langle x,y\rangle+\|y\|^2$ i, si $x\perp y$, $\langle x,y\rangle=0$, d'on $\|x+y\|^2=\|x\|^2+\|y\|^2$ (teorema de Pitàgores).
      fuites: []
    passos:
    - id: desenvolupar
      titol: Desenvolupar $\|x+y\|^2$
      objectiu: |
        Expressar $\|x+y\|^2$ en termes de $\|x\|$, $\|y\|$ i $\langle x,y\rangle$ (si ja has fet l'apartat (a), pots reutilitzar-lo).
      idea: |
        Quadrat de la norma com a producte escalar del vector amb ell mateix; bilinealitat i simetria.
      detall: |
        $\|x+y\|^2=\langle x+y,x+y\rangle=\|x\|^2+2\langle x,y\rangle+\|y\|^2$.
      fuites:
      - \+\s*2\s*\\langle\s*x\s*,\s*y\s*\\rangle
      teoria:
      - T1.1
      - T1.8
    - id: ortogonalitat
      titol: Usar l'ortogonalitat
      objectiu: |
        Fer servir la hipòtesi que $x$ i $y$ són ortogonals.
      idea: |
        Recordar la definició d'ortogonalitat en termes del producte escalar.
      detall: |
        $x\perp y$ vol dir $\langle x,y\rangle=0$, i el terme creuat desapareix: $\|x+y\|^2=\|x\|^2+\|y\|^2$.
      fuites: []
      teoria:
      - T1.9
    errors_comuns:
    - id: sense_terme_creuat
      descripcio: |
        Escriu directament $\|x+y\|^2=\|x\|^2+\|y\|^2$ "desenvolupant" sense fer aparèixer el terme creuat, de manera que no usa la hipòtesi.
      pregunta: |
        On has fet servir que $x$ i $y$ són ortogonals? Si no l'has fet servir, la igualtat valdria per a $x=y\neq 0$?
    - id: ortogonal_mal_definit
      descripcio: |
        Confon ortogonalitat amb alguna altra condició (per exemple, $\|x\|=\|y\|$ o $x_iy_i=0$ per a cada $i$).
      pregunta: |
        Quina és exactament la definició d'ortogonalitat del curs?
    nota_professor: |
      De fet el recíproc també és cert a $\mathbb{R}^n$: si $\|x+y\|^2=\|x\|^2+\|y\|^2$ aleshores $\langle x,y\rangle=0$.
  - id: t1-4c
    apartat: c
    tipus: teoric
    enunciat: |
      $\|x+y\|\,\|x-y\|\leqslant\|x\|^2+\|y\|^2$.
    teoria:
    - T1.8
    teoria_reservada: []
    resultat:
      valor: |
        Per la llei del paral·lelogram, $\|x+y\|^2+\|x-y\|^2=2\|x\|^2+2\|y\|^2$, i per a reals $a,b$ es té $ab\leq\frac{a^2+b^2}{2}$ (de $(a-b)^2\geq 0$). Amb $a=\|x+y\|$, $b=\|x-y\|$: $\|x+y\|\,\|x-y\|\leq\frac{\|x+y\|^2+\|x-y\|^2}{2}=\|x\|^2+\|y\|^2$.
      fuites: []
    passos:
    - id: paralelogram
      titol: Llei del paral·lelogram
      objectiu: |
        Calcular $\|x+y\|^2+\|x-y\|^2$ en termes de $\|x\|$ i $\|y\|$.
      idea: |
        Desenvolupar els dos quadrats com a productes escalars (com a l'apartat (a)) i ara sumar-los en lloc de restar-los.
      detall: |
        $\|x\pm y\|^2=\|x\|^2\pm2\langle x,y\rangle+\|y\|^2$; sumant, els termes creuats es cancel·len: $\|x+y\|^2+\|x-y\|^2=2\|x\|^2+2\|y\|^2$.
      fuites:
      - 2\s*\\\|\s*x\s*\\\|\^\{?2\}?\s*\+\s*2\s*\\\|\s*y\s*\\\|\^\{?2\}?
      - 2\s*(\\left)?\(\s*\\\|\s*x\s*\\\|\^\{?2\}?\s*\+\s*\\\|\s*y\s*\\\|\^\{?2\}?\s*(\\right)?\)
      teoria:
      - T1.1
      - T1.8
    - id: desigualtat_producte
      titol: Fitar un producte per quadrats
      objectiu: |
        Fitar el producte $ab$ de dos nombres reals en termes de $a^2$ i $b^2$.
      idea: |
        Partir d'un quadrat, que sempre és no negatiu, i desenvolupar-lo.
      detall: |
        $0\leq(a-b)^2=a^2-2ab+b^2$, per tant $ab\leq\frac{a^2+b^2}{2}$.
      fuites:
      - \(\s*a\s*-\s*b\s*\)\^\{?2\}?
      - ab\s*(\\leq?(slant)?|≤)\s*\\[dt]?frac\s*\{\s*a\^\{?2\}?\s*\+\s*b\^\{?2\}?\s*\}\s*\{?2\}?
      teoria: []
    - id: combinar
      titol: Combinar
      objectiu: |
        Obtenir la desigualtat de l'enunciat a partir dels dos passos anteriors.
      idea: |
        Aplicar la fita del producte a dos nombres ben triats i substituir la suma de quadrats.
      detall: |
        Amb $a=\|x+y\|$, $b=\|x-y\|$: $\|x+y\|\,\|x-y\|\leq\frac{\|x+y\|^2+\|x-y\|^2}{2}=\frac{2\|x\|^2+2\|y\|^2}{2}=\|x\|^2+\|y\|^2$.
      fuites: []
      teoria: []
    errors_comuns:
    - id: cauchy_schwarz_sentit
      descripcio: |
        Intenta usar Cauchy-Schwarz amb $\langle x+y,x-y\rangle=\|x\|^2-\|y\|^2$, però Cauchy-Schwarz dona $|\langle x+y,x-y\rangle|\leq\|x+y\|\,\|x-y\|$, una fita inferior del producte, no superior.
      pregunta: |
        La desigualtat de Cauchy-Schwarz fita $\|x+y\|\,\|x-y\|$ per dalt o per baix?
    - id: triangular_massa_grossa
      descripcio: |
        Fita cada factor per la desigualtat triangular, $\|x\pm y\|\leq\|x\|+\|y\|$, i obté $(\|x\|+\|y\|)^2$, que és més gran que $\|x\|^2+\|y\|^2$ i no serveix.
      pregunta: |
        Compara $(\|x\|+\|y\|)^2$ amb $\|x\|^2+\|y\|^2$: la fita que has obtingut és prou fina?
    - id: norma_quadrat_producte
      descripcio: |
        Escriu $\|x+y\|\,\|x-y\|=\|x\|^2-\|y\|^2$ confonent el producte de normes amb el producte escalar.
      pregunta: |
        $\|x+y\|\,\|x-y\|$ i $\langle x+y,x-y\rangle$ són el mateix? Prova amb $x=(1,0)$, $y=(0,1)$.
    nota_professor: |
      La igualtat es dona quan $\|x+y\|=\|x-y\|$, és a dir, quan $\langle x,y\rangle=0$. Alternativa: elevar al quadrat i veure $\|x+y\|^2\|x-y\|^2=(\|x\|^2+\|y\|^2)^2-4\langle x,y\rangle^2\leq(\|x\|^2+\|y\|^2)^2$.
- num: 5
  font: null
  preambul: |
    Siguin $A,B$ subconjunts no buits de $\mathbb{R}^m$ i $d$ la distància euclídia. Definim $d(A,B)=\inf\{d(a,b)\mid a\in A,\ b\in B\}$.
  indicacio: null
  exercicis:
  - id: t1-5a
    apartat: a
    tipus: teoric
    enunciat: |
      És cert que $d(A,B)=0\Leftrightarrow A\cap B\neq\emptyset$ ?
    teoria:
    - T1.5
    - T1.8
    teoria_reservada: []
    resultat:
      valor: |
        No és cert en general. La implicació $A\cap B\neq\emptyset\Rightarrow d(A,B)=0$ sí que val (si $c\in A\cap B$, $0\leq d(A,B)\leq d(c,c)=0$), però la recíproca és falsa: per exemple, a $\mathbb{R}^m$, $A=\{0\}$ i $B=B(0,1)\setminus\{0\}$ són disjunts i $d(A,B)=\inf_{0<\|b\|<1}\|b\|=0$ (prenent $b=\frac1k e_1$).
      fuites:
      - no\s+(és|es)\s+(cert|veritat)\s+(en\s+general|que\s+\$?d\s*\(\s*A\s*,\s*B\s*\)\s*=\s*0)
      - (equival[eè]ncia|rec[ií]proca|implicaci[oó])[^.]{0,40}?(és|es)\s+fals
      - rec[ií]proca\s+(no\s+(és\s+certa|val)|falla)
      - la\s+resposta\s+(és|es)\s+(que\s+)?no\b
    passos:
    - id: implicacio_facil
      titol: La implicació $\Leftarrow$
      objectiu: |
        Estudiar si $A\cap B\neq\emptyset$ implica $d(A,B)=0$.
      idea: |
        Si hi ha un punt comú, quina parella $(a,b)$ dona la distància més petita possible? Recordar que $d\geq 0$ i que l'ínfim és una fita inferior.
      detall: |
        Si $c\in A\cap B$, prenent $a=b=c$ tenim $d(c,c)=0$ dins el conjunt; com que totes les distàncies són $\geq 0$, $0\leq d(A,B)\leq d(c,c)=0$, i per tant $d(A,B)=0$.
      fuites: []
      teoria:
      - T1.5
    - id: analitzar_reciproca
      titol: Què diu $d(A,B)=0$
      objectiu: |
        Entendre què implica exactament $d(A,B)=0$ i si n'hi ha prou per obtenir un punt comú.
      idea: |
        Usar la caracterització de l'ínfim: ser $0$ vol dir que hi ha parelles $(a,b)$ amb distància tan petita com es vulgui, però no necessàriament una parella amb distància exactament $0$.
      detall: |
        $d(A,B)=0$ equival a: per a tot $\varepsilon>0$ existeixen $a\in A$, $b\in B$ amb $d(a,b)<\varepsilon$; és a dir, hi ha successions $a_k\in A$, $b_k\in B$ amb $d(a_k,b_k)\to 0$. Això no força que l'ínfim s'assoleixi: n'hi ha prou que els conjunts s'"acostin" sense tocar-se, per exemple si un punt d'$A$ és adherent a $B$ sense ser-hi.
      fuites: []
      teoria: []
    - id: contraexemple
      titol: Contraexemple
      objectiu: |
        Decidir si la recíproca és certa i justificar-ho completament.
      idea: |
        Buscar dos conjunts disjunts que "es toquin a la vora": un conjunt i un altre que tingui aquell punt a la seva adherència però no el contingui.
      detall: |
        $A=\{0\}$, $B=B(0,1)\setminus\{0\}=\{x\in\mathbb{R}^m\mid 0<\|x\|<1\}$. Són no buits i $A\cap B=\emptyset$, però $d(0,\tfrac1k e_1)=\tfrac1k\to 0$, així que $d(A,B)=0$. (A $\mathbb{R}$ també serveixen $A=(0,1)$, $B=(1,2)$.)
      fuites:
      - A\s*=\s*\\\{\s*0\s*\\\}
      - B\s*=\s*\(\s*1\s*,\s*2\s*\)
      - \\setminus\s*\\\{\s*0\s*\\\}
      teoria:
      - T1.8
    errors_comuns:
    - id: infim_assolit
      descripcio: |
        Suposa que l'ínfim és un mínim, és a dir, que existeixen $a\in A$, $b\in B$ amb $d(a,b)=d(A,B)$.
      pregunta: |
        L'ínfim d'un conjunt de nombres sempre pertany al conjunt? Quin és l'ínfim de $\{1/k\mid k\geq 1\}$?
    - id: nomes_una_implicacio
      descripcio: |
        Demostra només una de les dues implicacions i conclou sobre l'equivalència.
      pregunta: |
        Una equivalència són dues implicacions. Les has estudiat totes dues?
    - id: contraexemple_buit
      descripcio: |
        Proposa un contraexemple amb algun conjunt buit, o amb conjunts que sí que es tallen.
      pregunta: |
        El teu exemple compleix totes les hipòtesis (conjunts no buits) i realment els conjunts són disjunts?
    nota_professor: |
      Fins i tot amb $A,B$ tancats disjunts pot ser $d(A,B)=0$: a $\mathbb{R}^2$, $A=\{y=0\}$ i $B=\{xy=1,\ x>0\}$. En canvi, si $A$ és compacte i $B$ tancat, $d(A,B)=0\Rightarrow A\cap B\neq\emptyset$ (per compacitat seqüencial).
  - id: t1-5b
    apartat: b
    tipus: teoric
    enunciat: |
      Demostreu $|d(x,A)-d(y,A)|\leq d(x,y)$, $\forall x,y\in\mathbb{R}^m$, on $d(x,A)=d(\{x\},A)$.
    teoria:
    - T1.5
    teoria_reservada: []
    resultat:
      valor: |
        Per a tot $a\in A$, $d(x,A)\leq d(x,a)\leq d(x,y)+d(y,a)$; prenent l'ínfim en $a$, $d(x,A)\leq d(x,y)+d(y,A)$, és a dir $d(x,A)-d(y,A)\leq d(x,y)$. Intercanviant $x$ i $y$ (i usant $d(x,y)=d(y,x)$) s'obté $d(y,A)-d(x,A)\leq d(x,y)$, i les dues juntes donen $|d(x,A)-d(y,A)|\leq d(x,y)$.
      fuites: []
    passos:
    - id: fita_per_a
      titol: Fita per a cada punt d'$A$
      objectiu: |
        Relacionar $d(x,A)$ amb $d(x,y)$ i $d(y,a)$ per a un $a\in A$ qualsevol.
      idea: |
        $d(x,A)$ és una fita inferior de totes les distàncies $d(x,a)$; combinar-ho amb la desigualtat triangular passant per $y$.
      detall: |
        Per a tot $a\in A$: $d(x,A)\leq d(x,a)\leq d(x,y)+d(y,a)$.
      fuites:
      - d\(x,\s*a\)\s*(\\le|\\leq|≤)\s*d\(x,\s*y\)\s*\+\s*d\(y,\s*a\)
      teoria:
      - T1.5
    - id: prendre_infim
      titol: Prendre l'ínfim
      objectiu: |
        Eliminar el punt $a$ de la desigualtat anterior.
      idea: |
        Aïllar $d(y,a)$: el nombre que queda a l'altre costat és una fita inferior de tots els $d(y,a)$, $a\in A$, i per tant és com a molt l'ínfim (l'ínfim és la més gran de les fites inferiors).
      detall: |
        $d(x,A)-d(x,y)\leq d(y,a)$ per a tot $a\in A$, per tant $d(x,A)-d(x,y)\leq\inf_{a\in A}d(y,a)=d(y,A)$, és a dir $d(x,A)-d(y,A)\leq d(x,y)$.
      fuites:
      - d\(x,\s*A\)\s*-\s*d\(y,\s*A\)\s*(\\le|\\leq|≤)\s*d\(x,\s*y\)
      - d\(x,\s*A\)\s*(\\le|\\leq|≤)\s*d\(x,\s*y\)\s*\+\s*d\(y,\s*A\)
      teoria: []
    - id: simetritzar
      titol: Intercanviar els papers
      objectiu: |
        Passar de la desigualtat d'un sol sentit a la desigualtat amb valor absolut.
      idea: |
        L'argument és simètric en $x$ i $y$; recordar que $|t|\leq c$ equival a $-c\leq t\leq c$.
      detall: |
        Intercanviant $x$ i $y$: $d(y,A)-d(x,A)\leq d(y,x)=d(x,y)$. Juntament amb l'anterior, $-d(x,y)\leq d(x,A)-d(y,A)\leq d(x,y)$, és a dir $|d(x,A)-d(y,A)|\leq d(x,y)$.
      fuites: []
      teoria:
      - T1.5
    errors_comuns:
    - id: infim_com_minim
      descripcio: |
        Pren un $a_0\in A$ amb $d(x,a_0)=d(x,A)$ (o amb $d(y,a_0)=d(y,A)$), suposant que l'ínfim s'assoleix, cosa que no cal que passi si $A$ no és tancat.
      pregunta: |
        Existeix sempre un punt $a\in A$ tal que $d(x,a)=d(x,A)$? Pensa en $A=(0,1)$ i $x=2$.
    - id: infim_sentit
      descripcio: |
        Pren l'ínfim en un sentit incorrecte, per exemple passa de $d(x,A)\leq d(x,y)+d(y,a)$ per a cada $a$ a una conclusió del tipus $d(x,A)\geq\dots$, o tracta l'ínfim d'una diferència com la diferència d'ínfims.
      pregunta: |
        Si un nombre $c$ és $\leq d(y,a)$ per a tots els $a\in A$, què pots dir de $c$ comparat amb $\inf_{a\in A}d(y,a)$?
    - id: un_sol_sentit
      descripcio: |
        Prova només $d(x,A)-d(y,A)\leq d(x,y)$ i conclou el valor absolut.
      pregunta: |
        $|t|\leq c$ demana dues desigualtats. Les tens totes dues?
    nota_professor: |
      Conseqüència: $x\mapsto d(x,A)$ és 1-Lipschitz i, per tant, contínua (útil al Tema 2). L'argument val en qualsevol espai mètric.
- num: 6
  font: null
  preambul: ''
  indicacio: |
    dibuixeu aquests conjunts en $\mathbb{R}^2$ i $\mathbb{R}^3$.
  exercicis:
  - id: t1-6
    apartat: null
    tipus: calcul
    enunciat: |
      Donat $A\subset\mathbb{R}^m$, sigui $D_A=\{d(x,y)\mid x,y\in A\}\subset\mathbb{R}$. Proveu que aquest conjunt és fitat si, i només si, $A$ ho és. Aleshores, es defineix _diàmetre_ de $A$ per $\mathrm{diam}(A)=\sup D_A$. Siguin ara $B_1=\{x\in\mathbb{R}^m\mid\sum_{i=1}^{m}|x_i|<1\}$, $B_2=\{x\in\mathbb{R}^m\mid\|x\|<1\}$, i $B_3=\{x\in\mathbb{R}^m\mid\max|x_i|<1\}$. Calculeu el diàmetre de $B_1$, $B_2$ i $B_3$.
    teoria:
    - T1.33
    - T1.5
    teoria_reservada: []
    resultat:
      valor: |
        (Amb $d$ la distància euclidiana i $A\neq\emptyset$.) $D_A$ és fitat $\iff$ $A$ és fitat: si $A\subseteq B_L(p)$, aleshores $d(x,y)\leq d(x,p)+d(p,y)<2L$; si $d(x,y)\leq K$ per a tots $x,y\in A$, fixat $a_0\in A$ es té $A\subseteq B_{K+1}(a_0)$.
        Diàmetres: $\mathrm{diam}(B_1)=2$, $\mathrm{diam}(B_2)=2$, $\mathrm{diam}(B_3)=2\sqrt m$ (cap dels tres suprems no s'assoleix, perquè els conjunts són oberts).
      fuites:
      - 2\s*\\sqrt\{?\s*m\s*\}?
      - diam[^$=]{0,20}?B_?\{?[123]\}?\s*\)?\s*(=|és|val)\s*\$?\s*2
      - di[àa]metre\s+(de\s+)?\$?B_?\{?[123]\}?\$?\s+(és|val)\s*\$?\s*2
    passos:
    - id: fitat_implica
      titol: $A$ fitat $\Rightarrow$ $D_A$ fitat
      objectiu: |
        Suposant que $A$ és fitat, trobar una fita superior per a totes les distàncies $d(x,y)$ amb $x,y\in A$.
      idea: |
        Usar la definició de conjunt fitat (contingut en una bola) i la desigualtat triangular passant pel centre de la bola. Recordar que $D_A\subset[0,\infty)$, així que només cal fitar-lo per dalt.
      detall: |
        Si $A\subseteq B_L(p)$, per a $x,y\in A$: $0\leq d(x,y)\leq d(x,p)+d(p,y)<2L$. Per tant $D_A\subseteq[0,2L]$ és fitat.
      fuites:
      - <\s*2\s*L
      - \[\s*0\s*,\s*2\s*L\s*\]
      teoria:
      - T1.33
      - T1.11
      - T1.5
    - id: reciproc
      titol: $D_A$ fitat $\Rightarrow$ $A$ fitat
      objectiu: |
        Suposant que totes les distàncies entre punts d'$A$ són $\leq K$, trobar una bola que contingui $A$.
      idea: |
        Si $A$ és no buit, fixar un punt d'$A$ com a centre i escollir un radi adequat (cal desigualtat estricta a la definició de bola oberta).
      detall: |
        Fixem $a_0\in A$. Per a tot $x\in A$, $d(x,a_0)\leq K<K+1$, així que $A\subseteq B_{K+1}(a_0)$. (Si $A=\emptyset$, tant $A$ com $D_A=\emptyset$ són trivialment fitats.)
      fuites:
      - B_\{?\s*K\s*\+\s*1\s*\}?
      - B\s*\(\s*a_0\s*,\s*K\s*\+\s*1
      teoria:
      - T1.33
      - T1.11
    - id: diam_B2
      titol: Diàmetre de $B_2$
      objectiu: |
        Calcular $\mathrm{diam}(B_2)$: trobar una fita superior de $d(x,y)$ per a $x,y\in B_2$ i veure que és la més petita possible.
      idea: |
        Fita: desigualtat triangular passant per l'origen. Optimalitat: prendre parelles de punts diametralment oposats sobre un eix, cada cop més a prop de la vora.
      detall: |
        Per a $x,y\in B_2$: $\|x-y\|\leq\|x\|+\|y\|<2$. Amb $x_t=te_1$, $y_t=-te_1$, $0<t<1$: $\|x_t-y_t\|=2t\to 2$ quan $t\to 1^-$. Per tant el suprem és $2$ (no assolit).
      fuites:
      - -\s*t\s*e_\{?1\}?
      - =\s*2\s*t\b
      - \\\|\s*x\s*\\\|\s*\+\s*\\\|\s*y\s*\\\|\s*<\s*2
      teoria:
      - T1.5
    - id: diam_B1
      titol: Diàmetre de $B_1$
      objectiu: |
        Calcular $\mathrm{diam}(B_1)$ amb la distància euclidiana.
      idea: |
        Comparar la norma euclidiana amb la suma dels valors absoluts de les components per obtenir una fita, i buscar punts de $B_1$ que la gairebé assoleixin.
      detall: |
        Per a $v\in\mathbb{R}^m$, $\|v\|^2=\sum_i v_i^2\leq\left(\sum_i|v_i|\right)^2$, és a dir $\|v\|\leq\sum_i|v_i|$. Per a $x,y\in B_1$: $\|x-y\|\leq\sum_i|x_i-y_i|\leq\sum_i|x_i|+\sum_i|y_i|<2$. Els punts $\pm te_1$ ($0<t<1$) són a $B_1$ i són a distància $2t\to 2$. Per tant el suprem és $2$.
      fuites:
      - \\\|\s*v\s*\\\|\s*(\\leq?(slant)?|≤)\s*\\sum
      - \\\|\s*[a-z\-\s]+\\\|(_\{?2\}?)?\s*(\\leq?(slant)?|≤)\s*\\\|\s*[a-z\-\s]+\\\|_\{?1\}?
      teoria:
      - T1.5
    - id: diam_B3
      titol: Diàmetre de $B_3$
      objectiu: |
        Calcular $\mathrm{diam}(B_3)$ amb la distància euclidiana.
      idea: |
        Fitar cada component de $x-y$ i sumar els quadrats; per a l'optimalitat, pensar en vèrtexs oposats del cub (la diagonal).
      detall: |
        Per a $x,y\in B_3$: $|x_i-y_i|\leq|x_i|+|y_i|<2$ per a cada $i$, d'on $\|x-y\|^2=\sum_{i=1}^m(x_i-y_i)^2<4m$ i $\|x-y\|<2\sqrt m$. Amb $x_t=t(1,\dots,1)$, $y_t=-x_t$, $0<t<1$: $\|x_t-y_t\|=2t\sqrt m\to 2\sqrt m$. Per tant el suprem és $2\sqrt m$.
      fuites:
      - 2\s*t?\s*\\sqrt\{?\s*m\s*\}?
      - <\s*4\s*m\b
      teoria:
      - T1.5
    errors_comuns:
    - id: fita_sense_optimalitat
      descripcio: |
        Troba una fita superior de $D_B$ i la dona com a diàmetre sense comprovar que és la més petita (que hi ha parelles de punts amb distància tan a prop com es vulgui de la fita).
      pregunta: |
        Has vist que totes les distàncies són menors que el teu valor. Per què no podria ser el suprem un nombre més petit?
    - id: maxim_assolit
      descripcio: |
        Pren punts de la vora (per exemple $\pm e_1$ o els vèrtexs del cub) com si fossin del conjunt, sense notar que els conjunts són oberts i el suprem no s'assoleix.
      pregunta: |
        Els punts que has triat compleixen la desigualtat estricta que defineix el conjunt? Com ho arreglaries?
    - id: distancia_equivocada
      descripcio: |
        Calcula cada diàmetre amb la distància "pròpia" del conjunt ($d_1$ per a $B_1$, $d_\infty$ per a $B_3$) en lloc de la distància euclidiana, o barreja distàncies.
      pregunta: |
        Amb quina distància està definit $D_A$ a l'enunciat? La fas servir per als tres conjunts?
    - id: fitat_sense_bola
      descripcio: |
        Al recíproc, afirma que $A$ és fitat "perquè les distàncies ho són" sense exhibir cap bola que contingui $A$ (o pren com a centre un punt que no està ben definit).
      pregunta: |
        Segons la definició del curs, què has de trobar per dir que $A$ és fitat? Quin centre i quin radi proposes?
    nota_professor: |
      Interpreto $d$ com la distància euclidiana (com al problema 5). Si es mesurés cada conjunt amb la distància de la seva pròpia norma, els tres diàmetres serien $2$; amb $d_1$ es tindria $\mathrm{diam}(B_3)=2m$ i amb $d_\infty$, $\mathrm{diam}(B_1)=2$. Per a $m=1$ els tres conjunts coincideixen amb $(-1,1)$ i tots els diàmetres valen $2$. A $\mathbb{R}^2$: $B_1$ és un rombe, $B_2$ un disc, $B_3$ un quadrat; $B_1\subset B_2\subset B_3$.
- num: 7
  font: null
  preambul: |
    Descriviu l'interior, la frontera, l'adherència i el conjunt de punts d'acumulació dels conjunts següents:
  indicacio: null
  exercicis:
  - id: t1-7a
    apartat: a
    tipus: calcul
    enunciat: |
      $A=\{(x,y)\in\mathbb{R}^2\mid y>0\}$.
    teoria:
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        $\mathring{A}=A$ ($A$ és obert); $\mathrm{Fr}\,A=\{(x,0)\mid x\in\mathbb{R}\}$ (la recta $y=0$); $\overline{A}=\{(x,y)\mid y\geq 0\}$; $A'=\overline{A}=\{(x,y)\mid y\geq 0\}$.
      fuites:
      - y\s*(\\geq|\\ge|\\geqslant|≥)\s*0
      - y\s*=\s*0\b
      - (\\mathring\{?\s*A\s*\}?|int\}?\s*\(\s*A\s*\)|A\^\{?\\circ\}?)\s*=\s*A\b
    passos:
    - id: interior
      titol: Interior
      objectiu: |
        Determinar quins punts d'$A$ són interiors a $A$.
      idea: |
        Per a un punt $(x_0,y_0)$ d'$A$, buscar un radi (que depengui del punt) tal que la bola no surti del semiplà. Alternativament, reconèixer $A$ com un conjunt definit per una desigualtat estricta entre funcions contínues.
      detall: |
        Si $y_0>0$, la bola $B_{y_0}((x_0,y_0))$ està continguda a $A$: si $(x,y)$ hi pertany, $|y-y_0|\leq\|(x,y)-(x_0,y_0)\|<y_0$, d'on $y>0$. Per tant tot punt d'$A$ és interior, $A$ és obert i $\mathring{A}=A$ (també es dedueix del Corol·lari 18(i) del Tema 2 amb $f(x,y)=y$, $g=0$).
      fuites:
      - (\\mathring\{?\s*A\s*\}?|int\}?\s*\(\s*A\s*\)|A\^\{?\\circ\}?)\s*=\s*A\b
      - B_\{?\s*y_\{?0\}?\s*\}?
      teoria:
      - T1.14
      - T1.16
      - T2.18
    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera d'$A$.
      idea: |
        Classificar els punts del pla segons el signe de la segona coordenada i, per a cada tipus, decidir si tota bola centrada en el punt talla alhora $A$ i el seu complementari.
      detall: |
        Si $y_0>0$ el punt és interior, i per tant no és de la frontera. Si $y_0<0$, $B_{|y_0|}((x_0,y_0))\subseteq A^c$: el punt és exterior. Si $y_0=0$, per a tot $r>0$ la bola $B_r((x_0,0))$ conté $(x_0,r/2)\in A$ i $(x_0,0)\in A^c$. Per tant $\mathrm{Fr}\,A=\{(x,0)\mid x\in\mathbb{R}\}$, la recta $y=0$.
      fuites:
      - y\s*=\s*0\b
      - y_\{?0\}?\s*=\s*0\b
      - \(\s*x_\{?0\}?\s*,\s*r\s*/\s*2\s*\)
      teoria:
      - T1.14
      - T1.16
    - id: adherencia
      titol: Adherència
      objectiu: |
        Determinar l'adherència $\overline{A}$.
      idea: |
        Proposar un tancat que contingui $A$ (l'adherència és el tancat més petit que el conté) i comprovar que cadascun dels seus punts és límit d'una successió de punts d'$A$.
      detall: |
        $S=\{(x,y)\mid y\geq 0\}$ és tancat (Corol·lari 18(ii) del Tema 2) i conté $A$, així que $\overline{A}\subseteq S$. Recíprocament, si $y_0\geq 0$, la successió $(x_0,y_0+1/n)$ és d'$A$ i convergeix a $(x_0,y_0)$; per la Proposició 19(ii), $(x_0,y_0)\in\overline{A}$. Per tant $\overline{A}=\{(x,y)\mid y\geq 0\}$.
      fuites:
      - y\s*(\\geq|\\ge|\\geqslant|≥)\s*0
      teoria:
      - T1.16
      - T1.19
      - T2.18
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt derivat $A'$.
      idea: |
        Tot punt d'acumulació és adherent; queda per veure si algun punt adherent és aïllat (només s'hi pot arribar amb successions que acaben essent constants).
      detall: |
        Si $y_0\geq 0$, la successió $(x_0,y_0+1/n)$ té els termes a $A$, tots diferents de $(x_0,y_0)$, i hi convergeix; per la Proposició 19(i), $(x_0,y_0)\in A'$. Com que $A'\subseteq\overline{A}$, resulta $A'=\overline{A}=\{(x,y)\mid y\geq 0\}$.
      fuites:
      - y\s*(\\geq|\\ge|\\geqslant|≥)\s*0
      - A('|\^\{?\\prime\}?)\s*=\s*(\\overline|\\bar)
      teoria:
      - T1.14
      - T1.19
    errors_comuns:
    - id: frontera_dins_conjunt
      descripcio: |
        Busca la frontera només entre els punts d'$A$ (i conclou que és buida), o pensa que la frontera d'un conjunt sempre en forma part.
      pregunta: |
        La definició de punt frontera exigeix que el punt pertanyi al conjunt? Mira què passa amb punts que no són d'$A$ però en són molt a prop.
    - id: derivat_dins_conjunt
      descripcio: |
        Creu que els punts d'acumulació han de ser punts d'$A$ i dona $A'=A$.
      pregunta: |
        Un punt que no és d'$A$ pot tenir punts d'$A$ tan a prop com vulguis? Què diu llavors la definició de punt d'acumulació?
    - id: sense_justificar_boles
      descripcio: |
        Descriu els conjunts "a ull" pel dibuix sense donar cap radi ni cap successió que ho justifiqui.
      pregunta: |
        Per a un punt concret que dius que és interior, quin radi de bola funciona? I per a un de la frontera, quins punts trobes a cada bola?
    nota_professor: |
      Exercici d'escalfament. Val la pena remarcar que, en general, $\mathrm{Fr}\,A=\overline{A}\setminus\mathring{A}$, i que aquí $A$ és obert però no tancat.
  - id: t1-7b
    apartat: b
    tipus: calcul
    enunciat: |
      $B=\{(x,y)\in\mathbb{R}^2\mid x=\lambda y\}$, $\lambda\in\mathbb{R}$.
    teoria:
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        Per a tot $\lambda\in\mathbb{R}$ ($B$ és una recta per l'origen): $\mathring{B}=\varnothing$, $\mathrm{Fr}\,B=B$, $\overline{B}=B$ ($B$ és tancat) i $B'=B$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*B\s*\}?|int\}?\s*\(\s*B\s*\)|B\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*B\s*\)?\s*=\s*B\b
      - (\\overline|\\bar)\{?\s*B\s*\}?\s*=\s*B\b
      - B('|\^\{?\\prime\}?)\s*=\s*B\b
    passos:
    - id: interior
      titol: Interior
      objectiu: |
        Decidir si $B$ té punts interiors.
      idea: |
        Donat un punt de $B$ i un radi qualsevol, buscar dins la bola un punt que no compleixi l'equació (moure's una mica en una direcció que no sigui la de la recta).
      detall: |
        Sigui $p=(\lambda y_0,y_0)\in B$ i $r>0$. El punt $(\lambda y_0+r/2,y_0)$ és a $B_r(p)$ i compleix $x-\lambda y=r/2\neq 0$, així que no és de $B$. Cap bola centrada en un punt de $B$ hi està continguda: $B$ no té punts interiors, $\mathring{B}=\varnothing$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*B\s*\}?|int\}?\s*\(\s*B\s*\)|B\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      - r\s*/\s*2
      teoria:
      - T1.14
      - T1.16
    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera de $B$.
      idea: |
        Tractar per separat els punts de $B$ (aprofitant l'apartat anterior) i els que no hi són. Per als segons, és útil saber si $B$ és tancat: és el conjunt de zeros d'una funció contínua.
      detall: |
        Si $p\in B$, tota bola $B_r(p)$ conté $p\in B$ i, per l'apartat anterior, un punt de $B^c$: $p\in\mathrm{Fr}\,B$. $B=f^{-1}(\{0\})$ amb $f(x,y)=x-\lambda y$ contínua i $\{0\}$ tancat, així que $B$ és tancat (Teorema 17(d) del Tema 2) i $B^c$ és obert: tot punt de fora de $B$ té una bola dins $B^c$ i no és frontera. Per tant $\mathrm{Fr}\,B=B$.
      fuites:
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*B\s*\)?\s*=\s*B\b
      teoria:
      - T1.14
      - T1.11
      - T2.17
    - id: adherencia
      titol: Adherència
      objectiu: |
        Determinar l'adherència $\overline{B}$.
      idea: |
        Usar el que ja saps sobre si $B$ és tancat i la caracterització dels tancats per la seva clausura.
      detall: |
        $B$ és tancat (és $f^{-1}(\{0\})$ amb $f(x,y)=x-\lambda y$ contínua), i per la Proposició 17(ii) $\overline{B}=B$.
      fuites:
      - (\\overline|\\bar)\{?\s*B\s*\}?\s*=\s*B\b
      teoria:
      - T1.17
      - T2.17
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt derivat $B'$.
      idea: |
        Decidir si $B$ té punts aïllats: per a un punt de $B$, construir una successió de punts de $B$, diferents d'ell, que hi convergeixi (desplaçant-se sobre la recta).
      detall: |
        Si $p=(\lambda y_0,y_0)\in B$, els punts $p_n=(\lambda(y_0+1/n),y_0+1/n)$ són de $B$, diferents de $p$, i $\|p_n-p\|=\frac{1}{n}\sqrt{1+\lambda^2}\to 0$. Per la Proposició 19(i), $B\subseteq B'$; i $B'\subseteq\overline{B}=B$. Per tant $B'=B$.
      fuites:
      - B('|\^\{?\\prime\}?)\s*=\s*B\b
      teoria:
      - T1.14
      - T1.19
    errors_comuns:
    - id: recta_amb_interior
      descripcio: |
        Afirma que $B$ té interior no buit (o que és obert) perquè la recta és "infinita" o perquè ho seria dins de $\mathbb{R}$.
      pregunta: |
        Agafa un punt de la recta i una bola petitíssima al seu voltant dins del pla. Tots els punts d'aquesta bola són de la recta?
    - id: frontera_sense_tancat
      descripcio: |
        Diu que la frontera és $B$ mirant només els punts de $B$, sense justificar que els punts de fora no són frontera.
      pregunta: |
        Per a un punt que no és de la recta, hi ha alguna bola centrada en ell que no talli la recta? Com ho garanteixes en general?
    - id: casos_lambda
      descripcio: |
        Pensa que el resultat depèn de $\lambda$ (per exemple, que per $\lambda=0$ el conjunt és diferent en natura).
      pregunta: |
        Per a $\lambda=0$, quin conjunt és $B$? És qualitativament diferent del cas general?
    nota_professor: |
      Alternativa per veure que $B$ és tancat: la distància d'un punt $q\notin B$ a la recta és $\frac{|q_1-\lambda q_2|}{\sqrt{1+\lambda^2}}>0$, i la bola amb aquest radi no talla $B$.
  - id: t1-7c
    apartat: c
    tipus: calcul
    enunciat: |
      $C=\{(x,y)\in\mathbb{R}^2\mid xy=1\}$.
    teoria:
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        $C$ és la hipèrbola equilàtera $y=1/x$: $\mathring{C}=\varnothing$, $\mathrm{Fr}\,C=C$, $\overline{C}=C$ ($C$ és tancat) i $C'=C$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*C\s*\}?|int\}?\s*\(\s*C\s*\)|C\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*C\s*\)?\s*=\s*C\b
      - (\\overline|\\bar)\{?\s*C\s*\}?\s*=\s*C\b
      - C('|\^\{?\\prime\}?)\s*=\s*C\b
    passos:
    - id: interior
      titol: Interior
      objectiu: |
        Decidir si $C$ té punts interiors.
      idea: |
        Donat un punt de la corba i un radi, moure's una mica en una de les coordenades i comprovar que l'equació deixa de complir-se.
      detall: |
        Sigui $(x_0,y_0)\in C$ (llavors $x_0\neq 0$) i $r>0$. El punt $(x_0,y_0+r/2)$ és a la bola i $x_0(y_0+r/2)=1+x_0r/2\neq 1$. Per tant cap bola centrada en un punt de $C$ hi està continguda: $C$ no té punts interiors, $\mathring{C}=\varnothing$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*C\s*\}?|int\}?\s*\(\s*C\s*\)|C\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      - 1\s*\+\s*x_\{?0\}?\s*r
      teoria:
      - T1.14
      - T1.16
    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera de $C$.
      idea: |
        Els punts de $C$ ja els tens controlats per l'apartat anterior. Per als de fora, decideix si $C$ és tancat escrivint-lo com a antiimatge d'un tancat per una funció contínua.
      detall: |
        Si $p\in C$, tota bola centrada en $p$ conté $p\in C$ i un punt de $C^c$: $p\in\mathrm{Fr}\,C$. $C=f^{-1}(\{1\})$ amb $f(x,y)=xy$ contínua, de manera que $C$ és tancat (Teorema 17(d) del Tema 2) i $C^c$ és obert: els punts de fora de $C$ són exteriors. Per tant $\mathrm{Fr}\,C=C$.
      fuites:
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*C\s*\)?\s*=\s*C\b
      teoria:
      - T1.14
      - T1.11
      - T2.17
    - id: adherencia
      titol: Adherència
      objectiu: |
        Determinar l'adherència $\overline{C}$.
      idea: |
        Relacionar la clausura amb el fet de ser tancat.
      detall: |
        $C$ és tancat, així que per la Proposició 17(ii) $\overline{C}=C$. (En particular, cap punt dels eixos és adherent, tot i que la hipèrbola s'hi acosta asimptòticament: als eixos $xy=0\neq1$, i $C^c$ és obert.)
      fuites:
      - (\\overline|\\bar)\{?\s*C\s*\}?\s*=\s*C\b
      teoria:
      - T1.17
      - T2.17
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt derivat $C'$.
      idea: |
        Per a un punt de la corba, construir punts de la corba diferents d'ell que s'hi acostin, movent lleugerament la primera coordenada.
      detall: |
        Si $(x_0,1/x_0)\in C$, per a $n$ prou gran ($n>1/|x_0|$) es té $x_0+1/n\neq 0$ i $p_n=\left(x_0+\frac1n,\frac{1}{x_0+1/n}\right)\in C$, $p_n\neq(x_0,1/x_0)$, i $p_n\to(x_0,1/x_0)$ per la continuïtat de $t\mapsto 1/t$ en $x_0\neq0$. Per la Proposició 19(i), $C\subseteq C'\subseteq\overline{C}=C$: $C'=C$.
      fuites:
      - C('|\^\{?\\prime\}?)\s*=\s*C\b
      teoria:
      - T1.14
      - T1.19
    errors_comuns:
    - id: asimptotes
      descripcio: |
        Afegeix els eixos de coordenades (les asímptotes) a la frontera o a l'adherència, perquè "la corba s'hi acosta".
      pregunta: |
        Pren el punt $(1,0)$. Hi ha punts de $C$ tan a prop d'ell com vulguis, o n'hi ha una distància mínima?
    - id: interior_corba
      descripcio: |
        Considera que la corba té interior (confonent-la amb la regió $xy>1$ o $xy<1$).
      pregunta: |
        El conjunt està definit per una igualtat o per una desigualtat? Què passa amb el producte $xy$ si mous lleugerament un punt de la corba?
    - id: tancat_sense_justificar
      descripcio: |
        Afirma que $C$ és tancat sense cap argument (o argumentant que és "fitat", que no ho és).
      pregunta: |
        Quin resultat del curs et permet dir que un conjunt definit per una igualtat amb funcions contínues és tancat?
    nota_professor: |
      $C$ és tancat però no fitat (i no és compacte); té dues components connexes. Bon exemple per desmuntar la intuïció que les asímptotes són "a la vora".
  - id: t1-7d
    apartat: d
    tipus: calcul
    enunciat: |
      $D=\{(x,y)\in\mathbb{R}^2\mid 0<x<1,\ y=0\}$.
    teoria:
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        Com a subconjunt de $\mathbb{R}^2$: $\mathring{D}=\varnothing$; $\mathrm{Fr}\,D=\overline{D}=D'=[0,1]\times\{0\}=\{(x,0)\mid 0\leq x\leq 1\}$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*D\s*\}?|int\}?\s*\(\s*D\s*\)|D\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      - \[\s*0\s*,\s*1\s*\]
      - 0\s*(\\leq|\\le|≤)\s*x(_\{?0\}?)?\s*(\\leq|\\le|≤)\s*1
    passos:
    - id: interior
      titol: Interior
      objectiu: |
        Decidir si $D$ té punts interiors com a subconjunt del pla.
      idea: |
        Recordar que les boles són de $\mathbb{R}^2$: mirar si una bola centrada en un punt de $D$ conté punts amb segona coordenada no nul·la.
      detall: |
        Si $(x_0,0)\in D$ i $r>0$, el punt $(x_0,r/2)$ és a $B_r((x_0,0))$ i no és de $D$. Per tant $D$ no té punts interiors, $\mathring{D}=\varnothing$ (encara que, com a subconjunt de $\mathbb{R}$, l'interval $(0,1)$ sigui obert).
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*D\s*\}?|int\}?\s*\(\s*D\s*\)|D\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      - \(\s*x_\{?0\}?\s*,\s*r\s*/\s*2\s*\)
      teoria:
      - T1.14
      - T1.16
    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera de $D$.
      idea: |
        Com que no hi ha punts interiors, un punt és de la frontera si i només si tota bola centrada en ell talla $D$. Classificar els punts del pla (de la recta que conté $D$ o no; dins o fora de l'interval de valors de $x$) i, per a cada tipus, decidir si tota bola centrada en ell toca $D$.
      detall: |
        Si $0\leq x_0\leq 1$, tota bola $B_r((x_0,0))$ conté punts $(x,0)$ amb $0<x<1$ i el punt $(x_0,r/2)\notin D$: és de la frontera. Si $(a,b)$ té $b\neq0$, la bola de radi $|b|$ no talla $D$; si $b=0$ i $a<0$ (o $a>1$), la bola de radi $|a|$ (o $a-1$) no talla $D$. Per tant $\mathrm{Fr}\,D=[0,1]\times\{0\}$.
      fuites:
      - \[\s*0\s*,\s*1\s*\]
      - 0\s*(\\leq|\\le|≤)\s*x_?\{?0?\}?\s*(\\leq|\\le|≤)\s*1
      teoria:
      - T1.14
    - id: adherencia
      titol: Adherència
      objectiu: |
        Determinar l'adherència $\overline{D}$.
      idea: |
        Trobar un tancat que contingui $D$ i veure que tots els seus punts són límit de punts de $D$; prestar atenció als extrems.
      detall: |
        $S=[0,1]\times\{0\}=\{y=0\}\cap\{x\geq0\}\cap\{x\leq1\}$ és tancat (Corol·lari 18(ii) del Tema 2 i Proposició 13(ii)) i conté $D$, així que $\overline{D}\subseteq S$. A més $(1/n,0)\to(0,0)$, $(1-1/n,0)\to(1,0)$ amb termes a $D$ (per $n\geq2$), i $D\subseteq\overline{D}$. Per tant $\overline{D}=[0,1]\times\{0\}$.
      fuites:
      - \[\s*0\s*,\s*1\s*\]
      teoria:
      - T1.16
      - T1.19
      - T1.13
      - T2.18
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt derivat $D'$.
      idea: |
        Per a cada punt adherent, trobar una successió de punts de $D$ diferents d'ell que hi convergeixi.
      detall: |
        Si $0\leq x_0<1$, $p_n=\left(x_0+\frac{1-x_0}{n+1},0\right)\in D$, $p_n\neq(x_0,0)$ i $p_n\to(x_0,0)$. Per a $x_0=1$, $(1-1/n,0)$ ($n\geq2$). Per la Proposició 19(i), $\overline{D}\subseteq D'$, i com que $D'\subseteq\overline{D}$, $D'=[0,1]\times\{0\}$.
      fuites:
      - \[\s*0\s*,\s*1\s*\]
      - \\frac\{?\s*1\s*-\s*x_\{?0\}?\s*\}?\{?\s*n\s*\+\s*1
      teoria:
      - T1.14
      - T1.19
    errors_comuns:
    - id: topologia_de_R
      descripcio: |
        Treballa com si $D$ fos l'interval $(0,1)\subset\mathbb{R}$ i diu que és obert, amb interior $(0,1)$ i frontera formada només pels dos extrems.
      pregunta: |
        On viuen les boles que fas servir, a $\mathbb{R}$ o a $\mathbb{R}^2$? Una bola del pla centrada en un punt de $D$ queda dins de $D$?
    - id: oblida_extrems
      descripcio: |
        Oblida que els extrems $(0,0)$ i $(1,0)$ són adherents i d'acumulació encara que no pertanyin a $D$.
      pregunta: |
        El punt $(0,0)$ no és de $D$. Hi ha punts de $D$ tan a prop com vulguis d'ell?
    - id: frontera_extrems_nomes
      descripcio: |
        Dona com a frontera només els dos extrems (traslladant el resultat de $\mathbb{R}$).
      pregunta: |
        Per a un punt intern del segment, com $(1/2,0)$, tota bola centrada en ell conté punts de fora de $D$?
    nota_professor: |
      L'objectiu és que vegin que interior i frontera depenen de l'espai ambient. A $\mathbb{R}^2$, $D$ no és ni obert ni tancat.
  - id: t1-7e
    apartat: e
    tipus: calcul
    enunciat: |
      $E=A\setminus\{(0,1)\}$.
    teoria:
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        (Amb $A=\{y>0\}$ de l'apartat (a).) $\mathring{E}=E$ ($E$ és obert); $\mathrm{Fr}\,E=\{(x,0)\mid x\in\mathbb{R}\}\cup\{(0,1)\}$; $\overline{E}=\{(x,y)\mid y\geq0\}$; $E'=\overline{E}=\{(x,y)\mid y\geq0\}$ (el punt $(0,1)$ hi pertany).
      fuites:
      - y\s*(\\geq|\\ge|\\geqslant|≥)\s*0
      - y\s*=\s*0\b
      - (\\mathring\{?\s*E\s*\}?|int\}?\s*\(\s*E\s*\)|E\^\{?\\circ\}?)\s*=\s*E\b
      - \\cup\s*\\\{\s*\(\s*0\s*,\s*1\s*\)\s*\\\}
    passos:
    - id: interior
      titol: Interior
      objectiu: |
        Determinar l'interior d'$E$ (es poden usar els resultats de l'apartat (a)).
      idea: |
        Escriure $E$ com a intersecció de dos conjunts dels quals saps si són oberts, i aplicar les propietats dels oberts.
      detall: |
        $E=A\cap(\mathbb{R}^2\setminus\{(0,1)\})$. $A$ és obert (apartat (a)); $\mathbb{R}^2\setminus\{p\}$ és obert, ja que si $q\neq p$, $B_{\|q-p\|}(q)$ no conté $p$. La intersecció finita d'oberts és oberta (Proposició 12(iii)): $E$ és obert i $\mathring{E}=E$.
      fuites:
      - (\\mathring\{?\s*E\s*\}?|int\}?\s*\(\s*E\s*\)|E\^\{?\\circ\}?)\s*=\s*E\b
      teoria:
      - T1.11
      - T1.12
      - T1.16
    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera d'$E$.
      idea: |
        Partir de la frontera d'$A$ i estudiar a part el punt que s'ha tret: tota bola centrada en ell, conté punts d'$E$? i de fora d'$E$?
      detall: |
        Els punts amb $y_0<0$ són exteriors i els d'$E$ són interiors. Els de la recta $y=0$ són de la frontera com a l'apartat (a): tota bola $B_r((x_0,0))$ conté $(x_0,0)\notin E$ i el punt $(x_0,t)$ amb $t=\min\{r,1\}/2$, que és d'$E$ (com que $0<t<1$, no és $(0,1)$). El punt $(0,1)$: tota bola centrada en ell el conté ($\notin E$) i conté punts $(0,1+t)\in E$ amb $0<t<r$. Per tant $\mathrm{Fr}\,E=\{(x,0)\mid x\in\mathbb{R}\}\cup\{(0,1)\}$.
      fuites:
      - \\cup\s*\\\{\s*\(\s*0\s*,\s*1\s*\)\s*\\\}
      - y\s*=\s*0\b
      teoria:
      - T1.14
    - id: adherencia
      titol: Adherència
      objectiu: |
        Determinar l'adherència $\overline{E}$.
      idea: |
        Comparar amb l'adherència d'$A$ (monotonia de la clausura) i decidir si el punt eliminat continua essent adherent.
      detall: |
        $E\subseteq A$ implica $\overline{E}\subseteq\overline{A}=\{y\geq0\}$ (Proposició 17(i)). Recíprocament, $\overline{E}\supseteq E$, conté la recta $y=0$ (limits de $(x_0,1/n)$, $n\geq 2$) i conté $(0,1)=\lim(0,1+1/n)$. Per tant $\overline{E}=\{(x,y)\mid y\geq0\}$.
      fuites:
      - y\s*(\\geq|\\ge|\\geqslant|≥)\s*0
      teoria:
      - T1.17
      - T1.19
      - T1.16
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt derivat $E'$.
      idea: |
        Decidir si algun punt adherent és aïllat; en particular, mirar què passa amb el punt eliminat.
      detall: |
        Cap punt de $\overline{E}$ és aïllat: per a $(x_0,y_0)$ amb $y_0\geq0$, $(x_0,y_0+1/n)$ són punts d'$E$ diferents de $(x_0,y_0)$ que hi convergeixen (exceptuant com a molt un terme igual a $(0,1)$, que es pot ometre). En particular $(0,1)\in E'$ tot i no ser d'$E$. Per tant $E'=\overline{E}=\{(x,y)\mid y\geq0\}$.
      fuites:
      - y\s*(\\geq|\\ge|\\geqslant|≥)\s*0
      - E('|\^\{?\\prime\}?)\s*=\s*(\\overline|\\bar)
      teoria:
      - T1.14
      - T1.19
    errors_comuns:
    - id: forat_tanca
      descripcio: |
        Pensa que treure un punt fa que $E$ deixi de ser obert (o que el converteix en tancat).
      pregunta: |
        Per a un punt d'$E$ molt a prop del punt eliminat, pots triar una bola prou petita que no el contingui?
    - id: oblida_punt_frontera
      descripcio: |
        Dona la mateixa frontera que a l'apartat (a), oblidant el punt eliminat.
      pregunta: |
        Tota bola centrada en $(0,1)$ conté punts d'$E$? I punts que no són d'$E$?
    - id: punt_eliminat_no_acumulacio
      descripcio: |
        Creu que $(0,1)$ no és d'acumulació (ni adherent) perquè no pertany a $E$.
      pregunta: |
        La definició de punt d'acumulació demana que el punt sigui del conjunt? Quins punts d'$E$ trobes a prop de $(0,1)$?
    nota_professor: |
      Il·lustra que $\overline{E}=\overline{A}$ i $\mathring{E}\neq\mathring{A}$: treure un punt no canvia la clausura però sí la frontera.
  - id: t1-7f
    apartat: f
    tipus: calcul
    enunciat: |
      $F=B\cup\{(0,-1)\}$.
    teoria:
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        (Amb $B=\{x=\lambda y\}$ de l'apartat (b).) Per a tot $\lambda$: $\mathring{F}=\varnothing$, $\mathrm{Fr}\,F=F$, $\overline{F}=F$ ($F$ és tancat) i $F'=B$. Si $\lambda\neq0$, $(0,-1)\notin B$ és un punt aïllat de $F$ (és de $F$ però no de $F'$); si $\lambda=0$, $(0,-1)\in B$ i $F=B$, de manera que també $F'=B=F$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*F\s*\}?|int\}?\s*\(\s*F\s*\)|F\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*F\s*\)?\s*=\s*F\b
      - (\\overline|\\bar)\{?\s*F\s*\}?\s*=\s*F\b
      - F('|\^\{?\\prime\}?)\s*=\s*B\b
    passos:
    - id: posicio_punt
      titol: On és el punt afegit?
      objectiu: |
        Decidir si el punt $(0,-1)$ ja pertany a $B$ (pot dependre del paràmetre), usant els resultats de l'apartat (b).
      idea: |
        Substituir el punt a l'equació de la recta i discutir segons $\lambda$.
      detall: |
        $(0,-1)\in B\iff 0=\lambda\cdot(-1)\iff\lambda=0$. Si $\lambda=0$, $F=B$ i tot coincideix amb l'apartat (b). Suposem a partir d'ara $\lambda\neq0$: el punt queda fora de la recta, a distància $\frac{|\lambda|}{\sqrt{1+\lambda^2}}>0$.
      fuites:
      - \\lambda\s*=\s*0\b
      - \|\s*\\lambda\s*\|\s*/\s*\\sqrt|\\frac\{\s*\|\s*\\lambda\s*\|\s*\}
      teoria: []
    - id: interior
      titol: Interior
      objectiu: |
        Decidir si $F$ té punts interiors.
      idea: |
        Per als punts de la recta, reutilitzar l'apartat (b); per al punt afegit, mirar si una bola centrada en ell pot quedar dins de $F$.
      detall: |
        Per a $p\in B$, tota bola conté punts de fora de $B$ arbitràriament a prop de $p$, que podem triar diferents de $(0,-1)$, així que no són de $F$. Tota bola centrada en $(0,-1)$ conté punts $(t,-1)$, $t\neq0$ petit, que no són de $F$. Per tant $F$ no té punts interiors, $\mathring{F}=\varnothing$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*F\s*\}?|int\}?\s*\(\s*F\s*\)|F\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      teoria:
      - T1.14
      - T1.16
    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera de $F$.
      idea: |
        Per als punts de $F$, aprofitar que no són interiors. Per als de fora, decidir si $F$ és tancat: és unió de dos conjunts dels quals ja saps si són tancats.
      detall: |
        $B$ és tancat (apartat (b)) i $\{(0,-1)\}$ també ($\mathbb{R}^2\setminus\{p\}$ és obert); la unió finita de tancats és tancada (Proposició 13(iii)), així que $F^c$ és obert i els punts de fora de $F$ són exteriors. Tot punt de $F$ és de la frontera: tota bola el conté i, com que $\mathring{F}=\varnothing$, conté punts de $F^c$. Per tant $\mathrm{Fr}\,F=F$.
      fuites:
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*F\s*\)?\s*=\s*F\b
      teoria:
      - T1.13
      - T1.14
      - T1.11
    - id: adherencia
      titol: Adherència
      objectiu: |
        Determinar l'adherència $\overline{F}$.
      idea: |
        Relacionar la clausura amb el fet de ser tancat.
      detall: |
        $F$ és tancat (unió de dos tancats), així que per la Proposició 17(ii) $\overline{F}=F$. En particular, el punt aïllat $(0,-1)$ és adherent.
      fuites:
      - (\\overline|\\bar)\{?\s*F\s*\}?\s*=\s*F\b
      teoria:
      - T1.13
      - T1.17
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt derivat $F'$.
      idea: |
        Els punts de la recta es comporten com a l'apartat (b). Per al punt afegit, decidir si hi ha punts de $F$ diferents d'ell tan a prop com es vulgui.
      detall: |
        Si $p\in B$, els punts de $B$ diferents de $p$ que hi convergeixen (apartat (b)) són de $F$: $B\subseteq F'$. Si $\lambda\neq0$, sigui $\delta=\frac{|\lambda|}{\sqrt{1+\lambda^2}}$ la distància de $(0,-1)$ a $B$: $B_\delta((0,-1))\cap F=\{(0,-1)\}$, així que $(0,-1)$ és aïllat i no és d'acumulació. Com que $F'\subseteq\overline{F}=F$, resulta $F'=B$.
      fuites:
      - F('|\^\{?\\prime\}?)\s*=\s*B\b
      - B_\\delta
      teoria:
      - T1.14
      - T1.19
    errors_comuns:
    - id: no_discuteix_lambda
      descripcio: |
        No comprova si $(0,-1)$ és a la recta i tracta el cas $\lambda=0$ igual que els altres (o al revés).
      pregunta: |
        El punt afegit pot estar ja sobre la recta per a algun valor del paràmetre? Què passa llavors amb $F$?
    - id: aillat_acumulacio
      descripcio: |
        Inclou el punt afegit a $F'$ perquè pertany a $F$, confonent adherència i acumulació.
      pregunta: |
        En una bola petita al voltant de $(0,-1)$, quins altres punts de $F$ hi trobes?
    - id: aillat_interior
      descripcio: |
        Pensa que un punt aïllat és interior (perquè "està sol" dins una bola).
      pregunta: |
        Per ser interior, la bola ha d'estar continguda dins $F$. Ho està una bola centrada en $(0,-1)$?
    nota_professor: |
      La distància de $(a,b)$ a la recta $x-\lambda y=0$ és $\frac{|a-\lambda b|}{\sqrt{1+\lambda^2}}$. Exemple bàsic de punt aïllat: és adherent i de la frontera, però no d'acumulació.
  - id: t1-7g
    apartat: g
    tipus: calcul
    enunciat: |
      $G=\{(x,y)\in\mathbb{R}^2\mid x^2+y^2\leq 1,\ x\neq 0\}$.
    teoria:
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        $\mathring{G}=\{(x,y)\mid x^2+y^2<1,\ x\neq0\}$; $\mathrm{Fr}\,G=\{(x,y)\mid x^2+y^2=1\}\cup\{(0,y)\mid |y|\leq 1\}$ (la circumferència unitat i el diàmetre vertical); $\overline{G}=G'=\{(x,y)\mid x^2+y^2\leq1\}$ (el disc tancat).
      fuites:
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*<\s*1
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*=\s*1
      - \|\s*y\s*\|\s*(\\leq|\\le|≤)\s*1
      - (\\overline|\\bar)\{?\s*G\s*\}?\s*=\s*\\\{\s*\(\s*x\s*,\s*y\s*\)\s*(\\mid|:|\|)\s*x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*(\\leq|\\le|≤)\s*1\s*\\\}
    passos:
    - id: interior
      titol: Interior
      objectiu: |
        Determinar l'interior de $G$.
      idea: |
        Proposar com a candidat un obert contingut a $G$ definit per desigualtats estrictes, i comprovar que els punts de $G$ que hi queden fora no són interiors.
      detall: |
        $U=\{x^2+y^2<1\}\cap\{x^2>0\}$ és obert (Corol·lari 18(i) del Tema 2 i Proposició 12(iii)) i $U\subseteq G$, així que $U\subseteq\mathring{G}$. Si $p\in G$ amb $\|p\|=1$, els punts $(1+t)p$, $t>0$ petit, són a tota bola centrada en $p$ i no són de $G$. Per tant $\mathring{G}=\{x^2+y^2<1,\ x\neq0\}$.
      fuites:
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*<\s*1
      - \(\s*1\s*\+\s*t\s*\)\s*p
      teoria:
      - T1.14
      - T1.12
      - T2.18
    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera de $G$.
      idea: |
        Classificar els punts del pla: els de l'interior ja trobat, els altres punts de $G$, els punts del disc tancat que no són de $G$ i els de fora del disc. Per a cada tipus, decidir si tota bola centrada en ell talla $G$ i el seu complementari.
      detall: |
        Si $x_0^2+y_0^2=1$ i $x_0\neq0$: el punt és de $G$ i tota bola conté $(1+t)(x_0,y_0)\notin G$. Si $x_0^2+y_0^2=1$ i $x_0=0$, o bé $x_0=0$, $|y_0|<1$: el punt no és de $G$, i tota bola $B_r$ conté punts $(s,(1-s)y_0)\in G$ amb $s>0$ petit ($s^2+(1-s)^2y_0^2\leq s^2+(1-s)^2<1$ per $0<s<1$). Els punts amb $x^2+y^2>1$ són exteriors i els de $\mathring{G}$ són interiors. Per tant $\mathrm{Fr}\,G=\{x^2+y^2=1\}\cup\{(0,y)\mid |y|\leq1\}$.
      fuites:
      - x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*=\s*1
      - \|\s*y\s*\|\s*(\\leq|\\le|≤)\s*1
      - \(\s*s\s*,\s*\(\s*1\s*-\s*s\s*\)\s*y_\{?0\}?\s*\)
      teoria:
      - T1.14
    - id: adherencia
      titol: Adherència
      objectiu: |
        Determinar l'adherència $\overline{G}$.
      idea: |
        Trobar un tancat senzill que contingui $G$ i comprovar que cada punt seu és límit de punts de $G$, especialment els del segment que s'ha tret.
      detall: |
        El disc tancat $\overline{B}_1(0)=\{x^2+y^2\leq1\}$ és tancat (Proposició 13(i)) i conté $G$, així que $\overline{G}\subseteq\overline{B}_1(0)$. Si $x_0\neq0$ el punt ja és de $G$. Si $x_0=0$, $|y_0|\leq1$, la successió $(1/n,(1-1/n)y_0)$ és de $G$ i hi convergeix. Per tant $\overline{G}=\{(x,y)\mid x^2+y^2\leq1\}$.
      fuites:
      - (\\overline|\\bar)\{?\s*G\s*\}?\s*=\s*\\\{\s*\(\s*x\s*,\s*y\s*\)\s*(\\mid|:|\|)\s*x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*(\\leq|\\le|≤)\s*1\s*\\\}
      - \(\s*1\s*/\s*n\s*,\s*\(\s*1\s*-\s*1\s*/\s*n\s*\)\s*y_\{?0\}?\s*\)
      teoria:
      - T1.13
      - T1.16
      - T1.19
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt derivat $G'$.
      idea: |
        Mirar si les successions que has fet servir per a l'adherència tenen els termes diferents del límit, o si es poden modificar perquè ho siguin.
      detall: |
        Sigui $p=(x_0,y_0)$ del disc tancat. Si $x_0=0$, la successió anterior $(1/n,(1-1/n)y_0)$ té termes diferents de $p$ (primera coordenada no nul·la). Si $x_0\neq0$, $p_n=(1-\frac1n)(x_0,y_0)$ és de $G$ per $n\geq2$ (norma $<1$ i primera coordenada no nul·la), diferent de $p$ i convergeix a $p$. Per la Proposició 19(i), $\overline{G}\subseteq G'\subseteq\overline{G}$: $G'=\{(x,y)\mid x^2+y^2\leq1\}$.
      fuites:
      - G('|\^\{?\\prime\}?)\s*=\s*\\\{\s*\(\s*x\s*,\s*y\s*\)\s*(\\mid|:|\|)\s*x\^\{?2\}?\s*\+\s*y\^\{?2\}?\s*(\\leq|\\le|≤)\s*1
      - G('|\^\{?\\prime\}?)\s*=\s*(\\overline|\\bar)
      teoria:
      - T1.14
      - T1.19
    errors_comuns:
    - id: oblida_diametre
      descripcio: |
        Dona com a frontera només la circumferència, oblidant el segment $\{x=0\}$ que s'ha tret del disc.
      pregunta: |
        El punt $(0,0)$ és de $G$? Tota bola centrada en $(0,0)$ conté punts de $G$ i punts de fora de $G$?
    - id: interior_inclou_vora
      descripcio: |
        Inclou a l'interior els punts de la circumferència amb $x\neq0$, perquè són de $G$.
      pregunta: |
        Per a un punt de $G$ sobre la circumferència, una bola centrada en ell queda dins $G$?
    - id: adherencia_sense_segment
      descripcio: |
        Creu que l'adherència és $G$ amb la circumferència, però sense els punts del segment vertical.
      pregunta: |
        Pots trobar una successió de punts de $G$ que s'acosti al punt $(0,1/2)$?
    nota_professor: |
      $G$ no és ni obert ni tancat. La frontera inclou el segment vertical tot i que $\overline{G}$ és tot el disc: $\mathrm{Fr}\,G=\overline{G}\setminus\mathring{G}$.
  - id: t1-7h
    apartat: h
    tipus: calcul
    enunciat: |
      $H=\mathbb{Q}\subset\mathbb{R}$.
    teoria:
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        $\mathring{H}=\varnothing$; $\mathrm{Fr}\,H=\mathbb{R}$; $\overline{H}=\mathbb{R}$; $H'=\mathbb{R}$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*(H|\\mathbb\{?Q\}?)\s*\}?|int\}?\s*\(\s*(H|\\mathbb\{?Q\}?)\s*\)|(H|\\mathbb\{?Q\}?)\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*(H|\\mathbb\{?Q\}?)\s*\)?\s*=\s*\\mathbb\{?R
      - (\\overline|\\bar)\{?\s*(H|\\mathbb\{?Q\}?)\s*\}?\s*=\s*\\mathbb\{?R
      - (H|\\mathbb\{?Q\}?)('|\^\{?\\prime\}?)\s*=\s*\\mathbb\{?R
    passos:
    - id: interior
      titol: Interior
      objectiu: |
        Decidir si $\mathbb{Q}$ té punts interiors a $\mathbb{R}$.
      idea: |
        Les boles de $\mathbb{R}$ són intervals oberts. Usar que tot interval obert no buit conté nombres irracionals (densitat dels irracionals, fet de la recta real que no és als apunts com a resultat numerat).
      detall: |
        Si $q\in\mathbb{Q}$ i $r>0$, el nombre $q+\frac{\sqrt2}{n}$ amb $n>\sqrt2/r$ és irracional i és a $(q-r,q+r)$. Cap interval centrat en un racional està contingut a $\mathbb{Q}$: $H$ no té punts interiors, $\mathring{H}=\varnothing$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*(H|\\mathbb\{?Q\}?)\s*\}?|int\}?\s*\(\s*(H|\\mathbb\{?Q\}?)\s*\)|(H|\\mathbb\{?Q\}?)\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      - q\s*\+\s*\\frac\{?\s*\\sqrt
      teoria:
      - T1.14
      - T1.16
    - id: frontera
      titol: Frontera
      objectiu: |
        Determinar la frontera de $\mathbb{Q}$ a $\mathbb{R}$.
      idea: |
        Per a un real qualsevol, mirar si tot interval centrat en ell conté racionals i irracionals (densitat de $\mathbb{Q}$ i de $\mathbb{R}\setminus\mathbb{Q}$).
      detall: |
        Sigui $x\in\mathbb{R}$ i $r>0$. Prenem $n>2/r$ i $q=\lfloor nx\rfloor/n\in\mathbb{Q}$, que compleix $|q-x|<1/n<r$; el nombre $q+\frac{\sqrt2}{2n}$ és irracional i $\left|q+\frac{\sqrt2}{2n}-x\right|<\frac1n+\frac{\sqrt2}{2n}<\frac2n<r$. Així $(x-r,x+r)$ talla $\mathbb{Q}$ i el seu complementari. Per tant tot real és de la frontera: $\mathrm{Fr}\,H=\mathbb{R}$.
      fuites:
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*(H|\\mathbb\{?Q\}?)\s*\)?\s*=\s*\\mathbb\{?R
      - \\lfloor\s*n\s*x\s*\\rfloor
      teoria:
      - T1.14
    - id: adherencia
      titol: Adherència
      objectiu: |
        Determinar l'adherència de $\mathbb{Q}$ a $\mathbb{R}$.
      idea: |
        Per a cada real, construir una successió de racionals que hi convergeixi.
      detall: |
        Per a $x\in\mathbb{R}$, $q_n=\lfloor nx\rfloor/n\in\mathbb{Q}$ compleix $|q_n-x|<1/n\to0$. Per la Proposició 19(ii), $x\in\overline{H}$: $\overline{H}=\mathbb{R}$.
      fuites:
      - (\\overline|\\bar)\{?\s*(H|\\mathbb\{?Q\}?)\s*\}?\s*=\s*\\mathbb\{?R
      - \\lfloor\s*n\s*x\s*\\rfloor
      teoria:
      - T1.16
      - T1.19
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt de punts d'acumulació de $\mathbb{Q}$.
      idea: |
        Aconseguir que els racionals que s'acosten a un real siguin diferents d'ell.
      detall: |
        Si $x\in\mathbb{R}$, tot interval $(x-r,x+r)$ conté infinits racionals (densitat aplicada a $(x,x+r)$), en particular un de diferent de $x$. Alternativament, $q_n=\lfloor nx\rfloor/n-1/n$ és racional, diferent de $x$ (perquè $q_n<x$) i $|q_n-x|<2/n$. Per tant $H'=\mathbb{R}$.
      fuites:
      - (H|\\mathbb\{?Q\}?)('|\^\{?\\prime\}?)\s*=\s*\\mathbb\{?R
      teoria:
      - T1.14
      - T1.19
    errors_comuns:
    - id: interior_Q
      descripcio: |
        Afirma que $\mathring{\mathbb{Q}}=\mathbb{Q}$ perquè "els punts de $\mathbb{Q}$ són de $\mathbb{Q}$", sense mirar les boles.
      pregunta: |
        Un interval $(q-r,q+r)$, per petit que sigui, està format només per racionals?
    - id: frontera_buida
      descripcio: |
        Pensa que $\mathbb{Q}$ no té frontera (o que la frontera són "els irracionals") sense comprovar la definició per als racionals.
      pregunta: |
        Si prens un racional, tota bola centrada en ell conté punts de $\mathbb{Q}$ i punts de fora de $\mathbb{Q}$?
    - id: acumulacio_nomes_Q
      descripcio: |
        Dona $\mathbb{Q}'=\mathbb{Q}$, oblidant que els irracionals també són límit de racionals.
      pregunta: |
        Pots trobar racionals tan a prop com vulguis de $\sqrt2$?
    nota_professor: |
      La densitat de $\mathbb{Q}$ i de $\mathbb{R}\setminus\mathbb{Q}$ a $\mathbb{R}$ no apareix com a resultat numerat als apunts (només s'usa a l'Exemple 23 amb els truncaments decimals de $\sqrt2$): es pot donar per coneguda del curs de Fonaments/Càlcul d'una variable. $\mathbb{Q}$ no és ni obert ni tancat a $\mathbb{R}$.
- num: 8
  font: null
  preambul: |
    Estudieu l'interior, la frontera, l'adherència i el conjunt de punts d'acumulació dels subconjunts següents, i decidiu si són oberts o tancats, o cap de les dues coses:
  indicacio: null
  exercicis:
  - id: t1-8a
    apartat: a
    tipus: calcul
    enunciat: |
      $A=\{(x,y,z)\in\mathbb{R}^3\mid x+y=1,\ x^2+y^2=9,\ \text{i } z=0\}$.
    teoria:
    - T1.11
    - T1.14
    - T1.16
    teoria_reservada: []
    resultat:
      valor: |
        $A=\left\{\left(\frac{1+\sqrt{17}}{2},\frac{1-\sqrt{17}}{2},0\right),\left(\frac{1-\sqrt{17}}{2},\frac{1+\sqrt{17}}{2},0\right)\right\}$ (dos punts). $\mathring{A}=\varnothing$, $\mathrm{Fr}\,A=\overline{A}=A$, $A'=\varnothing$. $A$ és tancat i no és obert.
      fuites:
      - (?<!si )\$A\$\s+és\s+tancat
      - tancat\s+(però|i)\s+no\s+(és\s+)?obert
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - \\sqrt\{?\s*17
      - A('|\^\{?\\prime\}?)\s*=\s*\\(varnothing|emptyset)
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*A\s*\)?\s*=\s*((\\overline|\\bar)\{?\s*A\s*\}?\s*=\s*)?A\b
    passos:
    - id: descriure
      titol: Descriure el conjunt
      objectiu: |
        Determinar explícitament quins punts formen $A$.
      idea: |
        Aïllar una variable de l'equació lineal i substituir-la a la quadràtica.
      detall: |
        $y=1-x$ i $x^2+(1-x)^2=9\iff x^2-x-4=0\iff x=\frac{1\pm\sqrt{17}}{2}$, amb $y=\frac{1\mp\sqrt{17}}{2}$, $z=0$. $A=\{P,Q\}$ té exactament dos punts, a distància $\|P-Q\|=\sqrt{34}$.
      fuites:
      - \\sqrt\{?\s*17
      - x\^\{?2\}?\s*-\s*x\s*-\s*4
      - \\sqrt\{?\s*34
      teoria: []
    - id: interior
      titol: Interior
      objectiu: |
        Decidir si $A$ té punts interiors a $\mathbb{R}^3$.
      idea: |
        Una bola de $\mathbb{R}^3$, quants punts té? Pot estar continguda en un conjunt com aquest?
      detall: |
        Tota bola $B_r(P)$ conté infinits punts (per exemple $P+(0,0,t)$, $0\leq t<r$), però $A$ en té dos. Per tant $A$ no té punts interiors, $\mathring{A}=\varnothing$.
      fuites:
      - no\s+té\s+(cap\s+)?punts?\s+interiors?|interior\s+(d.\s*\$?[^$\s]+\$?\s+)?(és\s+)?buit
      - (\\mathring\{?\s*A\s*\}?|int\}?\s*\(\s*A\s*\)|A\^\{?\\circ\}?)\s*=\s*\\(varnothing|emptyset)
      teoria:
      - T1.14
      - T1.16
    - id: acumulacio
      titol: Punts d'acumulació
      objectiu: |
        Determinar el conjunt derivat $A'$.
      idea: |
        Per a un punt qualsevol de l'espai, decidir si hi ha punts d'$A$ diferents d'ell tan a prop com es vulgui; tingues en compte quants punts té $A$.
      detall: |
        Sigui $x\in\mathbb{R}^3$ i $r=\min\{\|x-a\|\mid a\in A,\ a\neq x\}>0$ (mínim d'un nombre finit de distàncies positives). Llavors $B_r(x)\cap(A\setminus\{x\})=\varnothing$: $x\notin A'$. Per tant $A'=\varnothing$ (els dos punts són aïllats).
      fuites:
      - A('|\^\{?\\prime\}?)\s*=\s*\\(varnothing|emptyset)
      teoria:
      - T1.14
      - T1.16
    - id: adherencia_frontera
      titol: Adherència i frontera
      objectiu: |
        Determinar l'adherència i la frontera d'$A$.
      idea: |
        Usar la relació entre adherència, conjunt i punts d'acumulació; per a la frontera, combinar-ho amb l'interior.
      detall: |
        $\overline{A}=A\cup A'=A$. Tot punt d'$A$ és de la frontera (tota bola el conté i, com que $\mathring{A}=\varnothing$, conté punts de $A^c$), i un punt fora de $\overline{A}$ té una bola que no talla $A$. Per tant $\mathrm{Fr}\,A=\overline{A}=A$.
      fuites:
      - (Fr\}?|\\partial)\s*(\\[,;! ])?\s*\(?\s*A\s*\)?\s*=\s*((\\overline|\\bar)\{?\s*A\s*\}?\s*=\s*)?A\b
      - (\\overline|\\bar)\{?\s*A\s*\}?\s*=\s*A\s*\\cup\s*A('|\^\{?\\prime\}?)\s*=\s*A\b
      teoria:
      - T1.16
      - T1.14
    - id: obert_tancat
      titol: Obert o tancat
      objectiu: |
        Classificar $A$: obert, tancat, totes dues coses o cap.
      idea: |
        Comparar el conjunt amb la seva adherència i amb el seu interior.
      detall: |
        $\overline{A}=A$, així que $A$ és tancat (Proposició 17(ii)); com que $A\neq\varnothing$ i $\mathring{A}=\varnothing\neq A$, no és obert. Per tant $A$ és tancat però no és obert.
      fuites:
      - (?<!si )\$A\$\s+és\s+tancat
      - tancat\s+(però|i)\s+no\s+(és\s+)?obert
      teoria:
      - T1.17
      - T1.11
    errors_comuns:
    - id: corba
      descripcio: |
        Pensa que $A$ és una corba (la circumferència o la recta) i no la seva intersecció.
      pregunta: |
        Quants punts en comú tenen, en general, una recta i una circumferència d'un pla?
    - id: aillats_acumulacio
      descripcio: |
        Considera que els punts d'$A$ són d'acumulació perquè pertanyen a $A$.
      pregunta: |
        En una bola molt petita al voltant d'un dels punts, quants altres punts d'$A$ hi ha?
    - id: tancat_obert_excloents
      descripcio: |
        Creu que, com que no és obert, ha de ser tancat (o al revés), sense comprovar-ho.
      pregunta: |
        Hi ha conjunts que no són ni oberts ni tancats? Llavors, com justifiques cadascuna de les dues propietats?
    nota_professor: |
      La recta $x+y=1$ dista $1/\sqrt2<3$ de l'origen, per tant talla la circumferència en dos punts. Tot conjunt finit de $\mathbb{R}^n$ és tancat, amb interior i derivat buits.
