problemes:
  - num: 22
    font: null
    preambul: |
      Calculeu, si existeix, la derivada en el punt zero de la funció $(f\circ\gamma)(t)$, on
      $$f(x,y)=\begin{cases}\dfrac{x^2y}{x^2+y^2} & \text{si } (x,y)\neq(0,0),\\ 0 & \text{si } (x,y)=(0,0).\end{cases}$$
      i $\gamma(t)=(t,t)$, $\forall t\in\mathbb{R}$. Raoneu si es pot obtenir el resultat aplicant la regla de la cadena.
    indicacio: null
    exercicis:
      - id: "t3-22"
        apartat: null
        tipus: calcul
        enunciat: |
          Calculeu, si existeix, la derivada en el punt zero de la funció $(f\circ\gamma)(t)$, on
          $$f(x,y)=\begin{cases}\dfrac{x^2y}{x^2+y^2} & \text{si } (x,y)\neq(0,0),\\ 0 & \text{si } (x,y)=(0,0).\end{cases}$$
          i $\gamma(t)=(t,t)$, $\forall t\in\mathbb{R}$. Raoneu si es pot obtenir el resultat aplicant la regla de la cadena.
        teoria: ["T3.21"]
        teoria_reservada: ["T3.17"]
        resultat:
          valor: |
            $(f\circ\gamma)(t)=t/2$ per a tot $t$ (també a $t=0$), per tant $(f\circ\gamma)'(0)=1/2$. No es pot obtenir amb la regla de la cadena: $\frac{\partial f}{\partial x}(0,0)=\frac{\partial f}{\partial y}(0,0)=0$, de manera que la fórmula $\nabla f(0,0)\cdot\gamma'(0)$ donaria $0\neq 1/2$. La regla de la cadena no s'aplica perquè $f$ no és diferenciable a l'origen (si ho fos, $D_{(1,1)}f(0,0)$ hauria de ser $\nabla f(0,0)\cdot(1,1)=0$, i en canvi val $1/2$).
          fuites: ['\(f\s*\\circ\s*\\gamma\)''\s*\(0\)\s*\$?\s*(=|és|val)\s*\$?\s*(\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*2|1\s*/\s*2|0[.,]5)', 'derivada\b[^.]{0,40}?\b(és|val|=)\s*\$?\s*(\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*2|1\s*/\s*2|0[.,]5)']
        passos:
          - id: composicio
            titol: "Escriure la composició"
            objectiu: |
              Obtenir una expressió explícita de $(f\circ\gamma)(t)$ per a tot $t\in\mathbb{R}$.
            idea: |
              Substitueix $x=t$, $y=t$ a la fórmula de $f$, separant el cas $t=0$ (on $\gamma(0)$ és l'origen).
            detall: |
              Per $t\neq0$: $(f\circ\gamma)(t)=\frac{t^2\cdot t}{t^2+t^2}=\frac{t}{2}$. Per $t=0$: $f(0,0)=0=\frac{0}{2}$. Per tant $(f\circ\gamma)(t)=t/2$ per a tot $t$.
            fuites: ['\bt\s*/\s*2', '\\[dt]?frac\s*\{?\s*t\s*\}?\s*\{?\s*2', '\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*2\s*\}?\s*t\b']
            teoria: []
          - id: derivada
            titol: "Derivar a zero"
            objectiu: |
              Calcular $(f\circ\gamma)'(0)$, si existeix.
            idea: |
              És una funció d'una variable: aplica la definició de derivada en una variable (o deriva l'expressió que has obtingut, vàlida a tot $\mathbb{R}$).
            detall: |
              $(f\circ\gamma)'(0)=\lim_{t\to0}\frac{t/2-0}{t}=\frac12$. Existeix i val $1/2$.
            fuites: ['(=|és|val)\s*\$?\s*(\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*2\b|1\s*/\s*2|0[.,]5)']
            teoria: ["T3.x1"]
          - id: parcials
            titol: "Parcials de $f$ a l'origen"
            objectiu: |
              Calcular les derivades parcials de $f$ a $(0,0)$, que és el que necessitaria la regla de la cadena.
            idea: |
              A l'origen la funció està definida a part: usa la definició de derivada parcial com a límit, restringint $f$ als eixos.
            detall: |
              $f(t,0)=0$ i $f(0,t)=0$ per a tot $t$, així que $\frac{\partial f}{\partial x}(0,0)=\lim_{t\to0}\frac{0-0}{t}=0$ i igualment $\frac{\partial f}{\partial y}(0,0)=0$. Per tant $\nabla f(0,0)=(0,0)$.
            fuites: ['\\nabla\s*f\s*\(0,\s*0\)\s*=\s*\(0,\s*0\)', '\\partial\s*f\s*\}?\s*\{?\s*\\partial\s*[xy]\s*\}?\s*\(0,\s*0\)\s*=\s*0\b', 'f\s*\(t,\s*0\)\s*=\s*0']
            teoria: ["T3.2"]
          - id: cadena
            titol: "Per què falla la regla de la cadena"
            objectiu: |
              Comparar el resultat amb el que donaria la regla de la cadena i explicar la diferència.
            idea: |
              Escriu què donaria la fórmula $J(f\circ\gamma)(0)=Jf(\gamma(0))\,J\gamma(0)$ i revisa quines hipòtesis demana el teorema. Relaciona la derivada que has calculat amb una derivada direccional de $f$ a l'origen.
            detall: |
              La fórmula donaria $\nabla f(0,0)\cdot\gamma'(0)=(0,0)\cdot(1,1)=0\neq\frac12$. No hi ha contradicció: la regla de la cadena exigeix que $f$ sigui diferenciable a $\gamma(0)=(0,0)$, i no ho és. En efecte, $(f\circ\gamma)'(0)=D_{(1,1)}f(0,0)=\frac12$, mentre que si $f$ fos diferenciable caldria $D_{(1,1)}f(0,0)=Df(0,0)(1,1)=\nabla f(0,0)\cdot(1,1)=0$. Per tant $f$ no és diferenciable a l'origen i el resultat no es pot obtenir amb la regla de la cadena.
            fuites: ['\(0,\s*0\)\s*\\cdot\s*\(1,\s*1\)\s*=\s*0', 'no\s+és\s+diferenciable']
            teoria: ["T3.21", "T3.9", "T3.1"]
        errors_comuns:
          - id: cadena_cega
            descripcio: |
              Aplica la regla de la cadena sense comprovar hipòtesis i conclou que la derivada és $0$.
            pregunta: |
              Has calculat $(f\circ\gamma)(t)$ explícitament? Coincideix la seva derivada amb el que t'ha donat la fórmula?
          - id: parcials_implica_diferenciable
            descripcio: |
              Creu que, com que existeixen les derivades parcials a l'origen, $f$ hi és diferenciable i la regla de la cadena s'hi pot aplicar.
            pregunta: |
              Quina hipòtesi sobre $f$ demana exactament la regla de la cadena? L'existència de parcials és suficient per tenir-la?
          - id: oblida_cas_origen
            descripcio: |
              Usa la fórmula $\frac{x^2y}{x^2+y^2}$ també a l'origen o no comprova que $(f\circ\gamma)(0)=0$.
            pregunta: |
              Quina branca de la definició de $f$ s'aplica quan $t=0$? Quant val $(f\circ\gamma)(0)$?
        nota_professor: |
          És l'exemple de l'observació 17 dels apunts (direccionals sense diferenciabilitat): aquí la derivada de $f\circ\gamma$ a $0$ és precisament $D_{(1,1)}f(0,0)$. És l'exemple canònic per veure que la hipòtesi de diferenciabilitat de la regla de la cadena és necessària.

  - num: 23
    font: null
    preambul: |
      Considerem la funció $f(x,y)=(\sin(y\log x),(y\log x)^2)$ definida a $D=\{(x,y)\in\mathbb{R}^2:x>0\}$. Determineu dues funcions $g:\mathbb{R}\to\mathbb{R}^2$ i $h:D\to\mathbb{R}$ tals que $f=g\circ h$ i useu la regla de la cadena per calcular $Df(x,y)$.
    indicacio: null
    exercicis:
      - id: "t3-23"
        apartat: null
        tipus: calcul
        enunciat: |
          Considerem la funció $f(x,y)=(\sin(y\log x),(y\log x)^2)$ definida a $D=\{(x,y)\in\mathbb{R}^2:x>0\}$. Determineu dues funcions $g:\mathbb{R}\to\mathbb{R}^2$ i $h:D\to\mathbb{R}$ tals que $f=g\circ h$ i useu la regla de la cadena per calcular $Df(x,y)$.
        teoria: ["T3.21", "T3.10"]
        teoria_reservada: []
        resultat:
          valor: |
            $h(x,y)=y\log x$, $g(s)=(\sin s,s^2)$. Llavors
            $Jf(x,y)=Jg(h(x,y))\,Jh(x,y)=\begin{pmatrix}\cos(y\log x)\\ 2y\log x\end{pmatrix}\begin{pmatrix}\frac{y}{x} & \log x\end{pmatrix}=\begin{pmatrix}\frac{y}{x}\cos(y\log x) & \log x\cos(y\log x)\\ \frac{2y^2\log x}{x} & 2y(\log x)^2\end{pmatrix}$.
          fuites: ['\\[dt]?frac\s*\{\s*2\s*y\^\{?2\}?\s*\\(log|ln)\s*x\s*\}\s*\{\s*x\s*\}', '2\s*y\s*(\(\s*\\(log|ln)\s*x\s*\)\^\{?2\}?|\\(log|ln)\^\{?2\}?\s*x)', '\\[dt]?frac\s*\{\s*y\s*\}\s*\{\s*x\s*\}\s*\\cos\s*\(\s*y\s*\\(log|ln)']
        passos:
          - id: descomposicio
            titol: "Trobar $g$ i $h$"
            objectiu: |
              Escriure $f$ com a composició $g\circ h$ amb $h$ a valors reals i $g$ d'una variable.
            idea: |
              Busca l'expressió que es repeteix dins de les dues components de $f$: aquesta serà la funció interior.
            detall: |
              $h(x,y)=y\log x$ (definida a $D$, on $x>0$) i $g(s)=(\sin s,s^2)$. Llavors $g(h(x,y))=(\sin(y\log x),(y\log x)^2)=f(x,y)$.
            fuites: ['h\s*\(x,\s*y\)\s*=\s*y\s*\\(log|ln)\s*x', 'g\s*\(\w\)\s*=\s*\(\s*\\sin']
            teoria: []
          - id: diferenciabilitat
            titol: "Comprovar les hipòtesis"
            objectiu: |
              Justificar que $g$ i $h$ són diferenciables, per poder aplicar la regla de la cadena.
            idea: |
              Escriu cada funció a partir de funcions elementals que ja saps diferenciables (o mira si les seves parcials són contínues) i usa les propietats algebraiques de la diferenciabilitat.
            detall: |
              $h(x,y)=y\log x$ és el producte de $(x,y)\mapsto y$ i $(x,y)\mapsto\log x$, que tenen derivades parcials contínues a l'obert $D$ (on $x>0$) i per tant són diferenciables a $D$; pel producte de funcions diferenciables, $h$ és diferenciable a $D$. Les components de $g$, $\sin s$ i $s^2$, són derivables amb derivada contínua a tot $\mathbb{R}$, per tant $g$ és diferenciable a $\mathbb{R}$.
            fuites: []
            teoria: ["T3.18", "T3.23"]
          - id: jacobianes
            titol: "Jacobianes de $g$ i $h$"
            objectiu: |
              Calcular $Jh(x,y)$ i $Jg(s)$, indicant la mida de cada matriu.
            idea: |
              $h$ va de $\mathbb{R}^2$ a $\mathbb{R}$ i $g$ de $\mathbb{R}$ a $\mathbb{R}^2$: una és una fila i l'altra una columna.
            detall: |
              $Jh(x,y)=\begin{pmatrix}\frac{y}{x} & \log x\end{pmatrix}$ ($1\times2$) i $Jg(s)=\begin{pmatrix}\cos s\\ 2s\end{pmatrix}$ ($2\times1$).
            fuites: ['\\[dt]?frac\s*\{\s*y\s*\}\s*\{\s*x\s*\}\s*(&|\\quad|\\\s|,)\s*\\(log|ln)\s*x', '\\partial\s*h\s*\}?\s*\{?\s*\\partial\s*x\s*\}?\s*(\([^)]*\))?\s*=\s*(\\[dt]?frac\s*\{?\s*y\s*\}?\s*\{?\s*x|y\s*/\s*x)', '\\cos\s*s\s*\\\\\s*2\s*s']
            teoria: ["T3.10"]
          - id: producte
            titol: "Aplicar la regla de la cadena"
            objectiu: |
              Obtenir la matriu $Jf(x,y)$.
            idea: |
              Multiplica les jacobianes en l'ordre que dona la regla de la cadena, avaluant la de $g$ al punt $h(x,y)$.
            detall: |
              $Jf(x,y)=Jg(y\log x)\,Jh(x,y)=\begin{pmatrix}\cos(y\log x)\\ 2y\log x\end{pmatrix}\begin{pmatrix}\frac{y}{x} & \log x\end{pmatrix}=\begin{pmatrix}\frac{y}{x}\cos(y\log x) & \log x\cos(y\log x)\\ \frac{2y^2\log x}{x} & 2y(\log x)^2\end{pmatrix}$ (matriu $2\times2$).
            fuites: ['\\[dt]?frac\s*\{\s*2\s*y\^\{?2\}?\s*\\(log|ln)\s*x\s*\}\s*\{\s*x\s*\}', '2\s*y\s*(\(\s*\\(log|ln)\s*x\s*\)\^\{?2\}?|\\(log|ln)\^\{?2\}?\s*x)']
            teoria: ["T3.21", "T3.22"]
        errors_comuns:
          - id: ordre_producte
            descripcio: |
              Multiplica les jacobianes en l'ordre $Jh\cdot Jg$ (obtenint un nombre en lloc d'una matriu $2\times2$).
            pregunta: |
              Quina mida ha de tenir $Jf(x,y)$ si $f:D\subseteq\mathbb{R}^2\to\mathbb{R}^2$? Quin ordre del producte et dona aquesta mida?
          - id: avalua_g_malament
            descripcio: |
              Avalua $Jg$ a $(x,y)$ o a $s$ genèric en lloc de a $h(x,y)=y\log x$.
            pregunta: |
              En quin punt cal avaluar la derivada de la funció exterior?
          - id: descomposicio_invertida
            descripcio: |
              Intercanvia els papers de $g$ i $h$, o tria una $h$ que no fa la composició igual a $f$.
            pregunta: |
              Amb les teves $g$ i $h$, calcula $g(h(x,y))$: dona exactament $f(x,y)$? Els dominis i codominis encaixen amb l'enunciat?
        nota_professor: |
          Es pot comprovar el resultat derivant directament cada component de $f$.

  - num: 24
    font: null
    preambul: |
      Sigui $f:\mathbb{R}\to\mathbb{R}$ diferenciable. Proveu que la funció $\varphi(x,y)=f(2x+3y)$, definida en $\mathbb{R}^2$, satisfà l'equació en derivades parcials $3\dfrac{\partial\varphi}{\partial x}-2\dfrac{\partial\varphi}{\partial y}=0$.
    indicacio: null
    exercicis:
      - id: "t3-24"
        apartat: null
        tipus: teoric
        enunciat: |
          Sigui $f:\mathbb{R}\to\mathbb{R}$ diferenciable. Proveu que la funció $\varphi(x,y)=f(2x+3y)$, definida en $\mathbb{R}^2$, satisfà l'equació en derivades parcials $3\dfrac{\partial\varphi}{\partial x}-2\dfrac{\partial\varphi}{\partial y}=0$.
        teoria: ["T3.2"]
        teoria_reservada: []
        resultat:
          valor: |
            Per la regla de la cadena, $\varphi_x=2f'(2x+3y)$ i $\varphi_y=3f'(2x+3y)$, per tant $3\varphi_x-2\varphi_y=6f'(2x+3y)-6f'(2x+3y)=0$.
          fuites: []
        passos:
          - id: composicio
            titol: "Veure-ho com una composició"
            objectiu: |
              Identificar $\varphi$ com a composició de dues funcions diferenciables.
            idea: |
              Hi ha una funció "interior" de dues variables i una "exterior" d'una variable.
            detall: |
              $\varphi=f\circ g$ amb $g(x,y)=2x+3y$, lineal (parcials constants $2$ i $3$, contínues) i per tant diferenciable; $f$ és diferenciable per hipòtesi.
            fuites: ['\w\s*\(x,\s*y\)\s*=\s*2\s*x\s*\+\s*3\s*y']
            teoria: ["T3.18"]
          - id: parcials
            titol: "Aplicar la regla de la cadena"
            objectiu: |
              Calcular $\varphi_x$ i $\varphi_y$.
            idea: |
              La regla de la cadena multiplica la derivada de la funció exterior (avaluada al punt adequat) per la parcial de la interior.
            detall: |
              $J\varphi(x,y)=f'(2x+3y)\,Jg(x,y)=f'(2x+3y)\begin{pmatrix}2 & 3\end{pmatrix}$, és a dir, $\varphi_x=f'(2x+3y)\cdot 2$ i $\varphi_y=f'(2x+3y)\cdot 3$.
            fuites: ['f\S{0,8}\(\s*2\s*x\s*\+\s*3\s*y\s*\)\s*(\\cdot)?\s*[23]\b', '[23]\s*(\\cdot\s*)?f\S{0,8}\(\s*2\s*x\s*\+\s*3\s*y\s*\)']
            teoria: ["T3.21"]
          - id: substituir
            titol: "Substituir a l'equació"
            objectiu: |
              Comprovar l'equació.
            idea: |
              Substitueix les parcials a $3\varphi_x-2\varphi_y$.
            detall: |
              $3\cdot2f'(2x+3y)-2\cdot3f'(2x+3y)=0$ per a tot $(x,y)\in\mathbb{R}^2$.
            fuites: ['3\s*\\cdot\s*2\s*f', '6\s*f\S{0,8}\(\s*2\s*x\s*\+\s*3\s*y\s*\)\s*-\s*6']
            teoria: []
        errors_comuns:
          - id: oblida_factor
            descripcio: |
              Deriva $f(2x+3y)$ oblidant el factor de la derivada interior (regla de la cadena).
            pregunta: |
              Si només canvies $x$ una mica, quant canvia l'argument $2x+3y$?
          - id: cas_particular
            descripcio: |
              Ho comprova per a una $f$ concreta (p. ex. $f(t)=t^2$) en lloc de demostrar-ho en general.
            pregunta: |
              Has comprovat un exemple. Com saps que funcionarà per a qualsevol $f$ diferenciable?
          - id: confon_derivades
            descripcio: |
              Confon $f'$ amb $\varphi$ o tracta les dues parcials com a expressions sense relació entre elles.
            pregunta: |
              Les dues parcials que has trobat, contenen un factor comú? Quin?
        nota_professor: |
          Fitxa reutilitzada de l'antic t3-24 (mateix problema). Interpretació: $\varphi$ és constant sobre les rectes $2x+3y=c$, i $(3,-2)$ és la direcció d'aquestes rectes, de manera que l'equació diu $D_{(3,-2)}\varphi=0$.

  - num: 25
    font: null
    preambul: |
      Sigui $G$ la funció que dona el canvi de variables a coordenades polars:
      $$\begin{aligned}G:\mathbb{R}^+\times(0,2\pi)\subset\mathbb{R}^2&\to\mathbb{R}^2\\(r,\varphi)&\mapsto(r\cos\varphi,r\sin\varphi).\end{aligned}$$
    indicacio: null
    exercicis:
      - id: "t3-25a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          Si $f:\mathbb{R}^2\to\mathbb{R}$ és una funció de classe $\mathcal{C}^1$, obteniu les relacions entre les derivades parcials primeres en els dos sistemes de coordenades; és a dir, si $F=f\circ G$, demostreu que:
          $$\frac{\partial F}{\partial r}=\frac{\partial f}{\partial x}\cos\varphi+\frac{\partial f}{\partial y}\sin\varphi,\qquad\frac{\partial F}{\partial\varphi}=-\frac{\partial f}{\partial x}r\sin\varphi+\frac{\partial f}{\partial y}r\cos\varphi,$$
          $$\frac{\partial f}{\partial x}=\frac{\partial F}{\partial r}\frac{x}{\sqrt{x^2+y^2}}-\frac{\partial F}{\partial\varphi}\frac{y}{x^2+y^2},\qquad\frac{\partial f}{\partial y}=\frac{\partial F}{\partial r}\frac{y}{\sqrt{x^2+y^2}}+\frac{\partial F}{\partial\varphi}\frac{x}{x^2+y^2}.$$
        teoria: ["T3.20", "T3.2"]
        teoria_reservada: []
        resultat:
          valor: |
            Per la regla de la cadena, $JF(r,\varphi)=Jf(G(r,\varphi))\,JG(r,\varphi)$ amb $JG=\begin{pmatrix}\cos\varphi & -r\sin\varphi\\ \sin\varphi & r\cos\varphi\end{pmatrix}$, que dona les dues primeres fórmules (amb les parcials de $f$ avaluades a $(x,y)=G(r,\varphi)$). Com que $\det JG=r>0$, el sistema es pot resoldre: $\frac{\partial f}{\partial x}=\cos\varphi\,\frac{\partial F}{\partial r}-\frac{\sin\varphi}{r}\frac{\partial F}{\partial\varphi}$, $\frac{\partial f}{\partial y}=\sin\varphi\,\frac{\partial F}{\partial r}+\frac{\cos\varphi}{r}\frac{\partial F}{\partial\varphi}$, i substituint $r=\sqrt{x^2+y^2}$, $\cos\varphi=x/r$, $\sin\varphi=y/r$ s'obtenen les dues últimes.
          fuites: []
        passos:
          - id: jacobiana_G
            titol: "Diferenciabilitat i jacobiana de $G$"
            objectiu: |
              Justificar que es pot aplicar la regla de la cadena a $F=f\circ G$ i calcular la matriu $JG(r,\varphi)$.
            idea: |
              Comprova que $G$ i $f$ són diferenciables (parcials contínues) i escriu la matriu de les parcials de les components de $G$ respecte de $r$ i $\varphi$.
            detall: |
              $f\in\mathcal{C}^1$ és diferenciable, i $G$ té parcials contínues, per tant també ho és. $JG(r,\varphi)=\begin{pmatrix}\cos\varphi & -r\sin\varphi\\ \sin\varphi & r\cos\varphi\end{pmatrix}$.
            fuites: ['\\cos\s*\\varphi\s*&\s*-\s*r\s*\\sin\s*\\varphi']
            teoria: ["T3.18", "T3.10"]
          - id: cadena
            titol: "Primeres fórmules"
            objectiu: |
              Obtenir $\frac{\partial F}{\partial r}$ i $\frac{\partial F}{\partial\varphi}$ en termes de les parcials de $f$.
            idea: |
              Escriu $JF(r,\varphi)$ com a producte de la jacobiana de $f$ (avaluada a $G(r,\varphi)$) per la de $G$.
            detall: |
              $\left(\frac{\partial F}{\partial r}\ \ \frac{\partial F}{\partial\varphi}\right)=\left(\frac{\partial f}{\partial x}\ \ \frac{\partial f}{\partial y}\right)\begin{pmatrix}\cos\varphi & -r\sin\varphi\\ \sin\varphi & r\cos\varphi\end{pmatrix}$, amb les parcials de $f$ avaluades a $(r\cos\varphi,r\sin\varphi)$. Multiplicant s'obtenen exactament les dues primeres igualtats de l'enunciat.
            fuites: []
            teoria: ["T3.21", "T3.22"]
          - id: invertir
            titol: "Aïllar les parcials de $f$"
            objectiu: |
              Expressar $\frac{\partial f}{\partial x}$ i $\frac{\partial f}{\partial y}$ en termes de $\frac{\partial F}{\partial r}$, $\frac{\partial F}{\partial\varphi}$, $r$ i $\varphi$.
            idea: |
              Les dues fórmules anteriors són un sistema lineal $2\times2$ en les incògnites $\frac{\partial f}{\partial x}$, $\frac{\partial f}{\partial y}$; mira si la matriu és invertible al domini de $G$.
            detall: |
              El determinant de $JG$ és $r\cos^2\varphi+r\sin^2\varphi=r>0$. Resolent (per exemple, multiplicant la primera per $r\cos\varphi$, la segona per $\sin\varphi$ i restant): $\frac{\partial f}{\partial x}=\cos\varphi\,\frac{\partial F}{\partial r}-\frac{\sin\varphi}{r}\frac{\partial F}{\partial\varphi}$ i $\frac{\partial f}{\partial y}=\sin\varphi\,\frac{\partial F}{\partial r}+\frac{\cos\varphi}{r}\frac{\partial F}{\partial\varphi}$.
            fuites: ['\\[dt]?frac\s*\{\s*\\(sin|cos)\s*\\varphi\s*\}\s*\{\s*r\s*\}', '\\[dt]?frac\s*\{?\s*1\s*\}?\s*\{?\s*r\s*\}?\s*\\(sin|cos)\s*\\varphi', '\\(sin|cos)\s*\\varphi\s*/\s*r\b']
            teoria: []
          - id: cartesianes
            titol: "Passar a $x$, $y$"
            objectiu: |
              Escriure els coeficients anteriors en funció de $x$ i $y$.
            idea: |
              Usa la relació entre $(r,\varphi)$ i $(x,y)=G(r,\varphi)$.
            detall: |
              $r=\sqrt{x^2+y^2}$, $\cos\varphi=\frac{x}{\sqrt{x^2+y^2}}$, $\sin\varphi=\frac{y}{\sqrt{x^2+y^2}}$, i per tant $\frac{\sin\varphi}{r}=\frac{y}{x^2+y^2}$, $\frac{\cos\varphi}{r}=\frac{x}{x^2+y^2}$. Substituint s'obtenen les dues últimes fórmules.
            fuites: []
            teoria: []
        errors_comuns:
          - id: punt_avaluacio
            descripcio: |
              No distingeix on s'avaluen les parcials: les de $f$ a $(x,y)=G(r,\varphi)$ i les de $F$ a $(r,\varphi)$.
            pregunta: |
              A la regla de la cadena, en quin punt s'avalua la jacobiana de la funció exterior?
          - id: ordre_producte
            descripcio: |
              Multiplica $JG\cdot Jf$ en lloc de $Jf\cdot JG$, o fa servir la transposada de $JG$ sense adonar-se'n.
            pregunta: |
              Quines mides tenen $Jf$ i $JG$? Quin ordre del producte dona una matriu $1\times2$ amb les parcials respecte de $r$ i $\varphi$?
          - id: inversa_per_composicio
            descripcio: |
              Per obtenir les últimes fórmules intenta derivar $\varphi=\arctan(y/x)$, cosa que només val en una part del domini, sense justificar-ho.
            pregunta: |
              La fórmula que fas servir per a $\varphi$ en funció de $(x,y)$, és vàlida per a tot $\varphi\in(0,2\pi)$? Pots obtenir el mateix resultat sense invertir $G$ explícitament?
        nota_professor: |
          Alternativa per a les dues últimes: $f=F\circ G^{-1}$ i $J(G^{-1})=(JG)^{-1}$; però invertir el sistema lineal evita haver d'escriure $G^{-1}$, que requereix diversos casos per a $\varphi$.

      - id: "t3-25b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          Sigui $f:\mathbb{R}^2\to\mathbb{R}^2$ una funció de classe $\mathcal{C}^1$, $f(x,y)=(f_1(x,y),f_2(x,y))$, i $F=f\circ G$, amb $F=(F_1,F_2)=(f_1\circ G,f_2\circ G)$. Si
          $$\frac{\partial f_1}{\partial x}=\frac{\partial f_2}{\partial y},\qquad\frac{\partial f_1}{\partial y}=-\frac{\partial f_2}{\partial x},$$
          proveu que
          $$\frac{\partial F_1}{\partial r}=\frac{1}{r}\frac{\partial F_2}{\partial\varphi},\qquad\frac{\partial F_1}{\partial\varphi}=-r\frac{\partial F_2}{\partial r}.$$
        teoria: ["T3.20", "T3.2"]
        teoria_reservada: []
        resultat:
          valor: |
            Aplicant l'apartat (a) a cada component: $\partial_r F_i=\partial_x f_i\cos\varphi+\partial_y f_i\sin\varphi$ i $\partial_\varphi F_i=r(-\partial_x f_i\sin\varphi+\partial_y f_i\cos\varphi)$. Substituint $\partial_x f_2=-\partial_y f_1$, $\partial_y f_2=\partial_x f_1$: $\partial_\varphi F_2=r(\partial_y f_1\sin\varphi+\partial_x f_1\cos\varphi)=r\,\partial_r F_1$ i $-r\,\partial_r F_2=r(\partial_y f_1\cos\varphi-\partial_x f_1\sin\varphi)=\partial_\varphi F_1$. Com que $r>0$, la primera dona $\partial_r F_1=\frac1r\partial_\varphi F_2$.
          fuites: []
        passos:
          - id: components
            titol: "Aplicar (a) a cada component"
            objectiu: |
              Usant l'apartat (a) (que es pot donar per conegut), escriure les quatre parcials $\partial_r F_1$, $\partial_\varphi F_1$, $\partial_r F_2$, $\partial_\varphi F_2$.
            idea: |
              Cada $F_i=f_i\circ G$ és la situació de l'apartat (a) amb $f_i\in\mathcal{C}^1$ en lloc de $f$.
            detall: |
              $\partial_r F_i=\partial_x f_i\cos\varphi+\partial_y f_i\sin\varphi$ i $\partial_\varphi F_i=-\partial_x f_i\,r\sin\varphi+\partial_y f_i\,r\cos\varphi$, per a $i=1,2$ (parcials de $f_i$ avaluades a $G(r,\varphi)$).
            fuites: []
            teoria: ["T3.21"]
          - id: primera
            titol: "Primera igualtat"
            objectiu: |
              Provar que $\partial_r F_1=\frac1r\partial_\varphi F_2$.
            idea: |
              Expressa $\partial_\varphi F_2$ només amb parcials de $f_1$ usant les dues hipòtesis, i compara amb $\partial_r F_1$.
            detall: |
              $\partial_\varphi F_2=-\partial_x f_2\,r\sin\varphi+\partial_y f_2\,r\cos\varphi=r(\partial_y f_1\sin\varphi+\partial_x f_1\cos\varphi)=r\,\partial_r F_1$. Com que $r>0$, $\partial_r F_1=\frac1r\partial_\varphi F_2$.
            fuites: ['=\s*r\s*(\\,)?\s*\\partial_r\s*F_1', '=\s*r\s*(\\,)?\s*\\frac\s*\{\s*\\partial\s*F_1\s*\}\s*\{\s*\\partial\s*r', 'r\s*\(\s*\\partial_y\s*f_1\s*\\sin\s*\\varphi\s*\+\s*\\partial_x\s*f_1\s*\\cos']
            teoria: []
          - id: segona
            titol: "Segona igualtat"
            objectiu: |
              Provar que $\partial_\varphi F_1=-r\,\partial_r F_2$.
            idea: |
              Fes el mateix amb $\partial_r F_2$.
            detall: |
              $-r\,\partial_r F_2=-r(\partial_x f_2\cos\varphi+\partial_y f_2\sin\varphi)=-r(-\partial_y f_1\cos\varphi+\partial_x f_1\sin\varphi)=-\partial_x f_1\,r\sin\varphi+\partial_y f_1\,r\cos\varphi=\partial_\varphi F_1$.
            fuites: ['\(\s*-\s*\\partial_y\s*f_1\s*\\cos\s*\\varphi\s*\+\s*\\partial_x\s*f_1\s*\\sin']
            teoria: []
        errors_comuns:
          - id: signe_hipotesi
            descripcio: |
              Substitueix malament les hipòtesis (p. ex. $\partial_x f_2=\partial_y f_1$, perdent el signe).
            pregunta: |
              Escriu exactament què val $\partial_x f_2$ segons la segona hipòtesi. Quin signe porta?
          - id: divideix_per_r
            descripcio: |
              Divideix per $r$ sense comentar que $r>0$ al domini de $G$.
            pregunta: |
              Pots dividir per $r$ a tot el domini de $G$? Per què?
          - id: refa_cadena
            descripcio: |
              Refà tot el càlcul de la regla de la cadena en lloc d'aplicar (a) a cada component, i s'hi perd.
            pregunta: |
              Cada $F_i$ és de la forma $f_i\circ G$. Què et diu ja l'apartat anterior sobre funcions d'aquest tipus?
        nota_professor: |
          Són les equacions de Cauchy-Riemann en coordenades polars.

  - num: 26
    font: null
    preambul: |
      Considereu la funció
      $$f(x,y)=\begin{cases}2(x^2+y^2)\sin\left(\dfrac{1}{\sqrt{x^2+y^2}}\right) & \text{si } (x,y)\neq(0,0)\\ 0 & \text{si } (x,y)=(0,0).\end{cases}$$
    indicacio: null
    exercicis:
      - id: "t3-26a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          Proveu que existeixen les derivades parcials de $f$, però que no són contínues a $(0,0)$.
        teoria: ["T3.2", "T2.14"]
        teoria_reservada: ["T3.19"]
        resultat:
          valor: |
            A l'origen, $\frac{\partial f}{\partial x}(0,0)=\lim_{t\to0}2t\sin\frac1{|t|}=0$ i, per simetria, $\frac{\partial f}{\partial y}(0,0)=0$. Fora de l'origen, amb $\rho=\sqrt{x^2+y^2}$: $\frac{\partial f}{\partial x}=4x\sin\frac1\rho-\frac{2x}{\rho}\cos\frac1\rho$ (i anàlogament $\frac{\partial f}{\partial y}$ canviant $x$ per $y$). Sobre el semieix $y=0$, $x>0$: $\frac{\partial f}{\partial x}(x,0)=4x\sin\frac1x-2\cos\frac1x$, que no té límit quan $x\to0^+$ (val $-2$ a $x_n=\frac{1}{2n\pi}$ i $2$ a $x_n=\frac{1}{(2n+1)\pi}$); per tant $\frac{\partial f}{\partial x}$ no és contínua a l'origen, i per simetria tampoc $\frac{\partial f}{\partial y}$.
          fuites: []
        passos:
          - id: parcials_origen
            titol: "Parcials a l'origen"
            objectiu: |
              Calcular $\frac{\partial f}{\partial x}(0,0)$ i $\frac{\partial f}{\partial y}(0,0)$.
            idea: |
              A l'origen cal usar la definició com a límit d'un quocient d'una variable; acota el sinus.
            detall: |
              $\frac{f(t,0)-f(0,0)}{t}=\frac{2t^2\sin(1/|t|)}{t}=2t\sin\frac1{|t|}$, i $\left|2t\sin\frac1{|t|}\right|\le2|t|\to0$. Per tant $\frac{\partial f}{\partial x}(0,0)=0$, i com que $f(x,y)=f(y,x)$, també $\frac{\partial f}{\partial y}(0,0)=0$.
            fuites: ['2\s*t\s*\\sin']
            teoria: ["T3.2", "T3.4"]
          - id: parcials_fora
            titol: "Parcials fora de l'origen"
            objectiu: |
              Calcular les derivades parcials en un punt $(x,y)\neq(0,0)$.
            idea: |
              Fora de l'origen $f$ ve donada per una sola expressió: deriva-la amb les regles d'una variable (cadena i producte), mantenint l'altra variable fixa.
            detall: |
              Amb $\rho=\sqrt{x^2+y^2}$ i $\frac{\partial\rho}{\partial x}=\frac{x}{\rho}$: $\frac{\partial f}{\partial x}=4x\sin\frac1\rho+2\rho^2\cos\frac1\rho\cdot\left(-\frac{1}{\rho^2}\right)\frac{x}{\rho}=4x\sin\frac1\rho-\frac{2x}{\rho}\cos\frac1\rho$. Anàlogament $\frac{\partial f}{\partial y}=4y\sin\frac1\rho-\frac{2y}{\rho}\cos\frac1\rho$. Així, les parcials existeixen a tot $\mathbb{R}^2$.
            fuites: ['\\[dt]?frac\s*\{\s*2\s*x\s*\}\s*\{\s*(\\rho|\\sqrt)', '4\s*x\s*\\sin']
            teoria: ["T3.2"]
          - id: discontinuitat
            titol: "No continuïtat a l'origen"
            objectiu: |
              Veure que $\frac{\partial f}{\partial x}$ no tendeix a $\frac{\partial f}{\partial x}(0,0)$ quan $(x,y)\to(0,0)$.
            idea: |
              Restringeix la parcial a un camí senzill cap a l'origen i separa el terme que tendeix a $0$ del que oscil·la.
            detall: |
              Sobre $y=0$, $x>0$: $\frac{\partial f}{\partial x}(x,0)=4x\sin\frac1x-2\cos\frac1x$. El primer terme tendeix a $0$ ($|4x\sin\frac1x|\le4x$), però $2\cos\frac1x$ no té límit. Concretament, les successions $p_n=\left(\frac1{2n\pi},0\right)$ i $q_n=\left(\frac1{(2n+1)\pi},0\right)$ tendeixen a $(0,0)$ i $\frac{\partial f}{\partial x}(p_n)=-2$, $\frac{\partial f}{\partial x}(q_n)=2$ per a tot $n$. Per la caracterització del límit amb successions, no existeix $\lim_{(x,y)\to(0,0)}\frac{\partial f}{\partial x}(x,y)$, i la parcial no és contínua a l'origen; per simetria ($f(x,y)=f(y,x)$), tampoc $\frac{\partial f}{\partial y}$.
            fuites: ['2\s*\\cos\s*\\[dt]?frac\s*\{?1\}?\s*\{?x', '2\s*\\cos\s*\(\s*1\s*/\s*x']
            teoria: ["T2.6", "T2.14"]
        errors_comuns:
          - id: deriva_formula_origen
            descripcio: |
              Calcula la parcial a l'origen substituint $(0,0)$ a la fórmula de la parcial obtinguda fora de l'origen.
            pregunta: |
              La fórmula que has derivat, és vàlida a l'origen? Com es defineix la derivada parcial en un punt on la funció està definida a part?
          - id: cos_tendeix_zero
            descripcio: |
              Creu que $\frac{2x}{\rho}\cos\frac1\rho\to0$ perquè hi ha una $x$ al numerador.
            pregunta: |
              Quant val $\left|\frac{x}{\rho}\right|$ sobre l'eix $y=0$? Es fa petit quan t'acostes a l'origen?
          - id: oscillacio_sense_justificar
            descripcio: |
              Afirma que el límit no existeix sense donar dues successions (o camins) amb límits diferents.
            pregunta: |
              Pots trobar dues successions de punts que tendeixin a l'origen on la parcial tendeixi a valors diferents?
        nota_professor: |
          Mateixa funció que l'observació 19 dels apunts, amb un factor $2$; per això aquella observació és reservada. El factor $2$ només canvia les constants ($\pm2$ en lloc de $\pm1$).

      - id: "t3-26b"
        apartat: "b"
        tipus: teoric
        enunciat: |
          Proveu que $f$ és diferenciable en tot el seu domini.
        teoria: ["T3.8"]
        teoria_reservada: ["T3.19"]
        resultat:
          valor: |
            A $\mathbb{R}^2\setminus\{(0,0)\}$ (obert) les parcials existeixen i són contínues, per tant $f$ hi és diferenciable. A l'origen la candidata és $Df(0,0)=0$ (parcials nul·les, apartat (a)) i $\frac{|f(x,y)-0-0|}{\sqrt{x^2+y^2}}=2\sqrt{x^2+y^2}\left|\sin\frac1{\sqrt{x^2+y^2}}\right|\le2\sqrt{x^2+y^2}\to0$, per tant $f$ és diferenciable a l'origen amb $Df(0,0)=0$. Així, $f$ és diferenciable a tot $\mathbb{R}^2$ tot i que les parcials no són contínues a l'origen.
          fuites: []
        passos:
          - id: fora_origen
            titol: "Fora de l'origen"
            objectiu: |
              Provar que $f$ és diferenciable a tot punt $(x,y)\neq(0,0)$.
            idea: |
              Usa les parcials calculades a (a) i una condició suficient de diferenciabilitat.
            detall: |
              A l'obert $\mathbb{R}^2\setminus\{(0,0)\}$ les parcials obtingudes a (a) són composicions, productes i quocients de funcions contínues (amb $\rho\neq0$), per tant contínues; per la condició suficient, $f$ és diferenciable a cada punt diferent de l'origen.
            fuites: []
            teoria: ["T3.18", "T2.19", "T2.20"]
          - id: candidata
            titol: "Candidata a diferencial a l'origen"
            objectiu: |
              Determinar quina hauria de ser $Df(0,0)$ si existeix.
            idea: |
              Si $f$ és diferenciable, la seva jacobiana està formada per les derivades parcials.
            detall: |
              Per l'apartat (a), $\frac{\partial f}{\partial x}(0,0)=\frac{\partial f}{\partial y}(0,0)=0$, així que l'única candidata és $Df(0,0)=0$, amb jacobiana $(0\ \ 0)$.
            fuites: []
            teoria: ["T3.9"]
          - id: quocient
            titol: "Comprovar la definició"
            objectiu: |
              Veure que el quocient de la definició de diferenciabilitat tendeix a $0$ a l'origen.
            idea: |
              Escriu el quocient amb la candidata, acota el sinus per $1$ i aplica el criteri del sandvitx.
            detall: |
              $0\le\frac{|f(x,y)-f(0,0)-0|}{\sqrt{x^2+y^2}}=2\sqrt{x^2+y^2}\left|\sin\frac1{\sqrt{x^2+y^2}}\right|\le2\sqrt{x^2+y^2}\to0$. Per tant $f$ és diferenciable a l'origen i $Df(0,0)=0$.
            fuites: ['(\\le|\\leq|≤)\s*2\s*(\\sqrt|\\rho|\\\||\|)']
            teoria: ["T3.8"]
        errors_comuns:
          - id: condicio_suficient_origen
            descripcio: |
              Intenta usar la condició suficient (parcials contínues) també a l'origen, o conclou que no és diferenciable perquè les parcials no hi són contínues.
            pregunta: |
              La continuïtat de les parcials és una condició necessària o només suficient per a la diferenciabilitat?
          - id: nomes_parcials
            descripcio: |
              Conclou que és diferenciable a l'origen només perquè hi existeixen les parcials.
            pregunta: |
              Coneixes alguna funció amb totes les parcials (i fins i tot direccionals) a l'origen que no hi sigui diferenciable? Què més cal comprovar?
          - id: quocient_sense_norma
            descripcio: |
              Comprova el límit de $f(x,y)$ en lloc del quocient dividit per $\|(x,y)\|$.
            pregunta: |
              A la definició de diferenciabilitat, per quina quantitat es divideix l'error $f(x,y)-f(0,0)-Df(0,0)(x,y)$?
        nota_professor: |
          Juntament amb (a), mostra que diferenciable no implica parcials contínues (recíproc fals de la condició suficient).

  - num: 27
    font: null
    preambul: |
      Considerem la funció
      $$f(x,y)=\begin{cases}xy^2\sin\left(\dfrac{1}{y}\right) & \text{si } y\neq0,\\ 0 & \text{si } y=0.\end{cases}$$
    indicacio: null
    exercicis:
      - id: "t3-27a"
        apartat: "a"
        tipus: calcul
        enunciat: |
          Estudieu la diferenciabilitat de $f$ a $\mathbb{R}^2$.
        teoria: ["T3.8"]
        teoria_reservada: []
        resultat:
          valor: |
            $f$ és diferenciable a tot $\mathbb{R}^2$. A l'obert $\{y\neq0\}$ perquè les parcials $f_x=y^2\sin\frac1y$, $f_y=2xy\sin\frac1y-x\cos\frac1y$ són contínues. Als punts $(a,0)$: $f_x(a,0)=0$, $f_y(a,0)=\lim_{k\to0}ak\sin\frac1k=0$, i $\frac{|f(a+h,k)|}{\|(h,k)\|}\le\frac{|a+h|\,k^2}{\|(h,k)\|}\le|a+h|\,|k|\to0$, per tant $f$ és diferenciable a $(a,0)$ amb $Df(a,0)=0$.
          fuites: ['diferenciable\s+(a|en)\s+tot(s)?\s+(el\s+pla|\$?\\mathbb\{?R)', 'diferenciable\s+(a|en)\s+tots\s+els\s+punts', 'diferenciable\s+(a|en)\s+tot\s+arreu']
        passos:
          - id: fora_eix
            titol: "Punts amb $y\\neq0$"
            objectiu: |
              Estudiar la diferenciabilitat als punts on $y\neq0$.
            idea: |
              Al conjunt obert on $y\neq0$ la funció ve donada per una sola expressió: calcula les parcials i mira si són contínues.
            detall: |
              Per $y\neq0$: $f_x=y^2\sin\frac1y$ i $f_y=2xy\sin\frac1y+xy^2\cos\frac1y\cdot\left(-\frac1{y^2}\right)=2xy\sin\frac1y-x\cos\frac1y$, contínues a l'obert $\{y\neq0\}$. Per la condició suficient, $f$ hi és diferenciable.
            fuites: ['-\s*x\s*\\cos\s*(\\[dt]?frac|\(\s*1\s*/\s*y)']
            teoria: ["T3.18", "T2.19", "T2.20"]
          - id: parcials_eix
            titol: "Parcials als punts de l'eix"
            objectiu: |
              Calcular les derivades parcials als punts $(a,0)$, $a\in\mathbb{R}$.
            idea: |
              Aplica la definició de derivada parcial; recorda quant val $f$ sobre l'eix $y=0$.
            detall: |
              $f(a+t,0)=0$, per tant $f_x(a,0)=0$. $f_y(a,0)=\lim_{k\to0}\frac{f(a,k)-0}{k}=\lim_{k\to0}a\,k\sin\frac1k=0$ (ja que $|ak\sin\frac1k|\le|a||k|$). Candidata: $Df(a,0)=0$.
            fuites: ['a\s*(\\,)?\s*k\s*\\sin']
            teoria: ["T3.2", "T3.9"]
          - id: diferenciable_eix
            titol: "Diferenciabilitat a l'eix"
            objectiu: |
              Decidir si $f$ és diferenciable als punts $(a,0)$.
            idea: |
              Escriu el quocient de la definició amb la candidata i acota'l, usant que el sinus està fitat i que $|k|\le\|(h,k)\|$.
            detall: |
              Si $k\neq0$: $\frac{|f(a+h,k)-0-0|}{\|(h,k)\|}=\frac{|a+h|\,k^2|\sin\frac1k|}{\|(h,k)\|}\le|a+h|\,\frac{k^2}{\|(h,k)\|}\le|a+h|\,|k|$; si $k=0$ el quocient és $0$. Com que $|a+h|\,|k|\to0$ quan $(h,k)\to(0,0)$, pel sandvitx el quocient tendeix a $0$: $f$ és diferenciable a $(a,0)$ amb $Df(a,0)=0$.
            fuites: ['\|a\s*\+\s*h\|\s*(\\,)?\s*\|k\|']
            teoria: ["T3.8"]
        errors_comuns:
          - id: oblida_eix
            descripcio: |
              Només estudia l'origen i oblida la resta de punts de l'eix $y=0$, on la funció també està definida a part.
            pregunta: |
              On està definida $f$ per la segona branca? Has estudiat tots aquests punts?
          - id: parcials_no_continues_implica
            descripcio: |
              Conclou que $f$ no és diferenciable a $(a,0)$, $a\neq0$, perquè $f_y$ no hi és contínua.
            pregunta: |
              La continuïtat de les parcials, és necessària per ser diferenciable o només suficient?
          - id: oblida_k_zero
            descripcio: |
              Usa la fórmula $xy^2\sin\frac1y$ quan $k=0$ en el quocient, on no està definida.
            pregunta: |
              Quan t'acostes a $(a,0)$, tots els punts tenen $y\neq0$? Què val el quocient si $k=0$?
        nota_professor: |
          Cal tractar tots els punts $(a,0)$, no només l'origen. La fita és uniforme perquè $|a+h|$ es manté fitat a prop de $h=0$.

      - id: "t3-27b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          Trobeu un obert $U\subseteq\mathbb{R}^2$ maximal tal que $f\in\mathcal{C}^1(U)$.
        teoria: ["T3.20", "T1.11"]
        teoria_reservada: []
        resultat:
          valor: |
            $U=\{(x,y)\in\mathbb{R}^2:\ y\neq0\}$. Les parcials són $f_x=y^2\sin\frac1y$ ($y\neq0$), $0$ ($y=0$), contínua a tot $\mathbb{R}^2$; i $f_y=2xy\sin\frac1y-x\cos\frac1y$ ($y\neq0$), $0$ ($y=0$), que és contínua a $\{y\neq0\}\cup\{(0,0)\}$ i no ho és a cap $(a,0)$ amb $a\neq0$. Un obert on $f$ sigui $\mathcal{C}^1$ ha d'estar contingut en aquest conjunt, i per ser obert no pot contenir l'origen (tota bola centrada a l'origen conté punts $(a,0)$, $a\neq0$). Per tant l'obert màxim és $\{y\neq0\}$, on efectivament $f$ és $\mathcal{C}^1$.
          fuites: ['U\s*=\s*\\\{[^$]*y\s*\\neq?\s*0', '\\setminus\s*\\\{[^$]*y\s*=\s*0', 'pla\s+(menys|sense)\s+l''eix']
        passos:
          - id: fx_continua
            titol: "Continuïtat de $f_x$"
            objectiu: |
              Usant les parcials obtingudes a l'apartat (a), estudiar on és contínua $f_x$.
            idea: |
              Fora de l'eix és clar; als punts de l'eix compara $f_x$ amb el seu valor allà, acotant el sinus.
            detall: |
              $f_x=y^2\sin\frac1y$ si $y\neq0$ i $f_x(a,0)=0$. Com que $|f_x(x,y)|\le y^2\to0$ quan $(x,y)\to(a,0)$, $f_x$ és contínua a tot $\mathbb{R}^2$.
            fuites: ['(\\le|\\leq|≤)\s*y\^\{?2\}?\s*\\to']
            teoria: ["T2.14"]
          - id: fy_continua
            titol: "Continuïtat de $f_y$"
            objectiu: |
              Estudiar on és contínua $f_y$, en particular als punts de l'eix $y=0$.
            idea: |
              Separa els dos sumands de $f_y$ per $y\neq0$; mira quin d'ells pot no tendir a $0$ quan $y\to0$, i distingeix si el punt de l'eix és l'origen o no.
            detall: |
              $f_y=2xy\sin\frac1y-x\cos\frac1y$ si $y\neq0$, $f_y(a,0)=0$. Si $a\neq0$: sobre la recta $x=a$, $f_y(a,y)=2ay\sin\frac1y-a\cos\frac1y$, i $a\cos\frac1y$ no té límit quan $y\to0$ (val $a$ a $y_n=\frac1{2n\pi}$ i $-a$ a $y_n=\frac1{(2n+1)\pi}$): $f_y$ no és contínua a $(a,0)$. A l'origen: $|f_y(x,y)|\le2|x||y|+|x|\to0$, i és contínua.
            fuites: ['\ba\s*\\cos\s*(\\[dt]?frac|\(\s*1\s*/\s*y)', '2\s*\|x\|\s*\|y\|\s*\+\s*\|x\|']
            teoria: ["T2.14", "T2.6"]
          - id: obert_maxim
            titol: "L'obert màxim"
            objectiu: |
              Determinar el major obert $U$ on $f$ és de classe $\mathcal{C}^1$.
            idea: |
              Per ser $\mathcal{C}^1$ a un obert cal que les parcials hi siguin contínues a cada punt. Pregunta't si el conjunt de punts on les parcials són contínues és obert, i quin és el seu interior.
            detall: |
              Les parcials són contínues exactament a $\{y\neq0\}\cup\{(0,0)\}$. Aquest conjunt no és obert: tota bola centrada a l'origen conté punts $(a,0)$ amb $a\neq0$. Qualsevol obert $U$ amb $f\in\mathcal{C}^1(U)$ ha d'estar dins d'aquest conjunt i, per ser obert, no pot contenir l'origen; per tant $U\subseteq\{y\neq0\}$. I a $\{y\neq0\}$ (obert) $f$ és diferenciable amb parcials contínues. Així $U=\{(x,y):\ y\neq0\}$.
            fuites: ['U\s*=\s*\\\{[^$]*y\s*\\neq?\s*0', '\\setminus\s*\\\{[^$]*y\s*=\s*0']
            teoria: ["T3.20", "T1.11"]
        errors_comuns:
          - id: inclou_origen
            descripcio: |
              Inclou l'origen a $U$ perquè les parcials hi són contínues.
            pregunta: |
              Si l'origen fos a $U$, una bola al voltant de l'origen hi hauria de ser. Les parcials són contínues a tots els punts d'aquesta bola?
          - id: diferenciable_implica_C1
            descripcio: |
              Com que $f$ és diferenciable a tot $\mathbb{R}^2$ (apartat a), conclou que $U=\mathbb{R}^2$.
            pregunta: |
              Ser diferenciable a un punt, garanteix que les parcials hi siguin contínues?
          - id: cos_amb_x
            descripcio: |
              Creu que $x\cos\frac1y$ tendeix a $0$ a tots els punts de l'eix, o oblida aquest terme.
            pregunta: |
              Si fixes $x=a\neq0$ i fas $y\to0$, què fa cadascun dels dos termes de $f_y(a,y)$? Tots dos tendeixen a $0$?
        nota_professor: |
          "Maximal" s'entén com el més gran: tot obert on $f$ és $\mathcal{C}^1$ està contingut a $\{y\neq0\}$. L'origen és un punt on les parcials són contínues però no pertany a cap obert on $f$ sigui $\mathcal{C}^1$.

  - num: 28
    font: null
    preambul: |
      Donats $f:\mathbb{R}^n\to\mathbb{R}$ de classe $\mathcal{C}^1$ i $x_0\in\mathbb{R}^n$ tal que $f(x_0)=0$ i $Df(x_0)\neq0$, trobeu un vector $v$ de $\mathbb{R}^n$ tal que la funció $\phi(t)=f(x_0+tv)$ sigui creixent en un entorn de l'origen.
    indicacio: null
    exercicis:
      - id: "t3-28"
        apartat: null
        tipus: calcul
        enunciat: |
          Donats $f:\mathbb{R}^n\to\mathbb{R}$ de classe $\mathcal{C}^1$ i $x_0\in\mathbb{R}^n$ tal que $f(x_0)=0$ i $Df(x_0)\neq0$, trobeu un vector $v$ de $\mathbb{R}^n$ tal que la funció $\phi(t)=f(x_0+tv)$ sigui creixent en un entorn de l'origen.
        teoria: ["T3.20"]
        teoria_reservada: []
        resultat:
          valor: |
            Qualsevol $v$ amb $\nabla f(x_0)\cdot v>0$; per exemple $v=\nabla f(x_0)$, que dona $\phi'(0)=\|\nabla f(x_0)\|^2>0$ i, per continuïtat de $\phi'(t)=\nabla f(x_0+tv)\cdot v$, $\phi'>0$ en un entorn de $0$, on $\phi$ és (estrictament) creixent. (La hipòtesi $f(x_0)=0$ no fa falta.)
          fuites: ['v\s*=\s*(\\nabla\s*f|Df)\s*\(x_0\)', '(direcci[óo]|sentit)\s+del\s+gradient']
        passos:
          - id: derivar_phi
            titol: "Derivar $\\phi$"
            objectiu: |
              Calcular $\phi'(t)$.
            idea: |
              $\phi$ és la composició de $f$ amb la corba $t\mapsto x_0+tv$; aplica la regla de la cadena.
            detall: |
              $\phi'(t)=Df(x_0+tv)\,v=\nabla f(x_0+tv)\cdot v$.
            fuites: ['\\nabla\s*f\(x_0\s*\+\s*tv\)\s*\\cdot\s*v']
            teoria: ["T3.21"]
          - id: condicio
            titol: "Condició per ser creixent"
            objectiu: |
              Reduir "creixent en un entorn de $0$" a una condició a $t=0$.
            idea: |
              Una derivada positiva en un interval dona creixement (fet d'una variable); què saps de la continuïtat de $\phi'$?
            detall: |
              Com que $f\in\mathcal{C}^1$, les parcials són contínues i $\phi'(t)=\sum_i\frac{\partial f}{\partial x_i}(x_0+tv)v_i$ és contínua. Si $\phi'(0)=\nabla f(x_0)\cdot v>0$, aleshores $\phi'>0$ en un entorn de $0$ i $\phi$ hi és creixent.
            fuites: ['\\nabla\s*f\s*\(x_0\)\s*\\cdot\s*v\s*>\s*0', '\\langle\s*\\nabla\s*f\s*\(x_0\)\s*,\s*v\s*\\rangle\s*>\s*0']
            teoria: ["T3.20"]
          - id: triar_v
            titol: "Triar el vector"
            objectiu: |
              Trobar un $v$ concret que compleixi la condició.
            idea: |
              Tria $v$ de manera que el producte escalar amb el gradient sigui clarament positiu.
            detall: |
              $v=\nabla f(x_0)$: $\phi'(0)=\|\nabla f(x_0)\|^2>0$ perquè $Df(x_0)\neq0$. (És la direcció de màxim creixement.)
            fuites: ['\\nabla\s*f\(x_0\)\\\|\^2']
            teoria: ["T3.10", "T3.13"]
        errors_comuns:
          - id: sense_entorn
            descripcio: |
              Conclou que $\phi$ és creixent a prop de $0$ només perquè $\phi'(0)>0$, sense usar la continuïtat de $\phi'$.
            pregunta: |
              Saber que $\phi'(0)>0$, et diu res de $\phi'(t)$ per a $t$ proper a $0$? Quina hipòtesi ho garanteix?
          - id: usa_f_x0
            descripcio: |
              Creu que la hipòtesi $f(x_0)=0$ és essencial o intenta fer-la servir.
            pregunta: |
              Si canviessis $f$ per $f+5$, canviaria alguna cosa del que vols demostrar?
          - id: cadena_malament
            descripcio: |
              Deriva $f(x_0+tv)$ com si fos una funció d'una variable, sense el vector $v$.
            pregunta: |
              $f$ és de $n$ variables; quina és la derivada de la corba $t\mapsto x_0+tv$?
          - id: v_perpendicular
            descripcio: |
              Tria $v$ perpendicular al gradient o amb producte escalar negatiu.
            pregunta: |
              Quin signe té $\nabla f(x_0)\cdot v$ amb el teu $v$?
        nota_professor: |
          Fitxa reutilitzada de l'antic t3-28 (mateix problema). Sense la continuïtat de $\phi'$ (és a dir, sense $\mathcal{C}^1$), $\phi'(0)>0$ no garanteix monotonia en un entorn.

  - num: 29
    font: null
    preambul: |
      Considerem la funció $f(x,y)=\displaystyle\int_y^x e^{xyt}\,dt$. Calculeu $\dfrac{\partial f}{\partial x}$ i $\dfrac{\partial f}{\partial y}$ usant la fórmula de Leibniz. Comproveu el resultat calculant primer la integral i derivant després.
    indicacio: null
    exercicis:
      - id: "t3-29"
        apartat: null
        tipus: calcul
        enunciat: |
          Considerem la funció $f(x,y)=\displaystyle\int_y^x e^{xyt}\,dt$. Calculeu $\dfrac{\partial f}{\partial x}$ i $\dfrac{\partial f}{\partial y}$ usant la fórmula de Leibniz. Comproveu el resultat calculant primer la integral i derivant després.
        teoria: ["T3.32", "T3.2"]
        teoria_reservada: []
        resultat:
          valor: |
            Per Leibniz: $\frac{\partial f}{\partial x}=e^{x^2y}+\int_y^x yt\,e^{xyt}\,dt$ i $\frac{\partial f}{\partial y}=-e^{xy^2}+\int_y^x xt\,e^{xyt}\,dt$. Per $xy\neq0$, $f(x,y)=\frac{e^{x^2y}-e^{xy^2}}{xy}$ (i $f=x-y$ si $xy=0$), i, per a $xy\neq0$, els dos camins donen
            $\frac{\partial f}{\partial x}=e^{x^2y}\left(2-\frac{1}{x^2y}\right)-e^{xy^2}\left(\frac{y}{x}-\frac{1}{x^2y}\right)$, $\frac{\partial f}{\partial y}=e^{x^2y}\left(\frac{x}{y}-\frac{1}{xy^2}\right)-e^{xy^2}\left(2-\frac{1}{xy^2}\right)$.
          fuites: ['e\^\{\s*x\^\{?2\}?\s*y\s*\}\s*\+\s*\\int', '-\s*e\^\{\s*x\s*y\^\{?2\}?\s*\}\s*\+\s*\\int', '2\s*-\s*\\[dt]?frac\{1\}\{x\^\{?2\}?\s*y\}', '2\s*-\s*\\[dt]?frac\{1\}\{x\s*y\^\{?2\}?\}']
        passos:
          - id: leibniz_x
            titol: "Parcial respecte de $x$ amb Leibniz"
            objectiu: |
              Calcular $\frac{\partial f}{\partial x}$ amb la regla de Leibniz, deixant-la expressada amb una integral.
            idea: |
              Amb $y$ fix, $x$ apareix a l'integrand i al límit superior. Identifica l'integrand com a funció de $(t,x)$ i els límits d'integració com a funcions de $x$, comprova les hipòtesis i aplica la fórmula.
            detall: |
              Amb $y$ fix, $g(t,x)=e^{xyt}$ és $\mathcal{C}^1$ a $\mathbb{R}^2$, el límit inferior $y$ és constant i el superior és $x$. Per Leibniz: $\frac{\partial f}{\partial x}=e^{x\cdot y\cdot x}\cdot1-0+\int_y^x yt\,e^{xyt}\,dt=e^{x^2y}+\int_y^x yt\,e^{xyt}\,dt$.
            fuites: ['e\^\{\s*x\^\{?2\}?\s*y\s*\}\s*\+\s*\\int']
            teoria: ["T3.32"]
          - id: leibniz_y
            titol: "Parcial respecte de $y$ amb Leibniz"
            objectiu: |
              Calcular $\frac{\partial f}{\partial y}$ amb la regla de Leibniz.
            idea: |
              Ara $x$ és fix i $y$ apareix a l'integrand i al límit inferior; vigila el signe del terme de frontera.
            detall: |
              $\frac{\partial f}{\partial y}=0-e^{xy\cdot y}\cdot1+\int_y^x xt\,e^{xyt}\,dt=-e^{xy^2}+\int_y^x xt\,e^{xyt}\,dt$.
            fuites: ['-\s*e\^\{\s*x\s*y\^\{?2\}?\s*\}\s*\+\s*\\int']
            teoria: ["T3.32"]
          - id: integral_explicita
            titol: "Calcular la integral"
            objectiu: |
              Obtenir una expressió de $f(x,y)$ sense integrals.
            idea: |
              Integra respecte de $t$ tractant $xy$ com una constant; separa el cas en què aquesta constant és $0$.
            detall: |
              Si $xy\neq0$: $f(x,y)=\left[\frac{e^{xyt}}{xy}\right]_{t=y}^{t=x}=\frac{e^{x^2y}-e^{xy^2}}{xy}$. Si $xy=0$: $f(x,y)=\int_y^x1\,dt=x-y$.
            fuites: ['\\[dt]?frac\{\s*e\^\{\s*x\^\{?2\}?\s*y\s*\}\s*-\s*e\^\{\s*x\s*y\^\{?2\}?\s*\}\s*\}\{\s*x\s*y\s*\}', '\\[dt]?frac\s*\{\s*e\^\{\s*x\s*y\s*t\s*\}\s*\}\s*\{\s*x\s*y\s*\}']
            teoria: []
          - id: comprovar
            titol: "Comparar els dos càlculs"
            objectiu: |
              Comprovar que els dos mètodes donen les mateixes parcials.
            idea: |
              Deriva l'expressió explícita amb la regla del quocient, i calcula la integral que queda a Leibniz (per parts, $\int t\,e^{at}\,dt$); compara.
            detall: |
              Amb $a=xy\neq0$, $\int t\,e^{at}dt=e^{at}\left(\frac ta-\frac1{a^2}\right)$, de manera que $\int_y^x yt\,e^{xyt}dt=e^{x^2y}\left(1-\frac{1}{x^2y}\right)-e^{xy^2}\left(\frac yx-\frac{1}{x^2y}\right)$ i Leibniz dona $\frac{\partial f}{\partial x}=e^{x^2y}\left(2-\frac{1}{x^2y}\right)-e^{xy^2}\left(\frac{y}{x}-\frac{1}{x^2y}\right)$. Derivant $\frac{e^{x^2y}-e^{xy^2}}{xy}$ respecte de $x$ s'obté el mateix. Anàlogament (o per l'antisimetria $f(y,x)=-f(x,y)$) $\frac{\partial f}{\partial y}=e^{x^2y}\left(\frac{x}{y}-\frac{1}{xy^2}\right)-e^{xy^2}\left(2-\frac{1}{xy^2}\right)$ pels dos camins.
            fuites: ['2\s*-\s*\\frac\{1\}\{x\^2\s*y\}', '2\s*-\s*\\frac\{1\}\{x\s*y\^2\}']
            teoria: []
        errors_comuns:
          - id: oblida_frontera
            descripcio: |
              Aplica només "derivar dins la integral" i oblida el terme que ve del límit d'integració variable.
            pregunta: |
              El límit d'integració depèn de la variable respecte de la qual derives? Quin terme aporta això a la fórmula de Leibniz?
          - id: signe_limit_inferior
            descripcio: |
              Posa amb signe positiu el terme de frontera del límit inferior en derivar respecte de $y$.
            pregunta: |
              Si $\int_y^x g(t)\,dt=G(x)-G(y)$, quin signe té la derivada respecte de $y$?
          - id: integrand_mal_avaluat
            descripcio: |
              Avalua el terme de frontera com $e^{xyx}$ però després el simplifica malament, o avalua a $t$ en lloc del límit.
            pregunta: |
              Al terme de frontera, quin valor de $t$ substitueixes a $e^{xyt}$? Què queda a l'exponent?
          - id: divideix_per_zero
            descripcio: |
              Usa $\frac{e^{x^2y}-e^{xy^2}}{xy}$ a tot el pla, sense excloure $xy=0$.
            pregunta: |
              Per a quins $(x,y)$ té sentit dividir per $xy$? Què val $f$ en aquests punts?
        nota_professor: |
          La regla de Leibniz dels apunts té un sol paràmetre; aquí s'aplica derivant respecte d'una variable amb l'altra fixa. Les fórmules de Leibniz valen a tot $\mathbb{R}^2$; l'expressió tancada només per $xy\neq0$.

  - num: 30
    font: null
    preambul: |
      Donada $f:\mathbb{R}\to\mathbb{R}$ contínua, comproveu que la funció $\varphi(x)=\displaystyle\int_0^x f(\xi)\sin(x-\xi)\,d\xi$ satisfà l'equació $\varphi''(x)+\varphi(x)=f(x)$, per a tot $x\in\mathbb{R}$.
    indicacio: null
    exercicis:
      - id: "t3-30"
        apartat: null
        tipus: teoric
        enunciat: |
          Donada $f:\mathbb{R}\to\mathbb{R}$ contínua, comproveu que la funció $\varphi(x)=\displaystyle\int_0^x f(\xi)\sin(x-\xi)\,d\xi$ satisfà l'equació $\varphi''(x)+\varphi(x)=f(x)$, per a tot $x\in\mathbb{R}$.
        teoria: []
        teoria_reservada: []
        resultat:
          valor: |
            Per Leibniz, $\varphi'(x)=f(x)\sin0+\int_0^xf(\xi)\cos(x-\xi)\,d\xi=\int_0^xf(\xi)\cos(x-\xi)\,d\xi$ i $\varphi''(x)=f(x)\cos0-\int_0^xf(\xi)\sin(x-\xi)\,d\xi=f(x)-\varphi(x)$, és a dir $\varphi''+\varphi=f$. (Com que $f$ només és contínua, la justificació rigorosa es pot fer escrivint $\sin(x-\xi)=\sin x\cos\xi-\cos x\sin\xi$ i usant el teorema fonamental del càlcul.)
          fuites: []
        passos:
          - id: derivada_primera
            titol: "Primera derivada"
            objectiu: |
              Calcular $\varphi'(x)$.
            idea: |
              $x$ apareix al límit superior i dins l'integrand: aplica la regla de Leibniz amb integrand $g(\xi,x)=f(\xi)\sin(x-\xi)$.
            detall: |
              $\varphi'(x)=g(x,x)\cdot1+\int_0^x\frac{\partial g}{\partial x}(\xi,x)\,d\xi=f(x)\sin0+\int_0^xf(\xi)\cos(x-\xi)\,d\xi=\int_0^xf(\xi)\cos(x-\xi)\,d\xi$.
            fuites: ['\\int_\{?0\}?\^\{?x\}?\s*f\s*\(\\xi\)\s*\\cos\s*\(\s*x\s*-\s*\\xi\s*\)']
            teoria: ["T3.32"]
          - id: derivada_segona
            titol: "Segona derivada"
            objectiu: |
              Calcular $\varphi''(x)$ i relacionar-la amb $\varphi$.
            idea: |
              Torna a aplicar Leibniz a l'expressió de $\varphi'$ i reconeix a la integral que surt la definició de $\varphi$.
            detall: |
              $\varphi''(x)=f(x)\cos0+\int_0^xf(\xi)\,(-\sin(x-\xi))\,d\xi=f(x)-\varphi(x)$. Per tant $\varphi''+\varphi=f$ per a tot $x$.
            fuites: ['=\s*f\(x\)\s*-\s*\\varphi\(x\)']
            teoria: ["T3.32"]
          - id: hipotesis
            titol: "Justificar les hipòtesis"
            objectiu: |
              Justificar que el càlcul és vàlid tenint en compte que $f$ només és contínua.
            idea: |
              La regla de Leibniz dels apunts demana integrand $\mathcal{C}^1$. Mira quines derivades de l'integrand fan servir realment els càlculs, o bé separa la dependència en $x$ de la dependència en $\xi$ amb una fórmula trigonomètrica.
            detall: |
              $g(\xi,x)=f(\xi)\sin(x-\xi)$ no és necessàriament $\mathcal{C}^1$ (no cal que $f$ sigui derivable), però $g$ i $\frac{\partial g}{\partial x}=f(\xi)\cos(x-\xi)$ són contínues, que és el que fa servir la demostració de Leibniz. Alternativa totalment elemental: $\varphi(x)=\sin x\,A(x)-\cos x\,B(x)$ amb $A(x)=\int_0^xf(\xi)\cos\xi\,d\xi$, $B(x)=\int_0^xf(\xi)\sin\xi\,d\xi$, derivables pel teorema fonamental del càlcul ($A'=f\cos x$, $B'=f\sin x$). Llavors $\varphi'=\cos x\,A+\sin x\,B$ i $\varphi''=-\sin x\,A+\cos x\,B+f(x)(\cos^2x+\sin^2x)=f(x)-\varphi(x)$.
            fuites: []
            teoria: ["T3.32"]
        errors_comuns:
          - id: oblida_frontera
            descripcio: |
              Deriva només dins la integral i oblida el terme de frontera (o, en la segona derivada, el terme $f(x)\cos0=f(x)$).
            pregunta: |
              El límit superior d'integració depèn de $x$? Quin terme hi afegeix la regla de Leibniz, i quant val en cada derivada?
          - id: deriva_f
            descripcio: |
              Deriva respecte de $x$ el factor $f(\xi)$, o hi fa aparèixer $f'$, que pot no existir.
            pregunta: |
              Respecte de quina variable derives? Depèn $f(\xi)$ d'aquesta variable?
          - id: signe_sinus
            descripcio: |
              Equivoca el signe de la derivada de $\sin(x-\xi)$ o de $\cos(x-\xi)$ respecte de $x$.
            pregunta: |
              Quina és la derivada de $\cos(x-\xi)$ respecte de $x$, amb $\xi$ fix?
        nota_professor: |
          És la fórmula de variació de constants per a $y''+y=f$ amb $y(0)=y'(0)=0$. La regla de Leibniz dels apunts (T3.32) es formula per a integrands $\mathcal{C}^1$; aquí l'integrand només té contínua la derivada respecte del paràmetre, que és el que realment fa servir la demostració. L'exemple 34 (fórmula recurrent amb $(x-y)^n$) és un càlcul semblant.

  - num: 31
    font: null
    preambul: |
      Sigui $F:\mathbb{R}\to\mathbb{R}^2$ definida per $F(t)=(t^2,t^3)$. Existeix algun valor $t_0\in(0,1)$ tal que $F(1)-F(0)=DF(t_0)\cdot(1-0)$? Contradiu això el teorema del valor mitjà?
    indicacio: null
    exercicis:
      - id: "t3-31"
        apartat: null
        tipus: calcul
        enunciat: |
          Sigui $F:\mathbb{R}\to\mathbb{R}^2$ definida per $F(t)=(t^2,t^3)$. Existeix algun valor $t_0\in(0,1)$ tal que $F(1)-F(0)=DF(t_0)\cdot(1-0)$? Contradiu això el teorema del valor mitjà?
        teoria: ["T3.10"]
        teoria_reservada: ["T3.x8"]
        resultat:
          valor: |
            No existeix: caldria alhora $2t_0=1$ i $3t_0^2=1$, és a dir $t_0=1/2$ i $t_0=1/\sqrt3$. No contradiu el teorema del valor mitjà: el TVM amb igualtat és per a funcions a valors reals; per a $F:\mathbb{R}\to\mathbb{R}^2$ el teorema dels apunts només afirma que per a cada $u\in\mathbb{R}^2$ existeix $\xi$ (que depèn de $u$) amb $\langle u,F(1)-F(0)\rangle=\langle u,DF(\xi)(1-0)\rangle$. Aplicat a cada component, dona $t_0=1/2$ per a la primera i $t_0=1/\sqrt3$ per a la segona, diferents.
          fuites: ['1\s*/\s*\\sqrt\{?3\}?', '\\[dt]?frac\{1\}\{\\sqrt\{?3\}?\}', 'no\s+existeix\s+(cap\s+)?(\$?t_0|tal|aquest|cap)', 'no\s+existeix\s*[:.]','no\s+hi\s+ha\s+cap\s+\$?t_0']
        passos:
          - id: plantejar
            titol: "Escriure la igualtat"
            objectiu: |
              Escriure explícitament els dos costats de la igualtat.
            idea: |
              Calcula $F(1)-F(0)$ i la derivada $DF(t_0)$, que és un vector (matriu $2\times1$).
            detall: |
              $F(1)-F(0)=(1,1)$ i $DF(t_0)=(2t_0,3t_0^2)$.
            fuites: ['\(2t_0\s*,\s*3t_0\^2\)']
            teoria: ["T3.10"]
          - id: sistema
            titol: "Resoldre el sistema"
            objectiu: |
              Veure si hi ha un únic $t_0$ que serveixi per a les dues components.
            idea: |
              La igualtat de vectors són dues equacions que ha de complir el mateix $t_0$.
            detall: |
              $2t_0=1$ dona $t_0=1/2$, però aleshores $3t_0^2=3/4\neq1$. No existeix.
            fuites: ['3\s*/\s*4', '\\[dt]?frac\s*\{?3\}?\s*\{?4\}?', 't_0\s*=\s*(1\s*/\s*2|\\[dt]?frac\s*\{?1\}?\s*\{?2)']
            teoria: []
          - id: interpretar
            titol: "Interpretar respecte del TVM"
            objectiu: |
              Explicar per què això no contradiu el teorema del valor mitjà.
            idea: |
              Recorda exactament l'enunciat del TVM: per a quin tipus de funcions dona una igualtat amb un sol punt intermedi, i què diu per a funcions a valors vectorials.
            detall: |
              El TVM amb igualtat és per a funcions reals: aplicat a cada component dona $t_0=1/2$ per a la primera i $t_0=1/\sqrt3$ per a la segona, diferents. Per a funcions vectorials el teorema dels apunts només diu que per a cada $u\in\mathbb{R}^2$ hi ha un $\xi_u$ amb $\langle u,F(1)-F(0)\rangle=\langle u,DF(\xi_u)\rangle$; el punt depèn de $u$, i no hi ha cap $\xi$ que serveixi per a tots els $u$ alhora.
            fuites: ['1\s*/\s*\\sqrt', '\\xi_u']
            teoria: ["T3.25"]
        errors_comuns:
          - id: tvm_vectorial
            descripcio: |
              Creu que el TVM amb igualtat val per a funcions vectorials.
            pregunta: |
              L'enunciat del TVM que coneixes, per a quin tipus de funcions dona una igualtat amb un sol punt?
          - id: una_component
            descripcio: |
              Troba $t_0$ per a una sola component i conclou que existeix.
            pregunta: |
              El $t_0$ que has trobat, funciona també per a l'altra component?
          - id: tvm_fals
            descripcio: |
              Conclou que el TVM és fals o que hi ha una contradicció.
            pregunta: |
              Quines hipòtesis i quina conclusió té el TVM? Alguna d'elles falla aquí?
        nota_professor: |
          Fitxa reutilitzada de l'antic t3-31 (mateix problema). És l'"exemple sobre el teorema del valor mitjà" del final de la secció 3.3 dels apunts (reservat), que també verifica el teorema 25 per a tot $u$.

  - num: 32
    font: null
    preambul: |
      Sigui $f\in\mathcal{C}^1(\mathbb{R}^2)$ tal que $f(x,x)=0$ per tot $x\in\mathbb{R}$ i $\dfrac{\partial f}{\partial x}(0,0)=1$. Determineu $\mathbf{v}$ (de norma 1) de manera que $D_{\mathbf{v}}f(0,0)$ sigui màxima.
    indicacio: null
    exercicis:
      - id: "t3-32"
        apartat: null
        tipus: calcul
        enunciat: |
          Sigui $f\in\mathcal{C}^1(\mathbb{R}^2)$ tal que $f(x,x)=0$ per tot $x\in\mathbb{R}$ i $\dfrac{\partial f}{\partial x}(0,0)=1$. Determineu $\mathbf{v}$ (de norma 1) de manera que $D_{\mathbf{v}}f(0,0)$ sigui màxima.
        teoria: ["T3.1", "T3.20"]
        teoria_reservada: []
        resultat:
          valor: |
            Derivant $f(t,t)=0$ a $t=0$: $\frac{\partial f}{\partial x}(0,0)+\frac{\partial f}{\partial y}(0,0)=0$, per tant $\nabla f(0,0)=(1,-1)$. La derivada direccional màxima s'obté per a $\mathbf{v}=\frac{\nabla f(0,0)}{\|\nabla f(0,0)\|}=\frac{1}{\sqrt2}(1,-1)$, i val $\sqrt2$.
          fuites: ['\\[dt]?frac\{?1\}?\{?\\sqrt\{?2\}?\}?\s*\(1,\s*-\s*1\)', '\(\s*\\[dt]?frac\{1\}\{\\sqrt\{?2\}?\}\s*,\s*-\s*\\[dt]?frac', '\\[dt]?frac\{\\sqrt\{?2\}?\}\{2\}\s*,\s*-', '\\[dt]?frac\{\s*\(1,\s*-\s*1\)\s*\}\{\s*\\sqrt', '\(1,\s*-\s*1\)\s*/\s*\\sqrt', '\\nabla\s*f\s*\(0,\s*0\)\s*=\s*\(1,\s*-\s*1\)']
        passos:
          - id: diagonal
            titol: "Usar que $f$ s'anul·la a la diagonal"
            objectiu: |
              Obtenir una relació entre les dues derivades parcials de $f$ a l'origen.
            idea: |
              Considera la funció d'una variable $t\mapsto f(t,t)$: què en saps, i com es deriva amb la regla de la cadena? Comprova que $f$ compleix les hipòtesis.
            detall: |
              $f\in\mathcal{C}^1$ és diferenciable. $g(t)=f(t,t)=0$ per a tot $t$, i per la regla de la cadena $0=g'(0)=\frac{\partial f}{\partial x}(0,0)\cdot1+\frac{\partial f}{\partial y}(0,0)\cdot1$.
            fuites: ['\\[dt]?frac\{\\partial\s*f\}\{\\partial\s*x\}\s*\(0,\s*0\)\s*(\\cdot\s*1\s*)?\+\s*\\[dt]?frac\{\\partial\s*f\}\{\\partial\s*y\}\s*\(0,\s*0\)', 'f_x\s*\(0,\s*0\)\s*\+\s*f_y\s*\(0,\s*0\)', 'g''\(0\)\s*=\s*\\frac']
            teoria: ["T3.18", "T3.21"]
          - id: gradient
            titol: "Calcular el gradient"
            objectiu: |
              Determinar $\nabla f(0,0)$.
            idea: |
              Combina la relació anterior amb la dada de l'enunciat.
            detall: |
              $\frac{\partial f}{\partial y}(0,0)=-\frac{\partial f}{\partial x}(0,0)=-1$, per tant $\nabla f(0,0)=(1,-1)$.
            fuites: ['\\nabla\s*f\s*\(0,\s*0\)\s*=\s*\(1,\s*-\s*1\)', '\\partial\s*y\s*\}\s*\(0,\s*0\)\s*=\s*(-\s*\\[dt]?frac\{\\partial\s*f\}\{\\partial\s*x\}\s*\(0,\s*0\)\s*=\s*)?-\s*1\b', 'f_y\s*\(0,\s*0\)\s*=\s*-\s*1\b']
            teoria: ["T3.10"]
          - id: maxim
            titol: "Direcció de màxim creixement"
            objectiu: |
              Trobar el vector unitari $\mathbf{v}$ que fa màxima $D_{\mathbf{v}}f(0,0)$.
            idea: |
              Per a $f$ diferenciable, $D_{\mathbf{v}}f(0,0)=\langle\nabla f(0,0),\mathbf{v}\rangle$; maximitza aquest producte escalar sobre els vectors unitaris.
            detall: |
              Per Cauchy-Schwarz, $\langle\nabla f(0,0),\mathbf{v}\rangle\le\|\nabla f(0,0)\|=\sqrt2$, amb igualtat per a $\mathbf{v}=\frac{\nabla f(0,0)}{\|\nabla f(0,0)\|}=\frac{1}{\sqrt2}(1,-1)$.
            fuites: ['\\[dt]?frac\{?1\}?\{?\\sqrt\{?2\}?\}?\s*\(1,\s*-\s*1\)', '\(\s*\\[dt]?frac\{1\}\{\\sqrt\{?2\}?\}\s*,\s*-\s*\\[dt]?frac', '\\[dt]?frac\{\s*\(1,\s*-\s*1\)\s*\}\{\s*\\sqrt', '\(1,\s*-\s*1\)\s*/\s*\\sqrt']
            teoria: ["T3.9", "T3.13"]
        errors_comuns:
          - id: parcial_y_zero
            descripcio: |
              Suposa que $\frac{\partial f}{\partial y}(0,0)=0$ (o que no es pot determinar) i pren $\mathbf{v}=(1,0)$.
            pregunta: |
              Què et diu la condició $f(x,x)=0$ sobre com varia $f$ en la direcció de la diagonal?
          - id: no_normalitza
            descripcio: |
              Dona com a resposta el gradient sense normalitzar.
            pregunta: |
              L'enunciat demana $\mathbf{v}$ de norma $1$. Quina norma té el vector que proposes?
          - id: confon_diagonal
            descripcio: |
              Pren la direcció de la diagonal $(1,1)/\sqrt2$, on la derivada direccional és precisament nul·la.
            pregunta: |
              Quant val $D_{\mathbf{v}}f(0,0)$ en la direcció de la diagonal? Pot ser aquesta la màxima?
        nota_professor: |
          La hipòtesi $\mathcal{C}^1$ garanteix la diferenciabilitat, necessària tant per a la regla de la cadena com per a $D_{\mathbf{v}}f=\langle\nabla f,\mathbf{v}\rangle$. El gradient és ortogonal a la corba de nivell $y=x$, coherent amb la proposició 13(iii).

  - num: 33
    font: null
    preambul: |
      Sigui $M_2(\mathbb{R})$ el conjunt de matrius quadrades $2\times2$ amb coeficients reals, que identifiquem amb $\mathbb{R}^4$ mitjançant l'aplicació $F:M_2(\mathbb{R})\longrightarrow\mathbb{R}^4$ donada per
      $$F\begin{pmatrix}a&c\\b&d\end{pmatrix}=(a,b,c,d)^T$$
      Considerem l'aplicació $\det:M_2(\mathbb{R})\longrightarrow\mathbb{R}$, que associa a cada matriu el seu determinant.
    indicacio: null
    exercicis:
      - id: "t3-33a"
        apartat: "a"
        tipus: teoric
        enunciat: |
          Demostreu que $\det$ és diferenciable.
        teoria: ["T3.8"]
        teoria_reservada: []
        resultat:
          valor: |
            Amb la identificació $F$, $\det(a,b,c,d)=ad-bc$, un polinomi. Les seves parcials $(\partial_a,\partial_b,\partial_c,\partial_d)\det=(d,-c,-b,a)$ existeixen i són contínues a tot $\mathbb{R}^4$, per tant $\det$ és diferenciable (de fet $\mathcal{C}^1$) a tot $\mathbb{R}^4\cong M_2(\mathbb{R})$.
          fuites: []
        passos:
          - id: coordenades
            titol: "Escriure $\\det$ en coordenades"
            objectiu: |
              Expressar $\det$ com una funció de $(a,b,c,d)\in\mathbb{R}^4$.
            idea: |
              Usa la identificació $F$ per saber quina entrada de la matriu és cada coordenada.
            detall: |
              $\det\begin{pmatrix}a&c\\b&d\end{pmatrix}=ad-bc$, és a dir $\det\circ F^{-1}(a,b,c,d)=ad-bc$.
            fuites: []
            teoria: []
          - id: parcials_continues
            titol: "Condició suficient"
            objectiu: |
              Concloure que $\det$ és diferenciable a tot punt.
            idea: |
              Calcula les derivades parcials i mira si són contínues; o bé usa que sumes i productes de funcions diferenciables són diferenciables.
            detall: |
              $\frac{\partial\det}{\partial a}=d$, $\frac{\partial\det}{\partial b}=-c$, $\frac{\partial\det}{\partial c}=-b$, $\frac{\partial\det}{\partial d}=a$: contínues a tot $\mathbb{R}^4$. Per la condició suficient, $\det$ és diferenciable a tot $\mathbb{R}^4$. (Alternativament: les projeccions són lineals, i per tant diferenciables, i $ad-bc$ és suma de productes d'aquestes.)
            fuites: ['\(d,\s*-\s*c,\s*-\s*b,\s*a\)', '\\frac\{\\partial\s*\\det\}\{\\partial\s*a\}\s*=\s*d']
            teoria: ["T3.18", "T3.23"]
        errors_comuns:
          - id: identificacio
            descripcio: |
              Confon l'ordre de les coordenades donat per $F$ (per exemple pren $c$ com la segona coordenada).
            pregunta: |
              Segons $F$, quina és la segona coordenada de $\begin{pmatrix}a&c\\b&d\end{pmatrix}$?
          - id: sense_justificar
            descripcio: |
              Diu "és un polinomi, per tant és diferenciable" sense relacionar-ho amb cap resultat.
            pregunta: |
              Quin resultat del tema et permet passar de "parcials contínues" (o "suma de productes de funcions diferenciables") a "diferenciable"?
        nota_professor: |
          Cal fixar la identificació $F$, que és la que dona sentit a "diferenciable" a $M_2(\mathbb{R})$.

      - id: "t3-33b"
        apartat: "b"
        tipus: calcul
        enunciat: |
          Calculeu la diferencial de $\det$ en $I$.
        teoria: ["T3.8", "T3.10"]
        teoria_reservada: []
        resultat:
          valor: |
            $F(I)=(1,0,0,1)$ i $J\det(I)=(d,-c,-b,a)|_{I}=(1\ \ 0\ \ 0\ \ 1)$. Per tant, per a $H=\begin{pmatrix}h_{11}&h_{12}\\h_{21}&h_{22}\end{pmatrix}$, $D\det(I)(H)=h_{11}+h_{22}=\operatorname{tr}H$.
          fuites: ['h_\{?11\}?\s*\+\s*h_\{?22\}?', '\\(operatorname|mathrm)\{tr\}', 'tra[çc]a']
        passos:
          - id: gradient_general
            titol: "Jacobiana de $\\det$ en un punt qualsevol"
            objectiu: |
              Calcular la matriu jacobiana de $\det$ en un punt $(a,b,c,d)$.
            idea: |
              Com que $\det$ és diferenciable (apartat a), la jacobiana està formada per les parcials respecte de les coordenades donades per $F$.
            detall: |
              $J\det(a,b,c,d)=(d\ \ -c\ \ -b\ \ a)$.
            fuites: ['\(d\s*(\\\s|,|\s)*-\s*c\s*(\\\s|,|\s)*-\s*b\s*(\\\s|,|\s)*a\)']
            teoria: ["T3.9", "T3.10"]
          - id: avaluar_I
            titol: "Avaluar a $I$"
            objectiu: |
              Escriure $D\det(I)$ i interpretar-la com una aplicació lineal sobre matrius.
            idea: |
              Avalua la jacobiana a $F(I)$ i aplica-la a una matriu genèrica $H$ expressada en coordenades.
            detall: |
              $F(I)=(1,0,0,1)$, per tant $J\det(I)=(1\ \ 0\ \ 0\ \ 1)$ i $D\det(I)(H)=(1\ \ 0\ \ 0\ \ 1)\,(h_{11},h_{21},h_{12},h_{22})^T=h_{11}+h_{22}=\operatorname{tr}H$.
            fuites: ['h_\{?11\}?\s*\+\s*h_\{?22\}?', '\\(operatorname|mathrm)\{tr\}']
            teoria: ["T3.9"]
        errors_comuns:
          - id: diferencial_com_numero
            descripcio: |
              Dona com a diferencial el nombre $\det I=1$ o un vector sense dir com actua.
            pregunta: |
              La diferencial en un punt és un nombre o una aplicació lineal? Sobre quins objectes actua?
          - id: ordre_coordenades
            descripcio: |
              Col·loca les entrades de $H$ en un ordre diferent del de $F$ i obté una expressió incorrecta.
            pregunta: |
              Quina coordenada de $\mathbb{R}^4$ correspon a cada entrada de $H$ segons $F$?
          - id: avalua_malament
            descripcio: |
              Avalua la jacobiana a un punt diferent de $F(I)$.
            pregunta: |
              Quines són les coordenades $(a,b,c,d)$ de la matriu identitat?
        nota_professor: |
          Interpretació: $\det(I+tH)=1+t\operatorname{tr}H+O(t^2)$.

      - id: "t3-33c"
        apartat: "c"
        tipus: calcul
        enunciat: |
          Calculeu la derivada direccional de $\det$ en el punt $I$ i en la direcció $v=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$.
        teoria: ["T3.1"]
        teoria_reservada: []
        resultat:
          valor: |
            $D_v\det(I)=D\det(I)(v)=0+0=0$ (amb $F(v)=(0,1,-1,0)$, $(1,0,0,1)\cdot(0,1,-1,0)=0$). Directament: $\det(I+tv)=1+t^2$, amb derivada $0$ a $t=0$.
          fuites: ['D_\{?v\}?\s*\\det\s*\(I\)\s*=\s*(D\\det\(I\)\(v\)\s*=\s*)?0', '(direccional|derivada)\s+(és|val)\s*\$?\s*0\b', '1\s*\+\s*t\^\{?2\}?']
        passos:
          - id: via_diferencial
            titol: "Relacionar amb la diferencial"
            objectiu: |
              Expressar $D_v\det(I)$ en termes de la diferencial de $\det$ a $I$ (apartat b, que es pot donar per conegut).
            idea: |
              Per a funcions diferenciables, la derivada direccional s'obté aplicant la diferencial al vector.
            detall: |
              Com que $\det$ és diferenciable, $D_v\det(I)=D\det(I)(v)$, és a dir, la suma de les entrades diagonals de $v$.
            fuites: []
            teoria: ["T3.9"]
          - id: calcular
            titol: "Calcular"
            objectiu: |
              Obtenir el valor de $D_v\det(I)$.
            idea: |
              Escriu $v$ en coordenades amb $F$ i aplica-hi la jacobiana; pots comprovar-ho amb la definició, calculant $\det(I+tv)$.
            detall: |
              $F(v)=(0,1,-1,0)$ i $(1\ \ 0\ \ 0\ \ 1)\cdot(0,1,-1,0)^T=0$. Comprovació: $\det(I+tv)=\det\begin{pmatrix}1&-t\\t&1\end{pmatrix}=1+t^2$, i $\frac{d}{dt}(1+t^2)|_{t=0}=0$. Així $D_v\det(I)=0$.
            fuites: ['1\s*\+\s*t\^\{?2\}?', 'D_\{?v\}?\s*\\det\s*\(I\)\s*=\s*0']
            teoria: ["T3.1"]
        errors_comuns:
          - id: normalitza_sense_motiu
            descripcio: |
              Normalitza $v$ i després no ho diu, o creu que el resultat canviaria (aquí no ho fa perquè val $0$, però en general sí).
            pregunta: |
              La definició de derivada direccional demana que el vector sigui unitari? Què passa si el multipliques per un escalar?
          - id: coordenades_v
            descripcio: |
              Escriu $F(v)$ amb un ordre de coordenades incorrecte.
            pregunta: |
              Segons $F$, quines són les coordenades $(a,b,c,d)$ de $v$?
          - id: confon_punt_direccio
            descripcio: |
              Avalua la jacobiana al punt $v$ en lloc de a $I$.
            pregunta: |
              En aquest apartat, quin és el punt i quin és la direcció?
        nota_professor: |
          $v$ és una rotació infinitesimal; $I+tv$ té determinant $1+t^2$, estacionari a $t=0$.

      - id: "t3-33d"
        apartat: "d"
        tipus: calcul
        enunciat: |
          En quina direcció és màxima la derivada direccional de $\det$ en el punt $P=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$?
        teoria: ["T3.1"]
        teoria_reservada: []
        resultat:
          valor: |
            $F(P)=(0,1,-1,0)$ i $\nabla\det(P)=(d,-c,-b,a)|_P=(0,1,-1,0)$, que correspon a la matriu $P$ mateixa. La derivada direccional és màxima en la direcció del gradient: $u=\frac{1}{\sqrt2}(0,1,-1,0)$, és a dir la matriu $\frac{1}{\sqrt2}P=\frac{1}{\sqrt2}\begin{pmatrix}0&-1\\1&0\end{pmatrix}$, amb valor màxim $\|\nabla\det(P)\|=\sqrt2$.
          fuites: ['\\nabla\s*\\det\s*\(P\)\s*=\s*\(0,\s*1,\s*-\s*1,\s*0\)', '\\frac\{?1\}?\{?\\sqrt\{?2\}?\}?\s*(P\b|\(0,\s*1,\s*-\s*1,\s*0\)|\\begin)', 'P\s*/\s*\\sqrt']
        passos:
          - id: gradient_P
            titol: "Gradient a $P$"
            objectiu: |
              Calcular $\nabla\det(P)$.
            idea: |
              Usa la jacobiana general de $\det$ (apartats anteriors) i les coordenades de $P$ segons $F$.
            detall: |
              $F(P)=(0,1,-1,0)$, és a dir $a=0$, $b=1$, $c=-1$, $d=0$. Llavors $\nabla\det(P)=(d,-c,-b,a)=(0,1,-1,0)$, que via $F$ és la matriu $P$ mateixa.
            fuites: ['\\nabla\s*\\det\s*\(P\)\s*=\s*(\(d,\s*-\s*c,\s*-\s*b,\s*a\)\s*=\s*)?\(0,\s*1,\s*-\s*1,\s*0\)', 'P\$?\s+mateixa']
            teoria: ["T3.10"]
          - id: maxim
            titol: "Direcció de màxim creixement"
            objectiu: |
              Determinar la direcció (unitària) on la derivada direccional és màxima.
            idea: |
              Per a funcions diferenciables, la derivada direccional en direccions unitàries és màxima en la direcció del gradient normalitzat.
            detall: |
              $\|\nabla\det(P)\|=\sqrt2$, per tant la direcció és $u=\frac{1}{\sqrt2}(0,1,-1,0)$, és a dir la matriu $\frac{1}{\sqrt2}P$, i el valor màxim és $\sqrt2$.
            fuites: ['\\frac\{?1\}?\{?\\sqrt\{?2\}?\}?\s*(P\b|\(0,\s*1,\s*-\s*1,\s*0\))']
            teoria: ["T3.13"]
        errors_comuns:
          - id: gradient_a_I
            descripcio: |
              Fa servir el gradient a $I$ (de l'apartat b) en lloc del gradient a $P$.
            pregunta: |
              En quin punt s'ha d'avaluar el gradient en aquest apartat?
          - id: no_normalitza
            descripcio: |
              Dona la direcció sense normalitzar i en dona el valor màxim com si fos unitària.
            pregunta: |
              El màxim de $D_u\det(P)$ es busca sobre vectors de quina norma? Quina norma té el teu?
          - id: signes_gradient
            descripcio: |
              S'equivoca amb els signes de les parcials $-c$, $-b$ en avaluar a $P$.
            pregunta: |
              Quins valors tenen $b$ i $c$ a $P$? Què dona, doncs, $-c$ i $-b$?
        nota_professor: |
          En general $\nabla\det(A)$ correspon a la matriu de cofactors de $A$; a $P$ (ortogonal amb $\det P=1$) coincideix amb $P$. Comprovació: $\det(P+tP)=(1+t)^2$, i $D_P\det(P)=2=\sqrt2\cdot\|P\|$ amb $\|P\|=\sqrt2$.
