      - \(\s*0\s*,\s*0\s*,\s*1\s*\)\$?\s*(és|es)\s+(un\s+)?punt\s+de\s+sella
    passos:
    - id: punts_critics
      titol: Trobar els punts crítics
      objectiu: |
        Trobar els punts on s'anul·la el gradient de $f$.
      idea: |
        Cada derivada parcial depèn d'una sola variable.
      detall: |
        $f_x=2x$, $f_y=-2y$, $f_z=4(z-1)^3$: únic punt crític $(0,0,1)$.
