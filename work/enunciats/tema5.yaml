tema: 5
titol: "Polinomi de Taylor i extrems locals"
problemes:
  - num: 1
    font: null
    preambul: |
      Trobeu els polinomis de Taylor de grau $\leq k$, centrats a $p$, de les funcions següents:
    apartats:
      - lletra: a
        text: |
          $f(x,y,z)=xyz$, $k\in\mathbb{N}$, $p=(1,-1,0)$;
      - lletra: b
        text: |
          $f(x,y)=\sin(x^2y)$, $k=9$, $p=(0,0)$;
      - lletra: c
        text: |
          $f(x,y)=e^x\cos y$, $k=4$, $p=(0,0)$;
      - lletra: d
        text: |
          $f(x,y)=\dfrac{\sin x}{1+x+y}$, $k=2$, $p=(0,0)$;
      - lletra: e
        text: |
          $f(x,y)=x^y$, $k=2$, $p=(1,1)$;
      - lletra: f
        text: |
          $f(x,y)=\dfrac{y^2}{x^3}$, $k=2$, $p=(1,-1)$;
      - lletra: g
        text: |
          $f(x,y)=\sin(xy)+\cos(xy)$, $k=3$, $p=(0,0)$;
      - lletra: h
        text: |
          $f(x,y)=\log(2+xy)$, $k=3$, $p=(0,0)$;
      - lletra: i
        text: |
          $f(x,y)=e^{x^2+\sin y}$, $k=3$, $p=(0,0)$;
      - lletra: j
        text: |
          $f(x,y,z)=\dfrac{1}{1+x+y+z}$, $k=3$, $p=(0,0,0)$.
    indicacio: null
  - num: 2
    font: null
    preambul: |
      Siguin $\varphi:\mathbb{R}\to\mathbb{R}$ una funció de classe $\mathcal{C}^3(\mathbb{R})$ i $a\in\mathbb{R}$. Calculeu el polinomi de Taylor de grau 3 centrat a l'origen de la funció $f:\mathbb{R}^m\to\mathbb{R}$ definida per $f(x_1,\cdots,x_m)=\varphi\left(e^{a\sum_{i=1}^{m}x_i}\right)$.
    apartats: []
    indicacio: null
  - num: 3
    font: null
    preambul: |
      Feu servir el polinomi de Taylor de grau 2 de $f(x,y)=e^x+e^y$ a $(0,0)$ per donar un valor aproximat de $f(0.2,-0.1)$. Doneu també una fita superior de l'error comès amb aquesta aproximació.
    apartats: []
    indicacio: null
  - num: 4
    font: null
    preambul: |
      Sigui $g:\mathbb{R}^2\to\mathbb{R}$ una funció de classe $\mathcal{C}^2(\mathbb{R}^2)$ satisfent $g(0,1)=0$, $Jg(0,1)=(2\ \ -3)$ i
      $$Hg(0,1)=\begin{pmatrix}3/4&5/4\\5/4&5/4\end{pmatrix}.$$
      Sigui $f:\mathbb{R}\to\mathbb{R}$ una funció de classe $\mathcal{C}^1$ amb $f(0)=1$ i $f'(0)=-1/8$. Calculeu el polinomi de Taylor de grau $\leqslant2$, en el punt $(0,1)$, de la funció
      $$F(x,y)=\log\left(1+x^2+xy+y^2\right)+\int_0^{g(x,y)}f(t)\,dt.$$
    apartats: []
    indicacio: null
  - num: 5
    font: null
    preambul: |
      Trobeu i classifiqueu tots els punts crítics de les funcions següents:
    apartats:
      - lletra: a
        text: |
          $f(x,y)=x^4+y^4-2y^2+4xy-2x^2$;
      - lletra: b
        text: |
          $f(x,y)=\sin x+\sin y+\cos(x+y)$;
      - lletra: c
        text: |
          $f(x,y)=\exp(1-x^2-y^2)$;
      - lletra: d
        text: |
          $f(x,y)=x^2+y^2+3xy$;
      - lletra: e
        text: |
          $f(x,y)=y^2-x^3$;
      - lletra: f
        text: |
          $f(x,y)=(x-1)^2+(x-y)^2$;
      - lletra: g
        text: |
          $f(x,y)=x^2+xy^2+y^4$;
      - lletra: h
        text: |
          $f(x,y)=\log(1+x^2+y^2)$;
      - lletra: i
        text: |
          $f(x,y,z)=3\log x+2\log y+5\log z+\log(22-x-y-z)$;
      - lletra: j
        text: |
          $f(x,y,z)=x^2z+y^2z+\frac{2}{3}z^3-4x-4y-10z+1$;
      - lletra: k
        text: |
          $f(x,y,z)=\cos 2x\,\sin y+z^2$;
      - lletra: l
        text: |
          $f(x,y,z)=x^2-y^2+(z-1)^4$;
      - lletra: m
        text: |
          $f(x,y,z)=x^2+y^2+(z-1)^5$;
      - lletra: n
        text: |
          $f(x,y,z)=x+\dfrac{1+yz}{x}$.
    indicacio: null
  - num: 6
    font: null
    preambul: |
      Estudieu, en funció de $k$, el caràcter dels punts crítics de la funció $f(x,y)=\frac{1}{2}(x^2+y^2)+kxy$.
    apartats: []
    indicacio: null
  - num: 7
    font: null
    preambul: |
      Considereu la funció $f(x,y)=(y-3x^2)(y-x^2)$.
    apartats:
      - lletra: a
        text: |
          Proveu que l'origen n'és l'únic punt crític, i estudieu-ne el caràcter.
      - lletra: b
        text: |
          Proveu que la funció $\varphi=f\circ c$, on $c(t)=(at,bt)$ és una recta que passa per l'origen, té un mínim a $t=0$ independentment de la recta triada.
    indicacio: null
  - num: 8
    font: null
    preambul: |
      Trobeu i classifiqueu tots els punts crítics de les funcions següents:
    apartats:
      - lletra: a
        text: |
          $f(x,y)=(x-y)^3+(x+y)^2$;
      - lletra: b
        text: |
          $g(x,y)=x^4+x^2y^2+2xy^2+12y^2$.
    indicacio: null
  - num: 9
    font: null
    preambul: |
      Considerem la funció $f(x,y)=(x^2+y^2+2x)\,x^3$.
    apartats:
      - lletra: a
        text: |
          Dibuixeu $C_0$, la corba de nivell 0 de $f$.
      - lletra: b
        text: |
          Estudieu el signe de la funció $f$ en les diferents regions en què la corba $C_0$ divideix $\mathbb{R}^2$.
      - lletra: c
        text: |
          Useu els apartats anteriors per determinar si el punt $(0,0)$ és un extrem local de $f$.
    indicacio: null
  - num: 10
    font: null
    preambul: |
      Considereu la funció $f(x,y)=-y^4-e^{-x^2}+2y^2\sqrt{e^x+e^{-x^2}}$.
    apartats:
      - lletra: a
        text: |
          Quin és el seu domini? Hi és de classe $\mathcal{C}^\infty$?
      - lletra: b
        text: |
          Proveu que el seu únic punt crític és $(0,0)$.
      - lletra: c
        text: |
          Calculeu el polinomi de Taylor de $f$ de grau $\leqslant3$ en $(0,0)$.
      - lletra: d
        text: |
          Determineu el caràcter del punt crític de $f$.
      - lletra: e
        text: |
          Proveu que $f$ no té mínim absolut. (Indicació: podeu considerar $f(0,y)$.)
    indicacio: "Podeu considerar $f(0,y)$. (Indicació de l'apartat e.)"
  - num: 11
    font: null
    preambul: |
      Calculeu el polinomi de Taylor de grau $\leqslant3$ de la funció $f(x,y)=(x-1+\sin^2y)\log(x-y)$ en el punt $(1,0)$. És $(1,0)$ un extrem local de $f(x,y)$?
    apartats: []
    indicacio: null
  - num: 12
    font: null
    preambul: |
      Sigui $f(x,y)=-3x^2y^2+x^3y^3$.
    apartats:
      - lletra: a
        text: |
          Calculeu-ne els punts crítics.
      - lletra: b
        text: |
          Sense usar derivades segones, raoneu el caràcter dels punts crítics de $f(x,y)$ que es troben a la bola unitat $B(\mathbf{0},1)$.
    indicacio: null
  - num: 13
    font: null
    preambul: |
      Considerem la funció $f(x,y)=e^{x-y}\left(\cos(x+1)-\sin(y+1)-1\right)$ i el punt $p=(-1,-1)$.
    apartats:
      - lletra: a
        text: |
          Calculeu el polinomi de Taylor de grau $\leqslant3$ de $f$ en $p$.
      - lletra: b
        text: |
          Useu el polinomi per determinar la hessiana de $f$ en $p$.
      - lletra: c
        text: |
          És $p$ un extrem local de $f$?
    indicacio: null
  - num: 14
    font: null
    preambul: |
      Sigui $\varphi:\mathbb{R}\to\mathbb{R}$ una funció derivable i tal que $a<b$ en són els únics zeros, complint a més $\varphi'(a)>0$ i $\varphi'(b)<0$. Considerem la funció $f(x,y)=\int_x^y\varphi(t)\,dt$. Calculeu els punts crítics de $f$, discutiu-ne el caràcter i interpreteu els resultats obtinguts.
    apartats: []
    indicacio: null
  - num: 15
    font: null
    preambul: |
      Repetiu el problema anterior amb les altres tres variants possibles:
    apartats:
      - lletra: a
        text: |
          $\varphi'(a)<0$ i $\varphi'(b)>0$;
      - lletra: b
        text: |
          $\varphi'(a)>0$ i $\varphi'(b)>0$;
      - lletra: c
        text: |
          $\varphi'(a)<0$ i $\varphi'(b)<0$.
    indicacio: null
