      detall: |
        Per a tot $k\in\mathbb{R}$ és una recta, $y=(7+k-x)/5$, de pendent $-1/5$ i vector normal $(1,5)$, independent de $k$: les corbes de nivell són rectes paral·leles; $k$ només les desplaça (per exemple, tallen l'eix $x$ a $x=7+k$).
