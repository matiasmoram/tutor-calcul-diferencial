      detall: |
        Hi ha entorns oberts $U\ni a$ i $V\ni b=F(a)$ amb $F:U\to V$ bijectiva; sigui $G=F^{-1}:V\to U$ i suposem $G$ diferenciable a $b$ (punt interior de $V$). Aleshores $G(F(x))=x$ per a tot $x\in U$, és a dir $G\circ F=\mathrm{Id}$ a l'obert $U$.
