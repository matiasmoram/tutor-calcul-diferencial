# Render blueprint (https://render.com/docs/blueprint-spec): one Docker web service.
# The database is Supabase (external). `sync: false` values are asked for once, when the blueprint is first applied;
# a `sync: false` key added later must be set in the dashboard.
services:
  - type: web
    name: tutor-calcul
    runtime: docker
    # Same region as the Supabase project. Fixed at creation: changing it means a new service.
    region: frankfurt
    # Free: 512 MB, one instance, sleeps when idle. A paid plan here would upgrade the service on a blueprint sync.
    plan: free
    healthCheckPath: /health
    # Deploy a commit only once its CI checks pass.
    autoDeployTrigger: checksPass
    # Pushes touching nothing else skip the build. Keep in step with the Dockerfile's COPY lines.
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - sources/**
        - Dockerfile
        - .dockerignore
        - pyproject.toml
        - uv.lock
      ignoredPaths:
        - backend/tests/**
        - "**/*.md"
    envVars:
      - key: LLM_PROVIDER
        value: openai
      # Per-stage models for the tutor and grading stages; the others keep their defaults (stage_configs.py).
      # No global TUTOR_MODEL: it would also override the generation and verification stages.
      - key: TUTOR_MODEL_DIAGNOSIS
        value: gpt-5.6-luna
      - key: TUTOR_MODEL_REPLY
        value: gpt-5.6-luna
      - key: TUTOR_MODEL_GUARD
        value: gpt-5.6-luna
      - key: TUTOR_EFFORT_DIAGNOSIS
        value: none
      - key: TUTOR_EFFORT_REPLY
        value: none
      - key: TUTOR_EFFORT_GUARD
        value: none
      - key: TUTOR_MODEL_TRANSCRIPTION
        value: gpt-5.6-luna
      - key: TUTOR_MODEL_MISTAKES_GRADING
        value: gpt-5.6-luna
      - key: TUTOR_MODEL_QUIZ_GRADING
        value: gpt-5.6-luna
      # Who may trigger live (paid) generation; students get pre-generated content only.
      - key: TUTOR_GENERACIO
        value: professor
      - key: TUTOR_DEMO
        value: "0"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Entered by hand, not generateValue: Render generates base64, and a '+' in ?prof=<key> arrives as a space.
      - key: TUTOR_CLAU_PROFESSOR
        sync: false
