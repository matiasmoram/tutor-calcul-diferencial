    passos:
    - id: interior
      titol: Punts crítics a l'interior
      objectiu: |
        Usant l'apartat (a), trobar els punts crítics de $f$ a l'interior del quadrat i el valor de $f$ en ells.
      idea: |
        Mirar quins valors poden prendre $x+y$ i $x-y$ dins el quadrat i quins punts crítics de (a) hi cauen.
      detall: |
        Al quadrat, $x+y\in[\pi,2\pi]$ i $x-y\in[-\frac{\pi}{2},\frac{\pi}{2}]$. L'únic punt crític interior és $x+y=\frac{3\pi}{2}$, $x-y=0$: $\left(\frac{3\pi}{4},\frac{3\pi}{4}\right)$, un punt de sella amb $f=0$. Com que el quadrat és compacte, els extrems absoluts existeixen (Weierstrass) i han de ser a la frontera.
      fuites:
      - \\[dt]?frac\s*\{?\s*3\s*\\pi\s*\}?\s*\{?\s*4
      - 3\s*\\pi\s*/\s*4
      teoria:
      - T5.23
      - T2.23
    - id: costats
      titol: Els quatre costats
      objectiu: |
        Estudiar $f$ sobre cadascun dels quatre costats del quadrat.
      idea: |
        A cada costat una variable és constant: simplificar amb fórmules trigonomètriques i estudiar la monotonia de la funció d'una variable resultant.
      detall: |
        $x=\frac{\pi}{2}$: $f=\cos y+\sin y$, derivada $\cos y-\sin y<0$ a $(\frac{\pi}{2},\pi)$: decreix de $1$ a $-1$.
        $x=\pi$: $f=-\sin y-\cos y$: creix de $-1$ (a $y=\frac{\pi}{2}$) a $1$ (a $y=\pi$).
        $y=\frac{\pi}{2}$: $f=\cos x+\sin x$: decreix de $1$ a $-1$.
        $y=\pi$: $f=-\sin x-\cos x$: creix de $-1$ a $1$.
        Els extrems de cada costat són als vèrtexs: $f\left(\frac{\pi}{2},\frac{\pi}{2}\right)=f(\pi,\pi)=1$ i $f\left(\frac{\pi}{2},\pi\right)=f\left(\pi,\frac{\pi}{2}\right)=-1$.
      fuites:
      - f\s*\(\s*\\pi\s*,\s*\\pi\s*\)\s*=\s*1
      - decreix\s+de\s+\$?1
      teoria:
      - T6.1
    - id: concloure
      titol: Concloure
      objectiu: |
        Donar el màxim i el mínim absoluts i on s'assoleixen.
      idea: |
        Comparar els valors de tots els candidats.
      detall: |
        Candidats: $0$ (punt de sella interior), $1$ i $-1$ als vèrtexs. Màxim absolut $1$ en $\left(\frac{\pi}{2},\frac{\pi}{2}\right)$ i $(\pi,\pi)$; mínim absolut $-1$ en $\left(\frac{\pi}{2},\pi\right)$ i $\left(\pi,\frac{\pi}{2}\right)$.
      fuites: []
      teoria: []
    errors_comuns:
    - id: critics_fora
      descripcio: |
        Pren com a candidats punts crítics de (a) que no són dins el quadrat, com $\left(\frac{\pi}{4},\frac{\pi}{4}\right)$.
      pregunta: |
        Quins valors pot prendre $x+y$ quan $x,y\in[\frac{\pi}{2},\pi]$?
    - id: sella_com_extrem
      descripcio: |
        Inclou el punt interior com a extrem, o creu que l'absència de màxims locals interiors vol dir que no hi ha màxim absolut.
      pregunta: |
        Un punt de sella pot ser extrem absolut? I on poden ser els extrems d'una funció contínua en un compacte si no són a l'interior?
    - id: un_sol_vertex
      descripcio: |
        Troba només un dels dos punts on s'assoleix cada extrem.
      pregunta: |
        Has avaluat $f$ als quatre vèrtexs?
    nota_professor: |
      Argument directe: amb $u=x+y\in[\pi,2\pi]$ i $v=x-y\in[-\frac{\pi}{2},\frac{\pi}{2}]$, $\sin u\le0$ i $0\le\cos v\le1$, així $-1\le f\le1$, amb igualtats exactament als vèrtexs indicats.
