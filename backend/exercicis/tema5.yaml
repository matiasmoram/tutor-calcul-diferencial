      fuites:
      - (\(\s*0\s*,\s*0\s*\)|origen)\$?\s*(és|es)\s+(un\s+)?punt\s+de\s+sella
      - f\s*\(\s*x\s*,\s*0\s*\)\s*=\s*-\s*x\^\{?3
    passos:
    - id: punts_critics
      titol: Trobar els punts crítics
      objectiu: |
        Trobar els punts on s'anul·la el gradient de $f$.
      idea: |
        Calcular les derivades parcials i igualar-les a zero.
      detall: |
        $f_x=-3x^2$, $f_y=2y$; s'anul·len només a $(0,0)$.
      fuites: []
      teoria:
      - T5.22
    - id: hessiana
      titol: Hessiana i criteri
      objectiu: |
        Calcular la hessiana al punt crític i veure què en diu el criteri de condicions suficients.
      idea: |
        Avaluar les derivades segones i estudiar el signe de la forma quadràtica.
      detall: |
        $Hf(0,0)=\begin{pmatrix}0&0\\0&2\end{pmatrix}$: valors propis $0$ i $2$, semidefinida positiva i no definida. El teorema de condicions suficients no decideix (només diu que, si fos extrem, hauria de ser mínim).
      fuites:
      - semidefinida\s+positiva
      teoria:
      - T5.32
      - T5.33
      - T5.29
    - id: estudi_directe
      titol: Estudi directe
      objectiu: |
        Decidir el caràcter de l'origen sense la hessiana.
      idea: |
        Comparar $f$ amb $f(0,0)=0$ sobre alguna recta adequada que passi per l'origen.
      detall: |
        Sobre l'eix $y=0$: $f(x,0)=-x^3$, que és $>0$ per $x<0$ i $<0$ per $x>0$. En tota bola centrada a l'origen hi ha punts amb $f>0$ i amb $f<0$: l'origen és un punt de sella.
      fuites:
      - f\s*\(\s*x\s*,\s*0\s*\)\s*=\s*-\s*x\^\{?3
      teoria:
      - T5.25
    errors_comuns:
    - id: semidefinida_minim
      descripcio: |
        De la hessiana semidefinida positiva conclou que l'origen és un mínim.
      pregunta: |
        Què diu exactament el teorema de condicions suficients quan la hessiana és semidefinida però no definida? És una implicació en quin sentit?
    - id: eix_y
      descripcio: |
        Mira només la recta $x=0$, on $f=y^2\ge0$, i conclou mínim.
      pregunta: |
        Sobre quina altra recta per l'origen val la pena mirar el signe de $f$?
    nota_professor: |
      Exemple típic de hessiana degenerada que no decideix (cf. Observació 34).
  - id: t5-5f
