        Cada logaritme exigeix argument positiu. A les equacions del gradient, anomenar $w$ l'argument de l'últim logaritme i expressar $x,y,z$ en funció de $w$.
      detall: |
        Domini: $x,y,z>0$ i $w:=22-x-y-z>0$ (obert). $f_x=\dfrac3x-\dfrac1w$, $f_y=\dfrac2y-\dfrac1w$, $f_z=\dfrac5z-\dfrac1w$. Per tant $x=3w$, $y=2w$, $z=5w$, i $w=22-10w$, d'on $w=2$. Únic punt crític: $(6,4,10)$, que és al domini.
      fuites:
      - w\s*=\s*2\b
      - \(\s*6\s*,\s*4\s*,\s*10\s*\)
      teoria:
      - T5.22
    - id: hessiana
      titol: Hessiana al punt crític
      objectiu: |
        Calcular la matriu hessiana al punt crític.
      idea: |
        Les derivades creuades provenen només de l'últim logaritme; les diagonals tenen una contribució de cada logaritme.
      detall: |
        $f_{xx}=-\dfrac3{x^2}-\dfrac1{w^2}$, $f_{yy}=-\dfrac2{y^2}-\dfrac1{w^2}$, $f_{zz}=-\dfrac5{z^2}-\dfrac1{w^2}$, i totes les creuades valen $-\dfrac1{w^2}$. Amb $w=2$:
        $Hf(6,4,10)=\begin{pmatrix}-1/3&-1/4&-1/4\\-1/4&-3/8&-1/4\\-1/4&-1/4&-3/10\end{pmatrix}$.
      fuites:
      - -\s*1\s*/\s*3\s*&\s*-\s*1\s*/\s*4
      - -\s*3\s*/\s*8
      teoria:
      - T5.32
      - T5.6
    - id: classificar
      titol: Classificar
      objectiu: |
        Decidir el caràcter del punt crític.
      idea: |
        En tres variables, estudiar el signe de la forma hessiana amb els menors principals (Sylvester), o bé escriure-la com a suma de termes de signe conegut.
      detall: |
        Menors principals: $\Delta_1=-1/3<0$, $\Delta_2=\tfrac13\cdot\tfrac38-\tfrac1{16}=\tfrac1{16}>0$, $\Delta_3=-\tfrac{11}{1920}<0$: signes alternats començant per negatiu, la hessiana és definida negativa i $(6,4,10)$ és un màxim local estricte. (Alternativament: $q(\mathbf{u})=-\tfrac{u_1^2}{12}-\tfrac{u_2^2}{8}-\tfrac{u_3^2}{20}-\tfrac14(u_1+u_2+u_3)^2<0$ per $\mathbf{u}\neq\mathbf{0}$.)
        És a més màxim absolut: a qualsevol punt del domini $q_{Hf}(\mathbf{u})=-\tfrac{3u_1^2}{x^2}-\tfrac{2u_2^2}{y^2}-\tfrac{5u_3^2}{z^2}-\tfrac{(u_1+u_2+u_3)^2}{w^2}<0$, així que $f$ és còncava (estrictament) sobre el domini, que és convex; per a una funció còncava un màxim local és absolut.
      fuites:
      - \\Delta_?\{?3\}?\s*=\s*-
      - 11\s*\}?\s*\{?\s*1920
      - definida\s+negativa
      teoria:
      - T5.33
      - T5.31
    errors_comuns:
    - id: domini
      descripcio: |
        No determina el domini o accepta punts on algun logaritme no està definit.
      pregunta: |
        Per a quins punts està definida $f$? El punt que has trobat hi pertany?
    - id: creuades_zero
      descripcio: |
        Posa zeros fora de la diagonal de la hessiana, oblidant la dependència de l'últim logaritme en les tres variables.
      pregunta: |
        El terme $\log(22-x-y-z)$ depèn de quines variables? Què passa quan el derives respecte de $x$ i després de $y$?
    - id: sylvester_mal
      descripcio: |
        Aplica Sylvester exigint tots els menors negatius per a definida negativa.
      pregunta: |
        Com es relacionen els menors principals d'ordre $k$ de $M$ i de $-M$? Què et diu això sobre el patró de signes que cal esperar en el cas negatiu de Sylvester?
    nota_professor: |
      $f$ és còncava en un domini convex (suma de logaritmes de funcions afins), així que el màxim local és absolut. És el problema clàssic de maximitzar $x^3y^2z^5w$ amb $x+y+z+w=22$.
  - id: t5-5j
    apartat: j
    tipus: calcul
    enunciat: |
      $f(x,y,z)=x^2z+y^2z+\frac{2}{3}z^3-4x-4y-10z+1$;
    teoria:
    - T5.21
    - T5.22
    - T5.25
    teoria_reservada: []
    resultat:
      valor: |
        Punts crítics: $(1,1,2)$, $(-1,-1,-2)$, $(2,2,1)$, $(-2,-2,-1)$.
        $(1,1,2)$ és un mínim local estricte ($f=-53/3$); $(-1,-1,-2)$ és un màxim local estricte ($f=59/3$); $(2,2,1)$ i $(-2,-2,-1)$ són punts de sella.
      fuites:
      - \(\s*1\s*,\s*1\s*,\s*2\s*\)\$?\s*(és|es)\s+(un\s+)?m[íi]nim
      - m[íi]nim\s+(local\s+)?(estricte\s+)?(a|en)\s+\$?\s*\(\s*1\s*,\s*1\s*,\s*2
      - \(\s*-\s*1\s*,\s*-\s*1\s*,\s*-\s*2\s*\)\$?\s*(és|es)\s+(un\s+)?m[àa]xim
      - \(\s*2\s*,\s*2\s*,\s*1\s*\)\$?\s*(i|és|es)\s.{0,30}sella
    passos:
    - id: punts_critics
      titol: Trobar els punts crítics
      objectiu: |
        Trobar tots els punts on s'anul·la el gradient de $f$.
      idea: |
        De les dues primeres equacions s'aïllen $x$ i $y$ en funció de $z$; substituint a la tercera s'obté una equació biquadrada en $z$.
      detall: |
        $f_x=2xz-4$, $f_y=2yz-4$, $f_z=x^2+y^2+2z^2-10$. Cal $z\neq0$ i $x=y=2/z$. Llavors $8/z^2+2z^2=10$, és a dir $z^4-5z^2+4=0$, $z^2\in\{1,4\}$. Punts crítics: $(2,2,1)$, $(-2,-2,-1)$, $(1,1,2)$, $(-1,-1,-2)$.
      fuites:
      - z\^\{?4\}?\s*-\s*5\s*z\^\{?2
      - \(\s*2\s*,\s*2\s*,\s*1\s*\)
      teoria:
      - T5.22
    - id: hessiana
      titol: Hessiana
      objectiu: |
        Calcular la matriu hessiana i avaluar-la als punts crítics.
      idea: |
        $f$ és polinòmica; calcular les sis derivades segones independents i substituir.
      detall: |
        $Hf(x,y,z)=\begin{pmatrix}2z&0&2x\\0&2z&2y\\2x&2y&4z\end{pmatrix}$.
        $Hf(1,1,2)=\begin{pmatrix}4&0&2\\0&4&2\\2&2&8\end{pmatrix}$, $Hf(2,2,1)=\begin{pmatrix}2&0&4\\0&2&4\\4&4&4\end{pmatrix}$, i als punts oposats la hessiana canvia de signe: $Hf(-p)=-Hf(p)$.
      fuites:
      - 2\s*z\s*&\s*0\s*&\s*2\s*x
      teoria:
      - T5.32
      - T5.6
    - id: classificar
      titol: Classificar
      objectiu: |
        Decidir el caràcter de cada punt crític.
      idea: |
        Calcular els menors principals i aplicar Sylvester; quan no siguin de cap dels dos patrons, buscar dos vectors on la forma hessiana tingui signes oposats.
      detall: |
        $(1,1,2)$: $\Delta_1=4$, $\Delta_2=16$, $\Delta_3=96$, tots positius: definida positiva, mínim local estricte ($f=-53/3$).
        $(-1,-1,-2)$: $\Delta_1=-4$, $\Delta_2=16$, $\Delta_3=-96$: signes alternats, definida negativa, màxim local estricte ($f=59/3$).
        $(2,2,1)$: $\Delta_1=2$, $\Delta_2=4$, $\Delta_3=-48$. Amb $\mathbf{u}=(1,0,0)$, $q(\mathbf{u})=2>0$; amb $\mathbf{v}=(1,1,-1)$, $q(\mathbf{v})=-8<0$: indefinida, punt de sella. A $(-2,-2,-1)$ la hessiana és l'oposada, també indefinida: punt de sella.
      fuites:
      - \\Delta_?\{?3\}?\s*=\s*96
      - \\Delta_?\{?3\}?\s*=\s*-\s*48
      - q\s*\(\s*\\mathbf\{?v\}?\s*\)\s*=\s*-\s*8
      teoria:
      - T5.33
      - T5.31
      - T5.27
    errors_comuns:
    - id: z_zero
      descripcio: |
        Divideix per $z$ sense comprovar que $z\neq0$, o perd les solucions negatives de $z^2=1,4$.
      pregunta: |
        Quan aïlles $x$ en funció de $z$, què passaria si $z=0$? I quantes arrels té $z^2=4$?
    - id: sylvester_no_decideix
      descripcio: |
        Quan els menors no segueixen cap dels dos patrons de Sylvester, conclou que «el criteri no decideix» o que és semidefinida.
      pregunta: |
        Sylvester caracteritza les formes definides. Si $\det Hf\neq0$, pot la forma tenir un valor propi nul? Quines opcions queden?
    - id: signes_alternats
      descripcio: |
        Confon el patró de definida negativa amb «tots els menors negatius».
      pregunta: |
        Si $M$ és definida negativa, quin signe té el determinant d'una submatriu $2\times2$ de la diagonal?
    nota_professor: |
      $f(-p)=2-f(p)$ (la part no constant és senar), cosa que explica la simetria entre màxim i mínim i entre les dues selles.
  - id: t5-5k
    apartat: k
    tipus: calcul
    enunciat: |
      $f(x,y,z)=\cos 2x\,\sin y+z^2$;
    teoria:
    - T5.21
    - T5.22
    - T5.25
    teoria_reservada: []
    resultat:
      valor: |
        Els punts crítics tenen $z=0$ i formen dues famílies ($m,k\in\mathbb{Z}$):
        - $\left(\tfrac{m\pi}{2},\tfrac{\pi}{2}+k\pi,0\right)$: si $m+k$ és senar, mínim local estricte ($f=-1$, mínim absolut); si $m+k$ és parell, punt de sella (hessiana $\mathrm{diag}(-4,-1,2)$).
        - $\left(\tfrac{\pi}{4}+\tfrac{m\pi}{2},k\pi,0\right)$: punts de sella.
        No hi ha màxims locals.
      fuites:
      - m\s*\+\s*k\s*(és\s+|es\s+)?senar\D{0,30}m[íi]nim
      - no\s+hi\s+ha\s+m[àa]xims
    passos:
    - id: punts_critics
      titol: Trobar els punts crítics
      objectiu: |
        Trobar tots els punts on s'anul·la el gradient de $f$.
      idea: |
        La variable $z$ es desacobla. Per a les altres dues equacions, distingir quin factor de cada producte s'anul·la, tenint en compte que $\sin$ i $\cos$ d'un mateix angle no s'anul·len alhora.
      detall: |
        $f_x=-2\sin 2x\,\sin y$, $f_y=\cos 2x\,\cos y$, $f_z=2z$. Així $z=0$. Si $\sin 2x=0$, aleshores $\cos 2x=\pm1$ i cal $\cos y=0$: $x=\tfrac{m\pi}2$, $y=\tfrac\pi2+k\pi$. Si $\sin y=0$, aleshores $\cos y=\pm1$ i cal $\cos 2x=0$: $x=\tfrac\pi4+\tfrac{m\pi}2$, $y=k\pi$.
      fuites:
      - (\\[dt]?frac\s*\{?\s*\\pi\s*\}?\s*\{?\s*4\s*\}?|\\pi\s*/\s*4)\s*\+
      - x\s*=\s*(\\[dt]?frac\s*\{?\s*m\s*\\pi|m\s*\\pi\s*/\s*2)
      teoria:
      - T5.22
    - id: hessiana
      titol: Hessiana a cada família
      objectiu: |
        Calcular la hessiana i avaluar-la a cada família de punts crítics.
      idea: |
        Calcular les derivades segones i usar els valors de $\sin$ i $\cos$ coneguts a cada família (signes del tipus $(-1)^m$).
      detall: |
        $f_{xx}=-4\cos 2x\,\sin y$, $f_{xy}=-2\sin 2x\,\cos y$, $f_{yy}=-\cos 2x\,\sin y$, $f_{zz}=2$, $f_{xz}=f_{yz}=0$.
        Primera família: $\cos 2x=(-1)^m$, $\sin y=(-1)^k$, $\cos y=\sin 2x=0$, i $Hf=\mathrm{diag}\big(-4(-1)^{m+k},\,-(-1)^{m+k},\,2\big)$.
        Segona família: $\cos 2x=\sin y=0$, $\sin 2x=(-1)^m$, $\cos y=(-1)^k$, i $Hf=\begin{pmatrix}0&-2(-1)^{m+k}&0\\-2(-1)^{m+k}&0&0\\0&0&2\end{pmatrix}$.
      fuites:
      - -\s*4\s*\(\s*-\s*1\s*\)\^\{?\s*m\s*\+\s*k
      teoria:
      - T5.32
      - T5.6
    - id: classificar
      titol: Classificar
      objectiu: |
        Decidir el caràcter dels punts de cada família.
      idea: |
        Amb hessianes diagonals o gairebé diagonals, els valors propis es llegeixen directament; aplicar les condicions suficients d'extrem.
      detall: |
        Primera família amb $m+k$ senar: $Hf=\mathrm{diag}(4,1,2)$, definida positiva, mínim local estricte, $f=\cos2x\sin y=-1$; com que $f\ge -1$ a tot arreu, és mínim absolut.
        Primera família amb $m+k$ parell: $Hf=\mathrm{diag}(-4,-1,2)$, indefinida, punt de sella.
        Segona família: el bloc $\begin{pmatrix}0&\pm2\\\pm2&0\end{pmatrix}$ té valors propis $\pm2$, per tant la hessiana és indefinida: punts de sella.
        No hi ha màxims locals: $f_{zz}=2>0$ fa que cap hessiana sigui semidefinida negativa.
      fuites:
      - diag\}?\s*\(\s*4\s*,\s*1\s*,\s*2
      - diag\}?\s*\(\s*-\s*4\s*,\s*-\s*1\s*,\s*2
      teoria:
      - T5.33
      - T5.29
    errors_comuns:
    - id: perd_familia
      descripcio: |
        Troba només una de les dues famílies de punts crítics, o oblida que en són infinites.
      pregunta: |
        En l'equació $f_x=0$, quins factors poden anul·lar-se? Has combinat cada cas amb l'equació $f_y=0$?
    - id: signe_sense_paritat
      descripcio: |
        Classifica tota la primera família igual, sense distingir segons la paritat de $m+k$.
      pregunta: |
        Quant val $\cos 2x\,\sin y$ en els diferents punts de la primera família? És sempre el mateix?
    - id: maxims_inexistents
      descripcio: |
        Dona màxims locals oblidant la contribució de $z^2$.
      pregunta: |
        Si mous només la $z$ des d'un punt crític, què fa $f$?
    nota_professor: |
      Les famílies es poden presentar també com a $x\in\tfrac\pi2\mathbb{Z}$, $y\in\tfrac\pi2+\pi\mathbb{Z}$ i $x\in\tfrac\pi4+\tfrac\pi2\mathbb{Z}$, $y\in\pi\mathbb{Z}$.
  - id: t5-5l
    apartat: l
    tipus: calcul
